<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomo 1</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap");

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    margin: 0;
    background: #f7f4ee;
    color: #252525;
    font-family: "Lora", Georgia, "Times New Roman", serif;
    line-height: 1.85;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    transition: background .3s, color .3s;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background-image: url("noctilume.png");
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    opacity: 0.01;
    pointer-events: none;
    z-index: 0;
}

.contenedor {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 50px 25px 100px;
}

.encabezado {
    text-align: center;
    margin-bottom: 45px;
}

h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    font-weight: normal;
    letter-spacing: 1px;
    margin: 0;
}

.contenido {
    font-size: 18px;
    line-height: 1.85;
}

.contenido p {
    margin: 0 0 1.3em;
    text-align: justify;
    text-indent: 2em;
}

.separador {
    text-align: center;
    text-indent: 0;
    margin: 0 0 1.8em;
    font-size: 18px;
    line-height: 1.4;
}

#acceso-denegado {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f7f4ee;
    color: #252525;
    font-family: Georgia, serif;
    text-align: center;
    padding: 30px;
}

#acceso-denegado div {
    max-width: 500px;
}

.controles {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 1000;
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,.92);
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,.10);
}

.control {
    height: 36px;
    min-width: 40px;
    padding: 0 8px;
    border: 1px solid #aaa;
    border-radius: 5px;
    background: white;
    color: #333;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 14px;
}

.control:hover {
    background: #eeeeee;
}

#fuente {
    height: 36px;
    border: 1px solid #aaa;
    border-radius: 5px;
    padding: 0 8px;
    background: white;
    color: #333;
    font-size: 13px;
    cursor: pointer;
}

body.oscuro {
    background: #181818;
    color: #dddddd;
}

body.oscuro .controles {
    background: rgba(35,35,35,.95);
    border-color: #555;
}

body.oscuro .control,
body.oscuro #fuente {
    background: #303030;
    color: #eeeeee;
    border-color: #555;
}

@media (max-width: 600px) {
    .contenedor {
        padding: 30px 18px 100px;
    }

    h1 {
        font-size: 26px;
    }

    .contenido {
        font-size: 17px;
        line-height: 1.78;
    }

    .separador {
        font-size: 16px;
    }

    .controles {
        right: 10px;
        bottom: 10px;
        max-width: calc(100% - 20px);
        overflow-x: auto;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const TOKEN_CORRECTO = "7fK9xP2mQ8";

const parametros = new URLSearchParams(window.location.search);
const token = parametros.get("access");

if (token !== TOKEN_CORRECTO) {

    document.getElementById("app").innerHTML = `
        <div id="acceso-denegado">
            <div>
                <h1>Acceso denegado</h1>
                <p>Agrega la clave de acceso luego de “=” para ver.</p>
            </div>
        </div>
    `;

} else {

    document.getElementById("app").innerHTML = `

        <main class="contenedor">

            <header class="encabezado">
                <h1>Tomo 1</h1>
                <div class="subtitulo">La postura de Cárcel Escalante</div>
            </header>

            <article class="contenido" id="contenido">

                <div class="separador">
                    ━━━━━━ ◦ ❖ ◦ ━━━━━━
                </div>

                <!-- PEGA TU TEXTO AQUÍ --> <!-- NO OLVIDES PONER… --> 

<p>  antes de cada línea para hacer los espacios.
<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>   para separar escenas.
<p><span style="font-style:italic">texto</span>   para poner texto en cursiva.
<p><span style="color:#777777">texto</span></p> para poner texto en color.
<p><span style="font-style:italic; color:#777777">texto</span></p> para ambos.

            </article>

        </main>

        <div class="controles">

            <select id="fuente" onchange="cambiarFuente(this.value)">
                <option value="Lora">Lora</option>
                <option value="Georgia">Georgia</option>
                <option value="Garamond">Garamond</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Arial">Arial</option>
                <option value="Verdana">Verdana</option>
                <option value="Trebuchet MS">Trebuchet MS</option>
            </select>

            <button class="control" onclick="cambiarTamano(-1)" title="Disminuir tamaño">A−</button>

            <button class="control" onclick="cambiarTamano(1)" title="Aumentar tamaño">A+</button>

            <button class="control" onclick="modoOscuro()" title="Modo oscuro">☾</button>

        </div>
    `;
}

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

document.addEventListener("keydown", function(e) {
    if (
        (e.ctrlKey || e.metaKey) &&
        ["c", "x", "s", "u", "p"].includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});

let tamano = 18;

function cambiarFuente(fuente) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    contenido.style.fontFamily = '"' + fuente + '", serif';
    localStorage.setItem("fuenteLectura", fuente);
}

function cambiarTamano(valor) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    tamano += valor;

    if (tamano < 14) tamano = 14;
    if (tamano > 26) tamano = 26;

    contenido.style.fontSize = tamano + "px";
    localStorage.setItem("tamanoLectura", tamano);
}

function modoOscuro() {
    document.body.classList.toggle("oscuro");

    localStorage.setItem(
        "modoLectura",
        document.body.classList.contains("oscuro")
            ? "oscuro"
            : "claro"
    );
}

window.addEventListener("DOMContentLoaded", function() {

    const contenido = document.getElementById("contenido");
    const fuente = document.getElementById("fuente");

    if (!contenido || !fuente) return;

    const fuenteGuardada = localStorage.getItem("fuenteLectura");
    const tamanoGuardado = localStorage.getItem("tamanoLectura");
    const modoGuardado = localStorage.getItem("modoLectura");

    if (fuenteGuardada) {
        fuente.value = fuenteGuardada;
        cambiarFuente(fuenteGuardada);
    }

    if (tamanoGuardado) {
        tamano = parseInt(tamanoGuardado);
        contenido.style.fontSize = tamano + "px";
    }

    if (modoGuardado === "oscuro") {
        document.body.classList.add("oscuro");
    }
});

</script>

</body>
</html>

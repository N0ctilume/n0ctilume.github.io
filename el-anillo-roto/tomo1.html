<p>Después de empujarle los hombros con las palmas varias veces, Inés, al darse cuenta de que era inútil, apretó los puños y empezó a golpearle los hombros.

<p>Su afirmación de que era bastante buena golpeando probablemente no era una fanfarronada; realmente le dolía. De hecho, su puño firmemente cerrado, con el dedo medio instintivamente doblado ligeramente para duplicar su dolor, demostraba cierto talento.

<p>Él se tragó un gemido y la abrazó con más fuerza.

<p>—¡Suéltame! Sucio...

<p>—¡Inés!

<p>—¡No te atrevas a pronunciar mi nombre con esa boca asquerosa! ¡Perro en celo...!

<p>—¡Te dije que no significaba nada sino eras tú…!

<p><span style="font-style:italic">¿Así que el significado era una erección?</span> Cárcel replicó frenéticamente para sí mismo en su interior. Antes de que pudiera terminar, su boca volvió a soltar una imprudencia.

<p>—Sin ti, esto no pasaría. Es imposible. Ninguna otra mujer podría...

<p>—...

<p>—Eres la única mujer que me hace sentir así.

<p>—...

<p>—Solo tú me provocas... una erección.

<p><span style="font-style:italic">Loco... En verdad, era una erección.</span>

<p>Incluso envuelta en la voz más lírica, como si nada en el mundo pudiera ser más romántico o veraz... Ahora se resignaba a medias, observando pasivamente este espectáculo que no podía controlar en lo más mínimo.

<p>Si esto era una maldita pesadilla, deseaba despertar rápidamente. Si esto era la realidad y su cabeza estaba rota, necesitaba encontrar una poción de hace doscientos años para Inés y hacérsela beber para borrar este recuerdo.

<p>Pero, contrariamente a su desesperado deseo, Inés enterró la cabeza profundamente en su pecho y murmuró.

<p>—... Suéltame. Detente ahora.

<p>Esa voz, que murmuraba tan suavemente que los demás no podían oírla con claridad, era precisamente lo que Inés más detestaba. Sin embargo, irónicamente, oírla decir eso era bastante bonito... <span style="font-style:italic">¿Bonito?</span> Se encontró siguiéndola como si sus propios pensamientos hubieran sido hechizados sin que él se diera cuenta. Y no era cualquier mujer, era Inés. Debería sospechar de los planes que podría estar tramando.

<p>Su prometida ya no tenía seis años, sino veintitrés, y si hablamos de aspectos lindos, hacía tiempo que no era bonito, desde los seis.

<p><span style="font-style:italic">¿Pero bonito? ¿Quién?</span>

<p>—Cárcel...

<p>Su prometida, mirándolo con los ojos llenos de lágrimas, despertó extrañamente su instinto protector y, además, lo excitó aún más.

<p>—Me estás avergonzando...

<p>¿Cómo podía coexistir la sensación de tener un pájaro herido en la palma de la mano con el impulso de arrancarle la ropa a pedazos? Aunque el golpe había caído en otra parte, su pene, hinchado al máximo, le dolía. Era un dolor torpe, como el de un niño que ve el cuerpo desnudo de una mujer por primera vez. A parte del hecho que él mismo no se sintió así la primera vez que lo vió.

<p>Especialmente con Inés, tan recatada y correcta, que no revelaba ni un ápice de piel por debajo del cuello. Y, sin embargo, era precisamente esa prometida rígida y aburrida...

<p>—No te soltaré hasta que me creas.

<p>Eso era lo que estaba haciendo. La mano que le sostenía la espalda se deslizó precariamente hacia abajo hasta descansar justo encima de sus nalgas, presionando sus partes inferiores para que se unieran. Increíblemente, un sonido lánguido fluyó desde lo más profundo de la garganta de Inés.

<p>—... Entonces demuéstralo.

<p>Su rostro pálido y sencillo, manchado de lágrimas y lastimoso un momento antes, ahora esbozaba una sonrisa pícara mientras lo miraba. Sin duda, era una pesadilla. Había sido demasiado irreal, pero todo parecía tan real que lo había dejado medio dudando, medio creyendo. Pero en el momento en que la mano de Inés le agarró el miembro, se convirtió en una certeza absoluta.

<p>Era una maldita pesadilla. El sueño de un perro en celo.

<p>—Demuéstrame cuánto me deseas, Cárcel.

<p>Como era un sueño, solo quedaba despertar. Sin duda era un sueño. Una pesadilla sucia y vil... Tenía que despertar rápidamente. Inés era demasiado buena para ser objeto de delirios tan bajos. Ver los botones cuidadosamente abrochados como el hábito de una monja incluso le provocaba culpa.

<p>El matrimonio exigiría este tipo de cosas y aquel otro tipo de cosas, pero aún no. Al menos, no con Inés Valeztena. Además, Cárcel, que había vivido su vida sin saber nunca lo que significaba sentirse “inadecuado”, nunca había soñado con una mujer antes. No así.

<p>Desde luego, no así, como un hombre deficiente que sufre una inmensa frustración en la realidad...

<p>—...

<p>Ella se soltó el pelo que llevaba recogido. Cárcel conocía a Inés desde hacía mucho tiempo, pero nunca la había visto con el pelo suelto. Al ver la expresión ligeramente aturdida de Cárcel, Inés sonrió y lentamente levantó la mano hacia los botones abrochados hasta la garganta.
	
<p>Uno, dos... A medida que se desabrochaban los botones, su hermosa piel comenzaba a revelarse. Si esto no hubiera sido un sueño, los hermosos ojos de Cárcel seguramente habrían perdido la compostura y habrían parpadeado descontroladamente.

<p>Su respiración se volvió irregular. El escote visible a través del vestido blanco atrajo instantáneamente su mirada. Entonces, cuando el vestido desapareció hacia abajo con un rápido movimiento, su respiración irregular se volvió inequívocamente entrecortada.

<p>Debajo del vestido, ella no llevaba nada.

<p>—... Inés, ¿por qué... no llevas nada debajo?

<p>Las palabras que preguntaban si no llevaba nada desaparecieron en lo profundo de su garganta. Pensó que pronunciarlas podría hacer que se derrumbara sobre ella sin cuidado. Era una preocupación excesiva para alguien incapaz de mover un dedo como deseaba, pero, en realidad, era angustiante.

<p>Sus hombros trazaban curvas maravillosamente redondeadas; sus pechos, tan llenos que rebosaban al tocarlos, eran bien formados y hermosos, y se unían a una cintura esbelta. Sus caderas eran tan llenas como sus pechos, y la línea que descendía desde allí hasta sus piernas era, una vez más, hermosa.

<p>Se parecía a una mujer de una obra maestra que representaba la mitología antigua. Un desnudo deslumbrante. Su cabello negro y rizado caía libremente, su cuerpo desnudo hasta el último hilo, sin mostrar la más mínima vergüenza, su mirada fija en él como para tentarlo... todo ello solo servía para recordarle que esto no era más que un maldito sueño.

<p>—Siempre vengo a verte así...

<p>Pero el hecho de que fuera un maldito sueño no significaba que tuviera que despertar rápidamente.

<p>Al fin y al cabo, era un sueño que no hacía daño a nadie. No era doloroso, ni triste; era simplemente un sueño en el que aparecía Inés Valeztena desnuda... eso era todo. Cárcel cambió sutilmente de postura. A veces, era necesario perder el tiempo de esa manera.

<p>—Espero que pronto reconozcas este cuerpo y lo toques...

<p>—...

<p>—He esperado mucho tiempo este día, Cárcel.

<p>Sin previo aviso, ella deslizó la mano dentro de sus pantalones y extendió sus delgados dedos para agarrarle el pene. Cárcel apretó los dientes como si estuviera aguantando, y luego tiró bruscamente de su cabeza hacia atrás para besarla.

<p><span style="font-style:italic">Este sueño... no debe romperse ahora. Nunca...</span>

<p>—... ¿Hermano?

<p>Cárcel abrió los ojos de golpe. Era el techo familiar, salvo por el rostro indiferente de Miguel en el borde de su campo de visión.

<p>—... Maldita sea.

<p><span style="font-style:italic">Maldita sea, el techo. Maldita sea, Miguel...</span>

<p><span style="font-style:italic">Maldita sea, era un sueño perfecto, mierda.</span>

<p>—Me prometiste que hoy entrenaríamos al amanecer.

<p>—... Maldita sea... ¡Maldito idiota...!

<p>—¿Hermano?

<p>Mirar con ira a su hermano menor y soltar palabrotas nada más despertarse no podía parecer muy sensato. Miguel, pensando que era una prolongación de sus palabras dormidas, volvió a sacudirlo.

<p>Cárcel se estremeció al sentir el contacto, luego apartó bruscamente la mano de Miguel y se incorporó a medias.

<p>El edredón se deslizó hacia abajo, dejando al descubierto un torso musculoso. Su frente ligeramente arrugada era, huelga decirlo, de una belleza sin igual. Su complexión naturalmente alta y esbelta, moldeada por el intenso entrenamiento en la academia militar, era una obra maestra perfecta.

<p><span style="font-style:italic">Pero ¿por qué? ¿Por qué demonios, precisamente a Inés Valeztena?</span> De una manera tan patética y miserable... Cárcel, que había estado mirando fijamente su propio cuerpo, se sumió en una profunda desesperación oceánica, pero de repente vio que su parte inferior empujaba con fuerza la manta hacia arriba y contuvo la respiración.

<p>—... Lárgate.

<p>—¿Qué pasa? ¿Te volviste loco? ¿Sigues dormido?

<p>—He dicho que te largues.

<p>—¿Qué maldita pesadilla estabas teniendo?

<p>En cualquier otro día, habría descartado este fenómeno a la ligera, como si perteneciera a otra persona, pensando: “Las cosas perfectas son agotadoras cuando rebosan energía…”. Pero esta no era una mañana cualquiera.

<p>—¡Lárgate de aquí, maldición…!

<p>Él era el culpable de haber destrozado ese momento crucial del sueño, y ahora se añadía la amenaza potencial de que ese imbécil descubriera algo totalmente vergonzoso. Era como si el simple hecho de que Miguel se diera cuenta de su erección le permitiera vislumbrar algo más allá de su sucio sueño, algo que él temía.

<p>Ahuyentó a Miguel, lanzándole maldiciones que no había dirigido a su hermano menor desde la infancia. Incluso mientras lo echaba, Miguel le advirtió que pensara en las consecuencias, invocando a su padre. Pero el Duque de Escalante detestaba los chismes por encima de todo. Así que esa pequeña cosa ni siquiera merecía alterar el estado de ánimo de Cárcel.

<p>—…

<p>Sin embargo, esto no solo le estaba perturbando el ánimo, sino que lo estaba destrozando.

<p>Al retirar las sábanas, vio la punta del hilo transparente y húmedo retorcerse mientras se levantaba, burlándose de él. La sensación de aquellos dedos delgados agarrándolo perduraba, dolorosamente vívida, como si hubiera existido de verdad.

<p>Un giro cruel como el de una novela romántica de tercera categoría, un diálogo cruel y malvado...

<p>—... Inés Valeztena.

<p>Su doppelgänger se estremeció como si respondiera al nombre.

<p>Una mujer rencorosa. Una mujer extraña. Rígida, aburrida, como una monja de convento, toda de negro, con el cuerpo blanco, la cara blanca, la cara...

<p>—... Ah...

<p>En el momento en que recordó el rostro de su sueño, imaginó a Inés en la cama. Tumbada lánguidamente entre las piernas de Cárcel como una leona saciada, Inés Valeztena, con su esbelta mano agarrando su pene, lamiendo debajo del caliente miembro.

<p>Ese rostro blanco y limpio entre sus piernas.

<p>La culpa y un impulso insoportable se apoderaron de él al mismo tiempo. Antes de darse cuenta, Cárcel estaba agarrando su propio pene, acariciándolo bruscamente de arriba abajo, gimiendo en voz baja. <span style="font-style:italic">Inés Valeztena. Maldita sea, Inés Valeztena...</span>

<p>La mitad de las palabras que daban vueltas en la garganta de Cárcel eran el nombre de Inés Valeztena, la otra mitad eran maldiciones dirigidas a nadie en particular. Simplemente no podía soportarlo. En su imaginación, Inés abrió la boca y apenas tomó la punta de su miembro.

<p>Incluso la forma en que tragó saliva para contener una tos que amenazaba con brotar era adorable. Incluso forzándolo hasta el fondo de su garganta, estaba claro que no podía tomar más de la mitad. El pene, que llenaba su boca abierta, se movía superficialmente hacia adelante y hacia atrás dentro de ella.

<p>Arriba, luego abajo otra vez. La cara de Inés se movió por encima de su parte inferior del cuerpo mientras se apartaba el cabello suelto detrás de las orejas. Cárcel apretó nerviosamente los dientes, agarró el pene con fuerza y lo sacudió rápidamente.

<p>Su rostro esculpido y exquisito se difuminó con el calor y luego se contorsionó. Se corrió sobre el rostro de la Inés que no existía.

<p>Su semen salpicó obscenamente su rostro característicamente limpio y puro. Ella lamió su semen de sus labios con la lengua y se rió lascivamente.

<p>Por supuesto. Esta no era la verdadera Inés. Cárcel tragó maldiciones en lo profundo de su garganta y se levantó de la cama, huyendo de los rastros de su eyaculación.

<p>Esto era un sueño. Un sueño del que tenía que despertar. Esto no podía ser realidad. Masturbarse pensando en Inés.

<p>Atreverse a imaginar tal cosa en el rostro de Inés.

<p>Ansioso, agarró su bata, se la puso, llamó a un sirviente que pasaba por allí para que limpiara la cama y ordenó que le prepararan un baño.

<p>La culpa lo invadió como una ola, sustituyendo al fugaz placer. Pero eso también fue fugaz.

<p><span style="color:#777777">—Así que no quiero malgastar mi energía en un hombre como tú, al que ni siquiera le gusto.</span>

<p>Una mujer extraña y rencorosa. Una mujer que finge ser recatada, pero que hace lo que le place. A pesar de haberlo amado tan intensamente, ahora que ya no lo ama, le da igual que él salga y muera, aunque, por supuesto, ella no lo había dicho así. Ella había dicho que, como ya no lo amaba, no había necesidad de interrogarlo, ni de estar celosa, ni de querer matarlo.

<p>—... Seguro que no.

<p>¿Podría ser que ella quisiera ser interrogada? Cárcel se sumergió en el agua fría y miró fijamente a la pared. Seguro que no. Qué pensamiento tan absurdo. Pero entonces recordó las palabras presumidas de su primo Óscar cuando eran niños: “Los sueños son manifestaciones del deseo. Eres solo un niño, así que aún no lo entiendes…”. Si ese fuera realmente el caso...

<p>Como una alucinación, la imagen de Inés sentada frente a él en la bañera pasó como un destello ante sus ojos. Cárcel se tragó otra dura maldición y golpeó con la mano la superficie del agua.

<p>Sin embargo, como burlándose de sus esfuerzos, el fantasma de Inés permaneció sentado exactamente donde estaba.

<p>Sus suaves pies descansaban sobre sus muslos, su cabeza se apoyaba perezosamente contra el borde de la bañera. Era una imagen que le hacía querer agarrarla y atraerla hacia él.

<p>Si tan solo pudiera despeinar ese rostro tan pulcro, hacer que esos labios recatados gritaran con cada caricia de su mano... Como si sintiera su fugaz impulso, la aparición se desvaneció sin dejar rastro.

<p>Cárcel volvió a mirar con ira la inocente pared, luego se levantó de un salto, se echó agua fresca varias veces y salió de la bañera.

<p>—¡Maldita sea, maldita sea...!

<p>Realmente tenía que salir. Ver gente le vendría bien. Necesitaba su rutina diaria. Sin duda, sus vacaciones de verano habían sido demasiado largas. Sin duda, el aburrimiento lo había vuelto loco...

<p>Si veía el cielo, sentía la brisa y tenía pensamientos humanos, esas delirantes fantasías diabólicas no tendrían ninguna oportunidad.

<p>Y en cuanto a su prometida, que no era especialmente guapa ni cariñosa, solo le complicaba la vida y ahora ni siquiera le quería... Bueno…

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—...Si a ella no le importa, a mí tampoco me importa. Me dijo que viviera como quisiera, así que sí, viviré como quiera. ¿No? Ahora puedo comportarme abiertamente como un perro... ¿Por qué? Porque me da igual lo que diga mi prometida. Qué liberador. Debe de ser el sueño de todo hombre.

<p>—...

<p>—¿No le importa lo que haga? Pues por mí está bien, no me importa. Es cómodo y bueno. Me parece bien...

<p>—Capitán Escalante. ¿Se da cuenta de que lleva repitiendo lo mismo desde hace un rato?

<p>Era la quinta vez que Cárcel pronunciaba “No me importa”

<p>José Almenara, tercer hijo del Conde Almenara y su leal ayudante de campo, suspiró y bajó su rifle de caza. Simplemente no podía concentrarse.

<p>Su superior, normalmente taciturno y brusco, llevaba repitiendo la misma frase desde esa mañana y estaba inusualmente hablador. Era como si de repente hubiera tomado la medicina equivocada. En este hermoso día festivo, ¿qué desgracia lo había obligado a salir...?

<p>Dadas las circunstancias, era cierto que parecía un poco más fácil de manejar.

<p>—¿Yo?

<p>—Sí.

<p>—¿Qué?

<p>—El asunto de la prometida Valeztena.

<p>A diferencia de José, que luchaba por concentrarse en la caza, Cárcel, que acababa de levantar su rifle de caza, no respondió.

<p>Momentos después, acertó fácilmente a un pájaro que volaba bajo sobre las copas de los árboles.

<p>Mirando fijamente el humo acre que se elevaba del cañón, Cárcel se volvió hacia su lugarteniente y le dijo fríamente.

<p>—¿Ni siquiera sabes disparar correctamente y te atreves a criticar?

<p>—... Mis disculpas. Pero en serio.

<p>—Dices que soy aburrido por hablar de lo mismo, ¿cierto?

<p>—No. Es interesante. Muy interesante.

<p>José negó enérgicamente con su enorme mano, parecida a la de un oso. Su gran corpulencia hacía que incluso ese gesto resultara torpe.

<p>Cárcel frunció el ceño.

<p>—¿Soy un payaso? ¿Un juguete? ¿Crees que hablo para entretenerte? Almenara, ¿quién eres tú para juzgar si soy entretenido o no? ¿Es esa la ley militar que conoces? ¿Engañar a tu superior? ¿Quieres que te juzguen en un consejo de guerra?

<p>—No, quiero decir...

<p>—¿Y qué? Cuando tu superior habla, limítate a escuchar.

<p>Su segundo al mando era tímido, a pesar de su tamaño. Si Cárcel era grande y robusto, José no solo era grande, sino enorme, pero su espíritu no lo era, y siempre era así.

<p>Si se sentía un poco relajado, inconscientemente se desplomaba como un perezoso, y cuando recuperaba el sentido, huía como un conejo.

<p>José asintió con la cabeza y apretó los labios como si fuera a permanecer callado durante un rato, pero el breve silencio debió de parecerle una tortura, porque volvió a abrir la boca con urgencia.

<p>—Pero, señor. Es la primera vez que lo veo tan hablador. Debe estar realmente feliz por lo que dijo...

<p>—¿Qué quieres decir con “feliz”?

<p>Claramente había metido la pata.

<p>Cárcel no parecía estar para nada feliz. Algo inusual, teniendo en cuenta que había estado repitiendo “por mi está bien” una y otra vez.

<p>José dudó antes de hablar.

<p>—Este...

<p>—Dilo.

<p>—No, siempre... en general es bastante callado, quiero decir.

<p>—...

<p>—Tampoco ha hablado mucho de la señorita Valeztena.

<p>Cárcel, que lo había estado mirando fijamente, de repente apartó la mirada lentamente.

<p>—Yo… yo lo envidio.

<p>—¿Qué?

<p>—¿No es ese el sueño de todo hombre?

<p>—¿Qué exactamente?

<p>—Una esposa que no ate a su marido.

<p>—...Todavía no es mi esposa.

<p>—Claro. Por supuesto. Aún es un hombre libre…

<p>José asintió enérgicamente, como si intentara redimirse.

<p>—Me voy a comprometer pronto, ¿sabe? Medio año después, pasaremos directamente al matrimonio. Ahora empiezo a darme cuenta y me da miedo. Una vez casado, viviré bajo la atenta mirada de mi esposa durante el resto de mi vida…

<p>—¿Qué habría de vigilar cuando ninguna mujer quiere conocerte? Muestra agradecimiento eterno a tu prometida. Fue ella quien te acogió, inútil.

<p>—Bueno, eso es cierto, pero el matrimonio es otra cosa, y la libertad de un hombre es…

<p>—Por lo que dices, eres un completo pedazo de mierda.

<p>—¿Perdón?

<p>El rostro de José palideció ante la repentina y mordaz reprimenda.

<p>—¿Estarás casado y aún así piensas en buscar la libertad para huir y hacer lo que te plazca?

<p>—No, quiero decir que envidio su matrimonio libre, Capitán. Su esposa, no, la señorita Valeztena, le ha prometido una benevolente negligencia, ¿no es así?

<p>—¿Así que me ves como un pedazo de basura como tú?

<p>—¿Perdón?

<p>—¿Que repudiaría sin vergüenza los votos matrimoniales en la iglesia y luego dejaría a mi esposa para ver a otras mujeres? ¿Que iría por ahí engendrando bastardos a diestra y siniestra?

<p>Era cierto que había visto a su superior como un trapo sin valor, pero estaba genuinamente nervioso.

<p>En otro tiempo había sido el sueño de todo hombre…

<p>No, ¿y no era él precisamente el tipo de persona capaz de hacer esas cosas? Sin embargo, temiendo que sus pensamientos se reflejaran en su rostro, José negó enérgicamente con la cabeza y dijo:

<p>—Por supuesto, usted no lo haría, pero dado que la señorita Valeztena…

<p>—¿Soy el perro de Valeztena? Si esa chica me dijera que me fuera y me apareara, ¿iría y lo haría?

<p>—No, claro que no. A alguien que pronto será el Duque Escalante…

<p>—¿Por quién me tomas?

<p><span style="font-style:italic">Por un trapo, naturalmente.</span> Pero José tartamudeó, sorprendido por la inesperada sinceridad de su disoluto superior.

<p>—Aun así, nunca se sabe cómo pueden acabar las cosas... Ella ciertamente no parece una mujer corriente. La consideración de la señorita Valeztena, que una vez le ofreció la posibilidad de vivir como quisiera, su franqueza, su consideración hacia su marido... Qué inmensa fortuna es esa…

<p>—Esa mujer no me tiene consideración.

<p>—¿Perdón?

<p>—Ahora le importo un comino.

<p>—...

<p>—Así que ahora da igual lo que haga.

<p>¿No debería ir acompañada la frase “da igual lo que haga” de una sonrisa de satisfacción? Teniendo en cuenta la frecuencia con la que había pronunciado palabras como “por mi bien”, “no me importa” o “eso es cómodo”

<p>Pero Cárcel no parecía estar nada bien. Pronto murmuró una maldición en voz baja. Su oficial superior maldecía con tanta frecuencia como lo había hecho durante el entrenamiento de cadetes.

<p>¿Pero era simplemente que se había vuelto más hablador? Había soltado en un solo día los insultos que le había guardado a su ayudante durante todo un año. ¿Por qué hacía cosas que nunca solía hacer? ¿Qué respuesta podía haber para eso?

<p>—Simplemente pensé que estaría feliz por vivir de forma imprudente a partir de ahora…

<p>Como si percibiera la falta de respeto de su ayudante, Cárcel golpeó con su rifle el pecho de José con un ruido sordo.

<p>Una orden severa cayó sobre José, que la recibió con sorpresa.

<p>—Trae ese pájaro en un minuto.

<p>—¿Eh?

<p>—Y ni se te ocurra volver hasta que hayan diez más aquí.

<p>—...

<p>—He informado al Coronel Barca de que prepararás suficiente para el banquete. Sabes lo que pasa si decepcionas al abuelo, ¿verdad?

<p>—...

<p>Cárcel sonrió con su habitual expresión tranquila y le dio una palmada en el hombro al ayudante para animarlo. El hecho de que José Almenara fuera un desastre con el tiro era de sobra conocido desde que casi no se gradúa en la academia, pero a sus superiores no parecía importarles lo más mínimo.

<p>—Hazlo bien.

<p>—...

<p>—Hazlo bien.

<p>La última palmada en el hombro de su superior tenía un claro tono malicioso. <span style="font-style:italic">¿Qué demonios he hecho mal...?</span> Otro día más transcurrió para el injustamente tratado tercer hijo de la familia Almenara.

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—Esta licencia ha sido bastante larga, Capitán.

<p>—¿Y no le gusta?

<p>—En absoluto… Me ha encantado verlo durante todo el verano. Aunque solo fuera desde lejos, los recuerdos que me dejó el verano pasado... Ah, hmph…

<p>Agnes gimió en el instante en que sus labios tocaron su mandíbula. Fue una reacción rápida y sensible, en contradicción con el casto nombre de una santa.

<p>La mujer, ya excitada con solo ver su rostro, parecía necesitar poco juego previo y lo atrajo hacia ella por la cintura. Las insinuaciones de una mujer tan agresiva, progresista e impaciente no le resultaban del todo desconocidas a Cárcel, pero de alguna manera…

<p>—... Señora Piante, un momento.

<p>—Ya estoy mojada. ¡Llevo lista desde hace mucho tiempo...! ¡Lord Escalante, ah... ah...!

<p>Cárcel ya se había apartado, pero ella frotaba su bajo vientre contra la ingle de él, aumentando su propia excitación. Era como si le estuviera instando a que se diera prisa y se lo sacara.

<p>Tan abrumada por la excitación, no se dio cuenta de que él, en realidad, no estaba excitado en absoluto.

<p>—Señora, un momento, aléjese de mí.

<p>—Bah, tonterías. ¿Cómo podría hacer algo así? Ah... Su uniforme realmente vuelve loca a una mujer... Solo con mirarlo me mojo ahí abajo.

<p>A pesar de su susurro lascivo, destinado a excitar instantáneamente a un hombre, la parte inferior de Cárcel permaneció tan distante como la de un monje.

<p><span style="font-style:italic">¿Cómo es eso posible?</span>

<p>—¿Cómo lo hizo Dios tan perfecto? ¿Por qué hasta tal punto...? Envidio a su prometida.

<p>Incluso la palabra “prometida”, esa sola y breve palabra, hizo que el miembro del monje se convirtiera en piedra. Cárcel sentía ahora que su virilidad era como un bloque de piedra que no tenía nada que ver con él. Un bloque de piedra sin vida y sin instinto que colgaba torpemente entre sus piernas.

<p><span style="font-style:italic">¿Impotente a esta edad? Absolutamente ridículo...</span> Abrumado por una extraña sensación de crisis, intentó apartar a la mujer, pero su intensa voluntad no era fácil de ignorar. Cada vez que Cárcel la empujaba, ella lo esquivaba hábilmente, acurrucándose en su abrazo mientras Agnes murmuraba, con voz herida.

<p>—Cada vez que veo a la señorita Valeztena, la envidio tanto que no puedo soportarlo... ¿Lo sabe? Es porque es demasiado perfecto. Todo el mundo sabe que no ama a su prometida... pero…

<p>—...

<p>—Aun así, al final, seguirá siendo el hombre de la señorita Valeztena. Al menos, sobre el papel.

<p><span style="font-style:italic">Al menos, sobre el papel.</span>

<p>Esas palabras, que antes veía como un yugo que soportar de por vida, un grillete, una esclavitud, ya no le molestaban. Lo que importaba ahora era…

<p>—Pero esta noche es mía, ¿no?

<p>—Si no fuera por usted, esto no habría pasado. Es imposible. Ninguna otra mujer…

<p>—Lo echaba muchísimo de menos. Recordar una sola noche con usted hacía que acostarme con hombres normales fuera demasiado doloroso... Si no lo hubiera conocido desde el principio, habría vivido sin darme cuenta de lo feos que son realmente los hombres normales de Ortega.

<p>—Usted es la única mujer que me hace sentir así.

<p>—Solo usted me excita así. Por mucho que otros hombres intenten imaginarse que son usted, su rostro, su fuerza, su cuerpo perfecto, ah…

<p>—Solo usted me provoca... una erección.

<p>Al darse cuenta de la causa de este extraño fenómeno, Cárcel tensó el rostro. Miró fijamente su propio miembro, que se negaba a levantarse como una piedra a pesar del toque de Agnes.

<p>¿No era solo una tontería salida de un sueño?

<p>Era el sueño del perro en celo, así que era charla de perro. ¿Las personas siquiera se dan cuenta de las tonterías que se balbucean en sueños? Por supuesto que no. Ni siquiera sabían que eran ilusiones, así que ¿por qué iban a preocuparse...?

<p>Le entraron ganas de soltar una carcajada hueca. Esas cosas no significaban nada, se repitió a sí mismo, mirando hacia abajo. Las palabras pronunciadas en sueños no tenían ningún poder.

<p>Sin embargo, su virilidad no daba señales de tener planes para un futuro próximo.

<p>—...¿Se dan cuenta de lo horribles que son? Lord Escalante... En verdad, es demasiado perfecto. Una vez que regrese a la costa de Calstera, Mendoza seguramente estará oscura incluso cuando brille el sol. Es la luz en la oscuridad, el sol de Ortega. Ah, regrese... Para aquellas que se conforman con contemplarlo, es una desgracia demasiado grande…

<p>Su verdadera desgracia estaba en otra parte.

<p>Esto era una maldición. Sin duda, era una maldición.

<p>Cárcel la apartó apresuradamente y comenzó a caminar como si huyera.

<p>—¿Lord Escalante?

<p>—Lo siento.

<p>—¡Capitán Escalante!

<p>—Eso es todo por hoy, disculpe.

<p>—¡¿Está tratando de excitarme más?!

<p>—...

<p>—¡Perfecto! ¡Lo esperaré! ¡Aquí mismo!

<p>Ignoró el grito desesperado de la mujer y desapareció por el pasillo.

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p><span style="font-style:italic">Después del matrimonio, no hay otra opción. No hay otra mujer más que Inés Valeztena. Así que no soy... No soy impotente. Esto no es impotencia…</span>

<p>Lo repitió innumerables veces, pero la confusión no desaparecía. Cárcel se acarició nerviosamente la cara.

<p>Habían pasado tres días desde que las citas clandestinas que había elegido como acto de resistencia contra Inés, que seguía apareciendo en sus sueños, le habían llevado a repetidos fracasos.

<p>La razón por la que no se había desesperado por completo a pesar de estos fracasos era que se excitaba con notable facilidad con una ilusión que ni siquiera existía.

<p>Soñaba con Inés Valeztena todas las noches. Y a veces, el simple hecho de recordar ese sueño era suficiente para excitarlo.

<p>Como ahora.

<p>Cárcel miró su parte inferior, excitado de nuevo como un perro que responde a una señal. Así que, sin duda, esto no era algo que un impotente pudiera tener.

<p>Pero estaba claro que algo andaba mal.

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>Se sentía como si estuviera bajo una maldición. Sin embargo, en realidad nadie lo había maldecido, así que Cárcel se limitaba a contar con impaciencia los días que le quedaban de vacaciones.

<p>Si acaso alguien lo hubiera maldecido, sería él mismo, por decir esas extrañas y absurdas mentiras en sus sueños. No había nadie a quien culpar, y la posibilidad de que la maldición se rompiera se hacía cada vez más remota.

<p>Cárcel ya no intentaba esos encuentros secretos sin sentido. No era tanto que hubiera perdido la voluntad de resistirse a la Inés de sus sueños, sino que había llegado a evaluar de forma realista el daño que eso causaría a su propia reputación.

<p>Tres fracasos ya eran peligrosamente suficientes. Ahora, el pretexto para todo eso parecía ser que “no había necesidad, porque él ya estaba demasiado seguro de sí mismo como para tener la necesidad de hacer algo tan estúpido”.

<p>La esperanzadora idea de que volver a la costa de Calstera haría que todo pareciera como si nunca hubiera sucedido, junto con el productivo deseo de que la distancia física con Inés Valeztena restaurara naturalmente algo de cordura a su mente trastornada, llenaban los pensamientos de Cárcel.

<p><span style="font-style:italic">… Debo alejarme de Mendoza lo antes posible.</span>

<p>Si las cosas seguían así, temía que algún día se encontrara arrodillado en el salón de los Valeztena, suplicando a su prometida, que parecía un cuervo. “Sé que es imprudente y grosero antes del matrimonio, pero solo una vez, si pudiera estar contigo”... El mero pensamiento apagó su ardor.

<p>Sin embargo, por otro lado, no podía evitar sentir que si ella simplemente asintiera con la cabeza, podría llegar a suplicarle.

<p>Cárcel suspiró irritado, mirando el asiento vacío de Inés. La invitación al concierto que les había enviado la familia del Marqués Vicente había terminado, como de costumbre, con la mitad de las respuestas rechazadas.

<p>Él asistiría, su prometida no. Una conclusión natural.

<p>Desde pequeña, ella solo había actuado por estricta necesidad. Los compromisos sociales parecían aburrirla mortalmente. No se movía a menos que la convocara el Palacio Imperial, e incluso entonces, sus ocasionales negativas ya eran notorias.

<p>Todo el mundo cotilleaba con entusiasmo: “¡Fíjate qué grosería!”, pero aun así la invitaban porque su rara asistencia elevaba el prestigio del evento.

<p>Y como ella no había cumplido las expectativas del Marqués Vicente, él tuvo hoy que volver a inventarse excusas, inventando razones falsas para las circunstancias desconocidas de Inés.

<p>Aun así, no pasaba nada. Era mejor que soportar la tortura de estar al lado de Inés.

<p>¿Por qué la cabeza y la parte inferior del cuerpo de un hombre tienen que estar tan desconectadas?

<p>Su cabeza le advertía que Inés Valeztena nunca lo aceptaría a menos que estuviera loca, rogándole que no se volviera más loco de lo que ya estaba. Sin embargo, su cuerpo estaba atormentado por el impulso de correr directamente hacia Valeztena, de rasgar cada pedazo del recatado vestido de su prometida. Quería ver ese rostro pulcro completamente despeinado. Quería devorar los labios que afirmaban no gustarle. Quería confirmar la desnudez de sus sueños...

<p><span style="font-style:italic">…Esto no es algo normal, esto es peligroso.</span>

<p>Peligrosísimo. Se encontraba en una situación peligrosa en más de un sentido. Si no hubiera estado en medio de renunciar a sus obligaciones menores como futuro Duque, habría regresado hacía tiempo a Calstera y habría enterrado la cabeza en su guarnición.

<p>Cárcel apretó los dientes y miró fijamente al piano que tocaba el futuro Marqués Vicente, quien, acompañado por un par de excelentes músicos, solo conseguía que su actuación pareciera ordinaria.

<p><span style="font-style:italic">No debería haber venido aquí en primer lugar.</span> Solo ver el asiento vacío de Inés amenazaba con reavivar esas sucias fantasías.

<p>Como arrodillarse a sus pies mientras ella se sentaba elegantemente apreciando la música, levantar su vestido para enterrar su rostro entre sus piernas... acariciar sus muslos como un perro, suplicando. Solo una vez...

<p><span style="font-style:italic">... Maldita sea, ¿por qué estoy suplicando otra vez? No soy un mendigo, por el amor de Dios...</span>

<p>Cárcel gimió exasperado, presionando la frente contra la palma de la mano mientras los pensamientos, ahora completamente inmersos en fantasías obscenas, invadían su mente.

<p>Bien, tenía que volver a pensar con claridad.

<p>Su noche de bodas llegaría inevitablemente algún día. Y ese día no estaba lejos.

<p>Y se verían obligados a compartir la cama para toda la vida. Al fin y al cabo, así era como vivían todas las parejas Escalante, aunque no se amaran.

<p>Dado este perfecto futuro... no, bueno, no, simplemente inevitable, <span style="font-style:italic">¿realmente era necesario rogarle que compartiera su cama solo una vez?</span>

<p>Se obligó a pensar con audacia.

<p>En primer lugar, parecía totalmente patético. En segundo lugar, ¿él? ¿a Inés? Seguía siendo una imagen absurda. En tercer lugar, le gustara o no a Inés Valeztena, tendría que acostarse con él de todos modos. De por vida. Hasta la muerte. Hasta la saciedad.

<p>Contrariamente a su visión de un futuro monacal, que había mantenido durante mucho tiempo, ahora no le parecía tan malo. Y ahí era precisamente donde el orgullo de Cárcel se sentía herido.

<p>En última instancia, por mucho que intentara controlarse racionalmente, su deseo por Inés seguía siendo tan irreparable como una parte inferior del cuerpo rota. Simplemente no podía aceptarlo. ¿Por qué él, de todos los hombres, por qué precisamente él...?

<p>—Lo siento, llegué tarde.

<p>Cárcel se tensó y giró la cabeza para mirar el asiento junto al suyo al oír su voz, que parecía casi demasiado suave para ser real.

<p>—Intenté llegar a tiempo, pero Luciano...

<p>Inés, interpretando aparentemente el hecho de que todo el mundo la miraba en lugar de prestar atención a la representación, se limitó a apretar los labios.

<p>Pero Cárcel no podía cerrar los labios, ligeramente entreabiertos, y la miraba fijamente, con la mirada perdida.

<p>Su corazón latía con fuerza, como si se le hubiera roto. Sin duda, ahora era incapaz de distinguir la realidad, abrumado por la lujuria.

<p>Era la lujuria la que hacía que su corazón se acelerara.

<p>Cárcel, nervioso, apartó bruscamente la mirada de su rostro. Palideció al recordar cómo había imaginado enterrar la cabeza debajo de su vestido con solo ver el dobladillo.

<p>En ese instante, la mano de Inés empujó suavemente su cara para que la mirara. <span style="font-style:italic">Maldita sea, otra vez esta mano... ¿por qué ni siquiera lleva guantes...?</span>

<p>—... ¿Por qué viniste?

<p>Preguntó Cárcel en un susurro, con la mirada fija al frente. Ella sacó su abanico y lo agitó, respondiendo en un tono igualmente susurrante.

<p>—Porque Su Excelencia vendría.

<p>—¿Qué demonios...? Maldita sea, olvídalo.

<p>Parecía un sueño, pero no lo era. La sensación de unas uñas cortas clavándose en la carne de su puño fuertemente cerrado era prueba suficiente.

<p>Prefería no volver a ver a Inés hasta que terminaran sus vacaciones, pero si las circunstancias le obligaban a encontrarse con ella, esperaba una cosa: que la realidad fuera diferente del sueño.

<p>La verdad era que la Inés de sus sueños era tan idealizada, tan lasciva y vulgar, tan seductoramente exagerada, que encontrarse con la Inés real le llevaría a una profunda decepción y a una pérdida permanente del deseo.

<p>Bueno, naturalmente, uno debe sentir un deseo razonable en el dormitorio para producir un heredero... pero ¿no se podría simplemente mantener un nivel razonable de decoro? En todo.

<p>—Su Excelencia, estamos en público, por favor, absténgase de tal comportamiento y mantenga su dignidad.

<p>Sí, dignidad. La misma dignidad que Inés le había inculcado desde la infancia.

<p>Cárcel nunca había experimentado días tan consumidos por el deseo. Había vivido sin conocer el arrepentimiento por nada, sin hambre. Porque todo lo que deseaba se le daba antes incluso de pedirlo. Y cualquier mujer que él deseaba, ella lo deseaba primero.

<p>En aquellos días tan protegidos, no había experiencias particularmente inolvidables, ni mujeres. No había razón para entregar su corazón a una mujer con la que no se casaría, para sentir amor. Contrariamente al duro juicio de Óscar, había sido bastante racional desde la infancia. Así que fue una suerte que la primera protagonista de su vulgar sueño fuera la mujer con la que acabaría casándose.

<p>Sin embargo, el mero hecho de haberse dejado llevar tanto, la perspectiva de un futuro en el que no solo conocería a su esposa y viviría fielmente, sino que tendría que decir: “No me excitan otras mujeres, así que no tengo más remedio que vivir así”, todo ello le irritaba.

<p>En esencia, se trataba de una cuestión de elección y capacidad.

<p>Podía hacerlo fácilmente —biológicamente, podía acostarse con otras mujeres sin problema—, pero la voluntad de abstenerse, la moralidad, la confianza, el decoro propio de un noble de alto rango...

<p>—Siento lo del otro día. No sé por qué, pero parecía usted un poco sorprendido...

<p><span style="font-style:italic">Ah, ¿un hombre que ni siquiera te gusta? ¿Sorprendido...? ¿Por qué iba a estarlo?</span> Se obligó a descartar las preguntas sórdidas y totalmente frívolas que le vinieron a la mente al instante.

<p>Entonces, no se le ocurrió ninguna respuesta adecuada. Mientras Cárcel miraba con ira a los músicos que tenía delante, Inés volvió a hablar en voz baja.

<p>—Así que pensé que debía verlo al menos una vez antes de que terminara su descanso. Por si acaso hubiera algún malentendido.

<p>Ella simplemente había dicho que no le gustaba. Que no valía la pena el esfuerzo. Que aunque la traicionara, no merecía la pena matarlo... ¿Había algo que malinterpretar aquí?

<p>Cárcel respondió, aparentemente impasible.

<p>—Podríamos vernos en cualquier momento, no solo en un lugar como este.

<p>—No hay necesidad de crear una ocasión especial solo para vernos.

<p>—...

<p>De alguna manera, sintió como si le hubieran vuelto a golpear en la cabeza. Esta vez con algo pesado y metálico.

<p>—...Ah, no tenemos ese tipo de relación, ¿verdad?

<p>—No, no es que haya ningún problema grave... ¿Quizás he vuelto a ofender sus sentimientos?

<p>—¿Por qué vuelves a usar “Su Señoría”?

<p>—¿Lo llamo Capitán Escalante?

<p>—El lenguaje formal es incómodo. Es repugnante, no lo hagas. Solo hace que parezca que soy el único que está siendo grosero.

<p>—¿Por qué te comportas así?

<p>—Esta vez estás siendo bastante obediente.

<p>Sin responder a su pregunta, dijo esto, lo que hizo que Inés frunciera el ceño.

<p>—¿Por qué eres tan terco?

<p>No le resultaba especialmente difícil dejar de imaginar su cuerpo desnudo. No desde aquella sensación de haber recibido un golpe en la cabeza.

<p>Estaba seguro de haber pensado eso.

<p>—¿Escalante?

<p>Inés inclinó la cabeza hacia delante, como si estuviera estudiando el rostro de Cárcel. Su cara se detuvo a solo unos centímetros de distancia. Sin previo aviso.

<p>En ese instante, Cárcel contuvo el aliento.

<p>Ella parecía más hermosa que en cualquier sueño.

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—Has estado muy extraño desde hace un rato, Escalante.

<p>Comentó Inés, escrutando su rostro con atención. Cárcel, que había estado mirando fijamente su pecho sin darse cuenta, logró apartar la mirada.

<p>Mientras atravesaban la carretera principal llena de carruajes al atardecer, el carruaje de la familia Escalante también traqueteaba violentamente por el camino lleno de baches y desigual, salpicado en algunos lugares por el aguacero.

<p>Sabía que en una carretera tan concurrida, independientemente de la habilidad del cochero, era imposible evitarlo, pero en circunstancias normales, habría lanzado duras reprimendas a la nuca del cochero.

<p>Sin embargo, cada vez que el carruaje daba una sacudida, haciendo que el esbelto cuerpo de Inés se hundiera y luego rebotara ligeramente hacia arriba, Cárcel no podía quitarse de la cabeza pensamientos siniestros.

<p>Ese cuerpo, que una vez se había subido a su regazo en un sueño, balanceándose mientras él empujaba con fuerza y rapidez, esos pechos blancos ondulando ante sus ojos... se negaban a desaparecer, atormentándolo sin descanso... Un demonio. Sin duda, estaba poseído por un demonio.

<p>Estar así incluso con la verdadera Inés delante de él. Haber llegado tan lejos... Se encontró deseando aplastar al hombre, ahora pesado por el deseo, hasta convertirlo en piedra.

<p>Mientras tanto, Inés, que había estado esperando una respuesta, volvió a llamar a Cárcel.

<p>—¿Escalante?
	
<p>Esa voz, ajena a todo; ese rostro, ajeno a todo... Su culpa no hizo más que multiplicarse.

<p>Cárcel se acarició nerviosamente el rostro pálido y ceniciento, se restregó la cara y luego apretó los dientes y fijó la mirada en la ventana.

<p>—... Nada. No es nada.

<p>No era un adolescente cachondo desesperado por sexo, ni un pervertido que pensaba en ese acto todo el día... ¿De verdad no lo era? Cárcel reflexionó tranquilamente sobre sí mismo.

<p>Su prometida, con quien ni siquiera había compartido su noche de bodas, sufría toda depravación imaginable en sus sueños, y ahora, en cuanto abría los ojos, se masturbaba mientras recordaba a Inés de sus sueños.

<p>Era un pervertido, consumido por la incapacidad de actuar. Un pervertido que no pensaba en otra cosa en todo el día... La desesperación lo invadió como un maremoto.

<p>Era la primera vez que sentía una miseria semejante, y su yo desprevenido yacía destrozado. ¿Era así cómo se sentía vivir toda la vida como el magnate más grande del imperio, sólo para caer de la noche a la mañana y convertirse en un mendigo vagando por las calles?

<p>Cárcel puso los ojos en blanco con ansiedad, luego agarró nerviosamente un cojín de terciopelo que había cerca y se lo colocó en el regazo. Luego, agarrándolo con tanta fuerza que la tela de terciopelo se arrugó, solo lo soltó cuando captó la extraña mirada de Inés.

<p>Esta vez, fingió indiferencia y le preguntó a su vez.

<p>—¿Qué?

<p>—Nada... no es nada.

<p>Inés murmuró, algo inquieta. Un repentino escalofrío le recorrió el cuello ante la fugaz sospecha de que tal vez ella se había dado cuenta.

<p>No, eso no podía ser. Inés Valeztena no podía entender las relaciones entre hombres y mujeres. Una mujer que detestaba a la gente y despreciaba los asuntos humanos, ¿qué podía saber ella de los deseos de un hombre? Tal vez era algo que nunca se le había pasado por la cabeza en toda su vida...

<p>Aun así, era una tortura realmente insoportable. Ser descubierto en tal estado por nada menos que Inés de Valeztena no sería diferente a ser enterrado vivo.

<p>Cárcel ignoró por completo los raros intentos de conversación que Inés había hecho varias veces, esperando con impaciencia a que el paisaje fuera de la ventana cambiara rápidamente a la residencia del Duque Valeztena.

<p>Sin embargo, el carruaje no llegó allí, sino ante nada menos que la residencia del Duque Escalante.

<p>—...

<p>Mientras Cárcel se frotaba los ojos con incredulidad, las enormes puertas de la mansión se abrieron de par en par. El carruaje atravesó a toda velocidad los jardines de Escalante y se detuvo bruscamente ante la gran entrada de la mansión.

<p>—...Ja...

<p>Para colmo, el cochero era un completo imbécil. Era exasperante. Justo cuando Cárcel suspiró profundamente y se dispuso a abrir la ventana detrás de él.

<p>—¿Qué haces?

<p>—...

<p>—¿Por qué no sales primero y me ayudas a bajar?

<p>Ya aparentemente preparada para bajar, sentada en el borde de su asiento, Inés preguntó como si diera una orden.

<p>Cárcel la miró desconcertado, luego cerró la ventana que había empezado a abrir y habló.

<p>—Esta no es tu casa.

<p>—Lo sé. También puedo ver por la ventana.

<p>—El cochero malinterpretó mis instrucciones. Le dije específicamente que se detuviera en la casa de la familia Valeztena.

<p>—Le dije que quería ir a la de la familia Escalante.

<p>—...

<p>—No pudimos hablar mucho en el concierto.

<p>Era lógico, dado que se trataba de un concierto. Dejando de lado el hecho de que incluso el cochero de Escalante antepusiera la petición de Inés a las órdenes de su amo... Cárcel se restregó la cara y volvió a preguntar.

<p>—¿Por qué te comportas así de repente?

<p></span>Como si te importara cómo vive tu prometido. ¿Tienes un don para atormentar a la gente solo en los momentos más inoportunos? O a no ser que...</span> Tragó saliva.

<p>Cuanto más intentaba reprimirlo conscientemente, más intenso se hacía el sentimiento: la idea de que no debía dejarse pillar bajo ningún concepto. Si acompañaba a su prometida al salón en un estado que, a ojos de cualquiera, era claramente una erección, dejaría una huella indeleble en la mente de los sirvientes.

<p>Monjes, pías oraciones, trozos de carne sangrantes de la carnicería, el hollín negro del suelo de la fragua y el hedor del pozo negro, el sombrío olor a alcohol del quirófano militar... Miró a Inés, recordando cosas que pudieran calmar la oleada que sentía en su interior.

<p>Sin embargo, como por arte de magia, solo Inés permaneció ante sus ojos una vez más.

<p>—Escalante, sé que no te hace mucha gracia verme...

<p>—Inés, no es que seas una molestia.

<p><span style="font-style:italic">Es que ahora mismo eres aterradora y peligrosa... en más de un sentido.</span> Inés, ajena al significado más profundo, se encogió de hombros ligeramente.

<p>—Bueno, eso es un alivio. ¿Bajamos primero? Tu carruaje es demasiado alto para que pueda bajar sola.

<p>Él siguió mirando a Inés, todavía escéptico, antes de bajar finalmente del carruaje como si admitiera su derrota. Le resultaba más familiar hacer simplemente lo que ella le pedía.

<p>Pronto, Inés tomó la mano que él le había tendido para subir al carruaje como si fuera lo más natural del mundo y ahora para bajar.

<p>Luego, como en cualquier otra ocasión, le cogió ligeramente del brazo, como si fuera...

<p>—¿Vamos?

<p>—... Vamos.

<p>Era una tortura. Una dolorosa tortura.

<p>El más mínimo contacto le parecía una quemadura. Intentó apartar ligeramente el brazo, como si quisiera evitar tocar a Inés en la medida de lo posible, pero ella, que valoraba la dignidad en la postura y los ángulos, lo corrigió de inmediato.

<p><span style="font-style:italic">Maldita sea, maldita Inés Valeztena...</span>

<p>Pronto, los sirvientes de la mansión, que se habían estado preparando para recibir al joven Duque en el vestíbulo de entrada, abrieron mucho los ojos al ver a Inés entrar en la residencia del brazo de él. No era de extrañar, dado que Inés, a pesar de haber visitado las propiedades del Duque de Esposa en numerosas ocasiones durante su juventud y de haberse quedado allí durante períodos de tiempo variables, rara vez visitaba la mansión de la capital, salvo en ocasiones especiales.

<p>Cárcel la condujo rápidamente al salón, casi como si estuviera en estado meditativo. Hizo caso omiso de las charlas de los sirvientes sobre la Duquesa, que pedía que los llevaran a ambos ante ella, o sobre Miguel, que regresaría en breve del campo de entrenamiento.

<p>—Me gustaría volver a ver a la Duquesa Escalante después de tanto tiempo.

<p>—¿Es necesario? La verás a menudo una vez que nos hayamos casado.

<p>—A Miguel también.

<p><span style="font-style:italic">Sigue llamándolo Miguel, como si nada hubiera cambiado.</span> Apenas pudo tragarse el sarcasmo que le subía a la garganta.

<p>Desde que Cárcel había sido nombrado caballero a los quince años, ella había dejado incluso de usar su nombre. Y eso no era todo. Ella había empezado a observar formalidades hacia él por iniciativa propia hacía más de una década.

<p>Esto significaba que hacía bastante tiempo que su relación había dejado de ser cómoda. Cárcel se sentó primero y respondió con naturalidad.

<p>—Miguel ha estado muy ocupado últimamente, preparándose para ingresar a la academia militar o algo así.

<p>—Lo sé. Recibí una carta de tu hermano.

<p>—¿Te escribes con él?

<p>—De vez en cuando. Si no iba a ver a tu madre, ¿por qué no fuimos a algún lugar donde pudiéramos estar los dos solos desde el principio?

<p>—...

<p>—Este lugar está demasiado abierto.

<p>La gran sala de recepción del Duque Escalante, que daba paso a su amplio estudio y sala de fumadores, parecía algo separada del resto de espacios, pero no daba la sensación de ser una zona completamente independiente.
	
<p>Precisamente por eso había venido. Porque era abierta. Porque había sirvientes apostados en cada punto de separación. Porque estaban solos, pero no del todo solos...

<p>—...¿Hay alguna razón por la que no deba ser abierto?

<p>La voz que preguntó, fingiendo indiferencia, tenía un toque de sed irritable. Si hubiera sido un sueño, la habría desnudado y la habría interrogado por atreverse a hacer tal pregunta mientras se entregaba a pensamientos lascivos... pero, por desgracia, esto era la realidad.

<p>Aun así, era claramente una situación mejor que la anterior.

<p>—Por supuesto que no hay ninguna razón. Es solo que... necesitamos tener una conversación privada.

<p>—Esto es lo suficientemente privado. Habla.
	
<p>Estaba satisfecho con su propia respuesta altiva. Esa compostura, sin intimidación ni excitación... Cárcel sintió que la estabilidad volvía gradualmente a su parte inferior.

<p>De hecho, para un demonio asqueroso, el aire del mundo y la mirada de la gente común resultan muy eficaces. Cruzar las piernas con arrogancia para ocultar cualquier evidencia de excitación de su vista también ayudó.

<p>—La última vez, desapareciste con tanta prisa que no pudimos concluir adecuadamente nuestra conversación.

<p>—... No desaparecí con prisa.

<p>Con esa sola frase, la altivez de Cárcel se desmoronó. Inés se limitó a encogerse de hombros con indiferencia antes de volver a hablar.

<p>—En primer lugar, agradezco la cortesía que has tenido al no dejarme descubrir tu estilo de vida disoluto durante todo este tiempo.

<p>—…

<p>—Bueno, al menos la cortesía que has tenido al intentar que no te descubriera...

<p>—…

<p>—Demuestra que me respetas.

<p>—¿Qué?

<p>Tras su altivez, su sentido común se derrumbó.

<p>—... Sé que soy yo quien ha actuado mal, así que probablemente debería escucharte...

<p>—Mhm.

<p>—Pero parece que realmente has perdido la cabeza, Inés.

<p>—No. Déjame terminar, Escalante.

<p>—Te volviste loca.

<p>—Hablaba en serio cuando dije que no tenías que preocuparte por mí por a quién vieras. De todos modos, no me interesa...

<p>Fue como si le hubieran lanzado otra piedra a la cabeza. Sin embargo, Cárcel asintió de buen grado, con una espléndida sonrisa.

<p>—De acuerdo. ¿A dónde quieres llegar?

<p>—Tú tampoco estás interesado en mí.

<p>—... De acuerdo.

<p>—Así que, tal y como hemos hecho hasta ahora, no nos entrometamos en la vida privada del otro hasta que nos casemos.

<p>—De acuerdo.

<p>—E incluso después de casarnos, siempre y cuando no nos engañemos mutuamente en apariencia.

<p>—De acuerdo... ¿Qué?

<p>—Hagamos lo que hagamos a espaldas del otro, nos dejaremos en paz.

<p>La sonrisa desapareció del rostro de Cárcel.

<p><span style="font-style:italic">Hasta el matrimonio, e incluso después del matrimonio... En apariencia, engaños, dejarse en paz, a espaldas del otro...</span>

<p>—... ¿Sin importar lo que hagamos a espaldas del otro?

<p>Nunca en su vida había oído una frase tan significativa. Si hacía lo que hacía, si le importaba o no, si le gustaba o no, si merecía la pena matarlo o merecía la pena engañarla a propósito... Lo habían abofeteado muchas veces, pero nunca con palabras tan significativas como estas.

<p><span style="font-style:italic">Entonces, ¿qué pretendes hacer a mis espaldas?</span>

<p>No, quizá sea una conclusión precipitada. Cárcel volvió a pensar.

<p><span style="font-style:italic">¿Así que lo que yo haga, tú también lo harás?</span>

<p>Por mucho que lo mirara, no había diferencia. Cárcel entrecerró los ojos y se levantó.

<p>Se acercó a Inés, que estaba levantando su taza de té frente a él, y se sentó a la mesa, abriendo las piernas a ambos lados de su sencillo vestido, como para encerrarla. Como si, de lo contrario, ella pudiera levantarse de repente y huir.

<p>Sin inmutarse por el peculiar comportamiento de su prometido, Inés tomó unos sorbos de té. Dejó cuidadosamente la taza sobre la mesa para evitarlo, luego lo miró directamente a los ojos y dijo:

<p>—Escalante, hay lugares en los que la gente debe sentarse.

<p>—Ya estoy sentado. Como todavía parezco humano, me parece perfectamente bien.

<p>—Escalante, es molesto.

<p>—Para mí no.

<p>Deliberadamente, estrechó las piernas que había abierto de par en par, colocando las rodillas de ella entre las suyas.

<p>Completamente atrapada, Inés no se resistió, pero resopló con desdén.

<p>—¿Eres un niño?

<p>—¿Entonces tendrían mis piernas esta longitud? A juzgar por la longitud, tú eres la niña.

<p>—Sinceramente, qué infantil. Interrumpir de repente a alguien en mitad de una frase...

<p>—Mira las tonterías que has estado diciendo tú primero.

<p>—No veo cuál es el problema.

<p>—¿De verdad crees que eso tiene sentido?

<p>—¿Por qué no lo tendría?

<p>Su rostro interrogativo era claro y puro. Parecía realmente desconcertada. Los botones abrochados cuidadosamente hasta el cuello, el vestido azul marino oscuro... nada parecía diferente de lo habitual.

<p>Sin embargo, Inés no parecía ella misma. En el concierto, se había visto excesivamente hermosa, y ahora...

<p>—... Entonces, al final, ¿todo esto es por tu amante?

<p>—¿Qué?

<p>—¿Estás haciendo esto para poder seguir viendo a ese hombre?

<p>Eso lo explicaba todo. Por qué había soportado en silencio su comportamiento disoluto todo este tiempo, por qué había tolerado su continua imprudencia, por qué ahora incluso discutía asuntos después del matrimonio... Todo tenía sentido si era por ese hombre.

<p><span style="font-style:italic">Quizás no era solo ese hombre, sino otros hombres...</span> Cárcel completó tranquilamente sus cálculos. Esa apariencia sofocante y remilgada no era más que una fachada para engañar al mundo. ¿Quién podía decir a cuántos hombres había hechizado con ese cuerpo hermoso y encantador? No era de extrañar que los hombres la adoraran en secreto y se pusieran en fila para cortejarla.

<p>Para Cárcel, que era burlado por Inés en sus sueños noche tras noche, nunca podría subestimar ese poder oculto.

<p>Sí, sin duda tenía el aspecto adecuado para ello. Ese temperamento obstinado, esa forma de hablar a los hombres como le placía... Unas pocas órdenes y cualquiera estaría a su entera disposición.

<p>Por alguna razón, su sangre comenzó a hervir. No podía mostrar ningún signo de ello, dado su propio historial mancillado, pero al menos después del matrimonio, sería otra cosa.

<p>—... No importa con quién hayas estado hasta ahora. No es asunto mío y sé que no tengo derecho a interferir.

<p>—¿Estás hablando de alguien que conozco?

<p>Su tranquila réplica dejó sin sentido sus sinceras palabras. Aprovechando el momento, Cárcel agarró a Inés por la muñeca cuando ella intentaba escapar, le puso las manos sobre las rodillas y volvió a mirarla a los ojos.

<p>—Pero esto no tiene sentido. A menos que sea una idea retorcida de que si yo lo hago, tú también puedes hacerlo...

<p>—Esa es más o menos la idea.

<p>—Estás loca.

<p>—Por supuesto, ponerme al día será difícil.

<p>Su recatada prometida ahora parecía una rebelde preparada. Con la mano que no le sujetaba las muñecas, Cárcel se secó nerviosamente la cara.

<p>—... Sé que mis acciones desde la escuela de cadetes deben haberte decepcionado. Lo sé.

<p>—¿Te enlistaste para evitar casarte conmigo?

<p>Originalmente, quiso decir que había empezado a salir con mujeres a partir de ese momento,  pero Inés había profundizado.

<p>Deberían haberse casado hacía seis años.

<p>En el momento en que los hermosos ojos de Cárcel vacilaron, ella sonrió.

<p>—Lo sé. Eso estuvo bien.

<p>—...

<p>—Que te enlistaras, eso fue brillante.

<p>No podía ser su imaginación que sonara como “Fue bueno que me deshiciera de algo que me molestaba”. Cárcel se rió con fuerza, como si se negara a ceder, y replicó.

<p>—¿Porque así podrías disfrutar de citas secretas con tu amante?

<p>—No hubo tal cosa. Ni una sola.

<p>Fue una respuesta sincera, sin ningún atisbo de ocultación. La sonrisa torcida que se había dibujado en las comisuras de la boca de Cárcel se enderezó silenciosamente.

<p>Aprovechando ese momento de descuido, ella volvió a hablar con frialdad.

<p>—Simplemente me alegró que la boda se pospusiera indefinidamente.

<p>—...

<p>—Eso no significa que no me gustes, Escalante.

<p>—Tampoco que te guste.

<p>—¿Por qué te importa eso?

<p>Por un momento, sintió como si le hubieran arrancado el aliento. <span style="font-style:italic">¿Por qué te importa eso a ti?</span> Quería preguntarle Cárcel.

<p><span style="font-style:italic">¿Por qué no significaba nada para ti?</span>

<p>—No hay ningún hombre con el que esté saliendo. No tengo un rostro tan llamativo como el tuyo, ni ningún encanto especial.

<p>Eso no era cierto. No era cierto, y le hacía sentir como si fuera a volverse loco. <span style="font-style:italic">¿Sabes siquiera lo miserable que me he vuelto por tu culpa? ¿Sabes lo que he hecho mientras pensaba en ti...?</span> Pero no le salía ni una sola palabra adecuada.

<p>Si supiera lo que había dentro de su cabeza, no le hubiera extrañado que abandonara Mendoza en un arranque de puritanismo.

<p>—¿Está mal querer simplemente hacerte sentir más cómodo? La premisa de “a espaldas del otro” la añadí para que te sintieras a gusto. Por supuesto, tengo en cuenta la posibilidad de que algún día encuentre a un hombre al que amar...

<p><span style="font-style:italic">Habla del hombre de su destino sin el rostro lleno de sangre o lágrimas.</span> Cárcel torció su hermosa boca, burlándose interiormente.

<p>—Más que eso, simplemente deseo que seas libre.

<p>—...

<p>—Te perjudiqué. Por mi culpa, te comprometiste contra tu voluntad. Por mi culpa, te convertiste en el heredero del Duque a una edad excesivamente temprana. Pasaste casi veinte años agobiado por arduas lecciones y atendiendo —no, acompañando— a una prometida que no deseabas. Y luego, para evitar casarte con una prometida que no era ni particularmente hermosa ni encantadora, rígida y aburrida, como una monja de la capilla, y pasar tu vida con ella, incluso zarpaste con la flota, arriesgando tu preciosa vida. Todo ello solo para retrasar un poco más esa vida.

<p>—...

<p>—Así que te compensaré por tu pérdida. Para asegurarme de que este hermoso rostro no se marchite, ni siquiera un poco.

<p>Esa mano descarada, acariciándole la mejilla como solía hacerlo.

<p>Sin embargo, seguía siendo un rostro completamente amable. El rostro de una prometida dócil, dispuesta a renunciar a todo orgullo y dignidad por la conveniencia de su prometido...

<p>¿Dominación, sumisión...? ¿Era eso siquiera posible con ese temperamento sanguinario?

<p>Las palabras por sí solas no podían contar toda la historia. Cárcel estaba seguro de que había más que eso. Era sospechoso que ella siguiera hablando largo y tendido sobre su irritante personalidad sin que él le hubiera preguntado nada.

<p>Un motivo oculto. Claramente, había algún motivo oculto.

<p>Cárcel entrecerró los ojos y se inclinó hacia delante para acercar su rostro al de ella. Inés no pestañeó y continuó hablando.

<p>—Tu infancia estuvo ligada a nuestro matrimonio, pero todo cambiará una vez que nos casemos.

<p>La distancia de unos dos palmos se redujo gradualmente a un palmo y medio.

<p>—Serás más libre que antes del matrimonio.

<p>La distancia de un palmo y medio se redujo a un palmo.

<p>—Y yo, seré tu esposa solo de nombre.

<p>Una distancia de aproximadamente un palmo se redujo a medio palmo, lo suficientemente cerca como para que sus respiraciones se mezclaran.

<p>Por primera vez, Inés mostraba una mirada de desconcierto. Era una expresión que él había visto con bastante frecuencia en sus sueños. Cada vez que ella mostraba esa mirada, él invariablemente la devoraba.

<p>—... Haré cosas que no tienen nada que ver contigo, cosas que son meramente para guardar las apariencias.

<p>—¿Deseas vivir sin ninguna conexión con tu marido? ¿Es eso siquiera posible?

<p>—Haré todo lo posible por ti. Confío en que tú harás lo mismo por mí... Como yo no te amo y tú no me amas, seremos la pareja perfecta. ¿No estás de acuerdo? Tendremos el hijo que nuestra familia necesita, no mostraremos interés por la vida privada del otro y no causaremos ninguna discor...

<p>Cárcel se tragó el resto de sus palabras. Inés, con los ojos muy abiertos, incapaz de respirar, finalmente expulsó un jadeo entrecortado por sus labios entreabiertos cuando él introdujo suavemente la lengua en su boca. Todo fue repentino. Quizás incluso para Cárcel, que había dado impulsivamente a su prometida su primer beso.

<p>Él acercó su cuerpo al de ella, chupando su carnoso labio inferior con un sonido lascivo. La rodilla de ella, que había descansado junto a la de él, ahora se presionaba profundamente contra su muslo.

<p>Más precisamente, contra su miembro ya endurecido.

<p>Si Inés era el tipo de mujer tan indiferente al mundo que solo podía ser inocente, como él había observado durante mucho tiempo, no comprendería su significado de inmediato. Por el contrario, si sus sospechas eran correctas, lo entendería perfectamente.

<p>Y, por primera vez, Cárcel vio cómo se sonrojaba. Ella entendió perfectamente el significado. Él tenía razón. Por primera vez, había destrozado su compostura... por primera vez, la había dejado nerviosa y desconcertada.

<p>Sin embargo, eso no le produjo ninguna satisfacción.

<p>—... ¿Dices que vas a tener a mi hijo, pero ni siquiera quieres hacer esto conmigo?

<p><span style="font-style:italic">¿Quién te enseñó esas cosas?</span> Sabía que no tenía derecho a reprochárselo. Sin embargo... sus labios, sin separarse del todo, acariciaron ligeramente los de Inés antes de presionarlos con firmeza y separarse.

<p>—Lo siento, pero no puedes vivir sin mí. Inés Valeztena.

<p>Bajo el rostro que ofrecía una suave sonrisa, pasó una fría emoción. El pasado, que ella nunca conocería de todos modos, no importaba. Pero el futuro sería diferente.

<p>—Me besarás docenas, cientos de veces, y nuestros cuerpos se entrelazarán miles de veces. No rozaré ni con la yema de los dedos a ninguna mujer que no seas tú. Y hasta que me des un hijo, y luego otro, e independientemente de los hijos, te satisfaré y haré que me satisfagas.

<p>—...

<p>—No necesito esa maldita libertad ni esa vida que tanto deseas concederme. En mi definición de matrimonio, tales cosas no existen.

<p>—...

<p>—Puede que sea un maldito bastardo, pero soy más fiel de lo que crees, Inés Valeztena.

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

document.addEventListener("keydown", function(e) {
    if (
        (e.ctrlKey || e.metaKey) &&
        ["c", "x", "s", "u", "p"].includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});

let tamano = 18;

function cambiarFuente(fuente) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    contenido.style.fontFamily = '"' + fuente + '", serif';
    localStorage.setItem("fuenteLectura", fuente);
}

function cambiarTamano(valor) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    tamano += valor;

    if (tamano < 14) tamano = 14;
    if (tamano > 26) tamano = 26;

    contenido.style.fontSize = tamano + "px";
    localStorage.setItem("tamanoLectura", tamano);
}

function modoOscuro() {
    document.body.classList.toggle("oscuro");

    localStorage.setItem(
        "modoLectura",
        document.body.classList.contains("oscuro")
            ? "oscuro"
            : "claro"
    );
}

window.addEventListener("DOMContentLoaded", function() {

    const contenido = document.getElementById("contenido");
    const fuente = document.getElementById("fuente");

    if (!contenido || !fuente) return;

    const fuenteGuardada = localStorage.getItem("fuenteLectura");
    const tamanoGuardado = localStorage.getItem("tamanoLectura");
    const modoGuardado = localStorage.getItem("modoLectura");

    if (fuenteGuardada) {
        fuente.value = fuenteGuardada;
        cambiarFuente(fuenteGuardada);
    }

    if (tamanoGuardado) {
        tamano = parseInt(tamanoGuardado);
        contenido.style.fontSize = tamano + "px";
    }

    if (modoGuardado === "oscuro") {
        document.body.classList.add("oscuro");
    }
});

</script>

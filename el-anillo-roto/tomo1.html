<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>Así que quizá todo estuviera mal desde el principio.

<p>Cuando Cárcel Escalante, de seis años, prometió pasar toda su vida con Inés Valeztena, también de seis años, ni siquiera sabía lo que significaba “toda la vida”. Fue solo hacia el final del suntuoso banquete celebrado en la Mansión Valeztena para celebrar su compromiso cuando Cárcel preguntó a los adultos: “¿Cuántos años son toda la vida?”

<p>—No, lo que quiero decir es, ¿cuántos años dura toda la vida?

<p>Debió de preguntarlo por cuarta vez, moviéndose entre los adultos, que se limitaban a sonreír extrañamente en lugar de responder. Cuando la pregunta llegó al Duque Valeztena, este interrumpió a la Duquesa, que estaba a punto de responder, y señaló con la barbilla a su hija. Solo entonces Cárcel pudo ver la expresión de Inés.

<p>—... ¿Sabes lo que eso significa?

<p>Sus ojos, bajos como si miraran algo totalmente vil, se fijaron en él. Sus ojos estaban a la misma altura, pero el ángulo de la mirada de ella era infinitamente superior. Cárcel, de seis años, poseía un carácter imperturbable, pero tenía un sentido inquietante para detectar cuándo alguien lo despreciaba. Justo cuando se sonrojó y frunció el ceño, Inés añadió abruptamente:

<p>—No lo sabes, ¿verdad?

<p>—Por supuesto que lo sé. ¿Quién no lo sabría?

<p>—Entonces explícamelo.

<p>—... Dura, dura...

<p>—¿Cuánto dura?

<p>—Dura…

<p>—...¿De verdad tengo que hablar directamente con el joven Escalante?

<p>Inés giró bruscamente la cabeza y preguntó a su padre. El Duque se agachó hasta la altura de los ojos de su pequeña hija y le habló con amabilidad.

<p>—Eres mucho más inteligente que tus compañeros, ¿verdad? Es natural que te sientas agobiada. Por eso necesitas practicar. Práctica hablar sin menospreciar a los que son menos capaces que tú. Práctica cómo explicar las cosas a tus amigos que no saben, sin hacerles sentir inferiores, aunque no sean tan inteligentes como tú...

<p><p><span style="font-style:italic">¿Acaba de decir que la hice sentir agobiada? ¿Que no era suficiente? ¿Que no soy inteligente?</span> Cárcel dudó de sus oídos y miró al Duque y a Inés.

<p>Pero ellos ya parecían haberse olvidado por completo de Cárcel.

<p>—¿Yo? ¿Soy estúpido?

<p>Cárcel era inteligente para tener seis años. ¿No lo habían elogiado unánimemente todos sus tutores y los ancianos de la familia? “El joven maestro Escalante es extraordinariamente inteligente para tener seis años”, decían.

<p>Frunció el ceño, arrugando su adorable frente, y volvió a mirar al Duque. A diferencia del comportamiento rígido de Inés, el rostro altivo del Duque estaba lleno de orgullo y afecto por su hija. Era un marcado contraste con la forma en que miraba a los hijos de otras personas.

<p>—No necesito amigos. El joven Escalante es mi prometido, después de todo.

<p>Su tono daba a entender que era algo totalmente insignificante. Como si dijera: “Si no necesito amigos, ¿por qué debería importarme un prometido?”

<p>Cárcel era joven y aún ignoraba muchas cosas, pero entendía que un “prometido” era algo mucho más significativo que un “amigo”. Se podían hacer un sin números de amigos, pero un prometido era único, ¿no?

<p><span style="font-style:italic">¿Te consideras inteligente y aún así no lo sabes?</span>

<p>Por supuesto, el problema era que ya habían fracasado como amigos en numerosas ocasiones.

<p>—Sí. Cárcel es tu prometido, ¿no? Por lo tanto, deberías ser aún más amable y gentil, más femenina…

<p>—Aunque tenga mal genio, ya soy una dama, padre.

<p>Cárcel la miró con los ojos entrecerrados, sorprendido cuando ella terminó abruptamente de sermonear a su padre y giró la cabeza bruscamente.

<p>La chica, pulcramente vestida con el pelo negro y un vestido negro, parecía más adecuada para el funeral de un desconocido que para un banquete de celebración de su compromiso. Un aura inconfundiblemente severa, como la de alguien sin hijos, una inquietud similar a la que se siente al enfrentarse a un adulto desagradable…

<p>Inés Valeztena no era infantil. Quizás eso era lo que despertaba una aversión instintiva. Cárcel siempre la había encontrado incómoda. Por eso aún le parecía increíble.

<p>—Escalante. Escucha con atención.

<p>Esa rígida negativa a llamarlo por su nombre.<span style="font-style:italic">Esa arrogancia, cuando ni siquiera es más bonita que yo…</span>

<p><span style="font-style:italic">El matrimonio. Casarse con una chica así.</span>

<p>—Solo los muertos pueden responder a cuántos años equivale una vida.

<p>—¿Los muertos hablan?

<p>—No pueden. Por eso ningún vivo lo sabe.

<p>—¿Cómo lo saben los muertos?

<p>—Porque están muertos.

<p>—...

<p>El chico, que llevaba unos cuatro meses aprendiendo sobre la “muerte”, encontraba incómoda la conversación, en la que la palabra “muerto” aparecía constantemente. Ella ya llevaba un vestido que parecía un traje de luto, lo cual ya era bastante espeluznante, y sin embargo seguía sacando el tema sin mostrar ni una pizca de miedo... Él puso los ojos en blanco, buscando a algún adulto que pudiera mediar en la conversación, pero la Duquesa Valeztena ya los había dejado atrás.

<p>Cárcel decidió dirigir la conversación él mismo.

<p>—¿Entonces tú tampoco lo sabes?

<p>—Así es. Solo los muertos lo saben.

<p>Su intento de cambiar de tema resultó inútil, volviendo al punto de partida. Cárcel se rindió rápidamente.

<p>—¿Por qué hay que morir para saberlo?

<p>—La vida dura hasta la muerte, y cuando mueres, la vida termina.

<p>—...

<p>—Bueno, entonces... solo hasta el último momento, se puede calcular el total, ¿no? Cuántos años dura tu vida.

<p>—... ¿El final?

<p>—El final. ¿Creías que vivirías para siempre?

<p>El final de la vida era un pensamiento bienvenido. Siempre decía que tenían que estar juntos “para toda la vida”. Para que su matrimonio con Inés llegara a su fin, esa “vida” también tenía que terminar.

<p>Pero morir era un pequeño problema.

<p>—... ¿Por qué la vida dura hasta que mueres? ¿Por qué?

<p>—Eso es precisamente lo que es la vida. Desde el día en que naces hasta el día en que mueres. Así que no sabrás cuántos años dura tu vida hasta que mueras.

<p>—...

<p>—Por favor, no preguntes cuándo morirás.

<p>—¿Cuándo moriré?

<p><span style="font-style:italic">Ja...</span> Inés se presionó la frente con los dedos y negó con la cabeza. Era un gesto que solía hacer la madre de Cárcel, la Duquesa Escalante, cuando su hijo le daba dolores de cabeza.

<p>Sintiéndose irritado y cada vez más inquieto, Cárcel volvió a insistir con urgencia.

<p>—¿Cuándo moriré? ¿Por qué moriré?

<p>—¿Me tomas por adivina, por el amor de Dios? Nadie sabe eso.

<p>—Mi abuelo dijo que se le pudrió la pierna después de que le dispararan en Nuñera. Así que a mí también se me pudrirá…

<p>—Si estás decidido a seguir sus pasos, también pueden dispararte, pero no hay necesidad. Cada uno muere de forma diferente. La gente muere por enfermedad, hambre, por beber demasiado, por golpes, por disparos, por puñaladas…

<p>El hermoso rostro de Cárcel palideció. Inés volvió a suspirar, con aire cansado.

<p>—¿Hay tantas formas de morir?

<p>—Debes tener cuidado. Esfuérzate más.

<p>—¿Tener cuidado evitará que muera?

<p>—No, no lo evitará.

<p>—¿Aunque tenga cuidado, moriré?

<p>—Podrías morir mañana.

<p>Su rostro, antes perfecto como la encarnación de un querubín pintado en una imagen sagrada, se contorsionó lentamente. Las lágrimas brotaron de sus temblorosos ojos azules y comenzaron a caer en gotas constantes.

<p>Una mirada de lástima volvió a aparecer en los ojos de Inés.

<p>—¿A mí también me cortarán la pierna?

<p>—... Tu abuelo vivió otros diez años después de que le amputaran la pierna.

<p>—¿Entonces tendré que vivir contigo hasta que me corten la pierna?

<p>—Tú eres diferente a tu abuelo. Te he dicho innumerables veces que no hay necesidad de amputarte la pierna... Ah, bueno, si contraes una enfermedad que te provoque gangrena o sufres una herida de bala que no se trate, entonces tal vez sea necesario…

<p>—¡Significa que hay que cortarla! Si no me la cortan, ¡tendré que casarme contigo!

<p>Las miradas de los invitados se posaron tardíamente en los protagonistas de la cena. Más concretamente, en el chico cuyo rostro angelical, hermoso y lastimoso estaba bañado en lágrimas. Luego, sin excepción, se volvieron hacia la chica que lo miraba con el rostro desprovisto tanto de sangre como de lágrimas, como si buscaran la causa.

<p>Érase una vez Cárcel, vestido con una camisa blanca, corbata roja, chaleco beige y levita marrón, con su brillante cabello dorado, sus perfectos ojos azules, su piel impecable como la porcelana y sus rasgos esculpidos.

<p>Érase una vez la expresión rígida de Inés y su atuendo negro, en marcado contraste con esos cálidos tonos…

<p>Era nada menos que un choque perfecto de colores, como la oposición entre el bien y el mal. Inés susurró con los dientes apretados.

<p>—¿Crees que solo se trata de casarnos? También tienes que tener un hijo conmigo.

<p>—¡No quiero!

<p>—Pues bien, si no quieres eso, será mejor que pares ahora. Porque si lloras, acabarás teniendo un hijo conmigo.

<p>—...

<p>—Me odias, ¿verdad? ¿Verdad?

<p>Cárcel miró a Inés con los ojos helados y luego asintió lentamente. A regañadientes, Inés extendió la mano y le secó las lágrimas de la mejilla a Cárcel. Desde la distancia, el gesto parecía bastante tierno, y los adultos, aparentemente tranquilos, rápidamente apartaron la mirada.

<p>En cuanto confirmó que la sospecha que se había cernido sobre ella había desaparecido, Inés se apartó de él. Parecía casi cruel, pero para Cárcel, su mera distancia parecía alejar el humo de la muerte.

<p>—Escalante.

<p>—Sí.

<p>—... En realidad, puede que no sea “para siempre”

<p>—¿Qué?

<p>—Me refiero a nuestro matrimonio.

<p>Inés esbozó una sonrisa pícara, como si compartiera un secreto vital, antes de volver a su expresión impasible.

<p>Cuando Cárcel ladeó la cabeza, confundido, ella murmuró con irritación, como diciendo “¿Qué sabrás tú?”, pero eso fue todo. Afortunadamente, la Emperatriz Cayetana, hermana mayor del Duque Escalante y tía de Cárcel, acababa de levantar su copa para proponer un brindis.

<p>—Cárcel Escalante de Esposa se casará con Inés Valeztena de Pérez el año en que alcance la mayoría de edad. Esta hermosa unión, destinada a durar toda la vida, consolidará aún más la alianza entre nuestras dos familias.

<p>—¡Así es!

<p>—Se amarán y se respetarán mutuamente durante toda la vida, convirtiéndose en el apoyo incondicional y la luz que guía al otro en los momentos difíciles, sosteniendo a ambas familias con un amor cada vez más duradero. Inés Valeztena se convertirá en la señora que gobernará personalmente la vasta finca Escalante, mientras que Cárcel Escalante, como yerno de la familia unida por matrimonio a los Valeztena, dedicará toda su vida a ambas familias. Esto también será una alegría para nuestra Familia Imperial…

<p><span style="font-style:italic">De por vida: juntos hasta la muerte; de por vida: amándose y apreciándose mutuamente hasta la muerte; de por vida: dedicados a las familias del otro hasta la muerte...</span> Ahora, la palabra “de por vida” resonaba automáticamente como “hasta la muerte”. Era una bendición que parecía una maldición.

<p>Dijera lo que dijera aquella novia de seis años, poco amable, insolente y no especialmente guapa, aquel día sus vidas quedaron echadas a los dados.

<p>Y estaba claro que, a partir de aquel día, la vida perfecta de Cárcel Escalante también se había visto distorsionada.

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—... Sigo sin entenderlo.

<p>El Príncipe Heredero Óscar, de diez años, estaba sentado con arrogancia, con las piernas cruzadas y aún sin terminar, mirando a Cárcel con desagrado. Estaba claramente presumiendo de sus piernas más largas en comparación con las de su primo, cuatro años menor que él. Como si él mismo no fuera más que un niño…

<p>—¿Por qué tú?

<p>—...

<p>Cárcel se volvió instintivamente para mirar a su primo con el ceño fruncido, pero luego cerró la boca, decidiendo que no tenía sentido hablar. Sus padres ya le habían advertido al entrar en el palacio. “Aunque el comportamiento de Su Alteza Óscar aún no es del todo maduro, es el soberano al que debes servir de por vida”.

<p>Toda la vida significaba hasta la muerte. Y Cárcel ya estaba harto de la frase “toda la vida”.

<p>Ya era bastante malo tener que vivir como marido y mujer con esa Inés Valeztena hasta la muerte, pero tener que aguantar a ese primo infantil hasta la muerte... Tener que servirle con la misma reverencia con la que su padre servía a Su Majestad Imperial…

<p>—Cárcel Escalante de Esposa.

<p>—Mm.

<p>—¿No te parece que el discurso de este hermano mayor no suena como un discurso?

<p>Era ridículo oírle recitar su largo nombre y hablar con tanta solemnidad. Si bien era cierto que en la infancia, unos pocos años más hacían que uno pareciera mayor, Óscar era de los que balbuceaban palabras que socavaban por completo cualquier apariencia de madurez, a pesar de su altura, muy superior a la de sus compañeros.

<p>Al menos para su primo, Cárcel.

<p>—Yo tampoco lo sé.

<p>—¿No lo sabes? ¿Eso es todo?

<p>Exteriormente, el Príncipe Heredero parecía naturalmente inteligente y tranquilo, pero Cárcel estaba cada vez más convencido. Esa maldita costumbre de puntilloso con cada palabra seguramente le costaría la lealtad de sus súbditos en el futuro.

<p>—Si no lo sabes, di que no lo sabes, por el amor de Dios. ¿Crees que puedes pasar por la vida sin esfuerzo solo porque tienes una cara bonita? ¿No lo sabes? ¿Eso es todo?

<p>—No lo sé, así que digo que no lo sé.

<p>—Ese es precisamente tu problema.

<p>Justo cuando Óscar se echó hacia atrás nerviosamente su pelo rojo, Cárcel, que había estado sujetando un libro enfrente de él contra su voluntad, finalmente lo cerró de golpe con su pequeña mano.

<p>—Si no lo sabes, haz un esfuerzo por aprenderlo. Cuando seas mayor, ¿te quedarás ahí parado mirando fijamente el trasero de las mujeres cuando tu soberano te pregunte algo, diciendo: “Bueno, no sé nada de eso…”.

<p>—No.

<p>Simplemente odiaba estar cerca de su primo. Tener que lidiar con este tedioso asunto incluso cuando fuera mayor. En ese momento, Cárcel recordó las palabras de la Emperatriz Cayetana, madre de Óscar y hermana mayor de su padre.

<p>Ella había dicho claramente que, una vez que se es adulto, se podía hacer lo que se quisiera. Para lograrlo, había que soportar tareas desagradables durante la infancia: estudiar con ese primo irritante, comprar la libertad futura.

<p>Pero mirando la realidad.

<p>Como adulto, tendría que casarse con esa fría Inés Valeztena y ayudar a ese primo cuyo estatus solo crecería más que el suyo. Incluso el deber familiar que sutilmente había esperado pasar a su hermano menor Miguel, le pertenecía exclusivamente desde el momento en que se comprometió con Inés y Miguel fue tratado como un adulto provisional. Porque la única hija de la familia Valeztena no podía casarse con un hombre que no recibiera un título Ducal.

<p>Así, Cárcel era ahora el heredero indiscutible del Ducado de Escalante. Y esto coincidió con el nacimiento de un Príncipe Heredero en la Familia de Escalante después de ciento cincuenta años.

<p>Todos los asuntos de la familia Escalante giraban en torno al Príncipe Heredero, y entre esos “todos los asuntos”, su hijo mayor y heredero, Cárcel, no era una excepción.

<p>Ahora, no solo tenía que cargar con una prometida no deseada, sino que también tenía que pasar aún más tiempo con Óscar que antes.

<p>—A la joven de Valeztena... Es obvio que hiciste algo. ¿No es así?

<p>Aguantó esta absurda teoría conspirativa que le lanzaron a la cara.

<p>A pesar del argumento sin sentido del Príncipe Heredero, Cárcel mantuvo la compostura y la dignidad, respondiendo con el máximo respeto, tal y como su madre le había enseñado innumerables veces.

<p>—Tengo seis años, Alteza.

<p>Se podría decir que ¿qué podría hacer un niño inocente de seis años?, pero él se mantuvo notablemente sereno. Esa compostura, increíble para un niño de seis años... Siempre había sido más inteligente que los de su edad. No importaba lo que su desagradable prometida y su desagradable padre hubieran dicho para menospreciarlo.

<p>Óscar entrecerró los ojos, aparentemente leyendo la expresión de orgullo que se había deslizado inconscientemente en mi rostro.

<p>—Entonces, un mocoso de seis años…

<p>—Pronto cumpliré siete.

<p>—Un simple mocoso de siete años, se atreve a...

<p>Él solo tenía diez años...

<p>—¿No sabías que esa chica era mía?

<p>—Alteza, Inés nunca fue suya...

<p>—¿Te atreves a robar lo que pertenece a tu señor?

<p>Aunque habían pasado tres meses desde que Cárcel se había comprometido con Inés, Óscar parecía recordar ese día como si fuera ayer.

<p>—Por el bien de mi tío, no te castigaré por esa ofensa. Ahora dime. ¿Qué truco utilizaste con esa niña?

<p>—...

<p>—Fue esa maldita cara tuya, ¿cierto? Lo sabía.

<p>Los rasgos angelicales de Cárcel se nublaron con cansancio. Era una expresión poco adecuada para un niño, aunque una cara así podía llevar cualquier cosa.

<p>—No hice nada...

<p>—Estuviste rondando a esa niña, ¿verdad? Con esa maldita cara tuya.

<p>—...

<p>—No hay engaño como ese.

<p>Óscar murmuró como si escupiera veneno. Él también poseía unos rasgos llamativos, que ya insinuaban un porte distinguido, pero sabía muy bien que su hermoso rostro no podía compararse con la belleza inhumana de Cárcel.

<p>—Eso es por Su Majestad la Emperatriz. O mejor dicho, gracias a ella.

<p>—Esa alianza matrimonial era para la Familia Imperial. Esa chica no nació para ocuparse de la finca de los Escalante.

<p>Desde el principio, el deseo de forjar una alianza matrimonial con la familia Valeztena y establecer una alianza completa, así como la decisión de unir a Cárcel con Inés como su compañero de juegos para tal fin, habían sido el deseo de la madre del Príncipe Heredero, Cayetana.

<p>Y cuando Inés rechazó el compromiso en su cara, declarando “prefiero morir antes que casarme con el Príncipe Heredero”, y luego señaló a Cárcel, que estaba allí sentado completamente ajeno a todo, diciendo “prefiero casarme con ese niño”, fue la madre del Príncipe Heredero, Cayetana, quien rápidamente trajo a su sobrino ante ella como si lo hubiera estado esperando. Todo ello mientras esgrimía el sofisma de que “el matrimonio debe traer primero la felicidad a la mujer, porque sólo entonces el hombre puede ser feliz”, y esto con unos niños de apenas seis años.

<p>Si Cárcel hubiera sido un poco mayor, habría podido discernir el entusiasmo descarado que se escondía detrás. La agenda oculta tras esa amabilidad, la amabilidad que le había dicho, sin una sola palabra de reproche por la audacia de una niña que había declarado descaradamente que “prefería morir antes que casarse” con el hijo del Emperador: “Elige lo que quieras, sin condiciones”

<p>Su tía no deseaba una chica aburrida, al igual que la Familia Valeztena no necesitaba una, y aunque necesitaba a Inés, no necesitaba a su hijo hasta el punto de entregarlo.

<p>Cárcel era un vínculo conveniente. Colocar a la hija de Valeztena a una distancia lo suficientemente cercana como para ser conveniente, pero no tan intrusiva como para interferir en sus vidas, al tiempo que se consolidaba la alianza con Valeztena.

<p>Pero Cárcel era un niño que no sabía nada de la situación, por lo que solo sentía injusticia. Si lo hubiera entendido, quizá habría sentido aún más injusticia.

<p>—Alteza, la elección fue de Inés.

<p>—Por culpa de tu maldita cara, esa chica perdió la oportunidad de estar en lo más alto del Imperio. Un momento de error de juicio... ¿Te das cuenta de lo mucho que has arruinado la vida de esa chica?

<p><span style="font-style:italic">Era incomprensible. ¿Él había arruinado su vida? ¿No será al revés?...</span> Cárcel negó con la cabeza con firmeza. Óscar suspiró y se llevó la mano a la frente.

<p>—...Y este es el tonto al que ella prefirió antes que a mí. Esa maldita pelinegra como un cuervo...

<p>—... ¿No le gustaba Inés Su Alteza?

<p>—¿Gustarme? ¿A quién?

<p>—A Su Alteza.

<p>—¿A mí? ¿Ese cuervo?

<p>—... Usted quería a Inés.

<p>Hasta el punto de atormentar a alguien así. Ante las palabras de Cárcel, Óscar soltó una carcajada, como si hubiera oído algo absurdo.

<p>Luego, mirando a Cárcel como si fuera un niño muy pequeño e inocente, lo fijó con una mirada que llevaba un toque de afectación.

<p>—Cárcel, querer algo es diferente a gustarte.

<p><span style="font-style:italic">Muy diferente, de hecho.</span> Asintió como si estuviera de acuerdo, luego apoyó la barbilla en la mano con altivez. Era la mirada que tenía cuando estaba convencido de que era completamente adulto.

<p>—Yo quería casarme con Inés Valeztena. No porque la amara.

<p>En lugar de expresar lo que realmente pensaba “De todos modos, a Inés no le gustas, así que tu opinión no importa”, Cárcel se limitó a inclinar la cabeza, como si estuviera ligeramente desconcertado.

<p>Óscar se rió.

<p>—Entre las mujeres con las que podríamos casarnos, no hay mejor linaje que el suyo.

<p>Cárcel sabía bien que entre los prestigiosos Grandes de Ortega, la más alta esfera de la nobleza, solo habían cinco familias ducales. Y entre esas cinco, Inés era la única chica de su edad.

<p>Ya fuera niño o niña, la decisión siempre favorecía al lado con mayor valor de rareza. Los Grandes de Ortega ocupaban una posición fuera del alcance de la coacción imperial, por lo que el joven Príncipe Heredero sufrió su primera derrota en la vida. Al igual que Cárcel se había visto atado con una correa de un solo golpe.

<p>—Por supuesto, podrías haberte casado con mi hermana.

<p>—... No me gusta.

<p>—¿Prefieres al cuervo de Valeztena antes que a mi hermana?

<p>No era de extrañar. ¿Casarse con su prima? <span style="font-style:italic">Absolutamente repugnante...</span> Cuando Cárcel asintió, Óscar esbozó una sonrisa irónica y retiró rápidamente la mano con la que se apoyaba la barbilla.

<p>—Parece que, después de todo, te gusta más el cuervo.

<p>—Bueno, si tengo que vivir con ella el resto de mi vida...

<p>Tres meses después del compromiso, Cárcel seguía trabajando a diario para calmar su mente. Óscar se rió entre dientes.

<p>—Oír eso me hace quererla aún más.

<p>Es cierto, mirar la misma cara toda la vida sería bastante difícil... El Príncipe Heredero, que había murmurado para sí mismo lo que podría haber dicho una anciana, se puso de pie.

<p>—Está bien. Vamos a ver a tu cuervo.

<p>—¿…?

<p>—Aún te queda mucho para alcanzar la mayoría de edad.

<p>Habló con un tono presuntuoso y significativo, como si él mismo ya la hubiera alcanzado.

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>Era natural, ¿o no?

<p>Inés no les dio la bienvenida. Teniendo en cuenta que el Duque Escalante había puesto patas arriba toda su mansión quince días antes de la única visita del Príncipe Heredero —nada menos que su sobrino—, la escena actual apenas podía calificarse de frialdad.

<p>—Vaya, vaya.

<p>Murmurando entre dientes una frase sofisticada que acababa de aprender, Cárcel ponía cara de aburrimiento. Como si la hubiera oído claramente desde lejos, Óscar giró la cabeza bruscamente para mirarlo.

<p>Era imposible que la hubiera oído, pero era de los que percibían con precisión fantasmal la energía malintencionada dirigida hacia él. Según el Duque Escalante, que solo conocía a su sobrino, esa era precisamente la marca de un monarca.

<p><span style="font-style:italic">... ¿O es que simplemente es de mente estrecha?</span>

<p>Cárcel fingió indiferencia, apartando la mirada de su primo y su prometida para mirar por la ventana. Desde allí se extendían los vastos jardines de la residencia del Duque Valeztena.

<p>Poseían una grandeza diferente en comparación con los ornamentados jardines de la casa del Duque Escalante. A pesar de ello, el aroma subyacente del dinero seguía siendo el mismo, pero él observó cada rincón del jardín, saboreando el fresco paisaje.

<p>No se trataba tanto de una razón o un gusto en particular, sino que sentía que desarrollar el ojo para esas cosas desde temprano era la esencia misma de ser adulto. Después de todo, era precisamente el tipo de cosas que los adultos solían hacer sin pensarlo mucho.

<p>—El personal  no estaba preparado para recibir a Su Alteza... ¿Cómo podemos compensar esta vergüenza?

<p>Sin embargo, por mucho que Cárcel lo intentara, nunca podía igualar la peculiar madurez de Inés. A veces, no solo parecía “madura”, sino que hablaba perfectamente como una adulta. Como si fuera solo una niña pequeña en apariencia.

<p>Para ser más precisos, era el epítome de un “adulto al que no le gustan los niños”

<p>Con expresión exasperada, llamó a la criada y se limpió las manos, con las que había estado ordenando las estanterías, en el paño húmedo que le trajo la chica.

<p>—Normalmente, debería haber avisado con al menos una semana de antelación de su visita. Sin embargo, por alguna razón, Su Alteza consideró que nuestra residencia era excesivamente informal y desatendió el protocolo, lo que nos llevó a cometer esta descortesía.

<p>Las palabras que salían de su pequeña boca no eran una disculpa por atreverse a ser descortés con el Príncipe Heredero. Era culparlo de que su propia ignorancia había provocado la descortesía.

<p>Se había acostumbrado un poco al discurso excesivamente fluido de Inés, por lo que ya no le sorprendía que no pudiera tener seis años. Pero tal falta de respeto descarada hacia el Príncipe Heredero...

<p>—¿Por qué te disculpas tan profusamente? Somos nosotros.

<p>Cárcel suspiró. Su primo había murmurado algo entre dientes y él había llegado a la conclusión de que la estaba maldiciendo. Sin embargo, no podía comprender la audacia de Inés al culparlo abiertamente. A primera vista, su voz era impecablemente educada y las palabras que él oía eran todas términos dignos como “lo normal” y “en mi habitación”

<p>Así que, al oír el comentario final sobre “cometer una impertinencia”, debió de suponer simplemente que estaba recibiendo una disculpa formal. A juzgar por su sonrisa, parecía completamente satisfecho con el comportamiento digno de Inés.

<p>Óscar, que se consideraba poseedor de un intelecto excepcional, más allá de ser simplemente maduro y ya prácticamente un adulto, nunca había conocido a un adulto que se burlara de él en su cara.

<p>Inés le lanzó una mirada desinteresada y poco sincera, como si supiera perfectamente que Óscar no entendería ni una pizca de su sarcasmo. Era aún más insolente precisamente porque estaba tan segura. A pesar de sus palabras vacías de arrepentimiento, no hizo ningún esfuerzo por mejorar la situación.

<p>—Los preparativos para Su Alteza Real el Príncipe Heredero son inadecuados, y sin la presencia de mi padre y mi madre, es muy difícil. Qué descaro hacia Su Alteza.

<p>Lo que realmente quiso decir: ¿Cómo se atreve a molestarme cuando mis padres no están aquí?

<p>—Está bien no estar preparado. No estoy aquí para ver a los Duques Valeztena; simplemente quería verte después de tanto tiempo.

<p>—Recuerdo haber visto a Su Alteza en la residencia de Osorno hace quince días.

<p>Lo que realmente quiso decir: No es que no nos hayamos visto en mucho tiempo, y ni estoy particularmente feliz de verte.

<p>Cárcel había adquirido el lenguaje de Inés hasta cierto punto, como si hubiera aprendido una lengua extranjera. Aunque la infancia tranquila de Cárcel significaba que nunca había conocido a adultos que se burlaran de él en su cara, tenía a Inés.

<p>Inmediatamente después de su compromiso, los intercambios entre las dos familias fueron más frecuentes que nunca, y pasaron más horas juntos que nunca. Ya no era el Cárcel de tres meses antes.

<p>—Ni siquiera podíamos mantener una conversación adecuada entonces.

<p>—Hubiera sido mejor si nos hubiéramos conocido en un entorno adecuadamente preparado.

<p>Así que ahora no era el caso.

<p>Sin embargo, Óscar era lamentablemente inconsciente en lo que respecta a Inés.

<p>—Ese libro del que me hablaste hace cuatro meses. “La vida de Don Juan”, de Andrés de Gonzalo. Lo leí por segunda vez hace unos días.

<p>—Ya veo.

<p>—Me conmovió tan profundamente y había tantos pasajes que me venían a la mente que simplemente no pude evitar volver a leerlo... Mi mente es así: a menos que relea un libro que me impacta, no puedo quitármelo de la cabeza. Ah, realmente amo demasiado los libros, es un verdadero problema...

<p>Para Cárcel, que había visto a Óscar quedarse dormido hipnotizado mientras leía ese mismo libro en múltiples ocasiones, era una afirmación increíble. Incluso una vez le había insistido a Cárcel para que pensara en una maldición para él, diciendo: “Es tan tedioso que quiero maldecir, pero ni siquiera se me ocurre una adecuada, es exasperante”

<p>Óscar poseía una aptitud excepcional para el estudio, pero, ya fuera por la influencia de su familia materna, los Escalante, una estirpe de honorables soldados durante generaciones, no tenía ni pizca de refinamiento literario.

<p>E Inés, como si fuera consciente de ello, sacaba a colación temas literarios de los que él no sabía nada cada vez que se encontraba con el Príncipe Heredero. Cuando su total ignorancia se hacía dolorosamente evidente, ella abandonaba la conversación con un tono que daba a entender: “No me apetece tratar con alguien tan ignorante”, hiriendo así el orgullo de Óscar, que se suponía que era el niño de diez años más inteligente del mundo, antes de alejarse con indiferencia...

<p>Sin embargo, leer libros era una tarea tan angustiosa para Óscar que, invariablemente, pasaba un tiempo considerable antes de que pudieran reanudar sus conversaciones.

<p>Inés respondió con una expresión poco acogedora.

<p>—El refinamiento literario es una de las actividades más nobles y apreciadas en Ortega. Su Majestad la Emperatriz estaría encantada. Una vez oí que detestaba ese tipo de libros.

<p>—Eso no puede ser cierto. Y yo los adoro hasta el punto de causarme problemas. Apenas me deja tiempo para estudiar el arte de gobernar...

<p>Incluso ahora, hablaba del arte de gobernar como para asegurarse de que Inés lo oyera. Cárcel se tragó un comentario sarcástico —“¿Por qué no te escribes “Príncipe Heredero” en la frente?”— mientras observaba los lamentables esfuerzos de su primo.

<p>—Eso sería bastante problemático, ¿no? Si interfiere con estudios más importantes... ¿Acaso le recomendé un libro poco aconsejable?

<p>—No, no. En absoluto. Sabes que estoy abrumado con todo tipo de estudios, sin un momento para tomar aliento. Discutir sobre puro intelecto contigo siempre es un placer.

<p>Y el hecho de que estuviera esforzándose al máximo para parecer lo más adulto posible. Ese esfuerzo obstinado hacía que cada frase sonara como un torpe trabajo de cortar y pegar...

<p>—Es el destino de nosotros los inteligentes sentirnos solos. Siempre tenemos que soportar la ignorancia de las masas.

<p><span style="font-style:italic">Destino, ignorancia... Estaba bromeando, ¿verdad?</span> Como si intuyera la pregunta repentina “¿Y qué hay de las masas?” que se formaba en la mente de Cárcel, Óscar señaló con la barbilla hacia Cárcel.

<p>—Puede que tu joven e ignorante prometido no comprenda el sufrimiento de personas como nosotros...

<p>—Bueno, eso...

<p>—Así que cuando te veo, solo entonces siento que puedo respirar un poco más tranquilo. ¿Sabes? Esta sensación.

<p>Inés miró a Óscar como si no tuviera ni idea de lo que estaba hablando, y solo entonces dirigió su mirada hacia Cárcel.

<p>Era un trato desdeñoso, como si hasta ese momento ni siquiera supiera que él estaba allí, pero ya no le sorprendía.

<p>—Todos los niños que nos rodean no son más que criaturas infantiles, tontas y torpes que parecen haber sufrido algún tipo de lesión cerebral.

<p>Volvió a señalar a Cárcel con la barbilla, como para ilustrar su argumento, rebosante de una conspiración para reforzar esa imagen. Inés no se unió a él; se limitó a observar a Cárcel en silencio.

<p>—Pero nosotros somos capaces de mantener una conversación tan elevada... ¿no es así?

<p>—Por supuesto, Su Alteza.

<p>—Aunque solo tienes seis años, siempre he respetado tu inteligencia.

<p>¿Era así como sonaban los extranjeros cuando aprendían solo palabras difíciles y hablaban orteguista? Óscar, a quien no le gustaban los libros, tenía un tutor dedicado exclusivamente a enseñarle vocabulario avanzado.

<p>Quizás el efecto secundario de eso era evidente en ese momento. Cárcel negó con la cabeza detrás de Óscar, luego frunció el ceño de nuevo y volvió a mirar hacia la estantería.

<p><span style="font-style:italic">Me llamó “mocoso de seis años”...</span>

<p>—Encontrar a alguien con quien puedas conversar así es difícil incluso siendo adulto. ¿Encontrar a alguien que esté a tu nivel intelectual? Eso será imposible para siempre.

<p>—No creo que eso sea necesariamente cierto...

<p>—Entonces, ¿por qué arriesgarse? Por un futuro incierto.

<p>Perdón?

<p>—Inés Valeztena de Pérez. Te estoy dando la oportunidad de deshacer tu decisión equivocada.

<p>—¿...?

<p>—Te lo pido formalmente, en nombre de la Familia Imperial Ortega.

<p>—¿Disculpe?

<p>—Cásate conmigo.

<p>Con esas palabras, se produjo un silencio sepulcral. Por encima del hombro de su primo de diez años, que había vendido el nombre real de Ortega sin el conocimiento del Emperador, Cárcel miró fijamente el rostro inmóvil y silencioso de su prometida.

<p>—Ya tengo un compañero. Alguien a quien Su Majestad conoce muy bien.

<p>—Cárcel es mi súbdito más leal. Puede ceder a su esposa.

<p><span style="font-style:italic">¿Yo? ¿Debo llegar tan lejos?</span> Fue el momento en que Cárcel ladeó la cabeza, desconcertado.

<p>—No me gusta.

<p>—Cárcel hace lo que yo le ordeno. Si no te gusta... Lo arreglaré para ti.

<p>—No. A mí... No me gusta Su Majestad.

<p>—...

<p>—Así que, mi respuesta es no.

<p>Esta vez, el silencio parecía no tener fin. Óscar, por supuesto, y Cárcel, paralizado por el absurdo giro de los acontecimientos, no podían mover ni un dedo. Mientras tanto, Inés se acercó a la ventana, se puso de puntillas y cerró la ventana que estaba entreabierta.

<p>Con el sonido del viento exterior silenciado, el estudio privado de la Duquesa quedó tan silencioso como un invernadero abandonado. Cárcel volvió la mirada hacia Óscar. Las yemas de los dedos de Óscar temblaban ligeramente.

<p>—...¿Por qué?

<p>Preguntó Óscar en voz baja, como si ni siquiera se atreviera a pronunciar la frase “no quiero”. Cárcel retrocedió en silencio.

<p><span style="font-style:italic">Aunque te arrepientas ahora, ya es demasiado tarde.</span>

<p>—Cárcel, ven aquí.

<p>Era la primera vez que Inés pronunciaba su nombre. Lo llamó como si fuera un cachorro, pero aun así era la primera vez. Sin embargo, antes de que pudiera sorprenderse por el gesto excepcional de su prometida, Cárcel negó con la cabeza apresuradamente.

<p>En ese momento, lo único sensato era alejarse de Óscar lo máximo posible.

<p>—Eres mi prometido. ¿Por qué no me defiendes?

<p>Era un tono altivo, pero de alguna manera sonaba como “¿Por qué no me atiendes?”, algo extraño de decir.

<p><span style="font-style:italic">¿Se suponía que debía ser divertido? Príncipe Heredero, prometido o lo que fuera...</span>

<p>—¿Por qué? Inés Valeztena de Pérez.

<p>—Cárcel.

<p>Ignorando la pregunta del Príncipe Heredero, Inés volvió a llamar a Cárcel. Mientras Cárcel fingía deliberadamente no oírla, Óscar espetó irritado:

<p>—Deja a ese mocoso fuera de esto.

<p>—Cárcel, Su Alteza Real me está poniendo en una situación incómoda. ¿Qué haces, qué no hablas tú en mi nombre siendo un hombre?

<p>Tras declarar abiertamente su antipatía en presencia del Príncipe Heredero, de repente adoptó el aire de una joven recatada incapaz de mantener conversaciones incómodas con los hombres directamente. Solo cuando le convenía...

<p>No era incomodidad, sino enfado. Gracias a ello, Cárcel, tratado como un hombre por Ortega con solo seis años, se vio obligado a permanecer a su lado por petición expresa de Inés.

<p>Todo porque había sido educada en exceso en las anticuadas costumbres de Ortega.

<p>—... Alteza. Mi prometida dice que la está incomodando..

<p>—Este no es un asunto de niños. Los adultos estamos teniendo una conversación.

<p>—Pero la señorita Valeztena tiene seis años.

<p>Decidió no mencionar que el mismo apenas tenía diez.

<p>—¿Crees que Inés es igual que tú?

<p>Dicen que querer y gustar son cosas diferentes, pero ahora parecían ser lo mismo. A su agotadoramente noble primo le gustaba Inés. De hecho, mucho... Cárcel ahora deseaba distanciarse aún más de Óscar. No había momento más peligroso que cuando Óscar estaba frustrado.

<p>Pero antes de que sus pies pudieran moverse, la mano de Inés se le adelantó, empujándole hacia delante.

<p>—...

<p>—¿Así que al final vas a dar un paso adelante?

<p>Entonces, como si intentara sutilmente escapar de la conversación, incluso dio un paso atrás detrás de él.

<p>Cárcel se volvió hacia Inés con incredulidad. Inés le giró amablemente la cabeza hacia delante.

<p>—No, no voy a dar un paso adelante.

<p>—¿Te atreves a dirigirte al Príncipe Heredero de una nación de manera tan informal?

<p>—Bueno, la señorita lo hizo primero.

<p>—¿Bueno qué? No, sal de aquí. Inés.

<p>Óscar, que ya había caído al nivel de un matón callejero desde que Inés le hizo esa lamentable petición a Cárcel —lamentablemente poco lamentable—, la llamó de nuevo, sin comprender aún lo absurdo de la escena.

<p>—Inés... Sé que estos no son tus verdaderos sentimientos.

<p>—Su Alteza.

<p>—En realidad no me detestas, ¿verdad? Sí, puedo ser pesado. Después de todo, soy quién está destinado a gobernar el Imperio. Tú eres la mujer más adecuada para ser Emperatriz, pero tu brillante mente podría encontrar opresivo un estatus tan elevado... Pero, Inés. Tú podrías ser mis alas.

<p>Cárcel mostraba una expresión abiertamente disgustada, pero Óscar ya no prestaba ninguna atención a su prima.

<p>—Tú y yo... gobernaremos Ortega. Este futuro inevitable puede que aún te resulte abrumadoramente pesado, ya que eres muy joven. Es natural que te preocupes por cómo podrás gestionar lo que hizo mi madre, si realmente podrás tener éxito. Pero debes saber esto: ya eres una mujer extraordinaria y no hay nadie más adecuado para ti que yo, ni siquiera entre las diecisiete familias de los Grandes de Ortega.

<p>—...

<p>—Pronto te darás cuenta. A medida que pase el tiempo y ese rubio despistado a tu lado madure, verás lo absolutamente mediocre que se vuelve... ¿Cuánto tiempo crees que durará ese rostro angelical? ¿Alguna vez has oído que cambie a peor? Ese rostro parece tener catorce años como mucho. ¿Pero este rostro? Cuanto más madure, más brillará.

<p>—...

<p>—No te fijes solo en el presente, mira más allá, hacia el futuro. Inés Valeztena de Pérez. Eres más inteligente que eso, ¿no? El matrimonio es una decisión que se toma una vez en la vida. No es algo que se pueda decidir a la ligera a una edad tan temprana...

<p>La pequeña mano de Inés tiró de repente del hombro de Cárcel. Sorprendido, Cárcel, que estaba absorto en la apasionada súplica de Óscar, se volvió hacia ella con sorpresa. Hasta ahora, la única vez que había tocado a su prometido fue durante la ceremonia de compromiso, cuando los adultos les obligaron a darse la mano.

<p>El tirón que lo atrajo hacia ella fue exquisitamente delicado, lo que obligó a Cárcel a inclinarse deliberadamente hacia ella, tal y como le exigían los modales que le había enseñado el Duque. De alguna manera, sintió un cosquilleo en la garganta.
	
<p>Inés le puso la mano en la oreja y le susurró.

<p>—Dile que simplemente no me gusta.

<p>—...

<p>Cárcel la vio alejarse de su oído con ojos confusos. El pequeño y delicado rostro de Inés se volvió severo, como instándole a seguir adelante.

<p>Se volvió para mirar a su futuro señor.

<p>—... Bueno, dice que no le gusta.

<p>—... Cárcel Escalante. Te lo estás inventando, ¿verdad?

<p>La pequeña mano de Inés lo volvió a tirar del hombro, acercando sus labios a su oído.

<p>—Di que no.

<p>—... Dijo que no, ah no.

<p>—¿No puedes separarte de Inés?

<p>Inés rodeó con sus brazos el brazo de Cárcel y lo volvió a tirar hacia ella. Esta vez, el tirón fue bastante fuerte.

<p>Como si no pudiera soportar ver a Cárcel con una expresión que parecía decir: “¿Qué puedo hacer? Ella me quiere tanto”, Óscar se acercó decididamente hacia ellos. Inés retrocedió instintivamente y Cárcel, cuyo brazo ella sostenía, se retiró con ella.

<p>Parecía como si estuviera protegiendo excesivamente el frente de Inés, como si protegiera a una mujer delicada de un matón callejero. Sin la más mínima intención.

<p>Gracias a esto, Óscar, ahora reducido a una posición indistinguible de la de un matón callejero, se dio cuenta de la imagen que estaba dando y su rostro se retorció de frustración.

<p>—Inés. Dame una razón. Una razón que pueda aceptar.

<p>Cárcel se tensó ligeramente, sintiendo cómo el cabello de Inés le hacía cosquillas en la oreja de nuevo al acercarse. Cabello negro, luego un suave aliento, su delicada mano protegiendo su oreja como si guardara su conversación secreta, y luego...

<p>—Dile que no hay una razón por la que lo rechace.

<p>—...

<p>—Simplemente no me gusta. De verdad, completamente, sin ninguna razón en absoluto.

<p>Cárcel se encontró con los severos ojos verdes de Inés, advirtiéndole que si no lo transmitía exactamente, ella no lo dejaría pasar. Ella velaría por su seguridad, pero si alteraba una sola palabra, no lo dejaría pasar...

<p>Como hipnotizado, miró a su futuro señor y abrió la boca.

<p>—Dice que no hay razón por la que lo rechace.

<p>—...

<p>—Simplemente no le gusta. De verdad, completamente, sin ninguna razón en absoluto...

<p>—¡Cállate, Cárcel Escalante!

<p>Inés le dio una palmada en el hombro a Cárcel. Era un gesto de ánimo, como diciendo: ya que lo has soltado, asume la responsabilidad.

<p>—Inés, esto es una artimaña de Escalante. ¿No es así?

<p>—Me siento mareada, Cárcel. ¿Me acompañas a mi habitación?

<p>A pesar de que Óscar se había dirigido a ella por su nombre, Inés le habló a Cárcel como si Óscar ya no estuviera presente. Y con una extraña indiferencia.

<p>El Príncipe Heredero había cedido el derecho a hablar a Cárcel, alegando protección, pero eso ya no tenía sentido. Dado que el Príncipe Heredero la había convocado directamente, era una formalidad completamente inútil.

<p>Afirmar que ya no tenía derecho a hablar directamente y, por lo tanto, negarse a responder a la pregunta del Príncipe Heredero era una completa sofistería...

<p>—Cárcel. Muévete.

<p>—De repente me duele mucho la cabeza. Cárcel.

<p>Cárcel miró fijamente durante un momento a su prometida, que estaba explotando absurdamente una costumbre centenaria y obsoleta que ya nadie respetaba.

<p>Estaba claro que no había transferido el derecho a hablar con el Príncipe Heredero a su prometido; había adquirido el derecho a ignorarlo por completo.

<p>—Soy tu señor. Cárcel.

<p>—¿Me ayudarías a levantarme primero? Cárcel.

<p>—Mira directamente a tu señor, Cárcel.

<p>—Hay demasiado ruido aquí... Cárcel.

<p>Ahora estaban enzarzados en una batalla de nervios, con Cárcel atrapado en medio. Una pelea peculiar. Cárcel miró una vez a su ruidoso futuro señor y luego una vez a su extraña prometida.

<p>¿No podía abandonarlos a ambos?

<p><span style="font-style:italic">¿Por qué demonios tenía que ser la vida tan agotadora?</span> Cárcel ya sentía el cansancio de la existencia y las cargas de la vida social. Dominar esto, la responsabilidad de la sucesión aquello, el joven Duque esto... Nada de eso le convenía en lo más mínimo desde el principio.

<p>Solo tenía seis años. Por muy inteligente que fuera para su edad, aunque pronto fuera a convertirse en un digno niño de siete años...

<p>—Sigues siendo un niño de seis años. No existe tal cosa como un señor.

<p>En ese instante, Inés Valeztena atravesó la abertura como si hubiera visto directamente en su corazón. Al igual que el cuervo del sabio legendario, tenía un halo misterioso detrás de ella... En ese momento, la puesta de sol teñía el cabello negro de Inés.

<p>—¡Cárcel!

<p>Fue el momento en que Cárcel tomó por primera vez la mano de Inés Valeztena.

<p>—Ya puedes soltarme.

<p>—Antes dijiste que te sentías mareada.

<p>—Sabes perfectamente que no era cierto.

<p>Inés se liberó de la mano de Cárcel antes de que él pudiera soltarla.
	
<p>Ya lejos del estudio privado de Inés, en medio del pasillo, Cárcel miró atrás una vez más, preguntándose si Óscar estaría siguiéndolos, y comentó, completamente exasperado:

<p>—¿Y si Su Alteza nos ve?

<p>La parte sobre que caminaba perfectamente bien así... parecía mejor no decirla. Porque Inés lo miraba con una expresión de total irritación.

<p>—Puede que sí o puede que no.

<p>Por supuesto, eso era cierto. Teniendo en cuenta el alboroto que había montado delante del propio Príncipe Heredero, con una cara que no mostraba ni una pizca de dolor, quejándose de mareos y exigiendo apoyo, todo ello con la mayor indiferencia, ¿qué problema podía haber en caminar rápidamente por su cuenta en un lugar donde el Príncipe Heredero no pudiera verlo?

<p>Sin embargo, una pregunta inquebrantable permanecía en la mente de Cárcel.

<p>—...¿No le tienes miedo al mañana?

<p>¿Qué hay del bienestar de la familia? Si hubiera aprendido la palabra “bienestar” de antemano, también habría preguntado eso. Inés respondió con indiferencia.

<p>—La familia Imperial nunca se avergonzaría reprimiendo a la familia Valeztena por algo como eso.

<p>Sin duda, era un asunto digno de vergüenza. Cárcel recordó la expresión de Óscar, como si lo hubieran pisoteado. La familia Valeztena era una de las casas nobles más poderosas entre los Grandes de Ortega. Ocupaba una posición en la que la corte imperial no podía castigarlos a la ligera por unas simples palabras intercambiadas entre niños.

<p>—La vergüenza es suya. Y ha sido tu primo quien me ha estado atormentando todo este tiempo. Si alguien le dijera algo de esto a padre o a madre, las divagaciones que me ha soltado hoy el Príncipe Heredero...

<p>La expresión decidida de Inés se nubló momentáneamente. Debía de haber recordado la grandilocuente propuesta del Príncipe Heredero.

<p>La expresión de Cárcel se agrió ligeramente a su vez.

<p><span style="font-style:italic">Aaah...</span>

<p>—... Transcribiré cada palabra de ese tedioso discurso, hasta la última coma, y lo enviaré en forma de carta a la Gaceta de la Sociedad Mentor. Entonces veremos quién acaba en más problemas.

<p>—¿Carta?

<p>Cárcel entrecerró los ojos, frunciendo el ceño ante el término desconocido, e Inés hizo un gesto con la mano para restarle importancia.

<p>—¿Por qué te estoy diciendo esto…?

<p>Dado que lo estaba diciendo en voz alta en lugar de transmitirlo con su expresión, como solía hacer, estaba siendo bastante amable con el Cárcel de hoy. Él la ignoró alegremente, con la intención de buscar el significado de la palabra cuando llegara a casa, y entró en su habitación con ella.

<p>Había perdido la oportunidad de preguntar si podía marcharse ya.

<p>—De todos modos, tú también, recuerda una cosa cuando veas al Príncipe Heredero.

<p>—...

<p>—Lo fácil que puede ser la vida cuando te aferras al recuerdo vergonzoso de otra persona... Si el Príncipe Heredero te molesta de nuevo, recuérdale lo que ha pasado hoy.

<p>Inés dijo esto y luego se quitó el anillo con impaciencia. Estaba demasiado ocupada yendo y viniendo entre el escritorio y la consola como para siquiera mirar a Cárcel, que seguía de pie, incómodo, junto a la puerta.

<p>Cárcel se encontró contemplando la desconocida habitación de su prometida, que de alguna manera había terminado allí por primera vez, y se quedó en silencio. No era exactamente el mismo tipo de vergüenza del que hablaba Inés, pero, de alguna manera, se sentía avergonzado de todos modos.

<p>—Bella, agua.

<p>A la llamada de Inés, una criada apareció de algún lugar desconocido, llevando un gran cuenco. Inesperadamente, no era agua para beber, sino agua para lavarse las manos.

<p>Se frotó las manos con un vigor que parecía casi obsesivo. Ahora que lo pensaba, era la primera vez que Cárcel veía a Inés lavarse las manos. Aprovechando que Inés no lo miraba, Cárcel la observó como si la estuviera estudiando.

<p><span style="font-style:italic">Tampoco es muy bonita...</span> Aunque verla fruncir su pequeña frente y frotarse las manos con tanta intensidad, casi como si las mirara con ira, era quizás un poco bonito... <span style="font-style:italic">¿Era bonito?</span> Ella no parecía hacer cosas bonitas ni siquiera delante de sus propios padres, así que él no estaba del todo seguro.

<p>Los niños suelen ser pequeños, y las cosas pequeñas suelen ser bonitas, por lo que incluso el niño más extraño puede ser bonito.

<p>Cárcel admitió a regañadientes la ligera ternura de Inés.

<p>Al menos su rostro no tenía rasgos afilados, aunque era cierto que le faltaba algo para tener a un marido como él a su lado... Se vio reflejado en un espejo convenientemente colocado en la pared cercana y pensó, sin una pizca de admiración:

<p><span style="font-style:italic">No, incluso si lo es, sigo siendo demasiado bueno para ella.</span>

<p>—¿Escalante?

<p><span style="font-style:italic">¿Era por el Príncipe Heredero y la serie de acontecimientos?</span> Sin darse cuenta, se volvió hacia ella como un perro llamado por su amo, pero luego, al darse cuenta de que era un poco indigno, se apartó con elegancia.

<p>Fuera quien fuera demasiado bueno para el otro, él estaba pensando en casarse, por lo que sentía que era necesario mantener cierta dignidad.

<p>—Ven aquí.

<p>—Aunque estemos prometidos, aún no nos hemos casado. No puedo andar por el dormitorio de una mujer...

<p>—... Sigues teniendo seis años, Escalante.

<p>Inés lo repitió como un suspiro. Como si ella misma no tuviera seis años.

<p>—Aunque durmieras en mi cama, nadie diría nada.

<p>—¿De verdad te parece bien?

<p>—¿Te volviste loco?

<p>—Yo tampoco quería hacerlo.

<p>Cárcel se recuperó rápidamente. Entonces, ante el gesto de Inés, se encontró inexplicablemente caminando hacia ella.

<p>En ese momento, una criada trajo un cuenco con agua fresca. Inés lo señaló con la barbilla.

<p>—Lávate las manos.

<p>—¿Por qué?

<p>—Todos en mi habitación deben estar limpios.

<p>—...¿Entonces me voy?

<p>A pesar de preguntarlo, sus manos ya estaban en el cuenco de agua. Curiosamente, desde hacía un rato, no dejaba de hacer exactamente lo que ella le decía. Inés respondió con indiferencia.

<p>—Tu primo sigue en la residencia Valeztena. Por lo tanto, debes quedarte conmigo.

<p>Tratando a su prometido como un mero escudo y refiriéndose al Príncipe Heredero como nada más que “tu primo”, Inés tomó un paño seco de la criada. Cuando Cárcel extendió sus manos lavadas a toda prisa como para secarlas, ella negó con la cabeza con firmeza y señaló con la barbilla hacia el cuenco de agua.

<p>—Lávalas bien.

<p>—...Si sabes que no eres la Duquesa, ¿cierto?

<p>—Lávalas. Me gustan las cosas limpias.

<p>Él quería protestar diciendo que lo que a ella le gustara no era asunto suyo, pero por alguna razón no se molestó en discutir. <span style="font-style:italic">De alguna manera... ¿por qué sigo pensando “de alguna manera”?</span> En medio de la confusión, Cárcel se frotó las manos diligentemente hasta que quedaron relucientes y luego las volvió a extender.

<p>—Toma.

<p>Quería que le entregaran el paño, pero lo que se posó sobre sus manos fue la mano de Inés sosteniendo el paño. Cárcel se sintió bastante nervioso. Ella misma le estaba secando las manos.

<p>Era casi como si lo tratara como si no pudiera arreglárselas solo...

<p>—...

<p>Aunque su madre, su niñera o las criadas le habían lavado las manos innumerables veces, era la primera vez que sentía tanta vergüenza. Le ardían las orejas. Como si temiera encontrarse con la mirada de Inés, Cárcel bajó la cabeza.

<p>Sus manos eran pequeñas, pero las de ella lo eran aún más. El roce entre sus dedos y el interior de sus palmas era meticuloso, nunca torpe... pero eran manos de chica. De chica... Aunque había bajado la cabeza para evitar el accidente de encontrarse con la mirada de Inés inesperadamente, ver sus manos blancas le dejaba sin ningún otro sitio donde mirar, una sensación completamente incómoda.

<p>Era la primera vez que miraba tan fijamente las manos de Inés, las manos de una chica. Había tantas cosas que veía por primera vez que le resultaba desconcertante. Todo era nuevo.

<p>Cárcel mantuvo la cabeza gacha hasta que Inés terminó su breve tarea y se alejó, y entonces volvió a levantar la vista.

<p>—¿Qué pasa?

<p><span style="font-style:italic">Exacto, ni siquiera era bonita.</span>

<p>—¿Escalante?

<p>—... No me llamaste por mi apellido antes.

<p>Le inquietaba que su propia voz sonara de algún modo resentida. Inés, que había estado sentada en el sofá debajo de la ventana, sonrió de repente.

<p>—¿Quieres que te llame por tu nombre?

<p>—...

<p>—Creía que no te gustaba.

<p>—No, no.

<p>Una negación de que no quería que ella lo llamara por su nombre, otra negación de que no le desagradaba exactamente. Sin embargo, Inés parecía indiferente y se encogió de hombros.

<p>—Lloraste porque no querías casarte con Inés Valeztena.

<p>—¡¿Cuándo lloré...?!

<p>Había llorado. El primer día que Inés lo había señalado con el dedo.

<p>—Luego lloraste de nuevo cuando te dije que tendrías que vivir conmigo hasta la muerte.

<p>—...

<p>—Y otra vez cuando te dije que tendríamos que tener hijos…

<p>—Basta, Valeztena.

<p>Las orejas de Cárcel se sonrojaron. <span style="font-style:italic">¿Por qué debería ser yo quien se sienta avergonzado...?</span> Hoy no era un buen día. Eso estaba claro. Dondequiera que iba, todas las personas con las que se encontraba le regañaban, se burlaban de él, le trataban como a un chiste...

<p>—Está bien. Te llamaré Cárcel.

<p>Sus mejillas se sonrojaron al oír esa voz. Parecía completamente patético, como un joven Duque que nunca había hablado con una chica. Estaba claramente hechizado por algo. Inquieto, completamente perdido, se quedó mirando el lugar donde ella estaba sentada, cuando Inés le dio un golpecito en el asiento junto a ella.

<p>—Ven aquí.

<p>Esa voz otra vez. El tipo de voz que se usa para llamar a un perro... Sin embargo, como siempre, no era fría.

<p>Caminó con rigidez y se sentó junto a Inés. En el mismo momento en que le hace señas para que se acerque, ella está hojeando un libro que ha aparecido de repente de algún sitio... con total indiferencia.

<p>La verdad es que nunca había recibido un trato así en su vida. Al menos, no dentro de los límites de la memoria de Cárcel, de seis años.

<p>Solo Inés Valeztena hacía eso.

<p>—... Eres rara.

<p>—¿Yo?

<p>—La gente dice que te gusto.

<p>Cárcel añadió “la gente” con tono incómodo, como si él mismo no acabara de entenderlo. Cuando Inés no respondió a las palabras que había soltado, se puso un poco nervioso y soltó algo más.

<p>—Pero si te gusta alguien... no lo tratarías así.

<p>—¿Cómo?

<p>—Siendo tan brusca, sin sonreír casi nunca, sin parecer contenta de verlo, actuando como si estuvieras molesta...

<p>Mientras Cárcel murmuraba, dando golpecitos con los pies en el suelo, ella fue directa al grano.

<p>—Deja de murmurar y dilo claramente.

<p>—... Mira, así...

<p>—Termina lo que empezaste.

<p>—... Justo así.

<p>Su cara se descompuso por completo. <span style="font-style:italic">¿Quién demonios criticaría así a alguien que le gustaba?</span>

<p>—Es raro. Es raro, te lo digo yo.

<p>—¿Es raro que me gustes?

<p>—No, tú eres rara.

<p>Cárcel respondió con una decisión tajante. Entonces, su rostro se sonrojó de nuevo y tartamudeó tardíamente.

<p>—...Bien, entonces ¿te gusto?

<p>Inés se limitó a encogerse de hombros, con su expresión tan obstinada como siempre. El rostro de Cárcel se torció. <span style="font-style:italic">¿Qué demonios era eso...?</span>

<p>—¿Te gusto? ¿Qué se supone que significa eso?

<p>—Si no me gustaras, no habría dicho que me casaría contigo.

<p>Su respuesta fue ambigua, pero en contexto, parecía suficientemente afirmativa. Gracias a eso, se sintió algo satisfecho, y luego se preguntó por qué demonios estaba satisfecho. Su mente se sentía dispersa.

<p>—La gente dice que aún eres demasiado joven para comprender el honor de ser la esposa del Príncipe Heredero.

<p>—Sí.

<p>—Por eso, dicen que me elegiste solo porque soy bonito.

<p>Cárcel lo afirmó sin una pizca de vacilación. Inés, que había estado apoyando la barbilla en silencio y mirándolo fijamente, lo reconoció con refrescante franqueza.

<p>—Es cierto. Solo me fijé en tu cara.

<p>—...

<p>—¿Hay alguien a quien no le guste las cosas bonitas?

<p>—¿Entonces te gusta de verdad mi cara?

<p>—Sí. Es útil.

<p>—¿...?

<p><span style="font-style:italic"¿Útil? ¿Para qué? ¿Soy algún tipo de objeto?</span> Sin expresar ninguna de las preguntas que le vinieron inmediatamente a la mente, Cárcel la miró.

<p>A pesar de una respuesta tan significativa, su actitud hacia él se había vuelto indiferente una vez más. Miró con el ceño fruncido a Inés, que estaba hojeando un libro, y pensó.

<p><span style="font-style:italic"Una cara bonita en la infancia se convierte inevitablemente en una cara atractiva.</span>

<p>Independientemente del género, era una cara de simetría perfecta y hermosa, pero también tenía rasgos masculinos de su abuelo y su padre. A este ritmo, sin duda crecería hasta ser tan atractivo que resultaría agotador.

<p><span style="font-style:italic">Claro...</span> Entonces ese potencial para el futuro era precisamente la utilidad que su prometida podía juzgar.

<p>Aun así, hablar de la utilidad de una persona...

<p>—... Ser útil, eso es algo bueno, ¿no?

<p>—Sí. Por supuesto.

<p>—¿Entonces te gusto?

<p>—Digamos que sí.

<p>—¿Te gusto y eres tan arrogante? ¿No piensas en intentar impresionarme?

<p>—¿Qué me falta para impresionarte?

<p><span style="font-style:italic">¿No le falta nada...?</span> Cárcel parpadeó sin comprender antes de responder.

<p>—No, es porque te gusto. Así que si quieres que yo te guste también, entonces, naturalmente...

<p>—No, no es eso. No es eso, Cárcel.

<p>Inés negó con la cabeza con firmeza y dijo:

<p>—No tengo que gustarte.

<p>—...

<p>—No lo necesito, Cárcel.

<p>—¿...?

<p>—Eso es el amor. No esperar nada a cambio.

<p>Su expresión estaba muy lejos del amor. Sin embargo, Cárcel ya la escuchaba con atención.

<p>—Entonces, ¿lo que estás diciendo es que te gusto, pero no tienes que gustarme a mi?

<p>—Exactamente.

<p>—... ¿Y tú me quieres?

<p>Inés se encogió de hombros de nuevo. Como diciendo: piensa lo que quieras. Demasiado tímida para decirlo abiertamente, parecía... Era una chica vergonzosa, a pesar de las apariencias.

<p>La mitad de los rostros de Cárcel e Inés se reflejaban en un espejo lejano. Cárcel solo miró su propia mitad y pensó que era, sin duda, un rostro que cualquiera podría amar.

<p>—...Aun así, no lo entiendo. Dices que te gusto, pero no lo demuestras en absoluto.

<p>—Un noble del linaje de los Grandes de Ortega, una persona digna, no muestra sus sentimientos privados. Anótalo en algún lado.

<p>—¿Así que ocultas deliberadamente que te gusto?

<p>—Así es.

<p>—¿Entonces no me elegiste porque realmente te gustaba?

<p>—Exactamente... ¿Por qué demonios iba a hacer eso?

<p>Ella asintió con sinceridad, pero pareció momentáneamente nerviosa. Aunque respondió así, su expresión sugería que no esperaba que él se diera cuenta y señalara tal contradicción. Era el rostro de alguien que, habiendo subestimado a Cárcel por completo, no había considerado en absoluto algo tan simple.

<p>Pero el joven Cárcel no se dio cuenta. Estaba demasiado ocupado ocultando su rostro sonrojado.

<p>¿Por qué se sentía tan avergonzado?

<p>Durante seis años —pocos si se quiere, muchos si se debe—, Cárcel había soportado más de cien confesiones de jóvenes damas, su excesiva atención y sus demostraciones de afecto autoritarias, desde sus primeros recuerdos.

<p>Las chicas que le declaraban su afecto ya no tenían ningún significado especial. Habían habido demasiadas. Se había convertido en una fuente de vergüenza agotadora. Pero entonces, ¿por qué Inés Valeztena, que no era particularmente bonita, ni especialmente amable, ni propensa a la simpatía, por qué ella?

<p>¿Por qué demonios le gustaba a una chica como ella?

<p>—Cárcel Escalante. Recuérdalo.

<p>—... ¿Qué?

<p>—Que me gustas mucho.

<p>Se lo repitió, como si le estuviera lavando el cerebro. <span style="font-style:italic">Me gustas. ¿Sabes? Recuérdalo.</span> Él asintió como si lo supiera perfectamente, pero se quedó mirando a Inés como hipnotizado.

<p>Si iba a lavarle el cerebro, ¿no sería mejor lavarle el cerebro para que le gustara? La idea se le pasó por la cabeza, pero Cárcel no creía que Inés fuera ese tipo de niña calculadora. Puede que actuara como una adulta, o como una adulta desagradable a veces, pero en el fondo seguía siendo una niña.

<p>Cárcel pensó que no era necesario enseñarle esos trucos. Por ahora, dejaría que le gustara de forma pura. ¿Qué agotador debía de ser mantener esa farsa? Gustarle tanto y tratarlo con tanta frialdad requería sin duda una paciencia sobrehumana.

<p>Si tratar a Cárcel con desprecio era su forma de expresar vergüenza, no había necesidad de desanimarse por cada caso. Con esa única declaración de que le gustaba, Inés se convirtió en una más de las innumerables chicas que habían pasado por su vida, perdiendo cualquier significado especial y volviéndose ordinaria.

<p>En el mundo amable de Cárcel, donde había sido gentil con todas las chicas, Inés, que lo había elegido primero pero luego lo había ignorado, tenía que ser inusual. Eso también había terminado ahora. Por supuesto, se casarían, pero ella nunca más se dejaría influir por esa voz. Nunca más...

<p>—¿Cárcel? ¿Podrías traer un cojín de esa mesa de allí?

<p>Cárcel se levantó por reflejo, pero luego vaciló.

<p>—¿Y tu criada?

<p>—Acaba de irse.

<p>—Cuando llegue...

<p>—Ahora no hay ninguna criada aquí.

<p>"Así que deberías hacerlo tú", era la implicación obvia.

<p>—Eres mi prometido.

<p>No sabía qué hacer con su rostro, que se le encendía en los momentos más inoportunos. Si hubiera escuchado con atención, se habría dado cuenta. En ese momento, Inés trataba a su criada y a su prometido como iguales.

<p>Pero Cárcel estaba demasiado ocupado tratando de ocultar su rostro sonrojado. Se levantó rápidamente e hizo lo que ella le dijo. Trajo el cojín y ella le pidió otra cosa. Lo hizo y, tan pronto como se sentó de nuevo, ella le pidió que hiciera otra cosa. Sentada sin mover un dedo, pero dando órdenes de aquí para allá... de alguna manera parecía que dependía de él, y eso era de alguna manera bastante lindo...

<p><div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—¿Lindo? ¿Quién?

<p>Era Cárcel Escalante, de veintitrés años una vez más. Estaba sentado con las piernas cruzadas en el dormitorio de su prometida, mirando con recelo la habitación vacía.

<p><span style="font-style:italic">Lindo, y una mierda. ¿Quién era lindo?</span>

<p>Que ese recuerdo lejano siguiera tan vivo se debía a la escena en la habitación de Inés. ¿Cuándo fue la última vez que estuvo en esa habitación...? Ah, sí. A los veinte años, cuando se graduó en la academia y estaba a punto de incorporarse a la flota costera en Calstera.

<p>Y ese día, había tenido exactamente el mismo pensamiento que hoy. ¿Podría ser que el tiempo solo se detuviera en esta habitación?

<p>La habitación de Inés parecía realmente congelada en el tiempo. Seis, diez, catorce, diecisiete, veinte y veintitrés años... A lo largo de mucho tiempo, su entorno permaneció tan inmutable como su expresión.

<p>¿No era extraño? La hija de la Duquesa de seis años y la hija de la Duquesa de veintitrés, ahora en edad de casarse. Encontrar puntos en común en sus gustos ya sería bastante difícil, pero ni un solo mueble pequeño, ni siquiera el color de las cortinas, había cambiado. Esta perfecta inmutabilidad no se debía a que la Inés de veintitrés años tuviera gustos tan infantiles como los de una niña de seis.

<p>—Ya eras adulta a los seis años, no.

<p>Aun así, era la mujer con la que iba a casarse. Así que llamémoslo gusto de adulto.

<p>—...Rara desde el inicio.

<p>Había sido rara desde su primer encuentro, rara desde el momento en que ella lo había elegido deliberadamente, rara incluso cuando había dicho que le gustaba.

<p>Mirando atrás ahora, era una relación que no tenía ni un solo aspecto sensato de principio a fin. Cárcel seguía examinando los detalles de la habitación con ojo escéptico. Por mucho que escudriñara cada rincón, nada parecía diferente.

<p>Que la habitación fuera tan aburrida, a imagen y semejanza de su propietaria, no era del todo sorprendente. Sin embargo, ahora estaba buscando algo.

<p>Algo parecido a una pista que indicara un cambio de opinión.

<p><span style="color:#777777">—Así de poco me importas, Escalante.</span>

<p><span style="font-style:italic">Claro. Eso no es tolerancia. Pero ¿por qué?</span> Cárcel seguía dando vueltas al mismo punto, como si estuviera caminando por un laberinto.

<p>¿Una ilusión? ¿Una alucinación? Siete, ocho, nueve, diez y luego once... Al recordar a la tímida chica que le había enviado innumerables regalos y cartas, llegó a la conclusión de que seguía sin tener sentido.

<p>¿No eran esas palabras directas y expresiones rígidas, en última instancia, solo parte de su timidez? A diferencia de su comportamiento en persona, su prometida había utilizado en alguna ocasión un lenguaje extremadamente afectuoso. Es decir, por escrito.

<p>Aunque Inés siempre era de las que soltaba tediosas moralinas, sermones o comentarios despectivos en cuanto abría la boca —y aun así, rara vez hablaba, por lo que era difícil escucharla—, al menos sus cartas revelaban sus verdaderos sentimientos.

<p>Innumerables palabras que expresaban preocupación e inquietud por él. Bendiciones afectuosas y declaraciones de amor. Expresiones apasionadas a las que él no tenía forma de responder, ningún afecto que devolver...

<p>A Inés Valeztena le había gustado tanto en su día que rayaba en lo tedioso. Sin duda.

<p><span style="font-style:italic">¿...Estará en sus días?</span>

<p>Cárcel sintió una sensación de déjà vu en sus propios pensamientos.

<p>No, bueno... todo esto se volvió menos frecuente una vez que entraron en la adolescencia.

<p>La adolescencia, después de todo. Las voces cambian, los cuerpos cambian, y es perfectamente natural que los chicos y chicas que crecen torpemente se sientan incómodos entre sí, ¿no? Por supuesto, era impensable que el joven Cárcel se sintiera intimidado por una chica, pero Inés siempre fue su excepción.

<p>En aquel entonces, ambos eran torpes. Era natural que la distancia aumentara. Y luego, en algún momento, ella dejó incluso de llamarlo por su nombre, y luego, en algún momento...

<p>Cárcel se cubrió el rostro con la palma de la mano y murmuró.

<p><span style="font-style:italic">¿Fue en ese momento? ¿O antes de que entrara en la academia...?</span>

<p>De repente, se le ocurrieron demasiadas posibilidades.

<p>Inés solía ser tan sombría y rígida que era difícil notar los cambios, pero si se pensaba detenidamente, se podía percibir la diferencia.

<p>No. Era extraño, después de todo. Incluso después, la inquebrantable devoción de Inés hacia él era famosa en toda la sociedad de Mendoza. A pesar de todas las miradas desagradables que le dirigían...

<p>—... ¿Qué es esto, Escalante?

<p>En cuanto Inés entró en la habitación, vio a Cárcel sentado al otro lado y le preguntó.

<p>Al menos no ha recurrido al lenguaje formal desde entonces... Cárcel marcó un punto a su favor y se recostó en la silla con fingida indiferencia.

<p>No debía responder inmediatamente, como si estuviera esperando ese momento. Nada parecería más patético.

<p>Se tomó unos segundos para observar a Inés: el vestido azul marino oscuro que llevaba, los botones abrochados hasta el cuello, el pelo negro recogido en un moño firme, sin un solo mechón fuera de lugar.

<p>En verdad, cada vez que la veía, su apariencia distaba mucho de ser adornada. Incluso eso permanecía inalterable desde la infancia, pero algo había cambiado dentro de esa habitación.

<p>Esa figura, tan bien formada que resultaba deseable, imposible de ocultar incluso con ese atuendo fúnebre...

<p>Era el único rayo de luz para Cárcel en medio del matrimonio fúnebre que le esperaba. Especialmente esos pechos... Incluso mientras albergaba pensamientos tan vulgares, mantener una expresión solemne como si estuviera contemplando algo serio resultaba muy conveniente. <span style="font-style:italic">Como si ser guapo no fuera suficiente...</span>

<p>—... ¿Por qué no te interesa?

<p>Contrariamente a su aparente actitud relajada, las palabras que brotaron directamente de los labios esculpidos de Cárcel fueron directas al grano.

<p>Inés, que se había estado lavando las manos de espaldas a él, como si hubiera olvidado por completo que Cárcel existía, suspiró sin siquiera volverse a mirarlo.

<p>—Inés.

<p>—¿Por qué te importa?

<p>—¿Por qué no te importa a ti?

<p>Ella terminó de lavarse las manos con calma, a pesar del aluvión de preguntas. Su hábito compulsivo de lavarse las manos seguía siendo el mismo, entonces como ahora.

<p>Cárcel había decidido ser el más tranquilo, así que esperó en silencio.

<p>—No significa nada.

<p>Por fin, Inés se dio la vuelta, con las manos secas. Más que su seca respuesta, fue la rara mirada que le lanzó lo que hizo que Cárcel se estremeciera.

<p>Como un viejo hábito, se sintió momentáneamente intimidado. Pero ya no era ese niño; era un fornido oficial en su tercer año de servicio. Cárcel se enderezó.

<p>—Esa respuesta no es suficiente.

<p>—Que lo consideres suficiente o no es algo que poco me importa...

<p>—Inés Valeztena.

<p>Ella reveló brevemente una expresión de total exasperación y enfado, pero enseguida se recompuso.

<p>—Lo dije para tranquilizarte.

<p>—... ¿Y?

<p>—Dije que estaba bien porque ya lo sabía, que no tenías que preocuparte por mí, que no había necesidad de dar explicaciones, que simplemente hicieras lo que quisieras.

<p>—...

<p>—¿Hay algo aquí que te parezca insuficiente, aunque sea mínimamente?

<p>Cárcel frunció su hermosa frente. Siguió un breve silencio.

<p>Él murmuró como si de repente se hubiera dado cuenta de algo.

<p>—Claro. Estabas enfadada.

<p>—...

<p>—Por eso estabas siendo tan sarcástica.

<p>—... ¿Yo? ¿Cuándo?

<p>Por mucho que lo pensara, esa era la única respuesta razonable.

<p>—De lo contrario, no te habrías estado forzando a decir cosas que no sentías.

<p>—¿Qué tiene eso de forzado?

<p>—Dijiste que no era tolerancia, pero en realidad sí lo es. Y, en realidad, tampoco lo es.

<p>La expresión serena de Inés se nubló ligeramente. Era evidente que quería preguntar qué tontería era esa, pero Cárcel interpretó esa mirada como egocéntrica y continuó.

<p>—Inés Valeztena, tienes tendencia a dar demasiada importancia al decoro. Así que, naturalmente, los celos, darle vueltas a las cosas, pegarme, enfadarte... todo eso debe resultarte incómodo.

<p>—En absoluto.

<p>—Si tampoco es eso, entonces seguro, seguro que solo estás observando mis reacciones...

<p>¿Cuántas nobles lamentables, con el corazón hirviendo por la infidelidad de su cónyuge, no se atreven a mostrarlo por miedo a la reacción de su marido? Por supuesto, aún no eran cónyuges, pero pronto lo serían. Además, a Inés le gustaba de forma unilateral, o le había gustado...

<p>Pero tan pronto como las palabras salieron de su boca, Cárcel se dio cuenta de lo absurdas que eran, así que abandonó la idea antes de terminar.

<p>Quién cuidaba las espaldas de quién, en realidad... Inés resopló como si le hubiera leído el pensamiento.

<p>—Incluso tú debes darte cuenta de que eso es una completa tontería.

<p>—Sí.

<p>—Sea lo que sea, Escalante, ¿qué importa todo esto?

<p>—...

<p>—Cualquiera que nos viera pensaría que tengo un amante.

<p>—¿Lo tienes?

<p>—¿Acaso importa?

<p>Cárcel se obligó a dejar de asentir distraídamente con la cabeza. Inés dejó escapar un suspiro silencioso.

<p>—Soy una flor en la pared que nadie nota, el cuervo de Valeztena. Como dijo una vez tu primo.

<p>—... La razón por la que los hombres no te cortejan es porque ya tienes un prometido excesivamente guapo. Y...

<p>Dada su vestimenta habitual, era natural que pasara desapercibida, pero en ocasiones destacaba como un cuervo posado entre pájaros de colores.

<p><span style="font-style:italic">Así que, con esa figura, unos cuantos nobles torpes...</span> Los labios de Cárcel se crisparon como si quisiera decir algo más, pero simplemente los cerró.

<p>Como un idiota, no podía exponer su pecho o su cintura como prueba del argumento “Es solo porque soy excesivamente guapo, no porque tú seas particularmente poco atractiva” ante ese rostro noble.

<p>—Y la razón por la que las mujeres te persiguen tanto es porque, a diferencia de ti, mi encanto no es tan amenazante.

<p>—...

<p>—Lo sé. Y realmente no me importa... Escalante, de verdad, lo digo en serio. Si tiene que haber un interrogatorio entre nosotros, debería ser yo quien te interrogara a ti, y no al revés. Pero, sinceramente, no quiero hacerlo. Es demasiado complicado... demasiado agotador.

<p>—...

<p>—No tiene sentido entre nosotros.

<p>—...

<p>—Así que deja esta locura de interrogarme solo porque yo no te interrogo ni te atormento.

<p>Inés negó enérgicamente con la cabeza y pasó junto a Cárcel. Él se quedó mirando fijamente el lugar donde ella había desaparecido, y solo volvió la cabeza tras un momento de retraso.

<p>—Entonces, lo que estás diciendo es que nuestra relación es...

<p>—... Es un buen hombre para casarse.

<p>Era la primera vez que oía esas palabras. Ni siquiera las innumerables mujeres que habían alejado a Inés y querían casarse con él estarían de acuerdo.

<p>—No tengo ninguna queja sobre este matrimonio. Tú tampoco deberías tenerla... No hay razón para arruinar nuestra relación por un asunto tan trivial.

<p>—... ¿Trivial? ¿Eso?

<p>Cárcel reflexionó brevemente sobre lo que había hecho. Luego replicó de inmediato.

<p>—Estás mal de aquí.

<p>Se refería a su cabeza. Señaló su propia cabeza mientras ella no miraba.

<p>Cuanto más hablaba, aunque ella dijera que estaba bien, más parecía un pervertido suplicando un castigo, una condena, una paliza. Pero ahora Cárcel empezaba a preocuparse por ella. Un hombre adecuado para el matrimonio. Un asunto trivial... A menos que su cabeza estuviera defectuosa...

<p>—Mi cabeza está perfectamente bien.

<p>Cárcel vaciló cuando vio la cara de Inés al volverse. Ella pareció suspirar de nuevo y luego se acercó a él.

<p>—Sé lo que se siente al estar celosa. Sé cómo enfadarme. También soy buena guardando rencor.

<p>—... ¿De verdad?

<p>—Probablemente también se me daría bien golpear... si hiciera un poco más de ejercicio. En general, se me dan bien casi todas las cosas.

<p>De repente, mostró una repentina explosión de confianza en sí misma. Cárcel asintió.

<p>—Ya veo.

<p>—Pero eso es trivial, ¿no? ¿Cuánto puede doler que te golpeen unas manos como estas?

<p>Por lo que recordaba de haber recibido algunos golpes décadas atrás, desde luego que no era trivial, pero, en cualquier caso, eran las manos de una mujer delgada. Cárcel volvió a asentir.

<p>—Y si me traicionara, lo mataría.

<p>—... ¿Matar?

<p>Era una afirmación increíblemente amenazante, difícil de creer que saliera de la boca de Inés. En un momento era un asunto trivial y al siguiente ella amenazaba con matarlo. ¿No había término medio para su ira? No tenía por qué ser tan extremo...

<p>Mientras Cárcel ladeaba la cabeza momentáneamente desconcertado, Inés le agarró del brazo y frunció los labios.

<p>—Así es como soy con el hombre que me gusta.

<p>—...

<p>—Escalante. Sabes que mi temperamento no es precisamente el mejor.

<p>Lo sabía muy bien. El temperamento de Inés no solo era malo, era francamente desagradable. Pero la mente de Cárcel se había detenido en “el hombre que me gusta”.

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—Inés, para. Aún no he terminado de hablar.

<p>—No quiero oír nada más.

<p>—No, escucha.

<p>Cárcel agarró suavemente la muñeca de Inés. <span style="font-style:italic">¿La agarré?</span> Miró una vez su propia mano, que había agarrado la muñeca de Inés sin que ella entendiera por qué, y luego miró una vez a Inés, que estaba retirando la mano con irritación. <span style="font-style:italic">¿Qué demonios estaba pasando? ¿Por qué estoy haciendo esto...?</span>

<p>Pero la cara de Inés cuando se giró para mirarlo era aún más sorprendente. Su rostro, distorsionado y empapado en lágrimas, lo dejó completamente atónito. Inés con ese aspecto.

<p>La miró fijamente, sin aliento y aturdido, cuando de repente, completamente independiente de su voluntad, sus labios comenzaron a moverse.

<p>—Escucha con atención. Inés Valeztena. Yo...

<p>—No quiero oírlo.

<p>—Maldita sea, solo escucha. No es lo que estás pensando.

<p>—Si no es eso, ¿entonces qué es? ¿Cómo se supone que debo interpretar lo que está pasando entre tú y esa mujer?

<p>Las preguntas inundaron la mente de Cárcel. <span style="font-style:italic">Primero, ¿qué demonios era esta situación? Segundo, ¿por qué esta mano volvía a agarrar esa muñeca? Tercero, ¿por qué demonios se movía su boca por voluntad propia? Y cuarto, “¿tú y esa mujer…?”</span>

<p><span style="font-style:italic">“¿Tú y esa mujer?”</span>
	
<p>¿Estaba Inés Valeztena realmente hablando sobre “tú y esa mujer”?

<p>—No hay nada que interpretar. No hay nada entre ella y yo.

<p>Sin saber quién era esa mujer, sus labios se movieron de nuevo contra su voluntad. Incluso levantó el brazo y atrajo a Inés hacia él para abrazarla. La abrazó. La abrazó.

<p><span style="font-style:italic">…¿Qué?</span>

<p>—¡Suéltame, suéltame…!

<p>Cárcel estaba abrazando a Inés y, al mismo tiempo, estaba completamente nervioso. En realidad, esa no era su intención.

<p>¿Y qué era ese ambiente tan dramático? ¿Y por qué la voz de Inés sonaba tan aguda...?

<p>—Inés, sabes que no significa nada si no eres tú.

<p>Sentía como si el cielo se estuviera cayendo. <span style="font-style:italic">“Significa”, ¿qué? “sin ti”, ¿qué?</span> Incluso mientras pronunciaba las palabras, no podía creerlas. <span style="font-style:italic">¿Realmente salían de su propia boca?</span> Le preguntó a Dios con desesperación, pero su mano, que acariciaba suavemente el cabello de ella, ya no era una sorpresa.

<p>Entre sus brazos, las pestañas de ella, húmedas por las lágrimas, temblaban lastimosamente. Esa Inés... esa Valeztena, ya fuera monja o bruja... Tragó saliva. Y en el momento en que Inés lo miró con los ojos húmedos, llenos de reproche...

<p>—¿Creías que me tragaría una mentira tan endeble? Suéltame. Eres demasiado cobarde, Escalante.

<p>Y en el momento en el que lo empujó...

<p>—...

<p>Parecía como si el tiempo se hubiera detenido. Cárcel miró su propia mano, firmemente apoyada en la parte baja de la espalda de ella. Esperaba que estuviera temblando visiblemente, pero a simple vista no mostraba ningún signo de ello.

<p>Entonces, su virilidad también...

<p>—...¿Hasta dónde pretendes humillarme? Esto es absurdo. No puedo creerlo... ¡Asqueroso, asqueroso!

<p>—...

<p>Lamentablemente, la erección era visiblemente real.

<p>—¡¿Dónde demonios vas a meter esa cosa asquerosa? ¡Cómo te atreves a presionarla contra mí!

<p>El grito dramático e irreal de Inés apenas rozó el oído de Cárcel. En realidad, sorprendentemente, esa cosa rígida y erecta estaba pinchando el bajo vientre de Inés. Era absurdo. Completamente absurdo. Esto era...

<p>—¡Aléjate! ¡Suéltame!

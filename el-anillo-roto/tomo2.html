<p> Aunque quedaban cuatro meses para su matrimonio con Óscar, solo faltaban dos semanas para su partida a Mendoza.</p>

<p> Su declaración, “Deseo romper mi compromiso con el Príncipe Heredero”, fue descartada como un simple capricho común de una jóven novia Orteguista. Aunque enviara una carta a su padre, que estaba inspeccionando las minas fronterizas, sabía que cualquier respuesta solo le llegaría en Mendoza.</p>

<p> Su madre, la Duquesa Valeztena, padecía una grave neurosis en aquella época, y hasta la visión de sus hijos le resultaba agotadora. El más mínimo comentario que le desagradaba provocaba que los objetos volaran por los aires.</p>

<p> En consecuencia, tras haber sido golpeada por objetos en el dormitorio de la Duquesa al menos en una docena de ocasiones, Inés se embarcó en un plan no oficial.</p>

<p> Llevaba ya una década comprometida formalmente y, tras una espera tan larga, solo faltaban cuatro meses para la boda, por lo que era natural que la gente desestimara sus sinceras súplicas. ¿Cómo se atrevían, sobre todo tratándose de un matrimonio con la Familia Imperial? Incluso ella lo habría dejado pasar si se hubiera tratado de su hermano Luciano.</p>

<p> Óscar, de veinte años, por desgracia, aún no era un mujeriego notorio. Si había alguien en esa espantosa casa imperial que estuviera por encima de toda crítica, era Óscar en ese momento.</p>

<p> Recordaba cada gramo de malicia, intención asesina, odio, repugnancia y desprecio dirigidos hacia Óscar tan vívidamente como si fuera ayer. De hecho, fue ayer... En cualquier caso, incluso si se vertieran en él todas las emociones más oscuras del mundo, sería casi imposible dejar una mella en el Óscar de hoy.</p>

<p> Tendrían que pasar dos años más antes de que abriera los ojos a los burdeles, las orgías y la sodomía. Por ahora, era el príncipe heredero, que mantenía la castidad con la convicción inquebrantable de que debía ser santo y recto, tener un intelecto frío y pasar la noche de bodas con su novia. Pero ¿quién creería una profecía que decía que, en dos años, se convertiría en un pervertido que contraería todas las enfermedades venéreas del mundo?</p>

<p> Por supuesto, una vez transcurridos esos dos años, ciertas personas que acechaban bajo la superficie recordarían su profecía y se estremecerían. Sin embargo, el mundo siguió sin ser consciente de las repulsivas inclinaciones de Óscar hasta el momento mismo en que ella murió a los veintiséis años.</p>

<p> No había necesidad de desperdiciar esta preciosa oportunidad en una batalla tan solitaria. Sería encarcelada en la torre por el delito de insultar a la realeza y Valeztena sería despojada de su posición como Grande de Ortega.</p>

<p> Cortarse el cuello para cortar el dedo de otro no tenía ningún sentido. Ella era alguien que ya se había volado la cabeza una vez en un ataque de ira.</p>

<p> —... No puedo morir dos veces como un perro, solo por el bien de Óscar.</p>

<p> Sin embargo, volver a casarse era totalmente impensable.</p>

<p> Probablemente estrangularía al inocente y puro Óscar de veinte años en cuanto lo volviera a ver, o tal vez vomitaría incontrolablemente con solo ver su cuerpo desnudo en su noche de bodas.</p>

<p> Entonces, un día, lo castraría mientras dormía y lo enviaría a la guillotina... Inés imaginó todos los peores escenarios posibles.</p>

<p> Y decidió ser más minuciosa.</p>
<p> ¿Cuál había sido el resultado de llevar una vida respetable según el camino trazado por la Familia Imperial y su familia? ¿Cuál había sido la recompensa para la mujer que se había conformado con un compromiso honorable y se había mantenido fiel solo a su matrimonio? No debía volver a desperdiciar su vida como lo había hecho antes. Esta vez debía ser diferente. Debía ser completamente diferente...</p>

<p> Sin embargo, Inés pasó por alto una cosa más, además de este dudoso retroceso en el tiempo.</p>

<p> —Señorita Valeztena, el pintor y su asistente a cargo de su retrato para la revista semanal enviados por Su Majestad la Emperatriz han llegado. El tiempo apremia; hay que empezar a trabajar lo antes posible. Por favor, baje ahora.</p>

<p> El hecho de que ahora se había convertido “verdaderamente” en una chica de dieciséis años.</p>

<p> Un híbrido de lo más peculiar, que poseía veintiséis años de recuerdos, pero pensaba como una chica de dieciséis...</p>

<p> —¿Señorita?</p>

<p> —...</p>

<p> La chica de dieciséis años se había enamorado al instante del apuesto joven que estaba de pie junto al retratista, con la cabeza inclinada.</p>

<p> Y los recuerdos de la Inés de veintiséis años le recordaron con urgencia que, una vez que se marchara a Mendoza en quince días, no habría posibilidad de volver atrás.</p>

<p> No había tiempo. Concibió un plan, no oficial pero meticuloso, como si le hubiera sido revelado por inspiración divina. Era una oportunidad para vivir sin someterse a las exigencias del mundo, una oportunidad para ser infiel a un matrimonio de conveniencia, una oportunidad para conocer el amor verdadero.</p>

<p> <span style="font-style:italic">El amor verdadero...</span> Si la Inés de veintiséis años hubiera oído ese pensamiento, añadido apresuradamente al final, se habría dado una bofetada. Pero para la romántica Inés de dieciséis años, era un tema perfectamente plausible. El amor. Sí. El amor, precisamente... Sentía que podría redimir un matrimonio fallido en el que no quedaba más que engaño.</p>

<p> Esa noche, Inés entró completamente desnuda en la vieja habitación donde se alojaba el ayudante del pintor. La idea de que no había tiempo y de que no tenía más remedio que seducirlo rápidamente con su cuerpo era una elección nacida de un cierto realismo.</p>

<p> —¡Señorita Valeztena...!</p>

<p> —Cállate si no quieres que nos descubran.</p>

<p> Era una frase propia de un villano, pero para el hombre hipnotizado por su perfecto cuerpo desnudo, incapaz de apartar la mirada, debió de sonar como una amenaza con voz dulce.</p>

<p> Sin embargo, el joven de dieciocho años, a pesar de su apariencia, no sabía nada de mujeres. Solo podía sollozar: “¿Cómo me atrevería...? ¿Cómo podría...? ¿Cómo me atrevería...? ¿Cómo podría...?”. Y como no se “atrevía” a empujarla con fuerza, finalmente se rindió y se excitó. Ella, que sin saberlo había acumulado diversas experiencias a través de sus numerosos y desagradables encuentros con el Príncipe Heredero, encontró que esta era una batalla a la que nunca podría resistirse desde el principio.</p>

<p> —Es demasiado hermosa. ¿Es usted una diosa? ¿Es realmente un ser humano el que se mueve sobre mí ahora, y no una diosa...?</p>

<p> Inés, una romántica de dieciséis años, encontraba el romanticismo del joven ridículo, rayando en el cliché nauseabundo.</p>

<p> —Sinceramente, lo pensé desde el momento en que la vi por primera vez. Aunque alguien como yo nunca podría aspirar a tocar ni siquiera la punta de su dedo en toda mi vida, no podría evitar amarla.</p>

<p> —...</p>

<p> —Ah, es tan hermosa y noble, tan digna y elegante, tan adorable...</p>

<p> —...</p>

<p> —Su mirada altiva parece devorar mi alma...</p>

<p> Por desgracia, Inés tenía una constitución débil, por lo que se centró principalmente en su rostro. En ese aspecto, él era mucho más guapo que ella.</p>

<p> Parecía que el pintor le había llamado por algún nombre, pero incluso entonces, ella estaba tan absorta en su rostro que solo lo había oído a medias y lo había dejado pasar. No se le ocurría ningún nombre, así que no pudo llamarle y se limitó a abrir la boca en un intento silencioso.</p>

<p> Como si sintiera su frustración, el joven sonrió tímidamente y dijo:</p>

<p> —Mi nombre es Emiliano. Por favor, no lo olvide, señorita.</p>

<p> Era una sonrisa que parecía brillar incluso en la oscuridad. Su corazón se llenó tanto que sintió como si se le hubiera cortado la respiración por un momento. Inés murmuró su nombre en voz baja.</p>

<p> Saber que el amor puede ser cuestión de un solo instante. Absolutamente fugaz.</p>

<p> Ella aprendió el nombre de Emiliano y, al hacerlo, conoció el amor. Y eso no fue nada bueno.</p>

<p> Diez días después, se fugaron juntos de Pérez. Vagaron por todas partes, viviendo cuatro años una vida feliz pero empobrecida, antes de ser capturados por el Duque Valeztena en un pequeño puerto de la costa de Calstera. Emiliano escapó brevemente con la ayuda de alguien que ella conocía, pero finalmente regresó por su propia voluntad y murió a manos de Luciano.</p>

<p> Ante sus propios ojos. Ante los ojos de su hijo recién nacido...</p>

<p> Mientras ella lloraba abrazando el cadáver, los soldados de Valeztena la arrastraron como si fuera un saco de papas y la empujaron dentro de un carruaje. Los Valeztena declararon que pedirían perdón a la Corte Imperial y la encarcelarían de por vida, ya que no podía seguir siendo la mujer del Príncipe Heredero. Ahora era un objeto mancillado. Sin embargo, seguía siendo la noble hija de Valeztena.</p>

<p> La Emperatriz se mostró misericordiosa y consideró apropiado que se convirtiera en la segunda esposa del Conde Almenara. Le concedió su bendición y declaró que, si reconocía sus propios defectos y vivía sirviendo y atendiendo a un marido con más experiencia, eso también podría ser felicidad, un decreto que incluso despertó la admiración del público.</p>

<p> El Conde Almenara había superado con creces los cincuenta años y se acercaba a los sesenta, pero un nuevo marido anciano no suponía ningún problema para Inés. Desde el principio, no importaba si era un hombre espléndido o no.</p>

<p> Si no fuera por Emiliano, no importaría.</p>

<p> Ella accedió a casarse con el Conde Almenara. Y su hijo sería adoptado por un abogado, un pariente lejano de la familia Valeztena. Como para acallar el escándalo que rodeaba a Inés, la familia preparó una gran ceremonia nupcial. Ella hizo todo lo que le ordenaron. Hasta que oyó a su padre decir, a través de la pared, que el destino del niño no sería la casa de dos pisos de un pobre abogado, sino las profundidades de la tierra, en un coto de caza cerrado.</p>

<p> El Duque había dicho que era mejor cortar un brote podrido antes de que creciera más.</p>

<p> Su querido hijo era ahora ese brote podrido. Al igual que ella no era ahora más que un objeto mancillado.</p>

<p> Inés decidió no resistirse. De todos modos, era un mundo sin Emiliano. Un dolor que nunca había conocido.</p>

<p> Si eso era amor, entonces nunca había amado a Óscar ni por un solo segundo.</p>

<p> Inés había amado demasiado a Emiliano. Sin nadie a quien entregar ese amor, no podía respirar. El niño era la prueba de que Emiliano había vivido una vez a su lado. Era el único fragmento. Sin embargo, el mundo que Emiliano le había mostrado era demasiado vasto, y el niño que se le parecía era demasiado pequeño para ser suficiente.</p>

<p> Aun así, como único ser que le quedaba por amar, Inés deseaba al menos que el niño no muriera dolorosamente en un lugar extraño.</p>

<p> Así que lo mató. Con sus propias manos, estranguló al niño, de apenas tres meses de edad.</p>

<p> Era la última noche que se le permitiría estar con el niño. Tan frágil como era, murió muy fácilmente bajo su debilitada fuerza. Miró fijamente al niño muerto durante horas y luego se apuñaló en la garganta antes de que amaneciera.</p>

<p> Tenía veinte años. Era una semana antes de su matrimonio con el Conde Almenara.</p>

<p> <span style="color:#777777">—Mi nombre es Emiliano. Por favor, no lo olvide, señorita.</span></p>

<p> A veces, un nombre cambiaba el mundo. Para Inés, Emiliano era uno de esos nombres. Era el único color en un mundo que había sido completamente blanco y negro. ¿Podría haber un ser más bueno y perfecto que él? ¿Podría haber un ser más adorable y hermoso que él? Si pudiera traer de vuelta a este mundo aunque solo fuera uno de sus dedos, habría ofrecido gustosamente su propio cuello. Emiliano era tan magnífico que incluso su odio hacia Óscar se convirtió en polvo esparcido por el viento. Contempló a Emiliano mientras veía cómo la sangre brotaba del niño.</p>

<p> El mundo había cambiado, pero Emiliano se había ido. En el mundo que Emiliano había transformado, Emiliano ya no existía. Entonces ella también debía desaparecer...</p>

<p> <span style="color:#777777">—No lo olvide, señorita.</span></p>

<p> Había matado al niño que había llevado en su vientre. Una mujer así seguramente caería en el infierno. Sin embargo, ni siquiera en el infierno podría olvidar el nombre de Emiliano.</p>

<p> En su visión parpadeante, Emiliano la abrazaba.</p>


<p> <div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>


<p> Y entonces, Inés volvió a abrir los ojos.</p>

<p> Esta vez, desde un recuerdo aún más antiguo.</p>


<p> <div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>


<p> Cuando volvió a abrir los ojos en los terrenos de caza a los dieciséis años, pensó que todo aquello no era más que un milagro. Se alegró, creyendo que ni siquiera Dios podía soportar más su miseria. Porque se le había concedido una segunda oportunidad en la vida. Porque no había mayor bendición que la vida misma...</p>

<p> Inés miró fijamente el reflejo de una niña de seis años en el espejo.</p>

<p> —... Es completamente ridículo.</p>

<p> Había pensado que una mujer que mataba a su propio hijo caería en el infierno. Sin embargo, el lugar al que cayó no fue un pozo de fuego insaciable, sino la cómoda cama de una noble dama, rodeada de noble abundancia donde no faltaba nada.</p>

<p> Ridículamente, había regresado. Ahora, mucho antes de que todas las desgracias de la vida pudieran caer sobre ella.</p>

<p> Inés golpeó nerviosamente el espejo, rompiéndolo. Sus diminutos dedos temblaban violentamente. Aquello era el infierno, sin duda. Solo el infierno podía ser así.</p>

<p> Quizás en el momento en que se había metido el cañón en la garganta delante de Óscar, se había decretado su castigo.</p>

<p> No había habido ninguna oportunidad, ninguna bendición, desde el principio.</p>

<p> Aquello era el infierno, repetir la misma vida una y otra vez, solo para volver a ser miserable.</p>

<p> <div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p> Inés Valeztena, de seis años, estaba más tranquila que Inés Valeztena, de dieciséis. Ya no necesitaba maltratarse golpeándose las espinillas contra las esquinas de los muebles o pinchándose las palmas de las manos con puntas de bolígrafo para determinar si aquello era un sueño o la realidad. Eso solo amplificaba una inútil sensación de realidad.</p>

<p> Inés ya no necesitaba la sensación de realidad. La sensación de estar viva era veneno. Como en un sueño, como si fuera algo natural, se comportaba con la tranquilidad de una niña de seis años, pero cuando algo la abrumaba de repente, no podía soportarlo.</p>

<p> Ese niño, tan pequeño. Emiliano y su bebé... Cuando pensaba en haber matado a ese niño con sus propias manos, a veces ni siquiera podía creer el recuerdo, y se quedaba mirando sus pequeñas y temblorosas manos como si fueran de otra persona.</p>

<p> Sus recuerdos se habían detenido a los veinte años, pero su cuerpo había retrocedido aún más. Las manos absurdamente pequeñas de una niña de seis años ahora le proporcionaban alivio en lugar de frustración.</p>

<p> Unas manos tan pequeñas no podían haber hecho algo así. Eran simplemente las manos de una niña indefensa... Sí, ella era solo una niña. Unas manos como esas no podían matar a nadie. Un cuerpo como ese no podía ser el de una esposa o una madre.</p>

<p> Esas cosas... no podían haber sucedido.</p>

<p> En lugar de recurrir a la autolesión para volver a la realidad, Inés fue negando poco a poco el recuerdo.</p>

<p> Quizás realmente había sido un sueño. Un sueño muy malo. Un sueño espantoso y repugnante... Un sueño tan dulce durante un momento tan breve que la hacía llorar de nostalgia. En realidad, no importaba cuál fuera. Incluso si este lado era un sueño soñado en el fugaz momento antes de la muerte, incluso si todo lo que había vivido con Emiliano había sido un sueño de una sola noche...</p>

<p> Porque en cualquiera de los dos sueños, la vida con Emiliano ya no existía.</p>

<p> Inés se fue adaptando poco a poco. Le llevó veinte días de fiebre, seguidos de otros veinte días de náuseas y silencio, pero ella era una niña indefensa y nada podía cambiarse.</p>

<p> La realidad la engullía por completo, se resistiera o no. Inés estaba realmente viva. No solo sobrevivía, sino que simplemente vivía en el pasado. Sin embargo, respiraba y hablaba. Respiraba día tras día entre las personas a las que una vez había amado.</p>

<p> En aquella época, cuando su madre aún se llevaba razonablemente bien con su padre, ella apreciaba a sus hijos como tesoros de la vida. Aquellos fugaces momentos de felicidad de la época en que su madre no odiaba a Luciano y a ella le venían a la mente a diario. Su padre, que había considerado a su yo de veinte años como una alimaña, aún quería a su hija, y Luciano, que había apuntado con un arma a Emiliano, no era más que un niño de nueve años...</p>

<p> ¿Qué podía hacer un niño así? ¿Qué podían lograr esas manitas...? Al igual que había borrado los rastros del asesinato de sus propias manitas, apartó la imagen del odiado asesino del rostro joven e inocente de Luciano. Reprimió el impulso de estrangular al niño mientras este reía alegremente.</p>

<p> Simplemente no parecían la misma persona. El niño de nueve años que sonreía traviesamente a su hermana no podía ser el mismo hombre que había matado a Emiliano y escupido sobre su cadáver.</p>

<p> Sí. Eran seres completamente diferentes. Quizás Luciano nunca había matado a Emiliano... Esas cosas nunca podrían haber sucedido en primer lugar.</p>

<p> —No puede ser.</p>

<p> Inés se miró en el espejo y repitió esa frase como un mantra.</p>

<p> Era el comienzo del verano, cuando tenía seis años.</p>

<p> Los días en Pérez, al sur de Ortega, eran terriblemente largos, y las noches aún más, pero ella se las arreglaba. La niña del espejo parecía tan pequeña que parecía que nunca crecería, pero eso también era manejable.</p>

<p> Cuanto más se sentía arraigada en ese lugar, más lejanos se volvían los recuerdos de Emiliano.</p>

<p> A veces le gustaba que parecieran sueños lejanos. Como sueños vagos de hacía tanto tiempo que no podía recordar la trama, le gustaba que parecieran no tener ningún significado.</p>

<p> Así era como volvía a la vida.</p>

<p> Aunque Emiliano apareciera una noche en algún sueño, como un rostro en un recuerdo descolorido, y ella se despertara llorando desconsoladamente, al mirarse en el espejo sabía que todo era solo un sueño ridículo. No podía ser. Esas cosas no podían haber sucedido... Murmurando eso hasta que las lágrimas cesaban, llegaba una mañana tranquila.</p>

<p> Entonces todo estaba bien. En algún lugar, Emiliano también estaría saludando a la misma mañana.</p>

<p> Pensando en eso, podía volver a respirar.</p>

<p> Al menos en ese momento, Emiliano estaba vivo.</p>

<p> —Inés, ¿estás lista?</p>

<p> —Sí, madre.</p>

<p> <span style="font-style:italic">Si estás vivo, entonces yo también estoy bien.</span> Solo eso le daba sentido a esta vida una vez más.</p>

<p> Se levantó y siguió a la Duquesa Valeztena. El Príncipe Heredero las estaba esperando.</p>


<p> <div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>


<p> —Pérez es aún más espléndido en verano. Eres afortunada, Inés. Por tener una ciudad natal como esta...</p>

<p> Óscar contempló con asombro la brillante luz del sol y la vasta llanura que se extendía bajo las colinas durante un largo rato, y luego charló sin cesar. La vasta finca de Valeztena era famosa por sus inviernos cálidos, pero era en verano, cuando la vida concebida por la primavera comenzaba a latir, cuando realmente se revelaba la gran vitalidad de las llanuras de Pérez, y bla bla bla...</p>

<p> Inés escuchaba sin mucho interés, distraída, limitándose a asentir con la cabeza. Óscar la miró fijamente durante un momento y, de repente, clavó sus ojos melancólicos directamente en los de ella.</p>

<p> —Pareces preocupada, Inés.</p>

<p> —En absoluto, Alteza.</p>

<p> —Lo sé. Soy bueno leyendo a las personas.</p>

<p> Tenía buen ojo para seleccionar el linaje más distinguido entre las mujeres que podía elegir.</p>

<p> Eso era algo que cualquier hombre podía hacer, dada la oportunidad. Sin embargo, teniendo en cuenta su primera vida, en la que lo había admirado precisamente por esa razón, ella tenía poco que decir al respecto.</p>

<p> Óscar había sido en su día el hombre más distinguido entre todos los que ella podía elegir. El hombre que la convertiría en la mujer más elegante del imperio.</p>

<p> Hubo un tiempo en el que eso era suficiente. Óscar era perfecto. Por supuesto, de niño, su ligero aire de superioridad era un defecto, pero a medida que crecía, reconoció su propia vergüenza y corrigió incluso eso por sí mismo, convirtiéndose en un hombre irreprochable.</p>

<p> En pocos años, cada palabra que pronunciaba sería humilde.</p>

<p> <span style="font-style:italic">Entonces, un día, se convertirá en un perfecto montón de mierda.</span></p>

<p> —Lo sé. Inés. Lo que estás pensando ahora mismo.</p>

<p> —...</p>

<p> Inés lo miró fijamente, con la barbilla apoyada, incapaz de ocultar su expresión de inquietud. Ver los ojos de un niño ingenuo que claramente no sabía nada la agotaba.</p>

<p> Pero, ¿qué podía saber él? Con esa mente pura que perseguía los talones de una joven y ese corazón que soñaba con ser un gobernante virtuoso, ¿podría siquiera imaginar en qué tipo de pervertido se convertiría en solo doce años?</p>

<p> Aun así, una nueva oleada de náuseas la invadió.</p>

<p> Al igual que su padre aún la amaba y el querido Luciano aún no había matado a Emiliano, Óscar tampoco la había traicionado.</p>

<p> Lo sabía intelectualmente, e incluso su corazón lo reconocía. Porque Óscar también era un chico bastante adorable e inofensivo, muy lejos de aquel rostro codicioso de antaño.</p>

<p> Incluso ese parecido con el futuro despertaba en ella odio y repugnancia como un hábito, pero no era particularmente significativo. Si Emiliano era un sueño lejano para ella, entonces los diez años con Óscar no eran más que una pesadilla de mal sabor.</p>

<p> Era un ser infinitamente insignificante comparado con Emiliano. No era que las acciones de Óscar o la sórdida historia de la prostitución fueran ridículas, sino que Emiliano era mucho más grande.</p>

<p> Los recuerdos de su primera vida eran más claros que los de la segunda, pero no se sentía diferente a recordar con precisión la historia de otra persona. Sabía con certeza, solo en su mente, que una vez había vivido a su lado.</p>

<p> Así que, estrictamente hablando, se trataba de una cuestión de pureza.</p>

<p> —La tristeza que llena tu corazón parece un cuadro.</p>

<p> Justo cuando Inés pensó que debía de haber vuelto a oír la palabra “tristeza” y apartó la cabeza de su agarre, la otra mano de Óscar le tocó el hombro. Inés se estremeció.</p>

<p> —Debes de tener muchas preocupaciones... Quizás mi petición te haya parecido demasiado repentina. Convertirse en la Princesa Heredera de una nación conlleva ese tipo de carga.</p>

<p> —...</p>

<p> —Pero puedes manejarlo, ¿verdad? Inés Valeztena, no hay mujer más adecuada para ese puesto que tú.</p>

<p> —...</p>

<p> —Es prácticamente un puesto reservado para ti. Solo tienes que prepararte siendo tú misma.</p>

<p> Esa mano, que ahora estaba limpia, dentro de doce años estaría plagada de todo tipo de enfermedades venéreas. Esa mano que sondeará los anos de diferentes mujeres, agarrará el pelo de los prostitutos que les chupan la polla en los burdeles...</p>

<p> Inés giró la cabeza con todas sus fuerzas, liberando su rostro del agarre de Óscar. Fue el momento en el que mostró la voluntad más fuerte en todas las décadas desde que abrió los ojos a los seis años.</p>

<p> Inés poseía tanto el temperamento apasionado heredado de su padre como el trastorno obsesivo compulsivo heredado de su madre.</p>

<p> El deseo de evitar el contacto con esa futura mano sucia despertó al instante la cabeza que había estado muerta para todo en el mundo.</p>

<p> No debía volver a tocar nunca más esa suciedad. Esto no podía continuar.</p>

<p> —¿Inés?</p>

<p> —Quita tus sucias manos de encima…</p>

<p> Justo cuando Óscar volvió a intentar agarrarla del brazo, ella lo apartó, como si incluso ese contacto fuera impuro.</p>

<p> Él puso una mirada de desconcierto que no era intencionada.</p>

<p> —¿Acaso cometí algún error...?</p>

<p> Lo haría. Durante unos ocho años, a partir de unos doce años más tarde. Hasta que ella finalmente no pudo contener su rabia y se apretó el cañón contra su propia garganta.</p>

<p> Quizás pensar que no importaba en absoluto había sido una ilusión. Olas se agitaron en el corazón que se había hundido en la tristeza.</p>

<p> No era que Emiliano estuviera vivo. Ella no era de las que aguantaban todo con tanta fortaleza desinteresada desde el principio. Huelga decir que tenía una constitución extremadamente débil.</p>

<p> Inés Valeztena, de seis años. Precisamente la edad en la que simplemente no se podía obligar a nadie a hacer nada desagradable, aunque eso significara morir.</p>

<p> <div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p> —Prefiero morir antes que volver a comprometerme. Prefiero morir otra vez antes que casarme con este miserable una vez más...</p>

<p> Inés murmuró, mirando con ira el retrato engreído de Óscar colocado sobre el sofá del salón. Era un regalo que él mismo había traído cuando visitó la finca Valeztena esta vez.</p>

<p> Bla, bla, bla sobre cómo su futuro prometido siempre le haría compañía en Pérez para que no se sintiera sola, y bla bla bla...</p>

<p> —... Esa porquería como regalo...</p>

<p> Siempre había pensado que solo se había convertido en un desastre de adulto, pero, mirando atrás, era un loco desde niño. ¿De verdad creía que su rostro era un regalo? Aunque sus rasgos eran innegablemente atractivos, eso no significaba que fuera a convertirse en un gran guapo.</p>

<p> Era un juicio carente tanto de sentido estético como de objetividad. Ella miró con desprecio el retrato del Príncipe Heredero.</p>

<p> El retrato evocaba una sensación aún más repulsiva que el propio Príncipe Heredero.</p>

<p> Un físico tan robusto que era imposible creer que se tratara de un niño de diez años, un rostro que parecía al menos siete años mayor —no, más maduro—, unos hombros ridículamente anchos, un enorme halo y unas alas angelicales que revoloteaban santurronamente como si estuvieran listas para elevarse a los cielos en cualquier momento...</p>

<p> Aunque la obra, propensa en general a la exageración, alcanzaba el colmo del absurdo con esas alas, Inés ni siquiera se burló de ello, sino que miró fijamente el rostro del retrato. El pintor era realmente hábil.</p>

<p> El Óscar del retrato parecía realmente un futuro Príncipe Heredero en todo su esplendor.</p>

<p> Excepto por ese enorme cuerpo, claro está. Óscar siempre había detestado cualquier esfuerzo físico de principio a fin, nunca hacía ejercicio, y mucho menos entrenamiento.</p>

<p> Si le quitábamos sus costosas prendas, lo único que quedaba eran unos brazos que caían rectos y un pecho flácido. Cuando cazaban juntos, era de los que jadeaban y resoplaban, persiguiendo constantemente a su prometida...</p>

<p> Su vida la pasó desperdiciando el físico innato y la decente resistencia que le había legado su padre, el Emperador. Cuando envejeciera, no le quedaría nada. Dada su caótica vida sexual, era dudoso que viviera tanto tiempo.</p>

<p> —Así que, aunque muera, no acabará así.</p>

<p> Inés se burló ligeramente de los sueños alados de un niño de diez años.</p>

<p> En su codiciosa juventud, cegada únicamente por la ambición de convertirse en Princesa Heredera, nunca habría reconocido una disposición tan peculiar.</p>

<p> Y entonces probablemente habría dicho: “Alteza, ¿cómo es que es tan considerado?”, “Ahora, incluso en Pérez, siempre que deseemos ver a Su Alteza, podemos reunirnos con usted cuando queramos. ¡Estoy encantada!”, “La sonrisa de Su Alteza ilumina la finca Valeztena como la luz del sol... Este año, Pérez tendrá sin duda una cosecha abundante. ¡Porque Su Alteza bendice esta tierra!”, etcétera. Habría estado genuinamente encantada, susurrando palabras tan melosas con descaro.</p>

<p> Después de todo, el Príncipe Heredero, de apenas diez años, había desafiado a toda la oposición dentro de la Familia Imperial y había viajado personalmente a la finca del sur solo por ella.</p>

<p> Aunque ese recuerdo no existía en su auténtica juventud, cuando viajaba constantemente entre la capital y el Príncipe Heredero, la niña que era entonces seguramente se habría emocionado hasta el punto de secarse las lágrimas.</p>

<p> La Inés de esta época era precoz a su manera, pero también bastante astuta: disfrutaba burlándose de Óscar precisamente porque le gustaba, y le encantaba la forma en que él se aferraba a ella de vez en cuando y le prestaba toda su atención.</p>

<p> Cada vez que su padre partía hacia la capital, Mendoza, ella se las ingeniaba para convencerlo de que la llevara a la corte, aunque esperaba que Óscar no se diera cuenta de sus esfuerzos. Aunque iba a verlo, solo se aferraba a su hermana, sin siquiera mirarla.</p>

<p> Óscar poseía esa característica de los príncipes herederos: simplemente tenía que poseer lo que no podía tener, por lo que sus esfuerzos daban fruto fácilmente.</p>

<p> Incluso con solo seis años, ella lo entendía. Cuanto más se aferraba él a ella, más aumentaba su propio valor.</p>

<p> Sin embargo, ahora Inés estaba pateando su retrato con el zapato. Incluso dentro de la mansión donde Óscar aún residía.</p>

<p> —... Muere, muere. Solo muere...</p>

<p> Sus ojos, rebosantes de confianza innata, amor propio, seguridad en sí mismo, autoestima, elevada conciencia de sí mismo y orgullo altivo, brillaban implacablemente mientras se enfrentaban a las maldiciones y patadas de Inés, mirándola fijamente.</p>

<p> Como si declarara: “Por mucho que me patees, me amo tal y como soy”</p>

<p> Inés respiró hondo y lo empujó fuera del sofá.</p>

<p> Este grotesco narcisismo era sin duda la manifestación de un deseo sexual pervertido. Para Inés, todo lo relacionado con él le parecía ahora el precursor de una enfermedad venérea.</p>

<p> El lienzo, cubierto con una gruesa capa de pintura al óleo, era resistente y robusto, totalmente imposible de destruir para una niña de seis años. Sin embargo, pisoteó con su bota el rostro caído del Príncipe Heredero, respirando con dificultad.</p>

<p> Pero por mucho que pisoteara ese rostro engreído, su irritación no disminuía.</p>

<p> —Maldita sea, maldito Óscar, maldito...</p>

<p> Era la primera vez que veía a Óscar desde el día en que se había pegado un tiro delante de ella, como para presumir. Había muerto a los veintiséis años, despertado a los dieciséis en los terrenos de caza, vivido cuatro años de ensueño con Emiliano, vuelto a morir y ahora... seis.</p>

<p> ¿El impacto había sido tan profundo porque nunca había vuelto a ver ni un solo mechón de ese pelo rojo en su segunda vida? Inés se quedó mirando el retrato del Príncipe Heredero, ahora ya adulto, como si no pudiera comprenderlo.</p>

<p> Cuando vio a Luciano llorando de nuevo por primera vez a través de su visión borrosa por la fiebre, lo que la atormentaba y la desgarraba era una pena desgarradora y un amor-odio. El hombre que mató a Emiliano, que había sido todo su mundo. Sin embargo, el hermano que la quería más que a nada en el mundo...</p>

<p> Su familia siempre la había dejado tambaleando entre el odio y el afecto. Hacían imposible calibrar sus sentimientos. Pero Óscar...</p>

<p> —... Cómo puede ser tan irritante.</p>

<p> Realmente no era más que irritante. No quedaba ni una pizca de afecto, ni ninguna emoción grandiosa como el deseo de matar o el odio, ni siquiera una mota de polvo. Sin embargo, era un ser humano irritante hasta la exasperación. Con solo mirarlo, su ira hervía, era insoportable. Incluso la forma en que inspiraba y exhalaba le desagradaba.</p>

<p> En lugar de inclinar la cabeza en agradecimiento por recibir tal regalo, preferiría morir... ¿Qué sentido tiene vivir así? Mejor morir ya... Habiendo muerto varias veces antes, la opción de simplemente acabar con todo se le ocurrió sin dificultad. Al igual que había terminado abruptamente su primera vida en un ataque de ira.</p>

<p> Pero Inés cambió rápidamente de opinión. Como si supiera que el tiempo volvería a retroceder.</p>

<p> La muerte nunca era el final. Normalmente lo era, pero no para ella. Quizás esta tragedia se había derivado de su incapacidad para controlar su ira desde el principio. Por lo que ella sabía, ese había sido el punto de partida.</p>

<p> Si no hubiera muerto entonces, habría eliminado primero esa causa fundamental...</p>

<p> “¿Quién demonios le proporcionó esa ira incontrolable?”. El contraargumento surgió contra sus propios pensamientos, pero lo reprimió de nuevo. Ahora tenía que ser realmente cautelosa con todo. Antes de volver a abrir los ojos dentro del útero de su madre.</p>

<p> —Piensa con cuidado. Piensa con cuidado... Piensa con cuidado, Valeztena... Piensa con cuidado.</p>

<p> Se sentó rígida en su escritorio, murmurando para sí misma como si se estuviera lavando el cerebro, golpeando el papel con ansiedad con la punta seca de su bolígrafo. Era una compulsión obsesiva que había tenido a los veintiséis años, cuando el matrimonio asqueroso le había dificultado controlar su ira. </p>

<p> Inés apretó los dientes y frunció el ceño.</p>

<p> Para que la hipótesis de que “repetir la vida es un infierno” fuera cierta, uno debía haber cometido un pecado original digno de las llamas del infierno.</p>

<p> Miró fijamente el papel, con la pluma bien agarrada en la mano.</p>

<p> Solo en la segunda muerte yacía un pecado innegablemente horrible. Había seducido a un hombre amable e inocente, llevándolo finalmente a la muerte, y había asesinado personalmente a su propio hijo, que ni siquiera había vivido medio año...</p>

<p> La expresión desapareció brevemente del rostro juvenil de Inés. Eso nunca sucedió. Siguió una sugerencia que rayaba en la autodefensa, sin tener en cuenta la lógica y la secuencia. Apartó su segunda vida como si fuera la historia de otra persona y volvió a pensar.</p>

<p> Aquello ya había sido un infierno. El terrible pecado que había cometido seguramente se convertiría en parte de ese infierno.</p>

<p> Si era así, debía de haber habido una primera chispa clara que empujó a Inés a ese infierno. Recordó su primera vida, vívida y detalladamente, y su caótico matrimonio, pieza por pieza.</p>

<p> Y, por primera vez, comenzó a examinar las cosas que había hecho mal en esa vida.</p>

<p> <span style="font-style:italic; color:#777777">[Arrogancia].</span></p>

<p> Inés mojó la pluma en tinta, escribió su primera acusación, letra a letra, y luego ladeó la cabeza. <span style="font-style:italic">Quizás un poco desafortunada, pero difícilmente digna del infierno.</span></p>

<p> <span style="font-style:italic; color:#777777">[Vivir de forma extravagante]. </span><span style="font-style:italic">Si eso fuera un pecado tan grave, la nobleza de este país nunca moriría. </span><span style="font-style:italic; color:#777777">[Utilizar a las personas].</span> <span style="font-style:italic">Cada uno nace en una posición diferente; no se puede evitar.</span></p>

<p> <span style="font-style:italic; color:#777777">[Preocuparse sólo por los accesorios].</span> <span style="font-style:italic">Aunque siento que he desperdiciado mi vida en el tocador, no he hecho mal a nadie. </span><span style="font-style:italic; color:#777777">[No leer suficientes libros].</span> <span style="font-style:italic">Tonterías. </span><span style="font-style:italic; color:#777777">[Ser hipócrita].</span> <span style="font-style:italic">¿Quién no lo es?</span></p>

<p> <span style="font-style:italic; color:#777777">[Engañar a mis padres]. [Las mentiras].</span> <span style="font-style:italic">Nunca hice nada que mereciera el infierno… </span><span style="font-style:italic; color:#777777">[Odiar a mi madre].</span> <span style="font-style:italic">Ella fue la primera en odiarme.</span></p>

<p> <span style="font-style:italic; color:#777777">[No guardar el secreto del Príncipe Heredero]. </span><span style="font-style:italic">Debería haber estado agradecido solo por haberle salvado la vida ese día.</span></p>

<p> <span style="font-style:italic; color:#777777">[Caza frecuente]. </span><span style="font-style:italic">Esto era un poco...</span> La expresión de Inés se ensombreció. Matar animales inocentes por diversión era claramente un pecado. Sin embargo, esto podía atribuirse en cierta medida a Luciano.</p>

<p> Luciano, en lugar de lamentar la ausencia de un hermano menor, trataba a Inés como si lo fuera, obligando a su única hermana a acompañarle en actividades típicamente reservadas a los hombres. El problema era que todo lo que él le obligaba a hacer encajaba perfectamente con su temperamento...</p>

<p> Inés era una excelente tiradora y disfrutaba de las carreras en las que los caballos corrían a una velocidad vertiginosa. Su temperamento apasionado y su espíritu competitivo estaban tan estrechamente vinculados como la propia sangre. Incluso el hecho de vestirse con elegancia formaba parte de su naturaleza competitiva. Una vez establecido un estándar, tenía que ganar a toda costa. Ser la mejor era lo preferible.</p>

<p> <span style="font-style:italic">Ahora que lo pienso...</span> <span style="font-style:italic; color:#777777">[Tratar a los caballos con dureza]</span>. Sin embargo, el semental pelirojo de Inés la quería mucho a pesar de todo. Así que, al menos, parecía poco probable que deseara que ella cayera en las ardientes profundidades del infierno.</p>

<p> <span style="font-style:italic; color:#777777">[Crueldad].</span> Si hubiera nacido con una naturaleza lo suficientemente amable como para ser amiga de todos, habría elegido pasar su vida en un convento en lugar de soportar la visión de las almas corruptas de la capital. Mendoza estaba llena de cosas demasiado viles para contemplarlas.</p>

<p> Así, Inés registró las manchas de su primera vida. Ningún observador podía apreciar ningún pecado grave. Sin embargo, junto a la caza que le traspasaba el corazón, escribió el nombre de Luciano.</p>

<p> —... ¿Qué demonios hice tan terriblemente mal entonces?</p>

<p> Indagó en su propio pecado original, con la pluma rozándole la barbilla.</p>

<p> La religión oficial de Ortega enseñaba que “el hombre nace con el pecado original por el simple hecho de existir en este mundo” y que solo arrepintiéndose de ese pecado a lo largo de la vida se podía alcanzar el cielo. Esta doctrina domesticaba y dominaba a la población, pero a ella no le interesaban esos cuentos fundamentalistas.</p>

<p> Si realmente había que pagar un precio por haber nacido, ella creía que lo había pagado en su totalidad con las asombrosas donaciones que le había extorsionado a Óscar y repartido por todas partes.</p>

<p> Así que, por ahora, eso estaba bien.</p>

<p> La pluma volvió a moverse.</p>

<p> <span style="font-style:italic; color:#777777">[Golpear a Óscar].</span> <span style="font-style:italic">¿Cómo se podía mirar esa cara y no golpearla?</span> <span style="font-style:italic; color:#777777">[Odiar a Óscar].</span> <span style="font-style:italic">¿Cómo no odiarlo?</span> <span style="font-style:italic; color:#777777">[Maldecir a Óscar].</span> <span style="font-style:italic">¿Cómo no maldecirlo?</span> <span style="font-style:italic; color:#777777">[Acusar a Óscar].</span> <span style="font-style:italic">¿Cómo podía ser un pecado simplemente acusarlo, cuando se le podía matar sin acusarlo...?</span></p>

<p> <span style="font-style:italic; color:#777777">[Óscar...]</span> Todas las emociones oscuras y los patrones de comportamiento agresivo que había conocido en su primera vida estaban totalmente relacionados con Óscar.</p>

<p> <span style="font-style:italic">Óscar, Óscar, Óscar.</span> Al ver el nombre ocupando ahora la mitad de la página, la irritación se apoderó de ella. Inés dejó de releer y dejó la pluma.</p>

<p> Si Óscar era la víctima, entonces ninguna mala acción podía considerarse un pecado. Así que, por mucho que lo mirara, no tenía ningún recuerdo de haber cometido realmente un pecado, hasta el momento de su muerte.</p>

<p> Soportó once años de persecución y opresión por parte de la familia real, y aguantó incluso después de sufrir cuatro abortos espontáneos. Se dedicó en cuerpo y alma a un marido plagado de enfermedades venéreas, viviendo la vida de una princesa heredera fiel a su matrimonio hasta su último aliento... ¿Qué demonios había hecho mal? Realmente lo había hecho, hasta ese mismo momento...</p>

<p> —...</p>

<p> Mientras recordaba vagamente el final, de repente palideció y cogió el bolígrafo. El sonido del rasguño le provocó un escalofrío. <span style="font-style:italic; color:#777777">[Suicidio].</span></p>

<p> Inés se quedó mirando fijamente durante un rato la única coincidencia entre su primera vida y la segunda.</p>

<p> No estaba simplemente repitiendo la misma vida para volver a ser infeliz. Aunque así lo había pensado en su profunda desesperación, en realidad no era más que una rutina sin sentido y sin objetivo.</p>

<p> —... Eso no tiene sentido. No es suficiente...</p>

<p> Pero si el motivo original era el suicidio. Porque se había suicidado. Si era porque se había atrevido, porque se había matado a sí misma...</p>

<p> ¿No había vuelto la vida, como las olas, cada vez que elegía el suicidio en su desesperación? Como si el suicidio fuera imperdonable.</p>

<p> Sí. Como si se hubiera atrevido a cometer un acto imperdonable.</p>

<p> Cada vez que elegía la muerte, esperando un final, ese mismo final permanecía imposiblemente lejano, como si fuera un privilegio demasiado grande para ser concedido.</p>

<p> A los veintiséis años, se suicidó y volvió a tener dieciséis. A los veinte, se suicidó una vez más, solo para ser castigada aún más, enviada once años atrás desde su yo de dieciséis años.</p>

<p> ¿Y ahora qué? No importaba cuándo ni cómo muriera, ¿siempre acabaría empezando desde los seis años y luego retrocediendo otros once? ¿Se convertiría en un fantasma que vagaba por Pérez, esperando solo a que sus padres la concibieran, para convertirse en un niño en el útero? ¿Tenía que repetir esto hasta que ya no pudiera suicidarse...?</p>

<p> Inés volvió la mirada con exasperación, solo para descubrir el retrato del Príncipe Heredero tirado descuidadamente en el suelo una vez más, y apretó los dientes.</p>

<p> Óscar le había dado un regalo. Una nueva hipótesis concreta que lo convertía en una presencia aún más irritante.</p>

<p> ¿De quién fue la culpa de ese primer suicidio? Primero le robaron la vida, luego le robaron el derecho a morir dignamente...</p>

<p> —¡Inés!</p>

<p> El culpable reapareció ante sus ojos como un fantasma. Ella arrugó el papel a una velocidad asombrosa, dejándolo ilegible, y lo arrojó debajo del escritorio.</p>

<p> Óscar, obligado a relacionarse con Luciano debido a la indiferencia de Inés, la vio en el salón y puso una expresión de inmenso deleite, hasta que se fijó en el retrato tirado en el suelo. Al instante, su rostro se descompuso como un cristal roto.</p>

<p> Como si no fuera el cuadro lo que yacía en el suelo, sino él mismo.</p>

<p> —Inés, ¿por qué está mi retrato aquí tirado así...?</p>

<p> Lejos de responder, quería correr inmediatamente hacia él, estrangularlo y eliminar ese vil brote. Sin embargo, por muchas veces que se repitiera la vida, él seguía siendo el Príncipe Heredero de una nación.</p>

<p> Inés exhaló profundamente, como si estuviera cultivando su espíritu, y luego abrió los ojos.</p>

<p> —No lo sé. Parece que se ha caído por sí solo.</p>

<p> —¿Por sí solo?</p>

<p> —¿Quién se atrevería a tocar el retrato de Su Alteza, ni siquiera con la punta de un dedo? Es tan sagrado como una imagen santa.</p>

<p> —Bueno, eso es cierto... Fue una negligencia del asistente. Tenía la intención de colarlo a escondidas para darte una sorpresa, pensando que podríamos admirar la obra juntos.</p>

<p> <span style="font-style:italic">Ay, cielos...</span> Óscar vio cómo su noble rostro rodaba por la alfombra, pero se obligó a actuar como un adulto, fingiendo no estar nervioso. Sacudió la cabeza y profirió una exclamación incómoda.</p>

<p> Sin embargo, su mirada vacilante estaba completamente fija en sí mismo, con las alas extendidas sobre la alfombra. Parecía dispuesto a marcharse enfurecido, como si fuera a buscar al sirviente que sin duda había cometido este error...</p>

<p> —No esperaba que lo vieras primero. Quería ver la sorpresa en tu rostro.</p>

<p> —Ver su espléndida forma madura de antemano me llena de profunda emoción. Pensar que está destinado a convertirse en un joven tan espléndido...</p>

<p> El destino era completamente inútil. Sin embargo, con solo ver la sonrisa insincera de Inés, la rígida expresión de Óscar se derritió con alivio.</p>

<p> Detrás de ellos, Luciano frunció el ceño, pero ella no le prestó atención mientras se acercaba a ellos.</p>

<p> —No hay ni una pizca de exageración en ese retrato. Siempre les digo a los pintores: “Detesto los adornos innecesarios”. Un retrato es un registro. Ese tipo de cosas no son un registro fiel de uno mismo, ¿verdad? Me gusta mi yo real. Tal y como soy.</p>

<p> —Así es. Su Alteza es lo suficientemente guapo sin adornos.</p>

<p> Desde su enorme y musculoso cuerpo hasta ese par de alas absurdamente grandiosas, nada en él era real, y sin embargo tenía la osadía de decir eso. Óscar no recordaba que hubiera sido tan tonto antes, pero de repente se puso nervioso y parecía demasiado ocupado tratando de engañar a la chica para salvar la situación.</p>
	
<p> Que ella había sufrido recientemente episodios de fiebre que duraban docenas de días y mostraba todo tipo de comportamientos extraños era un secreto que solo conocían unas pocas criadas del castillo de Pérez.</p>

<p> Tal era la perspectiva de Óscar. Inés, que había visitado Mendoza con tanta frecuencia, desapareció de repente sin dejar rastro. Por muchas cartas que le enviara, las respuestas pulcras y adorables que solía enviarle nunca llegaron. Incapaz de soportarlo más, emprendió él mismo el arduo viaje al castillo de Pérez. Sin embargo, lejos de recibirlo con sus habituales ojos brillantes, le dio una fría bienvenida, sin mostrarle apenas hospitalidad. Y entonces llegó esa impactante exigencia: “Quita tus sucias manos de encima…”</p>

<p> ¡Cómo se atrevía a llamarlas manos sucias! Si hubiera sido cualquier otra persona, cortarle las muñecas no le habría bastado. Pero la culpable era Inés. Tenía que haber otra razón. Y él siempre se mantenía las manos limpias... Incluso se las había lavado a fondo una vez más antes de venir aquí. Quizás había causado un malentendido.</p>

<p> Su determinación de tomar a Inés como esposa seguía siendo inquebrantable, por lo que Óscar demostró una madura moderación al no hacer público su sacrilegio. Aunque era humillante haber escuchado esas palabras de su futura esposa, lo que realmente le aterrorizaba no era ese insignificante insulto, sino que se rompiera el compromiso.</p>

<p> Una vez firmado el contrato matrimonial con la Familia Imperial, Inés nunca se atrevería a romperlo, hiciera lo que hiciera. Pero antes de que se formalizara el compromiso, la cosa era diferente. Las altivas hijas de los Grandes de Ortega a veces pisoteaban las palabras de sus padres como si fueran ladridos de perros.</p>

<p> Como Inés era la única hija de la familia Valeztena, la Familia Imperial no insistiría en forzar el asunto. Y el Duque Valeztena no obligaría a su única pequeña hija si ella se negaba.</p>

<p> Después de todo, tenían muchas opciones. Incluso habían manifestado su preferencia por los hijos de la alta nobleza frente al de la realeza como posibles yernos. Y lo habían dicho mirando directamente a los ojos a Óscar.</p>

<p> Por lo tanto, este compromiso en particular dependía por completo de la cabecita de Inés.</p>

<p> —Precisamente por eso, como decía mi padre, hay que asegurárselas mientras son jóvenes y aún no tienen juicio propio...</p>

<p> Sin ella, sus opciones se reducían infinitamente. Tal defecto no tenía cabida en la vida perfecta que había planeado. Lo mejor siempre debe ir acompañado de lo mejor.</p>

<p> Recordando la desacertada enseñanza del Emperador, Óscar volvió a abrir la boca.</p>

<p> —Inés, debo admitir que no me entusiasmaba precisamente escuchar esas palabras de tus labios...</p>

<p> Óscar fingió humildad antes de volverse hacia Luciano y sacudir la cabeza sutilmente, con exasperación.</p>

<p> Ahora que lo pensaba, por aquella época, el comportamiento del Príncipe Heredero, que no era especialmente amable con los chicos de su edad, también había llamado la atención de Inés. Especialmente cuando eran más guapos que él.</p>

<p> Fue a partir de ese momento cuando comenzaron a brotar las semillas de la mezquindad. Mientras Inés observaba su comportamiento con una mirada significativa, Luciano, que era un poco más guapo que Óscar, se dirigió hacia las estanterías contiguas a la sala de recepción.</p>

<p> —Hablando de Pérez. Es realmente hermoso.</p>

<p> Incluso con diez años, el Príncipe Heredero seguía siendo el Príncipe Heredero, y, con toda naturalidad, cambió de tema para refrescar el ambiente.</p>

<p> —Como estabas cansada de dar vueltas en la cama toda la noche, Luciano me llevó a hacer turismo por aquí y por allá en tu lugar.</p>

<p> —Ya veo.</p>

<p> Incapaz de recoger su propio cuadro con sus preciosas manos, ni de llamar inmediatamente a un sirviente para que lo recuperara, pero demasiado avergonzado para dejarlo tirado en el suelo y fingir que no había pasado nada antes de dejarse caer en el sofá, Óscar se sentó en el reposabrazos bajo y continuó.</p>

<p> —Con Pérez siendo tan espléndido, Mendoza debe parecer bastante aburrido. ¿Es por eso que no buscaste a Mendoza en toda la primavera?</p>

<p> —No fue por eso. Y por muy bonito que sea, no se puede comparar con Mendoza, donde reside Su Majestad Imperial.</p>

<p> Cruzó las piernas, como para mostrar lo mucho que habían crecido durante su ausencia.</p>

<p> —Y yo estoy allí, Inés.</p>

<p> —…</p>

<p> —Te esperé toda la primavera. También esperé tus cartas. Me preocupaba que te hubiera pasado algo... ¿Mi petición fue realmente demasiado precipitada? ¿Te resultó una carga? ¿Por eso me evitaste?</p>

<p> —No, Alteza. No es eso. ¿Cómo podría rechazar el honor de verlo?</p>

<p> —Si te resulta una carga, solo tienes que decirlo. Puedo esperar todo el tiempo que...</p>

<p> —Por supuesto que es una carga, sin embargo.</p>

<p> Una respuesta inesperadamente firme. Óscar, que había estado moviendo las piernas tranquilamente, se quedó paralizado en medio del movimiento.</p>

<p> Entonces, como si algo le hubiera golpeado —“¿Cómo no me di cuenta?”—, la miró con una expresión rara, murmurando como hipnotizado.</p>

<p> —... Pareces diferente desde la última vez que nos vimos. Muy diferente.</p>

<p> —Eso no puede ser.</p>

<p> —Tu rostro está pálido, tus ojos están llenos de tristeza... Si todo se debiera a la preocupación, eso podría explicarlo, pero es más que eso...</p>

<p> —...</p>

<p> <span style="font-style:italic">Tienes ojos, ¿no?</span> Inés puso los ojos en blanco bajo los párpados bajos, con un tono cargado de sarcasmo.</p>

<p> —Y hablas con tanta... madurez. Tu tono se ha vuelto de repente excesivamente digno.</p>

<p> —¿Está Su Alteza insinuando que antes era una mujer frívola e indigna?</p>

<p> —Por supuesto que no. Siempre has sido perfecta, Inés. Pero hay algo en ti ahora que es... más, demasiado más, de repente...</p>

<p> —No, Su Alteza tiene razón. Nunca fui realmente perfecta.</p>

<p> Óscar, desconcertado por el repentino gesto patético de Inés al levantar la cabeza, volvió a titubear. Inés extendió su delicada mano y le agarró del brazo.</p>

<p> —¿Le he dicho antes que el retrato se cayó solo?</p>

<p> —¿Quizás?</p>

<p> —Estaba demasiado alterada para decírselo claramente. Estaba completamente hipnotizada, contemplando el retrato de Su Alteza desde tan cerca, era magnífico. Entonces, de repente, sin que la tierra temblara, el cuadro se estrelló contra el suelo, ¡como si quisiera aplastarme!</p>

<p> —¡Cielos! ¿Te hiciste daño?</p>

<p> —Afortunadamente, no. Pero al esquivarlo, pisé el cuadro. Esa huella que quedó en el noble rostro de Su Alteza…</p>

<p> —Eso es... ¿Una huella?</p>

<p> Óscar, al descubrir tardíamente su propio rostro pisoteado, ladeó lentamente la cabeza con incredulidad. La excusa descaradamente inverosímil de Inés no le convenció a Óscar, cuya atención se centró por completo en el hecho de que “quedara una huella en mi rostro”</p>

<p> Su expresión era de auténtica conmoción, como si realmente le hubieran pisoteado el rostro. Inés, con aire arrepentido, miró hacia el cuadro mientras hablaba.</p>

<p> —Su Alteza crecerá hasta alcanzar una estatura tan espléndida, pero yo soy tan miserable que apenas podría creer que me atreviera a estar a su lado. ¿Cómo podría atreverme a estar al lado de alguien tan magnífico...? El cuadro cayó sobre mí porque fui tan presuntuosa como para codiciarlo. Porque me atreví a codiciar a Su Alteza...</p>

<p> —... Ah, mi cara...</p>

<p> —Y así estuve a punto de recibir mi castigo. La caída del cuadro fue voluntad divina. Lo pasé mal toda la primavera, pero al final, Dios consideró oportuno que cayera sobre mí de esta manera, desde donde yacía a salvo sobre el sofá...</p>

<p> —... Espera, ¿qué?</p>

<p> —Decía que incluso Dios se opone a nuestro compromiso, Alteza.</p>

<p> —Qué tontería.</p>

<p> —¿Sabe lo que significa “presagio”?</p>

<p> Óscar vaciló por un momento. Era un hombre tan vulnerable a su propia ignorancia que, en ocasiones, cuando alguien insinuaba que no sabía algo, su mente se bloqueaba momentáneamente.</p>

<p> Miró boquiabierto a Inés.</p>

<p> —Este es un presagio, Alteza. Un presagio de que nuestro compromiso terminará en ruina.</p>

<p> El presagio, aunque nacido de su desahogo, era un hecho innegable.</p>

<p> —Un cuadro que estaba intacto cayó de repente sobre mí y, sin querer, pisé el rostro de Su Alteza. A pesar del presagio, si hubiera sido digna de estar al lado de Su Alteza, habría preferido morir siendo golpeada por el retrato de Su Alteza en lugar de sobrevivir pisoteando el rostro de Su Alteza. Ahora me siento terriblemente culpable hacia Su Alteza...</p>

<p> Cada palabra era incoherente, pero fluían con tanta fluidez que la mente de Óscar se vio afectada por la ilusión de que todas tenían sentido.</p>

<p> Óscar habló sin expresión.</p>

<p> —En lugar de morir... pisoteando mi rostro...</p>

<p> —Mire esto. Su Alteza es demasiado generoso conmigo.</p>

<p> —No, Inés.</p>

<p> —Por eso no puedo estar con Su Alteza. Yo solo puedo conformarme con Enrique Osorno, Dante Ihar, Cárcel Escalante, Leonardo Helves...</p>

<p> —...</p>

<p> —Esos hombres son más que suficientes.</p>

<p> Los nombres de todos los hijos de las cinco familias más prestigiosas de los Grandes de Ortega, salvo los Valeztena, pasaron como los nombres más vulgares.</p>

<p> Inés, como si esas cosas sin valor fueran precisamente de su nivel, soltó el brazo de Óscar, y su mano se deslizó sin fuerza de su agarre.</p>

<p> —Por lo tanto, por favor, olvide nuestro compromiso.</p>

<p> —...¿Cárcel? ¿Acabas de decir Cárcel Escalante?</p>

<p> Aunque ella había pronunciado cuatro nombres, solo uno pareció registrarse en sus oídos. Su expresión se resquebrajó como una fisura y Óscar preguntó.</p>

<p> <span style="font-style:italic">Ah. Siempre le disgustaron los hombres más guapos que él.</span></p>

<p> Entonces no había razón para rechazarlo. En su memoria, no había ningún hombre más perfecto que Cárcel Escalante. Al menos, en cuanto a apariencia.</p>

<p> Inés buscó brevemente en su memoria a Cárcel Escalante. A diferencia de sus recuerdos de palabras, ninguna imagen le venía a la mente con claridad más allá de su forma adulta.</p>

<p> <span style="font-style:italic">¿Cómo era de niño, más o menos a esta edad?</span></p>

<p> Óscar se volvió cada vez más cauteloso a medida que su escultural primo maduraba. Temía que si Inés intercambiaba unas pocas palabras con esa estatua perfecta, se diera cuenta de lo descuidadamente que Dios había creado a su propio prometido. Dudaba, le disgustaba. Más tarde, ni siquiera se atrevió a permanecer a su lado ni un momento...</p>

<p> Óscar era muy consciente de que los cánones de belleza son relativos. Dependiendo de quién estuviera a su lado, podía parecer excepcionalmente guapo o simplemente poseer una belleza normal y corriente. Cárcel Escalante, sin embargo, hacía que cualquiera a su lado pareciera un trozo de arcilla, amasado apresuradamente y abandonado.</p>

<p> Y como ella solía evitar sin dudarlo hacer cosas que a Óscar no le gustaban, era natural que no hubiera ninguna conexión especial entre ellos.</p>

<p> —No sé por qué Su Alteza se ha vuelto tan sensible desde la primavera. Especialmente últimamente... todo el mundo está pendiente de cada movimiento de Su Alteza.</p>

<p> —¿Ah, sí?</p>

<p> —Tampoco deberías preocuparte demasiado por eso. Parece que últimamente algo no le ha salido bien a Su Alteza…</p>

<p> La encarnación misma de las cosas que no salían bien para Su Alteza era Inés Valeztena.</p>

<p> Inés asintió vagamente sin mostrar ningún signo de ello.</p>

<p> A pesar de su evidente molestia por la conversación, Enrique siguió mirando a Inés con afecto. Mirando atrás, independientemente de sus sentimientos hacia su apariencia, él siempre había sido una persona decente en la memoria de Inés.</p>

<p> No era un santo, pero era alguien que no haría daño a nadie deliberadamente.</p>

<p> <span style="font-style:italic">Aun así, desear la muerte de alguien me resulta bastante inquietante…</span></p>

<p> En última instancia, el mejor resultado sería un divorcio en el que nadie muriera.</p>

<p> <span style="font-style:italic">Ojalá algún idiota soltara la lengua y revelara sus defectos, facilitaría el reconocimiento del divorcio. Eso sería lo ideal.</span></p>

<p> Objetivamente hablando, era un tipo decente. Tenía el pelo tan espeso que rivalizaba con el de su anciano abuelo, y había mujeres a las que les gustaba su característico cutis sonrosado. También era bastante perspicaz; en el mundo académico, probablemente se haría un nombre en pocos años.</p>

<p> Además, al haber perdido a su padre prematuramente y ser ya el heredero de su abuelo, tenía muchas más posibilidades de heredar su título antes que cualquiera de los jóvenes aristócratas presentes allí. Así que era natural que muchas mujeres se sintieran atraídas por él…</p>

<p> Inés negó con la cabeza ante Enrique como si fuera un caso perdido.</p>

<p> Buscando en toda su memoria, solo había un rumor en el que Enrique Osorno era el protagonista. Que era un gran amante.</p>

<p> <span style="font-style:italic">... ¿Un gran amante? Eso es lo peor.</span></p>

<p> Un hombre que se casa como se espera y vive solo para su esposa... Si su sueño era pasar la vida protegiendo a su familia, él sería el hombre perfecto para casarse. Pero el éxito con el que soñaba era diferente.</p>

<p> Las mujeres más exitosas del Imperio son aquellas cuyos maridos han muerto, desaparecido o se han divorciado de ellas. Como había descartado las muertes accidentales, su objetivo ahora era solo el divorcio.</p>

<p> La forma más completa de ser humano libre. Una persona capaz de tomar decisiones legales por sí misma. El único camino para convertirse en una entidad independiente…</p>

<p> Una vez que la sombra de Valeztena y la sombra de su marido hubieran desaparecido, tal vez podría volver a enamorarse. O tal vez no importaría si nunca volvía a hacerlo.</p>

<p> Pero daba igual. Porque para entonces, sería un ser perfectamente libre.</p>

<p> —Por cierto, Inés, ¿ha pasado algo en Pérez? Me pregunto por qué solo has llevado negro a las fiestas desde que regresaste a Mendoza…</p>

<p> —...</p>

<p> —No es que no te quede bien, claro. Es solo que... resulta bastante sombrío, un poco lúgubre y bastante triste. Sin embargo, curiosamente, te queda bien…</p>

<p> —...</p>

<p> —Mamá se preocupó bastante cuando de repente empezaste a vestirte así. Se preguntaba si había pasado algo en casa de los Valeztena. Siempre te han gustado los colores vivos. Además, ninguna chica va a una fiesta vestida de negro.</p>

<p> —...</p>

<p> —Eso es lo que dijo mamá. Que una chica vista ropa tan oscura... que parece triste solo con mirarla, solo puede significar que ha sufrido un terrible shock y que su mente se ha vuelto un poco loca, o que alguien ha muerto.</p>

<p> Debía casarse, pero su marido debía desaparecer. Sin embargo, un marido tan meticuloso y cariñoso, que se da cuenta de los cambios en su estado de ánimo, en su ropa, en su pelo, que capta las señales de que su mente está inquieta, no desaparece legalmente del lado de una mujer.</p>

<p> Ella no necesitaba un marido que fuera simplemente aceptable. Necesitaba un hombre que, algún día, desapareciera legalmente de su vida.</p>
 
<p> Las preocupaciones bienintencionadas, aunque prejuiciosas de Enrique fueron totalmente ignoradas, ya que Inés comenzó a examinar a los hijos de los Duques con renovada cautela.</p>

<p> <span style="font-style:italic">¿Dante Ihar?</span></p>

<p> Era un tipo rígido, fiel a las costumbres de su familia. Circulaban algunos rumores triviales, pero no dejaba una impresión duradera. Era un tipo prudente que podía hacer algunas travesuras entre bastidores, pero nunca cruzaría una línea verdaderamente peligrosa, ni siquiera a costa de su vida.</p>

<p> <span style="font-style:italic">¿Leonardo Helves?</span></p>

<p> Apenas tenía un año, dos como mucho. Fuera lo que fuera, seguía siendo un bebé al que había que llevar en brazos. Ella solo tenía seis años, pero a través de unos ojos que veían incluso a los niños de once años como insignificantes, él simplemente no era una pareja plausible. Ni siquiera se le ocurría una vaga imagen de él como adulto.</p>

<p> Su mirada se desvió de Dante Ihar y Leonardo Helves y volvió al hijo mayor de Escalante.</p>

<p> El rostro de la leyenda, destinado a causar el mayor revuelo en la sociedad.</p>

<p> <span style="font-style:italic">Cárcel Escalante...</span></p>

<p> Aunque solo había utilizado el nombre a la ligera para burlarse de Óscar, quizá no fuera tan mala idea después de todo.</p>

<p> Inés prestó más atención a las jóvenes nobles que rodeaban a Cárcel que al propio Cárcel, que solo ofrecía respuestas indiferentes y breves.</p>

<p> Seguirían allí de pie, contemplando a Cárcel exactamente de la misma manera dentro de una década. E incluso veinte años después, cuando cada una hubiera encontrado un esposo.</p>

<p> <span style="font-style:italic">... No está tan mal.</span></p>

<p> A la Inés actual le parecía simplemente ridículo, pero, en cualquier caso, las hazañas mujeriegas de Cárcel, tal y como ella las recordaba, eran muy famosas. Tanto es así que en su día había despreciado y desdeñado a los hombres de su calaña.</p>

<p> —... ¿Inés...?</p>

<p> —...</p>

<p> —Tienes un aspecto muy extraño. ¿Te llevo con el Duque Valeztena?</p>

<p> Enrique seguía observando a Inés con preocupación, pero ahora había desaparecido por completo de su atención.</p>

<p> Como si no oyera nada, Inés se limitó a examinar los rasgos finamente cincelados de Cárcel con ojos benévolos.</p>

<p> Esa apariencia perfecta seguramente se convertiría en una ruina a medida que envejecía, pero también era un hombre que simplemente había perseguido una vida de libertad, rechazando cualquier cosa que requiriera responsabilidad.</p>

<p> Un hombre sin remedio que rechazaba ferozmente todas las propuestas de matrimonio que le llegaban, que incluso se negó a casarse cuando falleció su padre, y que finalmente no heredó su título.</p>

<p> Si renunció a su título porque detestaba el matrimonio, o evitó casarse para impedir heredar el título, o ambas cosas... las opiniones estaban divididas sobre la decisión de Cárcel. En cualquier caso, estaba claro que rehuía cualquier cosa que requiriera responsabilidad personal.</p>

<p> ¡Pero qué virtuoso era! Entre las mujeres que se le echaban encima como una marea, él elegía reunirse solo con unas pocas, y a diferencia de otros, nunca tuvo una esposa engañosa.</p>

<p> Su negativa a comprometerse seriamente con ninguna de ellas llevó a algunos a considerar su conducta frívola, pero, por decirlo de otra manera, significaba que no había ninguna mujer que lo traicionara, ni legal ni emocionalmente.</p>

<p> Que ellas acudieran a él sin esfuerzo y que él no se acostara con todas... eso solo ya era digno de elogio, murmuró Inés con compasión.</p>

<p> Mejor un cuerpo que hiciera que las mujeres quisieran desnudarse, aunque él mantuviera la boca cerrada, que un estafador que no ofrecía más que falsa sinceridad mientras codiciaba el cuerpo de una mujer.</p>

<p> <span style="font-style:italic">Al menos no un estafador.</span></p>

<p> Después de todo, fue la mujer quien vio su cuerpo primero.</p>

<p> Además, aunque era un mujeriego notorio, no tenía ninguna enfermedad venérea grave como otros; era moderadamente promiscuo, estaba rodeado de mujeres, nunca recurrió a la prostitución, no practicaba la sodomía y tenía relaciones sexuales dentro de los límites de la decencia normal... No podía creer que todo el potencial que necesitaba estuviera contenido en ese niño.</p>

<p> Esa era la garantía de Óscar. Si Cárcel Escalante hubiera contraído una enfermedad venérea, pagado por prostitución o contratado a un prostituto, si hubiera hecho siquiera una de esas cosas, el Príncipe Heredero, enloquecido por los celos, lo habría expuesto ante el mundo hacía mucho tiempo. El mujeriego de Cárcel era tan famoso precisamente porque Óscar no había podido encontrar un defecto mayor que ese.</p>

<p> Inés empezó a sentirse cada vez más segura acerca de Cárcel Escalante. Ella podía concebir un hijo de forma limpia, libre de enredos perversos, y el divorcio le dejaría a él con multitud de manchas evidentes.</p>

<p> Además, qué tranquilizador era lo transparente que era su pasado... Incluso Inés, que tenía poco contacto con Cárcel y ningún interés en él, recordaba mucho de los simples chismes que había oído en las veladas. Porque todas las mujeres con las que se acostaba hablaban de ello.</p>

<p> Para las mujeres de Mendoza, Cárcel era un objetivo que simplemente había que alcanzar al menos una vez en la vida. Un hombre que era un sueño para algunas, una medalla de honor para otras. Incluso la mujer más reservada, la dama más recatada, no podía callarse después de acostarse con Cárcel.</p>

<p> Incluso una aventura de una noche era algo de lo que presumir. Circulaban rumores sobre sus posiciones preferidas bajo las sábanas. Cada uno de ellos acompañado de los mayores elogios: “grande y bueno en eso”. A pesar del gran volumen de chismes que circulaban sobre su vida sexual, a diferencia de otros, sus encuentros eran uniformemente sensatos y poco memorables. Simplemente lujurioso, no pervertido.</p>

<p> El revuelo causado por un hombre corriente que se acuesta con diez mujeres no es comparable al causado por Cárcel Escalante al acostarse con una. Eso no lo hacía menos promiscuo, pero era simplemente muy visible. Su delito era que no sentía la más mínima vergüenza, sino más bien orgullo, por sus aventuras de una noche con mujeres.</p>

<p> En consecuencia, también era el tipo de marido que, una vez casado, esparcía ostentosamente sus defectos por todas partes.</p>

<p> —... Perfecto...</p>

<p> Era tan perfecto que la palabra “perfecto” resultaba insuficiente.</p>

<p> Si se trataba de Cárcel Escalante, ni siquiera la Emperatriz se atrevería a interferir. Aunque deseaba desesperadamente una alianza matrimonial con el Duque Valeztena, nunca le gustó Inés como Princesa Heredera. Decía que cuanto más veía los defectos de Inés, más insoportable le resultaba.</p>

<p> Como muchas madres en Ortega, la madre de Óscar estaba convencida de que su hijo era el mejor del mundo.</p>

<p> Por mucho que Inés fuera aclamada en sociedad, para ella no era más que una alimaña que carcomía la reputación de Óscar. Su opinión sobre Inés no podía ser más diferente de la de una niña de seis años que jugaba infantilmente con su hijo.</p>

<p> Sin embargo, la Emperatriz persiguió el compromiso entre el Príncipe Heredero e Inés con tanta diligencia por una sola razón. Era mucho más terrible que el Duque Ihar, que chocaba constantemente con el Duque Escalante en asuntos políticos, o el Duque Helves, que aún se negaba a apoyar al Príncipe Heredero, se uniera al Duque Valeztena mediante una alianza matrimonial.</p>

<p> Pero si esa molesta carga fuera a recaer voluntariamente no sobre el pelirrojo más brillante del mundo, sino sobre ese sobrino esculpido que persistentemente hacía que su hijo perfectamente sano pareciera una creación defectuosa...</p>

<p> Si pudiera trasladar esa carga insatisfactoria al lado de su hermano y también evitar que los grandes nobles se unieran...</p>

<p> <span style="font-style:italic">Lejos de obstaculizarme, seguramente me bendeciría y me ayudaría.</span></p>

<p> ¿Podría haber un hombre más adecuado para el matrimonio? El hecho de que pudiera revolverle las tripas a Óscar era solo una ventaja añadida.</p>

<p> <span style="font-style:italic">Además, es más inteligente de lo que pensaba.</span></p>

<p> El hecho de que nunca se hubiera casado lo demuestra. Lo conocía lo suficientemente bien como para reconocer que no poseía ni una pizca de fidelidad, por lo que tomó esa sabia decisión.</p>

<p> Pero ahora, Cárcel Escalante estaba listo para explorar un camino menos sensato.</p>

<p> Y dentro de las limitaciones del matrimonio, perseguiría la libertad que una vez conoció, encontrando su propia libertad en el camino.</p>

<p> <span style="font-style:italic">Algunos hombres imaginan la vida matrimonial con una mujer tras una sola sonrisa de ella, ¿no es así?</span> Inés fue un paso más allá y ya se imaginaba cómo llevarían a su hijo a las casas del otro cada temporada tras el divorcio.</p>

<p> —Padre, he tomado una decisión.</p>

<p> —¿Hmm?</p>

<p> —Voy a casarme con el hombre más apuesto del mundo.</p>

<p> Inés pronunció estas palabras con una voz rebosante de sueños y esperanza, en total contradicción con la mirada impasible que dirigía a Cárcel. Una niña con recuerdos de adulta era la que mejor entendía el corazón de un adulto.</p>

<p> Cuanto más fantásticamente ingenuas son las palabras, menos puede dudar un adulto de la niña.</p>

<p> —...No estarás hablando de... Cárcel Escalante. ¿Verdad?</p>

<p> El Duque Valeztena desvió la mirada hacia donde señalaba su dedo. Un chico guapo, rodeado por capas y capas de chicas como flores, ladeó la cabeza con confusión, sin entender el gesto de Inés.</p>

<p> Al verlo, el Duque Valeztena inmediatamente frunció el ceño. Sin embargo, no compartió sus pensamientos pesimistas en detalle con su única hija pequeña. Qué tipo de hombre era ese padre, en qué se convertiría ese chico, ya rodeado de tantas chicas, cuando creciera, etc.</p>

<p> El Duque apretó los labios con fuerza, como si estuviera soportando algo, y luego volvió a preguntar con suavidad.</p>

<p> —¿Quieres a un tipo así?</p>

<p> —Sí.</p>

<p> —¿Es esa la única razón? ¿Por qué es guapo?</p>

<p> —Sí.</p>

<p> —Hija mía, realmente juzgas solo por las apariencias...</p>

<p> —Las familias son todas iguales, así que lo único que llama mi atención es esa cara.</p>

<p> El Duque pareció momentáneamente desconcertado por la racional justificación de Inés. Entonces, de repente, una sutil sonrisa se dibujó en sus labios mientras respondía.</p>

<p> —Pero ¿qué hay del Príncipe Heredero? Es guapo y está destinado a ser Emperador, ¿no sería mejor?</p>

<p> —Parece destinado a quedarse calvo, igual que el Duque Escalante.</p>

<p> <span style="font-style:italic">Ja... </span>Una risa entrecortada escapó de los solemnes labios del Duque Valeztena, sonando decididamente indigna. Era una burla rebosante de desprecio privado y genuino.</p>

<p> En cuanto a él, había sido un amigo íntimo que estudió junto al Duque Escalante desde la infancia. Sin embargo, a lo largo de los años, lejos de construir una amistad genuina, no habían hecho más que enzarzarse en rivalidades infantiles, lo que fomentó un peculiar rechazo mutuo.</p>

<p> —Pero Óscar está destinado a ser Emperador, Inés. ¿No te arrepentirás? Estás rechazando la oportunidad de alcanzar una posición muy alta. Si te casaras con él, incluso tu padre tendría que inclinar la cabeza ante ti.</p>

<p> —No me importa en absoluto que mi padre se incline ante mí... Y no me gusta la cabeza calva de Su Majestad el Emperador.</p>

<p> El Duque contuvo una risita.</p>

<p> —Entonces Cárcel también es peligroso.</p>

<p> —Afortunadamente, Cárcel Escalante no se parece al Duque Escalante. Se parece a la Duquesa, por lo que es probable que la frente de Escalante permanezca intacta.</p>

<p> —... Realmente se parece a Su Alteza.</p>
	
<p> No estaba claro si le resultaba especialmente agradable la profecía de que su padre “se parecería al Duque Escalante” y, por lo tanto, se quedaría calvo, o si simplemente le parecía creíble la profecía de que “el Príncipe Heredero algún día se quedaría calvo”.</p>

<p> En cualquier caso, el Duque Valeztena aceptó el capricho trascendental de su hija con buen humor.</p>

<p> —Mi única hija no podría pasar su vida con un hombre calvo…</p>

<p> —Como se esperaba de mi padre.</p>

<p> —Inés Valeztena. Si una cara bonita te importa tanto, deberías casarte con el chico más guapo de todos.</p>

<p> <span style="font-style:italic">Bueno, al fin y al cabo, los malos hábitos se pueden corregir... </span>El Duque murmuró, colocando una mano sobre el hombro de su hija. Era fácil ver de dónde había heredado Inés su temperamento fogoso.</p>

<p> Por un instante, sintió una punzada de remordimiento hacia Cárcel Escalante.</p>

<p> Pero, ¿es realmente malo que un mujeriego reciba su merecido por adelantado?</p>

document.addEventListener("keydown", function(e) {
    if (
        (e.ctrlKey || e.metaKey) &&

    ) {
        e.preventDefault();
        e.stopPropagation();

let tamano = 18;

function cambiarFuente(fuente) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    contenido.style.fontFamily = '"' + fuente + '", serif';
    localStorage.setItem("fuenteLectura", fuente);
}

function cambiarTamano(valor) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    tamano += valor;

    if (tamano < 14) tamano = 14;
    if (tamano > 26) tamano = 26;

    contenido.style.fontSize = tamano + "px";
    localStorage.setItem("tamanoLectura", tamano);
}

function modoOscuro() {
    document.body.classList.toggle("oscuro");

    localStorage.setItem(
        "modoLectura",
        document.body.classList.contains("oscuro")
            ? "oscuro"
            : "claro"
    );
}

window.addEventListener("DOMContentLoaded", function() {

    const contenido = document.getElementById("contenido");
    const fuente = document.getElementById("fuente");

    if (!contenido || !fuente) return;

    const fuenteGuardada = localStorage.getItem("fuenteLectura");
    const tamanoGuardado = localStorage.getItem("tamanoLectura");
    const modoGuardado = localStorage.getItem("modoLectura");

    if (fuenteGuardada) {
        fuente.value = fuenteGuardada;
        cambiarFuente(fuenteGuardada);
    }

    if (tamanoGuardado) {
        tamano = parseInt(tamanoGuardado);
        contenido.style.fontSize = tamano + "px";
    }

    if (modoGuardado === "oscuro") {
        document.body.classList.add("oscuro");
    }
});

</script>

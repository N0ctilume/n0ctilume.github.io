                    ━━━━━━ ◦ ❖ ◦ ━━━━━━

<p> La primera vida de Inés terminó a los veintiséis años.</p>

<p> <span style="font-style:italic">Solo aquellos que han muerto conocen la duración de una vida.</span> Inés conocía esa duración insignificante y finita. Naturalmente, lo sabía porque había muerto, pero no era algo que hubiera aprendido solo después de la muerte. Después de todo, fue decisión propia de Inés poner fin a su vida tras apenas veintiséis años.</p>

<p> Ella misma puso fin a su primera vida con sus propias manos.</p>

<p> Habían sido veintiséis años miserables. Aunque los recuerdos de aquella época eran ahora lejanos, la desesperación del momento en que abrió la boca y se introdujo el cañón seguía siendo vívida. También lo era la cara de tonto del Príncipe Heredero, lo último que había visto.</p>

<p> —Inés, por favor, baja esa arma. Haré lo que sea. Haré lo que me digas hasta que se calme tu ira. Por favor, bájala... Soy tu marido. Ahora soy tu única familia.</p>

<p> Su marido, que tenía la osadía de afirmar que era su única familia, a pesar de que toda su familia estaba viva y bien en el Ducado de Pérez, se arrodilló en el momento en que ella soltó el seguro del rifle de caza.</p>

<p> Cuando le regaló personalmente este rifle a su prometida, a quien le encantaba cazar, nunca imaginó que él mismo se convertiría en su primer objetivo.</p>

<p> —Pase lo que pase, debemos permanecer juntos toda la vida. Lo sabes, ¿verdad? Estabas destinada a ser la Emperatriz de Ortega hace más de veinte años. Debes saber, Inés, que siempre serás mi primera prioridad... Así que baja ese rifle y reconsidéralo.</p>

<p> —Lo he considerado detenidamente.</p>

<p> —Qué serena estás. Muy tranquila. Claro que lo estás... Eres una mujer de pensamiento profundo. Pero yo, antes que tu marido, soy el Príncipe Heredero de una nación. Lo que estás intentando ahora es socavar los cimientos mismos de la Familia Imperial.</p>

<p> —Los cimientos de la Familia Imperial son Su Majestad Imperial el Emperador.</p>

<p> —... Es solo cuestión de tiempo que eso ocurra. Por fin te convertirás en Emperatriz...</p>

<p> —Tu devoción filial por Su Majestad el Emperador es verdaderamente profunda, Óscar. ¿Puedo sugerirte que demuestres esa devoción poniendo fin a tu vida antes de que sea demasiado tarde?</p>

<p> —Matarme es matar a Ortega. Ortega soy yo, y yo soy Ortega...</p>

<p> —Su Majestad es Ortega. No una criatura repulsiva como tú, Óscar.</p>

<p> —Muy acertado. Pero es lo mismo. Es lo mismo. Como Su Majestad es Ortega, y Ortega soy yo, Su Majestad no es diferente de mí. Somos uno.</p>

<p> —¿Tú y Su Majestad son una trinidad o algo así?</p>

<p> —No estás en tu sano juicio, Inés. Por lo tanto, de verdad, por tu propio bien, por el bien de la familia Valeztena, incluso ahora, reconsidera lo que significa servirles...</p>

<p> Después de toda esa postura altiva, la patética imagen de él balbuceando sin cesar en el momento en que le apuntaron con una pistola a la frente... Era tan lamentable que le hizo olvidar momentáneamente su odio hacia Óscar.</p>

<p> Desde niño, Óscar se había amado a sí mismo en exceso, armando un escándalo por el más mínimo rasguño al tensar la cuerda de un arco, como si el Imperio fuera a derrumbarse. Sin embargo, la dignidad que invocaba, agotando cada gramo de su alma para proyectarla, era completamente grotesca...</p>

<p> La conmoción que debió sentir el Príncipe Heredero, que trataba su propio cuerpo como un adorno de cristal, cuando su enfurecida esposa por primera vez le dió una bofetada y le dio una patada en la espinilla, superaba la imaginación de cualquiera. Sin embargo, como la dignidad era más importante que la propia vida, Óscar ni siquiera pudo castigarla.</p>

<p> Para castigarla por sus transgresiones, habría tenido que convertirse en un hombre maltratado por su esposa. No está claro si ese era el problema en sí mismo o si el problema radicaba en convertirse en el primer Príncipe Heredero maltratado por su consorte y divorciado.</p>

<p> En cualquier caso, Óscar soportó la tiranía unilateral de Inés mucho más tiempo del que ella podría haber imaginado. Aguantó los repetidos golpes con objetos que ella le lanzaba, aferrándose a la absurda convicción de que ninguna pareja imperial se había divorciado jamás.</p>

<p> Su oferta de concederle el divorcio como gesto de buena voluntad fue rechazada. Más tarde, incluso sus súplicas para que ella se divorciara de él cayeron en saco roto.</p>

<p> Así que, ¿qué otra cosa podía hacer sino golpearlo? Las palabras eran inútiles con este hombre. Intentó apretar los puños, llevando varios de los grandes anillos que le había regalado personalmente la madre de Óscar. Sintiendo que una simple bofetada en la mejilla no era suficiente humillación para una persona tan noble, incluso intentó aplastarle el cráneo.</p>

<p> Sin embargo, Óscar permaneció impasible. Era tan odioso que le revolvió el estómago.</p>

<p> Óscar siempre fue un hombre para quien su propia dignidad era lo más importante. En su interior, albergaba todo tipo de deseos sexuales pervertidos, que alimentaba en secreto. Tenía planes de reunirse con prostitutos masculinos y cortesanas de alto estándar para satisfacer esas fantasías pervertidas a su antojo. Amante ocultas bajo la ilusión de que nadie lo sabría jamás, orgías de todo tipo y un cuerpo plagado de todas las enfermedades venéreas imaginables... Sin embargo, exteriormente fingía de la forma más repugnante ser el hombre más noble y grandioso del mundo.</p>

<p> De hecho, la actuación de Óscar era bastante espléndida; las mujeres de Ortega envidiaban a Inés únicamente porque era su esposa. Tan magistral, de hecho, que incluso ella misma se había dejado engañar por completo en una ocasión.</p>

<p> Desde los seis años, cuando se comprometió con Óscar tras su cortejo unilateral, hasta su matrimonio aquella primavera, cuando cumplió dieciséis, él fue el hombre más cariñoso del mundo.</p>

<p> <span style="color:#777777">—Nunca habrá otro hombre como Su Alteza Real el Príncipe Heredero. Mira esa espléndida sonrisa... Está mirando a Su Alteza Real otra vez. Solo con la mirada transmite un afecto tan profundo.</span></p>

<p> <span style="color:#777777">—¿Cómo debe ser vivir como la mujer que Óscar ama por encima de todas las demás? Vivir como la mujer a la que el futuro Emperador juró que le daría todo en el mundo... No puedo ni imaginarlo. ¿No parece cada día un sueño?</span></p>

<p> <span style="color:#777777">—En el sombrío mundo de Mendoza, donde todos se casan sin amor, que dos almas tan nobles se aprecien y se amen es un modelo para la sociedad.</span></p>

<p> <span style="color:#777777">—¿Hay alguien más espléndido que Su Alteza Imperial el Príncipe Heredero? Por supuesto, su primo, el Duque Escalante, es incomparablemente más esculpido y apuesto en apariencia, pero su conducta...</span></p>

<p> <span style="color:#777777">—Cárcel Escalante es un imprudente al que no le importa lo más mínimo el matrimonio. No se puede comparar con Su Alteza Real, que vive con devoción, amando solo a su amor de la infancia. Por muy bien esculpidos que sean sus rasgos...</span></p>

<p> Por supuesto, al ser la única hija del Duque Valeztena, que ostentaba el título de Grande de Ortega, Inés ya se contaba entre los orígenes más nobles de Ortega. Su afición por los adornos brillantes y extravagantes, respaldada por la generosa inversión del Duque, la convirtió en la creadora de tendencias en Mendoza. Su excesiva afición por los viajes hizo que su piel bronceada fuera elogiada como “naturalmente saludable”.</p>

<p> De hecho, todo lo que hacía era alabado. Su piel naturalmente oscura y bronceada, que antes se consideraba un símbolo de la clase trabajadora, ahora era celebrada por las mujeres nobles que, creyendo que solo la piel pálida era bella para una dama, se aplicaban polvos tan tóxicos como el veneno, hasta el punto de que alababan su tez bronceada y pecosa.</p>

<p> Al cabo de unos años, todo había cambiado. La piel bronceada, que antes era un símbolo de la clase trabajadora, se convirtió en prueba de aventuras y ocio. Cuando apenas había pasado el invierno, se convirtió en prueba de riqueza, lo que significaba que se poseía una villa en el cálido sur. Incluso si, al llegar la primavera, se volvía a aplicar el maquillaje pálido.</p>

<p> Inés vivía la vida en la cima. Si un día hubiera empezado a caminar hacia atrás, al día siguiente todo el mundo la habría imitado. Era un mundo en el que una mujer que llevaba pantalones era considerada más vulgar que una mujer desnuda, pero ¿qué pasaba cuando montaba a caballo con pantalones de montar? Las revistas semanales publicadas en Mendoza elogiaban unánimemente el porte digno de la Princesa Heredera, acallando cualquier crítica dentro de la Familia Imperial, y las jóvenes nobles mostraban el valor de imitarla.</p>

<p> Su vida: nacida como la única hija de Valeztena, un linaje noble de la más alta categoría; criada como la amada prometida del Príncipe Heredero, objeto de envidia; viviendo como una joven y bella Princesa Heredera. Llevaba vestidos más caros que los de la hija del Emperador y se adornaba con joyas más preciosas.</p>

<p> Aunque no era excepcionalmente hermosa, su rostro era sutilmente como un lienzo en blanco; con solo un poco de esfuerzo en el maquillaje, se volvía sorprendentemente hermosa, y su figura era, por supuesto, perfecta. Entonces, ¿qué podía faltarle?</p>

<p> En un momento dado, estaba tan satisfecha con esa vida perfecta que se esforzó por vivirla aún más perfectamente. Molestaba a los modistos extranjeros a diario para que crearan nuevos diseños, examinaba innumerables invitaciones y reflexionaba sobre qué eventos elevarían su prestigio y garantizarían que fuera el centro de atención. Se mataba de hambre todo el día para conseguir la cintura esbelta que complementara sus hermosos vestidos, pero en los banquetes comía con ganas, más libremente que las otras mujeres, para aparentar que le salía de forma natural, solo para esconderse después en secreto y vomitarlo todo...</p>

<p> ¿Era esa una vida normal?</p>

<p> No sabía decirlo. En aquel momento estaba sumida en una profunda duda, hastiada de su propia mentalidad cruel: si había deseado convertirse en una mujer más perfecta para el Príncipe Heredero o si lo había utilizado para tener una vida más perfecta.</p>

<p> Aun así, amaba a su marido. Aunque solo fuera por unos años, aunque hubiera sido engañada por esa repugnante farsa por un momento, aunque fuera simplemente su propia vanidad la que amaba su estatus... Amor, amor de verdad.</p>

<p> ¿Cómo había podido amar a un hombre así, aunque fuera por un momento?</p>

<p> —Inés, por favor, contrólate.</p>

<p> —Ya lo he hecho, si es eso lo que quieres decir.</p>

<p> —No estás en tu sano juicio. No estás en condiciones de pensar con claridad.</p>

<p> Inés había abortado espontáneamente a cuatro hijos de Óscar, era atormentada por la familia Imperial, que la culpaba cada vez que perdía un hijo, y por la Emperatriz, que manifestaba abiertamente su furia contra ella ante todos.</p>

<p> Así habían sido sus once años de matrimonio.</p>

<p> Óscar nunca se había puesto de su parte dentro de la casa Imperial. Siempre hacía caso omiso de sus súplicas, incluso de las más mínimas muestras de consuelo. Al final, él mismo llegó a la conclusión de que debía de estar maldita con un útero infértil, incapaz de dar a luz a un hijo vivo.</p>

<p> Por muy espléndida que pareciera por fuera, por dentro se estaba marchitando. ¿Y ahora era cuando se consideraba que no estaba en su sano juicio? Nunca había sido normal desde su matrimonio. No podía vivir con normalidad.</p>

<p> Entonces llegó el momento en que se enteró de que todas las enfermedades venéreas que se arrastraban por el cuerpo fino y limpio de su marido habían matado a todos sus hijos. El momento en que recordó todas las noches horribles que él había pasado, ignorando las negativas de su esposa embarazada, penetrándola para satisfacer sus propios deseos con esa inmundicia...</p>

<p> Su cuerpo, que no había conocido a ningún otro hombre en toda su vida, llevaba la marca indeleble de cada acto inmundo que él había cometido. Aunque nunca había hecho nada vergonzoso en su vida, estaba siendo castigada. Por el único delito de haberse casado con esa criatura vil.</p>

<p> Sin embargo, más inmundo que la enfermedad es el deseo.</p>

<p> Sabía que padecía una terrible enfermedad, pero abrazaba a su desprevenida esposa sin restricciones. La hacía tumbarse como a un perro, incluso cuando llevaba en su vientre a su heredero. Incluso cuando ella le suplicaba que la perdonara solo por esta vez, él se montaba sobre ella como una bestia.</p>

<p> Debía de parecerle absolutamente adorable, temiendo otro aborto espontáneo por el mero hecho de mantener relaciones sexuales. ¿Podría una excusa tan débil haber sido suficiente para un hombre que no sentía ningún remordimiento especial, ni siquiera por propagar su repugnante enfermedad?</p>

<p> Para satisfacer un impulso momentáneo, no le importaba su bienestar, ni el de su hijo. Para él, no tenía ningún valor desde el principio. De hecho, ni siquiera albergaba la malicia de destruirla. Realmente lo hizo sin pensarlo dos veces. Ni siquiera la odió por un momento. No sintió ningún tipo de odio. Sin embargo, fue capaz de hacer algo así.</p>

<p> Y luego, durante tres años, no fue más que esa mierda de que la amaba y no podía dejarla ir.</p>

<p> Mirando atrás, los cuatro abortos espontáneos fueron una bendición. Una semilla como esta era mejor que estuviera muerta. Nunca debería haber nacido en este mundo. A un ser humano como este nunca se le debería haber permitido dejar descendencia. Debería haber muerto como si nunca hubiera existido en este mundo. Sin dejar rastro de haber vivido.</p>

<p> Si tan solo un hijo hubiera nacido sano y salvo, habría sido un pecado imperdonable. Ella apartó el dolor, la profunda sensación de pérdida, con un rápido movimiento. Si ese niño hubiera nacido entonces... Rompió los lazos con todas esas innumerables noches pasadas llorando.</p>

<p> Cuando se lo proponía, podía cambiar de actitud más rápido que nadie. Sí, en esta vida miserable, no haber tenido hijos era su único consuelo.</p>

<p> Desde el momento en que Inés se casó con Óscar, su vida se había sumido irremediablemente en un pozo negro. Un hijo podría haber sido precioso para ella, pero nunca la habría salvado. Haber deseado una vida diferente y haber querido un hijo. Haber creído que tener un hijo le traería la felicidad...</p>

<p> Mató el anhelo persistente, como un vestigio, y las esperanzas frustradas una y otra vez, con la misma determinación con la que le habría roto el cuello a Óscar. Y antes de que se le pudiera atribuir el estigma de que la Princesa Heredera había muerto de sífilis, decidió optar por una muerte un poco prematura, pero mucho más eficaz.</p>

<p> —Puedo ver todo con claridad ahora.</p>

<p> Nunca había tenido la intención de matarlo ni de acabar con la familia Valeztena. Él no merecía la pena.</p>

<p> —Dijiste que nunca hubo una pareja divorciada en la familia imperial de Ortega, ¿no? Que no podías convertirte en el primer fracaso de la línea imperial.</p>

<p> Un trapo, un pedazo de basura, un bastardo... Lo llamaras como lo llamaras, era un eufemismo para ese bulto plagado de enfermedades venéreas... Retiró la mordaza de la inmundicia. El Príncipe Heredero, aún receloso de las acciones de su esposa, no mostró inmediatamente su alegría, sino que la miró con compostura contenida.</p>

<p> —Te convertiré en el verdadero fracaso.</p>

<p> Era de los que se quejaban de miedo ante un simple divorcio.</p>

<p> —Te convertirás en el primer Príncipe Heredero que lleva a su esposa al suicidio.</p>

<p> —...</p>

<p> —La razón es que vivir en este mundo contigo es repugnante e insoportable.</p>

<p> —Inés. No me digas que... No...</p>

<p> —No puedo soportar estar ni un minuto más, ni un segundo más junto a un hombre como tú.</p>

<p> La mañana luego de su muerte, todos las portadas de los periódicos de Mendoza publicarán la nota de suicidio de la Princesa Heredera. “No tuve más remedio que morir, ya que no me concediste el divorcio”. Ella misma había decidido el titular.</p>

<p> Revelaría todos los detalles viles de los que solo podía escapar mediante la muerte, revelando a todos sus súbditos que el Príncipe Heredero destinado a gobernar el Imperio no era más que un pervertido asqueroso, que buscaba indiscriminadamente la gratificación sexual tanto de hombres como de mujeres.</p>

<p> Se introdujo el cañón en la boca y preguntó. El cuerpo de Óscar pareció levantarse con una lentitud agonizante. La satisfacción la invadió.</p>

<p> Óscar Valenza de Ortega, el marido más perfecto del Imperio, no sería más que un montón de basura al final del día.</p>

<p> Y así murió, en un ataque de ira.</p>


<p> <div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>


<p> Su primera muerte fue una elección muy racional, pero al mismo tiempo muy irracional.</p>

<p> Inés era una persona de sangre caliente por naturaleza. Por decirlo de forma suave, era ese temperamento característico de la gente de Ortega, a menudo descrito como “apasionado” en climas más cálidos.</p>

<p> Ni siquiera la noble hija de un Duque, a la que se le había concedido el estatus de Grandes de Ortega, era una excepción.</p>

<p> Apenas había otra nación en la que se produjeran tantas muertes por venganzas privadas y duelos, independientemente de la edad, el sexo o el rango. Teniendo en cuenta su propensión a provocar incidentes accidentales, los Emperadores de Ortega, a lo largo de varias generaciones, ya habían perfeccionado un estricto código penal.</p>

<p> Sin embargo, la naturaleza apasionada del pueblo de Ortega no era del tipo racional que temía las repercusiones o consideraba las consecuencias. Si pensaban “quiero venganza”, la mayoría la tomaba; si pensaban “quiero matarlo”, la mayoría lo mataba.</p>

<p> Lo que sucedía después les importaba poco. Porque si uno no mataba a la persona que merecía la muerte, vivir no era vivir. Si uno no podía vengarse, respirar no era diferente a estar muerto.</p>

<p> Sin embargo, Inés era una mujer noble, educada en las mejores tradiciones, una mujer que había pasado su vida aprendiendo a soportar y a ocultar sus sentimientos. No era exagerado decir que las cosas que había reprimido en su ajetreada vida para mantener la elegancia habían estallado de repente. Sin embargo, incluso cuando arriesgó su vida, ¿no pensó en las consecuencias?</p>

<p> No era ella quien debía desaparecer de este mundo, sino su marido, esa alimaña. Pero no podía enviar a toda su familia a la guillotina solo para deshacerse de esa alimaña. Siempre había sido la hija y hermana normal y querida.</p>

<p> Ellos no tenían ninguna culpa. Por lo tanto, tenía la intención de enterrar al Príncipe Heredero vivo —socialmente, claro está— sin hacer daño a nadie más. Inés no veía ningún error en ese juicio. Era una conclusión moralmente irreprochable. Es cierto que él parecía haber muerto algo enfurecido. Quizás pereció en un ataque de ira... Pero ¿quién, de pie en ese precipicio, podría haber llegado a una conclusión más pacífica?</p>

<p> Su muerte no perjudicó a nadie. Ni siquiera a esa rata del Príncipe Heredero del burdel. Aunque había sido golpeado hasta quedar inconsciente en vida, ¿no había terminado sin un solo dedo roto?</p>

<p> Nada más que todas sus extrañas paredes quedaran al descubierto para que el mundo las viera...</p>

<p> Incluso después de reflexionar, fue una decisión sumamente virtuosa. No había buscado ninguna gran recompensa. Simplemente cerró los ojos, esperando humildemente que, si existía un Dios, la llevara a un lugar un poco mejor, o que no importara de cualquier manera.</p>

<p> Eso era todo. Dado que su cráneo se habría destrozado en el momento en que sonó el disparo, la única satisfacción que sintió fue una insignificante, al recordar la débil constitución del Príncipe Heredero.</p>

<p> —...</p>

<p> Así que simplemente no había forma de saberlo. En el momento en que cerró los ojos, Inés se encontró reabriéndolos en medio del coto de caza, sosteniendo un pesado rifle de caza que le presionaba ambas manos.</p>

<p> Su peso era exactamente el mismo que antes de morir, lo que le hizo creer por un momento que todavía estaba en proceso de morir. Que aún no estaba muerta, sino simplemente esperando a que le volaran la cabeza en ese terrible estado.</p>

<p> Sin embargo, a diferencia de la sensación de haberse metido impulsivamente el cañón en la garganta y haberse disparado, Inés ahora sostenía el rifle en una postura perfectamente erguida, como en cualquier otra cacería. Lista para atrapar cualquier presa que se elevara hacia el cielo en cualquier momento.</p>

<p> Inés miró a su alrededor, como si el entorno le resultara desconocido. No era un recuerdo muy reciente, pero era un lugar familiar. El Ducado de Pérez, el coto de caza cerrado donde ella y su hermano Luciano solían cazar.</p>

<p> —... Esto es absurdo.</p>

<p> Desde que se había casado a los dieciséis años, nunca había vuelto aquí. Bajo la estricta administración de la Corte Imperial —y la vigilancia disfrazada de administración— había poco que pudiera hacer por su cuenta. Entre esas pocas cosas, visitar el Ducado de Pérez o ir a cazar a solas con su hermano eran actividades para las que nunca podría esperar obtener permiso.</p>

<p> Así que esto significaba...</p>

<p> Inés buscó instintivamente en su memoria y encontró inmediatamente el estanque. A diferencia de sus lejanos recuerdos, no era tanto un estanque como un pequeño pantano escondido entre la espesura, pero su superficie era lo suficientemente clara como para reflejar objetos.</p>

<p> Se agachó, colocando torpemente el largo rifle bajo el brazo como si fuera una molestia.</p>

<p> El agua del bosque, sin que la tocara ni una pizca de viento, reflejaba a la Inés de dieciséis años sin la más mínima alteración.</p>
<p> <div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p> <span style="font-style:italic">Es un sueño. Esto es un sueño. Un sueño muy largo, sin duda...</span> Inés le había pedido a Luciano que le diera unas bofetadas, pero él le había respondido con cariño: “¿Te estás volviendo loca de felicidad justo antes de la boda?”</p>

<p> En lugar de seguir molestando a su hermano, intentó golpearse el brazo con el rifle, pero Luciano la detuvo horrorizado. Entonces se abalanzó contra un árbol cercano y se estrelló contra él con el hombro, mostrando un comportamiento muy extraño. Luciano la miró como si estuviera loca, pero no importaba.</p>

<p> El dolor era agudo. Excesivamente agudo... Parecía demasiado largo para ser un último flashback antes de la muerte, y parecía que había pasado una eternidad desde que había apretado el gatillo. Si era así, al menos no se trataba de un sueño.</p>

<p> Entonces, ¿qué había sido de la Inés de veintiséis años? Su último año, soportado día a día con el pensamiento de querer matar a Óscar, toda la persecución y el desprecio de la familia real... eso era demasiado prolongado y angustiante como para llamarlo sueño.</p>

<p> Los once años vividos con Óscar. Todos esos recuerdos estaban esparcidos a lo largo del tiempo. Recuerdos lejanos en lugares lejanos. Recuerdos recientes en lugares cercanos... Claramente había vivido diez años más allá de su forma actual. Esa sensación de realidad tampoco podía negarse.</p>

<p> ¿Cómo podía ser que esa larga y terrible experiencia fuera solo un sueño?</p>

<p> Inés, acurrucada en los brazos de Luciano mientras abandonaban los terrenos de caza, no dejaba de tocarle la mejilla. Su hermano, apenas tres años mayor que ella, había sido un joven de veintinueve años antes de su muerte, pero no podía compararse con el vigor fresco y juvenil de los diecinueve.</p>

<p> Diecinueve años. En su mundo, Luciano había sido un simple joven de diecinueve años...</p>

<p> —... Inés, no puedo evitar pensar. ¿Has intercambiado tus medicinas con las de mamá esta mañana?</p>

<p> Incluso después de regresar al castillo de Pérez, su comportamiento excéntrico persistió. Amasaba los rostros juveniles de sus sirvientas más cercanas como si fueran masa, con los ojos extraños y desenfocados. Cada vez que algo la confundía, daba patadas a las patas desiguales de la mesa consola o se golpeaba el dorso de la mano con un pesado tintero, sin cesar en su autolesión.</p>

<p> Finalmente, a altas horas de la noche, arrastrada por Luciano y prácticamente encarcelada, enroscada en las sábanas, miraba fijamente al techo como un cadáver en un ataúd antes de llamar a su hermano, que la observaba con preocupación.</p>

<p> —Luciano, ven aquí.</p>

<p> —¿Para qué?</p>

<p> —Ven, ven.</p>

<p> Él miró a su hermana con recelo antes de inclinarse sobre la cama. Inés luchó por liberar su brazo atrapado dentro de la colcha, y finalmente consiguió sacar una mano.</p>

<p> —Inés Valeztena, tú otra vez.</p>

<p> —... Tan, tan fresco. Luciano.</p>

<p> Jugó con la cara de su fornido hermano mayor, murmurando durante un buen rato que estaba fresco y verde, o tan joven que daba asco. Para cualquiera que la observara, no parecía normal. Luciano se echó hacia atrás, liberando su cara del agarre de Inés.</p>

<p> Juana, la criada que la había servido desde su infancia en el Ducado, asomó de repente la cabeza a su lado y murmuró.</p>

<p> —Señor, ¿podría ser que la señorita esté actuando así por el matrimonio?</p>

<p> —Esa sería la única razón. Dijo que sentía que podría salir volando.</p>

<p> —Juana, ven aquí tú también.</p>

<p> —Ya has tenido suficiente con mi cara, ¿no?</p>

<p> —Eres realmente hermosa... ¿Te lo he dicho alguna vez?</p>

<p> —No desde esta tarde, ya me cansé de oírlo.</p>

<p> —Hermosa y tan joven... Mira qué piel tan fresca... Este año cumples diecisiete, ¿verdad?</p>

<p> —Eres como un viejo pervertido obsesionado con las chicas jóvenes. Para, Inés.</p>

<p> Luciano agarró la mano de Inés y la metió debajo de las sábanas. Pero Inés no podía apartar los ojos del rostro de Juana.</p>

<p> Como en el coto de caza, todo lo relacionado con Pérez se había detenido a los dieciséis años... En sus sueños, nunca volvió a poner un pie en el castillo de Pérez hasta que murió.</p>

<p> Las criadas a las que tanto quería, el hermoso patio donde jugaba con Luciano, el punto más alto de la torre del castillo... Todo se convirtió en cosas que nunca volvería a ver, alejándose en la distancia.</p>

<p> No sabía cómo habían pasado los años allí, ni en qué se habían convertido Juana y las criadas. Pérez hacía once años. La gente de Valeztena en aquel entonces...</p>

<p> Todo permanecía absurdamente igual. Tal y como había sido durante la última primavera que pasó aquí.</p>

<p> —... Primavera. Era primavera.</p>

<p> —¿Qué?</p>

<p> —Sigue siendo... primavera. La primavera aún no ha pasado...</p>

<p> —Bueno, es primavera y...</p>

<p> Los ojos de Luciano volvieron a adoptar esa mirada que le dirigía cuando pensaba que estaba loca, pero ella se acarició la cara con manos temblorosas.</p>

<p> —En cuatro meses te casarás con el Príncipe Heredero. En quince días debes partir hacia Mendoza. Si allí te comportas como una loca, tal y como haces aquí...</p>

<p> —No lo haré.</p>

<p> —Mamá lo ha dicho una y otra vez. ¿Recuerdas? En Mendoza, antes de tu boda, no escatimarán esfuerzos para limpiarte hasta la más mínima mota de polvo de los hombros. Óscar ya es demasiado bueno para ti. Excesivamente bueno... Entiendo que el peso de eso te aplaste, pero...</p>

<p> —...</p>

<p> —Maldita sea, ¿quizás deberíamos haber llamado al médico después de todo? Juana, mira sus ojos. Parece que no me está escuchando.</p>

<p> —...Más que eso. Creo que debería tener cuidado, señor...</p>

<p> —¡Quién es demasiado para quién!</p>

<p> Inés gritó como una loca, apartó las mantas de una patada y se abalanzó sobre su hermano. Luciano, con la garganta aplastada, cayó de espaldas sobre la cama. Incapaz de hablar, miró con los ojos muy abiertos mientras su hermana le golpeaba, lanzando un grito silencioso.</p>

<p> —¡Quién! ¡Quién para quién!</p>

<p> —¡I-Inés!</p>

<p> —¡Señorita!</p>

<p> —¡Repítelo! ¡Mírame a los ojos y repítelo!</p>

<p> Gritó locamente, con las manos agarradas al cuello de Luciano. Incapaz de responder con la garganta aplastada, Luciano fue golpeado aún más ferozmente por el delito de no responder.</p>

<p> La sensación de golpear a alguien mientras está vivo... Esto también era realidad. Esta sensación por sí sola no podía ser falsa. De repente, sonrió significativamente y se bajó del estómago de Luciano.</p>

<p> La escena era tan extraña que Luciano, que tenía la intención de lanzar graves maldiciones a Inés, olvidó momentáneamente qué decir y se limitó a mirarla.</p>

<p> —... ¿Te volviste realmente loca? Dime, Inés. ¿En serio tomaste la medicina de mamá en lugar de la tuya...?</p>

<p> La sensación de golpear a Luciano reflejaba la sensación de golpear salvajemente a Óscar como si fueran gemelos.</p>

<p> Como si el peso del rifle que había sostenido boca abajo antes de morir permaneciera inalterado incluso después de abrir los ojos en los terrenos de caza.</p>

<p> Todo era real. La vida desesperada a los veintiséis años, la vida insensata a los dieciséis años dedicada a soñar con convertirse en la esposa de Óscar... nada de eso era un sueño. Inés lo había confirmado a través de docenas de experimentos.</p>

<p> Era la primavera de su decimosexto año, cuatro meses antes de su matrimonio con Óscar.</p>

<p> Había regresado. De vuelta al momento justo antes de que todas las desgracias de la vida se abatieran sobre ella.</p>

<p> Era tanto una oportunidad como una bendición. La recompensa por la bondad que no hacía daño a nadie, tragándose todo su odio. El valor de la resistencia. Una oportunidad para concluir adecuadamente su vida antes de llegar al cielo. Un destino bendecido por Dios... En ese momento, ella creía que era así.</p>

<p> Cuando sólo conocía una muerte.</p>

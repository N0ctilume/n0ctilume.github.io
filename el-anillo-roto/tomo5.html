<p>Al parecer, Cárcel se había desabrochado un par de botones para relajar el cuello y ahora parecía considerablemente más cómodo que antes. Aunque la camisa y los pantalones seguían ajustándose perfectamente a su robusta complexión, sin dar la impresión de estar holgados, los tirantes de cuero de color claro abrochados sobre la camisa sugerían al menos que se sentía cómodo.</p>

<p>—... Realmente te mantienes firme hasta el final, ¿verdad?</p>

<p>Con una leve sonrisa, despidió primero al mayordomo del vestidor.</p>

<p>—Inés, no estarás intentando compensar lo de la cena, ¿verdad?</p>

<p>—¿Soy tan transparente?</p>
<p>—Precisamente porque no eres transparente es que eres fácil de adivinar. Al fin y al cabo, llevamos diecisiete años juntos.</p>

<p>No contento con mostrarse inesperadamente entusiasta, ahora fingía leerle la mente. Probablemente porque últimamente su propia cabeza había estado bastante vacía.</p>

<p><span style="font-style:italic">Era hora de despertar.</span> Inés asintió en silencio.</p>

<p>—Nunca imaginé que llegaríamos a esto.</p>

<p>—Es una compensación por no haber preparado la comida con antelación.</p>

<p>—Cuando no estas aquí, como lo que Yolanda me sirve. A menos que insistas en que me involucre, no hay necesidad de que me obligue…</p>

<p>—Qué obligación tan fácil... No querría perdérmela.</p>

<p>Cárcel miró momentáneamente desconcertado la respuesta de Inés, luego asintió vagamente como diciendo: “¿Cómo podría entenderte?”, y abrió la puerta del vestuario.</p>

<p>Después de enviarla delante y cerrar la puerta tras él, volvió a preguntar.</p>

<p>—¿Así que cumpliste con tu obligación mirándome cambiarme de ropa como una pervertida?</p>

<p>—Qué grosero llamarme pervertida. Solo intentaba ayudarte a cambiar.</p>

<p>—¿Quedándote solo ahí parada mirando?</p>

<p>—Para preparar la comida solo hay que decir cosas como “hazlo así” o “no me gusta el cordero”. Es parecido, ¿no?</p>

<p>—¿Por qué no te gusta esa delicia?</p>

<p>—¿Importa eso?</p>

<p>—No puedes ayudarme a cambiarme de ropa. No lo vuelvas a hacer. Solo estorbas.</p>

<p>—¿Cómo puede estorbar el hecho de que esté quieta?</p>

<p>—Tus ojos estorban.</p>

<p>—…</p>

<p>—Casi me pillan.</p>

<p>Al fin y al cabo, la cama estaba justo al otro lado de la puerta... Aquella frase murmurada sonó tan sincera que Inés se retiró rápidamente al dormitorio. Al ver sus pasos apresurados, Cárcel se rió entre dientes.</p>

<p>—Nadie ha dicho que vaya a comerte, ¿por qué sales corriendo así?</p>

<p>—Suéltame, vete.</p>

<p>—Ven conmigo.</p>

<p>—Ah, no. Vete.</p>

<p>Inés agitó los brazos como si luchara, casi dejando que Cárcel le agarrara la mano. Él volvió a reírse suavemente y la atrajo fácilmente hacia él por la cintura.</p>

<p>Ella intentó empujarlo con cierta dignidad, con el cuerpo apretado contra él contra su voluntad, pero él era tan fuerte como siempre, como cualquier otra mañana. Cárcel le susurró al oído:</p>

<p>—Casi se me levanta, pero al final no lo hizo, ¿verdad?</p>

<p>—El problema es que ahora tienes la oportunidad, el potencial e incluso la audacia de ni siquiera dudarlo en lo más mínimo.</p>

<p>—Me he saltado el almuerzo. Primero voy a saciar mi hambre antes de pensar en hacer nada contigo.</p>

<p>—¡Como si te lo hubiera pedido...!</p>

<p>En el momento en que Inés se encontró con la criada que se acercaba a ella desde el otro lado de la habitación, con una cesta de ropa sucia en la mano, cambió instantáneamente su expresión de reproche hacia Cárcel por una sonrisa amable. Naturalmente, se apoyó afectuosamente a su lado, como una hermosa armonía.</p>

<p>Cárcel captó esa expresión con la mirada baja y levantó una ceja.</p>

<p>—¿A qué viene esa mirada?</p>

<p>—¿Y a qué viene esa ceja?</p>

<p>—Yo pregunté primero, Inés.</p>

<p><span style="font-style:italic">Infantil...</span> Aunque Inés lo murmuró abiertamente, Cárcel parecía totalmente indiferente. <span style="font-style:italic">No. No debo dejarme llevar por esto... </span>¿Qué viento le había llevado a comportarse como un marido recién casado de vez en cuando? El potro necesitaba reglas.</p>

<p>Tal comportamiento podría ser tolerable en la intimidad de su dormitorio, ahora que estaban algo acostumbrados a ello... pero, aun así, era totalmente inaceptable en la mansión al atardecer, con los sirvientes revoloteando por todas partes.</p>

<p>—Compórtate como un buen señor en tu propia casa. Con dignidad.</p>

<p>—Creo que me estoy comportando como un buen señor.</p>

<p>—Que el señor y la señora den un espectáculo en un lugar por donde pasan sirvientes a todas horas... Eso...</p>

<p>—Eso…</p>

<p>—No puedes ir por ahí molestando a tu mujer así en cualquier sitio.</p>

<p>Aunque apoyaba la mitad de su peso sobre él mientras caminaban, lo regañó con firmeza. Sin embargo, quizá consciente de que los sirvientes podían reaparecer en cualquier momento, no hizo ningún intento por separarse de su brazo.</p>

<p>Cárcel comentó con indiferencia.</p>

<p>—Kara parecía bastante complacida.</p>

<p>—Solo está fingiendo. ¿Y si lo ha oído? Estando en el pasillo o donde sea...</p>

<p>—Inés, tú eres la que debería tener cuidado.</p>

<p>—¿Qué?</p>

<p>—Si sigues diciendo eso, realmente sucederá.</p>

<p>Incluso mientras bajaban las escaleras, ella respondió con frialdad, como si no fuera asunto suyo.</p>

<p>—Aún no es de noche, así que encárgate tú mismo como si fuera de mañana.</p>

<p>—Suena como si estuvieras diciendo que te encargarás tú misma cuando sea de noche.</p>

<p>Lo dijo con tanta naturalidad, sin siquiera una sonrisa maliciosa. Inés reunió su paciencia una vez más para reprenderlo.</p>

<p>—Interpretar constantemente las palabras de los demás de forma arbitraria para beneficio propio no es propio de un caballero.</p>

<p>—Ahora somos familia.</p>

<p>—Lo mismo ocurre con la familia. No puedes usar sus palabras a tu antojo.</p>

<p>—Tú no te dejas manipular, sabes.</p>

<p>—Bueno, el mundo no es tan fácil de manipular y yo soy una mujer de mal genio, tal y como dices.</p>

<p>En cuanto su pie tocó el suelo de la primera planta, se deslizó con naturalidad de sus brazos.</p>

<p>—Ahora que estamos casados, madura, Cárcel.</p>

<p>Pensó que era una conclusión perfecta para su sermón, pero, al igual que esa mañana, su brazo persistente la siguió, tirando de ella inevitablemente hacia su lado. De hecho, incluso se encontró colgando en el aire por un momento. Eso hizo que el peso que había ganado rápidamente desde su llegada a Calstera pareciera insignificante.</p>

<p>—¡Escalante!</p>

<p>—Cuando me llamas así, no sé a quién te refieres.</p>

<p>—¡Tú hermano no está aquí...!</p>

<p>—Tú también eres Escalante, Inés.</p>

<p>Las palabras sonaron bajas y territoriales a primera vista, lo que hizo que Inés lo mirara con ligera sorpresa. Al ver su rostro tranquilo de siempre, quedó claro que solo era su imaginación, pero algo sutilmente persistente permaneció como un residuo.</p>

<p>Entrecerró ligeramente los ojos y los fijó en Cárcel.</p>

<p>—A menos que haya perdido la cabeza, no me llamaré a mí misma por mi nombre.</p>

<p>—Cierto. Eres inteligente.</p>

<p>—... ¿Por qué actúas así hoy?</p>

<p>—Tú eres la que actúa de forma extraña hoy. Inés Escalante.</p>

<p>—Cárcel.</p>

<p>—Sí. Empezaste a llamarme correctamente.</p>

<p>A diferencia de arriba, Cárcel se limitó a levantar las comisuras de la boca en una sonrisa antes de conducirla al pasillo que llevaba al comedor. Raúl, que salía en dirección opuesta con el mayordomo de la mansión, los vio y volvió a inclinarse profundamente.</p>

<p>—Señor, señora. Por favor, perdonen mi intrusión.</p>

<p>En su vida anterior, sin duda había mostrado todas las formas imaginables de vulgaridad al dar órdenes a Raúl sin una pizca de vergüenza. Sin embargo, tal vez era porque había vuelto a crecer desde la infancia con un niño que no sabía nada. O tal vez era porque él era quien, junto con Juana, le había abierto la boca a la fuerza y le había obligado a comer. ¿Era así cómo se sentiría si fuera sorprendida por su hermano Luciano aferrándose a un hombre...? Esos pensamientos pasaron por la mente de Inés en un instante.</p>

<p>En realidad, ella solo se había aferrado al lado de su legítimo esposo con una ternura casi vergonzosa... Al final de su cadena de pensamientos, Inés se liberó milagrosamente del brazo de Cárcel. Sus ojos se oscurecieron momentáneamente, pero no había tiempo para mirar.</p>

<p>La sensación de ser sorprendida por Luciano mientras se aferraba a un hombre. Eso era precisamente. Habiendo mostrado a su familia una imagen indecorosa, tenía que decir cualquier cosa para salvar el momento y luego dejarlo pasar.</p>

<p>—Raúl, ¿cenaste?</p>

<p>—Aún no he comido, pero cuando ustedes dos hayan terminado, cenaré con los sirvientes abajo.</p>

<p>—Entonces tendré que comer rápido para que puedas llenar tu estómago. Debes de estar agotado por el largo viaje.</p>

<p>—Pero, por favor, no se apresure a comer por culpa de alguien como yo. Siempre ha tenido mala digestión...</p>

<p>Raúl, que habitualmente se lanzaba a quejarse de Inés, de repente se dio cuenta de la presencia de Cárcel. Frunció los labios varias veces con torpeza antes de esbozar una sonrisa cortés. Era un comportamiento inusualmente rígido para Raúl.</p>

<p>—Gracias por su preocupación, señora Inés.</p>

<p>—Siempre eres tú el que se preocupa. Ahora, Raúl, baja y descansa cómodamente por el momento.</p>

<p>—Sí.</p>

<p>—Alfonso, acompaña a Raúl, por favor.</p>

<p>—Sí, señora.</p>

<p>El mayordomo y Raúl pasaron junto a ellos y bajaron la pequeña escalera lateral. Esta conducía a la gran cocina y a las dependencias del servicio. Inés vio desaparecer a Raúl y luego se volvió con un tardío “Ah”, como si de repente recordara la presencia de Cárcel.</p>

<p>Cárcel, con la misma expresión impasible, se limitó a levantar ligeramente una ceja.</p>

<p>—... Cuando ese chico está cerca, actúas como si nadie más existiera.</p>

<p>Luego, murmurando en voz baja para sí mismo, pasó junto a ella hacia el comedor. <span style="font-style:italic">¿Quién, yo?</span> Aunque no había entendido todo, había logrado captar la frase “nadie más existiera” y lo siguió.</p>

<p>—¿Ese chico ha cometido algún error?</p>

<p>—“Ese chico”. ¿Así es como sueles referirte a él?</p>

<p>—Bueno, es un chico.</p>

<p>—Es tu empleado.</p>

<p>—Raúl es un empleado, pero...</p>

<p>Mientras reflexionaba sobre en qué momento la conversación podría volverse más directa, se sentó sin pensarlo dos veces en la silla que Cárcel le había acercado.</p>

<p>—Un empleado, sí, pero ¿y qué más?</p>

<p>—Ahora que lo mencionas, me doy cuenta de que tengo poco que decir. Es solo un buen chico.</p>

<p>—¿Ah sí?</p>

<p>—Me ha cuidado mucho desde que era joven. Es leal.</p>

<p>Para explicar lo leal que era Raúl, necesitaba una razón para tal lealtad, y dar esa razón inevitablemente sonaría como un elogio propio. Para describir lo bien que Raúl la había tratado, tendría que admitir lo destrozada que estaba antes.</p>

<p>Fuera lo que fuera, no era una historia que Cárcel encontrara entretenida, así que Inés la terminó abruptamente y tomó una cucharada de sopa fría.</p>

<p>—Come. Dijiste que tenías hambre.</p>

<p>A pesar del ánimo de Inés, rígida como siempre, pero cálida a su manera, Cárcel, que había dicho que tenía hambre, no tocó su plato, aparentemente sin importarle.</p>

<p>La miró en silencio antes de decir de repente:</p>

<p>—Hablas como si fuera un cachorro que tenías en casa.</p>

<p>—¿Raúl, un cachorro? Para nada.</p>

<p>—Tienes una habilidad especial para hablar de los hombres como si fueran perros.</p>

<p>—No recuerdo tener esa habilidad.</p>

<p>—Perros malhumorados. Perros bonitos. Perros que esperan pacientemente. Perros leales. Perros desordenados. Perros que merecen una paliza...</p>

<p>—...</p>

<p>—Si tuviera que resumir lo que digo, sería más o menos así.</p>

<p>—... Quizás sea así, pero no era mi intención.</p>

<p>—¿Sueles llamar perro bonito y leal a Raúl Balan?</p>

<p>—¿Te dirigirías a un empleado más joven que tú como señor Balan con tanta deferencia?</p>

<p>—Entonces es un perro.</p>

<p>—...Ni siquiera un perro... ¿Por qué te comportas así?</p>

<p>—Es irritante. No sé por qué.</p>

<p>Cárcel dijo esto, torciendo ligeramente su boca, normalmente recta, en una rara muestra de emoción. Inés frunció el ceño como si estuviera mirando a un niño maleducado, pero él se limitó a mirarla con una expresión abiertamente hosca.</p>

<p>—Quizás sea porque el invitado de hoy no me ha gustado.</p>

<p>—¿Invitado? Ese chico es el lacayo de Valeztena. No es más que un asistente de Valeztena, cuyo único delito ha sido traer mi equipaje hasta...</p>

<p>—¿Acaso te arrepientes de que vaya a volver a casa tan pronto?</p>

<p>Inés ladeó la cabeza, como si le costara comprender el comentario, y volvió a preguntar:</p>

<p>—¿Por qué iba a ser así?</p>

<p>—Me da la sensación de haber interrumpido su reencuentro.</p>

<p>Cárcel suavizó lentamente su expresión agria.</p>

<p>—Ese chico es especial para mí.</p>

<p>—¿Especial, eh?</p>

<p>—Te dije que tengo una criada a la que aprecio como a una hermana.</p>

<p>—Nunca lo dijiste, pero la he visto. Lo sé.</p>

<p>—¿Lo sabes? ¿Cómo?</p>

<p>—Es Juana... No te acuerdas de cuántas veces he entrado y salido de tu casa.</p>

<p>—Olvídate de eso. Como sea, esa chica... ambos… son terriblemente pegajosos conmigo.</p>

<p>—A diferencia de con Juana, nunca te he visto así con ese.</p>

<p>—Parece que él estaba convenientemente en Pérez cada vez que visitabas la residencia de Mendoza.</p>

<p>Inés estaba tan absorta en su respuesta que no se dio cuenta de la expresión inexpresiva de Cárcel cuando se refirió a Raúl como “ese”.</p>

<p>—¿Y cuando fui a Pérez?</p>

<p>—La finca es tan grande que sería difícil ver a todo el mundo.</p>

<p>—¿Ah, sí?</p>

<p>Admitió Cárcel, aunque su tono sugería que no estaba del todo convencido.</p>

<p>—Mi conjetura es que probablemente hayas visto a ese chico varias veces y simplemente lo hayas olvidado.</p>

<p>—Mi memoria es mejor que mi vista.</p>

<p>—No estoy sugiriendo que seas torpe, solo que él nunca te habría llamado la atención. Raúl, a pesar de las apariencias, es bastante ingenioso, inteligente y rápido para leer a los nobles...</p>

<p>Mientras las alabanzas a las habilidades de Raúl seguían fluyendo, Cárcel mostraba abiertamente una expresión de hartazgo, pero Inés había dicho prácticamente todo lo que tenía que decir.</p>

<p>—Bien. Me alegro por él.</p>

<p>—... Es por eso que, precisamente alguien que es tan competente, tiende a pasar desapercibido para sus superiores.</p>

<p>—Exacto. No tiene presencia alguna.</p>

<p>—No llama la atención, ¿verdad?</p>

<p>—Por eso yo también estoy desconcertado. ¿Por qué es que llama mi atención?</p>

<p>—... ¿De verdad Raúl cometió algún error sin que yo lo supiera?</p>

<p>Con el rostro rebosante de certeza —quizás certeza sobre Raúl— de que “habría cometido algún error”, era absurdo, Inés preguntó a regañadientes.</p>

<p>¿Qué sentido tenía preguntar eso? La respuesta estaba escrita en su rostro.</p>

<p>—No. En absoluto. Tú Raúl es perfecto, Inés.</p>

<p>—Lo sé. Incluso el noble más exigente de Mendoza, siempre que esté en su sano juicio, adoraría a ese chico.</p>

<p>—Sí.</p>

<p>—Ah, como has vuelto temprano, la cena terminará antes hoy... Eso es bastante conveniente. Después de cenar, ¿podría ir a hablar con Raúl un rato más? Hay algunas cosas que necesito saber.</p>

<p>—¿Por qué necesitas mi permiso para eso?</p>

<p>Preguntó Cárcel, con expresión totalmente impasible a pesar de la sorpresa en su tono. Inés se encogió de hombros.</p>

<p>—Ya casi es de noche. Y no hay nada extraño en que lo vea ya que Raúl es el lacayo de Valeztena, pero es tarde y tú no lo recuerdas.</p>

<p>—¿Y eso qué importa?</p>

<p>—Él es un hombre y tú eres mi esposo.</p>

<p>—…</p>

<p>—Me gusta que las cosas se hagan bien. Harías bien en tomar nota.</p>

<p>A pesar de esas palabras, Inés, que disfrutaba a diario de la ociosa vida de Calstera, pronunció esto como una ligera declaración antes de ponerse a comer con diligencia. La cocina de Yolanda era realmente la mejor.</p>

<p>Cárcel miró fijamente la escena antes de enterrar la cara en sus grandes manos. Solo las puntas de sus orejas permanecían sonrojadas, difuminándose en el crepúsculo fuera de la ventana.</p>

<p>¿Era irritación? ¿O vergüenza?</p>


<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>


<p>Una presencia útil imposible de detestar si se tenía una mente sana. Cada vez que Cárcel veía a Raúl Balan, sentía como si estuviera mirando un cajón grande y pesado colocado justo en medio del pasillo del segundo piso.</p>

<p>Eran apenas las ocho de la noche, y Cárcel acababa de llegar a casa y había cenado más temprano de lo habitual, por lo que la premisa “cada vez que Cárcel veía a Raúl Balan” era en realidad bastante errónea. Primero, lo había encontrado holgazaneando en el jardín, ajeno a la situación, cuando Cárcel llegó a casa. Segundo, se había interpuesto en su camino hacia el comedor. Y ahora...</p>

<p>Cárcel entrecerró ligeramente los ojos.</p>

<p>La tranquila terraza que conectaba el salón de la planta baja con el acogedor jardín, las luces que el Comandante Elba había dispuesto meticulosamente en el jardín con gran cuidado, iluminaban a su esposa y al lacayo de la familia Valeztena con una luz favorecedora.</p>

<p>Favorecedora significaba ni más ni menos que tolerable. Raúl Balan. Un hombre de tan baja categoría que ni siquiera podía considerarse un invitado. Aunque no recordaba que Inés hubiera mencionado nunca ese nombre, había aprendido innecesariamente tanto el nombre como el apellido. Era natural. La primera razón era que Inés había mencionado ese nombre descuidadamente; la segunda era su propia memoria, que incluso había captado el fugaz apellido.</p>

<p>Examinó lentamente el rostro de Raúl Balan. Un rostro delgado y bien definido, un rostro apuesto que parecía haber crecido sin sufrir las penurias de la vida. Sin embargo, una mirada a sus ojos lo decía todo. Era un hombre que había sido desgastado hasta los huesos. Y en esos ojos, una confianza engreída, como si, al hacerse mayor, hubiera conseguido que todo fluyera sin problemas, tal y como él deseaba.</p>

<p>Entre aquellos menos afortunados que él, naturalmente destacaba.</p>

<p>Visto con frialdad y objetividad, difícilmente estaba al mismo nivel que Cárcel Escalante, pero su refinado comportamiento, sin duda perfeccionado por una educación de alto nivel en la capital, y un rostro que podía complacer fácilmente a la nobleza eran ventajas inmediatamente evidentes para cualquiera.</p>

<p>Un plebeyo que sirviera a tu lado, fingiendo inteligencia en la conversación, resultaría molesto si fuera demasiado guapo, como Cárcel Escalante, y repulsivo a la vista si fuera demasiado feo.</p>

<p>Raúl Balan poseía un rostro que, en ese sentido, no resultaba molesto ni desagradable. Una apariencia moderadamente agradable y decente, pura y simple.</p>

<p>Su alta estatura y su complexión esbelta complementaban admirablemente el uniforme de lacayo. Aunque no tenía un físico excepcional, tampoco parecía desaliñado, lo que sin duda le confería esa misma sensación de comodidad moderada.</p>

<p>Cárcel, como un carnicero que pesa la carne colgada del techo, enumeró una por una las aparentes fortalezas y debilidades de Raúl Balan. Por lo general, las fortalezas no duraban mucho, mientras que las debilidades perduraban. Sin embargo, incluso si se eliminaban todos los defectos y se sumaban todos los méritos, no había nada en ese lacayo que pudiera atraer a Inés.</p>

<p>Cárcel Escalante de Esposa era el hombre con el que Inés se había comprometido en su día. El Cárcel Escalante al que había contemplado en su juventud era el mismo Cárcel Escalante, el resto se omitía. Su primer amor era el mismo Cárcel Escalante, y su largo amor no correspondido era el mismo Cárcel Escalante. Aunque ahora ya no fuera así.</p>

<p>Cárcel se centró en Raúl, sin importarle la incómoda verdad de que Inés ya no le prestaba atención. Inés Escalante se convirtió en Inés Escalante porque vio su rostro. Solo recordar ese dedo desafiante que señalaba a Cárcel a los seis años revelaba unos ojos fijos en el cielo y una estética refinada que rechazaba todo lo mediocre. Un estándar firme y simple: poseer el rostro más bello.</p>

<p>Incluso despojándolo de todo su trasfondo, este hombre era totalmente incompatible con el estándar de Inés.</p>

<p>Así que, por mucho que se mirara, no había nada allí.</p>

<p>—...</p>

<p>Cárcel observó cómo Inés volvía a extender la mano y acariciaba suavemente la cabeza de Raúl Balan. No era exactamente afectuoso, pero si había una pizca de ternura, era la expresión que se podría tener al acariciar la cabeza de un perro obediente o un niño pequeño. <span style="font-style:italic">Un perro. Sí, eso era un perro.</span> Cárcel pensó esto mientras volvía a fijar la mirada en el rostro de Raúl, pero ver la expresión de un sabueso devoto, extasiado por ser tratado como un perro, lo hacía imposible.</p>

<p><span style="font-style:italic">Buen chico.</span></p>

<p>Esa pequeña cosa descarada.</p>

<p>¿Qué tratamiento podría ser más feliz para un perro que ser tratado como tal? Justo cuando el rostro moderadamente atractivo de Raúl se iluminó, los rasgos perfectos de Cárcel se torcieron.</p>

<p>Entonces Inés se rió. El sonido no era audible, pero era claramente una sonrisa nacida de la risa.</p>

<p>Una que le resultaba casi desconocida a Cárcel.</p>

<p>La escena que se veía a través de la ventana no transmitía el sonido de voces humanas. Recordó su primer pensamiento al ver a Raúl Balan en el jardín por la tarde. “¿No será ese bastardo…?”. Incluso sólo pensar eso le había dejado una sensación de suciedad desde que salió del jardín.</p>

<p>Desde que vio a ese joven descarado frotándose constantemente la cabeza como un perro y adulando a Inés.</p>

<p>Sin embargo, superando esa desagradable sensación, lo único que se le pasaba por la cabeza era “¿Es ese bastardo?”, y tan pronto como ese pensamiento se desvanecía, otro surgía: “¿No será ese bastardo…?”.</p>

<p>Su mente perseguía ese único pensamiento sin descanso, sin ofrecer respuestas.</p>

<p>Inés ciertamente no era ignorante en cuanto a los hombres. Cárcel aún podía apostar toda su historia, parecida a la basura, al hecho de que alguien había estado con ella. Por supuesto que ella se negaría, ya que estaba bastante sucio, y él tampoco tenía mucho valor...</p>

<p>Incluso si su primera noche juntos había sido la noche de bodas de ella, seguramente sabía lo que constituía una unión “adecuada”. Se mostraba rígida y poco cooperativa, pero su noche de bodas no habría sido lo suficientemente fácil de ocultar, ni siquiera la naturalidad que revelaba sin darse cuenta. Al fin y al cabo, aquella noche fue muy larga.</p>

<p>Tanto que Cárcel aún no se atrevía a tocarla, agobiado por un atisbo de culpa.</p>

<p>En cualquier caso, a Cárcel no le importaba si “él alguien que había tenido Inés” era uno, diez o veinte. Diez era mejor que uno, y veinte era mejor que diez.</p>

<p>Porque uno era sin duda lo peor. Solo uno. La sola idea de ese uno que había traspasado ese muro de hierro... una noción espantosa.</p>

<p>Pero, fuera uno o muchos, seguía sin ser asunto suyo. Lo que buscaba era simplemente sustancia. El amante insustancial de Inés. Un amante sin siquiera una sombra... Ese pervertido que le enseñó a Inés todo sobre el sexo excepto el coito propiamente dicho.</p>

<p>Cárcel se quedó mirando el rostro de Raúl durante un momento, como si quisiera atravesarlo con la mirada.</p>

<p>Cabello castaño dorado, ojos grises, ese exterior pulido que ocultaba un interior completamente desgastado y vulgar... Parecía el tipo de persona que estaría dispuesta a cometer actos reprobables a puerta cerrada.</p>

<p>Cárcel consideró que ese rostro era el epítome de alguien con un pasado turbio. Sin embargo, cuando miraba a Inés, solo esos ojos se llenaban de tal anhelo, como si contemplaran lo más hermoso del mundo, y se atrevía a llenarlos también de un afecto tan sublime que, incluso cuando le invadió el honor de hacer esas cosas con Inés, parecía como si fuera a echarse a llorar, pensando: “¿Cómo se atreve este miserable a excitarse ante Lady Inés...?”</p>

<p>Estaba claro que la veneraba tanto que sabía cuál era su lugar y que no era digno de excitarse, y eso en sí mismo era irritante. Si él se aferraba a ella con una actitud tan altiva, <span style="font-style:italic">¿qué era yo, que me excitaba a la menor provocación...? No podría ganar...</span></p>

<p><span style="font-style:italic">¿Ganar?</span></p>

<p>Cárcel se sorprendió a sí mismo con el pensamiento que le pasó por la mente. <span style="font-style:italic">¿Ganar? ¿Qué? ¿Contra un simple lacayo? ¿Con qué, para qué? Incluso si ganara, ¿de qué serviría...?</span> Cárcel, como si lo persiguieran sus propias preguntas, se secó bruscamente la cara con una toalla seca y se dirigió hacia la salida de la sala de recepción. Entonces, se detuvo de nuevo.</p>

<p>Fue una victoria que no se habría logrado sin Inés al frente. No era más que un pensamiento fuera de lugar.</p>

<p>Y estaba igualmente claro que Raúl Balan no era más que el perro faldero de Inés.</p>

<p><span style="color:#777777">—... Pero prometió llevarme consigo cuando se casara.</span></p>

<p>Al principio, había parecido algo que diría un amante escondido en el castillo de Pérez, pero ahora se daba cuenta de que un perro diría esas palabras con toda naturalidad. Al fin y al cabo, Raúl Balan era el fiel sabueso de Inés.</p>

<p>Aun así, ese tipo de cosas bien podrían haber sido un manjar para Inés... Cárcel miró fijamente la terraza, donde la conversación no daba señales de terminar, sintiendo una sensación empalagosa y pegajosa como nunca antes había experimentado. Las románticas luces del Comandante Elba los hacían parecer una maldita pareja amorosa.</p>

<p>Esa voz que la llamaba: “Señora Inés”.</p>

<p>La familiaridad implícita en el nombre. El largo tiempo que habían compartido, que se desprendía de esa familiaridad. El eco que les permitía entenderse sin necesidad de palabras.</p>

<p>Eran cosas que habían estado totalmente ausentes en los diecisiete años que Cárcel conocía a Inés.</p>

<p>A Cárcel, Inés le parecía especialmente guapa ese día y, según sus criterios, excesivamente amable y gentil. Y cada vez que ella actuaba así, le hacía pensar, quizá de forma retorcida, que ella estaba siendo cuidadosa por culpa de su amante.</p>

<p>De hecho, independientemente de si Inés había comido de Yolanda algo en mal estado ese día, le sorprendió lo repulsivos que le parecían sus propios pensamientos.</p>

<p>Una miseria largamente olvidada asomó la cabeza. Todas las emociones sórdidas que Inés le había revelado en ese sueño.</p>

<p>“Te llamó por tu nombre”, apenas logró tragar las palabras que le subieron por la garganta, observando el rostro de Inés mientras ella escuchaba esa voz con familiaridad. Y, sin embargo, él seguía allí.</p>

<p>Tan pequeño como esta casa de dos pisos, observándolos con un desprecio absoluto y patético.</p>

<p><span style="font-style:italic">... Aun así, ¿no es eso demasiado bajo para ella?</span></p>

<p>El estándar de Inés siempre ha sido Cárcel Escalante, él.</p>

<p>Seguía siendo un hombre que no estaba a la altura de Inés. Solo un simple pervertido contento con ser un perro faldero de por vida, para quien recibir la insignificante aprobación de Inés era el mayor deseo del mundo.</p>

<p><span style="font-style:italic">Aun así, es irritante.</span></p>

<p>Un pequeño bastardo leal e irritante, eso es lo que era.</p>


<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>


<p>Originalmente, sólo había seis sirvientas en la residencia de Cárcel. De ellas, solo quedaban tres: la anciana ama de llaves, Alondra; la anciana cocinera, Yolanda; y su ayudante.</p>

<p>Las tres eran criadas con un fuerte sentido del deber, pero, lamentablemente, no tenían ninguna experiencia en el servicio a mujeres de la nobleza. De hecho, era la primera vez que alguna de ellas veía de cerca a una mujer de tan alta alcurnia como Inés.</p>

<p>Tendrían que haberlo visto para siquiera intentar imitarlo. Pero, ¿para qué se necesitaría criadas entrenadas para servir a mujeres nobles en la residencia de un oficial soltero? El servicio cerca del señor solía correr a cargo de sirvientes masculinos. Hombres con una educación superior, llamados mayordomos o ayudantes de cámara.</p>

<p>Cárcel había utilizado la residencia del Coronel de una manera extravagante y presuntuosa, pero no era un hombre particularmente lujoso por naturaleza y solo empleaba a quienes eran necesarios. Además, Alondra tenía un excelente ojo para seleccionar personas, por lo que no había individuos inútiles entre ellos.</p>

<p>Inés no deseaba alterar deliberadamente su rutina establecida simplemente porque ella había llegado. Al fin y al cabo, podía marcharse a otro lugar en cualquier momento... Aunque pensaba así, su cuerpo permanecía encorvado, como si estuviera permanentemente atascado en ese lugar.</p>

<p>Alondra había sugerido repetidamente contratar a una dama de compañía con una educación adecuada para Inés, de Mendoza o Esposa, o incluso de su ciudad natal, Pérez. Pero Inés se había negado repetidamente. A decir verdad, un solo comentario sobre dónde diablos meterían a más personal era suficiente para que Alondra se marchara con expresión dolorida, por lo que, por muy persistente que fuera la ama de llaves, la negativa resultaba fácil.</p>

<p>Además, este lugar le ofrecía las libertades que en Mendoza o Esposa serían inalcanzables.</p>

<p>La libertad de no dedicar un esfuerzo inmenso a la apariencia, la libertad de no observar formalidades elaboradas...</p>

<p>La sencillez de la casa le hacía experimentar un placer tranquilo en probar cosas nuevas por su cuenta. Además, no tenía necesidad de vestirse de forma elaborada, ni por la mañana ni por la noche... No solo llevaba el mismo atuendo de luto que había llevado antes, sino que, como recién casada, buscaba activamente parecer aún más sencilla.</p>

<p>Mantenía la dignidad y una apariencia pulcra y humana, pero se aseguraba de que su propia belleza o encanto nunca se resaltaran, ni siquiera momentáneamente. De modo que tal vez, en la mente de Cárcel, nunca surgiera el pensamiento “Ahora que lo pienso, en realidad podría ser bastante bonita…”</p>

<p>Las habilidades de Juana habían sido demasiado buenas todo este tiempo. Su torpe toque era justo el adecuado.</p>

<p>A diferencia de la mansión de la capital, los sirvientes no pululaban por todas partes durante todo el día. No tenía vida social alguna, por lo que, a menos que hiciera un esfuerzo deliberado, no había necesidad de recibir invitados. Tampoco había eventos familiares. Y para Cárcel, simplemente tenía que parecer una mujer poco atractiva...</p>

<p>En verdad, Calstera era en muchos sentidos el lugar perfecto para pasar su luna de miel.</p>

<p>Si pudiera matar el tiempo así, y Cárcel bajara la guardia de nuevo como solía hacer...</p>

<p>—¡Dios mío, Dios mío, Dios mío! Señorita, no, señora... el peine, el peine se ha resbalado... Dios mío... ¿Le he hecho daño?</p>

<p>Un lado de su cabello estaba completamente enredado, el peine se había atascado y la criada que lo sostenía había tirado de él inconscientemente varias veces antes de recuperar el sentido de repente.</p>

<p>Y tirar del peine tenía el mismo efecto que tirar del cabello de la señora.</p>

<p>Inés, cuya cabeza se había movido bruscamente en la dirección del tirón, rápidamente se enderezó y sonrió amablemente.</p>

<p>—No me ha dolido, en absoluto.</p>

<p>—Estoy tan acostumbrada a hacer trabajos duros que no puedo controlar mi fuerza en absoluto... ¿Qué hago? ¿Qué hago? Debe de haberle dolido mucho, señora...</p>

<p>Si hubiera sido una criada del castillo, en lugar de “¿Qué hago? Debe de haberle dolido mucho”, habría montado un escándalo como si hubiera cometido un intento de asesinato. Incluso sin que Inés abriera la boca, ya se habría arrodillado, inclinado la cabeza y echado a llorar como si el mundo se fuera a acabar.</p>

<p>Por supuesto, esto se hubiera debido en gran parte a que temiera mucho más a la ama de llaves y a las otras criadas de mayor rango que a Inés, que prestaba poca atención a los sirvientes de menor rango. Los castigos en el castillo eran estrictos y severos.</p>

<p>En comparación con ese hielo frágil, Inés prefería este lugar donde le preguntaban: “¿Qué hago? Debe de haberle dolido mucho”. Este lugar donde todo el mundo se las apañaba como podía, simplemente luchando por sobrevivir.</p>

<p>Era una falta de formalidad, no una falta de preocupación por ella.</p>

<p>Por supuesto, no se había dado cuenta que le estaban tirando del cabello por estar ocupada sonriendo felizmente, pensando en su ambicioso futuro.</p>

<p>—Mi cabello todavía está húmedo, así que es normal que te cueste peinarlo bien. Tómate tu tiempo...</p>

<p>—Pero ¿qué hago? El peine, el peine no sale...</p>

<p>No se había dado cuenta de que le dolía hasta que se vio en el espejo, tirando y tirando, cada tirón causándole dolor. La criada era, como ella misma decía, increíblemente fuerte, y no podía controlar su fuerza. Cuanto más se retorcía Inés de dolor, más se hundía el rostro de la criada en la culpa.</p>

<p>Debía de ser similar a la fuerza que se empleaba para fregar los marcos de las ventanas. Inés suspiró, tratando de ocultárselo a la criada, y luego liberó con cuidado su cabello y el peine de las manos de la criada.</p>

<p>—Lo haré yo. Solo ve y descansa.</p>

<p>—Lo siento. Lo siento mucho...</p>

<p>Y fue en medio de las repetidas y profusas disculpas de la criada cuando Cárcel entró en su dormitorio.</p>

<p>—¿Qué pasa?</p>

<p>—Nada. Ahora ve y descansa.</p>

<p>Inés, consciente de que Cárcel debía de haberla encontrado en una situación incómoda con la criada, la despidió rápidamente. Cárcel no era de los que armaban un escándalo por un pequeño desliz de una criada, pero para ella debió de ser como echar leña al fuego.</p>

<p>Cárcel arqueó ligeramente una ceja al ver la puerta por la que la criada había salido corriendo. Luego, mirando a Inés en el espejo, frunció el ceño. Al ver el peine en su mano y el puñado de cabello negro suspendido en el aire, pareció comprender la situación de inmediato.</p>

<p>—Por eso te dije que contrataras a una criada.</p>

<p>—No es demasiado tarde para encontrar una en Mendoza.</p>

<p>—No nos quedaremos en Calstera sólo uno o dos días, ¿verdad?</p>

<p>—Bueno...</p>

<p>Inés tampoco preveía que este matrimonio durara tan poco. Como había dicho Cárcel, no era algo que pudiera terminar en uno o dos días... Así que, sí, necesitaría encontrar una nueva criada tarde o temprano... Pero cuando no sabes cuándo te volverás a mudar, es natural querer evitar aumentar tu equipaje.</p>

<p>Ese era precisamente el sentimiento. La sensación de no querer cargarse de un peso innecesario. Y estuviera presente o no, deseaba que todos los lugares que había ocupado permanecieran lo más intactos posible... Quería que las personas y las pertenencias se quedaran exactamente donde estaban, y que solo ella desapareciera sin dejar rastro. Inés consideraba que era una mínima cortesía hacia Cárcel.</p>

<p>Ya fuera la residencia ducal en Esposa, o la mansión de Cárcel en Mendoza... dejar sus pertenencias desparramadas por todas partes solo causaría inconvenientes después de su partida.</p>

<p>—No sé si podamos meter a más gente aquí.</p>

<p>—...</p>

<p>—Ya estamos abarrotados con la gente que tenemos.</p>

<p>De hecho, en realidad, la estrechez de la residencia en Calstera era perfecta en muchos sentidos. Proporcionaba una buena excusa para no trasladar el equipaje que Raúl había traído con tanto esfuerzo y, a veces, servía de excusa para no querer aumentar el número de personas.</p>

<p>—Hay una lamentable insuficiencia de alojamiento para el personal... incluso los sirvientes y el jardinero están utilizando alojamientos externos, ¿no es así?</p>

<p>—... Podríamos desocupar una habitación para una criada.</p>

<p>—Ya tenemos ama de llaves, cocinera, criada, un cochero...</p>

<p>—Entonces dejemos que uno de ellos se vaya.</p>

<p>—¿Vas a conducir tú mismo el carruaje? ¿O vas a hacer que la criada cocine? ¿O tal vez vas a hacer que la cocinera también friegue los suelos? ¿Quién se quedaría por eso?</p>

<p>—... No puedo prescindir de la cocinera.</p>

<p>Incluso en medio de todo esto, las prioridades de Cárcel estaban claras, e Inés se rió entre dientes. Esa determinación: que prefería conducir él mismo el carruaje antes que renunciar a la cocina profesional de la cocinera...</p>

<p>—De todos modos, sólo necesitas carne, ¿no?</p>

<p><span style="font-style:italic">Qué bárbaro...</span> Como si percibiera el tono de Inés, Cárcel levantó una ceja con aire hosco antes de responder.</p>

<p>—Con la carne, es más importante quién la cocina qué la procedencia de la vaca.</p>

<p>—¿Acaso se cocina? Prácticamente gotea sangre...</p>

<p>—Ese es el resultado de la técnica. Un buen sellado, el grado adecuado de corteza, una textura tierna...</p>

<p>Enumeró estos puntos con diligencia, como si fueran los principios más importantes del mundo, mientras cogía el peine de Inés. Pronto se pudo ver a Cárcel inclinándose ligeramente hacia el gran espejo.</p>

<p>Ella había dado por sentado que él estaría familiarizado con todo lo relacionado con las mujeres, pero sus manos torpes y ligeramente cómicas, que aceptaban con cuidado el cabello enredado y el peine, parecían extrañamente graciosas. La visión de su frente profundamente arrugada, concentrándose con fuerza, y sus grandes manos agarrando el bonito peine era bastante ridícula, lo que hizo que Inés se riera un poco.</p>

<p>—No te rías. Te estás moviendo.</p>

<p>—Si pudieras verte a ti mismo.</p>

<p>—¿Así que quieres dormir con el peine puesto así?</p>

<p>—Creo que puedo hacerlo.</p>

<p>—Ni siquiera puedes verlo desde tu lado.</p>

<p>—Solo ponle un poco de aceite.</p>

<p>—Dámelo.</p>

<p>Cárcel, todavía con aspecto muy concentrado, extendió la otra mano con seriedad. Inés cogió el frasquito del tocador y dejó caer unas gotas en su mano. Luego dejó que unas gotas de aceite resbalaran por el peine y el cabello enredado.</p>

<p>—¿Funciona?</p>

<p>—No funciona muy bien… Deberías contratar a una criada. Haré traigan a Juana.</p>

<p>—Juana se casará en Pérez. Hay un hombre que le gusta. De todos modos, es empleada de Valeztena, así que no podría ir a Mendoza.</p>

<p>—Entonces traeré también a ese hombre.</p>

<p>—... Sinceramente, la mansión ya es bastante pequeña, ¿y no sabes cómo poner límites?</p>

<p>Para Cárcel, que había vivido con arrogancia pero dentro de unos límites razonables antes de la llegada de Inés, esto le parecía un trato bastante injusto, pero se limitó a encogerse de hombros.</p>

<p>—La cuestión es que Juana necesita estar donde está ese hombre, ¿no?. Así que, si ese hombre sigue a Juana, no hay problema.</p>

<p>—Basta. Ambas familias han servido a la familia Valeztena desde la generación de sus abuelos, y el ducado es su hogar. No deseo que deambulen de aquí para allá por mi culpa.</p>

<p>—Como sea, Escalante tiene la residencia ducal en Mendoza, y viajar al castillo de Esposa no es particularmente difícil desde Pérez. Yo me quedaré en Calstera, así que tampoco hay necesidad de que tú vayas corriendo de un lado a otro.</p>

<p>En realidad, la respuesta despreocupada de Inés abarcaba su vida matrimonial y más allá. Se sintió aliviada de que Cárcel no se hubiera dado cuenta, pero se reprendió a sí misma por su descuido.</p>

<p>Pensaba que la visita de Raúl finalmente la había hecho entrar en razón, pero ahora estaba a punto de revelarle todo —sus planes, sus intenciones futuras— en una confesión antes de que él tuviera siquiera la oportunidad de relajarse.</p>

<p><span style="font-style:italic">No debí permitir que ese fiel cepillo bajara mi guardia.</span> <span style="font-style:italic">Porque si bajaba… </span>Inés se reprendió duramente a sí misma en su interior y luego enderezó el ceño ligeramente fruncido.</p>

<p>Afortunadamente, el Cárcel del espejo parecía preocupado por quitar con cuidado cada mechón de su cabello enredado del cepillo, sin darse cuenta de su presencia. Incluso al mirarlo por segunda vez, era una imagen un poco cómica. Ese cuerpo grande. Esas manos grandes, tan concentradas en la tarea de desenredar el cabello enredado de su esposa, mechón a mechón...</p>

<p>Sin embargo, su rostro apuesto siempre transmitía cierta solemnidad; cuando realizaba un acto cómico, parecía adorable en lugar de ridículo. Como si estuviera perdido en sus pensamientos, incluso cuando era evidente que no pensaba en nada.</p>

<p>Inés reconoció objetivamente que, en efecto, era algo adorable. Como si estuviera corrigiendo un examen.</p>

<p>Era un hecho que se le grababa más en la mente que en el corazón.</p>

<p>Cualquier mujer con vista se sentiría encantada, pero Inés, cuya vida era inestable, tenía una mente demasiado racional, demasiado alejada del pensamiento medio, y su vista ya se había equivocado antes.</p>

<p>¿Qué más se podía esperar de unos ojos que habían elegido como primer marido a un prometedor paciente de una enfermedad venérea y como segundo a un hijo de un plebeyo empobrecido que trabajaba como ayudante de un artista?</p>

<p>Su primer marido no poseía más que estatus; su segundo marido no poseía más que un rostro más bello que el de una mujer.</p>

<p>Aparte de su ardiente amor por Emiliano, Inés también reconocía que su propio juicio era fundamentalmente erróneo.</p>

<p>Al igual que el estatus de Óscar no podía compensar todas sus sórdidas acciones, el hermoso rostro y el amor devoto de Emiliano no podían compensar su miserable estatus y realidad.</p>

<p>Aunque Óscar gobernara el mundo entero en lugar de convertirse en Emperador, seguiría siendo un caso perdido con una enfermedad venérea; y por mucho que Emiliano la amara, y por mucho que ella lo amara a él, su miserable estatus la llevaría a su muerte.</p>

<p>Varias circunstancias influyeron, pero visto únicamente desde este punto de vista, una cosa estaba clara: el ojo de Inés Valeztena para los hombres era totalmente desesperanzador.</p>

<p><span style="font-style:italic">Pero ahora es diferente. No lo elegí con estos ojos...</span></p>

<p>Una vez más, contempló con satisfacción a Cárcel, un poco encantador, un poco cómico y extremadamente guapo.</p>

<p>A Óscar lo había elegido por instinto, persiguiendo el honor y el poder; a Emiliano lo había elegido con los ojos y el corazón. Pero Cárcel Escalante era diferente.</p>

<p>Solo a Cárcel lo había elegido puramente con la cabeza. Anticipando cada resultado, calculando cada variable.</p>

<p>Desde su compromiso con Óscar a los seis años, su matrimonio a los dieciséis, hasta su muerte a los veintiséis, a lo largo de todos esos largos años, a pesar de encontrarse con el rostro de Cárcel tan a menudo, nunca había pensado en él más allá de esa única línea de juicio: “Un Duque Escalante perezoso, irresponsable y fracasado, que no posee nada más que un caparazón otorgado por Dios”.</p>

<p>Lo que ahora satisfacía a Inés, que en su día había sentido un ligero interés por él, no era solo que fuera una creación perfecta.</p>

<p>Cada vez que se daba cuenta de lo excesivamente guapo que era Cárcel, cada vez que veía su físico perfecto, cada vez que descubría algún rasgo que cualquiera encontraría atractivo... se quedaba a distancia, ligeramente enloquecida, pensando con satisfacción: “Al fin y al cabo, elegí bien”.</p>

<p>Se preguntaba qué apetecible debía de parecerle a otras mujeres.</p>

<p>Era realmente un bocado atractivo. Con un par de ojos perfectos y la más mínima inclinación a vivir de forma imprudente como los demás habitantes de Mendoza, cualquiera se abalanzaría sobre él.</p>

<p>Inés ya era famosa en los círculos sociales por su reputación antipática y su aspecto sombrío, como el de un cuervo. Ninguna mujer vería su matrimonio como un obstáculo.</p>

<p>En esta generación, en la que cualquiera que no tuviera pareja era considerado un tonto, las más inteligentes se convertirían naturalmente en hermosas polillas atraídas por la llama.</p>

<p>Así que si Cárcel Escalante bajaba la guardia un poco más de lo que ya lo había hecho hasta ahora y se diera cuenta de lo aterradora que era realmente esa devota determinación... Recordó la voz angelical y lastimera de Cárcel, de seis años, preguntando por la duración de una “vida”, como si fuera ayer.</p>

<p>El Cárcel Escalante del espejo solo había olvidado por un momento lo aterrador que era eso llamado “toda la vida”.</p>

<p>Bajó la guardia, y luego volvió a bajarla… Al final, si acababa volviendo a su lugar original, digamos, su estado salvaje, esta luna de miel desaparecería en un instante. Se sentiría abrumado al no saber a qué mujer debía aceptar primero, y pensaría que si volvía a los días gloriosos de antaño, entonces este matrimonio sin amor que había aceptado a regañadientes desaparecería en un instante...</p>

<p>—¿Tan ridículo me veo?</p>

<p>—No. De alguna manera, es bastante adorable.</p>

<p>Inés respondió, con una sonrisa en el rostro sin darse cuenta, evidente su satisfacción actual. Al interpretar esas palabras, Cárcel entrecerró los ojos y pareció encontrar la mirada de Inés en el espejo, luego peinó lentamente los mechones sueltos de cabello con los dedos.</p>

<p>—Eres muy hábil. Como era de esperar...</p>

<p>Inés se detuvo a mitad de la frase, al darse cuenta de que lo que pretendía ser un elogio —“Como era de esperar, se te da bien todo lo relacionado con las mujeres”— no era exactamente el cumplido que ella quería hacerle.</p>

<p>Y fue en ese instante, mientras elegía las palabras para remediar esa frase sin importancia.</p>

<p>—Entonces, ¿qué hay de la recompensa?</p>

<p>Preguntó él de repente.</p>

<p>—¿...Recompensa?</p>

<p>Desorientada, se limitó a repetir sus palabras.</p>

<p>Pero, en lugar de responder, él le agarró el pecho con la mano, resbaladiza por el aceite.</p>


<p>Como si ella hubiera ofrecido su pecho como recompensa, lo cual parecía un paso natural, Inés no entendió la situación por un momento y parpadeó mientras se miraba en el espejo.</p>

<p>Los serenos ojos azules de Cárcel, su expresión serena y el contorno sereno de sus labios le llamaron la atención de inmediato. También la imagen de él agarrando su pecho izquierdo con su gran mano derecha y acariciándolo.</p>

<p>Sin embargo, parecía que no había nada malo en ello.</p>

<p>Entre ellos ya había pasado la agobiante noche de bodas, pero más bien esa noche había sido tan agobiante que parecía un sueño, más que una realidad. Desde la noche de bodas, las noches en Calstera habían sido todas muy tranquilas y sanas.</p>

<p>Las mañanas pegajosas siempre terminaban en ligeras bromas, sin sensación de peligro, y las noches eran secas y tranquilas.</p>

<p>Ella miró a los ojos de Cárcel en el espejo con un poco de desconcierto.</p>

<p>Era diferente a las mañanas y a las otras noches. Instintivamente, se dio cuenta de que Cárcel tenía la intención de volver a hacerlo.</p>

<p>Era el momento adecuado. Inés contó con serenidad los días transcurridos desde la primera noche y, a pesar de que le parecía un poco absurdo, preguntó con ligereza.</p>

<p>—¿De repente te apetece hacerlo?</p>

<p>—Dijiste que era adorable.</p>

<p>Como si eso fuera algo malo. Dado su tamaño, no era un cumplido agradable.</p>

<p>Las yemas de los dedos que acariciaban suavemente su piel presionaron de repente sus pezones erectos, los agarraron con fuerza y los amasaron. <span style="font-style:italic">No sería una venganza, ¿verdad?</span> Sin siquiera fruncir el ceño, ella le preguntó a través del espejo.</p>

<p>—¿Te molesta?</p>

<p>—No.</p>

<p>—¿Entonces?</p>

<p>—La verdad es que no me molesta en absoluto, es solo que me siento incómoda.</p>

<p>—Si no te molesta, ¿por qué...?</p>

<p>En lugar de responder, la mano que le acariciaba el pecho por encima del fino negligé se deslizó hacia el valle de sus pechos y luego se introdujo con naturalidad bajo el negligé.</p>

<p>A pesar de lo repentino, todo fluía con naturalidad, como si siempre hubiera sido así.</p>

<p>¿Debía considerarlo un mal hábito o una gran destreza?</p>

<p>Inés tuvo sentimientos encontrados mientras miraba fijamente los ojos azules en el espejo. Cárcel ya estaba mirando fijamente su rostro en el espejo, por lo que, aunque ambos miraban en la misma dirección, no era difícil que sus miradas se cruzaran.</p>

<p>Con la otra mano, le acarició suavemente desde la clavícula hasta la manzana de Adán, haciendo que levantara un poco más la barbilla. Al descubrir que con solo levantar la cabeza adquiría un aire muy altivo, los ojos de Cárcel se iluminaron.</p>

<p>Sus párpados, que se inclinaban hacia el espejo, y bajo ellos, brillaban unos ojos almendrados, nada frágiles...</p>

<p>Sin apartar la mirada de los ojos de Inés en el espejo, le echó el largo cabello hacia atrás.</p>

<p>El cabello desapareció, dejando al descubierto su cuello y sus hombros. Como también desapareció el cabello que le cubría el pecho, la mano que Cárcel había introducido bajo el negligé y la forma del pecho que se amoldaba a su mano bajo la fina tela quedaron al descubierto en el espejo.</p>

<p>Pensó que era demasiado explícito que él le manosease el pecho con el negligé ligeramente levantado, pero ese pensamiento se desvaneció cuando Cárcel le levantó el pecho con la mano metida en el negligé.</p>

<p>Su camisón estaba más escotado de lo que Inés pensaba, y su pecho que él sostenía y levantaba mostraban con demasiada facilidad su forma desnuda a través de la tela.</p>

<p>Ahora sí que era demasiado explícito. El pecho suavemente aplastado entre su mano, el pezón que sobresalía entre sus dedos, todo ello.</p>

<p>—...</p>

<p>—... Es bonito.</p>

<p>Una voz ronca y grave se posó en su oído. Parecía una exclamación de admiración pura, pero también tenía algo de retorcido.</p>

<p>Era un espectáculo que ni siquiera esa voz pudo alcanzarla del todo.</p>

<p>Sería más fácil mirarse al espejo estando completamente desnuda. Llevaba solo un negligé tan fino como las alas de una libélula y tenía un pecho al descubierto, expuesto sin pudor a las manos del hombre...</p>

<p>Cada vez que él aflojaba el puño y volvía a apretar en otra dirección para agarrarle el pecho, cada vez que lo amasaba, lo empujaba hacia arriba y lo aplastaba, cada vez que su forma se deformaba sin sentido bajo el acoso, sentía una ligera vergüenza.</p>

<p>No era algo por lo que se avergonzara hasta morir. Simplemente era innecesario.</p>

<p>—Cárcel... mejor vamos a la cama.</p>

<p>—Me gusta este lugar.</p>

<p>—... A mi no...</p>

<p>—A mi me gusta, me gusta este lugar, Inés.</p>

<p>Entre los dedos que le agarraban el pecho, le pellizcaba el pezón con fuerza, como si se burlara de ella. Lo que él llamaba “este lugar” no era el espejo, sino su pecho.</p>

<p>Por mucho que las grandes manos de Cárcel le amasaran el pecho, la forma del pezón, que se erguía entre sus dedos, seguía siendo claramente visible.</p>

<p>Era evidente que lo hacía a propósito. Como si quisiera que ella lo viera.</p>

<p>Después de aplastar con fuerza la carne de su pecho en diagonal, lo levantó suavemente y le mostró en el espejo el pecho con marcas rojas en la piel clara.</p>

<p>El areola de color rosa pálido y su punto culminante brillaban de forma inusual incluso en la tenue luz, como si él los hubiera chupado y maltratado con saña. Sobre las marcas rojizas aún quedaba aceite perfumado. Eran todas huellas del maltrato obsesivo de él.</p>

<p>En un instante, se había convertido en un espectáculo vulgar. Un espectáculo muy vulgar y lascivo... En la primera noche de bodas no había tenido tiempo ni oportunidad de darse cuenta, ni tampoco había tenido necesidad de ver con sus propios ojos ese espectáculo.</p>

<p>Se sintió un poco mareada, como si hubiera tragado humo caliente, y el aire que entraba y salía por su garganta se volvió más cálido.</p>

<p>Era un cambio que no le gustaba. Inés, con gran esfuerzo, intentó levantarse con la misma expresión impasible, frunciendo solo un poco el ceño.</p>

<p>Pero la mano que le había levantado la barbilla la empujó directamente hacia abajo, oprimiéndole los hombros. La fuerza era firme.</p>

<p>Ella suspiró y añadió:</p>

<p>—... A diferencia de ti, a mí no me gusta mucho este lugar, Cárcel.</p>

<p>—Desde que llegamos a Calstera, no hemos tenido relaciones, así que aún no sabes lo horrible que puede ser revolcarse aquí... ¿No es así?</p>

<p>—Es que no me gusta ese espejo.</p>

<p>—Qué pena. Parece que a tu espejo le gustas.</p>

<p>Cárcel pellizcó el pezón brillante y soltó una risa ahogada. La sensación resbaladiza hacía que el clímax fuera más sensible, y el modo en que se retorcía y tiraba era desordenado.</p>

<p>Sí, era desordenado.</p>

<p>No tocó ninguna otra parte y el negligé que se había puesto en el dormitorio seguía tal y como la criada lo había arreglado, con solo un pecho al descubierto, pero, a pesar de ello, era una imagen demasiado desordenada, lasciva y vulgar.</p>

<p>—Esto es demasiado desordenado, Cárcel.</p>

<p>Inés le agarró el grueso antebrazo como para detenerlo y le susurró. Como solía hacer por las mañanas, era una fuerza abrumadora a la que ella no podía poner resistencia alguna.</p>

<p>Ella se esforzó por menospreciarlo llamándolo torpemente “antebrazo de piedra” y adoptó un tono más firme.</p>

<p>—No es necesario que hagas esto.</p>

<p>—Después de haber hecho cosas peores en la primera noche, ahora vienes con eso.</p>

<p>—Eso solo lo viste tú. Esto, solo míralo tú...</p>

<p>—¿Que solo lo mire yo? Eso es demasiado.</p>

<p>—Yo, ejem, no tengo muchas ganas de verlo...</p>

<p>La mano que sostenía su barbilla levantada rodeó todo su cuello y tiró de él. Cárcel chupó la oreja de Inés y le susurró al oído.</p>

<p>—Tú también tienes que verlo, Inés.</p>

<p>—Hm, hmm...</p>

<p>—Lo mucho que vuelves loca a la gente.</p>

<p>La mano que le agarraba el pecho apretó con cierta brusquedad el sensible pezón. Inés tragó un gemido y apoyó la cabeza en su pecho.</p>

<p>Los labios que lamían su lóbulo bajaron por la coronilla, la frente, salpicando besos hasta llegar a sus ojos.</p>

<p>Las miradas que se cruzaban en el espejo se tornaron sutilmente nerviosas.</p>

<p>Él le mordió suavemente la delicada piel de los ojos, sin hacerle daño. Era como una pequeña venganza. Aunque no sabía de qué.</p>

<p>—Tú lo has provocado.</p>

<p>—¿Qué? Hmm.</p>

<p>—Me he contenido todo este tiempo, pero tú lo has provocado.</p>

<p>Quizás fuera Raúl Balan quien lo hubiera provocado, pero a Cárcel le daba igual.</p>

<p>Ella murmuró, como si le resultara más extraño la palabra “contenido” que la acusación de haberlo provocado.</p>

<p>—¿Contenido...?</p>

<p>—Entonces, ¿a quién crees que le debes que no te haya hecho nada hasta ahora?</p>

<p>Ella conocía bien la paciencia que él mostraba cada mañana. Pero la mañana era la mañana, y si pensaba en el Cárcel de la noche... ¿Acaso le importaba ella lo más mínimo?</p>

<p>Su rostro inesperadamente sincero, que solo conocía el entrenamiento, y su espalda, sentada en el balcón contemplando el mar nocturno, como si estuviera resumiendo un día excesivamente sincero. El Cárcel de la noche siempre era sobrio, como si hubiera gastado toda la energía de la mañana en el entrenamiento de la tarde y hubiera vuelto.</p>

<p>Pero si le preguntaran a quién se lo debía, Inés sin duda se lo atribuiría a sí misma. Tenía el mérito de haber vivido con ahínco durante más de una década con un atuendo opresivo y sombrío que no despertaba el interés de los hombres, y desde que se casó, ni siquiera tenía doncella, y recibía a su marido con un atuendo no solo sombrío, sino también descuidado, y con el rostro sin maquillar...</p>

<p>Sí. Eso era mérito suyo.</p>

<p>—... En serio no lo sabes.</p>

<p>Cárcel murmuró como un suspiro. Y volvió a pellizcarle el pezón como una abeja.</p>

<p>Inés se tragó un gemido y esta vez volvió la cabeza hacia fuera del espejo para mirarlo con ira.</p>

<p>—Cárcel, por supuesto, la mayor obligación de un matrimonio es acostarse juntos regularmente. Así que creo que ha llegado el momento de volver a hacerlo... Es solo que...</p>

<p>—Delante del espejo no te apetece.</p>

<p>Él respondió a sus palabras como si lo supiera todo. Con una expresión de hastío, como un niño al que lo regañan.</p>

<p>Pero, independientemente de su fastidio, la formalidad siempre era necesaria.</p>

<p>—Si verme así te ayuda visualmente, aunque sea un poco, no quiero impedirlo, pero...</p>

<p>Podría sustituirse por “si te ayuda a excitarte a la fuerza” o “si te ayuda a fabricar tus deseos”.</p>

<p>Él repitió en silencio:</p>

<p>—¿Pero?</p>

<p>—Al menos a mí no me ayuda. Por eso.</p>

<p>—¿Ah, sí?</p>

<p>Debería haber prestado más atención a esa sonrisa.</p>

<p>En un instante, Inés se elevó en el aire y, sin darle tiempo a sorprenderse, se encontró sentada sobre el tocador, mirándolo.</p>

<p>—¿Puedo comprobarlo?</p>

<p>—¿Qué...?</p>

<p>—... Qué no te ayuda.</p>

<p>—...</p>

<p>—Si, como dices, no te ayuda en nada.</p>

<p>Entonces, él le subió la falda de un tirón, le abrió las piernas y hundió la cabeza entre ellas.</p>

<p>Sus labios descuidados estuvieron a punto de gritar, pero apenas logró mantener la dignidad.</p>

<p>Sin embargo, ya estaba tumbada sobre el tocador con las piernas abiertas y Cárcel con la cabeza hundida entre ellas, por lo que no parecía que le quedara mucha dignidad.</p>

<p>—Cárcel, haa, Cárcel... ¡Espera un momento...!</p>

<p>Su cálido aliento rozó la fina ropa interior. Cárcel no la apartó, sino que deslizó los labios por la húmeda hendidura y dejó un ligero beso. Desde la hendidura que se abría hasta el bulto más sensible, la suave piel del interior de la hendidura y la entrada cerrada.</p>

<p>Ella sabía, como él ya debía de saberlo.</p>

<p>Que la humedad que contenía mientras Cárcel mordía la frágil tela y la tiraba con los dientes no era totalmente de su saliva.</p>

<p>Aunque pensaba con indiferencia que se trataba de una reacción fisiológica totalmente natural, le irritaba la sensación de derrota por haber sido descubierta de forma tan evidente en el peor momento. Aunque él no había dicho nada, se sentía como si le hubieran lanzado cincuenta burlas.</p>

<p>La imagen de una avergonzada mujer que acababa de pasar su primera noche de bodas no tuvo tiempo de afianzarse. Inés tiró bruscamente del cabello de Cárcel y le levantó la cabeza.</p>

<p>Pero en el rostro que ella pensaba que estaría sonriendo burlonamente no había ninguna expresión. Su rostro inexpresivo le pareció amenazador, aunque fuera demasiado tarde. Ella reprimió su irritación en un instante y retiró suavemente la mano de la cabeza de él.</p>

<p>Inés era de naturaleza competitiva, pero también era una persona muy realista, por lo que no le costó mucho intuir que su provocación le haría perder más de lo que ganaría.</p>

<p>Sin embargo, cuando uno piensa que ya es demasiado tarde, la mayoría de las veces es porque realmente lo es.</p>

<p>Los labios de Cárcel persiguieron la mano de Inés y le mordieron ligeramente los dedos, luego bajaron hasta la palma y la presionaron con fuerza.</p>

<p>Era como si un león hubiera abierto la boca y ella hubiera metido la mano dentro estúpidamente.</p>

<p>Y además, esos labios...</p>

<p>—...</p>

<p>Esos labios lascivos que hasta hacía un momento lamían su ropa interior... Esta vez, sintiendo un ligero calor en las orejas, ella retiró la mano, pero él fue más rápido y la agarró.</p>

<p>Los labios que presionaban suavemente la palma de la mano recorrieron las delicadas y suaves palmas dejando besos por todas partes. Como si la palma de Inés sustituyera a sus labios... Cuando Inés movía la mano, sus labios se entrelazaban como si la besara más profundamente.</p>

<p>Cuando él hundió la cara entre sus piernas bajo la luz, ella no se atrevió a mirar directamente, pero esto era aún más vergonzoso, ya que podía verlo.</p>

<p><span style="font-style:italic">Qué desvergonzado..</span>. Ella miraba al hombre que se había colocado entre sus piernas y acariciaba su palma, como si nunca hubiera intercambiado tonterías con ella.</p>

<p>Cárcel, que había besado cada uno de los delicados nudillos, le chupó la punta del dedo y miró a Inés a través de su cabello rubio revuelto. Sus ojos parecían aún más perversos que los de la primera noche. El humo caliente que bajaba por su garganta le revolvió el estómago.</p>

<p>Con una mano sujetó la mano de Inés y, con la otra, le rodeó una de las piernas abiertas con el brazo desde debajo del muslo y la atrajo hacia él, apoyando una rodilla en la silla del tocador.</p>

<p>Sus largas piernas se doblaron y su robusto cuerpo se inclinó sobre ella.</p>

<p>Con el peso sobre ella, el cuerpo de Inés se inclinó un poco más hacia atrás y se apoyó en el espejo. Seguía con un pecho al descubierto, la delgada cintura doblada y las piernas abiertas sobre el tocador.</p>

<p>Cárcel apartó los labios de la mano de Inés justo cuando pudo contemplar de un solo vistazo la indefensa vagina.</p>

<p>—Sin duda, el espejo te sienta bien.</p>

<p>Más que una exclamación de admiración, parecían palabras burlonas, pero en realidad no había nada de picardía en ellas.</p>

<p>Inquieta por una sensación de mal augurio, Inés agitó brevemente la pierna que él no sujetaba, pero su mano libre le presionó la parte interior del muslo y le abrió aún más las piernas.</p>

<p>Cárcel bajó lentamente la mirada que había dirigido a su rostro y se fijó en la ropa interior blanca que cubría su pubis. Los fluidos vaginales habían dejado marcas en forma de dientes.</p>

<p>Sus ojos azules ardían con una mirada descaradamente lasciva.</p>

<p>—Y tal vez a ti también te gusta el espejo tanto como a mí.</p>

<p>—...</p>

<p>—Al parecer también recibiste suficiente ayuda. ¿No crees?</p>

<p>Hubiera preferido que se lo dijera mirándola a la cara, pero el hecho de que le preguntara así, con la mirada fija entre sus piernas, como si le hablara a eso, le resultaba desagradable y extraño.</p>

<p>Inés negó con la cabeza con dificultad. Cárcel sonrió con ironía.</p>

<p>—¿No?</p>

<p>—Eso no me ayuda.</p>

<p>—Lo sentiste.</p>

<p>—...</p>

<p>—En el espejo, cuando viste cómo te acariciaba el pezón.</p>

<p>—No hace falta que digas eso...</p>

<p>—... Viendo tu propio pecho sacudirse.</p>

<p>—...</p>

<p>—Si no es eso, ¿te excitó solo el hecho de que sacara tu pecho?</p>

<p>Ella cerró la boca a regañadientes.</p>

<p>En primer lugar, pensó que cuanto más intentara impedirlo, más ridículas serían sus primeras palabras, y en segundo lugar, pensó que su aspecto actual solo serviría para provocar más burlas.</p>

<p>Sin embargo, el silencio tardío no surte el efecto deseado.</p>

<p>—Responde, Inés.</p>

<p>—...</p>

<p>—Esto es parte del proceso de descubrir lo que te gusta.</p>

<p>En lugar de quitarle la ropa interior, la mano que había apartado a un lado se introdujo sin dudarlo en su húmedo interior. Pensar que hubiera sido mejor que se lo dijera mirándola a la cara no fue más que una fanfarronada.</p>

<p>Los ojos desconocidos de la primera noche reemplazaron a los familiares de él.</p>

<p><span style="font-style:italic">Esto no está nada, nada bien.</span></p>

<p>Los dedos que empujaban lentamente la estrecha pared interna llegaron hasta lo más profundo que podían y rasparon la pared interna. Inés echó la cabeza hacia atrás hacia el espejo y se mordió los labios.</p>

<p>Inmediatamente, un sonido viscoso le mareó los oídos de forma extraña. No... esto no tiene sentido...</p>

<p>—¿Qué ha hecho que te mojes?</p>

<p>—...Hmp, hmm...</p>

<p>—Tu agujero está mojado desde hace un rato, pero aún no hemos hecho gran cosa.</p>

<p>Entre los lascivos sonidos de chapoteo se oyeron palabras increíblemente vulgares.</p>

<p>—¡Es que, hmm, esas palabras...!</p>

<p>—Si eres tan refinada que te molesta escuchar estas palabras, dime qué te excita. Qué hace que te mojes tan fácilmente.</p>

<p>—Hm, uhmmm... ¡Ah...!</p>

<p>—¿Qué es lo que hace que una dama como tú se vuelva tan fácil abajo?</p>

<p>Los dedos que removían su parte inferior aumentaron. Dos, luego tres... Cada vez que los gruesos nudillos rozaban la pared interior apretada, ella no podía contener el placer y se retorcía, y el cordón del negligé se deslizaba lentamente hacia abajo, dejando al descubierto la mitad restante de sus pechos.</p>

<p>Al descubrir esa línea que dejaba al descubierto los pezones, los ojos de Cárcel brillaron peligrosamente. El camisón era tan fino que no ocultaba ni siquiera el color de la areola que se escondía debajo.</p>

<p>Él bajó la cabeza y se lo metió en la boca de un solo bocado. Le gustaba chuparlo hasta que le doliera. Le gustaba morder y masticar la punta del pezón, y también le gustaba calmar el dolor acariciándolo suavemente con la punta de la lengua...</p>

<p><span style="font-style:italic">... Lo que me gusta.</span></p>

<p>Sin duda, se había dejado engañar por ese maldito talento. Ella frunció el ceño y lo empujó de nuevo.</p>

<p>El hombro que tocaba su palma era tan duro que ahora incluso le daba ganas de vomitar, pero él, como si supiera perfectamente lo que Inés quería, se apartó un momento.</p>

<p>—¿No te gusta?</p>

<p>—...</p>

<p>—¿No te sirve de ayuda?</p>

<p>Se pasó la lengua por los labios y le preguntó con seriedad qué le parecía. Inés se quedó sin palabras por un momento.</p>

<p>No quería admitirlo, pero mentir no serviría de nada, ya que su cuerpo había reaccionado. Una mentira tan obvia sería lo peor que podría hacer...</p>

<p>—... Por supuesto que me ayuda. Pero...</p>

<p>Inés lo admitió con una expresión algo desolada. Tan pronto como terminó de hablar, cubrió con las manos el rostro de Cárcel, que intentaba volver a pegarse a su pecho, y añadió:</p>

<p>—... No soy una pervertida, así que si haces algo que me excite, me excito. Es lo normal. Mirándome al espejo, eso es porque tú eres un poco pervertido, pero sí. Quizás yo también...</p>

<p>—Lo sé. Tú también eres un poco pervertida, por eso te excitaste al verme acariciar tus pechos en el espejo, y tal vez no seas pervertida, pero sentiste algo en cada lugar que toqué.</p>

<p>Él escuchó atentamente las palabras de Inés y las resumió con sinceridad. No le gustó nada.</p>

<p>—Entonces, al final, me alegro ser de ayuda.</p>

<p>—Pero no quiero sentir nada innecesario...</p>

<p>—¿Sabes que seguir diciendo eso es lo que te hace parecer una pervertida?</p>

<p>—... ¿Qué?</p>

<p>—Al escucharte, parece que solo te gusta que te obliguen a hacerlo.</p>

<p>Era una exageración que seguía a la acusación de “¿Me estás diciendo que te viole?”. En realidad, “¿lo haces porque te gusta hacerlo a la fuerza más que por obligación?”</p>

<p>Inés negó apresuradamente con la cabeza.</p>

<p>—Sabes que no es eso lo que quiero decir...</p>

<p>—No lo sé. ¿También tengo que probar esto y registrar el resultado?</p>

<p>—Resultado, dices. ¿Cómo, exactamente...?</p>

<p>—Ya estás tan mojada que ni siquiera te dolerá... La pervertida también se decepcionará hoy.</p>

<p>Él respondió con arrogancia. Con su atuendo habitual, camisa y tirantes, y solo los pantalones ligeramente bajados, Cárcel frotó su pene erecto, cuya punta ya estaba mojada, contra la parte interior de los muslos de ella.</p>

<p>Era tan grande como si estuviera frotando un antebrazo musculoso, y tan largo que daba espanto antes incluso tomarlo. Mientras ella respiraba nerviosamente, su cuerpo se deslizó por el tocador.</p>

<p>Levantó el negligé y, con la mano que le había agarrado las nalgas por debajo de la ropa interior, le bajó rápidamente la ropa interior.</p>

<p>—No vuelvas a ponerte esto por las noches.</p>

<p>—¡Cárcel...!</p>

<p>—Me estorba si quieres que lo haga como a ti te gusta.</p>

<p>Él hizo girar su cuerpo con fuerza que cayó boca abajo sobre el tocador. Él la penetró desde atrás.</p>

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

document.addEventListener("keydown", function(e) {
    if (
        (e.ctrlKey || e.metaKey) &&
        ["c", "x", "s", "u", "p"].includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});

let tamano = 18;

function cambiarFuente(fuente) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    contenido.style.fontFamily = '"' + fuente + '", serif';
    localStorage.setItem("fuenteLectura", fuente);
}

function cambiarTamano(valor) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    tamano += valor;

    if (tamano < 14) tamano = 14;
    if (tamano > 26) tamano = 26;

    contenido.style.fontSize = tamano + "px";
    localStorage.setItem("tamanoLectura", tamano);
}

function modoOscuro() {
    document.body.classList.toggle("oscuro");

    localStorage.setItem(
        "modoLectura",
        document.body.classList.contains("oscuro")
            ? "oscuro"
            : "claro"
    );
}

window.addEventListener("DOMContentLoaded", function() {

    const contenido = document.getElementById("contenido");
    const fuente = document.getElementById("fuente");

    if (!contenido || !fuente) return;

    const fuenteGuardada = localStorage.getItem("fuenteLectura");
    const tamanoGuardado = localStorage.getItem("tamanoLectura");
    const modoGuardado = localStorage.getItem("modoLectura");

    if (fuenteGuardada) {
        fuente.value = fuenteGuardada;
        cambiarFuente(fuenteGuardada);
    }

    if (tamanoGuardado) {
        tamano = parseInt(tamanoGuardado);
        contenido.style.fontSize = tamano + "px";
    }

    if (modoGuardado === "oscuro") {
        document.body.classList.add("oscuro");
    }
});

</script>

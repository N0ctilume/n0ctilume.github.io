              <div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—Siempre pensé que llegaría un día como hoy, pero nunca imaginé que sería hoy...</p>

<p>Inés miró una vez a la Duquesa Valeztena, que había estallado en lágrimas en el momento en que se llevó un trozo de pan a la boca, y otra vez a Cárcel, que estaba sentado en silencio masticando su comida a su lado.</p>

<p>Los cambios de humor impredecibles de la Duquesa ya eran familiares para su familia, pero para los forasteros como Cárcel debían de ser totalmente desconcertantes. Aunque, teniendo en cuenta las diversas farsas que se habían desarrollado en ese mismo lugar una semana antes...</p>

<p><span style="font-style:italic">Aunque no es ninguna sorpresa...</span></p>

<p>La Duquesa, que mostraba toda una serie de síntomas neuropatológicos cada temporada, nunca olvidaba su instinto de supervivencia en público, pasara lo que pasara. Entre ellos, mostrar debilidad emocional se consideraba profundamente humillante y estúpido, como entregar la propia vida y muerte a otra persona.</p>

<p>La Duquesa poseía un carácter muy exclusivo; era impensable que ya considerara a Cárcel como parte de su familia. Una semana antes, se le podría haber perdonado que recurriera al alcohol, pero ahora eran las siete de la mañana, los pájaros cantaban en la ventana, una hora en la que solo se podía estar perfectamente sobrio.</p>

<p>—Ayer me pareció tan irreal, como un sueño durante todo el día. Pero al verlos hoy a los dos sentados así, uno al lado del otro, me parece totalmente real. Se siente como si una hemorragia de 100 años se hubiera desvanecido... No dejaba de preguntarme qué pecado había cometido para merecer tal humillación, pero hoy, por fin...</p>

<p>Esto era la prueba de que el matrimonio de Inés la embriagaba más que el vino. La Duquesa Valeztena parpadeaba sin cesar con los ojos llenos de lágrimas, desviando la mirada entre Inés y Cárcel.</p>

<p>—De verdad, esto es todo lo que siempre he deseado. Inés...</p>

<p>—Lo sé, madre.</p>

<p>Inés respondió con un suspiro. Si la Duquesa Valeztena hubiera sido una madre normal y Inés una hija normal, esta escena habría sido un momento profundamente emotivo, imposible de describir sin lágrimas.</p>

<p>Si hubiera sido así, la imagen del Duque Valeztena, que había empezado a llorar así, masticando solo carne ahumada desde primera hora de la mañana, ni la del recién casado, que se limitaba a bajar la mirada y masticar obedientemente mientras la madre de su esposa lloraba profundamente por el matrimonio de su hija. Tampoco habría existido este desayuno extrañamente tenso.</p>

<p>—Todavía no puedo creer que por fin te hayas convertido en mujer. ¿No sentiría cualquiera lo mismo? Vivir todos esos años vestida solo con ese saco negro de luto, para que al final te abandonara Lord Escalante…</p>

<p>—Ya basta, Olga…</p>

<p>—Como todo el mundo ha estado diciendo. Abandonada como en una isla desierta, sin un partido adecuado... Al igual que la comida se estropea si no se toca, también lo hace el matrimonio de una mujer. Pero ¿podría la hija de Valeztena casarse alguna vez fuera de los Grandes de Ortega? ¿Quién se atrevería? Si pasaban tres años más, quizás hasta un viudo hubiera estado de acuerdo, pero no hubiera servido…</p>

<p>La Duquesa, borracha sin haber bebido ni una gota de vino en aquella clara mañana, soltó sus habituales e inofensivas pero maliciosas burlas sobre Inés. El Duque Valeztena puso rostro serio.</p>

<p>Probablemente estaba calculando. ¿Sería mejor arrastrar a su esposa como a una criminal ante su hija recién casada y su yerno, que acababan de celebrar su boda y consumar el matrimonio, para callarle la boca de una vez? ¿O podría concluirse este asunto sin recurrir a una desgracia tan definitiva...?</p>

<p>—En lugar de mancillar el nombre de Valeztena con un matrimonio tan vulgar y provocar el desprecio del mundo, habría sido mejor encerrarla en un convento de por vida. Al menos habría podido invocar el nombre de Dios.</p>

<p>La Duquesa, ajena a los pensamientos de su marido, pronunció estas palabras con entusiasmo. Inés tragó unos cuantos trozos de habichuelas asadas como si se tratara de la aburrida historia que siempre escuchaba. Y, como para reflejar esa expresión, el rostro de Cárcel se volvió rígido y severo a cada momento.</p>

<p>—Por otra parte, viendo que ya vestías como una monja, lo hubiera hecho más fácil. ¿No está de acuerdo, lord Escalante?</p>

<p>—¡Olga!</p>

<p>—Me temo que no entiendo en qué la Duquesa busca aprobación.</p>

<p>Cárcel dejó su plato a medio comer, cogió la servilleta y se secó los labios con elegancia. Inés pareció intuir un mal presagio y dejó escapar un suspiro silencioso.</p>

<p>—Oh, ¿le preocupa que Inés se ofenda por mis palabras? Qué sensible es. Pero mi hija es dura como el hierro y firme como una roca; no presta atención a nada de lo que dice su madre. Así que...</p>

<p>—Si la mayor parte de lo que dice es de esta naturaleza, entonces yo también fingiré no oírlo. Duquesa.</p>

<p>—¿“De esta naturaleza”? ¿Qué quiere decir con eso? Seguramente no se refiere a mis preocupaciones sobre la esposa del joven Duque.</p>

<p>—La preocupación surge del afecto. Si su afecto por su hija es genuino, entonces tendría más miedo de las heridas que podría causarle más que de unas pocas palabras ignoradas.</p>

<p>Ni un alma se movió, ni siquiera se oyó el más mínimo ruido de cubiertos. Durante un momento se hizo un silencio absoluto.</p>

<p>Inés puso los ojos en blanco con cansancio, abatida por el incómodo silencio familiar. ¿Era esta nueva forma de “familia” lo que le resultaba incómodo, o era este peculiar silencio?</p>

<p>De un recuerdo lejano emergió la madre a la que una vez había odiado con locura y el esposo que ahora recibía sus críticas con indiferencia... ¿Esposo? Se sentía extrañamente desconocido y vergonzoso de nuevo. Inés sentía ahora la alienación de Cárcel, que se había convertido en su “esposo” de la noche a la mañana, más intensamente que las diatribas ahora sin emoción de su madre.</p>

<p>El hombre al que había considerado con una indiferencia casi infantil ahora parecía decidido a protegerla como se protege a un familiar. Se sentía completamente desconcertada. Solo dos horas antes, él la había atormentado de una manera aún más extraña que esta...</p>

<p>Poco después se había quedado dormida en la bañera y lo siguiente que supo era que estaban allí sentados.</p>

<p>La razón de su insomnio era totalmente primitiva, pero no propia de la noche de bodas de una noble, ya que cada vez que se quedaba dormida, la despertaban caricias implacables, y cada vez que volvía a quedarse dormida... el ciclo se repetía. En cierto sentido, parecía como si él estuviera decidido a atormentarla.</p>

<p>Con el informe a ambas familias de que “el amor de la pareja era excesivo” aún fresco en su mente, junto con los rostros sonrojados de los asistentes fuera de la cámara nupcial, dudaba que su mente agotada tuviera fuerzas para hacer frente a esta situación. Su cuerpo era otra cuestión totalmente distinta. Apenas conseguía mover la pesada cubertería con apariencia de compostura, como si fuera un gran trozo de hierro.</p>

<p>Los cambios de humor y la acidez de la Duquesa no siempre iban dirigidos únicamente a Inés. Cuando les tocaba el turno, acordaban tácitamente que lo mejor era simplemente dejarlo pasar, pensando que ese momento también pasaría pronto. Sin embargo, lo mejor era evitar por completo encontrarse con su madre o su esposa.</p>

<p>Lo soportaban manteniendo la máxima distancia entre ellos, compartiendo solo las comidas más a regañadientes en los días festivos y manteniendo la fachada familiar.</p>

<p>El Duque Valeztena pasaba la mayor parte del año en la finca en Mendoza, mientras que la Duquesa pasaba la mayor parte del suyo en el dominio del Duque en Pérez. A diferencia de la residencia en Mendoza, la finca de Pérez era excesivamente grande, y Luciano e Inés podían existir allí como si ni siquiera estuvieran presentes, si así lo deseaban.</p>

<p>Si no hubiera sido por el matrimonio de Inés, toda la familia nunca habría podido soportar tal sucesión de momentos sofocantes.</p>

<p>Era como revivir la infancia. O quizás una pesadilla bastante común.</p>

<p>—¿Lo ha oído, mi Lord? Su yerno acaba de darme una lección. Nada menos que sobre cómo debemos tratar a nuestra propia hija.</p>

<p>—...No hay nada malo en las palabras de Lord Escalante. Esta es nuestra última comida en la residencia Valeztena. Así que mantén tu dignidad.</p>

<p>—Ese pedazo de escoria de Escalante se atrevió a darme una lección. Se atrevió a decir que yo no era sincera. Que no amaba a Inés...</p>

<p>—... Olga.</p>

<p>—Hablo del esposo de esa chica al que tú llamaste escoria. Y, sin embargo, ¡todo lo que puedes decir es...!</p>

<p>—Mi esposa tiene oídos. Todo lo que diga, ella lo oirá. La Duquesa no tiene por qué tragarse su orgullo.</p>

<p>Tras ponerse en pie, Cárcel extendió la mano hacia Inés al terminar de hablar. Inés la miró fijamente durante un momento antes de lanzar una mirada severa al Duque Valeztena.</p>

<p>Él asintió con la cabeza. Como si le agradeciera que desapareciera rápidamente.</p>

<p>Como si esperara ese permiso, en el instante en que Inés se movió para tomar su mano, él la levantó suavemente, sosteniendo todo su peso por debajo de la muñeca.</p>

<p>Era una cortesía perfecta, pero un servicio excesivo. Como si supiera lo difícil que le resultaba levantarse. Cuando Inés se levantó de la silla y se colocó a su lado, Cárcel se inclinó hacia la Duquesa con una deferencia algo excesiva.</p>

<p>—El viaje a Calstera es largo, así que debo pedirles perdón por no poder quedarnos más tiempo.</p>

<p><span style="font-style:italic">¿Calstera?</span></p>

<p>—¿Inés?</p>
	
<p>Cárcel la llamó en voz baja, como para sugerirle que ella también debía añadir algo. Inés habló, casi como si la empujaran.</p>

<p>—...Perdonen nuestra abrupta partida, madre, padre. Volveremos pronto a Mendoza.</p>

<p>—¿Qué le has dicho a tu marido sobre tu madre? Lord Escalante, tratar a la madre de la novia con tanta descortesía justo después de la noche de bodas... Qué grosero...</p>

<p>—Lo sé, pero parece estar bien.</p>

<p>—...</p>

<p>—Su Excelencia, nos retiraremos ahora.</p>

<p>Cuando salieron por la puerta, sintió como algo lo poseía.</p>

<p>Inés miró de reojo a Cárcel, que la escoltaba en silencio y con cautela, luego miró al frente, volvió a mirar a Cárcel y frunció los labios en silencio.</p>

<p>—... Perdóname si me extralimité.</p>

<p>A pesar de sus repetidos intentos por hablar, fue Cárcel quien habló primero. Inés dejó escapar algo parecido a un suspiro entre sus temblorosos labios antes de decir finalmente:</p>

<p>—No tenías porqué hacerlo.</p>

<p>—Lo sé. Pensé que dirías eso.</p>

<p>Su gran mano, que rodeaba la de ella por debajo de la muñeca, se movió por debajo de la de ella, entrelazando sus dedos. Sin embargo, no parecía tanto que se estuvieran cogiendo de la mano como que él la estuviera sosteniendo.</p>

<p>Como si estuviera construyendo un muro de contención mal ajustado debajo de un castillo de arena que podría derrumbarse en cualquier momento.</p>

<p>—Pero no tienes porqué disculparte. Nuestra familia puede ser bastante vergonzosa a veces... Soy yo quien debería disculparse. Por haberte hecho pasar por semejante incomodidad el mismo día en que tienes que volver a tu puesto.</p>

<p>—Lo dices con tanta facilidad.</p>

<p>Cárcel murmuró momentáneamente atónito, y luego dejó escapar un suspiro.</p>

<p>—No hay absolutamente ninguna razón por la que debas sentirte ridiculizada, Inés, y menos teniendo que soportar un abuso tan inhumano.</p>

<p>—Abuso es una palabra bastante fuerte...</p>

<p>—Los padres normales no tratarían a su hija con tanto desprecio. No la menospreciarían de esa manera.</p>

<p>—...</p>

<p>—No destruirían la dignidad de su hija de esa manera delante del hombre con el que acaba de casarse.</p>

<p>—Mi madre, a pesar de lo que parezca, está encantada con nuestro matrimonio. Si hubieras escuchado hasta el final, probablemente habría dicho: “Me alegro de que todo haya sucedido así gracias a Escalante”.</p>

<p>Pero los momentos en los que uno realmente quiere escucharla hasta el final son raros, y como Inés no esperaba una gran despedida de todos modos, encontró el momento presente cómodo y agradable. Al ver que Cárcel fruncía el ceño en silencio, añadió, en tono algo conciliador.</p>

<p>—No es algo que ocurra a menudo. No solo se comporta así conmigo...</p>

<p>—...</p>

<p>—Mi padre pasa la mayor parte del tiempo en Mendoza y mi madre, en la finca en Pérez, por lo que es raro que toda la familia se enfrente así. No me importa...</p>

<p>—Vi tu expresión, Inés.</p>

<p>—¿Mi expresión?</p>

<p>—Solo con ver esa mirada tuya, como si estuvieras bloqueando el mundo, lo sé. Que este tipo de cosas te pasan hasta la saciedad.</p>

<p>—...</p>

<p>—No dejes que tu madre te hable con tanta desconsideración. Tanto si eres una Valeztena como una Escalante...</p>

<p>De repente, por costumbre, se frotó varias veces seguidas la cara con la mano que no sostenía a Inés. Bajo la mano que se presionaba contra la frente, se hizo visible su ceño, repentinamente profundamente arrugado. Inés lo llamó en voz baja.</p>

<p>—Cárcel.</p>

<p>—...Lo siento, lo siento tanto.</p>

<p>—¿Por qué?</p>

<p>—No fue mi intención presionarte tanto.</p>

<p>—... ¿Presionarme? ¿De qué...?</p>

<p>—... Me comporté como una bestia. Es natural que te sientas cansada por mi actitud de anoche.</p>

<p>—¿De qué demonios...? Ah...</p>

<p>Era un poco tarde para que ella comprendiera completamente el significado de las palabras de Cárcel. Inés se limitó a asentir ligeramente sin responder.</p>

<p>Cárcel parecía haber dicho algo similar varias veces ya. Pero ese último recuerdo, cuando escapó del baño y se puso ropa limpia, estaba lejos de sus sentidos. Era obvio que no había entendido ni una palabra de lo que Cárcel había dicho, y mucho menos el tono de su voz.</p>

<p><span style="color:#777777">—Pero como no lo necesitas, me estás pidiendo que te viole.</span></p>

<p><span style="color:#777777">—Violación…</span></p>

<p><span style="color:#777777">—... Es lo único de lo que no paras de hablar. Quieres que te viole. Que no piense en cómo te sientes, que no me importe si puedo tomarte, solo quieres que lo meta, lo sacuda, termine y me largue.</span></p>

<p><span style="color:#777777">—Estoy dándote mi consentimiento. Eso no podría ser una violación.</span></p>

<p><span style="color:#777777">—Realmente eres una mujer retorcida.</span></p>

<p>Inés consideró brevemente la naturaleza de la culpa que había aflorado claramente en el apuesto rostro de Cárcel.</p>

<p>Le vinieron a la mente fragmentos de la conversación franca y aguda de la noche anterior. La expresión que había cambiado tan terriblemente cuando ella dijo la palabra “violación”. Ese rostro desconocido...</p>

<p>—Te traté con descuido. No tenía ningún derecho a hablarle a tu madre como si fuera superior.</p>

<p>—No es que tú...</p>

<p>Inés eligió cuidadosamente sus palabras. ¿No la había violado? Eso era demasiado obvio, y no era el tipo de cosa que uno esperaría oír durante ese período onírico en el que una pareja de recién casados acababa de consumar su unión y abandonaba la casa de la novia.</p>

<p>También recordaba cómo, cada vez que sentía esa fuerza momentánea y dominante, se enfriaba abruptamente, como si se hubiera vertido agua fría sobre un yunque al rojo vivo. Era más persistente de lo que podía imaginar, pero mantenía una línea con Inés, tal vez la línea que uno mantiene con su esposa.</p>

<p>Por lo tanto, ella no creía que la hubiera abrazado únicamente por lujuria. Quizás aquella inquietante conversación había encendido algunas brasas incómodas... pero, en cualquier caso, Cárcel Escalante formaba parte de la Armada Imperial, la encarnación misma del deber. Contrariamente a su naturaleza libre y mujeriega, también estaba lleno de coraje militar y, como él mismo afirmaba, poseía una fidelidad inesperada que parecía casi un accesorio del uniforme.</p>

<p>Para unos ojos embotados por innumerables citas con mujeres hermosas, ¿qué deseo podía despertar su cuerpo, lejos de ser perfecto? Él simplemente había expresado el deber de la primera noche con un poco demasiado fervor.</p>

<p>—... Nunca me trataste con descuido. Ayer fue nuestra noche de bodas; simplemente hicimos lo que hacen las parejas casadas.</p>

<p>Ante la respuesta ligera y afectuosa de Inés, la expresión de Cárcel, impregnada de culpa, se volvió ligeramente matizada.</p>

<p>—Lo que hacen las parejas casadas.</p>

<p>—No me obligaste a nada...</p>

<p>—¿Recuerdas lo que te hice en el baño hace solo dos horas?</p>

<p>Aunque el recuerdo ya era borroso, ya que había ocurrido en un estado de semisueño, estaba claro que había sido algo más que un simple lavado.</p>

<p>Cárcel se inclinó sobre el hombro de Inés y añadió en voz baja:</p>

<p>—¿Lo que hiciste por mí allí dentro?</p>

<p>—... No recuerdo haber hecho nada especialmente notable.</p>

<p>Aunque solo habían pasado un par de horas, era un recuerdo lascivo que prefería no recordar en una mañana tan clara, aunque tampoco era precisamente algo de lo que presumir.</p>

<p>Cuando Inés respondió con indiferencia, Cárcel frunció los labios como si le hubiera invadido una repentina irritación, y luego esbozó una sonrisa peculiar.</p>

<p>—¿Nada especialmente notable?</p>

<p>—Por supuesto, creo que fui demasiado torpe y que debí dejarte insatisfecho.</p>

<p>Aunque ella ya había propuesto excluir al máximo el placer de sus relaciones maritales, él había expresado tal aversión que había recurrido a un lenguaje extremo. Inés abandonó rápidamente ese aspecto y centró sus esfuerzos en otra cosa.</p>

<p>No buscaba satisfacerlo plenamente, ya que sería problemático que él se encariñara con su relación, ni adoptaba una postura demasiado pasiva que pudiera prolongar innecesariamente las cosas.</p>

<p>E incluso en sus vagos recuerdos, estaba segura de haber mantenido perfectamente ese término medio.</p>

<p>—No fuiste torpe. En absoluto.</p>

<p>—Ya hemos cumplido con creces con nuestro deber, Inés Escalante.</p>

<p>En ese momento, Inés se tambaleó al pisar la escalera. Cárcel la rodeó con un brazo por la cintura y la atrajo hacia él. La ayudó a dar cada paso lentamente y, de repente, la levantó en brazos como si no pudiera soportar dejarla caminar más.</p>

<p>Para quienes no conocían la situación, parecía como si ella hubiera sufrido una lesión grave. Inés, aparentemente consciente de las miradas de los sirvientes, no se atrevía a apartarlo y le susurró con una sonrisa incómoda.</p>

<p>—... Odio este tipo de cosas. Bájame.</p>

<p>Solo después de bajar toda la escalera la dejó en el suelo, pero habló como si obedeciera la orden de Inés.</p>

<p>Las caras sonrojadas de los jóvenes sirvientes pasaron ante sus ojos, seguidas de las caras carmesí de los asistentes fuera de la cámara nupcial. Los informes de que el afecto de la pareja se había vuelto excesivo... Inés, con su delicada constitución, no pudo soportar la vergüenza y su rostro se torció ligeramente.</p>

<p>Ese mismo informe fue lo que hizo que su madre se sintiera mareada y feliz, lo que finalmente la llevó a atacarla. Su madre atacaba a quienes la rodeaban cuando estaba triste y, cuando estaba demasiado feliz, volvía a atacarlos. Tal era su aflicción. Atormentaba a quienes la rodeaban, los alejaba, incapaz de soportar su propia felicidad... Entonces, sumida en una sensación de victimismo porque todos sus seres queridos se distanciaran de ella y la rechazaran, se hundía en la autocompasión. Era su especialidad. Si Luciano se casara pronto, sin duda intentaría quebrantar su espíritu también.</p>

<p>Inés contuvo un suspiro y siguió adelante. Sin embargo, casi inmediatamente, alguien la agarró suavemente del brazo y el escolta Cárcel la siguió una vez más, tan devoto como siempre.</p>

<p><span style="font-style:italic">Ya hemos cumplido..</span>. Una voz, grave y profunda como una cueva, acechaba su conciencia como cuerdas que ataban su cuerpo, sofocante y opresiva.</p>

<p>Debido a esto, se encontró de repente partiendo hacia el puesto de Cárcel en Calstera sin siquiera poder preguntar por qué, ni siquiera desde el carruaje. En primer lugar, porque ni siquiera se le había ocurrido preguntar, y en segundo lugar, porque había estado demasiado ocupada desplomándose en su regazo y cayendo en un sueño profundo.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>En el momento en que bajó del carruaje, un repentino mareo le nubló la vista, pero poco a poco las imágenes borrosas se fueron enfocando hasta que recuperó la visión clara. Esto se debió en gran parte a su naturaleza impaciente, que la había llevado a incorporarse en cuanto despertó y saltar del alto carruaje al suelo.</p>

<p>Una causa más fundamental fue el tortuoso régimen de adelgazamiento impuesto por la Duquesa justo antes de la boda, que la había matado de hambre al menos diez días...</p>

<p>Le pareció oír maldiciones que resonaban como una alucinación auditiva detrás de su cabeza. Inés, que ya se había estabilizado lo más posible, volvió a tambalearse cuando una mano la agarró bruscamente.</p>

<p>—¿Te mareaste? ¿Estás bien? ¿Qué te pasa? ¿Vértigo? ¿Anemia? ¿Tienes anemia?</p>

<p>—Eres ruidoso, Cárcel...</p>

<p>Sus labios se presionaron contra su oreja, y su voz grave la taladraba sin cesar, haciéndole zumbar la cabeza. Su voz ya resonaba en sus oídos... Inés se presionó las sienes con los dedos, sacudió la cabeza y lo apartó suavemente.</p>

<p>Mientras ella dormía profundamente dentro del carruaje, Cárcel, que ya había salido, se dio cuenta en silencio de que Inés saltaba del carruaje para seguirlo. Casualmente, era el momento en que ella parecía más frágil y vulnerable.</p>

<p>Incluso cuando Inés lo apartó, aplastándole la nariz esculpida, él no pudo reprimir su sorpresa. La volvió a atraer hacia sus brazos y le susurró al oído.</p>

<p>—¿Es mi culpa?</p>

<p>Esta vez, sus labios se presionaron contra su piel mientras le preguntaba. Fue una sensación que resonó profundamente en su piel. Como ciertos momentos de su noche de bodas... Inés se estremeció, sobresaltada como un pez que había mordido el anzuelo accidentalmente, y luego giró la cabeza con una expresión tranquila y severa, como si mantuviera su dignidad, y respondió.</p>

<p>Incluso en este pequeño lugar había sirvientes.</p>

<p>—No.</p>

<p>—Es mi culpa.</p>

<p>Pero los labios siguieron su ejemplo. Inés habló con irritación, con el rostro aún sereno.</p>

<p>—¿Qué exactamente, qué?</p>

<p>—Porque te sobre exigí demasiado anoche.</p>

<p>—... Fue porque me levanté con prisa nada más despertar.</p>

<p>—¿Por qué?</p>

<p>—Porque me levanté con prisa...</p>

<p>—Sí pero, ¿por qué?</p>

<p>Cárcel le preguntó como si no supiera nada sobre la hipotensión ortostática y no pudiera entenderlo. Todo su cuerpo se sentía como una enorme roca, por lo que no era de extrañar que no pudiera comprender los pequeños problemas de la gente común.</p>

<p>Inés suspiró.</p>

<p>—A veces pasa. Si has estado sentado durante mucho tiempo y de repente te levantas...</p>

<p>—¿No es eso una enfermedad?</p>

<p>—Les suele pasar a las mujeres.</p>

<p>Ella tampoco había comido bien en diez días... Aunque había una causa más fundamental, alguien más se tapaba los oídos con culpa.</p>

<p>Cárcel se limitó a asentir ligeramente, fingiendo escuchar la respuesta de Inés, y concluyó que su fragilidad momentánea era, en última instancia, culpa suya. La agarró con firmeza por debajo del hombro, tirando de todo su peso hacia él como si estuviera sosteniendo todo su cuerpo.</p>

<p>Inés forcejeó como una prisionera cautiva.</p>

<p>—Entonces suéltame.</p>

<p>—Está bien. ¿Puedes caminar?</p>

<p>—¿Soy una debilucha?</p>

<p>—Tuvimos sexo toda la noche hasta que me dejaste—</p>

<p>—¡Cárcel Escalante, si alguien te escuchara decir esas obscenidades…!</p>

<p>—Nadie puede oírnos. Y no has pegado ojo en todo la noche por—</p>

<p>—... Tú tampoco has dormido nada.</p>

<p>A pesar de eso, parecía casi demasiado sereno, como si hubiera tenido un mal sueño... Inés miró a Cárcel como si estuviera viendo algo completamente extraño por primera vez.</p>

<p>—Descanse en el carruaje todo el camino hasta aquí.</p>

<p>—Eso no es dormir.</p>

<p>Inés tiró de la cadena del reloj de bolsillo que asomaba del bolsillo de su uniforme para mirar la hora. Ya habían pasado siete horas desde que habían salido de la residencia del Duque Valeztena en Mendoza. Se había desmayado en cuanto subió al carruaje, así que debía de ser precisamente el tiempo que había dormido.</p>

<p>Por la distancia, el viaje solo debería de haber tardado cinco horas, así que él debía de haberle indicado al cochero que fuera deliberadamente despacio. Tal vez porque estaba demasiado preocupado de que recargara tensión en su cuerpo.</p>

<p>La verdad es que era una sorpresa tras otra.</p>

<p>—...Ya han pasado siete horas, Cárcel.</p>

<p>Inés soltó una risita ligeramente exasperada.</p>

<p>—Sí, es tu culpa. Así que quítame las manos de encima.</p>

<p>Era como si estuviera diciendo: si has hecho algo malo, haz lo que te digo. Solo después de decir eso, él bajó obedientemente las manos, revelando una vez más su carácter. La expresión de Inés se iluminó considerablemente mientras seguía adelante.</p>

<p>Cárcel la siguió, con expresión escéptica. Si ella hubiera dado un paso en falso, aunque fuera el más mínimo, él parecía dispuesto a cogerla y acostarla directamente en dispensario.</p>

<p>—No esperaba acompañarte a tu puesto.</p>

<p>—¿Por qué?</p>

<p>—Pensaba que cuando volvieras a tu puesto, me llevarías al Ducado de Esposa.</p>

<p>—Pero yo no estaré allí.</p>

<p>—No hay ninguna norma que diga que debemos estar juntos...</p>

<p>De hecho, la mayoría de los oficiales no vivían con sus esposas. El oficial permanecía en su puesto, mientras que su esposa custodiaba la mansión familiar en su ciudad natal o en la capital, compartiendo solo breves momentos de vida matrimonial durante los permisos.</p>

<p>Si el vínculo era más fuerte, las licencias podían ser más frecuentes o la esposa podía visitar ocasionalmente el puesto; si era aún más fuerte, la esposa podía pasar las buenas estaciones juntos en el puesto...</p>

<p>—Calstera tiene un número inusualmente alto de esposas de oficiales. Es tan bonito como un centro turístico.</p>

<p>Cárcel se encogió ligeramente de hombros. Quería decir que era una ciudad lo suficientemente encantadora como para vivir juntos, aunque la pareja no se amara necesariamente.</p>

<p>Inés tampoco lo negó. Teniendo como ejemplo la residencia de Cárcel, situada en una colina donde soplaba la brisa marina desde la costa de Calstera. En lugar del aire cálido y húmedo del verano en Mendoza, las frescas olas llevaban constantemente el sonido de las olas rompiendo en el viento.</p>

<p>Abajo, hermosas residencias navales con paredes blancas y techos rojos se extendían a lo largo de la ladera, creando una vista impresionante al dominar colectivamente el vasto puerto naval.</p>

<p>Si uno pudiera abandonar la vasta escena social de Mendoza y elegir libremente, cualquiera elegiría este puerto naval en lugar de Mendoza. Inés contempló la alta valla de hierro, recién pintada de verde azulado, y los tejados rojos visibles a través de la hermosa celosía, y se tomó un momento para respirar profundamente.</p>

<p>A diferencia de las pequeñas ciudades turísticas que invariablemente se acurrucan alrededor de puertos o aguas termales, cada una de las cuales presume de un ambiente relajado, este lugar revelaba una tranquilidad refinada con precisión, como si se hubieran encajado piezas intrincadas sin una sola junta floja.</p>

<p>Una ciudad donde el rigor único de un gran puerto naval, el cielo elevado y el hermoso azul del mar se entrelazaban de forma extraña...</p>

<p>El sonido de las olas lamía sus oídos, que se habían vuelto insensibles y quietos, acercándose y alejándose en un ciclo sin fin. El sonido de las olas siempre le traía a la mente a alguien de sus sueños. El feroz sonido de las olas en el puerto, la visión oscilante, la respiración que le subía a la garganta, la mano que parecía que se le escaparía en cualquier momento, llena de ansiedad...</p>

<p>No era el mejor momento para recordar. Para “ellos”, había habido momentos mucho mejores. Inés parpadeó con los párpados temblorosos, cerrándolos brevemente antes de volver a abrirlos.</p>

<p>Cuando estaba completamente agotada, desesperada por conciliar el sueño, ni siquiera tenía energía para preocuparse por esas cosas. Descansar cómodamente en el vagón que avanzaba lentamente le había parecido una bendición entonces, pero ahora no le parecía tan agradable.</p>

<p>Fue antes de que el sonido de las olas la devolviera a la realidad...</p>

<p>—¿Inés?</p>

<p>—... No es nada. Entremos.</p>

<p>El puerto de “ese día” no era en realidad el puerto principal de Calstera, sino un pequeño puerto pesquero más abajo en la costa. Este lugar, un puerto militar situado un poco más al norte del puerto principal, no era un lugar al que los civiles pudieran entrar y salir libremente.</p>

<p>Bajó la mirada hacia la mano de Cárcel, que una vez más le sostenía suavemente el brazo, y luego levantó la vista hacia su rostro.</p>

<p>La residencia del Capitán Escalante era, en realidad, una casa que ni siquiera su propietario conocía especialmente bien.</p>

<p>Los cuarteles de los oficiales, construidos a lo largo de las laderas de la baja colina Logorño, situada justo al oeste del puerto naval, eran un lugar donde las vistas y el poder solían estar directamente relacionados.</p>

<p>Dominar toda la flota anclada en el puerto naval, contemplar las innumerables oficinas y cuarteles, grandes y pequeños, construidos a lo largo de la costa, e incluso admirar el esplendor del cuartel general naval, resplandeciente como un palacio, se consideraba el máximo honor para la residencia de un oficial naval de Calstera.</p>

<p>Naturalmente, con la ladera ya densamente ocupada por residencias más antiguas, apenas quedaba terreno adecuado para construir una mansión aristocrática lo suficientemente grandiosa. Así, los generales nobles y los oficiales de alto rango insatisfechos con residencias de escala meramente adecuada compraron terrenos más alejados del cuartel general, construyendo mansiones exclusivamente para ellos. Dejando a un lado ese mundo propio, en Calstera, la vista seguía siendo el valor supremo, pasara lo que pasara.</p>

<p>Y Cárcel Escalante era el nieto del Almirante Calderón Escalante de Esposa, un nombre destinado a perdurar mil años en la historia de la Armada de Ortega, y el nieto mayor que heredaría ese título.</p>

<p>En una ocasión, con bastante presunción, ignoró el barrio residencial de Logorño que los oficiales codiciaban y, en su lugar, compró y se instaló en el patio militar situado junto al cuartel general naval y, detrás de él, como para hacer alarde, la mansión de un coronel retirado. Esto ocurrió menos de un año después de que fuera nombrado Teniente.</p>

<p>No prestó ninguna atención a las vistas al mar que sus superiores codiciaban, como si no tuvieran ningún valor para él. Desde el interior de la mansión, era difícil saber si se trataba de una ciudad costera o de un pueblo del interior a al menos cinco o seis horas del mar, una vista sencilla desde una mansión ordinaria, pero excesivamente grandiosa...</p>

<p>Algunos no lo entendían, otros no podían evitar burlarse: “Bueno, es lo que cabe esperar del nieto de tal y tal”, pero él tenía sus propias razones.</p>

<p>Cárcel estaba realmente harto del mar. Durante su primer año de servicio, cuando fue destinado a la campaña para exterminar al pueblo Tala, los diez meses de combates esporádicos que siguieron hicieron que no pisara tierra firme ni siquiera tres días seguidos.</p>

<p>Toda su vida transcurría en cubierta. Ya fuera a la deriva en el mar infinito y sin límites, sin nada que obstaculizara la vista, o amarrado de forma segura en un puerto naval, el hecho seguía siendo el mismo: no podía pisar tierra firme. La sola idea de tener que enfrentarse a ese mar, incluso desde sus aposentos, cada vez que abría los ojos o cada vez que regresaba a ellos, no llenaba a Cárcel de éxtasis, sino de una sensación de pavor.</p>

<p>Una ciudad tranquila, colinas y campos tranquilos... La gran mansión del coronel Valencia había sido un refugio bastante decente.</p>

<p>Entonces, ¿por qué demonios había sido sustituida por esta hermosa y modesta residencia encaramada en una colina con vistas al puerto de Calstera?</p>

<p><span style="color:#777777">—Mayor, ¿su esposa sigue en la residencia?</span></p>

<p><span style="color:#777777">—¿Cómo podría deshacerme de una mujer que ni siquiera piensa en volver?</span></p>

<p><span style="color:#777777">—Escuché que usted y su esposa solían pelearse por cualquier nimiedad en Mendoza. Hace solo quince días, amenazaba con tirarse del muelle el día que ella llegó a Calstera, o con lanzarse desde la cima del monte Logorño... Todo ese discurso sobre matarse...</span></p>

<p><span style="color:#777777">—Sí, tal como dijiste. Y precisamente tú tenías que recordarlo...</span></p>

<p><span style="color:#777777">—Entonces dígame, ¿ya no desea morir estos días? ¿Cómo es que sigue vivo?</span></p>

<p><span style="color:#777777">—La verdad es que... Julieta se ha convertido en una mujer completamente diferente...</span></p>

<p><span style="color:#777777">—¿Diferente?</span></p>

<p><span style="color:#777777">—Como si la viera por primera vez.</span></p>

<p><span style="color:#777777">—¿Es porque rara vez la ve? Se casaron hace diez años...</span></p>

<p><span style="color:#777777">—Ni siquiera entiendes una metáfora, mocoso. ¿El entrenamiento de cadetes solo te llenó de músculos el cerebro?… Esta es la primera vez que Eta visita Calstera. También es la primera que se queda. Orense, ¿has estado en mi residencia?</span></p>

<p><span style="color:#777777">—La recuerdo. Las vistas eran para morirse.</span></p>

<p><span style="color:#777777">—Mocoso, si el Vizconde Orense ha decidido  entregar el intelecto bastante limitado de su único hijo a la Armada Imperial, entonces por lo menos deberías utilizar un lenguaje acorde: elegante, cortés, digno. ¿Qué es eso de “para morirse”? Excelente, magnífico, abrumador, nada menos que arte...</span></p>

<p><span style="color:#777777">—Me atrevo a decir que la residencia del Comandante cuenta con la mejor ubicación de Logorño. Desde la cima de la colina, se puede contemplar toda la vista de un solo vistazo: el puerto naval de Calstera, el cuartel general, los barracones, el distrito de la guarnición e incluso las lejanas islas De La Plana. Es una vista verdaderamente sagrada y sublime.</span></p>

<p><span style="color:#777777">—Muy bien. Me gusta ver que te corriges. De todos modos, ya ves. Si incluso un ojo inexperto como el tuyo pudo verlo, ¿cómo no sería para el ojo perspicaz de Julieta?</span></p>

<p><span style="color:#777777">—¿Ojo perspicaz? Una vez lo llamó un ojo inútil que no sabía distinguir lo bueno de lo malo, y dijo que ese ojo inútil le hacía tirar el dinero como si fuera basura, que era una mujer jodidamente extravagante y...</span></p>

<p><span style="color:#777777">—Teniente Orense, ¿está insultando a la esposa de su superior? ¿Una mujer jodidamente extravagante, dice?</span></p>

<p><span style="color:#777777">—¿Cómo me atrevería? Jamás. Por supuesto que no. Esas fueron las palabras del Comandante, se lo aseguro...</span></p>

<p><span style="color:#777777">—¿Dices tonterías y ahora culpas a tu superior?</span></p>

<p><span style="color:#777777">—Nunca. ¿Cómo me atrevería? Imposible.</span></p>

<p>Por eso le había venido de repente a la mente aquella conversación, que había escuchado un día mientras liaba un cigarro en la cubierta. El diálogo había escalado montañas más altas que la colina Logorño, pero la conclusión seguía siendo la misma. El Comandante Elba y su esposa, separados durante una década hasta el punto de odiarse mutuamente, se habían transformado inesperadamente en una nueva pareja en Calstera.</p>

<p>Aproximadamente la mitad se debía a la mansión con vistas al mar, algo que su esposa nunca había visto antes en su ciudad natal ni en Mendoza; la otra mitad se debía al tamaño modesto de una residencia militar, diferente de las mansiones habituales. Poseía una elegancia frugal, pero no era precisamente aristocrática en cuanto a tamaño.</p>

<p>Allí podían verse como si fueran personas diferentes. Con pocos sirvientes, podían pasar tiempo juntos en tranquilidad y, con el tiempo, incluso el odio que habían albergado se consideraba con cierta generosidad.</p>

<p>Cuando Cárcel recordó esta conversación de apenas diez días atrás, el Comandante Elba se encontraba casualmente en Mendoza, tras haber recibido su permiso de verano.</p>

<p>En el momento en que confirmó este hecho, todo pareció predestinado y parte de una secuencia predeterminada. Cárcel sintió que era necesario soportar incluso la insubordinación de expulsar a su superior de su propia residencia.</p>

<p>El Comandante Elba estaba alineado con el Conde Carpio, que colaboraba principalmente con el Duque Valeztena en el Gran Consejo, por lo que la insubordinación no era realmente tan difícil de lograr.</p>

<p>Sin embargo, necesitaba una forma de hacer que hicieran las maletas y se marcharan en el menor tiempo posible, sin dejar de ser lo más humano posible y evitando el resentimiento, no fuera que cualquier animadversión hacia su esposa pudiera causar pequeños inconvenientes a Inés.</p>

<p>Finalmente, Cárcel recuperó varios documentos oficiales con la firma largamente olvidada de su abuelo, el Almirante Calderón, en el sótano de la residencia Escalante. No había ningún oficial naval que no venerara al Almirante Calderón. Luego, los presentó, junto con un rifle de caza grabado con el nombre de Calderón y un bastón de teniente, ambos heredados directamente de su abuelo entre su vasta colección de insignias militares.</p>

<p>El resultado era previsible. El Comandante Elba, ocho rangos por encima de Cárcel, le preguntó si la mansión era todo lo que necesitaba y, luego, prácticamente se arrastró a cuatro patas para quitárselos de las manos a Cárcel antes de romper a llorar.</p>

<p>Su esposa, Julieta Elba, no pidió nada más que una carta de saludo de siete líneas escrita de puño y letra por Cárcel, por lo que todo terminó en un instante. En los diez días que quedaban hasta la boda de la pareja, habían retirado todas sus pertenencias y desaparecido en solo cinco días.</p>

<p>La anciana ama de llaves que gestionaba la residencia de Cárcel pasó dos días contratando a veinte trabajadores para trasladar los muebles esenciales necesarios para la vida cotidiana. Los tres días restantes los dedicó a acondicionar el lugar para que pareciera habitado, como si Cárcel siempre hubiera residido allí.</p>

<p>Diez días en total. Debió de ser un viaje parecido a una guerra.</p>

<p>En el momento en que la ama de llaves terminó esa ardua tarea, llegó el amo, Cárcel Escalante. Se dio cuenta enseguida.</p>

<p>Este lugar era demasiado pequeño y las pertenencias que había traído de la mansión eran demasiadas.</p>

<p>—¿Por qué hay tanto equipaje?</p>

<p>—...</p>

<p>—La residencia es pequeña. Deberías haber reducido un poco las cosas...</p>

<p>La gran cómoda antigua, tallada en madera de caucho, finalmente no encontró un lugar donde colocarla, lo que redujo considerablemente el pasillo. Su profundidad era más de la mitad del ancho del pasillo, lo que obligaba a Cárcel a girar sus anchos hombros hacia los lados para poder pasar por esa sección.</p>

<p>Inés suspiraba cada vez que veía muebles tan grandes, colocados al azar por toda la residencia, como si hubieran perdido su lugar.</p>

<p>Cárcel, que fingía mostrarle la residencia a Inés mientras en realidad exploraba por primera vez sus rincones desconocidos, también se sorprendió bastante por lo modesto que era el tamaño del lugar.</p>

<p>—Quizás sería mejor devolver algunas piezas al castillo de Esposa, Cárcel.</p>

<p>—....</p>

<p>—¿Podré vivir aquí?</p>

<p>—¿Por qué no habrías de poder?</p>

<p>Incluso mientras lo decía, Cárcel pensó, casi burlándose de sí mismo: “Quizás no podamos”. La casa parecía tan pequeña que su sola presencia bastaba para expulsarlo de ella.</p>

<p>—No soy especialmente materialista, pero tampoco parece haber espacio para mis pertenencias. Supongo que es lógico, ya que las familias rara vez viven juntas en las bases...</p>

<p>Inés murmuró inquieta, como si fuera una invitada no deseada.</p>

<p>Esta casa de dos plantas, de altura modesta, podría ser la mansión soñada para la clase media ligeramente acomodada de Ortega, pero para los descendientes de los Grandes de Ortega —amos natos de vastas propiedades, que pasaban sus vidas hoy en este castillo, mañana en aquel— parecía tan pequeña como un establo anexo a una posada.</p>

<p>Los jardines y patios anexos a la mansión eran, en el mejor de los casos, pintorescamente modestos; para ser sinceros, eran tan pequeños que apenas se sabía qué mirar.</p>

<p>Si había algo verdaderamente espléndido, era la vista sin obstáculos desde la terraza o ese pequeño jardín de la puesta de sol sobre el mar. Incluso Alondra, que salía disparada para explicar cosas en nombre del dueño cada vez que Cárcel necesitaba guiar o describir algo, se deshacía en elogios hacia esa vista hasta que se le secaba la boca.</p>

<p>Pero hoy, el horizonte estaba cubierto por una espesa niebla marina. El único elogio posible era imposible de pronunciar.</p>

<p>—No hay ningún problema con su estancia, señora. Con la señora ausente, los esfuerzos de esta anciana son inútiles... ¿Por qué no desechar simplemente todo lo que no le guste? Excepto, por supuesto, a nuestro Capitán.</p>

<p>Mientras Alondra hablaba con una sonrisa afable, Inés le devolvió una sonrisa algo incómoda y murmuró.</p>

<p>—Aunque sea su esposa, no me gusta deshacerme de las pertenencias de otra persona sin permiso...</p>

<p>—Las pertenencias del marido son las pertenencias de la esposa, ¿no? Puede deshacerse de cualquier cosa que le guste. Ah, esta es la habitación donde antes estaba la querida mesa de billar del Capitán. La mesa de cartas y la mesa de ajedrez están junto a la ventana.</p>

<p>La mesa de billar, que normalmente debería estar sola en el centro, tenía un lado pegado a la pared. La mesa de ajedrez también tenía dos lados contra la pared, lo que la convertía en una posición incómoda en la que dos personas nunca podrían sentarse una frente a otra. Solo había sobrevivido la mesa de cartas, pero apenas se podía manejar con solo dos sillas apretujadas.</p>

<p>A menos que se quisiera jugar contra la pared o contra un fantasma...</p>

<p>—Dada su naturaleza inherentemente franca y recta, rara vez trae a sus colegas a la residencia. Por lo tanto, esta habitación rara vez se comparte con otros, sino que sirve como un lugar para la reflexión solitaria cuando surgen pensamientos turbulentos...</p>

<p>—Entonces, el Capitán Escalante suele pasar su tiempo aquí solo.</p>

<p>Aunque Alondra intentó reformular la necesidad de esta habitación, que de alguna manera había perdido su propósito original, la única y cuidadosa frase de Inés redujo a Cárcel a un inadaptado social, encerrado solo en una habitación extraña, mirando la pared y disfrutando de los juegos.</p>

<p>Cárcel renunció a las excusas, se presionó con fuerza las sienes y la llevó a otra habitación.</p>

<p>Y, en el instante en que se abrió la puerta, la imagen que se encontró ante sus ojos lo dejó momentáneamente sin habla. Cárcel finalmente logró hablar.</p>

<p>—... Esta es nuestra habitación.</p>

<p>—...</p>

<p>Quizás, tal vez fuera eso... Incluso le costó mucho evitar añadir calificativos tan inciertos.</p>

<p>La enorme cama de Cárcel, transportada directamente desde la lujosa mansión situada detrás del tribunal militar, llenaba el dormitorio matrimonial hasta rebosar, haciendo gala de una presencia colosal.</p>

<p>Era una habitación aún más grandiosa que la cámara nupcial donde habían consumado su matrimonio. No parecía haber espacio para ningún otro mueble grande; apenas cabían un tocador para Inés, un modesto escritorio junto a la ventana, un sofá estrecho y alargado para las siestas y lo que debía de ser la mesa más pequeña de la mansión, junto con dos sillas... todo ello apretujado en el espacio restante.</p>

<p>Lo único que merecía la pena ver era la larga ventana sobre el sofá y el balcón igualmente largo junto a él, que se abría a través de una puerta para ofrecer una vista panorámica del mar azul bajo la ladera escarpada y acantilada y el tranquilo jardín.</p>

<p>El desajuste entre el tamaño de la habitación y la escala de los muebles resultaba bastante cómico, pero la escena en sí parecía bastante plausible, ya que Inés, tras salir al balcón, tardó bastante en volver a la habitación. Como si por fin se hubiera presentado una oportunidad momentánea, Cárcel, a sus espaldas, reprendió en silencio a la leal ama de llaves con la mirada, gesticulando afanosamente con su prominente barbilla. La leal pero no especialmente respetuosa anciana ama de llaves protestó con el ceño fruncido, gesticulando sobre varias cosas.</p>

<p>Era la injusticia de verse obligada de repente a mudarse a una casa estrecha elegida de la noche a la mañana, con todas sus pertenencias, y tener que arreglárselas sola.</p>

<p>Era una conversación sin un solo sonido ni respuesta. En ese momento, Inés se dio la vuelta y volvió al dormitorio. Cárcel y Alondra se quedaron en silencio como si fuera una señal.</p>

<p>—¿Y qué pasa con mi dormitorio?</p>

<p>Preguntó Inés, no tanto porque hubiera declarado originalmente que tendría un dormitorio separado, sino más bien como si simplemente no pudiera creer que dos personas pudieran compartir esa estrecha habitación.</p>

<p>Cárcel creyó comprender entonces la situación en la residencia del Comandante. Nunca habían considerado la opción de dormitorios separados, pero este arreglo parecía un compromiso forzado debido a la falta de espacio.</p>

<p>—¿Me llevas allá?</p>

<p>Al ver que nadie se atrevía a responder, se dirigió rápidamente hacia la otra puerta que veía. Al abrirla, descubrió un vestidor que ya estaba más que lleno con la ropa de Cárcel.</p>

<p>—... Ese es nuestro vestidor.</p>

<p>Tras confirmar su contenido al abrir la puerta, Cárcel añadió a regañadientes una explicación innecesaria. Inés ladeó la cabeza.</p>

<p>—Este es tuyo, Cárcel. No es muy práctico meter mis cosas aquí también...</p>

<p>—No, el vestidor contiguo al dormitorio principal pertenece exclusivamente a la señora. ¿Qué señor se atrevería a ser tan insolente como para colocar su ropa junto a la de su esposa en el dormitorio? Yo las tiraría inmediatamente.</p>

<p>—No pasa nada, Alondra. No tengo tanta ropa. Puedo compartirlo con él.</p>

<p>—... ¿Por qué demonios iba a tirarlas?</p>

<p><span style="font-style:italic">Y después de meterlas ella misma allí...</span> Cárcel miró a Alondra, murmurando desconcertado. Sin embargo, su sirvienta parecía totalmente indiferente, sacando varias prendas de Cárcel de las perchas como si estuviera lista para desecharlas. Cuando Inés intervino de nuevo, ella reanudó sus apresurados movimientos.</p>

<p>Exagerando un poco, Alondra, que apenas llegaba a la mitad de la altura de Cárcel y presumía de una figura regordeta solo por los costados, esquivaba con destreza los muebles que ella misma había ordenado colocar, con expresión ceñuda y distraída. Inés, por su parte, paseaba tranquilamente por el espacio sin evitarla especialmente... Solo Cárcel seguía chocando con cosas a diestro y siniestro.</p>

<p>Pateó distraídamente el reposabrazos de una silla, con una expresión que no era tanto de dolor como de irritación repetida. Solo entonces se dio cuenta de que Inés se había vuelto para mirarlo con los ojos muy abiertos y sorprendidos, y se echó a reír. Justo cuando ella estaba a punto de preguntarle si estaba bien, Alondra hizo un gesto con la mano como si no fuera nada que le concerniera y luego llamó a Inés en otra dirección.</p>

<p>—Señora, por aquí se llega directamente al estudio del Capitán.</p>

<p>—Ah, ¿por aquí? ¿Puedo usar también tu estudio, Cárcel?</p>

<p>—Por supues...</p>

<p>—... Aunque no sé si en Mendoza o Esposa, pero creo que esta anciana apenas y ha visto leer al Capitán, ya ve. De hecho, creo que acabará convirtiéndose en el estudio de la señora.</p>

<p>La rapidez mental es algo bueno. Retenerla y expresar esto y aquello tampoco estaba mal. Su ama de llaves actuaba como si la nueva señora pudiera huir, o más bien, como cualquier madre soltera que teme que la esposa de su hijo pueda huir al descubrir que la casa es más pobre de lo esperado... La intención... Bueno, está muy bien...</p>

<p>—Aun así, seguro que de vez en cuando...</p>

<p>—En absoluto. Sinceramente, no es solo que no lo haya visto leer mucho, es que nunca le he visto leer ni un solo libro.</p>

<p>—No, yo he leído algunos libros...</p>

<p>—En absoluto. Solo lo dice porque la señora está aquí. Las estanterías están siempre cubiertas de telarañas. Simplemente nunca los usa, eso es todo.</p>

<p>¿No es suficiente con que no haya huido? Su ama de llaves solo estaba obsesionada con bloquear la vía de escape de Inés. Las palabras de la ama de llaves no significaban más que: “Tu marido es extraño, pero la casa en la que vives no lo es tanto, así que quédate tranquila”.</p>

<p>Hasta ahora, Cárcel Escalante había sido en esta mansión un inadaptado social que apostaba con las paredes, jugaba a las cartas y al ajedrez en solitario, no tenía amigos y era analfabeto.</p>

<p>Cárcel le hizo una señal a Alondra para que se detuviera. Uno podría preguntarse cómo demonios lo entendió, pero ella asintió con confianza y una sonrisa tranquilizadora. Las señales no eran prometedoras.</p>

<p>—El hecho de que se llame estudio no significa que sea solo para leer libros. Podría atender asuntos oficiales allí si tiene algún... asunto que atender...</p>

<p>—¿Asuntos oficiales? ¡¿Qué asuntos oficiales podría tener en el estudio...?! ¡Las plumillas están prácticamente secas y desmoronándose!</p>

<p>—...</p>
	
<p>Cárcel suspiró al ver que la conversación fluía exactamente como había previsto.</p>

<p>—Insiste en terminar todo el trabajo dentro del cuartel, pase lo que pase. Dice que prefiere morir antes que hacerlo en casa.</p>

<p>—Ah, ya veo.</p>

<p>Inés asintió, pareciendo convencida. No era del todo incorrecto, pero era realmente una obstinación.</p>

<p>—Y el orgullo de este estudio, como ve, es esta ventana... La mitad de la vista es del mar, y la otra mitad... sí, mira allí. Puede ver las residencias de los oficiales navales en la colina Logorño que se extienden abajo, ¿verdad? Solo hay que mirar esos encantadores tejados rojos. Es un placer exclusivo de este estudio.</p>

<p>De alguna manera, su ama de llaves, que llevaba viviendo allí cinco días, parecía más interesada en vender la casa que el propio Comandante Elba mismo. Qué desesperación.</p>

<p>—La puesta de sol es espléndida desde el dormitorio, pero desde el estudio se puede ver así, y allí se puede tomar el sol mientras se lee. Las estanterías no deben exponerse a la luz del sol, por lo que están colocadas así para evitarlo...</p>

<p>Parecía como si estuviera a punto de añadir: “Así que, por favor, no se vaya”.</p>

<p>Como cualquier anciana devota de Ortega, Alondra, llevada al castillo de Esposa tres años antes para supervisar la residencia Calstera como ama de llaves, poseía un carácter extremadamente conservador. Era una anciana aferrada a una creencia doctrinaria y anticuada: que si uno nacía con las extremidades intactas y en buen estado de salud, debía casarse cuando llegara el momento según la voluntad de Dios y luego tener hijos en abundancia, uno tras otro, como Dios había dispuesto.</p>

<p>Para ella, la extravagancia totalmente imprudente del señor —un señor tan perfectamente formado que parecía que el mismo Dios hubiera esculpido cada músculo, cada extremidad y cada articulación con extrema precisión— era la causa misma de sus profundos suspiros cada vez que la presenciaba.</p>

<p>Cada vez que se encontraba cara a cara con su señor, cada vez que él parecía estar siquiera ligeramente ocioso, Alondra le preguntaba: “¿Qué rayos hace, con una prometida esperándolo?”, “¿Por qué no se ha casado, aunque hace tiempo que pasó la edad adecuada?”, “¿Por qué sigue haciendo esas locuras?”, “¿Quién rayos son esas mujeres extrañas que se reúnen detrás de la sede?”, “¿Qué rayos le pasa?”, “¿Por qué paga con ingratitud la gracia de Dios cuando él lo ha bendecido con un rostro tan hermoso?”, “¿Por qué se escapó otra vez de la capilla hoy?”, “¿Por qué rayos vive así?”, etcétera. Su tono era cauteloso, pero su vocabulario era incomparable en su dureza.</p>

<p>Si el tiempo lo hubiera permitido, su ama de llaves seguramente habría dedicado más tiempo a aconsejar a su amo que a dar órdenes a los sirvientes.</p>

<p>Sus hermanas, sus hermanos, sus padres, su difunto marido, y hasta sus hijos y nietos, llevaban mucho tiempo al servicio de la familia Escalante. Su lealtad familiar era irreprochable, e incluso en una cultura como la de Ortega, la anciana de pelo blanco inspiraba respeto independientemente de su rango, y para padre de Cárcel, Alondra no era alguien con quien se pudiera jugar.</p>

<p>Por eso, al oír las palabras “Capitán... si deja que un rostro tan sagrado se pudra así, se convertirá en el rostro de Satanás…” pronunciadas ante su propia cara, no pudo sino reírse. Todo ello mientras soportaba una serie de comentarios molestos que le decían que se guardara esa risa para su prometida.</p>

<p>—... El señor no lee libros, pero ha organizado las cosas bastante bien.</p>

<p>Un toque de diversión se coló en la voz de Inés. Por extraño que pareciera, ya no le importaba parecer ridículo ante ese sonido ligeramente divertido.</p>

<p>—No es que nuestro Capitán no lea estas cosas, es solo que no lee nada. De todos modos, este escritorio también será de la señora. Me pregunto si es de su agrado.</p>

<p>—Sí, mucho.</p>

<p>Inés miró alternativamente a él y a Alondra y esbozó una sonrisa razonablemente alegre.</p>

<p>En realidad, no importaba.</p>


<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>


<p>Después de cenar en el pequeño pero acogedor comedor, se sentaron en la terraza de la planta baja, tenuemente iluminada, escuchando el sonido de las olas.</p>

<p>Como todos los rincones de esta mansión, la terraza les parecía demasiado pequeña y agobiante. Sin embargo, el pequeño jardín estaba salpicado de encantadoras lámparas de latón, como farolas, cada una con una pequeña vela encendida que iluminaba las flores blancas de verano que la rodeaban, creando una imagen bastante romántica.</p>

<p>Estas eran algunas de las huellas románticas que el Comandante Elba había creado impulsivamente, llevado por su entusiasmo por su nueva vida en Calstera con su esposa. Quería que ella viera algo hermoso en esta casa incluso en las noches en que el mar quedaba oculto a la vista, que pensara en él cada vez que viera las luces, y había elegido el latón porque a ella le gustaba su color...</p>

<p>Cárcel recordó cómo el Comandante Elba lo agarró —a Cárcel, que nunca había estado cerca de su residencia— y le habló durante horas sobre qué estaba dónde y qué estaba en otro lugar. Cada pieza, afirmaba, había sido hecha por él mismo, o más exactamente, encargada por él a artesanos profesionales.</p>

<p>Cuando Cárcel se mostraba incrédulo, el Comandante Elba volvía a empezar con el mismo repertorio, preguntándole si tenía idea de lo difícil que era concebir tales cosas...</p>

<p>El Comandante era un hombre completamente diferente al que Cárcel había conocido en la academia. El hombre que, tras acabar de alguna manera en Mendoza, había pasado quince días viviendo con su esposa para luego volver y pasar otros quince días quejándose de ella, ahora recomendaba dónde ir en aquella pequeña casa, hablaba de cómo les gustaba pasar el tiempo en la mansión y dónde preferían estar... Era un espectáculo digno de ver, pero él parecía feliz.</p>

<p>Y las luces del jardín eran bastante espléndidas, más de lo que cabría esperar.</p>

<p>Cárcel imaginó brevemente la escena de él haciendo todo eso por Inés. No era muy diferente a imaginarse a sí mismo enfermo y feo algún día, o cayendo en desgracia durante el torneo de justas de la fiesta de Santa Inés, donde se reunían todos los nobles. Sin embargo, al imaginarlo, no le pareció tan repulsivo.</p>

<p>La apariencia repulsiva del Comandante Elba parecía provenir de sus rasgos algo repulsivos y de su carácter generalmente repulsivo, por lo que Cárcel dejó que sus pensamientos se alejaran de él.</p>

<p>Dejó de lado todos esos detalles poco halagadores sobre cómo el Comandante Elba había esbozado esa lámpara de latón con sus manos pequeñas y femeninas, y cómo había dado instrucciones a los trabajadores... toda la historia poco atractiva de esa lámpara.</p>

<p>Ese lugar era ahora su pequeño hogar.</p>

<p>—... ¿Cómo es posible que mi permiso solo dure hasta mañana?</p>

<p>—¿Decepcionado?</p>

<p>Al enterarse durante la cena de que su fecha de regreso era mañana, aparentemente le había parecido de nuevo completamente absurdo. Inés se rió ante la réplica de Cárcel, con una expresión que decía que lo encontraba bastante comprensible.</p>

<p>El rostro que había estado sonriendo tan virtuosamente delante de Alondra y los sirvientes, haciendo que uno se preguntara por qué actuaba así, desapareció como por arte de magia en el momento en que se quedaron solos.</p>

<p>Aun así, lucía un rostro notablemente gentil e inexpresivo. Tenía los labios apretados en una línea recta, pero las comisuras estaban ligeramente relajadas. Sus ojos verde oscuro, como una tarde sin puesta de sol que se posaba sobre un mar oscuro donde se oía el sonido de las olas, miraban con calma.</p>

<p>Hizo girar distraídamente una copa de vino llena de agua en la palma de la mano y murmuró.</p>

<p>—Estoy asombrada y desconcertada por tu absoluta falta de previsión.</p>

<p>—Tenía otros asuntos que atender.</p>

<p>—...¿Te refieres al asunto que ocurrió cuando te quedaban solo dos semanas, incluso después de haber alargado tus vacaciones al máximo?</p>

<p>—Había que terminar lo de la boda en solo quince días...</p>

<p>—Lo único que hiciste fue aparecer en la capilla, luego ir a la casa Valeztena, pasar la noche y luego marcharte.</p>

<p>—...</p>

<p>—Yo terminé la boda.</p>

<p>—... Y el momento fue perfecto. De todos modos, ya estás aquí... no parece que haya ningún problema real.</p>

<p>Cárcel replicó con total descaro. Inés se rió suavemente y bebió un sorbo de agua.</p>

<p>—Me alegro de que todo se haya resuelto sin complicaciones. No soporto las cosas largas y tediosas.</p>

<p>—Mi madre dijo que la había hecho resentirse conmigo por el resto de su vida. “¿Cómo pudiste hacerla soportar su único matrimonio de esa manera?”</p>

<p>—Si hubiéramos tenido tiempo suficiente, probablemente habría tenido que ayunar durante sesenta días por orden de la Duquesa Valeztena.</p>

<p>—... Una persona muere tras sesenta días sin comer.</p>

<p>Él frunció el ceño como si hubiera oído algo que no debía. Inés soltó una carcajada, como si hubiera oído un chiste.</p>

<p>—Creo que podría aguantar cien días, en realidad.</p>
	
<p>—¿Tú?</p>

<p>—Hace mucho tiempo soporté algo bastante similar.</p>

<p>Cárcel la miró con desdén, como si estuviera observando un puñado de arena recogido de un vasto desierto.</p>

<p>—No aguantarías ni quince días, Inés.</p>

<p>—¿Cómo puedes estar tan seguro?</p>

<p>—Mira tu cuerpo. Esa complexión flácida que tienes... ¿Cómo diablos podría...?</p>

<p>Chasqueó la lengua. Inés frunció ligeramente el ceño. Incluso eso parecía ridículo.</p>

<p>—¿Flácida? Ahora estoy perfectamente sana. Es cierto que no comí bien durante unos diez días mientras me apresuraba para caber en el vestido de mi madre, pero al final, el vestido se modificó para adaptarse a mi cuer...</p>

<p>—¿Te mataste de hambre durante diez días?</p>

<p>Preguntó Cárcel horrorizado, sin parecer escuchar el resto de la frase de Inés.</p>

<p>—Para las mujeres Ortega, pasar hambre no significa estar sin una sola gota de agua.</p>

<p>—Entonces...</p>

<p>—De vez en cuando comen lo justo para no morir.</p>

<p>—Eso suena aún más espantoso.</p>

<p>—La mayoría de esas figuras espléndidamente esbeltas que lucen las mujeres que has conocido probablemente se hayan conseguido mediante este espantoso método.</p>

<p>—... ¿Cómo es que de repente la conversación cambió a este rumbo?</p>

<p>—Has visto más cuerpos de mujeres que yo, ¿no? Solo lo comento.</p>

<p>Sin preocuparse por su incomodidad, ella se encogió de hombros con indiferencia.</p>

<p>—Animan a las mujeres a estar delgadas, pero les prohíben hacer cualquier actividad física. Esa es otra forma de decirles que no se metan comida en la boca.</p>

<p>—Esa es una completa estupidez.</p>

<p>Su tono era tan tajante y decisivo que Inés se rió suavemente.</p>

<p>—No estoy diciendo que yo viva así.</p>

<p>—Lo que elijas hacer es asunto tuyo, pero si me permites dar mi opinión, eres perfecta tal y como eres.</p>

<p>Habló sin pensar, con evidente sinceridad. Al darse cuenta de lo que había dicho, se sonrojó, como si su ansiedad por la más mínima protuberancia de su cuerpo hubiera quedado al descubierto. Si se trataba de una impresión, sólo podía referirse a la figura de la noche anterior. Justo cuando deseaba poder rebobinar el tiempo, pensando que incluso su elección de palabras había sido errónea, ella se rió.</p>

<p>—Pues bien. No tengo intención de intentarlo.</p>

<p>Ya no había necesidad de retroceder en el tiempo. Sintió alivio y autocrítica al mismo tiempo.</p>

<p>Ese era precisamente el tipo de comportamiento patético. El tipo de comportamiento del que el Comandante Elba se había jactado delante de él... Pero Inés, sentada allí delante de él con su cintura de avispa. Inés, que vivía como un alma torturada, sin comer nada solo por su figura...</p>

<p>Inés era Inés precisamente porque no era así. Ya fuera por su mal genio, por ser un poco pesada o por gobernar a los demás con mano de hierro... era una persona egocéntrica y, por lo tanto, alguien que no se gobernaba a sí misma. Una mujer que no se ajustaba a las expectativas de los demás, vivía como le placía, se negaba a hacer cosas que no quería hacer y dejaba que las palabras desagradables le entraran por un oído y le salieran por el otro.</p>

<p>—Por supuesto, me gustaría que recuperaras el peso que perdiste en esos diez días. Estarías mejor si engordaras un poco más.</p>

<p>—Yo misma me encargaré de eso. Cárcel.</p>

<p>Sí, estaba bien hablar así, como si su opinión no importara lo más mínimo. Aunque “bien” aquí no era exactamente eso... Cárcel intentó racionalizarlo por sí mismo, patéticamente.</p>

<p>Por suerte, la mirada de Inés volvió a posarse en el mar más allá del jardín. Su expresión debía de haber sido completamente idiota.</p>

<p>Los ojos de Inés, que habían estado fijos en el mar lejano, en la luz roja que ahora se desvanecía rápidamente tras la bruma marina, volvieron de repente hacia él.</p>

<p>—Es un alivio que este lugar no sea como lo imaginaba.</p>

<p>—¿Cómo lo imaginabas?</p>

<p>—Me imaginaba algo más parecido a un puerto. Ajetreado y ruidoso, o lleno de pequeños barcos de pesca amarrados...</p>

<p>Él observó su expresión, tenuemente iluminada por la luz parpadeante, como si intentara calibrarla.</p>

<p>—Bueno, esta es una zona militar donde está prohibida la pesca... Un poco más abajo, en la costa, hay un puerto famoso que todo el mundo conoce. La mayoría de la gente de Mendoza lo llama puerto Calstera, pero los lugareños lo conocen como puerto El Tabeo.</p>

<p>—¿El Tabeo?</p>

<p>—En realidad, ese es el puerto principal. Los barcos mercantes extranjeros van y vienen allí, y los barcos pesqueros más grandes se dirigen directamente a él debido a la lonja que hay al sur de El Tabeo. De esa manera, la captura se puede vender directamente a las ciudades del interior. Y más abajo, como has mencionado, hay varios puertos menores por donde van y vienen barcos pesqueros más pequeños... Están un poco más lejos de aquí. La mayoría son pequeños pero bonitos, tan ruidosos como las sirenas de los barcos como El Tabeo, aunque el olor a pescado puede ser un poco más fuerte. Si quieres visitarlos la próxima vez... Ah, ¿no dijiste que no te gustaban esos lugares?</p>

<p>—No, no es que no me gusten. Es solo que... prefiero este lugar porque es más tranquilo.</p>
	
<p>Inés se encogió de hombros y se levantó, aún con la copa en la mano. Cárcel se apresuró a levantarse para ayudarla, pero ella se rió, ligeramente sorprendida, y apartó su mano.</p>

<p>—Esto no es alcohol.</p>

<p>—Lo sé.</p>

<p>Él insistió y le pasó el brazo por debajo del hombro. Ella murmuró en voz baja.</p>

<p>—Si me quedo dormida aquí, tendrás que llevándome en brazos, ¿sabes?</p>

<p>—Si es necesario…</p>

<p>—No.</p>

<p>—Lo sé.</p>

<p>Cárcel respondió con indiferencia, como si lo esperara.</p>

<p>Escoltada por este apoyo innecesario que rayaba en la asistencia, Inés se dirigió al pasillo que conectaba el comedor del primer piso con la sala de fumadores.</p>

<p>En lugar de cuestionar este destino inesperado, Cárcel esperó en silencio mientras ella se detenía ante un cuadro concreto y lo contemplaba sin decir nada durante un rato.</p>

<p>—Cárcel. ¿Esto también es El Tabeo?</p>

<p>—¿Esto?</p>

<p>Tras limitarse a esperarla, Cárcel, que ni siquiera había echado un vistazo al cuadro ya medio devorado por la oscuridad, finalmente fijó su mirada en él.</p>

<p>Representaba un puerto que le resultaba familiar de alguna manera.</p>

<p>—El Tabeo es el puerto principal de Calstera. Este es uno de esos puertos más pequeños que mencioné antes...</p>

<p>Cárcel buscó en silencio en su memoria. Él también había visitado el lugar un par de veces en misiones. ¿Había allí amarrados incluso treinta barcos pesqueros, como pequeños botes?</p>

<p>—... ¿Sevilla?</p>

<p>Mientras pescaba el nombre de su vago recuerdo, Inés repitió en voz baja el nombre del lugar. <span style="font-style:italic">Sevilla... </span>Ese nombre pronunciado en voz baja de alguna manera desvió su mirada del cuadro hacia ella.</p>

<p>—...Así que llaman a este lugar Sevilla.</p>

<p>La expresión de Inés permaneció impasible. Sin definir en ella.</p>

<p>Algo parecido a una emoción, o tal vez a disgusto, cosas completamente contradictorias.</p>

<p>—¿Te gusta este cuadro? ¿Lo cuelgo en tu estudio?</p>

<p>—¿El estudio ya es completamente mío?</p>

<p>—Sí. Al fin y al cabo, soy un soldado ignorante.</p>

<p>Inés sonrió en silencio. Luego negó lentamente con la cabeza.</p>

<p>—No. No me gusta este cuadro.</p>

<p>—...</p>

<p>—Deshazte de él. Asegúrate de que no lo vuelva a ver nunca más. Eso es lo que quería decir.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>En su semisueño, sintió un brazo firme que la arrastraba por la cintura. Incluso en su estado inconsciente, era una fuerza que despertaba en ella una inexplicable rebeldía.</p>

<p>Inés frunció ligeramente los ojos cerrados y giró su cuerpo atrapado hacia fuera. Entonces, el brazo que la había estado sujetando con cierta holgura la tiró hacia atrás con una fuerza obstinada.</p>

<p>El agarre alrededor de su cintura parecía menos un brazo humano y más la raíz de un árbol. Una fuerza que la dejaba completamente inmóvil, una fuerza que parecía inhumana...</p>

<p>Ni esta atadura ni esta fuerza le resultaban familiares. Inés frunció aún más el ceño y se esforzó con todas sus fuerzas, pero ahora estaba tan completamente envuelta en algún lugar que incluso sus intentos eran invisibles a simple vista.</p>

<p><span style="font-style:italic">Es asfixiante...</span> Pareció pronunciar esas palabras como si la empujaran. Ante esa única frase, la fuerza que le agarraba la cintura se relajó de repente, solo para que otro brazo surgiera como una enredadera desde debajo de su cintura, agarrándola justo debajo de los pechos y tirando de ella hacia atrás.</p>

<p>El brazo que solo le había sujetado la cintura ahora se deslizó por su abdomen inferior, balanceándose precariamente en el borde. Como si una sola raíz se hubiera dividido en dos. Entre los brazos, la presión se debilitó visiblemente, pero seguía siendo igualmente imposible para ella escapar de entre ellos con meros forcejeos a medio dormir.</p>

<p>Inés frunció profundamente el ceño, como si estuviera completamente disgustada, y finalmente pareció rendirse, dejando que su cuerpo se desplomara sin fuerzas. Una risita baja y satisfecha le hizo cosquillas en la coronilla. Frunció un poco más el ceño y pronto volvió a caer en un sueño profundo.</p>

<p>Así que no había forma de que se diera cuenta de que el camisón se le había subido hasta justo debajo del trasero, ni de que el tirante se le había deslizado hacia abajo, dejando al descubierto completamente su hombro. Tampoco notó los suaves labios que le recorrían los omóplatos, chupando como para dejar una marca en su delicada piel, mordiéndola suavemente de vez en cuando. Tampoco notó las grandes manos que le acariciaban los muslos, ni el toque bastante siniestro que la sostenía por debajo de los pechos, amasándolos...</p>

<p>El cansancio acumulado era demasiado grande como para que se diera cuenta de nada. Las dos semanas que había soportado a manos de su madre y, más recientemente, desde la misa de la boda anteayer hasta la noche de bodas, en la que no había dormido ni un momento...</p>

<p>Además, habían emprendido un viaje bastante largo esa mañana temprano, sin ni un momento de respiro. Es cierto que había pasado la mayor parte del tiempo inconsciente, con la cabeza hundida en el regazo de Cárcel, o medio despierta, sufriendo un leve mareo, pero aún así había sido un viaje de siete horas. Para un cuerpo en su estado, debía de haber sido bastante agotador.</p>

<p>Dado que no recordaba haber caminado hasta la cama por sí misma, ni haberse acostado en ningún sitio...</p>

<p>Inés se encontró abriendo los ojos sin expresión, parpadeando débilmente varias veces. A través de su visión borrosa, la habitación, que se iluminaba gradualmente, se enfocó. Su mente aún parecía medio sumergida en un sueño profundo.</p>

<p>Realmente no podía recordar nada. Mirando fijamente las cortinas que se balanceaban, buscó su último recuerdo.</p>

<p>Recordaba estar sentada junto a esa ventana. Las lujosas atenciones de Cárcel eran embarazosas y agotadoras, y las relaciones maritales que él parecía exigir con más frecuencia de lo que ella había previsto, estaban completamente fuera de su capacidad para soportarlas de inmediato, así que se había sentado allí, abriendo obedientemente la Biblia, interrumpiéndolo antes de que pudiera decir una palabra.</p>

<p>La noche siguiente a su noche de bodas, había abierto la Biblia en el dormitorio, no porque su fe fuera tan devota, sino porque necesitaba algún tipo de escudo para bloquear la atmósfera que se deslizaba naturalmente hacia la lascivia. Un escudo sagrado, por decir...</p>

<p>Por muy indiferente que se mostrara Inés, cada vez que recuperaba el sentido, era una noche en la que él, naturalmente, le hacía insinuaciones. Lo hacía con una expresión y un tono tan indiferentes como los de ella. Su rostro era completamente impasible, pero el ambiente cambiaba con total naturalidad.</p>

<p>Como si quisiera elevar injustamente su reputación de mujeriego... Cárcel, a pesar de ser un mujeriego notorio, era un hombre que ni siquiera provocaba el resentimiento adecuado de las mujeres.</p>

<p>Tenía el rostro de un soldado ascético, aparentemente desprovisto de astucia, pero no se le atribuía ni un solo rumor desagradable porque llevaba a cabo sus malas acciones con ese mismo rostro, como si no fuera nada. Probablemente... Inés formuló una hipótesis incierta, recordando una vez más los rasgos peligrosos de Cárcel.</p>

<p>Había tenido pensamientos similares mientras leía las escrituras, y luego parecía haberse desmayado allí mismo, sentada... Cuando el pensamiento que había surgido justo antes de dormir volvió sin cambios, el cansancio del día anterior la abrumó, sin alivio.</p>

<p><span style="font-style:italic">¿...Esto… no es a lo que llaman luna de miel, cierto…?</span> Inés primero volvió sobre la causa como si se tratara del asunto de otra persona. Él parecía demasiado entretenido con ella como para sentir hambre y era poco probable que sintiera ninguna emoción particular por su sencilla esposa y, sin embargo, a pesar de que su propia actitud era como era... El sentido del deber de Cárcel era sospechosamente excesivo. En verdad, era mucho más sospechoso de lo que ella había imaginado. Excesivamente enérgico, desordenado pero fiel al mismo tiempo...</p>

<p><span style="font-style:italic">Bueno, supongo que es la fase de luna de miel. </span>Se obligó a aceptar una vez más la poco convincente explicación. Sea lo que sea lo que uno emprenda, es natural esforzarse por hacerlo bien al principio.</p>

<p>Al igual que Inés había ideado sin cesar nuevos planes para romper este matrimonio desde la misma ceremonia nupcial, él también intentaba llevar esta unión no deseada de la forma más fluida posible.</p>

<p>No sabía cuánto tiempo podría traicionar a ese yo que buscaba constantemente nuevas mujeres... Pero, al igual que el principio y el final de una tarea no pueden ser iguales, tampoco pueden serlo el principio y el medio. Si el amor se desvanece, ¿qué pasa con el sentido del deber o el entusiasmo que nunca existieron en primer lugar? Esto solo era temporal.</p>

<p>Inés sintió algo presionando con fuerza contra su espalda, algo incómodo pero que aceptaba con calma, mientras dirigía la mirada hacia la ventana. Al fin y al cabo, se trataba simplemente de la respuesta fisiológica natural de un hombre, que se producía independientemente de si había una mujer presente o incluso de si él era consciente de ello. No veía la necesidad de darle ningún significado especial.</p>

<p>Aparte de la incomodidad de que esa respuesta fisiológica se transmitiera directamente a su espalda, no había nada particularmente sorprendente en ello. Cárcel Escalante estaba en una edad en la que el deseo era intenso y la cabeza de los hombres a menudo se movía en la parte inferior de su cuerpo, o tal vez se quedaba allí mismo... Miró la gran mano que se deslizaba desde su muslo hacia la parte inferior de su abdomen, asomándose por encima de la colcha.</p>

<p><span style="font-style:italic">Sonámbulo, ¿eh?</span></p>

<p>Sintió que el camisón, que apenas cubría su ropa interior, seguía a esa mano y subía hasta su estómago. Sus caderas, sin nada que ocultar salvo su ropa interior, se acercaban con intención amenazante, como si estuvieran listas para sumergirse en ella en cualquier momento.</p>

<p>Era un deseo crudo y sin adornos, ya fuera fruto de un sueño desordenado o simplemente de la costumbre. Detrás de su cabeza, la respiración constante de Cárcel continuaba.</p>

<p>Estaba claramente dormido, sin dejarle ningún recurso. La fuerza abrumadora de la que no podía escapar permanecía inalterable.</p>

<p><span style="font-style:italic">... Aún es temprano, así que no hay necesidad de despertarlo.</span></p>

<p>Con un suspiro silencioso, volvió a mirar por la ventana.</p>

<p>Por encima de la ventana de color verde intenso abierta al exterior, la luz del sol, ya más alta en el cielo, fluía como un cuadro. El aire ligeramente fresco propio de la mañana, la brisa refrescante, las cortinas ondeando y meciéndose, el sonido de las olas rompiendo suavemente contra los acantilados...</p>

<p>De repente, Inés recordó un cuadro de Sevilla. <span style="font-style:italic">Sevilla...</span> Solo había estado allí tres días, pero era un lugar precioso. Se quedó mirando fijamente, recordando la escena del cuadro, un detalle tras otro. Las pequeñas barcas de pesca balanceándose sobre las olas, los viejos pescadores, las mujeres de mediana edad que llevaban pescado desde el puerto... y entre ellos, él. Emiliano sonriéndole, con el bebé en brazos.</p>

<p>Era el lugar que había perseguido a Inés, de seis años, como una pesadilla, el lugar que le había hecho odiar la creciente juventud de Luciano durante años, y el lugar que nunca había abandonado su memoria ni un solo día desde los dieciséis años, cuando conoció a Emiliano, hasta su muerte a los veinte.</p>

<p>Era casi un alivio que Cárcel, de diecisiete años, hubiera encontrado molesto su matrimonio y se hubiera marchado a la academia militar. Sin duda, ella no habría podido hacer nada según lo planeado en aquel entonces.</p>

<p>Era absurdo que hasta ayer ni siquiera supiera el nombre de ese lugar. En ese entonces, Inés había estado atrapada en ese puerto, como alguien que espera solo en un lugar de encuentro al que nunca llega nadie.</p>

<p>Hasta el día en que Emiliano murió, hasta ese aire, hasta esa mañana y esa noche, vivió prisionera, incapaz de escapar a ningún lugar ni a ningún momento. Cuando abría los ojos, era esa mañana; cuando los cerraba, llegaba esa noche en lugar del sueño.</p>

<p>La noche en que el cuerpo frío y sin vida de Emiliano se le escapó de las manos y le arrebataron a su hijo.</p>

<p>La noche descendía como una pesadilla, solo para retroceder al amanecer. Incluso cuando apenas podía respirar, aquella mañana se repetía. Mañanas sabiendo que llegaría la terrible noche. Mañanas sabiendo que Emiliano volvería a morir esa noche... Así, Inés dejó escapar aquellos cuatro años con Emiliano, silenciosamente destrozada una vez más. Los recuerdos que había apartado en su juventud, desprovistos de realismo, ahora regresaban con brutal claridad para atormentarla. Temía incluso el más mínimo roce de los dedos de Emiliano. Temía volver a matarlo de verdad...</p>

<p>Sin embargo, ahora escuchaba el sonido de las olas sin el más mínimo temblor.</p>

<p>Con el mar ante ella, no soñaba ni con Sevilla ni con Emiliano. Simplemente se despertaba y pensaba en él. Estando en los brazos de otro hombre, no en los de Emiliano... Una extraña culpa hacia Emiliano brotó en ella, pero al final se encontró observándolo todo con un aburrido desapego, como si nada de eso fuera realmente su propia vida.</p>

<p>Inés recordó, inexpresiva, los dibujos del tamaño de la palma de la mano que Emiliano le había hecho ocasionalmente con carbón barato.</p>

<p>Al recordar algunas cosas agradables, pronto se sintió completamente despierta. Después de todo, en esta vida, eso nunca había existido realmente.</p>

<p>Miró por la ventana un poco más y luego se giró en los brazos de Cárcel.</p>

<p>—Cárcel.</p>

<p>—...</p>

<p>—Levántate. Es de mañana.</p>

<p>—Hmm.</p>

<p>—No quiero seguir aquí tumbada.</p>

<p>Se le ocurrió que, dado que se sentía agobiada, ya no le importaba que fuera demasiado temprano para Cárcel. El flujo constante de aire que escapaba de sus labios se dispersó por un momento.</p>

<p>Cárcel abrió lentamente los ojos. En ese mismo instante, Inés entrecerró los ojos.</p>

<p>—... ¿Estabas despierto?</p>

<p>—Ujum.</p>

<p>Respondió con sencillez. No parecía particularmente descarado, ni tampoco insensible; era solo una respuesta objetiva y sin sentido.</p>

<p>Lo que significaba que realmente era descarado. Sin decir nada más, Inés le dio una palmada en el brazo cuando él volvió a atraerla hacia sí. Era porque algo duro se había presionado contra ella una vez más, sobre la ropa interior que apenas cubría su monte de Venus, y ahora estaban cara a cara.</p>

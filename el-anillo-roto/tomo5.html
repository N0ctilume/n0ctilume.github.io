<p>—... No lo haré.</p>

<p>—No he dicho nada, Inés.</p>

<p>—Tu parte inferior está hablando por ti. Ahora mismo.</p>
	
<p>Ella echó las caderas hacia atrás. No era tanto un acto de vergüenza como un gesto nervioso, sabiendo que las grandes manos de Cárcel se apoyaban contra su espalda baja. Como antes, el intento terminó ahí.</p>

<p>—...</p>

<p>—Sabes cómo decir cosas así.</p>

<p>Él se rió, diciéndolo como si elogiara a alguien un poco más joven que él. Atrayéndola más hacia él, su peso presionó toda la parte inferior de su abdomen.</p>

<p>Inés sintió ahora, más que nunca, que era necesaria una expresión más severa. Dormir juntos una noche debía de haberle hecho pensar que era divertido... Frunció el ceño con fuerza.</p>

<p>—No voy a acostarme contigo a estas horas de la mañana. Ni hablar...</p>

<p>—Por supuesto que no.</p>

<p>Sus palabras fueron una respuesta educada, como si dijera: “Por supuesto que no lo harías”, mientras que el peso que presionaba su abdomen era algo arrogante y completamente siniestro.</p>

<p>Inés entrecerró los ojos con recelo y, por encima de ellos, se posó la risa baja de Cárcel.</p>

<p>Él dijo:</p>

<p>—Inés, haz lo que te plazca.</p>

<p>—Siento que ha pasado bastante tiempo desde que pude hacer lo que quisiera.</p>

<p>—No lo haré. En serio, no lo haré.</p>

<p>—Primero punzas algo tan desagradable en el cuerpo de otra persona a primera hora de la mañana, y luego dices que no lo harás...</p>

<p>—Quedémonos así un poco más. No haré nada.</p>

<p>Su voz seguía siendo monótona, pero de alguna manera sonaba dulce, como si estuviera recubierta de azúcar. Tan dulce que le revolvió el estómago. Sus labios descendieron sobre la coronilla de su cabeza.</p>

<p>Esa atmósfera era perjudicial. Un contacto tan íntimo, rozaba lo irrelevante... no era beneficioso en absoluto. Cuando Inés instintivamente intentó alejarse de su abrazo de nuevo, los labios que habían tocado ligeramente su coronilla la presionaron con firmeza.</p>

<p>—Si lo hago, yo mismo me lo cortaré.</p>

<p>Cárcel comentó con ligereza, señalando su parte inferior. Inés hizo una mueca.</p>

<p>—No quiero que lo cortes. ¡Esa cosa...!</p>

<p>—Es una pena.</p>

<p>Murmuró con pesar, como si se hubiera confesado solo para ser rechazado. Ella apartó sus labios bruscamente, como para llamar su atención.</p>

<p>—Solo dices tonterías porque estás medio dormido.</p>

<p>—Me desperté hace rato. Sorprendentemente, podría ser más diligente que tú, ¿no crees?</p>

<p>—Si ya tenías rato despierto, deberías haber desaparecido hace tiempo...</p>

<p>Fiel a su palabra, ahora parecía genuinamente despierto. Bajo su cabello revuelto, su rostro parecía esculpido y apuesto, nada que ver con alguien recién despertado. Incluso ese cabello despeinado parecía meticulosamente planeado, lo que lo hacía aún más irritante.</p>

<p>Él debía de tener un aspecto horrible... Pero cuanto más desaliñado, mejor. Si se emocionaba solo con ver a una mujer a su lado, incluso con ese aspecto, entonces estar más guapa que eso no podía ser malo.</p>

<p>—¿Desaparecido? Eso fue bastante duro.</p>

<p><span style="font-style:italic">Duro, sin duda.</span> Con la única intención de mostrarle algo mucho más duro, Inés empujó sus muslos y espinillas con ambos pies, sin la más mínima vacilación. Ya no era de noche, así que no tenía ninguna obligación de obedecer.</p>

<p>Hasta ahora, había soportado su acoso sexual en silencio, pensando que estaba dormido, pero ahora...</p>

<p>No tenía sentido tolerar a este hombre insignificante. Era como intentar empujar una roca.</p>

<p>Claramente, con tanta fuerza y tenacidad, alguien en un recuerdo lejano habría sido empujado a un lado de forma lamentable. Sin embargo, a diferencia de esa persona, Cárcel parecía sereno a pesar de los movimientos intensamente agresivos de Inés.</p>

<p>Se limitó a mirarla fijamente. Era una diferencia abrumadora en fuerza física.</p>

<p>Cárcel apoyó la cabeza perezosamente contra el cojín y murmuró.</p>

<p>—No quiero levantarme.</p>

<p>—¿Cómo puedes pretender ser soldado siendo tan perezoso?</p>

<p>—Eso no deberías decirlo tú, holgazana.</p>

<p>—... Acabo de mirar el reloj de pared. Ahora no es momento para la pereza.</p>

<p>—¿Y yo?</p>

<p>—Para un soldado, en cuanto abre los ojos, debería saltar de la cama y empezar a pensar en cómo llevar su cuerpo al límite ese día.</p>

<p>Inés aplicó con calma un doble rasero, dando a entender que ambos eran diferentes. Cárcel se rió entre dientes y replicó.</p>

<p>—¿No te dije que me habían trasladado al cuartel general?.</p>

<p>—Es la primera vez que lo oigo.</p>

<p>—Gracias a eso, no estoy trabajando en exceso, apenas sudo.</p>

<p>—Me alegro por ti.</p>

<p>—Ah. Excepto cuando estoy contigo.</p>

<p>Fue un comentario que soltó casualmente en respuesta a su respuesta desalmada.</p>

<p>Como si no fuera más que una sola noche juntos, como si estuviera hablando de su aperitivo habitual... o de su ejercicio diario... <span style="font-style:italic">Qué descarado...</span> Inés murmuró para sí misma como si la persiguieran. Realmente había estado actuando como si hubiera cogido algo malo recientemente.</p>

<p>Era como si hubiera comido algo en mal estado y se hubiera puesto enferma, y luego siguiera metiendo más comida en mal estado en su estómago enfermo, volviéndose a poner enferma, metiendo más comida extraña, hasta que se puso completamente enferma y al borde de la muerte. Ese borde de la muerte significaba su noche de bodas.</p>

<p>A menos que de alguna manera hubiera robado su simpatía, ¿qué razón podría haber para esto? Por supuesto, Cárcel no estaba haciendo un gran alboroto. Aparte de un deseo casi incomprensiblemente ferviente, esta breve y extraña atmósfera, y una consideración excesiva... Cárcel tenía la misma expresión de siempre, como si nada hubiera cambiado en su vida, y le hablaba con una voz que no había cambiado en lo más mínimo.</p>

<p>Su comportamiento era tan natural que resultaba casi hipnótico, haciendo pensar erróneamente: “Quizás simplemente seguimos como siempre”.</p>

<p>A decir verdad, incluso con su novia no deseada, Cárcel  Escalante ya había sido bastante amable, dada su naturaleza típicamente brusca. Bueno... igual que solía ser con otras mujeres... ¿Era su lengua o su temperamento el problema, o era simplemente su miserable parte inferior?</p>

<p>Así que no había necesidad de un cambio drástico de actitud desde el principio. Dada la existencia de lunas de miel más repulsivas e insoportablemente grotescas, esto era bastante positivo. Sin embargo, Inés pensaba que para un hombre como Cárcel hacer tanto alboroto por así era algo solo posible cuando conocía a una mujer por primera vez, al menos siete u ocho años atrás.</p>

<p>Y luego esa consumación forzada y obsesiva...</p>

<p>¿Había sido un error asignarlo al cuartel general? ¿Sin entrenamiento, con exceso de energía y preservando su castidad justo antes del matrimonio como si fuera una mera formalidad?</p>

<p>¿Había conocido a tantas mujeres que había vuelto al punto de partida?</p>

<p>¿Se había vuelto loco?</p>

<p>Inés lo miró con recelo. Su radiante cabello rubio se derramaba sobre la suave seda de la almohada. A la luz oblicua del sol, los mechones brillaban como hilos de oro.</p>

<p>Pintoresco, pero totalmente ridículo. Al menos a los ojos de Inés, que hasta hacía unos momentos habían estado llenos de mezquina obstinación.</p>

<p>Ese era el problema de los impulsivos. De vez en cuando cargaban como caballos de carreras, con anteojeras, impulsados por la obstinación en asuntos totalmente irrelevantes... Como si aprovechara el momento en que él había bajado la guardia y se había desplomado, ella se incorporó bruscamente de donde había estado tumbada inmóvil.</p>

<p>Por supuesto, volvió a ser ella misma en un instante. Las personas impulsivas tendían a obsesionarse con aquello que no podían conseguir, cuanto más fracasaban en lograrlo. No importaba lo pequeño, trivial o insignificante que fuera...</p>

<p>O incluso si se podía conseguir con una sola palabra.</p>

<p>—Inés, si sigues lanzándote así a los hombres, te malinterpretarán.</p>

<p>—...</p>

<p>—¿Y si te malinterpretan y se aprovechan de ti?</p>

<p>Murmuró, rodeándola con un brazo ligero, como si le ofreciera una preocupación genuina. Como si sus cuerpos simplemente hubieran chocado, o ella se hubiera desnudado y hubiera sacado el pecho... Estaba tan atónita que se olvidó del tema principal y preguntó.</p>

<p>— ...¿Aprendiste a sacar conclusiones precipitadas de tu primo?</p>

<p>—No necesito lecciones para eso.</p>

<p>Cárcel respondió, fingiendo modestia. Su mano, que había estado trazando suavemente la curva de su columna vertebral sobre el camisón, se deslizó bajo la tela mientras la subía, acariciando su suave piel desnuda.</p>

<p>Inés se tensó, luego frunció el ceño y lo miró.</p>

<p>—Para.</p>

<p>—Tú fuiste quien dijo que los labios estaban prohibidos...</p>

<p>—¿Y estás aprovechándote de eso?</p>

<p>—Tú fuiste quien me ofreció su ayuda.</p>

<p>Ella recordó lo que implicaba esa “ayuda”. Inés respondió con expresión agria.</p>

<p>—Eso fue algo de esa noche.</p>

<p>—A él no le importa si es de noche o de día.</p>

<p>—Ese es tu problema.</p>

<p>—Pensé que vendrías.</p>

<p>Cárcel la dejó escapar con ligereza, teñido de un ligero arrepentimiento. Inés se rió entre dientes.</p>

<p>—Prácticamente juraste que no lo harías.</p>

<p>—Si llega el caso, córtalo.</p>

<p>—Cárcel, tus manos y tu boca dicen cosas diferentes.</p>

<p>—Mi cabeza no quiere, pero no puedo evitar lo que mi cuerpo desea.</p>

<p>—Tu cabeza es parte de tu cuerpo. Contrólate, Cárcel.</p>

<p>Cuando ella habló con un tono severo, él tragó saliva y le besó el cuello.</p>

<p>—No deberías oler tan bien.</p>

<p>—... Yo no huelo nada.</p>

<p>—Yo sí.</p>

<p>Cárcel se frotó ligeramente la nariz y, sin cambiar de expresión, dejó que una leve sonrisa se dibujara solo en las comisuras de sus labios.</p>

<p>—Por eso llevo aquí una hora.</p>

<p>Aunque se sentía completamente desconcertada cada vez que Óscar le hacía todo tipo de comentarios obscenos o cada vez que se veía envuelta en sus intrigas, era desconcertante que no sintiera ni una pizca de vergüenza por este tema en particular.</p>

<p>Dados sus antecedentes, tal vez era natural... Ella miró hacia abajo, a la parte inferior de sus cuerpos, oculta por el edredón. El pene de él, que presionaba con fuerza contra su abdomen inferior, se había hinchado sorprendentemente hasta alcanzar un volumen aún mayor.</p>

<p><span style="font-style:italic">Esa cosa había estado dentro de mí...</span> La idea le hizo hacer una mueca de espanto.</p>

<p>—Es una pena que esta cosa se ponga dura tan fácilmente, pero yo...</p>

<p>—Lo sé. Es por la mañana.</p>

<p>Cárcel la besó ligeramente debajo de la oreja y se incorporó.</p>

<p>—Yo mismo me encargaré de esto.</p>

<p>El significado de esa fría respuesta quedó claro unos segundos más tarde. Al ver su robusta espalda alejarse de la cama, tras haber declarado claramente que se “encargaría por sí mismo” a primera hora de la mañana, Inés lo miró con ojos vacilantes antes de preguntarle con urgencia.</p>

<p>—No estarás pensando en hacerlo aquí, ahora, ¿verdad?</p>

<p>—Este es el dormitorio. ¿Dónde si no?</p>

<p>—Pero yo estoy aquí...</p>

<p>—¿Y eso importa?</p>

<p>—Sí, importa. ¡Me importa...!</p>

<p>Cárcel ya se estaba desabrochando los pantalones sin mucho entusiasmo.</p>

<p>—Que estés aquí o no me da igual... Al fin y al cabo, somos una pareja casada. Si miras, puede que incluso me excite más.</p>

<p>—Incluso entre pareja hay que mantener la dignidad...</p>

<p>—¿Dignidad? Qué bonito. Aunque ya lo has hecho con la boca.</p>

<p>En un instante, se subió el camisón por los hombros y se lo bajó por debajo de las caderas, saliendo de la cama. Luego, antes de que pudiera volver a ver esa horrible cosa a la luz del sol, huyó al vestidor.</p>


<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>


<p>En cualquier caso, fue una sensación refrescante después de tanto tiempo. A las ocho y treinta y cinco de la mañana, Cárcel Escalante bajó los escalones de la puerta principal del cuartel general naval con paso ligero.</p>

<p>Era una hora en la que los carruajes y los caballos se agolpaban para entrar y salir, por lo que el cochero desapareció en un instante, empujado sin siquiera tener tiempo de saludar a su amo.</p>

<p>Los carruajes de cuatro caballos de los generales atravesaron la puerta principal, galopando rápidamente hacia los establos cercanos a la entrada. Los oficiales que habían montado sus propios caballos siguieron la muralla, trotando más tranquilamente hacia los establos de la puerta trasera, que había sido construida con menos cuidado.</p>

<p>Si iba a ser así, más valía haber utilizado la puerta trasera desde el principio. ¿Por qué tenían que alardear de sus caballos de esa manera? De qué raza era el caballo, de dónde procedía, cómo era su padre, cómo era su madre... Pero, a diferencia de Mendoza, en este lugar apartado no había mucho de lo que presumir.</p>

<p><span style="font-style:italic">Bueno, qué se le va a hacer...</span> Cárcel, que solía burlarse de las tendencias infantiles de los hombres, de alguna manera olvidó su desdén casi de inmediato. Como era habitual en cualquier lugar donde se reunían caballos, el aire estaba impregnado de un ligero hedor a animales y suciedad, pero ni siquiera eso le molestaba mucho.</p>

<p>Había negado el hedor que tenía justo debajo de la nariz como un loco. En cambio, fue gracias a recordar el aroma de alguien. Cuando entró en el edificio y los molestos olores desaparecieron por completo, el aroma de su memoria adquirió una cualidad bastante tangible. Tan tangible, de hecho, que le hizo sentir un poco rígido ahí abajo, lo que le hizo soltar una maldición, pero se sentía bien. De verdad.</p>

<p>La noche anterior había sido un ciclo infernal de levantarse, solo para volver a caer, como un potro desbocado, como si se burlara del recuerdo de cuando había estado atrapado en el abismo de la impotencia y la disfunción eréctil. Aun así... lo real, roncando suavemente mientras dormía, era mejor que lo falso de sus delirios.</p>

<p>Aunque no pudiera tocar ni una sola yema de sus dedos.</p>

<p>Inés, que aparecía a diario en sus sucios sueños, hacía todo lo que él deseaba, pero no tenía personalidad ni sustancia. En realidad, él nunca había deseado tener esos sueños, pero al fin y al cabo eran sus sueños, así que toda la responsabilidad era suya.</p>

<p>En consecuencia, despertarse siempre le traía una sucesión de miseria y culpa. Reflexionando ahora, el matrimonio había sido realmente oportuno. Estaba llegando al punto en que incluso la culpa se estaba desvaneciendo.</p>

<p>Cerrar los ojos le traía sueños, y en esos sueños, Inés aparecía invariablemente, participando en todos los actos depravados. Ella se montaba sobre él, él la aplastaba debajo de él. Sus pechos se balanceaban sobre su cabeza, su rostro gritaba mientras él la aplastaba brutalmente bajo su peso... Sin embargo, con la misma frecuencia, se besaban tiernamente y entrelazaban sus cuerpos. Cuando él le abría las piernas y enterraba su cabeza con avidez entre ellas, ella gemía, instándole como una seductora a empujar más profundamente. No era diferente cuando él la forzaba como a un animal. Cuando no podía soportar verla allí tumbada, con las caderas levantadas en un vulgar desafío, y la tomaba sin miramientos, Inés balanceaba las caderas como si le suplicara que la llenara más completamente.</p>

<p><span style="font-style:italic">... ¿Es eso siquiera posible?</span></p>

<p>Cárcel resopló. Un maldito sueño, nacido de una alucinación seductora y una inconsciencia basura... Incluso él pensaba que esos sueños explícitos no podían ser más patéticos.</p>

<p>Sin embargo, pensando que ella seguramente estaría allí cuando abriera los ojos, se masturbó mecánicamente, rumiando sus vulgares sueños, recordando brevemente su desvanecido sentido de la culpa antes de enfrentarse descaradamente al rostro de Inés Valeztena.</p>

<p>Incluso el día en que la vio entrar en la capilla con su vestido blanco. Incluso el día en que se sentó frente a la Duquesa Valeztena durante la cena... como si nunca hubiera visto un solo cabello de Inés en sus sueños.</p>

<p>Incluso mientras subía las escaleras, algo parecido a un suspiro se escapó entre sus tranquilas respiraciones. Recordó el amanecer en el que había contemplado durante un largo rato los frágiles hombros de Inés, subiendo y bajando ligeramente.</p>

<p>Con solo ese vistazo a su hombro, Inés había conquistado todos sus sueños. Había conquistado todos los gestos lascivos que Inés había hecho en el sueño, con su cuerpo al descubierto.</p>

<p>Una vez la había atraído hacia él, sin ninguna intención siniestra, solo para perder fácilmente la razón en el momento en que su yo ya excitado tocó sus suaves nalgas, y en el momento en que su aliento tocó su hombro desnudo.</p>

<p>A veces, el simple aroma dulce que emanaba de su nuca era suficiente para que la sangre se le acelerara. Como un adolescente que acababa de perder la virginidad, eso solo lo dejaba completamente indefenso.</p>

<p>Qué extraño se sentía, qué inmenso era el odio hacia sí mismo por excitarse por primera vez en su vida con una mujer dormida... Esas cosas se repetían tan a menudo que dejaban de importar. Dejando a un lado su estado inconsciente, incluso si se despertara, nunca consentiría como una novia en su noche de bodas, por lo que nunca se planteó lo que podría hacerle.</p>

<p>Acabó echándose agua fría al amanecer, agarrándose el pene erecto, consolándose y arreglándose mecánica e indiferentemente. Por suerte o por desgracia, Inés no se despertó, ni siquiera cuando Cárcel entró y salió del dormitorio. Sus cejas, que ocasionalmente formaban una línea rígida, estaban relajadas; sus párpados parecían más frágiles que cuando estaban abiertos; su rostro finamente cincelado traicionaba su habitual vigilancia y parecía complaciente. Era sorprendentemente difícil despertarla, y cuando la abrazaba, murmuraba dulcemente en sueños...</p>

<p>Para él, era como si fuera su noche de bodas. Excepto que había estado solo.</p>

<p>A diferencia del amanecer, algo desolador, la mañana ofrecía un material bastante concreto. No había necesidad de imaginaciones o posiciones específicas, ni de recuerdos de una noche de bodas quizás caótica. Bastaba con recordar el suave tacto de su piel, el leve aroma de su piel, de apenas unos minutos antes. Por supuesto, incluso esto era una situación miserable, inimaginable para el antiguo Cárcel Escalante.</p>

<p>Pero Inés, Inés Escalante, era auténtica, sin una pizca de falsedad.</p>

<p>No la Inés Valeztena, sino la Escalante. La Inés de Esposa... la esposa que viviría bajo ese nombre. Su esposa, compartiendo ese ridículo dormitorio.</p>

<p>De repente, se dio cuenta de lo absurdo que era el dormitorio y se encontró sonriendo mientras abría la puerta.</p>

<p>—¿Está sonriendo?</p>

<p>—¿Está sonriendo?</p>

<p>—¿Quién apostó a que el Capitán entraría sonriendo? ¿Nadie?</p>

<p>El Teniente Muñoz gritó. El Comandante Bardem, de la División de Suministros, que estaba prácticamente tumbado en el sofá, se incorporó de un salto y respondió apresuradamente: “¡Fui yo...!” Su dignidad estaba por los suelos, pero a nadie parecía importarle.</p>

<p>La oficina compartida por las secciones de Transporte y Suministros... disfrazada de sala de fumadores, era normalmente un espacio donde el olor a cigarro rancio picaba las fosas nasales tanto como el hedor a estiércol de la puerta principal en circunstancias normales...</p>

<p>—Lárguense, apestan.</p>

<p>Cuando los hombres se agolpaban juntos, de repente se extendió un olor peculiar y extraño. Una vitalidad desagradable, precursora del sudor fétido...</p>

<p>Su nariz se sintió paralizada antes de que pudiera empezar a funcionar. El aroma revoloteante de Inés se desvaneció en los recovecos de su memoria. Cárcel intentó apartar bruscamente a un oficial subalterno y abrirse paso hacia su despacho privado, pero carecía de la habilidad necesaria para defenderse de una docena de oficiales corpulentos.</p>

<p>Estos se abalanzaron sobre él como si quisieran bloquear su retirada, pero al mismo tiempo gruñían y lanzaban monedas de plata aquí y allá en medio del caos. El único vencedor en esta refriega, abandonando todo decoro, fue el Comandante Bardem, que levantó la mano triunfalmente hacia un oficial subalterno muy por debajo de él.</p>

<p>Cárcel observó atentamente cómo su ayudante, José Almenara, sacaba tímidamente una moneda de plata. <span style="font-style:italic">Bien jugado, involucrándote.</span></p>

<p>—Bien, entonces, “sin expresión alguna” tiene cinco votos, “parece no estar pensando en nada” tiene dos, “sonriendo como un pervertido” tiene uno, “sonreír con vacilación” tiene uno...</p>

<p>—Ah, pero esa es la cuestión, Teniente. Sonreír con vacilación es esencialmente prepararse para reír, ¿no cuenta eso también para mí?</p>

<p>El Sargento Sánchez frunció profundamente el ceño y protestó con vehemencia. Como si no hubiera visto en absoluto la expresión irritada de Cárcel. Ese insolente Sánchez tenía programado ser torturado todo el día siguiente, manejando una ametralladora sin alguna finalidad.</p>

<p>Cárcel observaba en silencio a todos y cada uno de ellos, soportando en silencio el despreciable espectáculo de aquellos que habían apostado por su propia cara. Era realmente lamentable que estuvieran apostando por su expresión, sin saber lo que le esperaba al día siguiente.</p>

<p>—Dios mío, alguien incluso ha escrito “llora”. Entra llorando.</p>

<p>—¿Por qué? Porque el matrimonio es una tumba... Una vez que entras en la tumba y sales... Solo pensar en volver a entrar...</p>

<p>El Capitán Salvatore, que aún no había cumplido los treinta años, ya había fracasado dos veces en el matrimonio y ahora se enfrentaba a la crisis de un tercer fracaso inminente, murmuró con tristeza.</p>

<p>—Pero el Capitán Escalante entró sonriendo, ¿no?</p>

<p>—Mejor reír que llorar. Se ríe porque no puede llorar...</p>

<p>—Pero parecía que realmente se reía, ¿no?</p>

<p>—¿Verdad? Ah, aunque ahora no se está riendo...</p>

<p>—Cierto. Escalante, su expresión se ha agriado.</p>

<p>—Pero ¿de verdad entró sonriendo como un pervertido? A mí me pareció que solo sonreía Comandante Bardem y volvemos a deliberar sobre esto.</p>

<p>—No, pervertido es la palabra adecuada. ¿Qué crees que pasaba por la cabeza de Escalante? Nada más que lo que hizo anoche...</p>

<p>—Sí. Correcto. Todavía no he ido a la tumba.</p>

<p>Cárcel respondió al Comandante Bardem con un rígido saludo e intentó abrirse paso entre la multitud de nuevo. Pero inmediatamente, los caminos en todas direcciones se bloquearon.</p>

<p>—Por Dios, Escalante. ¿Qué diablos significa eso?</p>

<p>Se sentía como si Inés lo estuviera reprendiendo desde esta mañana.</p>

<p>—¡Parece significar que todavía está entre nosotros, no en la tumba!</p>

<p>—Es una metáfora, idiota.</p>

<p>Lo que pretendía ser una resolución elegante claramente le había salido por la culata.</p>

<p>—Pero, por otra parte, entiendo que la señora Valeztena, no, la señora Escalante, no es ese tipo de mujer...</p>

<p>—¿De verdad hay categorías separadas para hombres y mujeres? Qué tontería. Incluso los cardenales tienen hijos ilegítimos.</p>

<p>—Pero he oído que la señora Valeztena es muy virtuosa...</p>

<p>Después de eso, se omitieron todo tipo de adjetivos aburridos: seca, rígida, aterradora, estricta como una monja. Aunque sus expresiones dejaban claro que ya habían oído suficiente, varios oficiales que habían asistido a la boda de Cárcel en la capital intercambiaron miradas cómplices y se rieron entre dientes.</p>

<p>Ya fuera por el rumor trivial o por el significado que le daban aquellos que la habían visto en persona, en cualquier caso, a Cárcel le resultaba totalmente irritante en ese momento.</p>

<p>Cuando Cárcel no hizo ningún esfuerzo por ocultar su irritación, el Comandante Bardem, mucho más joven que él, fue el primero en darse cuenta del estado de ánimo de Cárcel. Le dio una palmada en el hombro, aparentemente tratando de contenerlo, pero finalmente no pudo aguantarse y soltó:</p>

<p>—Bueno, el novio tampoco es precisamente un santo. ¿Cómo podría ella soportarlo?</p>

<p>—Ah. Tiene razón. Es cierto. Si fuera él, incluso una monja de verdad...</p>

<p>Cárcel levantó la mano en silencio y le dio al Teniente Anaya, que asentía en silencio, un golpe en la cabeza que le dolió lo justo. Incluso después de ese golpe en la cabeza, el Teniente Anaya volvió a preguntar con cautela, como si exigiera una compensación por la bofetada.</p>

<p>—Entonces, Capitán, ¿qué opina? ¿Qué se siente al estar casado?</p>

<p>—Está bien.</p>

<p>Esbozó una breve sonrisa y respondió con pulcritud. Era una sinceridad nacida de la convicción de que no se debe fruncir el ceño cuando se habla del matrimonio.</p>

<p><span style="font-style:italic">Ooooh</span>, todos se enderezaron inmediatamente ante el sonido exagerado, pero fue seguido de un ligero desdén.</p>

<p>No era otra cosa que el matrimonio de Cárcel Escalante, los sentimientos de Cárcel Escalante. Aunque solo había vivido tranquilamente en su puesto en Calstera, los simples rumores de su vida algo disoluta en Mendoza habían convertido a Cárcel en enemigo y héroe para ellos.</p>

<p>Los rumores son invariablemente exagerados, y si las historias se multiplican por diez en Mendoza, cuando llegan a Calstera suelen multiplicarse por cincuenta.</p>

<p>—Pero ¿no huyó a la academia porque no quería casarse?</p>

<p>—¿Elba mencionó que su destino en la Segunda Flota fue en realidad una petición suya a los superiores? Eso lo ataría al mar durante al menos diez meses, después de todo...</p>

<p>Sin embargo, incluso dentro de la historia exagerada había una pizca de verdad. Cárcel nunca había expresado abiertamente su inquietud por el matrimonio, pero la historia, contada con certeza, contenía un elemento de veracidad.</p>

<p>Aunque nadie parecía saber qué había pasado los diez meses completos en el mar, rumiando su arrepentimiento.</p>

<p>—Es bastante desconcertante que al Capitán, que le disgustaba tanto el matrimonio... Ahora diga que “está bien”.</p>

<p>—Cuando Cárcel Escalante dice “está bien”, según nuestros estándares eso significa “estoy locamente enamorado”, ¿no? Ese bastardo arrogante y bien saciado no diría fácilmente “está bien”...</p>

<p>—Basta, ocúpate de tus asuntos...</p>

<p>—... Aunque no pude asistir a la misa de la boda, sí fui al banquete celebrado en la mansión de los Valeztena, ¿saben?</p>

<p>Cárcel ahora estaba seguro de que ese era, sin duda, el precio que debía pagar por lo ocurrido esa mañana. El precio por mantener a Inés cautiva en sus brazos, jugando con ella y burlándose de ella.</p>

<p>Se presionó las sienes con los dedos y bajó la mirada por un momento. El cansancio de tres o cuatro días de mal sueño, absurdamente, sólo ahora había llegado.</p>

<p>—Ah, sí, lo hizo, ¿verdad? ¿Los dos... no, los tres...? ¿El Capitán Corona también fue?</p>

<p>—Ajá.</p>

<p>—¿Entonces vió a la señora?</p>

<p>—¿Que si la vi?</p>

<p>La razón por la que los asistentes intercambiaron otra mirada sutil era obvia. Inés Valeztena, contrariamente a los rumores, tenía este rostro, esta figura y su actitud hostil era en realidad... Sinceramente, era tan obvio que daba ganas de suspirar.</p>

<p>Además, la desagradable sensación de que ni siquiera decir la verdad sería bien recibido era un extra. Esa desagradable sensación le revolvió el estómago.</p>

<p>—Me preguntaba de qué iban los rumores.</p>

<p>—¿Rumores?</p>

<p>—Que Valeztena, con su noble cuna, fuera llamada cuervo o bruja...</p>

<p>Las palabras que salían con facilidad tanto en Mendoza como aquí se le escaparon incluso en presencia de Cárcel. El Capitán Coronado, incapaz de retractarse, vaciló con la boca abierta.</p>

<p>Dado que Cárcel se había ofendido anteriormente ante cualquier mención a su prometida, y habiendo visto a la prometida en cuestión en la boda...</p>

<p>—... Esos comentarios absurdos no eran más que un intento de expresar lo absolutamente impresionante que era la señora. Escalante.</p>

<p>Rápidamente salvó la situación y se retiró sabiamente. Mientras los demás intercambiaban miradas de desconcierto, el Comandante Bardem, otro invitado, volvió a sacar el tema con una sonrisa pícara.</p>

<p>—No escribí “riendo como un pervertido” por nada, ¿saben? Daaah, tengo información y lo vi con mis propios ojos...</p>

<p>—Pero Comandante, si tiene información, ¿por qué no la comparte?</p>

<p>—Si te lo contara todo, ¿qué gracia tendría la apuesta?</p>

<p>—Empezamos desde puntos diferentes, ¿no? Esto es injusto.</p>

<p>—¿Entonces estás diciendo que Escalante realmente entró riendo como un pervertido?</p>

<p>—Miren las ojeras que tiene. Si hubiera sido tonto y hubiera estado sano, quizá habría hecho dormir a la señora con un suspiro…</p>

<p>—Aunque sí que está bastante pálido.</p>

<p>Aun así, alguien murmuró que era irritantemente guapo, chasqueando la lengua con pesar. Era él quien quería chasquear la lengua. Las ojeras, la palidez... Todo eso había aparecido después de entrar en ese lugar.</p>

<p>—¿Entonces es por la noche de bodas de ese pervertido?</p>

<p>—Mira la historia de ese bastardo. No es un pervertido cualquiera... ¿Un hombre que hace creer a las mujeres que pasar una sola noche con él es un honor que nunca volverán a experimentar, sin una sola palabra de queja? Eso no es un pervertido cualquiera. Es un milagro que la inocente señora no huyera aterrorizada...</p>

<p>—¿Quiere decir que la señora Escalante es inesperadamente hermosa?</p>

<p>—¡Qué suerte tiene...!</p>

<p>—¿Podría ser que es más bonita que el Capitán?</p>

<p>—¿Tiene sentido llamar bonita a alguien con mi complexión...? Corrígete antes de que te golpee.</p>

<p>—¿En serio? ¿Quiere decir que la señora Escalante es bonita?</p>

<p>—Hmm.</p>

<p>—¿No lo dice por decir? ¿Lo dice de verdad? ¿No es un halago? ¿En serio? ¿Nadie la ha llamado fea nunca? ¿O simplemente han dicho que no era su tipo?</p>

<p>—He oído rumores sobre su carácter... ¿Es tan malo como dicen?</p>

<p>—No, su carácter tampoco es así.</p>

<p>—... Corona, respóndeme. No lo digo solo por cortesía: ¿es realmente guapa o solo lo dices por decir?</p>

<p>—Me sentí estafado porque era realmente hermosa...</p>

<p>—¿Quién empezó los rumores?</p>

<p>—Fue solo algo que mencionó el Coronel Barca de pasada. A menos que Escalante difundiera deliberadamente rumores desagradables entre bastidores para ocultar a su prometida, ¿cómo podría ser si no?</p>

<p>—¿Es eso cierto?</p>

<p>—Nunca pensé que fuera capaz de hacer algo así...</p>

<p>—Son solo rumores. Rumores. Que llegara tan lejos como para ocultar...</p>

<p>La conversación era inconexa y, al poco tiempo, se habían olvidado de la presencia de Cárcel. Cárcel, con aspecto totalmente agotado, pasó junto a ellos y entró en su despacho privado.</p>

<p>Allí le esperaban todo tipo de grandiosas coronas de flores, ramos grandes y pequeños, y montones de cartas de felicitación. Las flores amontonadas sobre el escritorio y el sofá desprendían una fragancia caótica y agresiva al mezclarse sus aromas.</p>

<p>¿Cómo es posible que los militares acaben oliendo así allá donde van? Con una expresión de profundo disgusto, comenzó a retirar las flores de su escritorio una por una.</p>

<p>Luego vinieron las pilas de cartas. Descartó sin miramientos todas las que llevaban nombres conocidos y transfirió la mayoría de las cartas a una bandeja para que José Almenara se las llevara.</p>

<p>Luego había algunas que requerían su respuesta personal y varias cartas sospechosas de mujeres que claramente habían hecho comentarios que iban más allá de las simples felicitaciones...</p>

<p>Aunque a la misa de su boda solo habían invitado a unos pocos selectos invitados, la mayoría de sus conocidos cercanos asistieron al banquete de la noche. Por lo tanto, las cartas enviadas por aquellos que no habían podido felicitarles en persona eran en su mayoría solicitudes de personas que ni siquiera conocía, o cartas de mujeres que le hacían sentir bastante incómodo.</p>

<p>Con una sensación de malestar, abrió la carta de una mujer y leyó inmediatamente la declaración: “Ahora que estás casado, es un buen momento para tomarme como tu amante”, y su hermoso rostro se descompuso.</p>

<p>Si hubiera sido una mujer que hubiera conocido antes, aunque mostrara un afecto residual normal, habría sido una molestia, pero no un motivo de vergüenza. Sin embargo, se trataba del nombre de una mujer que no conocía en absoluto. Cárcel arrojó las cartas en un montón a la chimenea, como si le invadiera un miedo fastidioso a que tal vez tuvieran piernas y pudieran perseguirlo hasta la residencia, o a que Inés pudiera enterarse de todos los detalles de su contenido, como si tal cosa fuera posible.</p>

<p>También recuperó de la bandeja, que tardíamente estaba destinada al ayudante, los nombres de varios homosexuales notorios que se habían tomado la libertad de adorarlo. No era tanto por lástima hacia José, que inevitablemente tropezaría al escribir respuestas mecánicas en nombre de su superior, sino por negarse a compartir con nadie la vergüenza de soportar tales indignidades, incluso en cartas de felicitación por su matrimonio.</p>

<p>Las rompió por completo y arrojó los pedazos a la chimenea. Al ver cómo las brasas que había echado en ese día caluroso se apagaban en un instante, finalmente sintió que una pequeña paz se apoderaba de su mente.</p>

<p>Cárcel, con los labios apretados con cierta rigidez para ajustarse a su habitual actitud brusca, escribió unas pocas páginas de respuesta con un cuidado superficial. ¿Cuántos minutos habían pasado?</p>

<p>A pesar de llamar con cautela, no recibió respuesta. El corpulento José Almenara miró con precaución a través de la puerta.</p>

<p>—Disculpe, Capitán.</p>

<p>Al no obtener respuesta, sus ojos parpadearon con inquietud momentánea, como un niño perdido en la calle, antes de esbozar una sonrisa avergonzada.</p>

<p>—El Comandante Bardem se preguntaba cuándo podría ver la nueva residen—</p>

<p>—Piérdete.</p>

<p>—Ni siquiera me ha dejado hablar... El Comandante solo decía que lamentaba no haber sido presentado formalmente a la señora aquel día en la residencia Valeztena, dada la conmoción, y que esperaba que lo invitaran pronto...</p>

<p>—Saca la cabeza y cierra la puerta. Ver tu fea cara ya es suficiente tortura.</p>

<p>—¡Capitán! Este… sobre la apuesta de antes...</p>

<p><span style="font-style:italic">Apuesta mi trasero...</span> Lo miró fijamente durante un momento con esa expresión, luego la cabeza de José Almenara se desplomó y desapareció. <span style="font-style:italic">La bonita Inés. La maldita Inés...</span> Esa sensación desagradable de antes aún acechaba en su garganta.</p>

<p>Ninguna de ellas le complacía. Ni una sola.</p>

<p>La vida en Calstera era extremadamente tranquila. Cada mañana, al despertar, el sonido de las olas fuera de la ventana acariciaba suavemente sus oídos, y una brisa fresca entraba y salía por la puerta del balcón que Cárcel dejaba abierta: un mundo tranquilo.</p>

<p>Permanecer tumbada, observando cómo la baldaquín blanco se agitaba suavemente con la brisa, inevitablemente levantaba el ánimo. Todo parecía transcurrir sin prisas, con un estado de ánimo que dejaba que las cosas siguieran su curso.</p>

<p>El tiempo fluía como agua tranquila. Y ella se dejó llevar por ese tiempo que fluía, como hechizada, durante muchos días.</p>

<p>Curiosamente, no se le ocurría ningún pensamiento. Las molestias diarias de Cárcel por las mañanas eran irritantes, pero pronto se cansó tanto que ni siquiera le daba vergüenza. Simplemente pensaba: “Así es él…”. Así que se sometía en silencio, echaba un vistazo al reloj y lo echaba, y él se marchaba obedientemente.</p>

<p>Una vez que Cárcel era expulsado del dormitorio y se iba a lavar, Inés se quedaba en la cama un poco más, aún más perezosa. Solo cuando Cárcel salía, con su uniforme impecablemente planchado, se levantaba por fin, se ponía ropa sencilla para estar en casa y se unía a él para desayunar.</p>

<p>Las comidas en Calstera eran mucho más sencillas que las de Mendoza, pero la habilidad de la cocinera era tan excelente que le gustaban.</p>

<p>Lo único era que la cocinera era una anciana, considerablemente mayor incluso que la ama de llaves, Alondra. De vez en cuando, cuando llevaba la comida con el mayordomo, con la espalda encorvada, se sentía bastante incómoda...</p>

<p>Excepto por ese momento, en el que el simple hecho de estar sentada y ser atendida por los sirvientes le hacía sentir una extraña sensación de culpa, el desayuno era espléndido. La comida era deliciosa, y la comida deliciosa hace que uno se olvide de muchas cosas. Además, Cárcel, al igual que su padre, cortaba y comía un filete que chorreaba sangre desde primera hora de la mañana, y una vez que sus nervios se distraían por las náuseas momentáneas, el servicio de la anciana, que hacía sentir incómoda a su señora, se olvidaba rápidamente.</p>

<p>Después de un desayuno tan sencillo como satisfactorio, despediría a Cárcel de forma superficial mientras él se dirigía al cuartel general, y a partir de entonces, el tiempo era completamente suyo.</p>

<p>Las mañanas en la residencia Calstera siempre eran tempranas, y el sol de Calstera se quedaba más tiempo que el de Mendoza: su marido se levantaba al amanecer y desaparecía a primera hora de la mañana, lo que hacía que los días se le hicieran insoportablemente largos.</p>

<p>Cárcel no lo parecía, pero era muy madrugador. En cierto sentido, era todo un soldado, y en otro sentido...</p>

<p><span style="font-style:italic">... ¿Era diligente?</span></p>

<p>Era un sentimiento nuevo, aún desconocido.</p>

<p>Incluso en Mendoza, había visto a menudo a Cárcel con su uniforme de oficial, pero le había parecido más bien un plato bien presentado y apetitoso.</p>

<p>Como ver una comida que no le gustaba especialmente, pero que a todos los demás les encantaba... A juzgar por cómo las mujeres se agolpaban a su alrededor como polillas a la luz, no era una comparación del todo inexacta.</p>

<p>Ya fuera el uniforme blanco o el azul marino, que se ponía según la ocasión, solo era una diferencia en el color del envoltorio. Al fin y al cabo, la comida es comida. Independientemente del Cárcel que había conocido desde la infancia, verlo sola, brillando entre la multitud, la dejó con esa sensación particular.</p>

<p>Aunque en esencia no era diferente de la imagen que había visto innumerables veces en Mendoza, Cárcel en Calstera simplemente parecía un oficial como Dios manda.</p>

<p>Sus rasgos eran tan atractivos que incluso su aparente extravagancia parecía ascética cuando mantenía la boca cerrada, y cuando miraba fijamente algo sin expresión, parecía severo. Como si se hubiera vuelto más rígido que ella.</p>

<p>Nunca había sido muy expresivo, pero aquí, en su puesto, era indudablemente un soldado. Incluso después de regresar a casa y quitarse el uniforme.</p>

<p>Inés se sorprendía cada vez más al descubrir que, aparte de sus complicadas relaciones con las mujeres, no había nada en él que pudiera despreciar de verdad.</p>

<p>Especialmente su diligencia. Ese rostro fresco e inmaculado por las mañanas...</p>

<p>Alondra le había contado que, cuando ella no estaba, él solía saltarse el desayuno y se iba al campo de entrenamiento mucho más temprano.</p>

<p>A diferencia de ella, cuya costumbre de dormir hasta tarde era algo de lo que no podía deshacerse ni aunque viviera su vida dos veces...</p>

<p><span style="font-style:italic">Bueno, es diligente.</span></p>

<p>Apoyando la barbilla en la barandilla del balcón mientras contemplaba el mar, Inés se lo reconoció a regañadientes.</p>

<p>Al fin y al cabo, las personas son multifacéticas por naturaleza. Incluso un hombre que detestaba tanto las responsabilidades, ya fueran los títulos familiares o el matrimonio, podía vivir con diligencia día a día, impulsado por un sentido del deber diferente.</p>

<p>Sorprendentemente...</p>

<p>Suponía que solo servía a regañadientes, sin intención de volver una vez que terminara su permiso en Mendoza...</p>

<p>Estaba claro que se había unido a la academia para distanciarse del matrimonio y se había ofrecido voluntario para la flota que se desplegaba lejos para escapar aún más, pero de alguna manera eso encajaba perfectamente con su carácter.</p>

<p>Mirando atrás, él también había estado en la Armada Imperial en su vida anterior.</p>

<p>En aquel entonces, Inés había pensado sinceramente: “¿Se alistó solo para llevar el uniforme?”. Un mujeriego con labia que sabía exactamente cómo venderse, ¿qué otra cosa podía ser?</p>

<p>Incluso había rechazado el título que le había legado su padre; al fin y al cabo, no tenía nada más que hacer...</p>

<p><span style="font-style:italic">Ayer se reunió con fulana, hace cinco días con mengana, hace diez días con sultana...</span> Aunque Óscar era el nexo de unión, él e Inés nunca habían tenido una relación realmente estrecha. Era simplemente un nombre familiar, cuyos rumores circulaban con frecuencia. Probablemente eso era cierto para cualquiera en Mendoza.</p>

<p><span style="font-style:italic">Quizás incluso entonces vivía aquí con tanta diligencia.</span></p>

<p>En cualquier caso, estaba claro que era su vocación. Llegó a la conclusión de que no había necesidad de sentir especial pena por haberle hecho huir aquí antes... Gracias a esa aptitud en Cárcel, los días eran bastante agradables.</p>

<p>El marido de Inés, inesperadamente dedicado y diligente en su profesión, se marchaba temprano por la mañana, e incluso después de terminar su turno en la sede, regresaba tarde por la noche tras su entrenamiento individual. Tras compartir unas palabras sobre temas mundanos y cotidianos durante la cena, se instalaba una noche tranquila sin incidentes.</p>

<p>Ella pasaba las noches leyendo las escrituras junto a la estantería; él, disfrutando de un cigarro y un par de copas de vino en el balcón.</p>

<p>Inés se apartó de la barandilla del balcón y miró el lugar donde Cárcel solía sentarse. La imagen que solo había visto de espaldas ahora parecía como si la estuviera mirando directamente.</p>

<p>Su rostro inexpresivo y lánguido sosteniendo un cigarro, esos ojos azules contemplando el mar nocturno... Incluso sin verlo directamente, Inés reconoció objetivamente por un momento que debía de ser una escena pintoresca. Al fin y al cabo, su rostro era realmente muy atractivo.</p>

<p>No mostraba signos particulares de fatiga, pero al final del día solía estar callado.</p>

<p>Era revelador que, mientras que por la mañana no paraba quieto desde el momento en que abría los ojos, por la noche no se movía ni un solo instante.</p>

<p>Rara vez conversaban, salvo cuando compartían una comida.</p>

<p>Y una vez que se acostaba, qué rápido y qué bien dormía... Cárcel se comportaba con tanta moderación, como si se hubiera entrenado para eliminar todo deseo, que desde su noche de bodas no habían tenido relaciones íntimas ni una sola vez.</p>

<p><span style="font-style:italic">...Así que no es de extrañar que mis pensamientos se desvanezcan.</span></p>

<p>En efecto. Este lugar era excesivamente perfecto y cómodo.</p>

<p>Incluso cuando se enfrentaba al hecho de que “no hay absolutamente nada en mi cabeza en este momento”, no surgía ningún pensamiento en la mente de Inés. Incluso el esfuerzo por compensar esta falta de pensamiento le parecía innecesario.</p>

<p>Como despertarse por la mañana y revolcarse perezosamente en la gran cama durante un rato, todos los días se sentían como esa mañana lánguida.</p>

<p>Por la noche, dormía sin soñar. Las mañanas traían abundante cocina del suroeste, perfecta para ganar peso. Leía unas cuantas páginas de los libros de la estantería antes de quedarse dormida al azar. Se sentaba perezosamente a tomar el sol en el jardín antes de volver a echarse la siesta. Se quedaba mirando fijamente al mar antes de quedarse dormida... Todas las actividades se limitaban al interior, por lo que su rutina diaria no era muy diferente de la vida en la casa de los Valeztena.</p>

<p>Excepto por la parte en la que engordaba y se volvía más perezosa.</p>

<p>Así que, al final, solo había mejorado perezosamente su calidad de vida. No sabía si era porque por fin estaba lejos de la casa de los Valeztena, como había deseado, o gracias al ambiente acogedor y confortable de esta casa, o por el sonido de las olas.</p>

<p>No le había dado mucha importancia, ni deseaba saber la causa. Fuera lo que fuera, era perezosa y estaba contenta... Justo cuando Inés se daba la vuelta, pensando vagamente en esto.</p>

<p>En ese momento, Alondra entró en el balcón con una pequeña bandeja llena de aperitivos.</p>

<p>—Ah, gracias.</p>

<p>—De nada. El almuerzo pasó sin que dijera nada sobre la cena... Esta vieja sirvienta temía que se saltara otra comida, así que traje algo sencillo.</p>

<p>—Supongo que desayuné demasiado. No tenía mucha hambre, así que no me di cuenta de que el tiempo había pasado tan rápido...</p>

<p>Inés sonrió encantada, se sentó inmediatamente y se dispuso a comer. La mayor parte de la satisfacción que le proporcionaba esta casa provenía de la ociosidad y la saciedad.</p>

<p>Con pocos que la vigilaran y la casa demasiado pequeña para deambular, no podía hacer otra cosa que acunar su vientre lleno y dormitar todo el día.</p>

<p>—Con Alondra cuidándome tan bien, simplemente no puedo permitirme saltarme una comida.</p>

<p>—¿Qué sería de usted si se saltara las comidas a su edad, señora?</p>

<p>—Oírte decir eso me hace sentir como un niño pequeño.</p>

<p>—Esos chicos crecen perfectamente sin que les obliguen a comer. Es la recién casada la que debe comer bien.</p>

<p>Una sutil sonrisa, que insinuaba “Ya sabes por qué, ¿verdad?”, se fijó en Inés con una intensidad que la hizo sentir incómoda.</p>

<p>Inés, fingiendo ignorar por completo su significado, desvió la mirada y mordisqueó su galleta. Sin embargo, Alondra observó la escena con silenciosa satisfacción y, de repente, la llamó con expresión cautelosa.</p>

<p>—Pero, señora.</p>

<p>—Sí.</p>

<p>—¿De verdad le parece bien permanecer confinada en la casa de esta manera?</p>

<p>—¿Perdón?</p>

<p>—¿No se aburre?</p>

<p>—No especialmente...</p>

<p>—El cochero ha preguntado cuándo podría mostrarle los lugares de interés de la zona.</p>

<p>—Ah, dile que está bien.</p>

<p>—¿Qué tal si invitamos a las otras damas? La cocinera preguntó sobre eso.</p>

<p>—Yolanda ya tiene bastante con preparar nuestras comidas.</p>

<p>Ante la impecable respuesta de Inés, Alondra pareció quedarse sin palabras por un momento, limitándose a abrir y cerrar la boca.</p>
<p>Luego continuó.</p>

<p>—Yolanda tiene una asistente, ¿o no?</p>

<p>—Aun así, no quiero sobrecargarlas innecesariamente.</p>

<p>—¿No tiene intención de invitar a los superiores del Capitán...?</p>

<p>—No.</p>

<p>—¿Y no tiene planes de modificar el jardín?</p>

<p>—Está perfecto tal y como está.</p>

<p>—He desordenado la disposición de los muebles. ¿No tiene intención de pedirde a los sirvientes que los vuelvan a colocar?</p>

<p>—Alondra lo ha hecho lo mejor que ha podido, ¿no? Así que no pasa nada.</p>

<p>—...</p>

<p>Inés, que había estado respondiendo distraídamente a las preguntas de Alondra una tras otra mientras se limitaba a comer galletas, solo se dio cuenta de lo que quería decir cuando se encontró con la mirada penetrante de Alondra.</p>

<p>Por muy satisfecha que se sintiera Inés, para los demás simplemente parecía terriblemente ociosa.</p>

<p>Era comprensible. Cada vez que la veían, estaba comiendo, dormitando o simplemente sentada sin moverse.</p>

<p>—Estoy bien, Alondra.</p>

<p>—... Solo me preguntaba, ya que está en un lugar extraño sin nadie que la visite, si se sentiría un poco deprimida...</p>

<p>Alondra cambió de estrategia. Sorprendida por esta repentina muestra de preocupación, Inés se quedó momentáneamente sin palabras.</p>

<p>—Alondra, me siento absolutamente espléndida en este momento.</p>

<p>—Eso es porque es muy considerada con sus sirvientes...</p>

<p>—... No, de verdad que lo estoy.</p>

<p>—Si me permite el atrevimiento, los sirvientes están preocupados por el bienestar de la señora.</p>

<p>—...</p>

<p>—Habiendo residido en Mendoza todo este tiempo y habiendo crecido en el espléndido castillo de Pérez, qué agobiante debe de ser vivir de repente en un lugar tan remoto...</p>

<p>—Está abierto por todos lados. ¿Cómo podría ser agobiante?</p>

<p>—Eso es precisamente lo que quiero decir. ¿Cómo de agobiada debe de sentirse para estar tan apática?</p>

<p>—¿Apática? Estoy llena de energía, Alondra.</p>

<p>Alondra asintió con la cabeza como si ya hubiera llegado a su conclusión, interpretando la respuesta de Inés a su antojo. Una mirada de lástima se posó en ella.</p>

<p>A menudo ignoraba descaradamente incluso a Cárcel, su legítimo amo, así que ¿por qué iban a ser diferentes las palabras de Inés?</p>

<p>—No es posible que ya esté embarazada...</p>

<p>—No. No lo estoy.</p>

<p>—Pero mírese, apenas come en todo el día y solo duerme. Qué lamentable...</p>

<p>—¿Por qué es lamentable comer y dormir todo el día?</p>

<p>Para aquellos que trabajan todo el día, es lamentable que alguien juegue y coma todo el día. Sin embargo, Alondra parecía sorprendentemente sincera, y la opinión que representaba entre los sirvientes parecía igualmente genuina.</p>

<p>—He oído que el Capitán solicitó matrimonio de repente. Por supuesto, parece un poco tardío... Pero casarse de la noche a la mañana y que sus circunstancias cambien tan abruptamente... Aunque algunas damas prefieren este lugar por sus hermosos paisajes, he oído a la ama de llaves de la residencia del Teniente que hay abajo que a las personas nacidas en Mendoza les cuesta adaptarse al principio.</p>

<p>Pensar que estaba tan preocupada que envió a un investigador externo... Sin embargo, Inés, que se había adaptado demasiado rápido como para merecer tanta simpatía, se sintió completamente nerviosa.</p>

<p>Aun así, el cabello blanco como la nieve, la corta estatura y la mirada resuelta de la ama de llaves poseían una fuerza que hacía imposible ignorarla por completo, por muy malhumorado que se estuviera.</p>

<p>La cultura cansada de Ortega, donde la gente vivía al azar, como si dejara que las cosas siguieran su curso, pero aún así respetaba a los ancianos...</p>

<p>—No nací en Mendoza. Estoy bien.</p>

<p>—En comparación con Mendoza, este lugar tiene sin duda demasiados inconvenientes, no hay entretenimiento, no hay nada que ver salvo esa vasta extensión de mar, no hay ningún sitio donde gastar dinero...</p>

<p>—Precisamente por eso no necesito nada de eso. Alondra. Yo siempre...</p>

<p>—... ¿Qué agobiante debe de ser para usted?</p>

<p>Lo que era agobiante era la mirada compasiva de Alondra. Era mejor que tener a la gente cotilleando a sus espaldas, pensó “¿Hay alguien más holgazán y sin rumbo que esa?”, pero aun así...</p>

<p>Solo entonces Inés recordó vagamente su objetivo original.</p>

<p>La naturaleza ingenua de la gente de Calstera hacía que su vida fácil despertara lástima, pero ¿y si se daban cuenta de la verdad? ¿Que vivía así simplemente porque era perezosa y no le daba importancia?</p>

<p><span style="font-style:italic">Y luego está Cárcel, siendo inútilmente trabajador, lo que hace que la comparación sea demasiado obvia...</span></p>

<p>Inés sintió un profundo arrepentimiento al recordar la diligente figura de Cárcel abandonando la mansión esa mañana. ¿Qué tan lamentable debía parecer su propia rutina en comparación?</p>

<p>La familia Valeztena siempre había vivido recluida, evitando todos los asuntos problemáticos y a las personas molestas, ocupándose tranquilamente de sus asuntos como les placía. En una sociedad en la que la vida tranquila era la máxima rebelión.</p>

<p>No les importaba en absoluto la opinión de los nobles, y mucho menos la de sus sirvientes.</p>

<p>En su primera vida, vivida en constante ajetreo, los pensamientos o las miradas de los sirvientes eran demasiado triviales como para merecer consideración. Su segunda vida había sido demasiado breve y pobre como para siquiera plantearse la idea de contratar sirvientes.</p>

<p>Pero ahora, la historia era diferente. Tenía que prepararse para el día en que este matrimonio terminara en un espléndido colapso.</p>

<p>Para ese día, sería crucial contar con testigos que atestiguaran que había sido una persona cuerda.</p>

<p>—... Quizás lo estoy.</p>

<p>Inés aceptó en silencio la sugerencia de Alondra.</p>

<p>De repente, los ojos de Alondra se iluminaron y aplaudió.</p>

<p>—Después de la misa de este fin de semana, ¿qué tal si va de excursión con el Capitán?</p>

<p>—Con asistir a misa es suficiente para una salida.</p>

<p>—En absoluto. Hay un lago precioso no muy lejos.</p>

<p>—Después de haber pasado todo el día contemplando el mar, ¿por qué molestarse con un lago?</p>

<p>—¡Escuché que hay una carretera lo suficientemente ancha para un carruaje! Dicen que es muy cómodo llegar y salir de allí.</p>

<p>—No sé... No querría cansar a Cárcel.</p>

<p>—El señor Escalante no conoce el cansancio. Basta con ver su robusta complexión para darse cuenta.</p>

<p>—En sus días libres, lo mejor es dejarlo descansar.</p>

<p>—Es un hombre que no necesita descansar.</p>

<p>—No existe ningún hombre que no necesite descansar.</p>

<p>—¡Sí que existe! Su marido, señora.</p>

<p>Inés sintió que su defensa había fracasado.</p>

<p>Mientras asentía a regañadientes, Alondra ya estaba parloteando sobre qué meter en la cesta de picnic. Inés respondió mecánicamente, sin mucho ánimo. “Cualquier cosa, en realidad”. “Lo que le guste a Cárcel”. “Sí, fruta también”. “No le gustan los duraznos…”</p>

<p>En medio de esta avalancha de respuestas, una joven criada asomó la cabeza por detrás de Alondra.</p>

<p>—¡Señora! Han llegado visitantes de la familia Valeztena.</p>

<p>—¿De la familia Valeztena?</p>


<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>


<p>—¿Qué diablos es esto?</p>

<p>—No sabía que la residencia fuera tan pequeña...</p>

<p>El joven lacayo del castillo de Pérez dejó la frase en el aire.</p>

<p>Cuando los sirvientes de la familia Valeztena recibieron información sobre la residencia de Cárcel en Calstera, era lógico que Cárcel no tuviera ninguna relación con esta pequeña mansión.</p>

<p>Inés, que no tenía forma de saber que Cárcel se había mudado discretamente de residencia mientras tanto, se quedó sin palabras.</p>

<p>Ahora miraban alternativamente los dos grandes carruajes de la familia Valeztena y la modesta residencia de dos pisos de Cárcel. Por supuesto, mirar fijamente no les daría ninguna respuesta.</p>

<p>—No, debería haberlo mencionado antes.</p>

<p>—Está previsto que lleguen cinco carruajes más…</p>

<p>Volvió a callarse. Inés se tocó ligeramente la sien.</p>

<p>¿Había estado demasiado distraída últimamente? ¿O era porque el calendario era tan apretado que las cosas no habían avanzado paso a paso cómo debían? Sus pertenencias, que deberían haber llegado aquí con ella, se habían retrasado debido a que la ceremonia se había organizado con tanta prisa. Entonces, al no encontrar ningún inconveniente, simplemente...</p>

<p>—... Supongo que fue solo porque no lo había pensado.</p>

<p>Inés llegó una vez más a una conclusión objetiva. Era lógico que la familia Valeztena transportara sus pertenencias en varios envíos. Simplemente había alejado ese pensamiento de su mente.</p>

<p>Solo sus vestidos negros, guardados en el castillo de Pérez y en la residencia ducal de Mendoza, llenarían sin duda dos grandes carros de equipaje hasta los topes. Aunque otros no los distinguirían de la ropa de luto, Inés, que en su día había marcado las tendencias de la moda en Ortega, conservaba su propia sensibilidad estética.</p>

<p>Además, los libros que nunca le habían gustado en su vida anterior se habían acumulado ahora que permanecía confinada en la casa sin nada más que hacer... Solo su estudio personal llenaría cuatro o cinco carros grandes.</p>

<p>—Hemos seleccionado principalmente lo que la señora Inés más valora, así que al menos conservemos esto.</p>

<p>—...Raúl.</p>

<p>—¿Sí?</p>

<p>—No hay espacio donde ponerlos.</p>

<p>—¿Qué?</p>

<p>—No hay espacio para nada de eso.</p>

<p>—No, eso es imposible.</p>

<p>Raúl negaba la realidad. Sin embargo, esta era la mansión que ya se había visto obligada a deshacerse incluso de las pertenencias de su amo, Cárcel.</p>

<p>—Realmente no hay espacio.</p>

<p>—Entonces, ¿qué hacemos?</p>

<p>—Debemos devolverlo todo.</p>

<p>—¿...Va a seguir viviendo aquí?</p>
	
<p>Era una pregunta directa. Raúl había sido originalmente un leal sirviente que Inés había llevado a la corte y utilizado como un perro, pero ahora que ya no vivía la vida de una Princesa Heredera, no era más que una figura incluida en el círculo extremadamente reducido de relaciones humanas de Inés, junto con Juana.</p>

<p>Era inevitable que se volviera prescindible... En su primera vida, lo había rescatado impulsivamente siendo un pequeño huérfano mientras era golpeado en las calles, solo para trabajar hasta la muerte. Esta vez, lo había rescatado a la hora señalada con el pensamiento calculador: “Si lo salvo ahora, puede que me sea útil más adelante”, sólo para descubrir que era completamente inútil.</p>

<p>En una situación en la que apenas se aventuraba fuera de su habitación, simplemente no había razón para necesitar a nadie. Así que, abandonado a su suerte, había logrado ascender dentro del castillo por sus propios medios, utilizando su aspecto aceptable y su alta estatura para convertirse en un joven lacayo desde muy temprana edad.</p>

<p>A diferencia de los demás sirvientes, Raúl, que ahora atendía personalmente a la familia Valeztena y recibía y despedía a los nobles distinguidos, le contaba los secretos más íntimos del castillo de Pérez y las historias de la nobleza que ni siquiera ella conocía.</p>

<p>Aunque esta función apenas difería de sus anteriores obligaciones, estaba claro que la aparentemente humilde existencia de su benefactora era una molestia para este prometedor joven. Se notaba por cómo se había convertido en un fiel entrometido a una edad tan temprana.</p>

<p>Era él quien, cada vez que Inés no le proporcionaba algo, acosaba a los demás sirvientes, exigiendo, interrogando, insistiendo, asegurándose de que no le faltara nada. Incluso la sometía a su propia leal intromisión.</p>

<p>De los dieciséis a los veinte años, mientras Inés se derrumbaba silenciosamente bajo el peso de sus recuerdos de Emiliano, él y Juana se aferraban a ella, logrando de alguna manera alimentarla y vestirla. Con cierta habilidad, se mudó de Mendoza a Pérez, cambiando de alojamiento cada vez...</p>

<p>Hasta que finalmente se convirtió en una mujer de la familia Escalante.</p>

<p>—¿Cómo se puede vivir en un lugar como este...?</p>

<p>Raúl volvió a mirar la mansión como si fuera una ratonera.</p>

<p>—Es un buen lugar. Para algunos, vivir aquí toda la vida sería un sueño.</p>

<p>—Eso puede ser cierto para un desgraciado como yo. Pero no para la señora Inés.</p>

<p>Incluso después de alcanzar su propio éxito en el castillo de los Pérez, sabía muy bien cuál era su lugar. Sin embargo, cuando se comparaba con su ama, no sentía ninguna satisfacción. Si ella era el punto de referencia, él se volvía tan arrogante como ella no lo era.</p>

<p><span style="font-style:italic">Una dama tan noble en un lugar tan miserable...</span> Raúl volvió a mirar a su ama, con una expresión que lo decía todo, llena de pesar.</p>

<p>Ella suspiró y le revolvió el pelo mientras lo acariciaba. Los ojos de Raúl, que habían parecido ligeramente feroces, se suavizaron visiblemente.</p>

<p>—Me ha ido bien, Raúl.</p>

<p>—Me cuesta creerlo.</p>

<p>—¿No ves que he engordado por dormir y comer bien?</p>

<p>—Supongo que debe de ser el estrés de estar en un entorno desconocido.</p>

<p>—... ¿Entonces no niegas que he engordado?</p>

<p>—No importa, porque sigue siendo hermosa de todos modos. Pero para alguien que debe llevar un vestido diferente cada día para estar satisfecha...</p>

<p>Raúl murmuró, aparentemente incapaz de contener su pesar, mirándola una vez, luego la modesta mansión y luego a ella otra vez.</p>

<p>—... Debe de haberse apañado con unos pocos conjuntos, alternándolos.</p>

<p>—Para los demás, tanto si los alterno como si llevo diferentes, al final todos parecen el mismo.</p>

<p>—Dijo que eran claramente diferentes, solo en el color.</p>

<p>—Es cierto.</p>

<p>—Solo traje unos pocos preciados vestidos y sus libros favoritos, pero ni siquiera esos podrán conservarse...</p>

<p>Por el momento, lo esencial se había traído el día que llegó a Calstera. No prestaba mucha atención a los adornos, por lo que bastaba con unos pocos vestidos que se alternaban entre sí. En cuanto a los libros, las estanterías de Cárcel estaban repletas de ellos. De vez en cuando, se le ocurrían algunas cosas que le gustaría traer del castillo de Pérez o de la residencia ducal de Mendoza, pero cuando se pasaba la mitad del día simplemente comiendo y durmiendo...</p>

<p>—Viviendo aquí, me he dado cuenta de que, al fin y al cabo, no necesito mucho.</p>

<p>—Está intentando convencerse de eso, ¿verdad? ¿Cuándo piensa partir hacia el castillo de Esposa?</p>

<p>—Aún no hay planes.</p>

<p>—... Pero prometió llevarme consigo cuando se casara.</p>

<p>Parecía una promesa hecha de pasada, hacía años. Inés se encogió de hombros.</p>

<p>—Este lugar no puede albergar a más sirvientes.</p>

<p>—¿Sirvientes? ¿Qué sirvientes? Apenas hay una ama de llaves, un mayordomo, un cochero, un jardinero, dos cocineras, tres criadas, tres lacayos...</p>

<p>—... Eso es bastante, ¿no?</p>

<p>En relación con el tamaño de la residencia, sí. De alguna manera, el número de empleados no parecía corresponder con el tamaño de la mansión, una sospecha que surgió en la mente de Inés. Algunos de ellos ni siquiera dormían en la residencia, sino que aparentemente se alojaban en otros lugares y solo aparecían por la mañana.</p>

<p>En la residencia anterior, el número era modesto para su tamaño, pero sin saber nada de eso, le parecía extraño, como si no bastara con amontonar todas las posesiones imaginables en una casa pequeña, sino que además emplearan a gente de forma extravagante.</p>

<p>¿Había estado tan desinteresada en los asuntos domésticos que, incluso después de años, aún no había comprendido lo básico...? Inés, algo escéptica sobre la practicidad de Cárcel, le preguntó a Raúl.</p>

<p>—¿No se suele contratar a unos tres sirvientes para un lugar como este?</p>

<p>—Probablemente... ¿Pero tres? Eso es absurdo. Tres ni siquiera darían abasto para limpiar las botas del Capitán Escalante.</p>

<p>—El Capitán Escalante se las pule él mismo ahora.</p>

<p>Raúl miró la residencia con una expresión desinteresada que parecía decir: “Bueno, es natural cuando se vive en una ratonera tan bonita”, antes de responder.</p>

<p>—¿El Capitán Escalante no tiene ninguna intención de trasladar la residencia? ¿Ni siquiera después de traer a la señora Inés hasta aquí?</p>

<p>—Probablemente sea la mejor casa de Logorño. Al fin y al cabo, no hay muchas más grandes que esta...</p>

<p>—Parece que hay bastantes cerca del cuartel general.</p>

<p>—Ahí es donde residen los de rango considerablemente más alto. ¿No sería una falta de respeto?</p>

<p>—¿Qué más da? El marido de la señora Inés es el heredero de la familia Escalante.</p>

<p>Sin que ellos lo supieran, Cárcel Escalante había vivido solo en la enorme mansión donde residía el coronel, comportándose con la arrogancia y la insolencia propia del heredero de la familia Escalante. Así, la innecesaria discusión continuó hasta que se acomodaron en los asientos del jardín.</p>

<p>—En primer lugar, fueron construidas en masa por la Familia Imperial. Están destinadas a que los oficiales se alojen en ellas mientras están de servicio. Esta es perfectamente adecuada.</p>

<p>—Pero la señora Inés no es una oficial.</p>

<p>—Me casé con uno.</p>

<p>—Deje el papel de pobre funcionario al Capitán. ¿Por qué no vamos ahora al castillo de Esposa?</p>

<p>—¿Para que pueda llevarte conmigo?</p>

<p>—Sí.</p>

<p>Raúl asintió con la cabeza como si fuera obvio. Inés soltó una risita ahogada.</p>

<p>—¿Y tu ciudad natal?</p>

<p>—¿Qué significado tiene una ciudad natal para un huérfano?</p>

<p>—¿Aunque todos tus conocidos estén en Pérez?</p>

<p>—Usted no estará allí, señora Inés.</p>

<p>En la primera vida, ella lo explotó hasta la extenuación; en la segunda, ni siquiera recordaba lo que había pasado; en la tercera, simplemente lo abandonó...</p>

<p>Sin embargo, al final, él era como un perro fiel, esperando solo a que ella lo llamara. Eso le dejó un sabor amargo en la boca.</p>

<p>—... Nunca cambias, Raúl.</p>

<p>—Sin embargo, solía decir que empeoraba con cada día que pasaba.</p>

<p>El propio Raúl apenas podía comprender la profundidad de esa constancia.</p>

<p>Raúl, solo dos años menor que ella, había comprendido las costumbres del mundo mucho antes que ella; en algunos aspectos, era muy perspicaz, un tipo inteligente con un don para tratar con la gente. Sin embargo, también era lo suficientemente puro como para obsesionarse sin cesar con la breve amabilidad que ella le había mostrado en su juventud.</p>

<p>—Has llegado a ser alguien incluso en Pérez.</p>

<p>—¿De qué me sirve mi ascenso en un lugar donde no está la propia señora Inés?</p>

<p>—¿Cómo piensas manejar el territorialismo de Esposa? Ese lugar, al igual que Pérez, tiene familias que han servido a la familia Escalante durante generaciones.</p>

<p>—Mi origen será suficiente.</p>

<p>—Supongo que yo seré tu origen, entonces.</p>

<p>—Es totalmente incapaz de cuidar de sí misma, así que nos necesitará a Juana y a mí.</p>

<p>Raúl respondió con firmeza. Inés le acarició la cabeza, aparentemente complacida.</p>

<p>—Agradezco el sentimiento, pero Juana debe casarse con alguien en Pérez. Y tú también.</p>

<p>—Me temo que ya tengo planes de encontrar una mujer para casarme en Esposa, señora Inés.</p>

<p>—No querría que abandonaras tu tierra natal por mí.</p>

<p>—Lo quisiera o no, Juana acudiría a su llamado en un instante.</p>

<p>—Tercos... Muy bien. Si voy a Esposa, que así sea.</p>

<p>—En cualquier caso, todas estas pertenencias deben enviarse al castillo de Esposa. Procederé a Esposa según lo previsto, observaré la situación local allí y también investigaré más a fondo al Duque y la Duquesa Escalante.</p>

<p>—Haz lo que quieras. Aun así, pasa la noche aquí. Se tarda más de medio día en llegar a Esposa desde aquí... Debes de haberte levantado al amanecer para prepararte.</p>

<p>—... Me pregunto si habrá alguna habitación libre en las dependencias del servicio...</p>

<p>Raúl puso una expresión escéptica. Inés le dio una palmadita en el hombro, como para decirle que no se preocupara.</p>

<p>—Hablaré con Alondra.</p>

<p>—Será mejor seguir su consejo, ya que no podemos dejar las pertenencias de la señora Inés en una posada. Yo mismo hablaré con el mayordomo. Por favor, no se preocupe por un asunto tan insignificante. Si no hay habitaciones, buscaré una posada cerca del Cuartel Naval.</p>

<p>—No hagas eso. Aunque dudo que alguien te robe, conociendo tu temperamento, probablemente te quedarías despierto toda la noche vigilándolos...</p>

<p>—No hace falta decirlo.</p>

<p>—Siento no haberte dicho antes que no necesitaría mucho. Te he causado problemas innecesarios.</p>

<p>—Sé que lo necesita todo. Es solo que no hay sitio para guardarlo.</p>

<p>Era cierto. Aun así, era una época en la que apenas sentía ninguna carencia. Días sin preocupaciones, como un cerdo bien alimentado...</p>

<p>Inés sonrió levemente y dijo:</p>

<p>—Me gusta este lugar, Raúl. Las vistas desde aquí también son preciosas.</p>

<p>—Habiendo vivido toda su vida en lugares parecidos a palacios, experimentar un lugar como este debe de ser toda una aventura.</p>

<p>—Quizás.</p>

<p>—Aun así, ¿no podría revisar sus pertenencias y seleccionar algunas cosas usted misma? Juana ha elegido cuidadosamente algunos artículos que pensó que podría necesitar de inmediato... Si enviamos todo a Esposa, podría encontrarse con inconvenientes más adelante.</p>

<p>—Bien. Hagámoslo.</p>

<p>Fue el momento en que ella aceptó sin más y se levantó primero.</p>

<p>Raúl se levantó apresuradamente a su vez y luego se inclinó hacia algún lugar. Aunque ella se había levantado claramente primero, fue él quien se levantó primero.</p>

<p>Era la misma cortesía profunda que ella había presenciado cuando se dirigía a su padre en el castillo de Pérez.</p>

<p>Siguiendo la profunda reverencia de Raúl como si fuera lo más natural del mundo, la mirada de Inés se dirigió gradualmente hacia la residencia.</p>

<p>—Veo que tenemos un invitado.</p>

<p>Cárcel, que había regresado a casa sin que nadie se diera cuenta, estaba apoyado en la terraza del primer piso, observándolos.</p>

<p>Por alguna razón, su expresión denotaba un sutil descontento.</p>


<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—No esperaba que volvieras tan pronto.</p>

<p>—Hoy nos hemos saltado el entrenamiento.</p>

<p>—Pero aún no he preparado nada. ¿Qué hago?</p>

<p>—De todos modos, tú no preparas nuestras comidas, Inés.</p>

<p>—Al menos hasta ahora fingía tener algo que hacer...</p>

<p><span style="font-style:italic">Fingir tener algo que hacer...</span> Como para reconocerlo, Cárcel asintió con la cabeza de forma superficial y entró en el dormitorio. Pero añadió con ligereza: “Yolanda es buena cocinera, así que podemos comer lo que nos prepare”.</p>

<p>Entonces, mientras el mayordomo le ayudaba a quitarse la chaqueta del uniforme, Inés lo siguió al vestidor sin mostrar ningún signo de vergüenza. Su expresión se había vuelto ligeramente seria.</p>

<p>Que una noble se ocupara personalmente de las comidas de su marido con sus propias manos era algo impensable para cualquier persona en su sano juicio, pero, como mínimo, supervisar a los sirvientes era deber de la señora de la casa. Por lo tanto, era natural que la señora de la casa tuviera algo que decir, por poco que fuera, sobre la comida que entraba en la boca de su marido o en asuntos como la cena que compartían. Aunque no le importara, fingir que le importaba era precisamente la virtud de una esposa Ortega.</p>

<p>Desempeñar esas tareas domésticas tan triviales y servir a su marido era, al fin y al cabo, el anticuado deber de una dama refinada... No hace falta decir lo anticuado que era ese deber. Sin embargo, en el caso de Inés, si su deber era decir “Te he preparado la cena” después de pasar todo el día holgazaneando y limitarse a responder con unas pocas palabras a la pregunta de un sirviente al atardecer, estaba dispuesta a aceptarlo.</p>

<p>Por muy fácil y cómodo que fuera, no deseaba hacer ni siquiera eso durante el resto de su vida.</p>

<p>Aunque se dio cuenta tarde, Inés no quería convertirse en una esposa negligente. Más concretamente, no quería ser una esposa insincera y, además, no quería dar “esa impresión”. Fue un paso adelante en su determinación de no vivir nunca su vida como la esposa o la pareja de alguien.</p>

<p>El abogado lo había dicho. En realidad, eran estas pequeñas cosas las que se acumulaban y acababan convirtiéndose en pruebas presentadas ante el tribunal.</p>

<p>Aunque Cárcel no sintiera ninguna emoción, podía ser considerado una molestia por quienes le rodeaban. Innumerables veces, cosas que los propios individuos ni siquiera recordaban salían a la luz en los tribunales de divorcio a través del testimonio de otros. Inés se dio cuenta de cuántos pensamientos había enviado subrepticiamente en las ondas de Calstera y miró al mayordomo por encima del hombro de Cárcel.</p>

<p>A diferencia de Alondra, que interpretaría a Inés disfrutando del sol, tumbada y dormida en el sofá del salón, como “Qué pena que una dama tan distinguida esté echando la siesta aquí…”, el mayordomo, que caminaba con cada paso en estricta conformidad con los modales de Mendoza, ¿qué pensaría de la esposa de su amo?</p>

<p>Ella le preguntó, imbuida de su propia calidez.</p>

<p>—¿Así que no entrenas todos los días?</p>

<p>—Soy perezoso por naturaleza, así que no puedo hacerlo.</p>

<p>Sorprendentemente, la respuesta reveló solo sinceridad, sin rastro de modestia. No era el tipo de cosa que se diría después de saltarse un solo día de entrenamiento voluntario, algo que nadie les obligaba a hacer.</p>

<p>Y eso fue delante de Inés, que, desde su llegada a Calstera, se había pasado los días comiendo y durmiendo.</p>

<p>—Ya veo. Entonces eres un poco perezoso.</p>

<p>Pero Inés no tenía ni pizca de vergüenza.</p>

<p>—Es fácil que un día libre se convierta en dos, y luego en tres, ya sabes.</p>

<p>—Suenas igual que mi abuelo.</p>

<p>—Qué honor que mi comentario descuidado, hecho sin saberlo mejor, se haga eco del máximo honor del Almirante Calderón…</p>

<p>—Ahora que lo pienso, los dos tienen personalidades similares.</p>

<p>—Pero no insultes a tu difunto abuelo.</p>

<p>—No tienen una buena personalidad.</p>

<p>No negaba que el carácter de Inés fuera bastante malo, al igual que el de su abuelo; simplemente lo afirmaba como un hecho. Inés se limitó a encogerse ligeramente de hombros, como si no fuera un insulto.</p>

<p>—En cualquier caso, si fueras perezoso, el mundo estaría lleno de gente muriéndose de hambre. Cárcel.</p>

<p>—¿Es eso un cumplido?</p>

<p>—Es la verdad, es notable.</p>

<p>Era un raro ejemplo de elogio generoso más allá de la mera apariencia. El tipo de halago que nunca había oído en Mendoza, ni en la hacienda de Pérez en Valeztena, ni en el castillo de Escalante en Esposa.</p>

<p>Ante su inusual cumplido, Cárcel se rió suavemente, se dio la vuelta y se quitó la camisa, entregándosela al mayordomo.</p>

<p>Su espalda, aparentemente abrumadora para quienes lo observaban desde atrás, se distorsionó hasta alcanzar una forma perfecta con el movimiento de sus músculos dorsales, y luego volvió a su forma esculpida original.</p>

<p>Un recuerdo lejano afloró inesperadamente: alguien una vez saboreó la mención de esos hermosos omóplatos en forma de alas y la elegante curva de su columna vertebral. La esencia de Cárcel Escalante no residía en un rostro esculpido por los dioses, sino en esa espalda y ese pecho que él mismo había forjado.</p>

<p>Luego venían los flancos gruesos y tal... Creo que cerró los oídos en ese momento. Porque, por lo general, lo siguiente que se mencionaba eran las nalgas y la parte inferior del cuerpo.</p>

<p>Aunque no le importaba lo más mínimo, los elogios de la cabeza a los pies eran tan variados que el simple hecho de oír el nombre de Cárcel se volvía agotador, algo del pasado. Probablemente era una de las nobles de Mendoza, una amiga de una vida anterior.</p>

<p>En cuanto a las nobles con las que Cárcel se había acostado en esa vida, eran demasiado numerosas para contarlas, y lo mismo ocurría con sus “amigas” excesivamente sociables, lo que dificultaba su identificación. Sin embargo, al escuchar las historias de sus amigas mientras se recostaba tranquilamente en el salón, un recuerdo poco común afloró como un grato recuerdo de tiempos pasados.</p>

<p><span style="font-style:italic">... Hubo un tiempo en que noches como aquellas eran mi única satisfacción.</span></p>

<p>Ahora, esas cosas le resultarían agotadoras. Las horas que pasaba adornada con las mejores galas, rodeada de gente. Los momentos en que ejercía control sobre la nobleza como una tirana. Y los agotadores días que pasaba soportando las indignidades de la corte imperial, obligada a mantener una sonrisa perpetua…</p>

<p>Todos esos tiempos se desvanecieron, dejando solo a los protagonistas de la historia. La historia de Cárcel era más ruidosa y primitiva que la suya, pero... independientemente de eso, ni los que chismeaban sobre ella ni los que chismeaban sobre él permanecieron. Solo ellos estaban aquí, en Calstera.</p>

<p>Qué profundamente significativo puede ser a veces el gesto de señalar con el dedo de un niño de seis años. Ese simple gesto de señalar con el dedo desde la infancia transformó tanto su vida como su existencia en formas completamente diferentes.</p>

<p>Inés sintió de repente una sensación de asombro y lo miró fijamente sin comprender.</p>

<p>Con calma, se puso una nueva camisa para estar en casa, se giró a medias y se quitó con pulcritud las botas militares. Aunque un mayordomo lo atendía como cabría esperar de un caballero aristocrático, daba la sensación de que podía arreglárselas perfectamente sin él.</p>

<p>En Mendoza, parecía incapaz de abrocharse un solo gemelo, pero aquí estaba solo, cambiándose de ropa con el mayordomo simplemente de pie a su lado como una formalidad. Solo daba a sus sirvientes las tareas y quehaceres mínimos. Acostumbrado a hacer las cosas por sí mismo, el papel del mayordomo se limitaba a colocar los zapatos nuevos preparados de antemano y recoger sus botas en una bandeja.</p>

<p><span style="font-style:italic">¿Vivía tan desfavorecido incluso en Mendoza?</span></p>

<p>En una sociedad en la que ni siquiera tocar los cordones de los zapatos se consideraba aristocrático, era bastante refrescante ver a alguien con un rostro tan aristocrático actuar así. Por otra parte, en la academia militar, debía de haber tenido que ocuparse de todo él mismo desde el principio hasta el final…</p>

<p>—¿No necesitas ayuda?</p>

<p>—¿Vas a ayudarme?</p>

<p>—Si hubiera algo en lo que pudiera ayudarte.</p>

<p>Aunque parecía poco probable... Su expresión se sumó a las palabras mientras ofrecía una cortesía vacía.</p>

<p>Él, que había estado desabrochándose el cinturón de cuero, se volvió para mirarla, con el ceño ligeramente fruncido, como si hubiera oído mal. Entonces, tras un momento, las comisuras de su boca se curvaron en una sonrisa torcida.</p>

<p>—¿Así que vas a desabrocharme los pantalones tú misma?</p>

<p>Por supuesto, eso era imposible. Ella tenía la intención de ayudarle a cambiarse de ropa, al igual que había añadido unas palabras durante la cena y había declarado que no estaba “preparada”. Es decir, simplemente observando en silencio desde un lado.</p>

<p>No le había dado la bienvenida a casa ni le había preparado la cena, así que este era su intento de compensarlo, como diciendo: “Al menos, mira esto”. Pero mientras Inés, sorprendida por la inesperada reacción de Cárcel, dudaba en responder, el cinturón se le resbaló de la mano y cayó en la del mayordomo.</p>

<p>—Si me pones las manos encima, no acabará solo con quitarme los pantalones.</p>

<p>—...</p>

<p>Cárcel se desabrochó la parte superior de los pantalones y lo dijo con naturalidad. Su tono carecía de emoción, pero su significado era inequívoco. Inés se encontró mirando primero al mayordomo y, unos segundos después, sintió que se sonrojaba cuando este apartó rápidamente la mirada.</p>

<p>—Llevaría tiempo cambiarme por completo, así que rechazaré tu ayuda.</p>

<p>Pronto, Cárcel se había quitado los pantalones de su uniforme, de corte impecable, y se había puesto unos pantalones beige tejidos con la tela ligera típica de la región suroeste. Ella volvió a mirarlo, después de haber desviado brevemente la mirada por cortesía mientras él se cambiaba.</p>

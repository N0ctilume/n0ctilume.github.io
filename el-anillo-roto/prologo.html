body {

.separador {

#acceso-denegado div {

.controles {

    bottom: 20px;

.control {
    height: 36px;

    border-radius: 5px;

    color: #333;

    font-family: Arial, sans-serif;
    font-size: 14px;

.control:hover {
    background: #eeeeee;
}

#fuente {
    height: 36px;
    border: 1px solid #aaa;
    border-radius: 5px;
    padding: 0 8px;
    background: white;
    color: #333;
    font-size: 13px;
    cursor: pointer;

body.oscuro {
    background: #181818;
    color: #dddddd;
}

body.oscuro .controles {
    background: rgba(35,35,35,.95);

body.oscuro .control,
body.oscuro #fuente {

    }

    .controles {
        right: 10px;
        bottom: 10px;
        max-width: calc(100% - 20px);
        overflow-x: auto;
    }
}

                            <p>

            <p>

            <p>

            <p>

            <p>

            <p>

            <p>

            <p>

            <p>

            <p>

            <p>

            </p>

            <p>
                    Quizás era porque su marido había muerto y ella acababa de saborear la libertad. Aunque la seguía considerando bastante ingenua, no vio necesidad de darle ningún consejo. No había necesidad de contarle a una mujer lo mucho que él mismo se había revolcado en el barro.

            <p>
                    Sería bastante ridículo que alguien que se había revolcado en el barro diera lecciones de precaución a los demás. El lugar al que se dirigía Cárcel era un lugar por el que nadie pasaría de todos modos. Cuando el sonido de los pasos se desvaneció, la condesa en sus brazos habló con cautela.

            <p>

            <p>

            <p>

            <p>
                    La Condesa Portillo miró a Cárcel con los ojos llenos de emoción, como si realmente fuera una víctima indefensa en una situación desesperada.

            <p>
                    —Pensar que una persona tan excepcional protege el dominio de Ortega... me conmueve profundamente.
            </p>

            <p>

            </p>

            <p>
                    Cárcel Escalante de Esposa. Ese nombre largo y honorable y ese aspecto impecable. Vestido con el uniforme blanco de la marina, era una obra maestra creada por una deidad decidida a hacer babear a cualquiera. No era de extrañar que mujeres nobles perfectamente cuerdas —o, lo que era aún más desagradable, incluso hombres— a veces perdieran el sentido y se le echaran encima.
            </p>

            <p>

            </p>

            <p>
                    —Se enlistó para continuar con la devoción de su abuelo, quien dedicó toda su vida a proteger a Ortega. Para seguir el honorable camino recorrido por generaciones de su familia... Aun así, debo confesar que al principio me dejó realmente asombrada. Es el heredero de Escalante, por el amor de Dios, y el mar de Nuñera sigue siendo un lugar peligroso donde aún se producen con frecuencia escaramuzas y batallas a gran escala. Aunque su abuelo, el gran Almirante Calderón, obtuvo una gran victoria sobre los tálanos en la batalla de Nuñera, lo que trajo una breve paz, los piratas tálanos siguen campando a sus anchas con cada cambio de marea…
            </p>

            <p>
                    Las huellas de su diligente estudio eran evidentes. Encantada con el uniforme, se olvidó de su enfermizo rostro maquillado y soltó lo que había memorizado.
            </p>

            <p>

            </p>

            <p>
                    —En efecto.
            </p>

            <p>
                    —Mi abuelo siempre decía: “Ocupar la posición más honorable, conlleva a asumir la mayor responsabilidad”.
            </p>

            <p>
                    Cárcel recitó las pulidas palabras con la misma mecánica que las máquinas hiladoras de la fábrica textil. La Condesa parecía emocionada por su impecable comportamiento, y respiraba entrecortadamente.
            </p>

            <p>
                    Y justo cuando pensó: “Esto se está volviendo un poco peligroso”, ella prácticamente saltó de la plataforma y se abalanzó sobre él.
            </p>

            <p>
                    —Condesa, aquí…
            </p>

            <p>
                    —Por favor, en cualquier sitio está bien.
            </p>

            <p>
                    —Al menos, entremos en la habitación.

            <p>

            <p>
                    —No quiero. La habitación está demasiado oscura…

            <p>
                    —¿Qué importa si está oscura?
            </p>

            <p>
                    —Uniforme, quiero ver más su uniforme...
            </p>

            <p>

            </p>

            <p>
                    <em>¿Por qué todas se volvían así de locas cada vez que lo veían?</em> Un autorreproche rayano en el egocentrismo lo hizo dudar por un momento, pero fue fugaz.
            </p>

            <p>
                    Porque los pechos apenas ocultos, bañados por la tenue luz, se balanceaban seductoramente.
            </p>

            <p>
                    Los Grandes de Ortega. El único heredero de la Familia de Escalante, una de las diecisiete familias nobles honradas con un título de la Corte Imperial de Ortega, era tan llamativamente guapo que cualquiera perdería el sentido al ver su rostro, a pesar de su formidable origen. Era como si Dios le hubiera concedido el derecho a vivir imprudentemente toda la vida.
            </p>

            <p>
                    Y su firme convicción siempre había sido que no había necesidad de rechazar laboriosamente un regalo que llegaba por sí solo. Ya fuera el caparazón de una belleza divina e inigualable, el afecto de las mujeres, las miradas de admiración de hombres y mujeres, jóvenes y viejos por igual, o una mujer hermosa que se quitaba la ropa en medio de un pasillo, declarando: “Vamos a intentarlo…”

            <p>
                    A pesar de su carácter naturalmente taciturno y brusco, había sido un joven imprudente desde el principio. De los quince a los diecisiete años, cuando era cadete con su uniforme de la academia militar, a donde iba, multitudes de admiradoras lo acosaban. A los veinte, cuando se alistó en la marina, había conocido a mujeres más maduras, más adultas y menos propensas a causar problemas.

            <p>
                    Y ahora, a los veintitrés, estaba en la flor de la vida.
            </p>

            <p>
                    Cárcel la tomó en sus brazos, la hizo girar y la inmovilizó contra la pared. La técnica de la mujer era increíblemente torpe, ya que se precipitó a besarlo, pero su pasión, sin tener en cuenta el lugar, era encomiable.

            <p>

            </p>

            <p>
                    <em>Bueno, una vez no hará daño.</em>
            </p>

            <p>
                    Mientras él le agarraba el pecho y dejaba que sus labios recorrieran suavemente el escote de ella, la expresión de la Condesa se contorsionó con éxtasis. Mientras ella se subía descuidadamente el dobladillo del vestido hasta la cintura, las exigentes manos de él abrochaba meticulosamente de nuevo el cuello para que no se saliera ni un solo hilo del uniforme.
            </p>

            <p>

            <p>

            <p>

            </p>

            <p>
                    Las palabras que fluían de la voz de la Condesa y un pensamiento que había pasado brevemente por su mente... No era por eso por lo que se había alistado...
            </p>

            <p>

            <p>
                    —...
            </p>

            <p>

            <p>
                    —Si su rostro no es especialmente bonito, al menos sus acciones podrían serlo, hmph, o si tuviera un carácter suave y gentil...
            </p>

            <p>
                    Ni siquiera los chismes eran agradables. Cárcel se quedó mirando la pared durante un momento y luego, irritado, giró la cabeza, evitando exquisitamente los labios de la Condesa. Fue en ese instante, cuando su mirada se desvió naturalmente hacia un lado.
            </p>

            <p>
                    —...Con un prometido tan perfecto como usted a su lado, ¿cómo puede lucir tan rígida y aburrida? Como si fuera una monja o algo así...
            </p>

            <p>
                    Inés Valeztena los observaba.
            </p>

            <p>
                    Con su característica expresión rígida y aburrida, parecida a la de una monja en una capilla.
            </p>

            <p>
                    Después de diecisiete años de compromiso, era la primera vez que lo pillaban.
            </p>

<p>Era justo después de que hubiera pasado la breve temporada de lluvias.</p>

<p>La calle Santalaria, que atraviesa la capital, Mendoza, normalmente estaría repleta de todo tipo de carruajes pomposos y gente, pero tal vez debido al clima bastante desagradable, no era como de costumbre.</p>

<p>Solo los monótonos carruajes oficiales utilizados por las oficinas gubernamentales, unas pocas carretas cargadas de mercancías y varios carruajes privados que iban con prisa avanzaban con cautela por la amplia carretera.</p>

<p>Era el tipo de clima en el que, tras un breve paseo, la humedad se adhería a cada pliegue de la ropa. ¿Y qué decir de los charcos esparcidos por la amplia carretera? Si el cochero apartaba la vista aunque fuera por un momento, el carruaje se tambaleaba como si estuviera borracho.</p>

<p>El carruaje de la familia de Escalante no era una excepción.</p>

<p>—...</p>

<p><span style="font-style:italic">Pum.</span> Las ruedas del carruaje se hundieron en otro charco, luego golpearon una piedra y rebotaron; la sacudida se sintió en todo el carruaje. Cárcel, como si pagara el precio por haberse quitado el uniforme, murmuró maldiciones entre dientes, sin cambiar su elegante expresión.</p>

<p>Sin embargo, la mente del futuro Duque, que había maldecido brevemente al cochero incompetente, volvió rápidamente a aquel día.</p>

<p>Aquel día, la repentina sensación de alienación había sido quizás el instinto del tramposo.</p>

<p>Había una razón por la que el recuerdo de Inés Valeztena había sido tan vívido. Porque era real.</p>

<p>Cárcel dio unos golpecitos al cojín que rodaba junto a su pierna mientras reflexionaba. A diferencia de su postura relajada, con el pelo revuelto y recostado, su mente estaba confusa al recordar aquella inquietante escena.</p>

<p><span style="font-style:italic">Aquel día, aquel día…</span></p>

<p>Cárcel recordó algunas palabras más que había dicho la Condesa y que antes le habían pasado desapercibidas.</p>

<p><span style="color:#777777">—Pero fíjese en el atuendo de monja de su prometida. Incluso en un banquete real... Cualquiera que la viera por primera vez no la asociaría con el prestigio del Ducado Valeztena.</span></p>

<p>Un ojo observador habría notado que su atuendo de monja costaba más que su propio collar. El Duque Valeztena no escatimaba en gastos para su única hija.</p>

<p><span style="color:#777777">—Además, qué arrogante es con las otras damas. Si fuera testigo de ese comportamiento…</span></p>

<p>No era una persona bondadosa. Tampoco era de las que hacían amigos.</p>

<p><span style="color:#777777">—... Así que lo ha oído todo.</span></p>

<p>Él solo tenía intención de escuchar. Lo que había visto era peor. Y así, de forma poco habitual en él, Cárcel se sintió abrumado por la culpa.</p>

<p><span style="font-style:italic">Culpa.</span> Culpa hacia Inés Valeztena, esa misma mujer que era la raíz de todos sus males.</p>

<p>Entrecerró los ojos y miró fijamente al espacio vacío frente a él, pero, por alguna razón, no conseguía recordar la expresión de Inés.</p>

<p>El recuerdo era tan borroso como la incómoda sensación de aquel momento. Su rostro aquel día, su expresión aquel día.</p>

<p>Era de los que olvidaban rápidamente los recuerdos desagradables, pero esto... no era tanto desagradable como…</p>

<p>—... Capitán, hemos llegado.</p>

<p>Cárcel negó ligeramente con la cabeza y bajó del carruaje. Era la finca Valeztena. Una magnífica mansión, una miniatura perfecta de la vasta finca de la región de Pérez gobernada por el Duque.</p>

<p>La residencia del Duque Valeztena se erigía como un castillo que dominaba la finca, encaramada en un terreno elevado con vistas a la sección sur de la calle Santalaria.</p>

<p>En consecuencia, cualquier invitado que llegara aquí disfrutaba de una vista panorámica de Mendoza en el momento en que bajaba del carruaje, como si fuera el propio Emperador. Un lujo impresionante. Sin embargo, Cárcel se dio la vuelta sin mostrar la más mínima emoción.</p>

<p>Su padre, el Duque Escalante, había comentado en privado que la mansión era tan grandiosa que rayaba en lo vulgar. Sin embargo, cada vez que Cárcel se encontraba allí, no sentía más que un nudo en la garganta. Sus visitas aquí eran principalmente para acompañar a Inés Valeztena, o en ocasiones para desempeñar el papel de su prometido, y nada le recordaba más crudamente su futuro que eso.</p>

<p>Momentos en los que no podía evitar imaginar las horas sofocantes que le esperaban, o la vasta extensión de una vida entera a su lado. Cosas que le oprimían la garganta con solo imaginarlas.</p>

<p>—Capitán Escalante, la señorita Inés lo espera en el salón.</p>

<p>Ahí lo tenía. Ya le costaba respirar.</p>

<p>Aunque ya había llevado una vida completamente promiscua, Cárcel seguía atrapado en una mentalidad bastante conservadora que, después de casarse, tendría prohibido ver a ninguna otra mujer que no fuera su esposa.</p>

<p>Era una especie de fibra moral irreversible que iba directamente en contra de la tendencia vulgar de “hazlo” de la sociedad de Mendoza; irónicamente, ahora se había convertido en su propia motivación vulgar. Al mismo tiempo, había convertido su matrimonio en una tumba.</p>

<p>Después del matrimonio, no podía morir. Por lo tanto, ahora tenía que revolcarse aún más diligentemente.</p>

<p>Solo así podría vivir el resto de su vida como un monje sin remordimientos.</p>

<p>Cárcel Escalante necesitaba un recuerdo miserable que atesorar algún día.</p>

<p>Una prometida anunciada unilateralmente con solo seis años era una cosa, pero una esposa con la que había intercambiado votos ante el cardenal era otra muy distinta. Esta vida de perro pronto se convertiría en pasado. Y así tenía que ser.</p>

<p>Cada vez que Cárcel recordaba a la hija de seis años del Duque Valeztena, que lo había elegido por capricho y había descarrilado el curso de toda su vida, sentía una rabia indescriptible, irritación y otras emociones molestas. Sin embargo, hacia la Inés Valeztena de veintitrés años, sentía un deber tan sólido como una celda de prisión.</p>

<p>La realidad que había pospuesto durante más de seis años —ingresar en la academia naval, alistarse en la marina— se acercaba cada vez más.</p>

<p>Ella era ahora una mujer más cercana al día en que se arrodillara a los pies del cardenal junto a él para recibir su bendición de lo que había estado diecisiete años antes.</p>

<p>—Lord Escalante.</p>

<p>—... Inés.</p>

<p>Y así, se encontró enfrentándose a este sentimiento de culpa totalmente desconocido. Una culpa y una vergüenza a medio formar por no haber sido al menos sorprendido por ella.</p>

<p>—Pase.</p>

<p>Una voz, tranquila y serena, le dio la bienvenida. Cárcel se acercó a ella y besó el dorso de su mano elegantemente extendida.</p>

<p>Lo que volvió a encontrar ante sus ojos fue el mismo atuendo impecablemente modesto, que la cubría hasta la nuca sin dejar nada al descubierto.</p>

<p>Por encima, un rostro sencillo, sin rasgos marcados, pero tampoco especialmente bello, con ojos siempre rectos y recatados, y cabello negro azabache medio peinado hacia atrás y recogido. En el recuerdo difuso en el que las expresiones nunca se habían formado del todo, su rostro se volvió nítido.</p>

<p>Sí. Incluso entonces, su expresión había sido así. La expresión de alguien que parecía incapaz de enfadarse o reír, simplemente mirando a la gente en silencio.</p>

<p>—Entiendo que tiene asuntos que discutir.</p>

<p>—Tenía asuntos que atender ayer, hace cuatro días, hace medio mes…</p>

<p>—Era temporada de lluvias. Esperaba que Su Excelencia no se esforzara demasiado por mi culpa.</p>

<p>Las palabras transmitían una apariencia de consideración cortés, pero ignoraban casualmente el hecho de que ella misma había ignorado sus intentos de ponerse en contacto con ella.</p>

<p>Era la primera vez que Inés lo trataba con tal desprecio. Y era natural. ¿Qué prometida no se enfadaría? Al ver a su prometido envuelto con una noble semidesnuda por primera vez.</p>

<p>Cárcel torció los labios.</p>

<p>—Sé lo que debiste haber pensado ese día.</p>

<p>Volvió a abandonar el tono formal tras solo una frase, como si estuviera exasperado. Al fin y al cabo, nunca había habido formalidad entre ellos, ni hace diecinueve años cuando eran compañeros de juegos. Por supuesto, al final, no quedaba ni juego ni amistad... porque Inés odiaba jugar, odiaba a los amigos y también lo odiaba a él.</p>

<p>Y, sin embargo, con un simple gesto de señalar con el dedo, ella había elegido a Cárcel, y no a su primo, el Príncipe Heredero, y lo había empujado a su tediosa vida. Cárcel se obligó a recordar ese hecho.</p>

<p>Sí, tenía que recordar por qué se vería obligado a vivir el resto de su vida como un monje. Nunca había querido casarse. Tenía que alejar esa culpa con ese sentimiento irritante y exasperante, para resolver esta situación…</p>

<p>—Me temo que no le sigo, Lord Escalante.</p>

<p>—Sabes perfectamente de lo que estoy hablando.</p>

<p>—En absoluto.</p>

<p>Sus palabras fueron interrumpidas una vez más por la voz sumisa de Inés. Si fuera realmente sumisa, no interrumpiría a los demás. ¿Y la idea de que Inés fuera sumisa con él? Era una completa tontería, viniendo de alguien que podía influir en la vida de otra persona con solo señalar con el dedo.</p>

<p>—Inés.</p>

<p>—No es precisamente una conversación agradable para ninguno de los dos. ¿De verdad tenemos que tenerla?</p>

<p>Pero Inés Valeztena lo amaba.</p>

<p>Porque lo amaba, lo eligió a él. Porque lo amaba, renunció a la voluntad de la Familia Imperial. Renunció al estatus imperial que le habían prometido antes de nacer. Renunció a las pocas oportunidades que tenía de volver a empezar desde cero.</p>

<p>Porque lo amaba, lo esperó. Hace diecisiete años, y ahora. Siempre. En el mismo lugar.</p>

<p>Y para Cárcel, ese siempre había sido el problema.</p>

<p>Que Inés Valeztena lo amara, y que él no amara a Inés Valeztena en absoluto.</p>

<p>Quizás lo que le ahogaba no eran sus vestidos sofocantes ni su rostro inexpresivo. Tampoco era del todo su sentido de victimismo, que la vida le había jugado una mala pasada.</p>

<p>Él no tenía nada que darle a cambio. En el mejor de los casos, un engaño para no herir sus sentimientos, una confusión insaciable... y una culpa que arrastraba desde hacía mucho tiempo.</p>

<p>—Puedo explicarlo.</p>

<p>Por supuesto, era una excusa que ni siquiera se acercaba a una explicación. Inés había construido un muro obstinado a su alrededor y, a pesar de su actitud rígida, tenía muchos rincones ingenuos. No necesitaba saberlo todo. Se iban a casar pronto y, en este mundo, había cosas que era mejor dejar en el desconocimiento.</p>

<p>Eso no quería decir que ella no supiera realmente nada, pero incluso si lo supiera…</p>

<p>—Haberlo visto con mis propios ojos es explicación suficiente. Así que no hay ningún problema.</p>

<p>Antes de que Cárcel pudiera siquiera empezar a soltar una excusa decente, ella se encogió de hombros. Él se rió entre dientes y le preguntó:</p>

<p>—... ¿Eso es todo lo que tienes que decir?</p>

<p>—Lord Escalante.</p>

<p>—¿Eso es todo lo que tienes que decir? ¿Eso es todo lo que puedes reunir? Entonces enfádate de verdad conmigo, Inés.</p>

<p>—No estoy enfadada en absoluto.</p>

<p>Incluso sonreía. Una sonrisa que él podría ver una vez al año, si acaso. Cárcel la miró fijamente, completamente atónito, antes de lograr espetar:</p>

<p>—Estás enfadada.</p>

<p>—No lo estoy.</p>

<p>—Y por eso no has querido verme en quince días.</p>

<p>—Era temporada de lluvias. No quería que viniera empapado.</p>

<p>Incluso en medio de todo esto, la sinceridad era palpable.</p>

<p>—Y este tipo de conversaciones me cansan, Lord Escalante. No somos de los que tienen este tipo de conversaciones.</p>

<p>—...</p>

<p>—De todos modos, hay más de una mujer que se le pega en la corte.</p>

<p>—...</p>

<p>—...¿De verdad creía que no me daría cuenta?</p>

<p>Su voz, preguntándole a Cárcel como si estuviera genuinamente sorprendida, se parecía a la de su yo infantil. La familiaridad de una amiga de la infancia con la que había peleado, nada más.</p>

<p>Al fin y al cabo, no era tonta. Cárcel entrecerró los ojos.</p>

<p>—... ¿Y sin embargo no estás enfadada?</p>

<p>—No hay motivo para estarlo. Con quién se reúna es asunto suyo.</p>

<p>—Soy tu prometido, Inés. Nos vamos a casar pronto.</p>

<p>Al darse cuenta de que lo había soltado como un loco, como si sus papeles se hubieran invertido, se echó el pelo hacia atrás nerviosamente. Como si fuera él quien se hubiera enfadado.</p>

<p>En lugar de señalar su contradicción, Inés habló suavemente.</p>

<p>—Eso no significa que ahora esté perdiendo su libertad. Aún no estamos casados.</p>

<p>—...</p>

<p>—Así que siga haciendo lo que le plazca. No se preocupe por mí. Tampoco tiene que darme explicaciones.</p>

<p>—...¿Por qué eres tan “tolerante” con los problemas amorosos de tu hombre?</p>

<p>Preguntó Cárcel con tono sarcástico.</p>

<p>—No es gracioso. Inés, ese tipo de cosas…</p>

<p>—Sí, esto no es tolerancia. Tiene razón.</p>

<p>En lugar de negar con la cabeza, Inés levantó sus suaves ojos verdes. Una brisa húmeda que entraba por la ventana le hizo ondear suavemente el cabello oscuro. Habló en voz baja.</p>

<p>—Significa que no tengo ningún interés en ti. Escalante.</p>

<p>El verano de sus veintitrés años.</p>

<p>Eso fue lo que dijo. Que todo lo que había pasado hasta ese momento no había sido más que una ilusión.</p>

        <div class="controles">

            <select id="fuente" onchange="cambiarFuente(this.value)">
                <option value="Lora">Lora</option>
                <option value="Georgia">Georgia</option>
                <option value="Garamond">Garamond</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Arial">Arial</option>
                <option value="Verdana">Verdana</option>
                <option value="Trebuchet MS">Trebuchet MS</option>
            </select>

            <button class="control" onclick="cambiarTamano(-1)" title="Disminuir tamaño">A−</button>

            <button class="control" onclick="cambiarTamano(1)" title="Aumentar tamaño">A+</button>

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

document.addEventListener("keydown", function(e) {
    if (
        (e.ctrlKey || e.metaKey) &&
        ["c", "x", "s", "u", "p"].includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});

let tamano = 18;

function cambiarFuente(fuente) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    contenido.style.fontFamily = '"' + fuente + '", serif';
    localStorage.setItem("fuenteLectura", fuente);
}

function cambiarTamano(valor) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    tamano += valor;

    if (tamano < 14) tamano = 14;
    if (tamano > 26) tamano = 26;

    contenido.style.fontSize = tamano + "px";
    localStorage.setItem("tamanoLectura", tamano);
}

function modoOscuro() {
    document.body.classList.toggle("oscuro");

    localStorage.setItem(
        "modoLectura",
        document.body.classList.contains("oscuro")
            ? "oscuro"
            : "claro"
    );
}

window.addEventListener("DOMContentLoaded", function() {

    const contenido = document.getElementById("contenido");
    const fuente = document.getElementById("fuente");

    if (!contenido || !fuente) return;

    const fuenteGuardada = localStorage.getItem("fuenteLectura");
    const tamanoGuardado = localStorage.getItem("tamanoLectura");
    const modoGuardado = localStorage.getItem("modoLectura");

    if (fuenteGuardada) {
        fuente.value = fuenteGuardada;
        cambiarFuente(fuenteGuardada);
    }

    if (tamanoGuardado) {
        tamano = parseInt(tamanoGuardado);
        contenido.style.fontSize = tamano + "px";
    }

    if (modoGuardado === "oscuro") {
        document.body.classList.add("oscuro");
    }
});

</script>

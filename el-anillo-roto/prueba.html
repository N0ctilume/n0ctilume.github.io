<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    :root {
      --fondo: #f7f4ee;
      --texto: #252525;
      --texto-secundario: #777;
      --panel: rgba(255,255,255,.94);
      --borde: #d8d2c8;
      --boton: #fff;
      --boton-texto: #333;
      --acento: #9b8062;
      --sombra: 0 8px 28px rgba(0,0,0,.09);
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Lora", Georgia, "Times New Roman", serif;
      line-height: 1.85;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      transition: background .3s, color .3s;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("noctilume.png") center center / cover no-repeat;
      opacity: .035;
      pointer-events: none;
      z-index: 0;
    }

    body.oscuro::before { opacity: .012; }
    body.sepia::before { opacity: .025; }

    .barra-progreso {
      position: fixed;
      z-index: 2000;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(120, 110, 95, .15);
    }

    #progresoLectura {
      width: 0%;
      height: 100%;
      background: var(--acento);
      transition: width .12s linear;
    }

    .contenedor {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 54px 25px 100px;
    }

    .encabezado {
      text-align: center;
      margin-bottom: 45px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-weight: normal;
      letter-spacing: 1px;
      margin: 0;
    }

    .subtitulo {
      margin-top: 8px;
      font-family: "Lora", Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-style: italic;
      color: #080808;
      letter-spacing: .5px;
    }

    .contenido {
      font-family: var(--fuente-lectura, "Lora", Georgia, serif);
      font-size: 18px;
      line-height: 1.85;
    }

    .contenido p {
      margin: 0 0 1.3em;
      text-align: justify;
      text-indent: 2em;
    }

    .separador {
      text-align: center;
      text-indent: 0;
      margin: 0 0 1.8em;
      font-size: 18px;
      line-height: 1.4;
    }

    .bloque-kofi {
      text-align: center;
      margin: 200px 0 60px;
      color: var(--texto-secundario);
    }

    .bloque-kofi p {
      font-family: "Lora", Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-style: italic;
      margin: 0 0 18px;
      line-height: 1.8;
      text-align: center;
      text-indent: 0;
    }

    .boton-kofi {
      display: inline-block;
      padding: 11px 25px;
      border: 1px solid var(--texto-secundario);
      border-radius: 8px;
      background: transparent;
      color: var(--texto-secundario);
      text-decoration: none;
      font-family: "Lora", Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-style: italic;
      transition: background .2s, transform .2s;
    }

    .boton-kofi:hover {
      background: rgba(155,128,98,.10);
      transform: translateY(-1px);
    }

    .seccion-comentarios {
      margin-top: 48px;
      padding: 25px;
      border: 1px solid var(--borde);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--sombra);
    }

    .seccion-comentarios h2 {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      font-weight: normal;
    }

    .descripcion-seccion {
      margin: 0 0 18px;
      color: var(--texto-secundario);
      font-size: 14px;
      line-height: 1.6;
    }

    .comentarios-ayuda {
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(155,128,98,.09);
      color: var(--texto-secundario);
      font-size: 13px;
      line-height: 1.6;
    }

    #giscus-container {
      margin-top: 20px;
      min-height: 80px;
    }

    .controles {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      max-width: calc(100vw - 30px);
      padding: 9px;
      border: 1px solid var(--borde);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--sombra);
      backdrop-filter: blur(12px);
    }

    .control,
    #fuente {
      height: 37px;
      min-width: 39px;
      padding: 0 10px;
      border: 1px solid var(--borde);
      border-radius: 7px;
      background: var(--boton);
      color: var(--boton-texto);
      cursor: pointer;
      font: 13px Arial, sans-serif;
    }

    .control:hover,
    #fuente:hover {
      border-color: var(--acento);
      background: rgba(155,128,98,.08);
    }

    .control.activo {
      border-color: var(--acento);
      background: rgba(155,128,98,.16);
    }

    #fuente { max-width: 145px; }

    .estado-progreso {
      position: fixed;
      left: 18px;
      bottom: 20px;
      z-index: 999;
      padding: 8px 12px;
      border: 1px solid var(--borde);
      border-radius: 20px;
      background: var(--panel);
      color: var(--texto-secundario);
      box-shadow: var(--sombra);
      font: 12px Arial, sans-serif;
      backdrop-filter: blur(10px);
    }

    .boton-salir-concentracion {
      display: none;
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 2100;
    }

    body.concentracion .controles,
    body.concentracion .estado-progreso,
    body.concentracion .encabezado,
    body.concentracion .seccion-comentarios,
    body.concentracion .bloque-kofi {
      display: none !important;
    }

    body.concentracion .contenedor {
      max-width: 760px;
      padding-top: 7vh;
    }

    body.concentracion .boton-salir-concentracion {
      display: inline-block;
    }

    body.oscuro {
      --fondo: #181818;
      --texto: #dddddd;
      --texto-secundario: #aaa;
      --panel: rgba(35,35,35,.96);
      --borde: #505050;
      --boton: #303030;
      --boton-texto: #eee;
      --acento: #c3a17b;
    }

    body.oscuro .subtitulo { color: #aaa; }

    body.sepia {
      --fondo: #eee2c8;
      --texto: #493b2b;
      --texto-secundario: #806e56;
      --panel: rgba(248,239,219,.96);
      --borde: #d2c1a2;
      --boton: #f8efdb;
      --boton-texto: #493b2b;
      --acento: #9b7044;
    }

    body.sepia .subtitulo { color: #806e56; }

    input, select {
      user-select: text;
      -webkit-user-select: text;
    }

    #acceso-denegado {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      background: #f7f4ee;
      color: #252525;
      font-family: Georgia, serif;
      text-align: center;
    }

    #acceso-denegado div { max-width: 500px; }

    @media (max-width: 700px) {
      .contenedor { padding: 38px 18px 90px; }
      h1 { font-size: 26px; }
      .subtitulo { font-size: 18px; }
      .contenido { font-size: 17px; }
      .separador { font-size: 16px; }
      .controles {
        right: 10px;
        bottom: 10px;
        left: 10px;
        justify-content: center;
        gap: 5px;
        max-width: none;
      }
      .control, #fuente {
        height: 35px;
        padding: 0 8px;
      }
      .estado-progreso {
        left: 10px;
        bottom: 76px;
      }
      .seccion-comentarios {
        padding: 18px;
      }
    }

    @media print {
      html, body, body * {
        display: none !important;
        visibility: hidden !important;
      }
    }
  </style>
</head>

<body>
  <div class="barra-progreso" aria-hidden="true">
    <div id="progresoLectura"></div>
  </div>

  <div id="app"></div>

  <script>
    /* ==========================================================
       CONFIGURACIÓN GENERAL
       Conserva aquí tu clave de acceso y el nombre de este tomo.
       ========================================================== */
    const TOKEN_CORRECTO = "M1kPg95fbi";
    const parametros = new URLSearchParams(window.location.search);
    const token = parametros.get("access");
    const rutaCapitulo = window.location.pathname;

    if (token !== TOKEN_CORRECTO) {
      document.getElementById("app").innerHTML = `
        <div id="acceso-denegado">
          <div>
            <h1>Acceso denegado</h1>
            <p>Agrega la clave de acceso luego de “=” para ver.</p>
          </div>
        </div>`;
    } else {
      document.getElementById("app").innerHTML = `
        <main class="contenedor">
          <header class="encabezado">
            <h1>Tomo 1</h1>
            <div class="subtitulo">Punto de vista de Cárcel Escalante</div>
          </header>

          <article class="contenido" id="contenido">
            <div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

            <!-- PEGA AQUÍ EL TEXTO COMPLETO DE TU CAPÍTULO.
                 Conserva <p> al inicio de cada párrafo.
                 Para separar escenas:
                 <div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>
                 Para cursiva:
                 <span style="font-style:italic">texto</span>
                 Para gris:
                 <span style="color:#777777">texto</span>
                 Para gris y cursiva:
                 <span style="font-style:italic; color:#777777">texto</span>
            -->

            <div class="bloque-kofi">
              <p>¿Estás disfrutando de El anillo roto: pase lo que pase este matrimonio se irá a pique? 💍💔</p>
              <p>¡Si es así, puedo traerte muchas historias más parecidas! 📚‼️</p>
              <p>Invitándome un cafecito, puedes apoyar este y otros proyectos. ☕✨</p>
              <p>Gracias por ya formar parte de esta historia. ❤️</p>
              <a class="boton-kofi" href="https://ko-fi.com/n0ctilume"
                 target="_blank" rel="noopener noreferrer">☕ Comprar un cafecito ❤️</a>
            </div>
          </article>


          <section class="seccion-comentarios" aria-labelledby="tituloComentarios">
            <h2 id="tituloComentarios">Comentarios</h2>
            <p class="descripcion-seccion">Comparte tus impresiones, responde a otros lectores y reacciona con emojis.</p>
            <div id="giscus-container">
              <div class="comentarios-ayuda" id="avisoGiscus">
                Para activar los comentarios, completa los datos de configuración de Giscus en el código, indicados más abajo.
              </div>
            </div>
          </section>
        </main>

        <div class="estado-progreso" id="textoProgreso">0% leído</div>

        <div class="controles" id="controlesLectura">
          <select id="fuente" aria-label="Tipo de letra" onchange="cambiarFuente(this.value)">
            <option value="Lora">Lora</option>
            <option value="Garamond">Garamond</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Arial">Arial</option>
          </select>

          <button class="control" onclick="cambiarTamano(-1)" title="Disminuir tamaño">A−</button>
          <button class="control" onclick="cambiarTamano(1)" title="Aumentar tamaño">A+</button>


          <button class="control" id="botonTema" onclick="cambiarTema()" title="Cambiar tema">☾</button>
          <button class="control" id="botonConcentracion" onclick="alternarConcentracion()" title="Modo concentración">◎</button>
          <button class="control" onclick="irAlInicio()" title="Volver al inicio">↑</button>
        </div>

        <button class="control boton-salir-concentracion" onclick="alternarConcentracion()">Salir de concentración ✕</button>
      `;

      iniciarLectura();
    }

    /* ==========================================================
       PREFERENCIAS DE LECTURA
       ========================================================== */
    let tamano = 18;

    function cambiarFuente(fuente) {
      const contenido = document.getElementById("contenido");
      if (!contenido) return;

      const familias = {
        "Lora": '"Lora", Georgia, serif',
        "Garamond": 'Garamond, "Times New Roman", serif',
        "Times New Roman": '"Times New Roman", Times, serif',
        "Arial": 'Arial, Helvetica, sans-serif'
      };

      contenido.style.setProperty(
        "--fuente-lectura",
        familias[fuente] || familias["Lora"]
      );
      localStorage.setItem("fuenteLectura", fuente);
    }

    function cambiarTamano(valor) {
      const contenido = document.getElementById("contenido");
      if (!contenido) return;
      tamano = Math.max(14, Math.min(26, tamano + valor));
      contenido.style.fontSize = tamano + "px";
      localStorage.setItem("tamanoLectura", tamano);
    }


    function cambiarTema() {
      const body = document.body;
      const actual = body.classList.contains("oscuro")
        ? "oscuro"
        : body.classList.contains("sepia") ? "sepia" : "claro";

      const siguiente = actual === "claro" ? "oscuro" : actual === "oscuro" ? "sepia" : "claro";
      body.classList.remove("oscuro", "sepia");
      if (siguiente !== "claro") body.classList.add(siguiente);

      localStorage.setItem("modoLectura", siguiente);
      actualizarBotonTema();
      actualizarTemaGiscus();
    }

    function actualizarBotonTema() {
      const boton = document.getElementById("botonTema");
      if (!boton) return;
      if (document.body.classList.contains("oscuro")) {
        boton.textContent = "☀";
        boton.title = "Cambiar a modo sepia";
      } else if (document.body.classList.contains("sepia")) {
        boton.textContent = "◐";
        boton.title = "Cambiar a modo claro";
      } else {
        boton.textContent = "☾";
        boton.title = "Cambiar a modo oscuro";
      }
    }

    function alternarConcentracion() {
      document.body.classList.toggle("concentracion");
      localStorage.setItem(
        "modoConcentracion",
        document.body.classList.contains("concentracion") ? "si" : "no"
      );
    }

    function irAlInicio() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ==========================================================
       PROGRESO Y ÚLTIMA POSICIÓN
       Se guarda una posición diferente para cada archivo/capítulo.
       ========================================================== */
    const clavePosicion = "ultimaLectura_" + rutaCapitulo;
    let temporizadorPosicion;

    function actualizarProgreso() {
      const doc = document.documentElement;
      const recorrido = doc.scrollHeight - window.innerHeight;
      const porcentaje = recorrido > 0 ? Math.min(100, Math.max(0, (window.scrollY / recorrido) * 100)) : 0;
      const barra = document.getElementById("progresoLectura");
      const texto = document.getElementById("textoProgreso");
      if (barra) barra.style.width = porcentaje + "%";
      if (texto) texto.textContent = Math.round(porcentaje) + "% leído";
    }

    function guardarPosicion() {
      localStorage.setItem(clavePosicion, String(window.scrollY));
    }

    function restaurarPosicion() {
      const guardada = Number(localStorage.getItem(clavePosicion) || 0);
      if (guardada > 0) {
        requestAnimationFrame(() => {
          window.scrollTo(0, guardada);
          actualizarProgreso();
        });
      }
    }


    /* ==========================================================
       GISCUS: COMENTARIOS SEPARADOS POR URL/CAPÍTULO
       Completa los cuatro valores indicados con los datos de
       https://giscus.app/
       ========================================================== */
    const GISCUS_CONFIG = {
      repo: "N0ctilume/n0ctilume.github.io",
      repoId: "R_kgDOT3n8DA",
      category: "General",
      categoryId: "DIC_kwDOT3n8DM4DLETn"
    };

    function iniciarGiscus() {
      const config = GISCUS_CONFIG;
      const faltanDatos =
        config.repo.includes("N0ctilume/n0ctilume.github.io") ||
        config.repoId.includes("R_kgDOT3n8DA") ||
        config.categoryId.includes("DIC_kwDOT3n8DM4DLETn");

      if (faltanDatos) return;

      const aviso = document.getElementById("avisoGiscus");
      if (aviso) aviso.remove();

      const script = document.createElement("script");
      script.src = "https://giscus.app/client.js";
      script.async = true;
      script.crossOrigin = "anonymous";

      script.setAttribute("data-repo", config.repo);
      script.setAttribute("data-repo-id", config.repoId);
      script.setAttribute("data-category", config.category);
      script.setAttribute("data-category-id", config.categoryId);
      script.setAttribute("data-mapping", "pathname");
      script.setAttribute("data-strict", "1");
      script.setAttribute("data-reactions-enabled", "1"); // Reacciones con emojis de GitHub activadas.
      script.setAttribute("data-emit-metadata", "0");
      script.setAttribute("data-input-position", "top");
      script.setAttribute("data-theme", obtenerTemaGiscus());
      script.setAttribute("data-lang", "es");
      script.setAttribute("data-loading", "lazy");

      document.getElementById("giscus-container").appendChild(script);
    }

    function obtenerTemaGiscus() {
      return document.body.classList.contains("oscuro") ? "dark" : "light";
    }

    function actualizarTemaGiscus() {
      const iframe = document.querySelector("iframe.giscus-frame");
      if (!iframe) return;
      iframe.contentWindow.postMessage(
        { giscus: { setConfig: { theme: obtenerTemaGiscus() } } },
        "https://giscus.app"
      );
    }

    /* ==========================================================
       INICIO
       ========================================================== */
    function iniciarLectura() {
      const contenido = document.getElementById("contenido");
      const fuente = document.getElementById("fuente");

      const fuenteGuardada = localStorage.getItem("fuenteLectura");
      const tamanoGuardado = localStorage.getItem("tamanoLectura");
      const modoGuardado = localStorage.getItem("modoLectura");
      const concentracionGuardada = localStorage.getItem("modoConcentracion");

      if (fuenteGuardada && fuente &&
          Array.from(fuente.options).some(opcion => opcion.value === fuenteGuardada)) {
        fuente.value = fuenteGuardada;
        cambiarFuente(fuenteGuardada);
      } else if (fuente) {
        fuente.value = "Lora";
        cambiarFuente("Lora");
      }

      if (tamanoGuardado) {
        tamano = Math.max(14, Math.min(26, parseInt(tamanoGuardado, 10) || 18));
        contenido.style.fontSize = tamano + "px";
      }

      if (modoGuardado === "oscuro" || modoGuardado === "sepia") {
        document.body.classList.add(modoGuardado);
      }


      if (concentracionGuardada === "si") {
        document.body.classList.add("concentracion");
      }

      actualizarBotonTema();
      iniciarGiscus();
      actualizarProgreso();

      window.addEventListener("scroll", () => {
        actualizarProgreso();
        clearTimeout(temporizadorPosicion);
        temporizadorPosicion = setTimeout(guardarPosicion, 300);
      }, { passive: true });

      window.addEventListener("pagehide", guardarPosicion);
      window.addEventListener("resize", actualizarProgreso);

      if ("scrollRestoration" in history) history.scrollRestoration = "manual";

      // Espera a que el contenido y el diseño terminen de calcular su altura.
      window.addEventListener("load", () => {
        setTimeout(restaurarPosicion, 100);
      }, { once: true });

      // Respaldo por si el evento load ya ocurrió.
      if (document.readyState === "complete") {
        setTimeout(restaurarPosicion, 100);
      }
    }

    /* ==========================================================
       PROTECCIONES QUE YA TENÍAS
       Los controles del formulario siguen siendo utilizables.
       ========================================================== */
    document.addEventListener("contextmenu", e => {
      if (e.target.closest("input, select")) return;
      e.preventDefault();
    });

    document.addEventListener("selectstart", e => {
      if (e.target.closest("input, select")) return;
      e.preventDefault();
    });

    document.addEventListener("dragstart", e => e.preventDefault());

    document.addEventListener("keydown", function(e) {
      if ((e.ctrlKey || e.metaKey) &&
          ["c", "x", "s", "u", "p"].includes(e.key.toLowerCase())) {
        // No interferir con la escritura en las notas personales.
        if (e.target.closest("input, select")) return;
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      if (e.key === "Escape" && document.body.classList.contains("concentracion")) {
        alternarConcentracion();
      }
    });

    window.addEventListener("beforeprint", function() {
      document.body.style.display = "none";
    });

    window.addEventListener("afterprint", function() {
      document.body.style.display = "";
    });
  </script>
</body>
</html>

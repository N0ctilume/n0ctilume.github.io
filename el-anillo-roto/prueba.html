   BLOQUEAR ATAJOS DEL TECLADO
   ========================================================= */

document.addEventListener("keydown", function(e) {

    const key = e.key.toLowerCase();

    /* Ctrl + P / Cmd + P → Imprimir */
    if ((e.ctrlKey || e.metaKey) && key === "p") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    /* Ctrl + C / Cmd + C → Copiar */
    if ((e.ctrlKey || e.metaKey) && key === "c") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    /* Ctrl + X / Cmd + X → Cortar */
    if ((e.ctrlKey || e.metaKey) && key === "x") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    /* Ctrl + S / Cmd + S → Guardar */
    if ((e.ctrlKey || e.metaKey) && key === "s") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    /* Ctrl + U / Cmd + U → Código fuente */
    if ((e.ctrlKey || e.metaKey) && key === "u") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    /* Ctrl + A / Cmd + A → Seleccionar todo */
    if ((e.ctrlKey || e.metaKey) && key === "a") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    /* Ctrl + Shift + S */
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && key === "s") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    /* Ctrl + Shift + I → DevTools */
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && key === "i") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    /* Ctrl + Shift + J → Consola */
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && key === "j") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    /* F12 → DevTools */
    if (e.key === "F12") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

}, true);

/* =========================================================
   CAMBIO DE FUENTE
   ========================================================= */

let tamano = 18;


function cambiarFuente(fuente) {

    const contenido = document.getElementById("contenido");

    if (!contenido) return;

    contenido.style.fontFamily =
        '"' + fuente + '", serif';

    localStorage.setItem(
        "fuenteLectura",
        fuente
    );
}


/* =========================================================
   CAMBIO DE TAMAÑO
   ========================================================= */

function cambiarTamano(valor) {

    const contenido = document.getElementById("contenido");

    if (!contenido) return;

    tamano += valor;

    if (tamano < 14) {
        tamano = 14;
    }

    if (tamano > 26) {
        tamano = 26;
    }

    contenido.style.fontSize =
        tamano + "px";

    localStorage.setItem(
        "tamanoLectura",
        tamano
    );
}


/* =========================================================
   MODO OSCURO
   ========================================================= */

function modoOscuro() {

    document.body.classList.toggle("oscuro");

    localStorage.setItem(
        "modoLectura",
        document.body.classList.contains("oscuro")
            ? "oscuro"
            : "claro"
    );
}


/* =========================================================
   RESTAURAR PREFERENCIAS
   ========================================================= */

window.addEventListener("DOMContentLoaded", function() {

    const contenido =
        document.getElementById("contenido");

    const fuente =
        document.getElementById("fuente");

    if (!contenido || !fuente) return;


    const fuenteGuardada =
        localStorage.getItem("fuenteLectura");

    const tamanoGuardado =
        localStorage.getItem("tamanoLectura");

    const modoGuardado =
        localStorage.getItem("modoLectura");


    if (fuenteGuardada) {

        fuente.value =
            fuenteGuardada;

        cambiarFuente(
            fuenteGuardada
        );
    }


    if (tamanoGuardado) {

        tamano =
            parseInt(tamanoGuardado);

        contenido.style.fontSize =
            tamano + "px";
    }


    if (modoGuardado === "oscuro") {

        document.body.classList.add(
            "oscuro"
        );
    }

});

</script>

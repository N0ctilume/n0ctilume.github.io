<p>A lo largo de su encuentro, él había mostrado signos de una devoción inútilmente persistente, y ahora ella se daba cuenta de que ya no podía mantenerse firme como un árbol. Tenía que detenerlo, al menos hasta cierto punto.</p>

<p>—Cár-cel, esto... ahí no...</p>

<p>—¿Dónde si no en tus pechos? ¿Entre tus piernas?</p>

<p>Cárcel, aún con el pezón a medio metido en la boca, la miró con una expresión casi sincera.</p>

<p>Su expresión era tan pulcra y correcta como cuando llevaba el uniforme, lo que le resultaba totalmente absurdo a ella, cuya seno había acabado de alguna manera en su boca.</p>

<p>Su rostro esculpido, la curva de sus labios, el pezón reluciente con saliva entre ellos le parecían un sueño. El sueño más grotesco y espantoso que se pueda imaginar... Entonces, al darse cuenta de repente de lo que Cárcel le había preguntado, Inés retrocedió horrorizada y negó con la cabeza.</p>

<p>—No, no...</p>

<p>Mientras tanto, los labios de Cárcel, que habían estado presionados contra su pecho, ya se habían movido hacia arriba, aterrizando al azar debajo de su barbilla, en su mejilla, el puente de su nariz y su frente.</p>

<p>—¿Entonces?</p>

<p>—Cárcel, por tu culpa, um, estoy tan perdida que ni siquiera puedo hablar...</p>

<p>—¿Hubo alguna parte del beso de hace un momento que te disgustara en particular?</p>

<p>—¿De verdad vas a insistir en confirmarlo? No, quiero decir, Cárcel. Espera, ah, espera un momento.</p>

<p>Cárcel se humedeció los labios sobre su clavícula. Las fuertes embestidas y fricciones entre sus piernas continuaban sin cesar, pero al menos ahora su rostro mostraba una expresión que parecía estar escuchando.</p>

<p>De hecho, ella se quedó sin palabras por un momento cuando él la miró así. Hasta que apenas pudo tragarse el gemido que amenazaba con brotar cuando la fuerza debajo de ella comenzó a empujar de nuevo, frotando y rozando.</p>

<p>—Esto... esto no, Cárcel.</p>

<p>—¿No qué?</p>

<p>—Sé que estás tratando de hacerme sentir bien.</p>

<p>—Bueno, aún no te hago sentir bien.</p>

<p>La mano que había estado acariciando su pecho le acarició el pezón, ahora erecto, entre los dedos. De repente, él se rió suavemente.</p>

<p>—Supongo que no es del todo desagradable.</p>

<p>—Eh... Así que eso es. Estás tratando de hacerme sentir bien.</p>

<p>—No lo entiendo... ¿Estás diciendo que no te haga sentir bien?</p>

<p>Sus dedos se tensaron momentáneamente, luego Cárcel agarró todo el pecho de Inés, tirando juguetonamente de su pezón.</p>

<p>—¿No te gusta sentirte bien?</p>

<p>—... No soy una pervertida...</p>

<p>—Disfrutar de que te toquen los pezones así no te convierte en una pervertida, Inés.</p>

<p>—No, no es eso lo que quería decir. Quiero decir que no soy una pervertida, así que no me desagrada sentirme bien... Eh...</p>

<p>—Entonces, ¿te gusta que te tiren de los pezones?</p>

<p>—¿Qué?</p>

<p>—¿Te gusta esto?</p>

<p>Cárcel le pellizcó el pezón una vez más, como si estuviera investigando un hecho, y le preguntó con seriedad. De verdad, sin el más mínimo indicio de burla, con una seriedad que rayaba en la investigación o la experimentación...</p>

<p>Era como si le hubieran entregado un cuestionario sacado directamente de una revista semanal. Mientras Inés lo miraba completamente desconcertada, él frunció ligeramente su hermosa frente y le volvió a preguntar.</p>

<p>—¿Te gusta? ¿O no te gusta?</p>

<p>—¿Qué demonios...?</p>

<p>—Recuerda. Si no te gusta, no lo volveré a hacer.</p>

<p>—Está... bien. Está bien, pero...</p>

<p>—¿Te gusta o te disgusta? Responde claro.</p>

<p>—Este tipo de cosas realmente no importan, hum, son irrelevantes...</p>

<p>Ahora que lo pensaba, hacía un momento, “pezón”... Era increíble que hubiera repetido esa palabra tan explícita con tanta naturalidad y con su voz tan directa.</p>

<p>Simplemente había llamado pezón a un pezón... Un pezón es, efectivamente, un pezón... Pero aun así, eso era ir demasiado lejos... Una horrible confusión se extendió por el rostro de Inés.</p>

<p>Por supuesto, no era nada comparado con la absoluta depravación de las travesuras de Óscar durante su primera vida como Princesa Heredera, o el lenguaje soez que las acompañaba. Pero ese era “ese” Óscar, un loco, un lunático: sus acciones, sus palabras, sus propios pensamientos...</p>

<p>Incluso mientras vivía esa vida, había considerado todo lo que sucedía en su existencia cotidiana como si perteneciera a otro mundo. Aunque ella misma estaba atrapada en ese abismo, creía que esas cosas nunca podrían ocurrir en el mundo normal. Solo los locos harían esas cosas, dirían esas palabras obscenas...</p>

<p>Y Cárcel Escalante no era ni un loco ni alguien que viviera en otro mundo. Aunque fuera basura, ¿no seguía siendo basura dentro de la categoría de personas perfectamente normales? Por supuesto, aunque Cárcel Escalante gritara la palabra “pezón” miles y miles de veces en medio de la calle Santalaria, no podía compararse con “ese” Óscar.</p>

<p>Pero estaba confundida...</p>

<p>Inés, que había vivido aislada del mundo durante tanto tiempo, se había vuelto vulnerable en cierto sentido. Por un momento, su rostro se volvió frágil y negó con la cabeza.</p>

<p>—Pe, pezón... Ah, no digas eso...</p>

<p>—Inés, me dices que no haga demasiadas cosas.</p>

<p>Cárcel murmuró, con aire preocupado.</p>

<p>—Dijiste que no harías nada que no me gustara.</p>

<p>—Lo sé. No te preocupes, a partir de ahora lo llamaré de otra manera.</p>

<p>—... ¿Mis pezones son alguna clase de cachorro que estás criando? ¿Por qué demonios le pondrías nombre? No, da igual, olvídalo...</p>

<p>—Te sientes mal otra vez...</p>

<p>Entonces volvió a observar el progreso de Inés. La estaba examinando con atención, lo que la hacía sentir bastante conflictiva.</p>

<p>Mientras tanto, abajo, seguía amenazando con salir de sus pantalones como una bestia amenazante... Mientras ella movía las caderas, tratando de escapar sutilmente de debajo de él, su gran mano la agarró de nuevo por la cintura y la volvió a tirar hacia abajo.</p>

<p>—No eres una pervertida, y dijiste que te gustaba sentirte bien.</p>

<p>—...</p>

<p>—Pero no debería ser yo quien te haga sentir bien.</p>

<p>Este resumen inusualmente preciso de Cárcel la desconcertó una vez más. Además, su mirada, que se posaba con firmeza en los ojos de Inés, parecía arrinconarla hasta obligarla a soltar cualquier cosa.</p>

<p>Gracias a eso, Inés llegó a la conclusión de que se trataba de una afirmación que, por mucho que la reformulase, inevitablemente sonaría descarada.</p>

<p>—... Mi complacencia no tiene nada que ver con tener hijos.</p>

<p>Ante su resignada respuesta, Cárcel se quedó en silencio por un momento.</p>

<p>El silencio la empujó de nuevo a un callejón sin salida.</p>

<p>—Cárcel, aprecio tu generosidad. Este matrimonio nunca fue algo que te gustara en primer lugar—</p>

<p>—Otra vez con eso.</p>

<p>Al oír la acusación de que era la misma cantinela de siempre, Inés cambió inmediatamente de tema.</p>

<p>—Yo tampoco soy precisamente agradable—</p>

<p>—Si esa es tu excusa, bien.</p>

<p>El nuevo tema se interrumpió nada más comenzar. Inés estudió en silencio el rostro inexpresivo de Cárcel. De repente, Cárcel habló.</p>

<p>—Yo envié la carta de propuesta. Yo fui quien le dijo a tu padre que te entregara en un plazo de quince días, solo para que me maldijera durante esos quince días.</p>

<p>—...</p>
	
<p>—Al final, yo también quería este matrimonio. Inés Valeztena.</p>

<p>—...</p>

<p>—Si te gusto o no, si tú me gustas o no, nada de eso importa. Tú querías este matrimonio y yo quería este matrimonio. Eso es todo lo que hay en nuestro matrimonio.</p>

<p>Él permaneció inexpresivo.</p>

<p>—Y te niegas a reconocerlo.</p>

<p>—Tú eres el que se rindió y lo aceptó hace mucho tiempo. Para ti, no había otra opción...</p>

<p>—Sí. Exactamente así.</p>

<p>—...</p>

<p>—Tienes la costumbre de usar la excusa de que solo tú querías este matrimonio para manipularme y que haga lo que tú quieras.</p>

<p>Golpeada donde más le dolía, la débil sonrisa artificial desapareció de su rostro. Como si se la arrebatara, Cárcel sonrió.</p>

<p>—Por supuesto que te quería, con tus defectos y todo.</p>

<p>—...</p>

<p>—Me gustan bastante las mujeres con un carácter desagradable.</p>

<p>Fue una sonrisa fugaz. La mano de Cárcel, que había estado alrededor de la cintura de Inés, se deslizó entre sus piernas, agarrando suavemente y separando la espesura.</p>

<p>Sorprendida por la acción totalmente inesperada, Inés se estremeció ligeramente. Como para tranquilizarla, él le besó el hombro y encontró el prominente pico bajo la mata. Presionándolo, frotándolo, esta vez su cuerpo tembló levemente por una razón diferente.</p>

<p>Ya sensibilizada por la fricción, su clítoris estaba en un estado en el que incluso la más mínima provocación se sentía aguda. Él simplemente levantó las comisuras de la boca en una sonrisa.</p>

<p>—El interior ya debe de estar húmedo.</p>

<p>Cuando Inés apretó los labios y apartó la cabeza como si huyera, Cárcel bajó los labios hasta la mejilla expuesta junto a ella y le preguntó.</p>

<p>—¿Puedo comprobarlo?</p>

<p>—...¿Si digo que no?</p>

<p>—Lo sabré de todos modos, si es que quieres que “hagamos un bebé”.</p>

<p>Ella no respondió, solo lo miró con ira. No del todo en serio, pero con suficiente malicia como para transmitir su descontento.</p>

<p>Entonces, las yemas de los dedos que habían estado acariciando su clítoris se hundieron profundamente en la hendidura de abajo con un movimiento rápido. Como tanteando.</p>

<p>—¡Cárcel...! ¡Para, hmph...!</p>

<p>El interior, ya completamente húmedo, se sintió totalmente expuesto. El dedo, hundiéndose profundamente en el agujero, frotó las paredes internas como si las estirara, y luego empujó un segundo dedo dentro. A diferencia del primero, que había sido aceptado con sorprendente facilidad, el segundo dedo encontró una resistencia considerable.</p>

<p>Mientras él lo abría suavemente desde dentro, Inés lo miró con el rostro sonrojado.</p>

<p>—Inés, no eres una pervertida.</p>

<p>—Hmm...</p>

<p>—No deberías rechazar algo que te hace sentir tan bien. ¿No estás de acuerdo?</p>

<p>—Cárcel, hmm, te digo, este tipo de cosas...</p>

<p>—¿No quieres que las haga?</p>

<p>En ese momento, Cárcel abrió los dedos y rascó la pared interna. Inés apretó los labios y asintió con la cabeza.</p>

<p>—¿A no ser que planees poner mi semen dentro tú misma con la mano?</p>

<p>Esta vez, no pudo asentir. Cárcel chasqueó la lengua y su rostro volvió a adoptar su habitual expresión impoluta.</p>

<p>—Cierto, eso no sirve para dejarte embarazada.</p>

<p>—Te dije que estoy bien con...</p>

<p>—Bien, entonces, te desnudo, te abro las piernas y que te lo meta con fuerza. Eso es lo que esperas de tu esposo, ¿no?</p>

<p>—...</p>

<p>—Inés.</p>

<p>—No es que no me guste sentir placer. Es solo que es innecesario. Somos un matrimonio sin amor y debemos cumplir periódicamente con esta obligación.</p>

<p>—...</p>

<p>—Una obligación no tiene por qué ser placentera. Por supuesto, esta es mi opinión personal, así que si necesitas mi ayuda, te la daré hasta cierto punto...</p>

<p>—¿Por ejemplo?</p>

<p>—... Como tocar el tuyo con mi mano, o algo así.</p>

<p>Cárcel se rió entre dientes. Sus ojos se oscurecieron siniestramente. Retiró nerviosamente los dedos que había dejado dentro de ella durante un rato, murmurando.</p>

<p>—Pero como no lo necesitas, me estás pidiendo que te viole.</p>

<p>—Violación…</p>

<p>—... Es lo único de lo que no paras de hablar. Quieres que te viole. Que no piense en cómo te sientes, que no me importe si puedo tomarte, solo quieres que lo meta, lo sacuda, termine y me largue.</p>

<p>—Estoy dándote mi consentimiento. Eso no podría ser una violación.</p>

<p>—Realmente eres una mujer retorcida.</p>

<p>Él se limpió la humedad que había en sus dedos, en su plano vientre, como si se burlara de ella, y escupió:</p>

<p>—Solo di que no me deseas porque soy asqueroso.</p>

<p>—Cárcel.</p>

<p>—Si dijeras que odias que mi cuerpo se pose sobre el tuyo mucho tiempo, como un trapo asqueroso, al menos podría aceptarlo.</p>

<p>—...</p>

<p>—Inés, tu cuerpo está completamente limpio, y por eso no sé cómo explicártelo, pero por muy locas que sean las ideas que se le ocurren a esa retorcida cabecita tuya yo—</p>

<p>—No es eso... Es solo que... Quiero vivir bien. Quiero vivir bien contigo. Por eso haz lo que quieras...</p>

<p>—Cierra la maldita boca, Inés.</p>

<p>Cárcel se levantó de encima de ella, se arrodilló junto jugueteando con irritación con la hebilla de su pantalón. Pronto, sin siquiera desabrochárselo del todo, tenía el pene completamente al descubierto, sobresaliendo amenazadoramente.</p>

<p>Ante su presencia inesperadamente feroz, Inés se quedó paralizada, con el rostro pálido por la vergüenza. Interpretando esa expresión, Cárcel torció los labios en una mueca burlona y dijo:</p>

<p>—Para hacer lo que quiero, necesitaré tu “ayuda”.</p>

<p>Los ojos de Inés, ahora muy abiertos y redondos, se volvieron hacia el rostro de Cárcel, como preguntando si no estaba ya erecto. Su punta ya brillaba, transparente por el líquido preseminal.</p>

<p>Cuando ella volvió a preguntar en silencio con los ojos si aquello era absurdo, Cárcel sonrió con calma.</p>

<p>—Estoy aburrido.</p>

<p>—¿Qué?</p>
	
<p>Ella sabía perfectamente lo que significaba el aburrimiento. Por eso Inés se sorprendió de repente, y Cárcel le explicó lo que pensaba.</p>

<p>—Si lo meto así, no podré correrme.</p>

<p>—¿Dónde?</p>

<p>—No podré correrme.</p>

<p>Él le respondió amablemente. Inés lo miró con recelo.</p>

<p>—Por mucho que empuje y lo sacuda, no terminará. Si te lo meto así, probablemente tengas que quedarte así durante una hora hasta que se te desgarre el a—</p>

<p>—Lo entiendo, lo entiendo...</p>

<p>—Como dijiste, con tú “ayuda”, me excitaré razonablemente y luego te penetraré razonablemente antes de terminar.</p>

<p>—...</p>

<p>—Si deseas asumir la responsabilidad de tus palabras y hacer solo lo mínimo como deseas...</p>

<p>—Ya entendí, para.</p>

<p>Inés se levantó lentamente. Luego, como con la mayor renuencia, se acercó al lugar donde él estaba arrodillado ante ella. Antes incluso de empezar, se quedó mirando el miembro de Cárcel durante un momento con los ojos ya saciados.</p>

<p>Aquella criatura exasperante, mirando fijamente su miembro de aquella manera, era suficiente para volverlo loco. Cárcel apretó los dientes por un momento.</p>

<p>Sentada allí completamente desnuda, sus ojos verdes, a diferencia de lo habitual, mostraban claramente signos de angustia y estaban llenos solo de su pene. La realidad era más maravillosa que cualquier sueño. Sería extraño no volverse loco.</p>

<p>Durante un rato, todo siguió así. El aire parecía una cuerda tensa. Como si alguien la tocara mal, se rompería limpiamente.</p>

<p>Cárcel, llevado al límite, encontró la mayor compostura que pudo reunir. Seguramente ella se asustaría por esto de todos modos, y por muy obstinada que fuera su naturaleza, no llegaría a tocar su pene directamente. Ella se rendiría por su cuenta... Tenía la intención de aplastarla en el momento en que se rindiera y atormentarla toda la noche. Ella debía asumir la responsabilidad de sus propias palabras. ¿No es así?</p>

<p>Perdido en esa ilusión por un momento, no se percató del movimiento de Inés. Cárcel bajó la cabeza, rígido como una tabla, solo para descubrir que Inés ya había bajado la suya sobre su pene.</p>

<p>Y ni siquiera con las manos...</p>

<p>—¡Valeztena!</p>

<p>Abrumado por la sorpresa, Cárcel se dirigió a ella con el apellido que había tenido hasta ayer. Pero Inés, que ya había metido en su boca la punta brillante, reluciente de líquido preseminal, abrió la boca más, casi hasta el dolor, tragando más de su pene poco a poco. Lentamente, centímetro a centímetro, más profundo.</p>

<p>La mano flexible que agarraba el tallo por debajo acarició hacia arriba desde abajo, luego se detuvo brevemente, tal vez porque le molestaba su propio cabello largo, esparcido al azar por sus muslos y las sábanas con cada movimiento. Sin soltar la punta de la boca, apartó todo su cabello hacia un lado.</p>

<p>El aliento se le atragantó en la garganta y luego se detuvo. Por un momento, la sangre le corrió dolorosamente como si fuera a estallar. Su muslo, donde Inés se apoyaba con una mano, se tensó rígidamente, como para apartar esa mano. La mano que había arreglado su cabello extendió sus delgados dedos y volvió a envolver el miembro.</p>

<p>Su boca apenas podía tomarlo hasta la mitad, y su pequeña mano no podía rodearlo por completo, pero la sensación que le proporcionaba era más intensa que cualquier otra que Cárcel hubiera experimentado antes.</p>

<p>Ni siquiera disfrutaba particularmente de este tipo de servicio unilateral por parte de una mujer.</p>

<p>Se sentía como si estuviera bajo un hechizo. Sabía que debió apartarla en cuanto la vió, pero sus manos colgaban flácidas a los lados.</p>

<p>La escena con la que solo había soñado era, en realidad, similar a una maldición. Todo su cuerpo se sentía congelado, como si hubiera sido golpeado por esa misma maldición.</p>

<p>—... Ugh...</p>

<p>Un gemido que no pudo contener brotó de su boca. Su cabello negro azabache, peinado sobre un hombro, su nuca blanca y la mitad de su hombro al descubierto, su espina dorsal vertiginosa y sus nalgas voluptuosamente arqueadas, los pechos aplastados contra su muslo, los dedos pálidos y delgados que no podían agarrar completamente la polla de color rojo oscuro, los párpados y las pestañas bajados, los labios sonrosados abiertos al máximo mientras lo tragaban...</p>

<p>Todo lo relacionado con Inés lo atormentaba. <span style="font-style:italic">Maldita sea, maldita Valeztena... </span>Como siempre que tenía esos malditos sueños con Inés, Cárcel murmuró con odio hacia sí mismo.</p>

<p>Ella realmente estaba haciendo todo lo posible por “ayudarlo”. Se sentía miserable. Estaba tan excitado que ni siquiera podía superar la miseria.</p>

<p>Era casi una bendición que sus manos no se cerraran con fuerza. De lo contrario, habría perdido la cabeza, la habría agarrado por la nuca y se la habría metido en la garganta. Cuando Inés bajó los labios hasta la raíz, recorriendo hacia arriba desde abajo, él quiso correrse en toda su cara. Quería mancillar su pálido rostro, hacerlo completamente suyo.</p>

<p>Este sadismo, nunca antes sentido, le resultaba extraño. La sola idea de esa marca obscena, como si fuera una señal de que ella le pertenecía, le enfermaba de deseo posesivo. Cárcel levantó sus manos impotentes para cubrir su rostro contorsionado.</p>

<p>No era solo su inesperada audacia lo que despertaba ese sadismo perverso en él. Era porque esa pregunta mezquina y desagradable —¿Quién demonios te enseñó esto?— había estado rondando su boca desde el principio. La mitad de su autodesprecio provenía de eso.</p>

<p>Esta ciertamente no era —lo juraba— la primera vez. Parecía demasiado familiarizada con este acto. No hacía falta decir que era buena en ello. Si él fuera realmente el primero, sería un genio que solo nace una vez cada siglo... Así que, por supuesto, ese no podía ser el caso.</p>

<p><span style="font-style:italic">Entonces, ¿qué pasa?</span> Repitió, como burlándose de sí mismo. En Mendoza, la castidad se había convertido en una costumbre obsoleta, pero aún coexistían los tontos obsesionados con la virtud de las mujeres. Cárcel siempre había sido el que se burlaba de ellos.</p>

<p>Él mismo no entendía la castidad. No se podía exigir a los demás algo que uno mismo no poseía. Contrariamente al pensamiento racional, una fea envidia consumía su mente. Cárcel miró ansiosamente la coronilla de Inés, luego la levantó bruscamente de donde yacía boca abajo y la arrojó sobre la cama.</p>

<p>Inmediatamente después, le abrió las piernas y lentamente introdujo su pene, brillante y transparente por la saliva de ella, dentro de ella. Inés no mostró sorpresa alguna ante el repentino acto; como si cooperara con él, abrió más las piernas y levantó ligeramente las caderas, tratando de ponérselo lo más fácil posible.</p>

<p>El interior todavía estaba húmedo, pero nunca era suficiente. Ridículamente, era su primera vez. No había deseado nada más que esta primera vez. Había deseado algo mucho peor que esto. Una relación sin amor. Una relación desprovista de cualquier intimidad, afecto o consideración.</p>

<p>Una relación como la de los animales que se aparean con el único propósito de producir un heredero.</p>

<p>Y, sin embargo, estaba dentro de ella. El deseo era miserable. Cárcel dejó escapar un gemido bestial mientras se abría paso a la fuerza en el estrecho espacio, como si fuera a romperla. Inés, balanceándose impotente con sus embestidas, le rodeó el cuello con los brazos y dejó escapar un fino gemido. A diferencia de antes, era un sonido que mezclaba una ligera excitación física con el dolor de la primera vez. Cárcel quería taparse los oídos. Si no podía taparse los oídos, quería taparle la boca. Pero no tenía derecho a besarla.</p>

<p>No tenía derecho.</p>

<p>No tenía derecho a enfadarse, ni a querer conocer su pasado oculto. Si ella hubiera querido saber su pasado, él le habría contado todo lo que recordaba. Pero ella nunca lo querría saber, ni ahora ni nunca. Ni siquiera se preguntaría en secreto por su pasado.</p>

<p>Porque no querría saber todo lo que él había soportado por ella.</p>

<p>Había una chica exclusiva que se negaba a conocer a nadie, y a su lado estaba la única excepción, un chico. Creyéndose la única ventana, el único puente, el único vínculo con el mundo exterior dentro de su vida cerrada, el chico a veces sentía lástima por ella y le ofrecía su atención. Tragándose en secreto esa retorcida satisfacción de ser todo en su pequeño mundo.</p>

<p>Sin embargo, todo lo que quedaba ante los ojos del chico, era que el otro lado del puente había sido cortado, y él mismo, había quedado apartado como el resto del mundo.</p>

<p>La retorcida satisfacción que una vez lo había embriagado se hizo añicos bajo sus pies.</p>

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

document.addEventListener("keydown", function(e) {
    if (
        (e.ctrlKey || e.metaKey) &&
        ["c", "x", "s", "u", "p"].includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});

let tamano = 18;

function cambiarFuente(fuente) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    contenido.style.fontFamily = '"' + fuente + '", serif';
    localStorage.setItem("fuenteLectura", fuente);
}

function cambiarTamano(valor) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    tamano += valor;

    if (tamano < 14) tamano = 14;
    if (tamano > 26) tamano = 26;

    contenido.style.fontSize = tamano + "px";
    localStorage.setItem("tamanoLectura", tamano);
}

function modoOscuro() {
    document.body.classList.toggle("oscuro");

    localStorage.setItem(
        "modoLectura",
        document.body.classList.contains("oscuro")
            ? "oscuro"
            : "claro"
    );
}

window.addEventListener("DOMContentLoaded", function() {

    const contenido = document.getElementById("contenido");
    const fuente = document.getElementById("fuente");

    if (!contenido || !fuente) return;

    const fuenteGuardada = localStorage.getItem("fuenteLectura");
    const tamanoGuardado = localStorage.getItem("tamanoLectura");
    const modoGuardado = localStorage.getItem("modoLectura");

    if (fuenteGuardada) {
        fuente.value = fuenteGuardada;
        cambiarFuente(fuenteGuardada);
    }

    if (tamanoGuardado) {
        tamano = parseInt(tamanoGuardado);
        contenido.style.fontSize = tamano + "px";
    }

    if (modoGuardado === "oscuro") {
        document.body.classList.add("oscuro");
    }
});

</script>

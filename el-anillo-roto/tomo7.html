<p>—Sabía que eran palabras vacías en el momento en que las pronunciara. Pero, en última instancia, solo deseo la paz para ustedes dos. Afortunadamente, descubrí el corazón romántico y encantador del señor Cárcel, cómo, en secreto y con insistencia, incluso cambió su residencia a esta casa tan pequeña solo para estar cómodamente juntos a la señora Inés de alguna manera...</p>

<p>—Nunca hice tal cosa.</p>

<p>—No, no lo hizo.</p>

<p>“Lo sé, lo sé”. Esa mirada, asintiendo con la cabeza como para fingir ignorancia... Era la primera vez que sentía ganas de retorcerle el cuello a alguien.</p>

<p>Como si pudiera leer incluso ese sentimiento, Raúl habló con fingida humildad.</p>

<p>—Aunque desconfíe de mí o me tenga tan abierta aversión, quiero que sepa que siempre estaré de su lado, Capitán.</p>

<p>—No necesito que estés de mi lado.</p>

<p>—Siempre y cuando, por supuesto, no traicione a la señora Inés. Si eso la hace feliz, lo ayudaré en todo lo que pueda. ¿Qué importa si hablo mal a sus espaldas? Si el dinero es el único problema, ¿debería morirme de hambre dondequiera que vaya?</p>

<p>Como si eso fuera a suceder.</p>

<p>—¿Hmm? ¿Capitán?</p>

<p>—Solo pide dinero.</p>

<p>—¿Cómo me atrevería? No podría.</p>

<p>Basta. Ojalá se hubiera ido a cualquier parte... Pero eso era un sueño imposible, así que, dejando eso de lado, si simplemente hubiera pedido algo de dinero, quizá lo habría considerado.</p>

<p>Aunque Cárcel Escalante de Esposa no tenía interés en jugar sucio ni gusto por la derrota... al final demostró que el susurro de Raúl Balan era útil al no acercarse siquiera a las inmediaciones hasta que Inés terminó sus oraciones y salió ella misma del estudio.</p>

<p>Si uno carece de la habilidad para recurrir al juego sucio, es diferente una vez que el juego ha comenzado. El matrimonio ya se había celebrado y él seguía firmemente atrincherado en una posición muy por debajo incluso de las criadas o los sirvientes de Pérez.</p>

<p>Así que más valía dar dinero. Fue mala suerte que mostrara una expresión tan altiva, afirmando que su único deseo era la felicidad de Inés. La mala suerte hizo que las negociaciones de esa noche fracasaran.</p>

<p>Cárcel miró fijamente a Raúl Balan, que hoy volvía a estar pegado a Inés, encargándose alegremente de cada tarea trivial con meticuloso cuidado. Esa irritante imagen, conociendo al dedillo cada uno de los hábitos de Inés...</p>

<p>—Balan, el periódico.</p>

<p>—Sí, Capitán.</p>

<p>En cuanto Cárcel dio la orden, Raúl fue rápidamente a buscar el periódico del día a la consola junto a la puerta, como si ya lo tuviera preparado.</p>

<p>¿Afirmaba detestar esas atenciones triviales y, sin embargo, ahí estaba, haciéndoles un excelente uso? Cárcel podía sentir que Inés lo observaba con esa misma expresión. Y con considerable satisfacción, además...</p>

<p>Ignoró por completo la mirada complacida de Inés. Como si ella pudiera complacerse con algo tan trivial como Raúl Balan.</p>

<p>Inés debería poner esa expresión por algo mucho más significativo y plausible, y preferiblemente algo que tuviera que ver con Cárcel como causa.</p>

<p>—¿Y la gaceta de Mendoza? ¿Aún no ha llegado?</p>

<p>—Oí que llegará a la oficina de enlace frente a la sede esta tarde. Esperaré allí y lo tendré listo para que pueda leerlo tranquilamente esta noche.</p>

<p>Efectivamente, lo estaba aprovechando. Inés lo miraba con ojos que decían abiertamente: “¿Ves? Al fin y al cabo, es útil”. Pero ¿alguna vez Cárcel había necesitado esa utilidad? Se podría decir que no. Todavía no la necesitaba.</p>

<p>Sin embargo, si no lo mantenía así pegado a él, se aferraría a Inés constantemente. Si no le daba tareas, ese maldito se pegaría a ella como una lacra todo el día...</p>

<p>Se estaba torturando a sí mismo al exigir a regañadientes todo tipo de atenciones inútiles a Raúl Balan. Para un soldado como él, no había mayor tormento que tener a otros haciéndolo todo por él de principio a fin.</p>

<p>Pero antes que ver a ese bastardo pegado a Inés presumiendole...</p>

<p>—Ah, Alfonso y Raúl redactarán y enviarán las invitaciones para la fiesta del vino en uno o dos días. Empezando por tus compañeros en la base, y si hay otros que prefieras...</p>

<p>—No hay.</p>

<p>—¿Seguro?</p>

<p>Ni siquiera quería que sus compañeros de base pusieran un pie en el lugar, pero ella por fin, no, por primera vez en su vida, iba a celebrar una fiesta y quería disfrutarla. No podía aguarle la fiesta. Cárcel se limitó a asentir.</p>

<p>—Es solo que no estoy seguro de que tengamos suficiente vino para una fiesta.</p>

<p>El problema no era que la bodega de la residencia careciera de buen vino, sino que solo contenía botellas excesivamente caras, inadecuadas para una reunión. Inés asintió como si lo entendiera.</p>

<p>—No te preocupes por eso. Raúl y yo teníamos pensado ir hoy a la licorería de El Tabeo.</p>

<p>Su preocupación se desvaneció al instante, dejando solo irritación. Aunque llevaba varios meses en Calstera, esta sería su primera visita a El Tabeo.</p>

<p>El Tabeo, como se le llamaba, era el principal puerto de la costa de Calstera, un puerto próspero y el centro urbano más bullicioso de los alrededores. Las calles rebosaban de cosas que ver y comprar, por lo que él tenía intención de enseñárselas a Inés en algún momento.</p>

<p>Pero Inés no estaba especialmente interesada en hacer turismo, así que él no había querido molestarla con eso por el momento...</p>

<p>—Podríamos ir juntos cuando termine mi turno.</p>

<p>—No quiero molestarte.</p>

<p>—No me molestas.</p>

<p>—Bueno, supongo que podríamos, pero no quiero que interfiera con tu entrenamiento... De todos modos, Raúl es bastante bueno degustando vinos. Podemos dejar que él haga todas las catas.</p>

<p>—Me halaga.</p>

<p>El resultado fue que lo dejaron fuera de turno. Un mundo en el que las personas buenas solo salen perdiendo. Un mundo en el que la consideración era totalmente inútil.</p>

<p>Masticó el último trozo de carne con una mueca, mirando fijamente a Raúl. Accesorio, que ahora atendía en silencio a Inés una vez más, estaba demasiado preocupado como para darse cuenta de su mirada exclusiva.</p>

<p>—¿No tienes que irte ya?</p>

<p>Inés miró casualmente su reloj y dio lo que equivalía a una despedida, lo que hizo que el ambiente se sintiera aún más tenso. Era sólo la consideración de Inés, preguntando si no era hora de irse, pero se sintió insoportablemente aguda.</p>

<p>A regañadientes, Cárcel se levantó una vez más, dejando atrás a Inés y al pequeño mocoso que estaba a su lado. Como último acto de rebeldía, abrazó a Inés, balanceándose ligeramente, y le dio una serie de pequeños besos en la sien y la oreja. Sin embargo, la expresión de ella permaneció totalmente impasible...</p>

<p>Claro. El peor pensamiento que se le había ocurrido cuando vio por primera vez a Raúl Balan —la ilusión de que Raúl Balan era el amante de Inés, por ejemplo— no era más que una ilusión.</p>

<p>Raúl Balan no era más que un perrito excesivamente leal... Así que era realmente extraño.</p>

<p>Este sentimiento mezquino, en el que su cabeza lo entendía todo, pero su corazón no lograba comprenderlo, era algo que nunca antes había experimentado. Estaba claro que él no albergaba ni un solo pensamiento oscuro hacia Inés, pero eso por sí solo no era suficiente.</p>

<p>Si fuera el hombre de Inés, al menos podría dispararle algún día, pero ¿qué podía hacer con ese bastardo leal? “¿Por el delito de ser demasiado leal, te volaré la cabeza y acabaré contigo?”.</p>

<p>Cuando nuestros ojos se encontraron por última vez, estaban llenos del corazón del oportunista, rebosantes de buena voluntad, diciendo: “Siempre estaré de su lado, amo”.</p>

<p>¿Cómo podía la buena voluntad hacer que una persona se sintiera tan miserable? ¿Podía ser realmente tan irritante como para volver loco a uno? Cárcel aún no había comprendido la naturaleza de la xenofobia que se elevaba desde su pecho hasta su cabeza.</p>

<p>Del mismo modo que incluso los perros más dóciles atormentan a otros perros favorecidos por su amo, a veces incluso mordiéndolos hasta matarlos...</p>

<p>Por supuesto, él no había sido un perro especialmente dócil desde el principio, ni era un hombre tan completamente trastornado como para sentir fácilmente intenciones asesinas.</p>

<p>Pero tal vez estaba ligeramente trastornado.</p>

<p>—Alfonso.</p>

<p>—Sí.</p>

<p>—Quiero que le asignen a alguien.</p>

<p>Las palabras “a ese cabrón” se añadieron silenciosamente. Naturalmente, el refinado Alfonso no podía saberlo.</p>

<p>—¿Perdón?</p>

<p>Dos hombres se encontraban ante la tranquila entrada, donde unos pilares se alzaban uno al lado del otro sosteniendo un pequeño techo.</p>

<p>—Raúl Balan.</p>

<p>—... ¿Balan?</p>

<p>Era inconcebible que no hubiera oído el nombre de Raúl Balan, por lo que la pregunta de Alfonso no se refería al tema. Cárcel hizo una pausa, eligiendo cuidadosamente sus palabras.</p>

<p>No se atrevía a sospechar de esos dos, desde luego no de esa manera... ni tampoco sospechaba realmente de ellos.</p>

<p>Simplemente deseaba descubrir alguna debilidad en ese miserable bastardo. Si esa debilidad resultaba fatal, bueno, eso sería ideal. Quería conocer los trucos que empleaba, aferrándose a Inés mientras fingía ser simplemente un accesorio, un inofensivo perro faldero.</p>

<p>Saberlo solo le retorcería las entrañas, pero era mejor que fantasear patéticamente, fuera de su vista, con cuánta adoración recibiría hoy ese bastardo.</p>

<p>Sin embargo, Cárcel descartó rápidamente la idea de que seguir a alguien en secreto fuera patético.</p>

<p>—... ¿Hay algún desfalco en la compra de vino?</p>

<p>Dado que tampoco parecía sospechar lo más mínimo al respecto, Cárcel comenzó a dudar de si realmente quería conocer sus debilidades. Alfonso asintió con la cabeza, como satisfecho.</p>

<p>—Ah, ya veo lo que quiere decir. Podemos asignar a alguien para que lo siga cuando la señora salga esta tarde.</p>

<p>—... No, todo el día.</p>

<p>—¿Cómo?</p>

<p>—Mañana también. Y pasado mañana. Y el día siguiente.</p>

<p>—...</p>

<p>—Quiero saber todos sus movimientos, día tras día. Especialmente cuando está con Inés...</p>

<p>Cerró la boca como si se tragara el nombre de Inés, que se le había escapado sin querer. Alfonso se echó a reír de repente.</p>

<p>—Alfonso, no te rías. Irreverente.</p>

<p>—Mis disculpas... Es solo que, de alguna manera...</p>

<p>—¿De alguna manera, qué?</p>

<p>—De alguna manera, no dejaba de mirarlo como si quisiera destrozarlo...</p>

<p>Alfonso se rió, encontrando divertida la expresión de Cárcel, sin rastro de sospecha oscura.</p>

<p>Cárcel lo miró como si estuviera completamente atónito. Era simplemente la risa normal de un hombre normal, pero para un mayordomo que desempeñaba sus funciones con una expresión siempre rígida, parecía ligeramente desquiciada.</p>

<p>—Deja de reírte.</p>

<p>—No, es solo que... Nunca hubiera imaginado, ni en mis sueños más descabellados, que Su Excelencia me pediría que hiciera algo así.</p>

<p>Alfonso siguió mirándolo con la risa aún en los ojos. Dijo que lo entendía, pero era claramente el tipo de “entendimiento” que significaba que no pasaría nada, pero que estaría atento a tu pequeña obsesión y celos, sólo para demostrártelo.</p>

<p>De todos modos, como dijo que lo entendía, no había por qué avergonzarse. Antes de abandonar la residencia, Cárcel miró al cielo. Como si maldijera, desde por la mañana habían estado llegando nubes oscuras y amenazadoras desde el mar lejano.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—De repente está lloviendo a cántaros, ¿verdad, señora Inés?</p>

<p>—Así veo.</p>

<p>—¿Voy solo a la licorería?</p>

<p>—Solo vamos.</p>

<p>—Temo que se moje. Podríamos aparcar justo enfrente, pero detesta mojarse con la lluvia, ¿no?</p>

<p>Lo que Raúl quería decir con “mojarse” era lo siguiente: aparcaría el carruaje justo delante de la licorería y luego sostendría el paraguas sobre su cabeza con la mayor devoción mientras ella caminaba los seis pasos que la separaban de la tienda.</p>

<p>Bueno, por muy devotamente que sostuviera el paraguas, era imposible bloquear todas las gotas de lluvia que caían por todos lados...</p>

<p>Inés soltó una risa hueca ante la repentina sobreprotección de Raúl.</p>

<p>—No pasa nada, en serio.</p>

<p>—Pero nunca ha estado en El Tabeo, ¿verdad? Qué pena que haga tan mal tiempo en su primera visita.</p>

<p>Raúl chasqueó la lengua y miró por la ventana, como si el tiempo reflejado en los ojos del propietario hiciera que el mundo pareciera completamente lúgubre. Ella, sin embargo, se limitó a mirar la escena sin mucho interés.</p>

<p>—Una vez que hayamos terminado con los negocios, eso es lo único que importa.</p>

<p>—Debería haber venido antes. Dicen que el puerto es muy bonito... Lleva meses en Calstera. ¿El Capitán no la ha llevado ni una sola vez a El Tabeo de excursión?</p>

<p>—Bueno...</p>

<p>—... ¿Podría ser que presta menos atención a Inés de lo que uno podría pensar?</p>

<p>Si Cárcel hubiera oído eso, lo habría encontrado totalmente injusto. Sin saber nada de sus motivos, Inés se limitó a encogerse de hombros.</p>

<p>—Si hubiera tenido tiempo libre, lo habría hecho, por supuesto.</p>

<p>—El tiempo libre es cuestión de hacerse tiempo. El Tabeo no está tan lejos del puerto naval de Calstera...</p>

<p>No parecía especialmente ocioso, pero tampoco excesivamente ocupado. Volvía a casa puntualmente a horas fijas y tenía tiempo para dedicarse a sus aficiones día y noche... Raúl frunció el ceño.</p>

<p>Si un marido no se atrevía a hacer insinuaciones a una amante tan cautivadora, hermosa, perfecta, encantadoramente noble y elegante, ¿para qué servía entonces? Sin embargo, al observarlo más de cerca, ¿no era su ámbito de actividad demasiado limitado al interior de la casa?</p>

<p>Por ejemplo, solo en la búsqueda del placer.</p>

<p>—Aunque Cárcel no me hubiera traído aquí, habría venido hace mucho tiempo si hubiera querido. Lo sabes.</p>

<p>—Bueno... ¿no es cuestión de estado de ánimo? Antes de decir cosas como: “¿Qué es este lugar, Inés? ¡Yo también quiero ir allí...!”? Si preguntara: “Hay tal y tal lugares... ¿vamos a hacer una pequeña excursión tranquila, solo nosotros dos?”</p>

<p>—Si Cárcel dijera eso, le daría una patada en las espinillas.</p>

<p>—No, ¿por qué? Es realmente extraño.</p>

<p>—Bueno, para empezar, tu tono es repulsivo.</p>

<p>—Está hiriendo mis sentimientos otra vez...</p>

<p>Raúl era de los que podían exclamar con sinceridad: “La diosa de la belleza tiene previsto aparecer hoy en la funeraria”, incluso cuando ella llevaba el vestido más lúgubre sobre un cabello que había dejado deliberadamente sin peinar.</p>

<p>Podría parecer fácilmente un halago, pero así es la lealtad incondicional. Si su señora simplemente respiraba, eso se convertía en el logro del día. “Hoy vuelve a estar viva…”</p>

<p>Especialmente desde que Inés cumplió veinte años, tras aquellos años precarios, siempre había sido así.</p>

<p>Que Inés Valeztena de Pérez respirara y viviera, ilesa. A veces, eso solo era motivo de profunda emoción.</p>

<p><span style="font-style:italic">Pero seguramente no puede ser suficiente para Raúl Balan que su amada simplemente esté viva...</span></p>

<p>Feliz, honrada, próspera... en resumen, su amante debería poseer todas las cosas buenas del mundo. Entonces, ¿era Cárcel Escalante realmente suficiente?</p>

<p>Como un perro mascota que bloquea inútilmente el paso de su amo con heroico abandono cuando no hay nada delante, albergaba una profunda sospecha por costumbre, pero entonces vio la expresión de Inés.</p>

<p>Lo primero que se notaba era la curva ahora notablemente más relajada de sus labios.</p>

<p>El hecho de que sus ojos verdes, que parecían áridos y secos cuando miraba en silencio a algún lugar, ahora estuvieran simplemente serenos y tranquilos.</p>

<p>En cualquier caso, parecía más a gusto aquí que en la finca Valeztena. Difícilmente se podía decir que Cárcel Escalante no hubiera tenido nada que ver en ello.</p>

<p><span style="font-style:italic">Aunque su rostro parece haber hecho todo el trabajo...</span></p>

<p>¿Acaso su amo era de los que se dejaban seducir solo por esas cosas? Puede que ella hubiera elegido al Capitán Escalante basándose únicamente en sus rasgos juveniles y bien definidos, pero míralo ahora: se ha convertido en un joven apuesto con un físico igualmente impresionante.</p>

<p>Sin duda, ella tenía buen ojo para las inversiones.</p>

<p>Aunque no estaba a la altura del rechazo de su amo al Príncipe Heredero, Escalante poseía un linaje impecable como hijo mayor, un rostro tan bien definido que haría envidiar a cualquier hombre, A diferencia de los machos de complexión musculosa, él poseía un lado torpemente gentil hacia la maestra, no mostraba ningún hábito de tratar a las mujeres con descuido, parecía consistentemente afectuoso y rebosaba entusiasmo, atención y buena voluntad hacia la maestra...</p>

<p>Raúl volvió a repasar en su mente los resultados de su observación de Cárcel Escalante.</p>

<p>Aunque Cárcel lo detestaba intensamente en ese momento, Raúl tenía una opinión bastante favorable de él. Era el resultado de un cálculo minucioso, centrado exclusivamente en si Cárcel era beneficioso o no para Inés, sin tener en cuenta sentimientos personales ni circunstancias.</p>

<p>Si las cosas seguían así, podría incluso considerar halagarlo sinceramente, en lugar de hacerlo de forma calculada.</p>

<p>Parecía el modelo perfecto de soldado obstinado, impermeable a los halagos de sus subordinados. Sin embargo, dadas las lagunas en la información cerrada de Inés... seguramente encontraría una oportunidad para cooperar desde cerca, tarde o temprano.</p>

<p>Así que, en el futuro, si pudiera deshacerse de sus viejos hábitos y no dar marcha atrás... sería perfecto.</p>

<p><span style="font-style:italic">Pero ese es el mayor problema, ¿no?</span></p>

<p>Con una historia tan caótica, la sospecha se prolongó inevitablemente hasta el final. Su matrimonio progresó más suavemente de lo esperado; para cualquier observador, ahora eran una pareja de recién casados encantadoramente armoniosa. Pero ¿quién más que él podría sospechar?</p>

<p>Mientras Inés disfrutaba del feliz sueño de la luna de miel, su leal sirviente tenía que estar alerta, olfateando cualquier indicio de peligro.</p>

<p><span style="font-style:italic">El Capitán Escalante necesitará un cebo más convincente.</span></p>

<p>Raúl miró a Inés, que era tanto el Santo Grial como el cebo.</p>

<p>Era el precio que había que pagar por convertirse en el confidente del Capitán Escalante. Un trato dos por uno: podía trabajar en primera línea por la felicidad de Inés o convertirse en su vigilante más cercano.</p>

<p>Un sacrificio de lo pequeño por el bien mayor.</p>

<p>—... ¿Por qué pones esos ojos tan insolentes, Raúl?</p>

<p>Inés, tanto el Santo Grial como el cebo, el buey y el toro en uno, murmuró en voz baja. Raúl sonrió, sus labios se curvaron.</p>

<p>—Como no es una cena formal, sino una fiesta del vino combinada con un almuerzo ligero, pensaba que un postre de baklava de Vitalia sería lo ideal. ¿O tal vez una crème brûlée al estilo Divarois?</p>

<p>Como si estuviera esperando en su garganta, una serie de delicias extranjeras fluyeron. Inés, como él había previsto, frunció ligeramente la nariz.</p>

<p>—Estupendo. Ya es bastante difícil conseguir los ingredientes adecuados, por no hablar de encontrar a alguien que lo prepare.</p>

<p>—El Tabeo es un puerto próspero. Todo depende de cómo lo aborde. Podríamos traer a un chef de Pérez temporalmente...</p>

<p>—Yolanda es muy hábil. Podríamos dejarlo todo en sus manos.</p>

<p>—Sí, por supuesto, Yolanda es muy experta en la cocina local... Pero la marina tiene personal de muchas regiones, ¿no? Servir algo que uno esperaría comer en Mendoza como postre causaría una impresión favorable.</p>

<p>—¿Es así?</p>

<p>El razonamiento era sólido e Inés se dejó convencer rápidamente.</p>

<p>—Y debemos fingir indiferencia, actuar como si los preparativos fueran fáciles, tratar estos manjares como algo habitual para Su Excelencia y tomar la iniciativa con las últimas modas de Mendoza...</p>

<p>—Raúl, ¿cuántas veces tengo que decirte que no voy a ir a un duelo? Solo es una fiesta del vino.</p>

<p>—También es la primera fiesta que organiza personalmente, señora Inés. Si hubiera un libro de historia que narrara su vida, este momento merecería una nueva página, escrita en letras mayúsculas.</p>

<p>—... En realidad no existe, ¿verdad? Algo así...</p>

<p>Inés murmuró inquieta. Raúl declaró con orgullo.</p>

<p>—¿Dejaría pruebas atrás?</p>

<p>Su sonrisa era fresca y segura, como si acabara de destruir las pruebas de una organización criminal.</p>

<p>—Por supuesto, anoté algunas cosas dignas de mención...</p>

<p>—... ¿Quizás debería haberte echado después de todo?</p>

<p>—Por Dios, no. Sabe que seré muy útil a partir de ahora.</p>

<p>Eso era cierto. Mientras Raúl calculaba con devoción las circunstancias de Inés, ella había estado mirando el rostro cómodamente atractivo de Raúl y haciendo la práctica valoración de que “por mucho que lo miraras, era precisamente el tipo de rostro que adorarían las damas nobles”.</p>

<p>El rostro de Cárcel, por otro lado, no encantaba a la gente; no la hacía sentir cómoda. Un rostro como ese tenía una exigencia muy real.</p>

<p>De cualquier manera, sería más fácil dejar todo en manos del experto. Inés hizo un gesto con la mano, como diciendo: “Encárgate tú”.</p>

<p>Raúl anotó diligentemente los puntos reflejados en el cuaderno. Sin embargo, mientras lo hacía, contemplaba al mismo tiempo su implacable sospecha hacia Cárcel, su buena voluntad racional y los rasgos irritables de Inés que podrían servir de cebo, todo ello mientras miraba por la ventana. Estaba bastante ocupado haciendo malabarismos con sus múltiples personalidades, pero el carruaje estaba reduciendo la velocidad hasta detenerse.</p>

<p>Como si buscara problemas en la calle, Raúl escrutaba a cada transeúnte bajo su paraguas.</p>

<p>De alguna manera, parecía el tipo de día que exigía un escrutinio tan minucioso. Como un perro que olfatea innecesariamente en lugares donde no hay nada sospechoso.</p>

<p>Absorto en esto, no se dio cuenta de que Mario, el ingenuo cochero, les miraba con desdén a través de la pequeña ventana situada frente al asiento del cochero.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—Sí. Bueno, fue cuando eché un vistazo rápido al interior del carruaje durante el trayecto... El señor Balan parecía estar sumido en sus pensamientos. Y la señora Inés tampoco dijo gran cosa.</p>

<p>—Por Dios, Mario. ¿Cómo te atreviste a mirar atrás mientras conducías el carruaje que llevaba a la señora?</p>

<p>Alfonso expresó horror y exasperación al mismo tiempo.</p>

<p>—No había nada delante. Y usted me dijo que mirara todo lo que pudiera, señor mayordomo...</p>

<p>—¡Mantener la vista en la carretera es lo más básico...!</p>

<p>—Bueno, hubiera deseado tener la oportunidad de mantener la vista en la carretera... Apoyar la cara contra el escaparate de la licorería para mirar dentro era muy extraño. Es un milagro que no me denunciaran a la policía...</p>

<p>—El Tabeo es un lugar caótico, así que no tienes que preocuparte por ese tipo de cosas. ¿Y bien, qué más viste?</p>

<p>—Al llegar, el señor Balan abrió primero su paraguas y saltó ágilmente por encima del charco antes de ayudar a la señora a bajar, sujetándola por la muñeca. “El vestido de la señorita Inés no debe mojarse”, insistió, instándola a pisar sus pies. La señora se echó hacia atrás con disgusto y le dijo que dejara de hacerlo...</p>

<p>Era comprensible. Alfonso la había oído mencionar varias veces lo mucho que detestaba cualquier cosa que le resultara embarazosa. Asintió solemnemente, con los labios apretados.</p>

<p>—Ahora que lo pienso, nunca se me habría ocurrido pedirle a una dama que pisara mis pies en un día lluvioso. ¿De verdad los hombres de Mendoza son tan diferentes? ¿Debería intentarlo con Kara? ¿Se sentiría Kara tentada?</p>

<p>—Vuelve al tema, Mario.</p>

<p>—Sí... Entonces, antes de que abriera la licorería, la señora se rió de algo que dijo el señor Balan. Y dentro de la tienda, la señora no tomó ni un solo sorbo de vino, mientras que el señor Balan parecía ocupado pidiendo esto y aquello al dueño, él solo. Y así siguió.</p>

<p>—¿Y?</p>

<p>—Y siguió así... El señor Balan parecía terriblemente ocupado en la licorería.</p>

<p>—¿Y la señora Escalante?</p>

<p>—... No lo sé... ¿No nos dijo que vigiláramos al señor Balan?</p>

<p>—... Ah, sí, es verdad.</p>

<p>Dicho esto, no se podía culpar al cochero por vigilar diligentemente a Raúl Balan, tal y como se le había ordenado. Aunque los hubiera vigilado a ambos atentamente, ¿qué diferencia habría supuesto?</p>

<p>Era lógico que hubiera tan poco que informar desde el principio.</p>

<p>—¿Y después?</p>

<p>—El Almirante pasaba por allí, así que me pidieron que apartara el carruaje un momento. Lo conduje por el barrio.</p>

<p>—...</p>

<p>—Eso fue todo en la licorería..., ah. Cuando la señora se bajaba, el lazo de su vestido se enganchó en la manija de la puerta, por lo que el señor Balan tuvo que forcejear un poco con la puerta. ¿De verdad tengo que contar esas cosas...? En cualquier caso, el señor Balan se esforzó mucho para liberar el lazo de la señora.</p>

<p>—¿Y la señora?</p>

<p>—... ¿Por qué sigue mencionando a la señora?</p>

<p>Una simple mirada, que parecía decir “¿No eres tú el que se está desviando del tema principal?”, se dirigió hacia Alfonso.</p>

<p>Tenía cuarenta y ocho años y una carrera de más de treinta. Incluso en esa larga carrera, este tipo de cosas no tenían precedentes, y él también estaba avergonzado.</p>

<p>Sin embargo, Alfonso recuperó rápidamente la compostura como mayordomo, con voz firme.</p>

<p>—Solo estaba comprobando si la señora había tenido algún inconveniente. Raúl Balan acaba de llegar a Calstera.</p>

<p>—¿Pero no dijo que el señor Balan había servido a la señora Escalante desde su infancia?</p>

<p>—... Es la primera vez que trabaja como ayuda de cámara, así que me preguntaba si había algo que pudiera haber disgustado a la señora Inés...</p>

<p>El ingenuo cochero Mario aceptó esta digna excusa y pretexto sin hacer muchas preguntas. Frunció profundamente el ceño, como si estuviera buscando en su memoria. Hubo un breve silencio. Luego, con una pequeña exclamación de “¡Ah!”, respondió.</p>

<p>—No, no hubo nada.</p>

<p>—¿Eso es todo?</p>

<p>¿Había tardado todo ese tiempo, agonizando y devanándose los sesos, solo para decir eso?</p>

<p>—Sí. La señora no parecía incómoda en absoluto.</p>

<p>—¿Y qué pruebas tienes de ello?</p>

<p>—Bueno... sonreía con bastante frecuencia.</p>

<p>Alfonso tenía una expresión muy pensativa mientras movía el bolígrafo por el cuaderno. “A menudo... sonreía…”. Mientras lo escribía, le invadió una profunda sensación de escepticismo.</p>

<p>—No me diga señor mayordomo… ¿Está anotando lo que digo?</p>

<p>—Simplemente tengo cosas que considerar.</p>

<p>—En cualquier caso, parecía estar a gusto... Aunque nunca había visto a un sirviente de Mendoza tan refinado, así que no puedo afirmarlo con certeza. Pero, señor Alfonso, ¿debo seguir haciendo esto cada vez que salga?</p>

<p>—¿Por qué?</p>

<p>—Me parece un pecado espiar constantemente a la gente... El señor Balan no sabría nada de esto.</p>

<p>—Puedes confesarlo en la capilla.</p>

<p>Al día siguiente, fue el joven sirviente, Hugo.</p>

<p>—La señora estaba hoy tan hermosa como siempre.</p>

<p>Este perdió el tiempo contemplando el rostro de Inés en lugar de hacer lo que se le había ordenado.</p>

<p>—Era mediodía, el sol brillaba intensamente...</p>

<p>Era poético y torpe. Alfonso puso los ojos en blanco de antemano.</p>

<p>—Estaba hablando con José, sugiriéndole que colocara algo parecido a enredaderas en flor alrededor del invernadero. ¿Enredaderas en flor en el invernadero? Qué ingeniosa.</p>

<p>—... Cuando se construye un invernadero, el paisajismo se suele hacer así.</p>

<p>—¿Es habitual? ¡En absoluto! Y bugan... buganvi, ¿cómo se llamaba?</p>

<p>—¿Bougainvillea?</p>

<p>—Sí. Dijo que ese tipo de flor quedaría preciosa y estuvo hablando con José durante bastante rato...</p>

<p>—¿Y Raúl Balan?</p>

<p>—¿Eh? ¿El señor Balan?</p>

<p>La voz, como si oyera el nombre por primera vez, era aguda. Alfonso se presionó la frente.</p>

<p>—El señor Balan, el señor Balan... Ahora que lo pienso, él también estaba allí... No lo recuerdo muy bien.</p>

<p>—Uf... Te dije que vigilaras a Raúl Balan.</p>

<p>—¿Lo hizo? Lo olvidé sin querer...</p>

<p>Estaba claro que solo había reconocido la existencia de Raúl Balan al agitarse su memoria. Esos fanáticos siempre tenían una visión tan limitada.</p>

<p>Sin embargo, Kara, la joven criada que servía a Inés de cerca, era algo diferente.</p>

<p>—Alrededor del mediodía, la señora Inés estaba cuidando el jardín, así que Raúl estaba con ella. Yo tenía trabajo que hacer arriba y no pude verlos de cerca, pero los observé en secreto desde la ventana. Parecía terriblemente ocupado, con una sombrilla en una mano y abanicándola con la otra. Sudaba profusamente por el esfuerzo, por lo que la señora Inés le echó personalmente un pañuelo sobre la cara.</p>

<p>—¿Ah, sí?</p>

<p>Ella entendía la misión secreta. Su visión era más amplia que la de cualquiera de los torpes sirvientes masculinos.</p>

<p>Así que no era solo un poco diferente.</p>

<p>—Y a la una de la tarde hubo un pequeño altercado porque la señora Inés, al regresar a casa, se negó a almorzar. Raúl sacó todas las galletas que Yolanda había horneado la noche anterior y la tentó insistentemente, preguntándole si de verdad no iba a comer nada. El chico es guapo... En fin, la señora Inés acabó comiendo, aunque parecía más molesta que hambrienta... Raúl parecía encantado. Luego, alrededor de la una y veinte, Raúl bajó a la cocina y...</p>

<p>Era demasiado diferente. Esto era demasiado detallado.</p>

<p>—Espera, Kara. Ve un poco más despacio... No. ¿Qué tal si recortamos un poco la narración?</p>

<p>—¿Qué tan corto?</p>

<p>Alfonso reflexionó un momento. Solo se aprende haciendo este tipo de cosas...</p>

<p>—Por ejemplo, cuántas veces ocurrió cada acción...</p>

<p>—¿La señora Inés negándose a comer tres veces, Raúl persuadiéndola siete veces... Así?</p>

<p>—¡Sí! Bien. Claro y conciso.</p>

<p>—La señora Inés sonrió cuatro veces, la señora Inés se rió tres veces, Raúl la halagó seis veces, Raúl la aduló siete veces, la señora Inés lo reprendió dos veces, Raúl rellenó el vaso vacío de la señora Inés cuatro veces...</p>

<p>—Tienes... tienes muy buena memoria.</p>

<p>—Me lo dicen a menudo. La señora Inés acarició la cabeza de Raúl dos veces, y Raúl sonrió felizmente once veces...</p>

<p>—Tienes muy buena memoria... Podrías ser secretaria en la corte.</p>

<p>—Por desgracia, no sé escribir. Entonces, ¿cuánto más me dará si hago esto todos los días?</p>

<p>—... ¿Te lo prometí?</p>

<p>—Si no me paga, ¿por qué demonios iba a hacer este miserable trabajo?</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—... Al pasar por los charcos, le pedía que pisara sus pies para evitar que se mojara el vestido. Es un sirviente verdaderamente dedicado, ¿no?</p>

<p>—...</p>

<p>—Dijeron que la señora se mostró perfectamente cómoda durante todo el servicio de Raúl Balan. Nunca perdió la sonrisa, ¿sabe?</p>

<p>—...</p>

<p>Alfonso fingió ignorar por completo los verdaderos sentimientos de Cárcel y, con la mirada fija en su cuaderno, siguió hablando sin parar.</p>

<p>—Por lo tanto, el Capitán no tiene absolutamente nada de qué preocuparse...</p>

<p>—¿Qué más?</p>

<p>—¿Hm?</p>

<p>—Lee también la siguiente página.</p>

<p>Como si intuyera su sutil intento de omitirlo, Cárcel fijó la mirada en el lado opuesto del cuaderno, ligeramente gastado.</p>

<p>Es poco habitual en él ser tan perspicaz y un poco mezquino, ¿no? Alfonso hizo una valoración ligeramente irreverente. El siguiente era el informe de Kara.</p>

<p>Respiró hondo antes de leer. Necesitaba prepararse.</p>

<p>—Por la mañana, la señora estaba en el estudio, así que Raúl Balan estaba en la cocina con los sirvientes. Alrededor del mediodía, la señora salió al jardín, llamó al jardinero y discutió varias ideas con él. Mientras tanto, Raúl Balan sudaba profusamente, sosteniendo la sombrilla de la señora sobre ella y abanicándola con la mano libre. La señora, compadeciéndose de él, le dio un pañuelo...</p>

<p>—¿Qué le dio qué?</p>

<p>Cárcel interrumpió el largo informe para preguntar. Alfonso forzó una expresión cautelosa.</p>

<p>—Un pañuelo. ¿Acaso dije por error que le dió oro?</p>

<p>—... Deja de burlarte de mí y sigue leyendo.</p>

<p>—Después de eso... como la señora seguía intentando saltarse el almuerzo, Raúl le trajo todas las galletas de Yolanda para tentarla...</p>

<p>—¿Qué hizo qué?</p>

<p><span style="font-style:italic">Ya basta. </span>Alfonso suspiró y respondió.</p>

<p>—Esa es la forma de expresarse de Kara. Con enorme entusiasmo, molestó a la señora hasta que finalmente comió... Después de eso, el informe de Kara se volvió demasiado largo, así que lo he resumido un poco. Espero que sea aceptable. Bien, lo leeré. Hubo tres ocasiones en las que la señora Inés rechazó la comida, siete intentos de Raúl por persuadirla, cuatro ocasiones en las que la señora Inés sonrió, tres ocasiones en las que la señora Inés se rió...</p>

<p>¿No contenta con mantener una sonrisa durante todo el tiempo, se rió tres veces...?</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>Cárcel, atormentado por una imaginación pegajosa que evocaba esa escena, se dio cuenta de que se estaba revolcando en su propia miseria y se levantó irritado.</p>

<p>Que Raúl Balan no era el amante de Inés estaba más claro que el agua, y en una situación en la que era imposible tener dudas razonables, solo podía tratarse de celos.</p>

<p>Celos, envidia... ¿Había sentido alguna vez algo más extraño en toda su vida?</p>

<p>Por supuesto, nada podía superar los sueños húmedos en los que Inés se quitaba sin piedad el vestido, pero este sentimiento ocupaba fácilmente el segundo lugar.</p>

<p>Teniendo en cuenta su propio historial de libertinaje, era tan exagerado que hasta un perro que pasara por allí se reiría. Sabía muy bien que no tenía derecho a sentirse así.</p>

<p>Y si se ignoraban sus asperezas, dentro del universo autónomo de Cárcel Escalante, era un ser tan espléndido e impecable que esos sentimientos, acciones y motivos sórdidos le resultaban totalmente ajenos.</p>

<p>Al contemplar el número indeterminado de hombres que podrían haber pasado con ella durante su noche de bodas, no se había sentido así en absoluto. Incluso había deseado que fueran muchos en lugar de uno solo.</p>

<p>¿Era esto realmente celos? <span style="font-style:italic">No puede ser…</span>, lo negó brevemente Cárcel. Le gustaba Inés. ¿Pero la amaba? Simplemente le gustaba por ahora. Eso era todo.</p>

<p>Después de todo, si estaban destinados a vivir juntos toda la vida, era mejor que el desagrado mutuo... Aunque la respuesta de Inés seguía siendo tibia, si seguían juntos así, llegaría el día en que el afecto la conquistaría. Esperaba ese día, pero ¿eso lo convertía en amor? “Entonces que los perros y las vacas también se enamoren”, murmuró Cárcel con cinismo.</p>

<p>Después de todo, los celos son un sórdido subproducto del amor.</p>

<p>Entonces, ¿qué motivo podría tener para sentir celos de un simple sirviente? En el mejor de los casos, era solo un ruidoso y molesto estorbo, nada más que el perro faldero de su esposa...</p>

<p>La razón por la que no debía sentir celos estaba clara cuando recordaba su propio pasado miserable, y las razones por las que no necesitaba sentir celos eran innumerables. Era demasiado guapo para llevar una existencia tan miserable, su aspecto no encajaba con tanta mezquindad, no estaba en posición de ser pegajoso, tenía posición social... Podía aceptar sinceramente todos y cada uno de estos puntos.</p>

<p>Pero.</p>

<p>—Raúl la halagó seis veces, Raúl la aduló siete veces, la señora Inés lo reprendió dos veces, Raúl rellenó el vaso vacío de la señora Inés cuatro veces. La señora Inés acarició la cabeza de Raúl dos veces, y Raúl sonrió felizmente once veces...</p>

<p>Esto era claramente algo diferente a los celos, o quizás algo más allá de los celos. Una aversión instintiva a ver a ese tipo sonreír felizmente... Una presencia totalmente irritante...</p>

<p>¿Quién se quejaría si el dueño acariciara la cabeza de un perro? Incluso a otros perros les desagrada. <span style="font-style:italic">Pero, ¿eso me convierte en un perro? Por supuesto que no...</span> Cárcel se vio envuelto tardíamente en una crisis de identidad.</p>

<p>Entonces, el informe de Alfonso también comenzó a molestarle.</p>

<p>—¿Informas de esa manera porque me ves como un marido celoso? ¿Crees que me gustaría conocer detalles tan triviales tan tediosamente?</p>

<p>—¡Imposible...! Es solo que los informes de Kara eran tan largos y detallados que le pedí un resumen sencillo. ¿Lo he molestado?</p>

<p>—Me molesta. A partir de ahora, anota todo lo que diga Kara palabra por palabra y transmítelo.</p>

<p>—... ¿Eh?</p>

<p>—Hasta el último detalle. ¿Entendido?</p>

<p>Si, como afirmaba Cárcel, los informes detallados equivalían a tediosidad, entonces transmitir las declaraciones detalladas de Kara palabra por palabra era el colmo de la tediosidad.</p>

<p>—... Mejor una Kara que un montón de tontos. Quién iba a imaginar que existía tal talento.</p>

<p>La vigilancia y el seguimiento no eran virtudes de los empleados, así que era natural. Kara simplemente necesitaba dinero rápido y demostró su extraordinario talento.</p>

<p>—Con el debido respeto, Kara preguntó por los honorarios. Esa parte...</p>

<p>—Dale lo que pida. Al fin y al cabo, es una genio.</p>

<p>Cárcel dijo esto y luego se animó visiblemente al ver a Inés entrar en la sala de recepción. Ocurrió de forma natural, pero él prefería pensar que había sido intencionado.</p>

<p>Solo quería saberlo. No se trataba en absoluto de celos.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>Era un día en el que las flores silvestres blancas florecían de forma natural bajo el muro, como si hubieran sido trasplantadas directamente de los campos, y las flores rosas y moradas estaban en plena floración.</p>

<p>E incluso sin las flores, era un día perfecto. Gracias al nuevo muro costero, deliberadamente bajo, el mar azul se extendía hasta el lejano horizonte, visible incluso antes de entrar en el jardín. Hoy, el cielo estaba excepcionalmente despejado y alto.</p>

<p>Era una escena que había suscitado tanta admiración en cierto invitado en el momento en que entró, como si las hadas pudieran revolotear entre las ramas de las flores. El tiempo, las flores, la brisa fresca. Todo era absolutamente perfecto.</p>

<p>Al dirigir la mirada hacia un rincón del nuevo pero aún modesto jardín de la residencia del Capitán Escalante, se podía ver el invernadero de cristal recién construido brillando como joyas a la luz del sol. Exuberantes enredaderas verdes ya habían comenzado a trepar desde la base de las paredes transparentes, creando una escena idílica.</p>

<p>En el lado opuesto, sin invernadero, se habían dispuesto largas mesas en fila para la fiesta. Sobre ellas, se había colocado un lujoso dosel de satén azul cielo para proteger a los invitados del sol abrasador, mientras que el toldo que se extendía desde el dosel hacia la residencia estaba adornado con las brillantes flores de finales de verano.</p>

<p>Las mesas eran lo suficientemente grandes como para sentar al menos a veinte personas. Cubiertas cuidadosamente con manteles de un blanco deslumbrante, cada sitio adornado con un sofisticado jarrón, las mesas ya estaban siendo despejadas por los sirvientes y las criadas después del almuerzo.</p>

<p>A su alrededor, había pequeñas mesas redondas dispersas, cargadas con copas de vino, dulces exóticos caros del tamaño de un bocado, frutos secos y queso ahumado de las regiones del sur de Ortega.</p>

<p>Oficiales uniformados y varias damas se reunían en pequeños grupos alrededor de cada mesa.</p>

<p>Era una tarde tardía tras la misa matutina en Calstera.</p>

<p>Las campanas de la iglesia repicaban desde debajo de la colina Logorño. La parte más calurosa del día había pasado; eran poco más de las cuatro. Todo parecía tranquilo y la escena era bastante más agradable de lo que ella había previsto.</p>

<p>Para ser la primera fiesta que organizaba en su vida.</p>

<p>—Señora Escalante, ¿ha visto por casualidad a mi esposo?</p>

<p>—Está en el invernadero. Se fue allí antes con el Coronel Barca. Ah, ahí está con mi esposo. El Capitán Salvatore también está con ellos.</p>

<p>—De todos los lugares, tener que quedarse allí... ¡Espero que no estén haciendo alguna maldita apuesta a plena luz del día!</p>

<p>—Seguro que no.</p>

<p>—Vigile de cerca a su esposo, señora Escalante. El Coronel Barca y el Capitán Salvatore son unos jugadores realmente problemáticos.</p>

<p>—¿Esos respetables caballeros?</p>

<p>Inés respondió en voz baja a las palabras murmuradas.</p>

<p>—Bueno, siendo el Marqués Barca, el Coronel en persona no sabría ni cuanto cuestan unos dulces, ¿verdad?. Pero ¿sabe lo obsesionado que está con esas apuestas insignificantes? Su espíritu competitivo es implacable.</p>

<p>En cuanto al Marqués Barca, era un hombre de mediana edad que nunca había jugado en Mendoza, y mucho menos se había llevado una sola moneda de la mesa, un hecho que Inés no podía saber.</p>

<p>¿Quién hubiera pensado que un hombre así, una vez en su puesto, jugaría de forma tan infantil con sus subordinados por unos simples centavos?</p>

<p>—Nunca admite la derrota, así que debe sopesar cuidadosamente lo que se juega frente a la promoción cuando tome una decisión. Al fin y al cabo, no terminará hasta que gane.</p>

<p>Cuando Inés se rió, la señora Coronado frunció el ceño con seriedad, como para enfatizar que sus palabras no eran exageradas.</p>

<p>Aunque probablemente era quince años mayor que Inés, era una mujer encantadora, de complexión pequeña y regordeta y rasgos expresivos.</p>

<p>—Es cierto. El Coronel es muy persistente... Mi esposo no tiene talento para el juego. El coste de los dulces en Barca equivale al precio de la platería de la familia Coronado. Él mismo lo sabe y suele contenerse, pero cuando se trata del Coronel... es como un ciervo arrastrado por un león. Qué tonto.</p>

<p>—¿Dónde se puede encontrar un ciervo tan robusto?</p>

<p>—No se estará burlando de mi marido por ser bajito, ¿verdad? Sentado junto al Capitán Escalante, de entre todas las personas, parece francamente feo... Ni siquiera parece humano...</p>

<p>—Señora Coronado, el Capitán Coronado tiene un aspecto muy varonil. Su estatura también es perfectamente normal.</p>

<p>Al añadir “muy” antes de “normal”, a primera vista parecía un gran elogio. La señora Coronado asintió con tristeza.</p>

<p>—Sí... es tan poco atractivo como cualquier hombre de Ortega.</p>

<p>Incluso mientras decía esto, la señora Coronado miró a su marido como si fuera absolutamente adorable y luego suspiró profundamente.</p>

<p>—El Capitán Salvatore está a punto de arruinar su tercer matrimonio por culpa del juego. Sin embargo, sigue empeñado en sus costumbres, mezclándose con los demás. ¡Y nada menos que en una fiesta en la que está presente la señora Salvatore...! ¡Hombres, de verdad!</p>

<p>—¿Disparamos discretamente para disolver esa reunión? Antes de que la señora Salvatore vea la escena.</p>

<p>Cuando Inés hizo la descarada sugerencia, la señora Coronado asintió enérgicamente, como si estuviera completamente satisfecha. Sus ojos redondos incluso se iluminaron, como si finalmente hubiera encontrado a alguien que la entendía.</p>

<p>—Parece que el Capitán Escalante está haciendo deliberadamente una donación a esos pobres hombres de mediana edad.</p>

<p>Eso era típico de Cárcel. Estaría haciendo todo lo posible por burlarlos deliberadamente, utilizando todos los trucos que conocía. Al fin y al cabo, se enfrentaba a hombres que le llevaban una buena docena de años, un capitán de cuarenta y tantos años y un jugador insignificante, si no más. Si se tratara de fatiga física, sería una cosa, pero el agotamiento mental era algo que detestaba.</p>

<p>—Pero esa mísera caridad no bastará para contrarrestar al Coronel Barca. Sin embargo, si vuelvo a interferir... Ya le obstaculicé deliberadamente varias veces antes y, al final, dejó de creer en una sola palabra de lo que decía.</p>

<p>—Iré yo, señora.</p>

<p>Los ojos redondos de la señora Coronado finalmente se iluminaron con emoción.</p>

<p>—Señora Escalante, ¿qué hacemos?</p>

<p>—Haré que los llamen, diciendo que ha llegado un nuevo postre o que deseo mostrarles el interior de la residencia, comenzando por las habitaciones del Capitán.</p>

<p>—¿Qué postre es? Es bastante importante.</p>

<p>—El postre principal es una crème brûlée al estilo Divalua. Se ha mantenido muy fría.</p>

<p>—Crème brûlée, Dios mío... ¡Una vez probé una hecha por el chef de la Casa Comercial Cavaliere cuando estaban en Mendoza! Estaba absolutamente divina... No. La cuestión no es que estuviera divina. Al coronel no le gusta esa gente por ser tan pretenciosa... ¿Entiendes lo que quiero decir?.</p>

<p>—Entonces diría que la visita a la casa también es pretenciosa.</p>

<p>—Exacto. No es un hombre corriente, ya ve... Necesito más tiempo para pensarlo. Señora Escalante, un momento.</p>

<p>La señora Coronado se alejó apresuradamente de la fiesta, acelerando el paso mientras regresaba a la residencia, presumiblemente para ver a Sofía en medio de todo esto.</p>

<p>En una vida anterior, la antigua Inés se habría burlado de la sola idea de llamar a esta reunión una fiesta. La magnitud de la fiesta era una cosa, pero la magnitud del lugar era otra muy distinta.</p>

<p>Era pintoresco y encantador, pero para la Princesa Heredera debía de parecer una ratonera de la que no podía escapar.</p>

<p>Además, los asistentes estaban muy alejados del corazón de la sociedad de Mendoza. Quizás si fueran como Cárcel, José o el Coronel Barca, cuyo noble linaje reforzaba su honor como oficiales... pero ellos eran excepciones.</p>

<p>Podían ser alabados por su honorable deber, pero no dejaban de ser soldados. Aunque la Real Academia Militar estaba compuesta principalmente por nobles, pocos de las casas verdaderamente distinguidas elegían voluntariamente un camino tan agotador.</p>

<p>Entre las innumerables familias nobles que simplemente se dejaban llevar, eran los segundos hijos, alejados de la riqueza, o las ramas lejanas cuyos apellidos eran famosos pero cuyas fortunas eran tan escasas como la cola de un gato...</p>

<p>En un mundo en el que, si no tienes nada, al menos debes tener honor, se esforzaban por ganárselo.</p>

<p>Sin embargo, en Mendoza, lo que uno tiene por nacimiento se valora por encima de todo. Por muy leal que sea, a menos que se convierta en un héroe de guerra, uno sigue siendo un simple soldado, sin nada más que el uniforme de la Armada Imperial.</p>

<p>Quizás por eso. Los momentos en los eventos sociales que antes me hacían hervir la sangre ahora eran soportables.</p>

<p>Gente que se esforzaba por parecer correcta o parecer correcta. Gente cuya vanidad seguía siendo modesta... La mayoría de los que estaban aquí eran personas menos contaminadas por las costumbres de Mendoza. Cuanto más los observaba, más se desvanecía mi arraigada aversión.</p>

<p>Sí. Esto no era Mendoza. Tampoco era la espeluznante corte de la Emperatriz Cayetana...</p>

<p>Inés se acercó a la esposa del Comandante Baldem y le sirvió personalmente vino en la copa vacía que sostenía, ganándose un pequeño favor. Luego volvió la mirada hacia su modesta creación.</p>

<p>Aunque lo había hecho por necesidad, nunca antes había emprendido una tarea como la de diseñar un jardín. Era demasiado trivial para la esposa de un Príncipe Heredero y una historia demasiado cómoda para una noble fugitiva que se había casado con un pintor sin un centavo.</p>

<p>¿Era esto un afecto inevitable? ¿O tal vez algo parecido al orgullo...? Sin duda, había comenzado sin ningún interés, pero, mirando atrás, estaba llena de su propia visión. Era una sensación extraña, pero no desagradable.</p>

<p>Dado que no sentía ningún interés por las vastas propiedades de Pérez ni por los grandiosos jardines de la mansión Valeztena, estaba claro que no era su vocación.</p>

<p>Sin embargo, estaba bien.</p>

<p>La riqueza de la vida que siempre había deseado podría no ser más que el jardín de esta pequeña casa. La riqueza excesiva a veces secaba a las personas, y la pobreza a menudo las derribaba. Habiendo experimentado ambas cosas, ella lo sabía. Esta era precisamente la medida de una vida ni árida ni abatida.</p>

<p>La pequeña casa en Calstera, la tranquilidad de un mundo tan diminuto... Sin embargo, incluso si su matrimonio no fuera temporal, para Cárcel, que heredaría todo Escalante, no sería más que un momento fugaz, como un juego de niños.</p>

<p>Como si ese mismo instante no fuera más que un sueño fugaz y agradable para ella.</p>

<p>Inés desvió distraídamente la mirada para observar a Cárcel. Él permanecía sentado a la mesa de juego dentro del invernadero, rodeado por el Coronel Barca, el Capitán Coronado y el Capitán Salvatore, jugando una partida de cartas en solitario que solo él parecía disfrutar.</p>

<p>Sus ojos, que habían estado fijos en la mesa de juego, se volvieron de repente hacia ella. Era evidente que solo había girado la cabeza para echarse hacia atrás su revuelto cabello rubio y recuperar el aliento, pero la mera visión de Inés hizo que sus ojos se curvaran naturalmente en una amplia sonrisa.</p>

<p>Ella se encontró, absurdamente, momentáneamente perdida. Cuando finalmente logró esbozar una leve sonrisa, Cárcel incluso le saludó con la mano. Hasta que el Coronel Barca, como si lo retara a apartar la mirada, le dijo algo.</p>

<p>La mirada de Cárcel había desaparecido, pero, de alguna manera, ella no pudo quedarse donde estaba y se dio la vuelta. En ese momento, la voz de Raúl le llegó desde un lugar ligeramente apartado, donde atendía a la Marquesa Barca.</p>

<p>—... Es realmente una obra maestra de la señora Escalante. Una tarea muy larga. A primera vista parece modesta, pero uno no puede imaginar el esfuerzo que la señora Escalante ha dedicado a ella.</p>

<p>Por supuesto, él no podía saberlo. La obra se había terminado antes incluso de que Raúl llegara a Calstera.</p>

<p>Sin embargo, Raúl le estaba entregando una copa de vino a la anciana esposa del Coronel Barca, relatándole los logros de Inés —o más bien, los no logros— como si hubiera sido testigo de todo el proyecto de principio a fin.</p>

<p>—Ahora que lo pienso, visité esta residencia hace mucho tiempo... no cuando el Capitán Escalante vivía aquí, sino cuando otro oficial residía aquí hace mucho, mucho tiempo. Ahora tiene un aspecto muy diferente.</p>

<p>—Debe de ser así... desde que la señora Escalante llegó aquí, todo cambió. Por dentro y por fuera, de arriba abajo, no hay un solo rincón que no haya sido tocado por la mano de la señora.</p>

<p>—Ya era preciosa entonces, pero ahora es incomparable. Las vistas desde aquí... Sin duda, como hija de Valeztena, su gusto es excepcional. Aunque el jardín no sea más grande que la palma de la mano, un gusto tan exquisito no se puede ocultar.</p>

<p>—Por supuesto. Nuestra señora Escalante...</p>

<p>La Marquesa Barca había estado utilizando la bandeja de Raúl como su mesa personal desde hacía un rato. En la bandeja, había dispuesto cuidadosamente una sola pieza de cada tipo de aperitivo y había colocado varias copas de vino para asegurarse de que nunca se acabara.</p>

<p>Luego, mientras hablaba de Inés con la boca, sus ojos devoraban a Raúl Balan como si fuera a lamerlo hasta dejarlo limpio en cualquier momento. En verdad, era un rostro que exigía una demanda práctica.</p>

<p>El propio Raúl reconoció esta ventaja, ganándose fácilmente el favor de la noble con simples atenciones y aprovechando los momentos de distracción para recabar diversos fragmentos de conversación.</p>

<p>Pero el Raúl de ese momento era como un tonto, que se creía los elogios de Inés y movía la cola con alegría. Era bastante lamentable y triste verlo, tan vulnerable a ser despojado como envoltorios de caramelos en la imaginación de la marquesa.</p>

<p>—Así que, primero, debemos rescatar a Raúl.</p>

<p>Si esto continúa, podría acabar siendo arrastrado a la cama...</p>

<p>—Marquesa Barca.</p>

<p>—¡Señora Escalante! Estaba a punto de mencionarla.</p>

<p>Sus palabras eran corteses, pero sus ojos transmitían claramente: “Apártese para que podamos seguir hablando de usted sin usted”. Inés ignoró ligeramente la insinuación y le tomó el brazo con delicadeza.</p>

<p>La Marquesa Barca había sido suya en otro tiempo. Sus costumbres eran tan evidentes como la luz del día.</p>

<p>—La estaba buscando, Marquesa. Debería empezar a mostrarles la mansión a los invitados...</p>

<p>Una mirada indiferente y momentánea hacia la mansión cuestionó qué podría haber que ver en esa pequeña casa, pero la Marquesa Barca pronto puso una expresión de bienvenida. Aquí, al menos, su rostro cambió tan rápidamente como cabría esperar de la persona que más tiempo había pasado en compañía de Mendoza.</p>

<p>—Estaba esperando a que nos lo enseñaras. Como el Capitán Escalante siempre vivió solo en Calstera... Tenía curiosidad por saber cómo había cambiado la residencia ahora que acogía a su señora.</p>

<p>“En Calstera”. Era un comentario sutilmente sarcástico, pero Inés lo descartó con ligereza.</p>

<p>—Por cierto, sobre este lugar. ¿Le he dicho que es absolutamente precioso? El Coronel no le llega ni a la suela de los zapatos al joven Capitán Escalante. En nuestra residencia, hay que subir cuatro pisos para tener una vista decente del puerto naval. ¡Pero mire qué vistas tan impresionantes desde la colina Logorño!</p>

<p>Aunque la residencia del Coronel Barca era fácilmente diez veces más grande que esta modesta mansión, la Marquesa exageró juguetonamente para halagar a Inés. Ni siquiera omitió el detalle infantil de que la residencia del Coronel Barca tenía cuatro pisos.</p>

<p>¿Qué oficial fue el que dijo que el poder del Mando Naval en Calstera es proporcional a la vista desde la colina Logorño?</p>

<p>Sin embargo, viendo cómo todos los generales construyen sus enormes residencias en las llanuras cercanas al Mando, el poder reside en las llanuras bien situadas.</p>

<p>Esto también era un poder aparte en Calstera, distinto del poder en Mendoza. Infantil, tal vez, pero una historia que vale la pena contar... Hay que presumir primero, no sea que pase desapercibido... Aun así, era infantil.</p>

<p>—Cómo me atrevo a compararlo con la residencia donde se alojarán el Marqués y su esposa. En cualquier caso, antes de verlo, pensé que podría acompañar primero a las damas y ofrecerles una pequeña muestra de gratitud. ¿Sería tan amable de guiar a las damas?</p>

<p>Ante la simple palabra “acompañar”, los ojos de la Marquesa Barca, que había estado lanzando miradas de pesar a Raúl, se iluminaron instintivamente. Aunque ella era la anfitriona de la fiesta, era usted quien conmovía a la gente, y ese simple matiz bastó para influir en la Marquesa Barca. Ella, que valoraba el poder por encima de un simple joven apetecible, se olvidó rápidamente de Raúl.</p>

<p>—Y le agradecería que rescatara a mi marido antes de que pierda hasta el último centavo que le debe al Coronel.</p>

<p>Inés nunca había tenido la intención de irrumpir en el invernadero. Se trataba simplemente de dar una orden a alguien a quien había dado órdenes en el pasado.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>De los quince invitados, solo había cinco mujeres, lo que hacía un total de seis, incluida la anfitriona, Inés.</p>

<p>Si añadimos a Raúl, que estaba ocupado adulando a la Marquesa Barca, y a la criada, Kara, que estaba lista para hacer recados, el grupo ascendía a ocho. Si se insistiera en incluir a Yolanda, que estaba cerca dirigiendo a los demás sirvientes, entonces serían nueve.</p>

<p>La ventaja de una casa pequeña es que, incluso con pocos invitados, parece llena. Es algo parecido a la ventaja de un teatro de ópera pequeño. Los actores no tienen que derramar lágrimas al ver los asientos vacíos.</p>

<p>—¡Nunca había visto un estudio tan bonito...!</p>

<p>—Han colocado las ventanas de manera que se puedan ver tanto la colina Logorño como el mar.</p>

<p>La señora Coronado fue la primera en exclamar, mientras que la Marquesa Barca ofreció una valoración práctica mientras se acercaba a la ventana. Para Inés, era una imagen familiar: ojos maravillados por la vista mientras las manos tocaban las nuevas cortinas, evaluando su valor.</p>

<p>Contuvo una risita silenciosa y vio a la esposa del Capitán Salvatore detrás de la Marquesa, prácticamente con la nariz metida en su copa de vino. Su comportamiento era muy diferente al de antes.</p>

<p><span style="font-style:italic">... ¿Quién le ha dado coñac a esa mujer?</span></p>

<p>Sostenía precariamente en la mano un líquido cuyo color no parecía proceder de la fiesta del vino. No era difícil adivinar quién era la culpable. Habían pasado por la sala de recepción de la planta baja y, en una esquina de la sala, había una mesa consola con una botella de coñac o whisky importado.</p>

<p>No era otra que la propia señora Salvatore quien le había dado a la señora Salvatore una bebida fuerte.</p>

<p>Esas bebidas solían tenerse a mano para servir a los propietarios de la mansión o a sus invitados, y la señora Salvatore era, al fin y al cabo, una invitada ese día, por lo que no había nada de malo en ello. Excepto por el hecho de que se lo sirvió a sí misma... Y excepto por el hecho de que, fieles al nombre de “fiesta del vino”, ya habían bebido más que suficiente vino...</p>

<p>La prometida del Teniente José Almenara, que había entrado en el estudio un poco más tarde, detrás de la señora Salvatore, la vio y retrocedió tambaleándose. Probablemente porque percibió el hedor del alcohol o vio esos ojos entreabiertos y pesimistas.</p>

<p>O tal vez percibió el aroma de un matrimonio que se desmoronaba como una casa abandonada...</p>

<p>—¡Señorita Gormas, mire allí!</p>

<p>Si la esposa del Teniente Anaya no la hubiera agarrado, quién sabe hasta dónde habría retrocedido.</p>

<p>Leah Gormas, sobrina del Conde Gormas y futura esposa de José Almenara, pasó ante la señora Salvatore con una mirada de absoluta timidez, mirándola furtivamente. Inés, como para tranquilizarla, se aferró al costado de la señora Salvatore, pero parecía igual de inquieta, incluso mirando por encima del hombro.</p>

<p>A juzgar por lo ocupada que estaba bebiendo su coñac con moderación, a pesar de ser tratada como una amenaza potencial, la señora Salvatore pronto estaría completamente borracha.</p>

<p>Cuando Inés le dedicó una brillante sonrisa, la joven de dieciocho años respondió con una sonrisa renuente. Instada por la señora Anaya, que solo era un año mayor que ella, miró tardíamente hacia fuera.</p>

<p>Sus pequeños ojos se abrieron tanto como pudieron.</p>

<p>—¡Es realmente magnífico, señora!</p>

<p>—¿Verdad que sí, señorita Gormas? En un día tan claro como este, incluso se podría ver la puesta de sol sobre el mar desde aquí.</p>

<p>—¿Se puede ver la puesta de sol? Ah, entonces esto debe de ser el sur. Qué espléndido...</p>

<p>—No, no... no, Gormas.</p>

<p>Después de mirar a la joven noble con evidente diversión durante un momento, la Marquesa Barca cambió bruscamente de expresión, chasqueó la lengua y negó con la cabeza. La Marquesa Barca nunca había tenido paciencia con aquellos a quienes consideraba inferiores, ni entonces ni ahora.</p>

<p>Esperaba que aquellos que apestaban a Mendoza le resultaran totalmente repulsivos, pero allí estaba ella, sola en medio de aquel paisaje, pareciendo nada más que una noble de una farsa callejera. Igual que cualquier noble que existiera en la imaginación de los plebeyos.</p>

<p>Seguramente, si ella misma hubiera venido aquí en algún momento, habría tenido un aspecto muy similar.</p>

<p>Leah Gormas, al darse cuenta de que la Marquesa Barca la ignoraba, se enfadó brevemente antes de susurrarle algo a la señora Anaya.</p>

<p>Sin duda le estaba preguntando en cuál de los cuatro puntos cardinales se estaba poniendo el sol. A juzgar por la expresión de la señora Anaya...</p>

<p>Incluso por sus breves intercambios en el jardín, sabía que la mujer tenía una vena bastante obtusa. Sin embargo, lo que realmente decepcionaba a Inés ahora no era su interior, sino su aspecto exterior.</p>

<p>La sobrina del Conde Gormas era bastante guapa. Simplemente no era lo suficientemente hermosa como para que Cárcel se enamorara de ella a primera vista... Inés había albergado esperanzas porque había oído que la mujer era una gran admiradora de Cárcel.</p>

<p>La sociedad de las familias de los oficiales ya era bastante reducida, y la mayoría de las damas preferían quedarse en Mendoza con sus hijos. En aquellos tiempos, cada persona en Calstera era valiosa.</p>

<p>Ya fuera leña o madera para encender... Inés vio a la señora Anaya, de diecinueve años, aferrada a Leah. También era aceptable. Luego miró alternativamente a la Marquesa, de unos cuarenta años, a la señora Coronado, de entre treinta y tantos y cuarenta y pocos, y a la señora Salvatore, de unos treinta y pocos.</p>

<p>¿Dónde había habido alguna vez una comida que satisfaciera desde el principio? Esto era solo el comienzo. De las cinco personas presentes allí, sólo dos habían estado destinadas allí desde el principio. Tres, más de dos, acababan de enterarse de la noticia y habían llegado a Calstera apresuradamente, con un día o dos de diferencia.</p>

<p>Así que esto no era más que un trampolín, una cuestión de consolidar el terreno más cercano.</p>

<p>Oficiales de otras ramas, sus esposas, sus hijas, todos los eventos navales grandes y pequeños, bailes benéficos y celebraciones de Año Nuevo... Solo enumerarlos hacía que su corazón se acelerara como el de un niño imaginando los regalos de Navidad.</p>

<p>Tanto si Cárcel pasaba una noche como muchas noches con cualquiera de ellas, la posibilidad seguía abierta. Si una mujer estaba lejos, él podía ser sus piernas; si ella se quedaba quieta, muda y clavada en el sitio, él podía ser sus alas...</p>

<p>—... Señora Salvatore, ¿se encuentra bien?</p>

<p>Aun así, no podía evitar sentir un apego persistente por las personas cercanas. La señora Salvatore, cuyo matrimonio estaba al borde del colapso, era bastante guapa e incluso odiaba a su marido.</p>

<p>Las mujeres Ortega no solían contenerse cuando llegaba ese momento; buscaban a otro hombre. El proverbio de Mendoza, “El odio se cubre con amor”, siempre escondía otras circunstancias. No significaba que debiera obligarse a amar a la persona que se odiaba. Si odiaba a alguien, significaba que debía amar a otra persona para olvidarlo.</p>

<p>Así que era la condición perfecta para que ambos se desviaran...</p>

<p>—No pasa nada, estoy bien...</p>

<p>Lamentablemente, la señora Salvatore, ya fuera de sí, respondió a la persona equivocada en lugar de a Inés, agitando momentáneamente el brazo. Parecía ligeramente irritada e impaciente, como si incluso la pregunta de su lado fuera una molestia. No estaba nada bien.</p>

<p><span style="font-style:italic">No queda mucho tiempo...</span></p>

<p>Expresar abiertamente aquí la preocupación por “por qué había bebido tanto” o hablar de otros tipos de licores que no servía el anfitrión sería un insulto entre mujeres.</p>

<p>En cambio, Inés, en silencio, sin que la señora Salvatore se diera cuenta, la agarró firmemente por debajo del codo y la estabilizó, tirando de ella hacia sí misma. Para que no siguiera tambaleándose.</p>

<p>Este tipo de personas, las que ya estaban borrachas pero fingían lo contrario, ocultando su embriaguez, también eran un tipo de personas de las que la antigua Inés se había cansado por completo. No había mucho que tuviera que manejar personalmente con esta mano, pero... Inés apartó discretamente su copa mientras entablaba conversación con la señora Salvatore sobre sus cintas y demás.</p>

<p>Raúl, que debió de haber presenciado esa escena digna de un carterista, miraba en esa dirección como si no diera crédito a sus propios ojos. Hasta que la expresión de Inés le transmitió: “¿Qué haces ahí parado como un idiota?”.</p>

<p>Entonces, recuperó con naturalidad los regalos que había preparado de antemano del interior de la estantería.</p>

<p>—Dios mío, ¿qué es esto?</p>

<p>—Señora Escalante. De verdad, no hay necesidad de esto...</p>

<p>En un instante, las damas se reunieron, dando la espalda a la vista desde la ventana. Mientras tanto, Inés le pasó el vaso de la señora Salvatore a Kara y luego la empujó hacia las otras damas con tanta fuerza que la señora Salvatore sintió como si hubiera caminado allí por su propia voluntad.</p>

<p>En la bandeja de madera de arce que llevaba Raúl había cinco frascos de perfume turco de exótica elaboración.</p>

<p>El perfume era sin duda un artículo de lujo para la nobleza, pero el perfume turco destacaba tanto por su precio como por su calidad. Su aspecto rezumaba una opulencia poco habitual en Ortega, junto con su distintivo aroma dulce y afrutado...</p>

<p>Inés cogió la botella más bonita, según los criterios de cualquiera, y se la ofreció primero a la Marquesa Barca. La curva crítica de los labios de la Marquesa se suavizó en señal de satisfacción. Eso significaba que el regalo era irreprochable.</p>

<p>—Solo es perfume. Por favor, acéptelo sin sentirse en deuda.</p>

<p>—¿Qué le dan a esos hombres para que les regalen a sus esposas cosas tan caras?</p>

<p>—Lo que reciben los caballeros, usted ya lo ha recibido con creces. Sigue bebiendo vino moderadamente caro sin límite, ¿no es así?</p>

<p>—Los hombres se conforman con beber, ¿no es así?</p>

<p>La Marquesa, visiblemente más relajada, se llevó el perfume a la nariz y se echó a reír. Inés entregó entonces los regalos una a una a las demás invitadas, que no podían ocultar su emoción. Detuvo con delicadeza a la señora Salvatore, que, borracha, lo agarraba como si fuera una copa de vino e intentaba llevárselo a la boca.</p>

<p>El corazón era, sin duda, material. Y las cosas caras demostraban su valor. Además, por muy costosas que fueran, en comparación con las sumas que se gastaban en los nobles de la corte de Mendoza... Su extravagancia no era más que modesta y frugal.</p>

<p>El estado de ánimo de las mujeres se relajó al instante.</p>

<p>—Aun así, señora, ¿cómo puede vivir en un lugar tan pequeño? Debe de haber pasado toda su vida en las vastas fincas de Pérez... A solo unos pasos se encuentra con una pared...</p>

<p>Las palabras que se habían reprimido durante toda la visita ahora se desbordaban.</p>

<p>—Señorita Gormas, ya ha visto las vistas desde el estudio. ¿Es realmente el tamaño lo único que importa? No hay otra residencia tan bonita como esta. Señora, lo digo en serio.</p>

<p>A mitad de la frase dirigida a otra persona, se volvía abruptamente hacia Inés, buscando su confirmación sin falta.</p>

<p>—Después de todo, son descendientes directos de Escalante y Valeztena. Deben estar disfrutando del romance de los recién casados, como niños jugando. En los primeros días del matrimonio, incluso la pobreza es un juego. ¿No es así? No vivirán juntos como estas lindas ardillitas para siempre...</p>

<p>Llegó incluso a mencionar vivir como ardillas pobres.</p>

<p>—... ¿Lo sabía?</p>

<p>¿Ese ambiente relajado también había llegado a la persona ebria? Fue entonces cuando la señora Salvatore se dirigió de repente a Inés. Habían estado sentadas un poco apartadas de los demás, fingiendo tener asuntos que discutir en privado. Por supuesto, la señora Salvatore no se había dado cuenta.</p>

<p>—¿Me hablaba a mí?</p>

<p>—Sí, señora Escalante...</p>

<p>El ligero balbuceo al final sugería que todavía no estaba del todo bien, pero el hecho de que hubiera iniciado la conversación era digno de elogio.</p>

<p>—Bueno, es solo que...</p>

<p>—¿Ardillas?</p>

<p>—Sí. Esta... preciosa casa, como una rueda de ardilla...</p>

<p>Parecía no tener tiempo para recordar que la rueda sigue girando. Algo pareció brotar dentro de ella; cerró la boca con fuerza por un momento y finalmente apoyó la cabeza pesadamente en el sofá. Inés rezó al instante para que no fuera vómito.</p>

<p>Su mente se llenó con el pensamiento de que todo, desde este sofá hasta la alfombra de dos mil hilos, que había sido reemplazado recientemente...</p>

<p>—No era originalmente del Capitán Escalante.</p>

<p>No comprendió inmediatamente el significado de esas palabras.</p>

<p>—¿Eh?</p>

<p>—Originalmente, no... Quiero decir, no, no es eso…</p>

<p>—Bueno, señora Salvatore, entiendo que no es eso, pero si siente ganas de vomitar...</p>

<p>Inés susurró con una voz que pretendía ser inaudible para los demás. No sabía exactamente qué era lo que no era, pero sus pensamientos volvieron rápidamente a la alfombra. Porque la señora Salvatore se había inclinado repentinamente hacia delante desde donde estaba recostada en el sofá. En una posición perfectamente adecuada para vomitar.</p>

<p>No se trataba simplemente de una alfombra cara. Era una preciosa obra de arte que había despertado sus deseos materiales por primera vez en mucho tiempo... Una forma de arte completada durante medio año por las mujeres de Onila... Era un pueblo en el que se convertían en maestros a los trece años.</p>

<p>—No estoy borracha.</p>

<p>—Lo sé. Lo sé.</p>

<p>—¿Lo entiende? No estoy borracha. Así que no hay razón para que vomite, ¿entiende?</p>

<p>—Lo entiendo.</p>

<p>—Es mi maldito esposo el que está borracho... Ese hombre no necesita alcohol. Nunca está en su sano juicio. Básicamente, siempre está borracho... Sabe lo que se siente, ¿verdad?</p>

<p>—Por supuesto que lo sé.</p>

<p>No podía saberlo, ya que nunca había convivido con el Capitán Salvatore. Pero podía entender fácilmente los sentimientos de la señora Salvatore. Vivir día tras día en la cuesta abajo del matrimonio, mirando fijamente ese rostro espantoso...</p>

<p>Excepto que la cuesta abajo que Inés recordaba con Óscar se parecía más a un precipicio. Realmente sentía que lo entendía. Aunque Inés seguía sintiéndose incómoda con la alfombra, miró el rostro de la señora Salvatore, arrugado como si estuviera enfurecida, con un toque de lástima.</p>

<p>—La señora simplemente está pasando por un momento difícil.</p>

<p>—Siempre fui yo quien necesitaba beber. Vivir con alguien que no es normal requiere beber... así es como es.</p>

<p>—Sí.</p>

<p>Lo sé. Lo sé muy bien... Inés hizo rodar el vaso lleno de agua en su palma, como de costumbre, y luego se detuvo de repente. Estaba viviendo su vida exactamente al revés que antes, y en esta vida era una abstemia que nunca había probado una sola gota de alcohol.</p>

<p>Y, sin embargo, mira este hábito que no podía dejar. Era un maldito hábito que le había quedado tras años de adicción: beber para abrir los ojos, beber para cerrarlos.</p>

<p>¿Quizás era un auto lavado de cerebro? Sostener el agua, decirse a sí misma que era líquido, por lo que era prácticamente lo mismo que el alcohol...</p>

<p>—Y, sin embargo, ¿quién cree que se gastó una fortuna en alcohol? ¿Eh?</p>

<p>—... Probablemente el Capitán Salvatore, supongo.</p>

<p>—Yo me he vuelto a casar, y ese hombre también, pero hay una razón por la que sigue divorciándose. Arruina a las mujeres. El dinero, la flor de la vida, el cabello, la piel firme, la oportunidad de vivir con otro hombre decente, la esperanza en el futuro... Ese maldito bastardo lo hace perder todo. ¿Lo entiende?</p>

<p>—Usted sigue siendo hermosa, señora.</p>

<p>—Podría haber sido más hermosa. ¿Sabe? Por eso tuve que huir. Era mejor morir que vivir así... Moriré así. Simplemente moriré.</p>

<p>—Probablemente no muera.</p>

<p>—O mataré a ese hombre.</p>

<p>Solo sus ojos brillaban intensamente entre los mechones de cabello que le caían en cascada. Inés le lanzó una advertencia suave y baja, con una sonrisa tan radiante que hacía imposible imaginar el contenido de la conversación.</p>

<p>—... Ha aguantado bien hasta ahora. Por su propio bien, señora, lo mejor es que siga aguantando.</p>

<p>—O muere ese hombre o muero yo, uno de los dos debe encontrar su fin. Solo entonces cesará este horrible matrimonio...</p>

<p>La señora Salvatore finalmente enterró la cabeza por completo entre las rodillas y murmuró. A esas alturas, los demás se habían dado cuenta de su grave estado. Sin embargo, no se atrevieron a acercarse para ver cómo estaba, sino que comenzaron a susurrar entre ellos.</p>

<p>Incluso en ese momento, abstenerse de agolparse a su alrededor para inspeccionarla era una forma de cortesía hacia la señora Salvatore, pero en el ambiente se respiraba una inquietud similar a la que se siente al encontrarse con un vagabundo en la calle.</p>

<p>Inés sintió que la nube negra que se cernía sobre el matrimonio de los Salvatore comenzaba a proyectar su sombra también sobre su primera fiesta del vino.</p>

<p>—... Señora Salvatore, en Ortega tenemos la espléndida institución del divorcio. Si simplemente se divorciara de él, no habría necesidad de matar ni morir.</p>

<p>—¡El divorcio es para gente como esa! Yo no. Yo no soy ese tipo de mujer... Si mi exmarido no hubiera muerto...</p>

<p>—Parece que ha olvidado por un momento que el asesinato es un asunto mucho más grave...</p>

<p>—Bueno, ¿qué sabrá alguien como usted? La preciosa hija del Duque Valeztena... la futura Duquesa Escalante...</p>

<p>Sé más que eso. Intentó matarlo y, al final, murió en un ataque de ira.</p>

<p>—Usted, está casada con Cárcel Escalante...</p>

<p>Inés escuchó en silencio mientras la señora Salvatore murmuraba con amargura entre dientes. Cuando de repente levantó la cabeza y la miró con ira, Inés le dedicó una amplia sonrisa.</p>

<p>Para los demás, solo veían la espalda de la señora Salvatore y su rostro sonriente, por lo que en general podía parecer un ambiente cálido y amistoso. El sentido común sugeriría que la señora Salvatore también estaba sonriendo.</p>

<p>Sin embargo, en realidad, su rostro estaba enrojecido por la ira.</p>

<p>—... ¿Qué puede saber alguien tan perfecto como usted? Apenas tiene veintipico de años, ¿verdad? Su única preocupación debe ser dónde estará hoy esa perfecta escultura sonriendo a alguna mujer, ¿no? ¿O tal vez a las innumerables ex amantes de Mendoza?</p>

<p>Al ver que la expresión sonriente de Inés no cambiaba, la señora Salvatore, aparentemente desconcertada, soltó una risa áspera y entrecerró los ojos.</p>

<p>—¿O tal vez al excesivo vigor de su fornido esposo noche tras noche?</p>

<p>—Señora Salvatore.</p>

<p>—Con una cara como esa, lo entendería cien veces. Con un cuerpo como ese, lo entendería mil veces. Pero no es eso, ¿ve? Mire la cara agotada de mi marido. Mire esa carita insignificante. Aunque las mujeres no son el problema. Si solo fuera eso, me lo tomaría a risa, todos los días.</p>

<p>—Señora...</p>

<p>—... Yo antes tenía el cabello así... ¿Sabe?</p>

<p>De repente, le pasó los dedos por el pelo a Inés, murmurando con amargura. Le preguntó a Inés cuánto le había costado conseguir ese cabello, luego le hizo acariciar los mechones quemados por forzarlos en un moño apretado, antes de volver a maldecir a su marido de repente.</p>

<p>Si el divorcio hubiera sido algo habitual en Ortega hace mucho tiempo, ella no habría sufrido esta desgracia... La desgracia que se derivaba de ello era, a gran escala, su primera vida y, a pequeña escala, este mismo momento de sufrimiento bajo las inyecciones de la señora Salvatore.</p>

<p>Las damas ya habían empezado a fingir que no veían a la señora Salvatore, dejándola con Inés, y se habían reunido en la terraza fuera del salón para ver la puesta de sol. Era un giro cruel de los acontecimientos, pero ella aprovechó la oportunidad, pensando que sería perfecto enviar a la señora Salvatore a casa primero. Se dio la vuelta, dejando a la señora Salvatore con un puñado de su cabello en la mano.</p>

<p>Para empeorar las cosas, ni Raúl ni Kara estaban a la vista, lo que la dejó en un dilema. Entonces sucedió.</p>

<p>—¿Inés?</p>

<p>Como por arte de magia, Cárcel entró por la puerta abierta. Parecía que la había estado buscando y la había visto en ese momento. Le hizo una señal para que se acercara en silencio, como diciendo: “Ven aquí”.</p>

<p>La señora Salvatore, con la cabeza hundida una vez más en los cojines del sofá, estaba demasiado ocupada maldiciendo al mundo como para darse cuenta de que Cárcel se había acercado a ellas.</p>

<p>Él observó la escena como si fuera otro mundo: las otras damas reunidas en la terraza, relajadas y listas para ver la puesta de sol; el mechón de pelo de Inés que la señora Salvatore había agarrado; y luego, alternando entre la cabeza de la señora Salvatore, que ahora se sacudía porque había empezado a llorar, y el rostro completamente sereno de Inés.</p>

<p>No era precisamente una imagen de armonía. Cárcel preguntó en voz baja.</p>

<p>—¿Hemos servido a los invitados lo suficiente como para emborracharlos?</p>

<p>—No, pero...</p>

<p>En lugar de responder con detalle, Inés señaló con la mirada la mesa consola donde estaban las bebidas. Cárcel suspiró suavemente.</p>

<p>—Bueno, has llegado justo a tiempo. ¿Dónde está el Capitán Salvatore?</p>

<p>—Justo donde estaba antes.</p>

<p>—Entonces tráelo.</p>

<p>—El lugar está bien, pero la situación no.</p>

<p>—...</p>

<p>—Es una situación similar.</p>

<p>Parecía que Cárcel estaba tratando de encargar al Capitán Salvatore, completamente borracho, a manos de la señora Salvatore, mientras que Inés intentaba entregar a la señora a su marido, una coincidencia bastante incómoda.</p>

<p>Cárcel llamó en voz baja a una criada que pasaba por la puerta y le ordenó que fuera a buscar al cochero y a otro sirviente. A continuación, deshizo con cuidado la mano de la señora Salvatore y comenzó a desenredar el cabello de Inés.</p>

<p>La imagen de su gran corpulencia rescatando meticulosamente un mechón de su cabello resultaba ligeramente cómica. Cuando Inés se rió suavemente, él mantuvo el rostro serio y le susurró “Shh”, como para silenciarla.</p>

<p>El delirio de la señora Salvatore la tenía ahora medio dormida, maldiciendo a su marido incluso en sueños. Así que no había posibilidad de que pudieran oír su conversación, pero Cárcel rescató en silencio hasta el último mechón de pelo de Inés de su puño cerrado.</p>

<p>Luego, arrodillándose educadamente con una rodilla al pie de donde estaban sentados, se dirigió de repente a la señora Salvatore.</p>

<p>—Señora Salvatore, el Capitán Salvatore está buscando a su esposa.</p>

<p>—Maldito... Dile que se vaya al infierno...</p>

<p>—La acompañaré con su esposo.</p>

<p>Aunque la señora Salvatore ya estaba fuera de sí, él la trató como se trataría a una noble perfectamente cuerda, limitándose a cumplir con las obligaciones de un noble cortés al informar de la situación y apoyarla. Sin embargo, la mujer que tenía en sus brazos no dejaba de lanzar maldiciones a su marido, lo que hacía que la escena pareciera una farsa.</p>

<p>Inés se encontró riendo involuntariamente. Cárcel, con fingida seriedad, ayudó educadamente a la señora Salvatore a ponerse en pie y, a continuación, esbozó una suave sonrisa hacia Inés.</p>

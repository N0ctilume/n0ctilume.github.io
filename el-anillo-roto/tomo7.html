            <article class="contenido" id="contenido">

<p>La luz del sol despertó sus ojos cerrados. Acurrucada junto a la ventana que daba al balcón, abrió los ojos en silencio y miró en esa dirección.</p>

<p>El sonido de las olas se colaba por la puerta entreabierta. Cárcel debía de haberse levantado temprano y la había dejado abierta. Miró hacia la ventana, con la vista aún borrosa, como si estuviera viendo el sonido en lugar del mar.</p>

<p>Las obras de renovación que había comenzado en la residencia hacía varias semanas estaban llegando a su fin. El sonido de las herramientas que se oía cada mañana temprano había cesado. La valla ya estaba terminada y el invernadero para Cárcel estaba completamente construido. Solo quedaban algunos detalles en el interior, que se terminarían en los próximos tres o cuatro días.</p>

<p>El tiempo se medía ocasionalmente por el sonido de esta manera. Escuchó el leve susurro de las cortinas blancas interiores ondeando con la brisa antes de levantarse lentamente.</p>

<p>Su cuerpo, iluminado por la brillante luz del sol, estaba, como siempre, hecho un desastre. Estaba cubierto de marcas donde Cárcel la había mordido y chupado. Después de una noche de sexo implacable que la había atormentado, las huellas de él atormentaban todo su cuerpo, hasta el momento en que su conciencia finalmente se apagó. Incluso mientras lo lavaba por última vez, como si aún no fuera suficiente.</p>

<p><span style="font-style:italic">... No es suficiente.</span></p>

<p>Aunque solo era una metáfora, la frase “n<span style="font-style:italic">o es suficiente</span>” la dejó con una sensación algo nauseabunda.</p>

<p>¿Siempre tenía sexo así?</p>

<p>Día tras día, se convirtió en una fuerza que ella simplemente no podía seguir, una intensidad ocasional que no podía manejar. Si hubiera estado obsesivamente sobrecargando de trabajo a todas las mujeres con las que se había acostado de esta manera, los rumores sobre él seguramente se habrían extendido hace mucho tiempo...</p>

<p>Sin embargo, los rumores sobre Cárcel Escalante que recordaban a las mujeres que había conocido eran siempre inmaculados, a pesar del tema de la promiscuidad. Una noche era siempre solo una noche; nunca había habido una mujer a la que se pudiera llamar su amante. En consecuencia, no hubo escándalos importantes. Incluso las mujeres que se aferraban a él para pasar una noche más y eran rechazadas solo hablaban en términos elogiosos sobre el tiempo que pasaron en la cama con él.</p>

<p>Aunque ser rechazada por primera vez en su vida era tan humillante como para desear estar muerta, en primer lugar, ¿cómo podía alguien atreverse a sentir odio cuando se estaba demasiado ocupada admirando ese rostro perfecto? Y en segundo lugar, aunque lo odiaran, no podían negar que había sido el mejor sexo de sus vidas.</p>

<p>Junto con la valoración de que era un rostro tan bonito que solo con mirarlo uno perdía la cabeza, evocando automáticamente solo recuerdos agradables.</p>

<p>La Inés de una vida pasada nunca cuestionó ni mostró curiosidad por ninguno de los dos relatos, pero esa noche con Cárcel seguía siendo el mejor premio que cualquier noble de Mendoza podía poseer, un tesoro raro fuera del alcance de la mayoría.</p>

<p>Probablemente sería una noche que revivirían y sobre la que chismearían hasta su último aliento. Así que no era de extrañar que, hasta que Inés murió a los veintiséis años, le susurraran al oído los hábitos nocturnos de Cárcel Escalante, algo que a ella le traía sin cuidado.</p>

<p>Inés podía entender por qué lo alababan tanto. Al fin y al cabo, era aterradoramente bueno en eso...</p>

<p>Sin embargo, pensándolo bien, el contenido de esos elogios interminables no era más que actos dentro de los límites del sentido común. Como si alguien hubiera dicho que lo único que no era de sentido común en él era su rostro, su fuerza, su cuerpo y su tamaño...</p>

<p>Sin actos pervertidos, sin exigencias unilaterales. Esa era precisamente una de las muchas razones prácticas por las que Inés lo había elegido en esta vida.</p>

<p><span style="font-style:italic">Una relación limpia...</span></p>

<p>Volvió a mirar su cuerpo manchado.</p>

<p><span style="font-style:italic">... ¿Esto es limpio?</span></p>

<p>Los rastros de un deseo implacable y una excitación excesiva se derramaban, sin ningún otro lugar adonde ir... Como no podía tener relaciones sexuales con ella mientras dormía, parecía que tenía que hacer esto para satisfacerse. O tal vez era la mentalidad de que, si ella se despertaba, volvería a abalanzarse sobre ella.</p>

<p><span style="font-style:italic">Sea cual sea, es un maldito loco...</span></p>

<p>Por supuesto, no era un pervertido en el sentido estricto de la palabra. No actuaba de forma siniestra como un desviado sexual, ni exigía actos sádicos unilaterales. Nunca había hecho nada lo suficientemente repugnante como para ofender su sensibilidad.</p>

<p>Sin embargo, había habido momentos repulsivos... Realmente repugnantes, como el momento en que esa cosa parecida a una estaca dentro de ella comenzó a endurecerse de nuevo.</p>

<p>Sí, él poseía una cualidad pervertida. Su fuerza era perversa. La abrumadora presión cuando el cuerpo de Cárcel, parecido al de un semental, se montaba sobre el suyo, la sensación de que, aunque intentara escapar, ese cuerpo acabaría tragándola por completo como una ola...</p>

<p>Esa idea la hizo sentir agotada de nuevo, así que Inés lo expulsó rápidamente de su mente. Por suerte, él ya se había ido de la habitación.</p>

<p><span style="font-style:italic">¿Cuándo se fue?</span></p>

<p>Volvió sus ojos somnolientos hacia el lugar donde había estado tumbado Cárcel. En ese lugar había una comida, aparentemente preparada para Inés.</p>

<p><span style="font-style:italic">¿Habrá entrado algún sirviente o criada mientras dormía?</span> Se sonrojó. Si la Duquesa Valeztena lo hubiera visto, seguramente se habría burlado: “¿Ya vives en un gallinero y ahora comes como un pájaro picoteando granos?”. Pero Inés nunca le dio mucha importancia a las formalidades cuando se trataba de comer.</p>

<p>Habiendo soportado tantos días de hambre en su vida con Óscar, a veces se emocionaba hasta las lágrimas con el simple hecho de comer. ¿Qué importancia tenía la ceremoniosidad?</p>

<p>Además, en estos días, las señoras solían decir que se sentían cansadas de vestir impecablemente desde primeras horas de la mañana solo para evitar comer con sus maridos. Era habitual que disfrutaran de una comida tranquila a solas en sus dormitorios. Si no se sintiera obligada a lavarles el cerebro a todos con el mensaje “Estoy poniendo todo mi corazón y mi alma en este matrimonio”, Inés no habría querido abrir los ojos por la mañana, y mucho menos disfrutar de comidas tan perezosas.</p>

<p>Sin embargo, ese rasgo militar, la costumbre de Cárcel de tratar cada mañana como algo sagrado, había contagiado a Inés como una enfermedad aguda.</p>

<p>La prueba estaba ahí mismo: su cuerpo pesaba como plomo, pero sus ojos, por pura fuerza de la costumbre, se abrían de par en par, parpadeando como un pájaro asustado.</p>

<p>—Haaah...</p>

<p>Ni siquiera tenía fuerzas para suspirar profundamente; solo le salió un suspiro superficial y desganado.</p>

<p>Durante un tiempo, había compensado el vigor matutino, similar a una plaga, con siestas, pero ahora incluso esa pereza había desaparecido. Afortunadamente, la Inés de esta vida apenas dedicaba tiempo a adornarse.</p>

<p>Por lo tanto, bastaba con ser alguien que se peinara y se vistiera adecuadamente.</p>

<p>Así es como cada mañana había transcurrido sin problemas. Hasta hoy, y hasta esta hora, tumbada desnuda en la cama frente a la comida que le habían puesto delante...</p>

<p>Pensar que ni siquiera había sido capaz de bajar a la planta baja de esta modesta casa de dos pisos, acabando así.</p>

<p>—¿Estás despierta?</p>

<p>La puerta del pequeño anexo, que normalmente se utilizaba como cuarto de baño de la pareja, se abrió y entró el culpable. Tenía el pelo de la frente ligeramente húmedo, como si se acabara de lavar la cara.</p>

<p>Sus ojos azules la vieron inmediatamente sentada inmóvil en la cama y se iluminaron. Como era habitual por las mañanas, eran unos ojos que destacaban por ser claros y penetrantes, mientras que solo ella se sentía fresca y alerta.</p>

<p>Naturalmente, su cuerpo siguió rápidamente su mirada. Sus zancadas eran largas, y su habitación era menos de la mitad del tamaño de los dormitorios que cada uno había ocupado antes de casarse.</p>

<p>—Me preocupaba que no te levantaras.</p>

<p>—Pues sigue preocupándote. Todo es gracias a ti.</p>

<p>Inés lo miró con los ojos entrecerrados.</p>

<p>Cárcel era, en muchos sentidos, su polo opuesto. El hecho de que Inés fuera especialmente vulnerable por las mañanas no era más sorprendente que su propio vigor matutino, pero nunca antes el contraste había sido tan marcado como hoy.</p>

<p>Por supuesto. Después de atormentar a alguien así... Ella lo miró con claro resentimiento, pero el rostro inmaculado de Cárcel no mostró ningún atisbo de emoción.</p>

<p>Por la tarde, él era perfectamente obediente, pero por la mañana siempre era así. Esa terquedad, como si las palabras de Inés a veces ni siquiera le llegaran. Esa indiferencia, sin molestarse siquiera en ocultar que no le hacía caso...</p>

<p>—Lo sé, Inés. Por eso lo preparé todo para que no tuvieras que bajar.</p>

<p>—No me digas que alguien me vió así.</p>

<p>—No te preocupes. Yo mismo recibí tu comida.</p>

<p>Cárcel estaba completamente imperturbable, con un aspecto refrescante y alegre. Era evidente que habían estado revolcándose juntos, pero él parecía alguien que acababa de regresar de otro mundo, lo cual era irritante.</p>

<p>No era como si ella hubiera tenido sexo sola; si había alguna fuerza involucrada, era él principalmente arrastrándola y atormentándola.</p>

<p>Entonces, ¿por qué era ella la única que se sentía completamente agotada?</p>

<p>Cárcel parecía haberle chupado hasta la última gota de energía. Su estado de ánimo era inusualmente más alegre que otras mañanas, y esa expresión de satisfacción en su rostro, que recordaba a la satisfacción después de una cena copiosa, solo lo reforzaba.</p>

<p><span style="font-style:italic">¿Cómo se atreve a poner esa cara de satisfacción...?</span></p>

<p>—¿Cómo lo recibiste?</p>

<p>—Fuera de la puerta.</p>

<p>—...</p>

<p>—Estás llena de sospechas, ¿no?</p>

<p>Después de decir eso, la mano que naturalmente peinó el cabello de Inés hacia atrás se sintió extrañamente seductora. Estaba claramente despeinada, y su intención de simplemente arreglarlo era igualmente clara, pero nunca se sabía dónde podría saltar la chispa.</p>

<p><span style="font-style:italic">Cárcel realmente se excita con facilidad...</span> Cuando Inés apartó su mano con profunda desconfianza, como si viera claramente esa desconfianza, Cárcel puso al instante una cara de inocencia y sonrió.</p>

<p>—Tu pecho se sacude, Inés.</p>

<p>—...</p>

<p><span style="font-style:italic">¿De qué servía esa cara inocente?</span> Él miró el pecho desnudo de Inés y le hizo un comentario sexual con cara de inocencia del tipo “Gracias por la bonita vista”, y antes de que ella pudiera lanzarle una severa advertencia contra su acoso cada vez más habitual, su mano se abalanzó para agarrarle el pecho con fuerza.</p>

<p>Finalmente, la mano de Inés persiguió la mano malvada que le había retorcido el pezón y le dio un fuerte golpe. Él siguió su mano, se la arrebató y la sujetó con fuerza entre sus dedos.</p>

<p>—Deberías haberte dejado la ropa puesta.</p>

<p>—Que esté desnuda no significa que te esté invitando a tocarme.</p>

<p>—De todos modos, querría tocarte aunque estuvieras vestida.</p>

<p>Así que no fue porque estuviera desnuda por lo que él la había tocado. Con esa lógica, parecía una pérdida de tiempo seguir discutiendo.</p>

<p>Claro, no es como si tocar un simple pecho lo fuera a desgastar... Pensó Inés con indiferencia, como si no se tratara de su propio cuerpo, pero temiendo que él volviera a abalanzarse sobre ella, buscó a tientas la bata que Cárcel había dejado sobre el cabecero.</p>

<p>Su desnudez, que aunque no le había avergonzado en su noche de bodas, ya le producía absoluta vergüenza. Sin embargo, Cárcel por la mañana podía ser más insistente que por la noche, aunque no tuvieran sexo. Y cuando había escuchado su desafiante réplica: “Bueno, no voy a tener sexo contigo, así que eso es todo, ¿no?”, se quedó sin palabras, no solo por lo absurdo, sino por la pura audacia de la afirmación.</p>

<p>Así que, antes de que él pudiera volver a hablar, era mejor alejarlo de su vista. Inés levantó el camisón con la mano libre para cubrirse el pecho y dijo:</p>

<p>—... Baja rápido a comer. No soporto verte esta mañana.</p>

<p>El rechazo fue bastante firme. Sin embargo, los dedos entrelazados alrededor de su muñeca no se aflojaron. Ella terminó forzando su mano atrapada para tirar con todas sus fuerzas. Sin intención de soltarla, no había forma de que él cediera.</p>

<p>En lugar de soltar la mano de Inés, Cárcel le bajó suavemente el camisón con la otra mano. Una vez más, su pecho quedó al descubierto, pero, curiosamente, no fue su pecho sino sus ojos los que se encontraron con la mirada de él.</p>

<p>—Yo lo hago.</p>

<p>—Yo puedo...</p>

<p>—Ni siquiera puedes levantar los brazos correctamente.</p>

<p>—... ¿Y de quién es la culpa?</p>

<p>—Mía.</p>

<p>Respondió obedientemente, colocando el camisón sobre la cabeza de Inés. Parecía arrepentido, pero su expresión distaba mucho de ser de remordimiento.</p>

<p>—Porque me comporté como un perro en celo.</p>

<p>Su voz, más baja al acercarse, le rozó el lóbulo de la oreja con un susurro secreto. Deslizó las manos dentro del camisón, guiando cada uno de sus brazos hacia las mangas, luego retiró las manos del interior, acariciando suavemente el costado de su pecho antes de apartarse.</p>

<p>Ella misma lo sabía, así que no había nada más que decir. Sí. Sabía que había actuado como un perro en celo... Murmurando eso con una voz que sonaba aturdida y agotada, le apartó el pelo a Inés y sonrió.</p>

<p>Aun así, su mirada seguía llena de un deseo implacable, lo que despertó instintivamente su recelo. Sin embargo, fue él quien rompió el contacto primero.</p>

<p>—Ayer falté al entrenamiento. Lo siento, tendré más cuidado a partir de ahora.</p>

<p>—¿Importa?</p>

<p>Como si fuera la primera vez que oía un comentario tan abrupto, Inés lo miró con expresión nerviosa y le preguntó.</p>

<p>—Sí, importa.</p>

<p>Cárcel respondió simplemente y se acercó a la mesa que había junto a ellos. Solo entonces ella se fijó en la comida que había sobre la mesa cerca de la cama.</p>

<p>Carne de ternera ligeramente asada, del tipo que seguramente gotearía sangre si se cortara, algunas verduras cocidas... Si la comida de la cama era para ella, se trataba de un desayuno sencillo destinado exclusivamente a Cárcel.</p>

<p>Era comida colocada simplemente para comer junto a Inés. Sin embargo, los hombres de Ortega nunca desayunaban en las habitaciones. A menos que fueran un paciente moribundo.</p>

<p><span style="font-style:italic">¿Qué pensaría todo el mundo de esto...?</span> Esta muestra de armonía conyugal no era en absoluto el desarrollo que Inés había planeado.</p>

<p>Inés tenía que ser la que lo deseara unilateralmente y sea rechazada. Todo este asunto de que se quisieran tanto que se encerraban en su habitación durante el desayuno, negándose a salir, solo alimentaría la imaginación desenfrenada de la gente...</p>

<p>—Usualmente gasto mi energía antes de venir.</p>

<p>—¿Qué energía...? Ah.</p>

<p>Inés se quedó sin palabras en mitad de su réplica, comprendiendo de repente. Aunque ayer hubiera sido, como ella dijo, un día rebosante de energía, tenía poco que decir sobre los días en los que él afirmaba se agotaba a propósito.</p>

<p>—... Entonces, ¿este es el resultado de tu propio autocontrol?</p>

<p>Pero cuando volvió a preguntar en voz baja, Cárcel pareció no oírla, ya que estaba cortando la carne.</p>

<p>Cuando cortaba carne, se volvía así. Como un carnívoro para quien sólo existe la carne y él mismo en el mundo, nunca escuchaba a los demás.</p>

<p>Que la ignoraran sutilmente era una cosa, pero Inés sentía una extraña renuencia a admitir la derrota. Extendió la mano hacia la bandeja. En el momento en que levantó la mano, los débiles restos de fuerza en sus dedos se agotaron por completo, por lo que el simple hecho de agarrar la bandeja le exigió todo su esfuerzo.</p>

<p>No le quedaba ni una pizca de fuerza en los dedos. Probablemente era la venganza por haberse distraído un poco la última vez... Por mucho que lo pensara, le parecía un acto de venganza prolongado disfrazado de sexo.</p>

<p>Sin embargo, como ella misma había dicho, la diferencia entre los días que entrenaba y los que no era muy evidente. Parecía que era por eso, y sin embargo no lo parecía... Dicho esto, tampoco era como si no le hubiera costado esfuerzo los días que entrenaba.</p>

<p>Fuera lo que fuera, era irritante, pero verlo tan ileso a pesar de la evidente disparidad en cuanto a resistencia hirió un poco su orgullo.</p>

<p>Así que, si alcanzar la bandeja había sido un esfuerzo desesperado, llevar la pesada bandeja de plata de vuelta a su sitio fue puro orgullo.</p>

<p>—... ¿Por qué no dijiste nada?</p>

<p>Fue en el momento en que casi había conseguido llevarla hasta allí. A solo un palmo de sus rodillas.</p>

<p>Ella observó con total incredulidad cómo Cárcel se la arrebataba hábilmente y la colocaba en su regazo, mirando una vez la comida y luego una vez a él.</p>

<p>—Aunque tus manos tiemblan así.</p>

<p>—No tiemblan. En absoluto.</p>

<p>—No se me ocurrió. Debería haberlo levantado por ti.</p>

<p>—Puedo hacerlo yo sola. No pasa nada...</p>

<p>—¿Te ayudo a comer?</p>

<p>—...</p>

<p>Sus ojos, que preguntaban “¿Te golpeaste la cabeza?”, se fijaron en Cárcel. Sin embargo, él malinterpretó esa mirada y, sinceramente, extendió la mano hacia el cuchillo, lo que llevó a Inés a agarrarle la muñeca con urgencia.</p>

<p>—No, de verdad que estoy bien. Come tú...</p>

<p>—¿Puedes cortar el pan?</p>

<p>—Puedo cortarlo.</p>

<p>—¿Puedes coger el cuchillo?</p>

<p>—Puedo cogerlo.</p>

<p>—Toma.</p>

<p>En el momento en que cogió el cuchillo que él le ofrecía por el mango, su mano tembló de forma tan notable que ella misma lo notó. El cuchillo de plata tenía una hoja inusualmente gruesa y pesada, pero como lo había usado perfectamente bien antes, simplemente debía de estar en malas condiciones.</p>

<p>Cárcel, como si hubiera estado esperando ese momento, le quitó suavemente el cuchillo de la mano. Luego, sentándose justo enfrente de ella, cortó el pan con expresión solemne, como si estuviera inspeccionando un arma. Y lo hizo meticulosamente, en trozos del tamaño de un bocado.</p>

<p>Dada su gran complexión, podría haber parecido cómico, pero la mayoría de las cosas que hacía con esa cara no eran nada graciosas. Incluso Inés, que sentía una ligera emoción ante su aspecto, lo encontraba innegable.</p>

<p>Su flequillo ligeramente húmedo caía despeinado sobre su frente lisa. Inés apartó la mirada, vio la carne que había dejado sin tocar y volvió a hablar.</p>

<p>—Sólo déjalo, Cárcel.</p>

<p>—Cada vez que te veo, tu desayuno es tan pobre.</p>

<p>Cárcel ignoró el comentario de Inés con naturalidad, aunque su tono denotaba un ligero descontento. En la bandeja de plata había un vaso de zumo de limón recién exprimido y un pan de grano dorado, recién horneado por Yolanda.</p>

<p>Para Inés, que prefería un desayuno sencillo, era una comida bastante decente. Pero para un carnívoro que disfrutaba de la carne desde primera hora de la mañana, debía de parecer la comida de un mendigo.</p>

<p>—No me extraña que seas tan débil comiendo así cada mañana.</p>

<p>—... Hay comida de sobra. Tú eres el problema.</p>

<p>—Sí, es culpa mía.</p>

<p>Lo admitió sin reparos. Tras responder obedientemente, levantó una rebanada de pan y se la acercó a la boca. Inés lo observaba en silencio, con los labios apretados.</p>

<p>—Inés. Abre la boca.</p>

<p>—...</p>

<p>—Me lavé las manos. Están limpias.</p>

<p>—...</p>

<p>—Te estoy pidiendo que comas el pan, no que me chupes la verga, Inés.</p>

<p>—… ¿Cómo puedes decir tremenda guasada?</p>

<p>Preguntando desconcertada, Inés masticó y tragó por reflejo el trozo de pan que se le había deslizado en la boca.</p>

<p>—Y no es que tengas las manos sucias, es solo que esto es…</p>

<p>—Otra vez, ah.</p>

<p>—Déjalo. Dámelo. Vete.</p>

<p>Si hubiera sabido la expresión de su rostro mientras la observaba —su cabeza moviéndose rápidamente de un lado a otro, esquivándolo frenéticamente mientras intentaba arrebatarle el pan de la mano a Cárcel—, nunca habría hecho un esfuerzo tan ferviente.</p>

<p>—Este comportamiento es repugnante...</p>

<p>—¿Es tan repugnante que te de comer?</p>

<p>—Es vergonzoso y lo odio... Así que vete, déjalo ya.</p>

<p>—¿Y sin embargo esa misma boca se tragó mi pene?</p>

<p>Mientras Inés se quedaba momentáneamente sin palabras ante el comentario tan directo, le metió otro trozo de pan en la boca.</p>

<p>Cárcel sonreía. Como si estuviera mirando la cosa más bonita del mundo.</p>

<p>—Tu boca realmente acepta todo lo que le ponen, ¿verdad?</p>

<p>—...</p>

<p>Mientras masticaba sin pensar, le metió otro trozo de pan en la boca. Esta vez, vino acompañado de unos dedos largos y gruesos.</p>

<p>Inés frunció el ceño y mordió con fuerza la mano. Había mordido para hacer daño, así que, por supuesto, le dolió, pero lo que llegó a sus oídos fue una pequeña risita.</p>

<p>Al levantar la vista, vio que él sonreía sinceramente. Como si lo hubiera mordido un gatito o alguna otra criatura insignificante. Como si un dolor fugaz y cosquilleante hubiera ido y venido...</p>

<p>Era una mujer que una vez le había dislocado el hombro a su marido con la culata de un rifle de caza. Desde luego, no era alguien a quien se pudiera tratar así, como a un gato insignificante...</p>

<p>—Tu mordida, es como la de un gatito.</p>

<p>—...</p>

<p>—Bueno, tu temperamento también lo es, tan quisquilloso.</p>

<p>Otro trozo de pan se deslizó en su boca abierta y aturdida.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>Le llevó un rato sacudirse la trivial conmoción de la mañana.</p>

<p>—... Si sigues así, no habrá posibilidad de tener un hijo, Cárcel.</p>

<p>Gracias a eso, se encontró lanzando tardíamente las palabras que había dejado escapar sutilmente esa mañana a la nuca de Cárcel mientras se vestía con su uniforme.</p>

<p>Pero ahora era el momento de abordarlo.</p>

<p>Esto no podía seguir así. Uno necesita algo con lo que estar insatisfecho antes de no poder soportar la frustración y salir corriendo. Sin embargo, incluso a sus ojos, no había nada en Cárcel en esos días que dejara que desear. Solo cuando una casa resulta agobiante se piensa en abandonarla. Pero a este ritmo, parecía que él podría quedarse atrapado allí para siempre, sin salir nunca...</p>

<p><span style="font-style:italic">Al principio era definitivamente diferente...</span></p>

<p>Y durante un tiempo, no había sido así...</p>

<p>Los primeros días de su matrimonio, cuando habían vivido plácidamente sin compartir la cama desde su noche de bodas, ahora parecían un recuerdo lejano. Ahora solo se preocupaban por el sexo. O más bien, simplemente por pasar tiempo juntos, sin hacer mucho más.</p>

<p>¿A quién culparía? Inés conocía muy bien sus propios atractivos. Así es como veía su situación actual: una figura, si bien no tan perfecta como en sus días de Princesa Heredera, aún así bastante espléndida; un rostro que, incluso sin adornos elaborados, parecía persuadir de pensar: “¿No es bastante bonita?”.</p>

<p>Inés hacía esta valoración sin la más mínima complacencia. Aun así, eso no despertaría mucha emoción en Cárcel Escalante. Sin embargo, dada la actual pretensión de un matrimonio sagrado, no tenía más remedio que conformarse con ello, contenta con resignarse.</p>

<p>Además, ¿no había sido un momento perfectamente desafortunado cuando empezó a adornarse ligeramente para ganarse el favor de quienes la rodeaban? Al darse cuenta de ello, volvió a mezclar atuendos monótonos, pero le parecía bastante inútil a una edad tan apasionada.</p>

<p>—Eso no puede ser...</p>

<p>Esta situación dificultaba la liberación de Cárcel Escalante.</p>

<p>—Por lo tanto, son necesarias unas reglas sistemáticas.</p>

<p>Y como su plan no contemplaba la posibilidad de ejercer el veto, en lugar de una negativa rotunda, necesitaba establecer reglas de forma indirecta.</p>

<p>—... ¿Hijo?</p>

<p>Sin responder de inmediato, Cárcel, que ahora llevaba puesta su camisa, se la abrochó y la miró de reojo.</p>

<p>Incluso después de pronunciar la palabra “hijo”, estaba claro que nunca lo había considerado realmente.</p>

<p>Así que solo se estaba divirtiendo, ¿era eso? Ella habló, ocultando sus sentimientos ligeramente retorcidos.</p>

<p>—Elijamos días adecuados.</p>

<p>—Adecuados, dices.</p>

<p>—Días favorables para que yo conciba.</p>

<p>Bajó la mirada brevemente mientras se abrochaba los puños, luego la levantó de nuevo con una expresión peculiar.</p>

<p>—Es bastante estimulante oír eso a primera hora de la mañana.</p>

<p>—Por favor, no me interrumpas, solo escucha, Cárcel.</p>

<p>Inés respondió con calma, como si le cortara el paso.</p>

<p>—Fijemos los días, fijemos las reglas. Como cualquier otra pareja.</p>

<p>—¿No sería más efectivo hacerlo regularmente todos los días?</p>

<p>—... Por favor, guárdate el ejercicio regular para ti. No puedo seguirte el ritmo.</p>

<p>—Te pedí perdón por lo de ayer. A partir de hoy, moderaré considerablemente el entrenamiento.</p>

<p>Cárcel respondió con extrema seriedad. <span style="font-style:italic">¿Por qué demonios la extremesa...?</span> Inés frunció el ceño como si lo rechazara de plano y negó enérgicamente con la cabeza. Él acortó la distancia, todavía vestido solo con la chaqueta azul del uniforme sobre la camisa.</p>

<p>—En cambio tú, Inés. Parece que no tienes intención de esforzarte al máximo.</p>

<p>—... ¿Qué?</p>

<p>—Ni siquiera estás pensando en maximizar tus posibilidades dándolo todo. ¿Ya estás intentando tomar atajos?</p>

<p><span style="font-style:italic">¿No dar lo máximo de sí?</span> Esas palabras hirieron tanto el orgullo como el espíritu competitivo de Inés, que estaba viviendo con más intensidad que nunca.</p>

<p>—Cárcel, habla claro. Estoy dando lo mejor de mí. Tú solo estás disfrutando del espectáculo.</p>

<p>—Si hablamos de diversión, parece que tú también lo disfrutas bastante.</p>

<p>—...</p>

<p>—Justo ayer...</p>

<p>Una avalancha de recuerdos hizo que Inés perdiera momentáneamente el hilo. Cárcel sonrió mientras abrochaba los botones de su uniforme uno por uno.</p>

<p>—Con la boca abierta así, me dan ganas de llenártela de nuevo.</p>

<p>—Tú...</p>

<p>—... Me refería de comida.</p>

<p>—... Volvamos al tema principal.</p>

<p>—Entendí perfectamente lo que quisiste decir.</p>

<p>—¿De verdad?</p>

<p>Preguntó ella, con voz cargada de incredulidad. Cárcel abrochó el último botón por encima del cuello y asintió.</p>

<p>—Te estoy escuchando, ¿no?</p>

<p>—No. No estás escuchando...</p>

<p>—No. Te escucho. Así que, a partir de esta noche, lo haré moderadamente, solo una vez.</p>

<p>—¿A partir de esta noche?</p>

<p>—Reflejando tu opinión.</p>

<p>—¿Entonces estás diciendo que lo harás todos los días?</p>

<p>—Yo también reflejé mi opinión.</p>

<p>—...</p>

<p>—Endereza un poco la parte trasera de mi cuello.</p>

<p>Inés, momentáneamente hipnotizada, se giró y se puso de puntillas detrás de la ancha espalda de Cárcel, alisando suavemente el cuello ligeramente arrugado. Él se giró con una expresión renovada.</p>

<p>—Gracias por ayudarme otra vez hoy, Inés.</p>

<p>Aunque en realidad ella no le había ayudado hoy, Cárcel expresó su gratitud con notable audacia, besando la cabeza de Inés.</p>

<p>Inés se quedó sola en el vestidor después de que Cárcel se marchara.</p>

<p>—... Esto no es bueno...</p>

<p>Este giro de los acontecimientos no es bueno...</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—¿Por qué está más delgada?</p>

<p>Inés puso los ojos en blanco para evitar la mirada de Raúl. No había adelgazado, pero si alguien insistía en que parecía más delgada, solo había una razón.</p>

<p>Y no podía decir cuál era la razón.</p>

<p>—... He comido y vivido bien.</p>

<p>—¿Y cómo ha dormido?</p>

<p>—También dormí bien, ya lo sabe.</p>

<p>—De verdad... Por eso insisto en que Juana o yo debemos atender a la señora Inés.</p>

<p>—¿Qué tal el castillo de Esposa?</p>

<p>—Primero, tome esto.</p>

<p>Raúl sacó una carta del interior de su chaleco. En cuanto vio el sello, Inés suspiró.</p>

<p>—¿También estuviste en Pérez?</p>

<p>—Pensé que quizá no desearía que se trasladara todo a Esposa. Las pertenencias estaban en el castillo de Pérez, así que Juana y yo las clasificamos allí.</p>

<p>—Bien hecho. Bien hecho, pero...</p>

<p>Cogió la carta con un destello de renuencia.</p>

<p>Era de su madre, la Duquesa Valeztena.</p>

<p>—¿La quemo antes de que la lea?</p>

<p>Raúl hizo la pregunta con naturalidad, como si él tampoco la hubiera entregado de buen grado. Inés negó con la cabeza.</p>

<p>Los días en los que se enfrentaba con su madre por cualquier nimiedad, llegando incluso a autolesionarse, habían quedado atrás hacía más de una década.</p>

<p>En aquella época, Inés era insoportable, como si tuviera problemas para controlar su ira. “Eres repugnante, así que vístete bien”, “¿Qué hay de tu cuerpo gordo como el de un cerdo?”, “¿Qué con ese pelo tuyo?”, “¿Y esa expresión?” “¡Hazlo como una dama!”. “¡Quítate esa ropa horrible antes de que te desnude y te cuelgue de la puerta de la ciudad!”. Esas eran las únicas palabras que su madre pronunciaba cada vez que veía a Inés, de seis años, y ella, desesperada por su nueva vida, no tenía paciencia alguna.</p>

<p>Cuando las doncellas de la Duquesa intentaban peinarla, se arrancaba el pelo; rompía todos los vestidos de colores en pedazos; y cada vez que oía algún comentario sobre su cuerpo, se infligía heridas.</p>

<p>Si el más mínimo aumento de peso se consideraba problemático, comía desafiante; si pasaba hambre, hacía una rabieta. Cuando la amenazaban con desnudarla y colgarla, ella respondía: “Muy bien”, e intentaba desnudarse antes de salir por la puerta. Solo entonces la Duquesa parecía darse cuenta de que no podía controlar a Inés.</p>

<p>Para una dama noble, su aparición con ropa de luto estaba más allá de los límites de la decencia y, como madre, la interferencia era quizás inevitable. Sin embargo, para Inés, cuya relación con su madre se había visto profundamente distorsionada desde su primera vida y cuyo corazón se había endurecido, cada una de las palabras neuróticas y abusivas de su madre era una tortura insoportable.</p>

<p>Su madre en la primera vida, que había sufrido todo tipo de paranoias, delirios de persecución y depresión neurótica, atormentando incluso a los jóvenes Luciano e Inés, siguió sin apoyarla incluso después de que Inés se convirtiera en Princesa Heredera.</p>

<p>¿Quién creería que la mayoría de las palabras que la Emperatriz Cayetana escupía para humillar deliberadamente a su nuera procedían de su propia madre biológica?</p>

<p>No solo la casa real la culpaba de los repetidos abortos espontáneos. Inés estaba dolida, aunque por entonces ya no quería en absoluto a su madre.</p>

<p>La Duquesa, que infligía tanto dolor a sus hijos pero ansiaba su afecto y atención, solía enviar cartas amenazadoras dirigidas “A mis queridos hijos” cuando Luciano e Inés crecieron y simplemente se distanciaron de ella.</p>

<p>Luego, el año en que cumplió veinticuatro años, llegó incluso a intentar suicidarse, dejando a Luciano una nota de suicidio en la que decía: “Esto ha pasado por culpa tuya y de tu hermana”...</p>

<p>Inés odiaba esa única nota de suicidio de aquel día más que todas las palabras crueles que había escuchado de su madre a lo largo de toda su vida.</p>

<p>Que hubiera tomado esa decisión únicamente para dejar a sus hijos con culpa. Sabiendo perfectamente lo sumida que estaba la vida de su hija en el fango, lo había hecho sin una pizca de preocupación...</p>

<p>Desde el día en que confirmó que su madre no había muerto, hasta el día en que ella misma murió, nunca volvió a ver a la Duquesa. Las cartas de Pérez fueron quemadas sin leer.</p>

<p>Quizás ese hábito permaneció... Cuando la joven Inés rechazó durante años cualquier interferencia y se enfureció salvajemente, la Duquesa, asustada por ese rostro poseído por espíritus malignos, comenzó a disciplinarla por carta incluso dentro de los terrenos del castillo, alegando que no podía soportar hablar. Sabiendo muy bien que Inés utilizaba todas las cartas que recibía simplemente como leña.</p>

<p>El Duque Valeztena y Luciano eran hombres débiles que se retiraban ante el más mínimo empujón de ella, pero la Duquesa era muy diferente. Inés se dio cuenta de este hecho de repente, alrededor de los diez años.</p>

<p>Fue entonces cuando comprendió que aquel momento de su primera vida había sido el último en el que su madre la había amado.</p>

<p>Sí, era amor.</p>

<p>Aunque la mujer de aquella época y la mujer de esta vida no eran la misma, y aunque ella fuera totalmente indeseable... era amor. Aunque fuera tan egoísta.</p>

<p>Por eso la Duquesa de aquella época nunca se atrevió a abandonar a Inés. Porque la quería a su manera.</p>

<p>Fue entonces cuando Inés, con su determinación quebrantada, dejó de resistirse.</p>

<p>Aun así, nunca hizo nada de lo que su madre le ordenaba, pero al menos la escuchaba cuando le hablaba directamente y comenzó a tragarse los insultos.</p>

<p>Habiendo muerto dos veces en ataques de ira, y con la vida ahora fluyendo al revés, necesitaba calmar su temperamento. No querer recibir una segunda nota de suicidio declarando “Muero por tu culpa” sin duda influyó.</p>

<p>Incluso eso debió de ser un pecado...</p>

<p>Aguantarlo todo hizo que todo fuera mejor que en su primera vida.</p>

<p>La Duquesa Valeztena, que ahora rehuía casi por completo los compromisos sociales, avergonzada del aspecto sombrío de Inés, descubrió que su mente estaba extrañamente más sana que cuando había sido el centro de la sociedad.</p>

<p>A este ritmo, no intentaría suicidarse; seguramente llegaría a apreciar tanto su propio cuerpo que ni siquiera se cortaría con un trozo de papel.</p>

<p>Su tendencia patológica a atormentar a quienes la rodeaban se había moderado considerablemente. Incluso cuando el Duque expresaba su genuino descontento por los comentarios de la Duquesa, Inés, que conocía la verdad, lo encontraba casi entrañable. Las diatribas ebrias se descartaban como ridículas.</p>

<p>La paciencia de Inés hacia su madre brillaba de verdad, y también brillaban los arrebatos de locura que le recordaban a su infancia. La Duquesa recordaba su infancia, cuando se preocupaba pensando: “¿Y si se vuelve loca y hace algo terrible...?” Justo cuando empezaba a olvidarlo, y aunque empezaba a criticarla, pronto se apresuraba a retractarse y huir.</p>

<p><span style="font-style:italic">Por eso sigue tan aterrorizada que solo se atreve a enviar cartas como esta...</span></p>

<p>Dada la verdadera naturaleza de la Duquesa, ¿cómo podía permanecer ociosa?</p>

<p>Hace tiempo que habría irrumpido en Calstera. La Duquesa, que había entrado con frecuencia en la habitación de Inés, la antigua Princesa Heredera, entrometiéndose sin cesar, y que había atormentado a su hija, que acababa de sufrir un aborto espontáneo, ni siquiera puede acercarse a la residencia de Cárcel.</p>

<p>Por lo tanto, una carta es todo lo que puede hacer...</p>

<p><span style="font-style:italic; color:#777777">「 A mi querida Inés.</span></p>

<p><span style="font-style:italic; color:#777777">Han pasado muchos meses desde que te casaste y te marchaste de Valeztena. Fiel a tu naturaleza ingrata, sigues sin dar señales de vida. Sé muy bien que odias a tu madre, pero que ni siquiera hayas enviado noticias a tu padre es absolutamente deplorable... Sin embargo, ¿cómo puede el corazón de un padre ser igual al de un hijo? En primer lugar, debo preguntarte por tu bienestar.</span></p>

<p><span style="font-style:italic; color:#777777">Seguro que aún no estás embarazada, ¿verdad? Claro que no… Yo no los hubiera tenido… Pero debes aferrarte bien a tu marido, aun así, tu terquedad es desmesurada y me preocupa mucho. No tienes ningún talento en ese aspecto.</span></p>

<p><span style="font-style:italic; color:#777777">Al igual que en nuestra última comida juntos, el Capitán Escalante ahora finge estar de tu lado, como si fuera un hombre de honor, pero no se puede confiar en los hombres. La mayoría de ellos no tienen honor. Así que, Inés, debes tener tu propio hijo para asegurar tu posición. Una mujer sin hijos no es más que un caparazón.</span></p>

<p><span style="font-style:italic; color:#777777">Hablando de caparazones, tu marido es uno. Es tu marido solo en papel. Aunque no hubiera nacido en familia de Escalante, sino en la calle, seguiría siendo el tipo de hombre al que las mujeres rodearían toda su vida. Así que, pase lo que pase, asegúrate de que tu mujeriego, no, tu marido, tenga un hijo mientras aún te tiene en cuenta en la fase de luna de miel. Aunque no le gustes, exige relaciones maritales por la fuerza si es necesario. Antes de que el Capitán Escalante, que no puede cambiar sus costumbres, se vaya y engendre toda una prole en otro lugar.</span></p>

<p><span style="font-style:italic; color:#777777">Cuanto más tiempo viven los hombres con las mujeres, más las desprecian. Mira a tu padre. Si no hubiera tenido hijos, ahora ni siquiera estaría viva. Los hijos son el estatus de una mujer. Sea pobre o rica, noble o no.</span></p>

<p><span style="font-style:italic; color:#777777">Aunque me desprecies, seguro que has aprendido eso observando los hábitos de tu padre. Tú lo eres todo para mí. El amor de una madre es ilimitado, no conoce el resentimiento... Ah, si pudieras comprender este amor.</span></p>

<p><span style="font-style:italic; color:#777777">Una mujer sin hijos no es nada. Inés. Una mujer no puede vivir sin un hombre. Pero si tiene hijos, puede soportar a un marido que sea un completo desastre durante toda la vida. Como yo.</span></p>

<p><span style="font-style:italic; color:#777777">Es una suerte que el Capitán Escalante se haya convertido por fin en tu marido. Cuando una mujer tiene marido, gana un hogar acogedor, sirvientes y una vida cómoda. Para las mujeres nobles como nosotras, incluso una gran finca. Eso es lo que es una vida digna. Dentro de ella, tu único deber es dar a luz a un heredero. Esa es la única tarea que debe cumplir una mujer nacida en este mundo… 」</span></p>

<p>—Sólo quémala.</p>

<p>Inés, con la paciencia agotada, le devolvió la carta a Raúl sin siquiera leer la mitad. Raúl la aceptó sin hacer preguntas y se dirigió directamente al candelabro que había en la pared del salón, cuya llama aún ardía.</p>

<p>Pensar que los hijos a los que ni siquiera amaba eran todo lo que poseía... Visto desde otro ángulo, era una vida a la vez ridícula y lamentable. La Duquesa Valeztena era el epítome de una persona que nunca debería haber tenido hijos.</p>

<p>A menos que se los amara de verdad, tal vez. A menos que fueran realmente todo su mundo, tal vez... Una vida cómoda, una vida adecuada, reducida a nada más que atormentar a los demás y atormentarse a sí misma.</p>

<p>A diferencia de antes, Inés ahora se mantenía un paso atrás de su madre, contemplando su propia vida. Sin embargo, al mismo tiempo, una irresistible necesidad surgió en su interior de desafiar todo lo que su madre le ordenaba.</p>

<p>Por la mañana, había considerado tener un hijo; por la tarde, no quería volver a tener uno hasta su muerte. Todo por una sola carta.</p>

<p><span style="font-style:italic">... No debo dejarme influenciar por ella.</span></p>

<p>De todos modos, a su madre no le importaba. Si todo salía según lo previsto, ahora viviría su vida sin preocuparse por su madre hasta la muerte. Dijera lo que dijera su madre, al menos esta vida transcurría según su propia voluntad, no la de la familia real, Óscar o sus padres.</p>

<p>Aun así, tragarse eso le dejó un sabor amargo en la boca.</p>

<p>Hace mucho tiempo, las palabras que le había dicho a su hija tras sucesivos abortos espontáneos habían sido precisamente esas. Ella había sido la Princesa Consorte y lo único que se le exigía era dar a luz a un heredero. ¿Por qué, le había preguntado, ni siquiera era capaz de eso?</p>

<p>Si Inés, que le llevó mucho tiempo casarse con Cárcel, era “comida en mal estado” para su madre, entonces cuando había abortado al hijo de Óscar, era un “producto defectuoso”.</p>

<p>Inés recordó de repente la humillación de aquel momento como si fuera ayer, cuando la Duquesa había inclinado la cabeza ante la Emperatriz Cayetana, suplicando perdón y diciendo: “Este cuerpo, imperfecto y descuidado, sigue perdiendo la preciosa semilla de Su Majestad”.</p>

<p>También recordó que en ese mismo instante odió a su madre más que a la Emperatriz.</p>

<p>—¿Y la respuesta?</p>

<p>—No escribiré ninguna.</p>

<p>—Ha tomado la decisión correcta. A decir verdad, ya le he transmitido sus respetos... Debe de haber enviado la carta con la esperanza de escuchar su respuesta directamente, sabiendo muy bien que ya lo sabría.</p>

<p>—Si realmente hubiera deseado escucharla ella misma, no lo habría expresado así.</p>

<p>Raúl estudió su rostro con atención, como si evaluara el estado de ánimo de Inés con familiaridad. Era una vieja costumbre, e Inés le dedicó una leve sonrisa para evitarle cualquier incomodidad innecesaria antes de preguntar.</p>

<p>—¿Cómo es Esposa? Cuéntame.</p>

<p>—Es como un castillo abandonado.</p>

<p>—...¿Qué?</p>

<p>—Una vez que vaya, será suyo, señora Inés. Eso es seguro.</p>

<p>La lealtad que había en su rostro momentos antes, estudiando atentamente la expresión de ella, había desaparecido; ahora los ojos de Raúl brillaban con ambición.</p>

<p>—No hay nada que quiera en particular...</p>

<p>—Señora Inés, ¿qué está diciendo? Después de todo, cuando el Capitán Escalante herede el título de Su Excelencia el Duque, todo pasará a ser suyo, ¿no? Es el orden natural de las cosas.</p>

<p>—Entonces, ¿mis deseos no son particularmente importantes?</p>

<p>—¿Por qué rechazar algo que de todos modos será suyo? Solo le sugiero que lo tome antes.</p>

<p>—¿Y la Duquesa Escalante?</p>

<p>—Por lo que he oído, a la Duquesa no parece importarle mucho Esposa. Pasa las cuatro estaciones exclusivamente en Mendoza.</p>

<p>—He oído que la Duquesa está a menudo en Mendoza.</p>

<p>Probablemente no se trate tanto de que le desagrade Esposa como de que le desagrade la Emperatriz Cayetana. Debe de estar demasiado ocupada dejándose arrastrar por la codicia de esa mujer cada vez...</p>

<p>Una dama algo delicada y de carácter afable, que sonreía con suavidad. Cuando era la esposa de Óscar, ella había sido su tía. Habían estado en el mismo lugar innumerables veces, pero, a diferencia de Cárcel, nunca hubo un punto de conexión extrañamente distintivo entre ellas.</p>

<p>Probablemente era una de esas personas a las que consideraba con indiferencia, demasiado preocupada por el mundo que giraba a su alrededor. Sin embargo, ese mismo hecho también daba fe de la naturaleza tranquila de la Duquesa Escalante. Esta vez, mantenían una relación razonablemente fluida y distante...</p>

<p>—Y una vez que su hermano menor se haya graduado de la academia militar y sea nombrado oficial, pasará toda su carrera yendo y viniendo entre su puesto y Mendoza. Por lo tanto, únicamente, todo será...</p>

<p>—... ¿Mío?</p>

<p>Cuando Inés preguntó sin mucho entusiasmo, los ojos de Raúl se iluminaron y asintió con la cabeza.</p>

<p>—Señora Inés, con solo estar presente allí, todo quedará naturalmente bajo su mando.</p>

<p>—No deseo especialmente nada a mi mando.</p>

<p>—Entonces no debería haberse casado con el hijo mayor de Escalante. Usted misma lo eligió, y ahora...</p>

<p>Raúl refunfuñó irreverentemente, pero luego cambió de expresión.</p>

<p>—En cualquier caso, entiéndalo así. Cuando vaya, solo tiene que llamarme.</p>

<p>—Lo tengo claro, así que deja de intentar lavarme el cerebro.</p>

<p>—Y hay noticias que llegaron al castillo de Pérez hace quince días, pero que aún no han llegado a Calstera. Son noticias de Don Joaquín, enviadas tras un largo silencio, sobre los jóvenes pintores a los que patrocina...</p>

<p>Su mirada, que por un momento había fingido mirar por la ventana, volvió al rostro de Raúl.</p>

<p>—Parece que Magdalena ya ha empezado a hacerse un nombre pintando retratos de comerciantes locales. Dice que ha tenido trabajo constante al menos desde este verano hasta el otoño. Expresó su gratitud diciendo que todo se lo debía a su primera presentación, señora Inés.</p>

<p>—Eso es estupendo.</p>

<p>—Por supuesto, escribió la carta pensando en su mecenas, el anciano banquero... Estaba muy preocupada por su salud. “Incluso sin conocer a Inés, hay que admirar su corazón”.</p>

<p>Inés escuchó las noticias de Raúl sin inmutarse y levantó su copa para dar un ligero sorbo.</p>

<p>—Sigue con el mecenazgo. Tiene demasiado talento como para quedarse estancada pintando retratos de comerciantes. Pídele que envíe aquí un bodegón este invierno... Nos vendría bien algo de decoración.</p>

<p>—¿Y Archibald? La última vez dijo que le gustaban más los bodegones que pintaba. Podría enviarle un mensaje para que pinte uno de inmediato.</p>

<p>—Dijo que quería encerrarse en la cabaña de Carlo hasta el invierno y pintar nada más que lagos a su antojo. Deja que siga pintando lo que desee. Seguro que surgirá algo sorprendente, tal y como él presumía... Que Archibald envíe lo que más le guste este invierno también. Al fin y al cabo, nada es gratis.</p>

<p>—Se lo diré. Y María, María, ya sabe. Parece que va a pasar todo el año en Mendoza pintando solo el retrato de la Condesa Gorma. No ha podido aceptar ningún otro encargo.</p>

<p>—Una mujer con gran narcisismo.</p>

<p>La clienta con un considerable amor propio y la pintora especializada en halagos estaban unidos de forma inseparable. Sabiendo esto, ella había facilitado deliberadamente la conexión; el fracaso era imposible.</p>

<p>Inés se rió para sus adentros, imaginándose a su antigua amiga hipócrita cubriendo toda la galería del castillo con sus propios retratos.</p>

<p>Pero la agradable fantasía perdió rápidamente su poder y se disipó. Se concentró en la voz de Raúl, con una expresión casi inexpresiva.</p>

<p>—Le gustó tanto que ha propuesto suspender todos los demás mecenazgos y aceptar el apoyo exclusivo de la familia Gorma. El precio del cuadro es un asunto aparte.</p>

<p>—Es un alma generosa, así que es bueno para María. El trabajo puede ser un poco monótono... pero después de unos años de esfuerzo, podrá hacer lo que quiera. Deja que la chica haga lo que quiera. No me preocuparé por ello.</p>

<p>—Se lo transmitiré. Y he oído que Lourdes y Emiliano, de Oligarquía, van a ser movilizados para la restauración de los cuadros de la catedral de Bilbao este invierno.</p>

<p>No le había pasado desapercibido que se mencionara ese nombre, pero su mano, que sostenía la copa, se tensó ligeramente sin pensarlo, antes de relajarse de nuevo.</p>

<p>—Don Joaquín preguntó su opinión sobre este asunto. Dijo que Lourdes y Emiliano, que acababan de empezar a alcanzar precios más altos, ahora estarían atados como esclavos al gremio durante al menos tres años.</p>

<p>—Esclavos.</p>

<p>Ella respondió con tono pragmático, como si simplemente estuviera reconociendo la noticia sobre unos jóvenes pintores cuyos rostros ni siquiera conocía.</p>

<p>La resistencia a veces requiere valor. Inés recorrió el borde de su copa con los dedos y se encontró con la mirada de Raúl.</p>

<p>Los ojos de alguien que no sabía nada del peso o el significado de ese nombre. Sin embargo, en esta vida, eran los únicos ojos, y los más familiares, que compartían directamente el nombre de Emiliano.</p>

<p>Así, algunos días le impedía sentirse sola y otros la hacían sentir sola.</p>

<p>Sin embargo, ¿podría haber una pista más bienvenida que el sonido de otra persona pronunciando su nombre? Cuando Raúl mencionó casualmente el nombre de Emiliano, Inés finalmente sintió la certeza tangible de que Emiliano estaba realmente vivo. Lo que había parecido una ilusión cuando lo murmuró sola en el vacío se convirtió en realidad.</p>

<p>Para ella, que ni siquiera podía vislumbrar a Emiliano desde lejos, era lo más parecido a una confirmación. Porque nunca se había concedido ni una sola oportunidad de ver con sus propios ojos que estaba vivo.</p>

<p>Acarició los pequeños rastros de Emiliano, vivo, en la voz de Raúl.</p>

<p>No era casualidad que Inés, con quince años, hubiera contratado al competente Raúl para encontrar a Joaquín entre los muchos mercantes de arte de Mendoza.</p>

<p>Fue él quien conectó a Agustín, que había contratado a Emiliano como asistente, con la corte real, y fue Joaquín quien presentó a Emiliano como el discípulo de ese pintor malhumorado.</p>

<p>Aunque había vivido repitiéndose que su vida estaba destinada a ser vivida sin ningún tipo de vínculos, por alguna razón, le resultaba difícil alejarse del Emiliano de diecisiete años. Un poco deficiente, ignorante de las costumbres del mundo, el más amable y el más tonto de todos los que conocía: el encantador Emiliano antes de conocerla.</p>

<p>Apenas un año después de conocer a Inés, el inocente Emiliano, de diecisiete años, que había caído directamente en una trampa en la que no aprendió nada, pero le robaron su talento, fue agredido por el borracho Agustín incluso la noche antes de huir con Inés de Pérez.</p>

<p>El hermoso retrato de Inés, destinado a gran éxito, era en parte obra de Emiliano. El joven pintor desconocido, ajeno a las costumbres del mundo e incapaz de ocultar su desbordante talento, debió de anhelar simplemente algo de instrucción y reconocimiento por parte del artista que entonces estaba en la cima de su fama. Sin embargo, todo lo que recibió el fiel asistente fue envidia y desprecio.</p>

<p>Inés, de quince años, recordaba que cuando vio por primera vez a Emiliano, su dedo meñique derecho ya estaba ligeramente torcido. Recordaba la noche en que se enteró de que se lo había roto Agustín con la bota, y cómo la había consumido el deseo de matarlo...</p>

<p>Inés decidió impulsivamente impedir el futuro en el que Emiliano se rompiera la mano. Y, a diferencia de esa resolución impulsiva, se envolvió en un disfraz bastante calculado.</p>

<p>Un mecenas que apoyaba a pintores jóvenes y sin recursos —talentosos pero desconocidos, cuyo valor era imposible de medir— permitiéndoles crear obras con su propio nombre desde el principio y ganar renombre más rápido de lo esperado. Y un inversor que monopolizaría el valor de los nombres que había elevado...</p>

<p>Se trataba del negocio de coleccionar las primeras obras de los genios y revenderlas décadas más tarde a un precio diez o cien veces superior al original. Así que, en apariencia, ese era el negocio del que hablaba. Al fin y al cabo, los aristócratas que se jactaban de su conocimiento en materia de arte se dedicaban ocasionalmente a tales prácticas.</p>

<p>Inés aceptó a todos los pintores jóvenes y desconocidos que Joaquín le recomendó con confianza, quien a cambio recibió una cuantiosa comisión de ella. María, Archibald, Magdalena, Lourdes y Emiliano...</p>

<p>En marcado contraste con su inmenso fervor por rescatarlo de las garras de Agustín, Emiliano fue el último pintor que Inés eligió.</p>

<p>Como si fuera el que menos le había interesado. Como si acabara de unirse a los demás... ¿Era ansiedad o exigente?</p>

<p>Fuera lo que fuera, sus dudas estaban justificadas. Sus recuerdos de Emiliano eran siempre como un lago al final del invierno, donde uno podría pensar que el hielo era sólido, solo para dar un paso y sumergirse instantáneamente en el agua helada.</p>

<p>Cuando la pintura de Emiliano llegó al castillo de Pérez por primera vez, al igual que las de otros artistas, Inés lloró toda la noche, soñando con Emiliano. Su corazón se rompió en mil pedazos al menor ruido. La pintura era simplemente un bodegón de un jarrón corriente, y el sueño representaba sus días más felices en Mallorca.</p>

<p>Eso no era normal. No se podía respirar bajo el agua. En ella, había que morir de nuevo para siempre. Ella quería vivir una vida razonablemente tranquila y deshacerse de esta molesta coraza con una sola muerte. No deseaba renacer como Inés Valeztena.</p>

<p>Entonces debía dudar de sí misma hasta cansarse de ello.</p>

<p>—Don Joaquín había colgado el retablo a medio terminar en su estudio y, cuando él estaba fuera, el arzobispo de Bilbao lo visitó y, al parecer, lo vio... aunque Don Joaquín no parecía especialmente complacido. Dijo: “Son jóvenes prometedores, pero ¿y si tres años se convierten en cinco o en diez?"... Dijo que solo estaba ganando tiempo al insistir en que necesitaban el permiso del mecenas.</p>

<p>—El arzobispo tomó la decisión. ¿Cómo podía negarse un simple banquero?</p>

<p>—Añadió: “No es que sea un simple banquero” a ese asunto.</p>

<p>—¿De forma tan descarada?</p>

<p>Inés se rió distraídamente. Joaquín sabía que Inés no era un simple banquero, pero no se dio cuenta de que sus cartas se enviaban a través de Pérez. Entre ellos había varios nombres falsos y canales intermedios.</p>

<p>Así que la autoridad que buscaba pedir prestada a Inés era esencialmente la riqueza de algún noble rural exclusivo, recluido en una finca pequeña pero excepcionalmente rica...</p>

<p>—Es absurdo. ¿Cree que puede influir en la decisión del arzobispo con una simple limosna?</p>

<p>—Puede que sea así, pero la pérdida de la señora Inés es evidente. Como mínimo, Don Joaquín desearía estar exento de esa pérdida.</p>

<p>—No hay ninguna pérdida. Una vez restauradas todas los cuadros, alcanzarán un alto precio por sí solos.</p>

<p>—¿Lo considera una inversión?</p>

<p>—El arzobispo de Bilbao es un hombre que nunca sabe qué hacer con el excedente de ofrendas. Cuando se aburre, compra estatuas paganas de Aureles y les pone nombres de santos para justificar el gasto. El arzobispo quedará muy impresionado con la restauración de los cuadros y la creación de otros nuevos por parte de Lourdes y Emiliano, lo que aumentará rápidamente el precio interno. Luego difundirá este hecho para obtener mayores donaciones de la nobleza.</p>

<p>—...</p>

<p>—Y los nobles se apresurarán a pagar varias veces el precio que fije el arzobispo... Es precisamente el tipo de cosas de las que a los hombres les encanta presumir mientras fuman puros.</p>

<p>Por eso había conectado deliberadamente al arzobispo de Bilbao con el pintor; tampoco fue una casualidad. Pero eso fue todo.</p>

<p>Emiliano pronto viviría una vida de abundancia diferente a la anterior, pintando solo lo que deseaba, mientras que Inés permanecería sola, viviendo sus días en paz.</p>

<p>Porque Inés había decidido no dejarse quebrantar y tampoco quebrantarlo a él, que no sabía nada.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—¿Por qué está ese maldito aquí otra vez?</p>

<p>Cárcel se sorprendió momentáneamente al darse cuenta de que sus pensamientos se habían escapado literalmente. Afortunadamente, Inés, que caminaba unos pasos por delante, parecía no haber oído al problemático “maldito” y se limitó a volverse hacia él con calma.</p>

<p>—Ah, acaba de volver de entregar un equipaje en Esposa y Pérez.</p>

<p>—...¿De vuelta? ¿Por qué?</p>

<p>Si había hecho la entrega a Esposa y Pérez, eso debería haber sido el final... La sola idea de que él, que había nacido y crecido en Pérez, volviera aquí era ridícula.</p>

<p>Cárcel lanzó una mirada de absoluto desdén a Raúl, que estaba más adelante en el pasillo, con cara de satisfacción, mirando fijamente a Inés. Raúl se inclinó rígidamente ante Cárcel en señal de respeto. Era la primera vez que se encontraba con un hombre cuyo comportamiento era tan impecable que le daba ganas de buscarle defectos.</p>

<p>Debía de haber visto la forma de su boca cuando lo llamó “maldito”...</p>

<p>—Para informar sobre varios asuntos y entregar la carta de mi madre.</p>

<p>La pregunta de cuándo volvería a partir casi se le escapó por reflejo, pero al ver que Inés abría los labios como para hablar, se contuvo.</p>

<p>—Y, por cierto, he decidido contratar a Raúl como ayuda de cámara en la residencia.</p>

<p>—...</p>

<p><span style="font-style:italic">Informar y entregar una carta...</span> ¿Cómo podía eso estar al mismo nivel que instalarse permanentemente en la residencia Calstera?</p>

<p>Inés conectó los dos puntos con palabras totalmente naturales, pero decididamente antinaturales, y luego se dio la vuelta y se alejó apresuradamente. Cárcel la alcanzó en dos zancadas y expresó su objeción.</p>

<p>—Esta es una residencia de oficiales que parece una ratonera. Y ya tenemos a Alfonso.</p>

<p>Nunca admitiría, ni siquiera por despecho, que esta mansión era una ratonera. Sin embargo, para deshacerse de la sensación extraña en sus ojos, como escamas sobre sus pupilas, podía admitirlo sin problemas.</p>

<p>A pesar de todo, Inés giró inmediatamente hacia otro pasillo que conducía al comedor, aparentemente decidida a cenar.</p>

<p>Entonces, como un perro que sale a pasear y se adelanta a su dueño, Raúl Balan aceleró el paso y se apresuró hacia el comedor. Caminaba como si estuviera despejando el camino él mismo, a pesar de que ya estaba bien transitable.</p>

<p>—Alfonso es un mayordomo anciano. Es un empleado de primera categoría, y ahora tiene una edad en la que debería estar sentado en su estudio, sin mover un dedo cuando no hay invitados, Cárcel. Sin embargo, le haces hacer todo lo que debería hacer un ayuda de cámara o un lacayo. Incluso le pones en el vestidor desde primera hora de la mañana... Necesitas un ayuda de cámara adecuado.</p>

<p><span style="font-style:italic">¿Entonces esto es por el bien de Alfonso?</span> El amo de Alfonso era él. En última instancia, debe ser por su bien.</p>

<p>—Ha envejecido prematuramente. No es tan mayor como parece.</p>

<p>En ese momento, el hombre prematuramente envejecido, no, Alfonso, que estaba de pie en la entrada del comedor para recibirlos, parpadeó. Quizás se sintió incómodo, pero eso no era lo importante ahora. El envejecimiento prematuro era cierto, y las disculpas podían esperar.</p>

<p>—... Hablar sin pensar solo porque tienes prisa...</p>

<p>—En una casa tan pequeña, es bastante ridículo ser tan exigente con la jerarquía... E, Inés, no necesito una ayuda tan trivial como un ayuda de cámara. Ya lo sabes.</p>

<p>—Sé que te las arreglas bien por ti mismo. Aun así, digo que es necesario.</p>

<p>—Busca primero a tu criada.</p>

<p>—Busca primero a tu ayuda de cámara.</p>

<p>—No lo necesito...</p>

<p>—Sí lo necesitas.</p>

<p>—¿Mi ayuda de cámara?</p>

<p>En el momento en que Inés lo interrumpió con decisión, Cárcel se estremeció instintivamente, luego se dio cuenta de su propio hábito servil y chasqueó la lengua con disgusto.</p>

<p>—Alfonso no es alguien a quien se pueda dar órdenes a la ligera. Hace tiempo que superó la edad y el rango para ese tipo de trato. Una vez que empiecen a llegar los invitados, surgirán todo tipo de necesidades triviales, y deseo mostrarle un mayor respeto a partir de ahora. Sin embargo, es difícil confiar asuntos importantes a los sirvientes...</p>

<p>—¿Asuntos triviales, dices?</p>

<p>—Triviales, pero importantes.</p>

<p>De alguna manera, logrando encontrar una falla, combinó ambos puntos en una sola respuesta sin cambiar su expresión.</p>

<p>Por supuesto, podía adivinar lo que Inés quería decir con “importantes”. Es decir, tareas que solo un joven educado podía realizar... Sin duda, tenían necesidades diferentes a las de los simples sirvientes.</p>

<p>—... ¿No es un poco joven para ser ayuda de cámara?</p>

<p>Mientras se dirigían hacia la pequeña mesa familiar, Cárcel miró fijamente a Raúl, que rápidamente apartó la silla de Inés, y le preguntó.</p>

<p>No se podía negar que la bien educada Inés necesitaba a un compañero tan inteligente, y en tales circunstancias, poner pegas sobre “¿por qué precisamente él?” o “no servirá” sería demasiado obvio... Lo único que merecía la pena criticar era la edad de Raúl Balan.</p>

<p>Raúl Balan tenía casi la misma edad que la pareja, o quizás un año más o menos; en cualquier caso, era de esa edad, completamente inmaduro. Para convertirse en ayuda de cámara, un sirviente de alto rango, naturalmente se necesitaba madurez y experiencia.</p>

<p>Había parecido bastante pronto cuando consiguió el puesto de lacayo en el castillo de Pérez unos años antes. <span style="font-style:italic">¿Ayuda de cámara?</span> Hay un orden estricto en las cosas en este mundo. Un trabajo que otros no aceptarían hasta los cuarenta...</p>

<p>—Lo que importa es el puesto. Esta residencia ni siquiera es digna de llamarse mansión, y Raúl tenía otros tres lacayos a sus órdenes en el castillo de Pérez. Este lugar es una ratonera, como tú has dicho, así que para traerlo aquí, tenemos que ofrecerle alguna distinción relativa. Aunque solo sea un título para guardar las apariencias.</p>

<p>—No... si es un activo tan valioso, debería quedarse en el castillo de Pérez.</p>

<p>Cárcel retorció sutilmente la opinión de Inés para corregirla. Mientras continuaba la discusión, Raúl silenció el ruido del carrito que la criada había arrastrado ruidosamente hasta el comedor, cogió sin esfuerzo los pesados platos con ambas manos y comenzó a servir la comida con elegancia.</p>

<p>A pesar de su evidente expresión de disgusto, siguió como si no lo vieran ni lo oyeran, solo hay que ver su notable profesionalidad...</p>

<p>Su inquebrantable dedicación a su oficio solo lo hacía más desagradable. Precisamente porque no se veía ni rastro de humanidad.</p>

<p>—Si hablamos de activos valiosos, yo no soy menos, Cárcel.</p>

<p>—...</p>

<p>Como si fuera una señal, Raúl extendió un paño húmedo junto a Inés.</p>

<p>—Pero, como puedes ver, incluso alguien tan valioso como yo vive aquí.</p>

<p>Cuando Inés terminó de secarse las manos, sintió como si la frase tácita “por tu culpa” flotara en el aire. Como si fuera simplemente un hecho.</p>

<p>En realidad, ella no le guardaba rencor ni se sentía insatisfecha allí, pero ese eslogan parecía aparecer como un fantasma, probablemente debido a su propio complejo de inferioridad fuera de lugar. Que él hubiera cambiado de residencia a sus espaldas, albergando algún plan sórdido...</p>

<p>Cárcel agarró el paño húmedo que Raúl le había entregado —de forma justa, aunque incidentalmente más tarde que a Inés— y se secó las manos con irritación.</p>

<p>—Así que no es malo que Raúl desperdicie unos años de una vida prometedora aquí.</p>

<p>—¿Desperdiciados, señora Inés? ¿Cómo puede considerarse un desperdicio servirle a usted y al Capitán Escalante?</p>

<p>Raúl, que había estado ocupándose de sus asuntos como si escuchara un idioma extranjero incomprensible durante toda la conversación sobre él, intervino con naturalidad.</p>

<p>Su lengua se movía con tanta fluidez como si estuviera engrasada. Habló del honor de toda una vida, del orgullo que se sentiría durante generaciones... Cárcel hizo un gesto con la mano para indicarle que ya era suficiente.</p>

<p>Raúl dejó de elogiarlo abruptamente, como si apagara una máquina. Era obediente. Realmente no le gustaba.</p>

<p>—Como puedes ver, este chico se encargará de todo de todos modos: las tareas del ayuda de cámara y las tareas de lacayo. Desde atenderte, hasta mis recados, pasando por entretener a los invitados. Su rango es solo un título... Es joven, así que sí, le falta experiencia, como dices, pero como no había nadie más disponible, será de alguna utilidad de todos modos. Ah, yo misma me encargaré del salario de Raúl.</p>

<p>—... ¿A quién le importa esa insignificante suma?</p>

<p>—¿Entonces cuál es el problema?</p>

<p>Inés preguntó con inocencia, como si se preguntara qué otro problema podría haber si no era el coste. Parecía tan genuinamente convencida de que el único problema era el gasto que suponía el ascenso que Cárcel se quedó mirándola, momentáneamente sin palabras.</p>

<p>Era una suerte que ella no se hubiera dado cuenta de su resentimiento hacia Raúl, pero era otra cosa muy distinta que lo viera tan mezquino y tacaño como para discutir seriamente con su esposa por el salario de un solo empleado.</p>

<p>Menos mal que era guapo... Si no hubiera sido tan atractivo, su expresión incómoda habría quedado completamente al descubierto.</p>

<p>En ese momento, Raúl Balan se inclinó respetuosamente detrás de Inés y le susurró algo al oído.</p>

<p><span style="font-style:italic">¿Ese pequeño bastardo...?</span></p>

<p>—Seguro que no. No es eso.</p>

<p>Inés negó inmediatamente con la cabeza, lo que solo sirvió para aumentar las sospechas. <span style="font-style:italic">¿Qué le había susurrado ese distinguido talento de Pérez?</span></p>

<p>Como si entendiera su pregunta solo por la expresión de Cárcel, abrió la boca con un “Ah”, como si no fuera nada.</p>

<p>—Dice que parece que no te cae bien.</p>

<p>—...</p>

<p><span style="font-style:italic">… Ese pequeño bastardo como una mascota...</span></p>

<p>—Él mismo no sabe por qué, pero hasta ahora no ha habido ninguna razón.</p>

<p>—...</p>

<p>—No, Raúl. Cárcel no es de los que rechazan a alguien sin motivo.</p>

<p>Mientras hablaba con Cárcel, Inés miró a Raúl y le habló sobre el carácter de Cárcel, con el rostro ahora despejado. Lamentablemente, esa era precisamente su naturaleza. Aunque se podían encontrar razones si se buscaban, Cárcel nunca podría expresarlas en voz alta, lo que le dejaba poco más que añadir.</p>

<p>A pesar de que el mensaje se transmitió de forma tan transparente a otro empleador, Raúl llenó el vaso vacío de Cárcel con agua, manteniendo una actitud recta y cortés, como si simplemente estuviera exponiendo los hechos tal y como los veía.</p>

<p>Cárcel miró fijamente el agua que se agitaba dentro del vaso como si fuera el alma misma de Raúl.</p>

<p>—No es solo porque Raúl haya trabajado para mí durante tanto tiempo; este muchacho realmente tiene muy pocos defectos.</p>

<p>¿Cómo podía Inés entender que ser irreprochable era el mayor defecto de Raúl Balan?</p>

<p>Sin embargo, Cárcel sabía que la decisión ya estaba tomada.</p>

<p>Desde la contratación de personal hasta tareas menores como mover y desechar muebles, ya le había dejado claro que podía manejar las cosas como mejor le pareciera. ¿Por qué insistir ahora? ¿Por qué específicamente Raúl Balan...? Incluso él pensaba que este aspecto era peculiar.</p>

<p>Lanzó una mirada cínica a Raúl, que seguía sirviendo la comida con un comportamiento impecablemente elegante y refinado.</p>

<p>—Sé que su juventud le hace parecer poco fiable, pero acabarás estando satisfecho con él. ¿Verdad, Raúl? Servirás al Capitán Cárcel con todo tu corazón.</p>

<p>—Por supuesto. 	Capitán, independientemente de su aversión hacia mí, le serviré lo mejor que pueda.</p>

<p>—Cárcel no te tiene aversión sin motivo. Solo desconfía porque careces de experiencia como ayuda de cámara... ¿Verdad, Cárcel?</p>

<p>Cárcel se quedó en silencio por un momento, como alguien obligado a responder en contra de su voluntad, pero pronto sonrió con rigidez, como un traidor que deja de lado sus principios con facilidad.</p>

<p>—Sí. Bienvenido al servicio en la residencia, Balan.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>Tan pronto como salió del baño luego de asearse, Raúl apareció en la puerta, como si estuviera esperando, sosteniendo una camisa de interior cuidadosamente planchada.</p>

<p>Cárcel, que había salido vestido solo con unos pantalones ligeros de lino y sin nada que le cubriera la parte superior del cuerpo, se detuvo brevemente antes de mirar la camisa con una expresión de total incomodidad.</p>

<p>Raúl le ofreció cortésmente la camisa una vez más. En lugar de cogerla inmediatamente, Cárcel terminó de secarse el pelo mojado con una toalla y se la recogió. Solo entonces apareció la camisa en la mano que había sostenido la toalla.</p>

<p>Era una señal mejor que si hubiera sostenido la camisa abierta e insistido en que “haría todo lo posible”. Sin embargo, ni siquiera esa buena señal le satisfizo...</p>

<p>Como todos los jóvenes de familias distinguidas, Cárcel había estado acostumbrado a que le hicieran todo sin mover un dedo durante su infancia. A mediados de la adolescencia, ya era más alto que la mayoría de los adultos. Y ahora era aún más alto, tras el riguroso entrenamiento en la academia militar que había reforzado su ya robusta complexión, se había convertido en una presencia formidable.</p>

<p>¿Cómo iba a encontrar cómodo que un diminuto sirviente se preocupara por él, abrochándole la camisa o ajustándole las mangas? Incluso dejando de lado el estilo de vida frugal que le habían inculcado desde la escuela militar, tanta atención excesiva le resultaba molesta.</p>

<p>Sin embargo, la discreta atención de Raúl Balan, a pesar de su estatura adecuada, le resultaba más molesta que el servicio quisquilloso de los enanos que uno podría esperar en un antiguo cuento popular.</p>

<p>Y lo único que había hecho Raúl era ofrecerle una sola camisa.</p>

<p>—... Gracias, pero no acepto este tipo de servicio tan minucioso. ¿No te lo ha dicho Alfonso?</p>

<p>Cárcel, que se había limitado a ponerse la camisa, escupió mientras pasaba junto a él.</p>

<p>—Sí, claro que me lo ha dicho.</p>

<p>Raúl lo siguió obedientemente, respondiendo.</p>

<p>—¿Entonces?</p>

<p>—Solo haré lo que él me diga que haga.</p>

<p>—...</p>

<p>—Aunque dudo que esto pueda llamarse trabajo.</p>

<p>Eso implicaba que Alfonso ni siquiera se molestaría en hacer esto.</p>

<p><span style="font-style:italic">Si tan solo pudiera regañarlo...</span> Cárcel sintió un breve resentimiento hacia el mayordomo, que había pasado la tarea a este joven tan fácilmente, como si la estuviera esperando.</p>

<p>—¿Inés?</p>

<p>—Leyendo la Biblia en el estudio.</p>

<p>—¿La Biblia?</p>

<p>Recordando su antiguo semblante severo, no era del todo sorprendente, pero Cárcel sabía que ella no era tan devota como parecía.</p>

<p>Por ejemplo, estaba muy lejos de ser el tipo de persona que se levantaba diligentemente al amanecer para rezar o se arrodillaba junto a la ventana bañada por la luz de la mañana para ofrecer sus plegarias.</p>

<p>Incluso a altas horas de la noche, cuando leía libros en el estudio, era lo mismo. Normalmente se tumbaba medio perezosamente, inclinando la cabeza hacia un lado para leer, y ni una sola vez el libro que descansaba sobre su pecho había sido la Biblia.</p>

<p>Al menos no durante aquellos meses en Calstera.</p>

<p>¿Alguien la había visto alguna vez pasando tiempo a solas en la capilla o en la sala de oración de la mansión durante aquellos meses? No.</p>

<p>Entonces solo quedaba una conclusión. ¿Qué demonios se le había metido en la cabeza hoy?</p>

<p>—Ah, Capitán.</p>

<p>Justo cuando estaba a punto de dirigirse hacia la estantería, reflexionando sobre la pregunta, esa irritante voz volvió a llamar su atención. Se detuvo a mitad de abrocharse la camisa y se giró hacia Raúl.</p>

<p>—Si se dirige al estudio, si me permite el atrevimiento...</p>

<p>—Sí. ¿Qué?</p>

<p>Cárcel lo interrumpió bruscamente.</p>

<p>¿No era suficiente con que siguiera a Inés como un perro guardián, ahora también necesitaba permiso para pasar? Su mente llegó rápidamente a una conclusión completamente retorcida, pero luego sintió una punzada de duda y relajó su boca ligeramente torcida.</p>

<p>—Sería mejor que evitara el estudio por ahora.</p>

<p>—¿Por qué?</p>

<p>—Los jueves por la noche, la señora Inés lee habitualmente sus versículos favoritos de la Biblia y reza a solas.</p>

<p>—...</p>

<p>—Es una costumbre que tiene desde hace mucho tiempo y, dada su disposición, es probable que no le guste que la molesten...</p>

<p>Era una historia que nunca había oído antes, una escena que nunca había presenciado. Cárcel frunció el ceño brevemente, buscando en sus propios recuerdos.</p>

<p>No había estado vigilando todas las tardes, ni cada vez que Inés estaba en el estudio, por lo que le era imposible conocer todos sus hábitos.</p>

<p><span style="font-style:italic">Pero eso no significa que me alegre que este mocoso lo supiera todo.</span></p>

<p>—... Por eso precisamente se lo pregunté con cautela. En un momento en el que los dos están empezando su armoniosa vida matrimonial, es aún más importante minimizar las fricciones innecesarias...</p>

<p>—Si surgen fricciones, Inés se irritará y yo la escucharé.</p>

<p>—...</p>

<p>—Así que ahórrame tus inútiles consejos.</p>

<p>No había necesidad de decirle que se metiera en sus propios asuntos. Su expresión, desprovista de la más mínima buena voluntad, ya había cumplido ese propósito.</p>

<p>Lo que realmente irritaba a Cárcel era lo que Raúl Balan sabía y él no.</p>

<p>Más allá del simple hecho de que Inés tenía un hábito bastante sagrado todos los jueves por la noche, había otros innumerables hábitos suyos que él no podía comprender. Quizás sus gustos, sus estados de ánimo triviales...</p>

<p>Y todo lo que existía en su pasado.</p>

<p><span style="font-style:italic">... ¿Pasado?</span></p>

<p>¿Había una palabra más miserable en el mundo? Se sintió completamente atónito y, de repente, fijó su mirada intensamente en los ojos de Raúl. Como un pirata que cree que un barco legendario con un tesoro se encuentra hundido bajo esas olas sombrías... aunque los ojos de Raúl no eran particularmente sombríos ni se agitaban con olas.</p>

<p>Su pasado. El alcance natural de la aceptación mutua. La capacidad de discernir lo que ella deseaba con solo mirarla a los ojos... Atenciones triviales, meros recuerdos que quedaban atrás cuando el tiempo simplemente pasaba a tu lado. Esas cosas eran insignificantes y sin sentido.</p>

<p>Así que, derriba a ese leal sirviente, deja a un lado los recuerdos y deja de pensar de forma tan lamentable.</p>

<p>Pero para Inés, esa persona era indispensable. Porque no tenía a nadie con quien contar. ¿Quién era su único vínculo con el mundo? Era ridículo... Incluso en sus días de arrogancia, el frugal Cárcel siempre se había situado en un nivel diferente al de su criada, Juana. Sin embargo, ahora, en ese mismo momento, con Raúl Balan aquí, donde ni siquiera Juana podía llegar...</p>

<p>—Se lo supliqué a la señora Inés.</p>

<p>Habló como si tuviera una espina clavada en la garganta.</p>

<p>—Le supliqué que me dejara cuidar de usted.</p>

<p>¿No se solía confiar en alguien diciendo “por favor, cuida de mí”? ¿“Déjeme cuidar de él”? El orden en su mente ya estaba desorganizado. Él llegó mucho después de Juana, Raúl Balan mucho antes que ella.</p>

<p>No quería aceptarlo, pero no podía negarse. ¿Cómo podía negar la secuencia tan evidente?</p>

<p>—Para que un noble viva más noblemente, siempre es necesario un ayuda de cámara bien educado. Alfonso es un mayordomo espléndido, digno del respeto de sus sirvientes, pero es demasiado mayor para ser un mero adorno en la mansión.</p>

<p>—...</p>

<p>—Si me permite el atrevimiento, su vista está fallando y no resulta especialmente agradable a la vista de nuestros invitados.</p>

<p>—... ¿Y tu eres agradable a la vista?</p>

<p>—¿No es así? Naturalmente, nunca me atrevería a presumir en presencia de una figura tan esculpida como la suya...</p>

<p>—Ya estás presumiendo.</p>

<p>—Como simple sirviente, a menudo me han dicho que soy agradable a la vista dondequiera que me coloquen.</p>

<p>¿Así que ahora lo trataba como un accesorio? ¿Con tan descarado orgullo? Cárcel lo miró como si no fuera un loco cualquiera.</p>

<p>Por supuesto, los sirvientes masculinos bien entrenados, como mayordomos, ayudantes de cámara y lacayos, también eran un medio para que los nobles hicieran alarde de su riqueza.</p>

<p>Bien vestidos, con una estatura y un rostro atractivos, poseedores de buenos modales y un toque de intelecto: un accesorio caro. Incluso hay historias ridículas de familias pobres, desesperadas por mantener las apariencias, que apenas logran contratar a un ayuda de cámara, solo para que este acabe ganando más que su amo.</p>

<p>—La señora Inés es hija de Valeztena y esposa de Escalante. Aunque especialmente nunca me deseó, apenas podía imaginar un día sin su accesorio.</p>

<p>—Entonces, esa “imaginación” se refiere a ti.</p>

<p>—Sí, presuntuosamente.</p>

<p>Cárcel miró al sirviente de Inés, que llevaba muchos años a su servicio, con ojos complejos, a la vez insolentes y profundamente humildes. Ni una pizca de duda o enfado por ser un mero adorno empañaba esa expresión; al contrario, rebosaba confianza y plenitud de vida, como si dijera: “Disfruto siendo un accesorio”.</p>

<p>Tal y como había visto entonces, el perro era un perro. Más perro que un perro, incluso.</p>

<p>Sin embargo, lejos de sentirse aliviado... Cárcel escrutó a Raúl de pies a cabeza como si fuera un perro pastor que observaba a un nuevo, bonito y adorable —y, por lo tanto, exasperante— terrier que su dueño había traído a casa.</p>

<p><span style="font-style:italic">¿Y qué vio? Solo a un tipo de aspecto mediocre, en el mejor de los casos...</span></p>

<p>—Le aseguro, Capitán, que pronto quedará satisfecho.</p>

<p>—Si me estás diciendo que me servirás de todo corazón, me basta. Ya estoy un poco harto de esto.</p>

<p>—No, hay mucho más que ganar conmigo.</p>

<p>—...</p>

<p>—Al igual que usted se ganó la confianza de la señora en esta modesta y acogedora residencia que le quitó al Comandante Elba y a su esposa.</p>

<p><span style="font-style:italic">Este pequeño bastardo...</span> No, los prometedores ojos de Raúl Balan brillaban con ambición.</p>

<p>—Venero y respeto tan profundamente a mi amo que no hay nada que no sepa.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>Era completamente ridículo y absurdo. <span style="font-style:italic">¿Qué? ¿No hay nada que no sepa?</span></p>

<p>Cárcel detestaba las trampas. Ya fuera en el billar, en la caza, en el tenis o cualquier otra cosa que hiciera con una pelota de cuero en el campo de entrenamiento... todo tenía que ser según las reglas. Era lo suficientemente hábil en la mayoría de los deportes o apuestas como para recurrir a las trampas, y si no tenía el talento necesario para ganar limpiamente, ni se molestaba en jugar.</p>

<p>No le interesaban las trampas, ni tenía ninguna inclinación por perder.</p>

<p>Así que, por mucho que le dijera ese joven ambicioso e ingenuo, que fingía ser el leal sirviente de Inés... él...</p>

<p>—Así que, Raúl Balan, que lo sabes todo. ¿Qué precio esperas obtener por traicionar al amo al que tanto veneras?</p>

<p>—¿Traición? Eso es demasiado.</p>

<p>—Bueno, es precisamente lo que estás haciendo.</p>

<p>—¿Por qué iba a traicionar a la señora Inés?</p>

<p>—En efecto, ¿por qué traicionarla?</p>

<p>—¿No es el Capitán el esposo de la señora Inés? No es el enemigo...</p>

<p>—...</p>

<p>—¿Qué daño podría causar informar de antemano a su esposo de algunos de los hábitos espinosos de la señora Inés? Mi único y sincero deseo es el bienestar y la felicidad de la señora Inés, que algún día tenga un hogar rebosante de amor, que haya armonía entre marido y mujer, y que haya un afecto tierno entre ella y su marido...</p>

<p>—Incluso en palabras vacías, el sujeto no se convierte en “ustedes dos”.</p>

<p>“¿De verdad es tan gracioso?”, articuló la pregunta en silencio. Inés asintió con la cabeza y respondió: “Muchísimo”. “Qué malvado es reírse de la desgracia ajena…”. De repente, murmuró, con su hermoso rostro contorsionado por una tristeza exagerada.</p>

<p>Esta vez, Inés no respondió. Levantó la barbilla como si fuera una simple espectadora. Era una actitud que parecía decir: “Adelante, vuelve a la desgracia”. Cárcel se rió entre dientes. Fue en ese momento cuando continuaron su conversación silenciosa, cada uno perdido en su propio mundo.</p>

<p>La señora Salvatore, tras agarrar a Inés por el pelo, buscó algo más a lo que agarrarse. Su mano tanteó el cuerpo de Cárcel, agarrándose a la borla de la charretera de su uniforme.</p>

<p>No poder mantenerse erguida fue la consecuencia inevitable. Sin embargo, Cárcel no mostró ningún signo de nerviosismo. Le cogió la mano y le abrió suavemente los dedos para soltar la charretera.</p>

<p>Luego le agarró ambas muñecas con una mano, inmovilizándolas en el aire para evitar que siguiera tocándole, mientras que con la otra mano le sujetó la cintura y la guió suavemente para que se alejara un poco, resolviendo rápidamente la situación.</p>

<p>—Volverá a casa en breve, señora Salvatore.</p>

<p>—Salvatore... Odio a Salvatore...</p>

<p>—Entiendo su malestar, pero por favor, quédese así un momento.</p>

<p>Manejó a la mujer borracha, a la mujer que le manoseaba el cuerpo imprudentemente en su estupor, e incluso a la mano que tiraba de sus charreteras con una facilidad experta, con una expresión clara: “Nunca te había visto tan enfadada”.</p>

<p>Incluso en su estupor alcohólico, la señora Salvatore parecía reconocer a Cárcel de alguna manera. Sus ojos entreabiertos brillaban mientras intentaba de nuevo manosear su firme cuerpo, pero sus muñecas, sujetas con firmeza por una mano de Cárcel, estaban tan inmovilizadas como si llevara grilletes, y sus intentos terminaron en repetidos fracasos.</p>

<p>Aunque dejarse caer sobre él parecía una opción fácil, todo su cuerpo estaba sostenido a la fuerza por la única mano grande que le agarraba la cintura, lo que también lo hacía imposible.</p>

<p>Él no se aferraría a una mujer borracha delante de sus propios ojos, pero incluso si lo hiciera, ¿no sería eso irresistible?</p>

<p>No había necesidad de arreglar las cosas tan cuidadosamente...</p>

<p>—Eres realmente hábil, ¿verdad?</p>

<p>Inés murmuró con auténtica admiración. Quizás incluso un toque de deleite tiñó su voz. Cárcel, que había estado observando la puerta del salón, esperando a que aparecieran el sirviente y el cochero, entrecerró los ojos momentáneamente, como si no hubiera captado bien sus palabras, y luego volvió a su expresión anterior.</p>

<p>—... ¿Qué significa eso?</p>

<p>—¿Qué significa? Pues significa exactamente lo que dije.. que eres hábil.</p>

<p>—...</p>

<p>—Es solo que... creo que eres muy bueno en todo lo que tiene que ver con las mujeres...</p>

<p>—...</p>

<p>Las palabras de Inés eran similares a elogiar a alguien por dar en el blanco o superar un obstáculo mientras montaba a caballo. Excepto que él estaba medio abrazando, medio sujetando a cierta dama que se aferraba a él, completamente borracha delante de su esposa.</p>

<p>—Estoy haciendo esto porque es lo correcto...</p>

<p>—Eso no significa que sea malo para ti. De hecho, ¿no es más bien agradable?</p>

<p>—...</p>

<p>—Es hermosa.</p>

<p>Por supuesto, si uno se limitara a mirarse al espejo cada mañana, vería una creación divina y perfecta. Y si habláramos de la belleza de las mujeres que había conocido en Mendoza, la señora Salvatore sería simplemente “pasable”.</p>

<p>Así que, aunque su aspecto quizá no fuera suficiente para despertar las emociones de Cárcel, Inés pensaba que Calstera era un entorno un poco especial.</p>

<p>Teniendo en cuenta las peculiares circunstancias locales de este puerto naval y el hecho de que el matrimonio de los Salvatore había llegado a su ocaso, la señora Salvatore era en realidad bastante decente...</p>

<p>—¿Qué hacen?</p>

<p>Inés observó en silencio y atónita cómo Cárcel de repente levantaba a la señora Salvatore sobre su hombro como si fuera un saco de patatas.</p>

<p>Incluso la mujer más delgada, cuando está inconsciente y flácida, se vuelve tan pesada como una roca. Sin embargo, Cárcel la llevó como si estuviera levantando una carga ligera, pero tan voluminosa como un ser humano, y salió del salón como si simplemente estuviera retirando una pieza de equipaje. Desestimó la pregunta de Inés con la misma facilidad.</p>

<p>Por supuesto, teniendo en cuenta que había levantado a Inés con un solo brazo, su fuerza no era sorprendente. Pero había sido cuidadoso, tratando de hacerlo lo más delicadamente posible por respeto a la dignidad de la señora. ¿Y si la trataba como si fuera un bulto inconsciente de forma tan descarada?</p>

<p>Efectivamente, tan pronto como la señora Salvatore fue sacada a hombros por Cárcel como si fuera un fardo, las damas de la terraza se apresuraron a entrar en el salón.</p>

<p>—¡Señora! ¿Era ese el Capitán Escalante?</p>

<p>—¿Lo ha visto y aún lo pregunta? Por supuesto que era el Capitán Escalante... ¿Ha perdido completamente la cabeza la señora Salvatore? Ambos parecían bastante nerviosos.</p>

<p>—Lo que la señora Salvatore estaba bebiendo antes...</p>

<p>—Desde luego no era vino. Definitivamente no.</p>

<p>Cuando ella había estado luchando sola para lidiar con las travesuras ebrias de la señora Salvatore, era como si este lado y aquel lado pertenecieran a mundos diferentes. Sin embargo, ahora estaban allí, siguiendo juntos los pasos de la borracha.</p>

<p>Pero no era del todo sorprendente. La gente suele actuar como si nada importara más que las apariencias y luego finge que nunca ha pasado nada.</p>

<p>No se atrevían a hablar delante de la persona en cuestión, pero podían discutirlo a sus espaldas; tal vez solo preservaban a medias la dignidad de los demás.</p>

<p>—Seguro que no era esa botella de vino de allí...</p>

<p>—Por Dios, claro que no. Eso sería una completa descortesía. ¡La señora Escalante nunca nos invitó a servirnos de los enseres de alguien más...!</p>

<p>—¿Pero lo ha visto? El Capitán Escalante llevando a la señora Salvatore...</p>

<p>—Ha sido rapidísimo, ¿verdad? Se la ha llevado en un santiamén...</p>
	
<p>Quizá no fuera porque el problemático asunto hubiera desaparecido ante sus ojos, sino simplemente porque habían visto a Cárcel.</p>

<p>Inés se dio cuenta, por la conversación de las damas, de que la señora Salvatore no era más que un equipaje. No era más que un adorno que adornaba uno de los hombros de Cárcel.</p>

<p>Así que las damas mantuvieron su cortesía hacia la señora Salvatore, al tiempo que eran totalmente descorteses.</p>

<p>—Se lo juro, al principio pensé que no era la señora Salvatore, sino simplemente una prenda que se había quitado y llevaba a carga.</p>

<p>—¿Quién se quita algo en medio de la residencia de una pareja de recién casados? ¡Qué vergüenza...!</p>

<p>—Es solo una metáfora. Como una serpiente que muda la piel o una mariposa que emerge de su crisálida. Lo llevas con tanta ligereza sobre los hombros. ¿Creería que hay una persona dentro?</p>

<p>—Sus hombros... ¿Cómo pueden ser tan anchos sus hombros?</p>

<p>—Señora, qué afortunada es. La fuerza de su esposo es realmente...</p>

<p>—Bueno, es joven. Todos los jóvenes...</p>

<p>—¿Todos los jóvenes? Pero no todos son así, ¿verdad?</p>

<p>—El Capitán Escalante, bueno, empezando por su aspecto...</p>

<p>—Inés.</p>

<p>La voz de Cárcel resonó una vez más en la sala, justo cuando la refinada Marquesa Barca, abanico en mano, asintió con admiración hacia Cárcel.</p>

<p>A diferencia de momentos antes, Inés ahora estaba rodeada por las damas. Sus labios, que se habían entreabierto como si tuviera algo que decir, se cerraron en silencio en la puerta. Mientras tanto, la esposa del capitán Coronado se apresuró hacia Cárcel.</p>

<p>—Capitán, ¿qué hay de la señora Salvatore?</p>

<p>—Lamentablemente, dijo que se había sentido mal de repente.</p>

<p>—Bueno, era de esperar...</p>

<p>—La acabo de escoltar al carruaje junto con el Capitán Salvatore.</p>

<p>—¿Estaba bien el Capitán Salvatore?</p>

<p>En lugar de responder, Cárcel esbozó una sonrisa evasiva y satisfecha. Como si se tratara de una respuesta profunda, la señora Coronado asintió con seriedad, con el rostro redondo sonrojado.</p>

<p>—Ah, sí. ¿Buscaba a la señora, verdad?</p>

<p>—No es nada especialmente urgente, pero...</p>

<p>—¡Señora Escalante! ¡Señora Escalante!</p>

<p>Como alguien había comentado, parecía que las ardillas podrían reunirse para vivir aquí, ya que la casa era pequeña, la sala de estar tampoco podía ser grande.</p>

<p>Por lo tanto, no había necesidad de llamar a Inés en voz tan alta, pero al ver el rostro de la señora Coronado, completamente satisfecha consigo misma por desempeñar este papel, uno no podía evitar cumplir con sus expectativas.</p>

<p>—¡Simplemente regresó porque es un recién casado y desea ver el rostro de su esposa!</p>

<p>Aunque Cárcel ni siquiera había abierto la boca, ella añadió con calma su propia versión de los hechos, como diciendo: “Estaba demasiado lejos para oírlo”, con voz atronadora.</p>

<p>—Parece que no pudo soportar ni siquiera esa breve separación.</p>

<p>—Los recién casados, de verdad...</p>

<p>—Los recién casados...</p>

<p>—Se rumorea que todo el comando ya está alborotado con historias sobre ustedes dos. Nadie había tenido la oportunidad de verlo con sus propios ojos hasta ahora, ya ve...</p>

<p>—¿Ah, sí? ¿Qué tipo de historias? ¿Que su amor rebosa hasta los topes?</p>

<p>—Exactamente. Que el Capitán Escalante finalmente sentó cabeza en el momento en que se casó, dicen...</p>

<p>La joven esposa del Teniente Anaya charlaba animadamente, pero de repente se dio cuenta de lo que estaba diciendo y frunció los labios en silencio, incómoda.</p>

<p>“Por fin sentó cabeza” era una expresión que, naturalmente, daba a entender que antes había vagado sin rumbo fijo. Y no había nadie en esa sala que no supiera que, durante ese tiempo, Inés había sido su prometida.</p>

<p>En un silencio verdaderamente incómodo, Inés finalmente cruzó la habitación y se detuvo frente a Cárcel.</p>

<p>Como si lo hubiera estado esperando, Cárcel se disculpó, la rodeó con el brazo por la cintura y la sacó por la puerta. El simple hecho de estar separados del salón por una pared transformó el incómodo silencio en algo más cómodo.</p>

<p>—... Si hubiera sabido que sería así, no habría vuelto.</p>

<p>Por supuesto, eso solo era cierto para Inés. Cárcel, aún con una expresión de total incomodidad, murmuró sin soltarla ni acercarla más a él.</p>

<p>—Hace bastante calor.</p>

<p>Como diciendo: “Si no puedes decidir qué camino tomar, yo decidiré por ti”, Inés habló, dando a entender que él debía soltarla, pero Cárcel seguía sin poder hacerlo.</p>

<p>En medio de las lejanas risas de los oficiales y las voces de las damas, que se esforzaban por bajar el tono como si fueran conscientes de la mirada de los hombres mientras dirigían laboriosamente la conversación hacia otros temas, el silencio se instaló una vez más.</p>

<p>Cárcel finalmente habló, como si exhalara un suspiro.</p>

<p>—... Lo que acaba de decir la señora Anaya.</p>

<p>—No pasa nada. Ese tipo de cosas son mi responsabilidad.</p>

<p>—... ¿Tu responsabilidad?</p>

<p>—Ya que me casé contigo, es parte de mi deber escuchar y vivir con ello.</p>

<p>—...</p>

<p>A los oídos de Cárcel, sonó como “la humillación que debo soportar de por vida por haberme casado con alguien como tú”. Independientemente de lo absolutamente natural que lo hubiera dicho Inés, como si simplemente estuviera transmitiendo un hecho.</p>

<p>Cárcel aflojó ligeramente el agarre de su cintura con las manos y luego volvió a acercar a Inés. Más lejos de la habitación. Para que sus susurros no pudieran oírse en absoluto.</p>

<p>Y si la falda amplia de Inés no se hubiera interpuesto entre ellos, tal vez no habría quedado ni el más mínimo espacio entre ellos... Su rostro estaba empapado de culpa, pero sus manos lo delataban.</p>

<p>—Aferrarte así incluso después de oír lo que dijeron... Realmente no tienes vergüenza.</p>

<p>—Si te suelto, no habrá oportunidad de compensar...</p>

<p>—Cárcel. A menos que puedas retroceder en el tiempo, no hay nada que puedas compensar.</p>

<p>Inés lo interrumpió sin rodeos. La expresión de Cárcel se congeló de forma extraña. Era como si ella no hubiera cortado sus palabras, sino algo tan sustancial como sus dedos. Añadió apresuradamente:</p>

<p>—Y no hay necesidad de compensar nada... Me gusta tu talento.</p>

<p>—¿Qué, mi talento para jugar con las mujeres?</p>

<p>—No era mi intención decirlo así...</p>

<p>Como diciendo: “Sí así es como lo ves, que así sea”, Inés le dio unos golpecitos suaves en la mandíbula. Luego, como si decidiera que eso era extraño después de todo, cambió su expresión a una seria y continuó.</p>

<p>—Digamos que fue agradable verte vivir de acuerdo con tu actitud y naturaleza. Es hermoso cuando las personas viven tal como nacieron... cuando son ellas mismas...</p>

<p>—Deja de decir tonterías. Ni que fuera un perro.</p>

<p>—Sinceramente, no me importa escuchar cosas así. Cárcel. Ella no tuvieron malas intenciones, y el hecho de que hayas tenido muchas mujeres es simplemente cierto.</p>

<p>—...</p>

<p>—Y no me arrepiento de ese hecho.</p>

<p>—...</p>

<p>—Así que no hay necesidad de que me ofenda, ni de que tú te preocupes por ello.</p>

<p>—...</p>

<p>—Así que déjalo ser.</p>

<p>La mano de Cárcel se deslizó lentamente por su espalda. Se detuvo en su cadera, pero, a diferencia de antes, había perdido fuerza.</p>

<p>Parecía desanimado de alguna manera... En cualquier caso, ahora hacía mucho calor. Fue el momento en que Inés se apartó fríamente de su abrazo.</p>

<p>—... No era nada hermosa.</p>

<p>—¿Qué?</p>

<p>—La esposa del Capitán Salvatore. No era nada hermosa.</p>

<p>Bueno, eso tenía sentido. Cualquiera que se despertara cada mañana con esa cara en el espejo contraería esa enfermedad de la arrogancia.</p>

<p>Inés asintió con la cabeza como diciendo “¿no era así?” e intentó apartarse por completo, pero la mano que le agarraba la parte superior de sus caderas la volvió a tirar con fuerza.</p>

<p>—... Tú eres mucho más hermosa. Eras la más hermosa. Quizás la única mujer hermosa aquí.</p>

<p>—Francamente, no es particularmente difícil ser la persona más hermosa de este lugar, Cárcel.</p>

<p>Expresó una arrogancia natural, como si fuera lo más normal del mundo.</p>

<p>—Entonces no lo digas solo para hacerme sentir mejor...</p>

<p>—Lo que digo es que no había motivo para que me sintiera complacido por que esa mujer se me insinuara. No la encontré hermosa, ni me gustó.</p>

<p>—...</p>

<p>—A decir verdad, tampoco importa si esa mujer era hermosa o no. Por supuesto que no era hermosa. Hoy no he visto a ninguna mujer hermosa a parte de ti, ni una sola. Y no solo hoy, sino todos los días. Pero eso no importa. Así que, aunque fuera más hermosa que tú, no me habría alegrado. No hay ninguna mujer más hermosa que tú en ningún lugar... ¿lo entiendes?</p>

<p>Cárcel añadió una larga serie de explicaciones antes de espetar con impaciencia. Aunque en esencia todo eran elogios, su tono era tan irritado que no lo parecía.</p>

<p>Inés asintió vagamente. Él levantó las cejas.</p>

<p>—¿Lo entiendes?</p>

<p>—Lo entiendo, lo entiendo... pero.</p>

<p>—Si crees que una mujer ebria aferrándose a mi delante de ti no podría ser otra cosa más que una agradable sorpresa para tu esposo...</p>

<p>—...</p>

<p>—Me has entendido completamente mal, Inés.</p>


<p>Inés parpadeó en silencio y lo miró.</p>

<p>Quería preguntarle si realmente eso merecía una explicación tan seria, pero el mero hecho de plantear la pregunta parecía causar un estrés inmenso a Cárcel.</p>

<p>Que un cuerpo tan grande pudiera parecer tan frágil como un objeto delicado...</p>

<p>—... Quizás podría ser un golpe de suerte para ti  que no esté mirando.</p>

<p>Ante su tentativa, la expresión de Cárcel se resquebrajó como porcelana astillada. Inés se apresuró a añadir:</p>

<p>—Me refiero a como en los viejos tiempos.</p>

<p>Le salió el tiro por la culata. Él preguntó con los dientes apretados, como si se tragara su paciencia.</p>

<p>—... ¿No recuerdas lo que hicimos para que acabaras viviendo aquí?</p>

<p>—Nos casamos. Obviamente, solo estoy bromeando. Por supuesto que lo recuerdo, y no tengo nada de qué lamentarme. Ese tipo de suerte no es nada, sin duda.</p>

<p>—¿Por qué eso sería una suerte? Maldita sea, Inés, ni siquiera me miras como es debido.</p>

<p>—Bueno, la mayoría de los hombres...</p>

<p>—No lo necesito. No lo aceptaré. Aunque me dieras ese tipo de suerte, no la aceptaría. No la aceptaré.</p>

<p>—Bien. Si no la quieres, no la aceptes.</p>

<p>Inés hizo un gesto con la mano, como si le hubieran rechazado un regalo cuidadosamente elegido, como si fuera sucio y mezquino.</p>

<p>Cárcel le mordió la punta del dedo con irritación. Era como una pelea infantil.</p>

<p>—¡Ah...!</p>

<p>—No te mereces escuchar eso, Inés.</p>

<p>—Y tú no tienes derecho a estar enfadado, Cárcel.</p>

<p>—... Lo sé.</p>

<p>Como si nunca hubieran discutido, de repente parecía como si le hubieran echado un jarro de agua fría, arrepentido. O como una rana golpeada por una piedra por un comentario imprudente.</p>

<p>Su ira se desinfló al instante, dejando a Inés, que había estado alborotada, ligeramente desconcertada.</p>

<p>—... Sí, es cierto, soy una basura, por eso te humillan así.</p>

<p>—No me he sentido insultada.</p>

<p>—Pero al final, soy yo quien te insulta.</p>

<p>—Te digo que no me he sentido insultada.</p>

<p>Cárcel soltó lentamente el brazo que la rodeaba. Aunque la libertad que había estado esperando había llegado, Inés no se atrevía a alejarse apresuradamente y lo miró inquieta. Esa expresión abatida, como la de un perro, era más difícil de escapar que la restricción física.</p>

<p>Se podía ordenar a alguien que aflojara el agarre, pero ¿cómo se podía hacer desaparecer esa mirada decepcionada, como la de un perro?</p>

<p>¿Decirle que dejara de poner esa expresión de perro? Eso era demasiado cruel.</p>

<p>—Lo siento.</p>

<p>—...</p>

<p>—Debí haberte pedido disculpas hace mucho tiempo.</p>

<p>—Recuerdo que te disculpaste antes de casarnos.</p>

<p>—Siento haber vivido como un perro.</p>

<p>—... Que ya lo hiciste te digo, Cárcel.</p>

<p>—Aunque vivir así no te causaba ningún remordimiento y no te importaba en absoluto, porque no te gustaba lo más mínimo, así que dijiste que estaba bien.</p>

<p>—...</p>

<p>—Viví una vida ridícula y te hice ver ridícula también.</p>

<p>—...</p>

<p>—No me di cuenta qué...</p>

<p>Así que era una actitud lamentablemente resignada, una que no habría sido sorprendente si hubiera declarado que saltaría desde ese acantilado costero para expiar el pecado de mancillar su honor.</p>

<p>Inés le tapó la boca antes de que pudiera seguir adelante.</p>

<p>—Por favor, ya no hables, en serio. Pareces haberlo olvidado, pero estamos en medio de una fiesta. Hay invitados por todas partes...</p>

<p>—Inés, como tú has dicho, no podemos volver atrás en el tiempo, así que no puedo compensar el daño.</p>

<p>—No es necesario. ¿Recuerdas lo que te dije?</p>

<p>—Pero quiero compensarte.</p>

<p>—Bueno, no es necesario.</p>

<p>—Te compensaré.</p>

<p>—Por favor, no me compensés. No sé qué querés decir con compensarme, pero no lo hagas…</p>

<p>Inés susurró con ternura.</p>

<p>—Si no puedo compensarte, querré morir, Inés.</p>

<p>—No puedes compensarme. No. No es necesario.</p>

<p>—Entonces, ¿te parece bien que muera?</p>

<p>—No.</p>

<p>Tenía que vivir para que pudiera engañarla... Debía cometer adulterio... En otro tiempo, Inés había deseado un futuro marido que muriera joven antes que ser un mujeriego. Pero diecisiete años de afecto la habían llevado a desear que Cárcel Escalante viviera mucho tiempo y feliz, conociendo a muchas mujeres.</p>

<p>—No importa cuánto tiempo me tome.</p>

<p>Mantener las apariencias era la recompensa en sí misma. Decirle a un hombre que se disculpaba por ver a otras mujeres que debía ver a más mujeres como compensación sería darle una pista demasiado obvia.</p>

<p>Inés lo miró en silencio, luego le acarició las mejillas y lo atrajo hacia ella. Había visto muchos aspectos desconocidos de él desde poco antes de su matrimonio, pero nunca unos ojos más sinceramente derrotados y desolados que estos.</p>

<p>—Cárcel... Solo te pido una cosa.</p>

<p>Hizo una pausa para suspirar antes de continuar.</p>

<p>—Que sigas teniendo este mismo aspecto.</p>

<p>—...</p>

<p>—Debes seguir viéndote así. Con esa cara tan hermosa. Los ojos, la nariz, la boca... todo tal y como está.</p>

<p>—...</p>

<p>—Por supuesto, el tiempo es implacable. Pero un hombre con tu aspecto incluso envejecerá con elegancia. Aun así, por si acaso, ten cuidado con el sol...</p>

<p>—Ya tengo este rostro.</p>

<p>—Mantén este rostro perfecto tal y como está. Cárcel. Esa es mi recompensa.</p>

<p>—... Lo siento, pero eso me parece una completa mierda.</p>

<p>—Vi este rostro cuando tenía seis años y lo veo ahora que tengo veintitrés. Lo vi cuando me gustabas y lo vi cuando no me importabas lo más mínimo. Siempre.</p>

<p>—...</p>

<p>—La verdad es, Cárcel, que a un tipo apuesto como tú le resulta muy fácil vivir como un perro. Y no es culpa tuya. El mundo te ha hecho así...</p>

<p>Si un niño de la calle creciera para convertirse en ladrón, cometiera delitos y luego se arrepintiera ante algún alma benevolente, es posible que escuchara palabras muy parecidas a estas.</p>

<p>No robabas porque hubieras nacido criminal. El mundo te convirtió en uno... ¿Cuál es la diferencia?</p>

<p>—Porque es un mundo en el que todos los hombres son feos. A pesar de ser un mundo tan árido, por desgracia las mujeres siguen teniendo ojos exigentes. Porque la gente nunca pierde la esperanza... Hiciste felices a muchas mujeres con un solo cuerpo.</p>

<p>—A mí me sigue pareciendo una mierda. Inés.</p>

<p><span style="font-style:italic">¿Me estás diciendo que soy un trapo útil, es eso?</span></p>

<p>—Añade la felicidad de otras mujeres a tu culpa hacia mí. Se cancelará y quedará en cero. No... La influencia positiva que tu rostro tiene en el mundo seguirá siendo infinita. Ni siquiera he sufrido por tu culpa, ¿sabes?</p>

<p>—Por eso es realmente extraño.</p>

<p>—Te lo repito: vivir con este rostro es la única recompensa.</p>

<p>Y usar ese rostro para hacer felices a las mujeres a las que aún no ha hecho felices. Para hacerla feliz a ella también.</p>

<p>En el rostro de Inés solo se podía percibir sinceridad, así que, aunque Cárcel pensaba que sus palabras eran un completo disparate, se cubrió el rostro con las manos.</p>

<p>—... Si me volviera feo, ¿me dejarías?</p>

<p>—Ni lo sueñes.</p>

<p>—...</p>

<p>—Nunca te dejaría primero.</p>

<p>Rechazar el matrimonio era su prerrogativa. Inés le dio un beso en el labio inferior, como para poner punto final a la conversación. Había visto al Coronel Barca acercándose desde lejos.</p>

<p>Justo cuando Cárcel se quedó paralizado como una estatua, parpadeando, la señora Coronado irrumpió en el salón.</p>

<p>—Señora Escalante, lamento mucho interrumpir su agradable velada con el señor, ¡pero la puesta de sol se está desvaneciendo! Por supuesto, usted la ve todos los días, pero ¿no sería especial contemplarla con sus primeros invitados? Todos están realmente emocionados y desean expresar su gratitud...</p>

<p>—¿Cárcel?</p>

<p>Él recuperó con sorprendente rapidez su expresión serena y acompañó a Inés de vuelta al interior. Ella lo observó hasta que Cárcel fue alcanzado de nuevo por el Coronel Barca, quien le entregó una copa, y luego siguió a la señora Coronado a la terraza.</p>

<p>Sospechaba que era solo una excusa para volver a meterla en la conversación, pero las damas de la terraza estaban realmente cautivadas por la puesta de sol.</p>

<p>Después de recibir torpemente una ronda de sinceros agradecimientos, Inés se sentó en silencio junto a la Marquesa Barca y contempló el mar que se extendía más allá del jardín.</p>

<p>El jardín, teñido cálidamente por el rojo del atardecer, estaba salpicado de farolas encendidas temprano por los sirvientes, que florecían como flores, mientras que cada nube que flotaba sobre el horizonte ardiente tenía un tono diferente del cielo.</p>

<p>Era una escena impresionante y encantadora, como si se viera por primera vez. Inés lo contempló todo en silencio.</p>

<p>—Creo que ahora lo entiendo.</p>

<p>—¿Qué?</p>

<p>—El Capitán Escalante quería mostrarle esta vista.</p>

<p>La Marquesa murmuró, e Inés se volvió para mirarla. Antes de que Inés pudiera comprender del todo el significado de esas palabras, la señora Coronado habló con voz emocionada.</p>

<p>—Sí. Debió haber querido vivir aquí, en un lugar tan encantador, con su hermosa esposa.</p>

<p>—...</p>

<p>—Uno no lo diría, pero qué encantador es, a pesar de su imponente estatura.</p>

<p>—Señora Coronado, si me disculpa, me cuesta un poco seguirle el hilo.</p>

<p>—El Capitán adquirió esta mansión justo antes de casarse con usted, ¿no es así?</p>

<p>—...</p>

<p>—¿Seguro que no lo sabía? Recuerdo que originalmente tenía una gran mansión cerca del cuartel general...</p>

<p>—Cierto. Es verdad.</p>

<p>—Verdad que sí. Antes vivía el Coronel Gwen allí, después el Capitán Escalante vivió allí solo tan pronto como fue nombrado Teniente.</p>

<p>—Eso explica por qué recuerdo que era tan cruel con mi esposo, llamándolo bastardo descarado.</p>

<p>—...</p>

<p>No tenía sentido. Cerca del cuartel general, y una mansión tan grande...</p>

<p>—Para ser sincera, algunos incluso decían que mantenía a su recién casada esposa encerrada en esta casa pequeña, esperando a que se escapara. No por rencor, claro está. La señora no es una mujer cualquiera. No es una noble cualquiera, sino la hija del Duque Valeztena, nada menos...</p>

<p>—¿Acaso nosotras no nos habríamos quejado de que era pequeña? Por no hablar de la señorita Valeztena.</p>

<p>—Fue justo antes de la boda. ¿No dijeron que se había robado la casa del Comandante Elba?</p>

<p><span style="font-style:italic">¿Robar esta ratonera cuando no hay nada que valga la pena? Por supuesto que era encantadora. Encantadora, acogedora, incluso mágicamente hermosa en ese momento.</span></p>

<p><span style="font-style:italic">Pero aún así, ¿por qué?</span></p>

<p>—Creo que no fue un robo. Más bien un intercambio. Dicen que recibió varios objetos que pertenecían al difunto Almirante Escalante.</p>

<p>—Entonces debió haberse arrastrado a cuatro patas para obtenerlos. Los marineros adorarían a un fantasma como rey si fuera el abuelo de su Capitán...</p>

<p>—¡Señora! ¡Señorita!</p>

<p>Antes de que las dudas de Inés pudieran resolverse por completo, la voz del Coronel las llamó de repente desde el jardín. A su lado, Cárcel estaba de pie, sonriendo con la misma expresión insincera de antes. <span style="font-style:italic">¿Cuándo había conseguido llegar hasta allí?</span> Mientras reflexionaba sobre ello, la voz de la Marquesa resonó como una alucinación auditiva.</p>

<p><span style="font-style:italic">—El Capitán Escalante quería mostrarle esta vista.</span></p>

<p>Justo cuando se sobresaltó, pensando que había oído esas mismas palabras, el grito del Coronel rompió la ilusión de Inés.</p>

<p>—¡Escalante está presumiendo de su armería! ¡Tiene una armería! ¡En esta pequeña casa!</p>

<p>Mientras los hombres reían al unísono, como si fuera una señal, Inés se encontró con la mirada de Cárcel. No había tiempo para la sensación de impotencia que había sentido antes. Los hombres ya se dirigían hacia la terraza y pronto subieron los pocos escalones y entraron en la casa.</p>

<p>—¡Vamos todos a verlo, así que vengan!</p>

<p>Empujaron a las mujeres, que entraron primero en la parte interior de la sala de recepción. Cuando los hombres las siguieron, la estrecha casa se llenó por completo. Inés sintió de repente un fuerte agarre alrededor de su cintura.</p>

<p>Eran los anfitriones, por lo que, naturalmente, debían ir delante. Era lo correcto. No podían ir detrás como un invitado...</p>

<p>Sin embargo, ella no se habría sorprendido más si él la hubiera levantado de repente para tener sexo en plena noche. Inés estaba realmente conmocionada. Cárcel se sorprendió por su conmoción. Las miradas incómodas se cruzaron brevemente en el aire antes de dispersarse.</p>

<p>—Este pequeño lugar lo tiene todo, ¿no?</p>

<p>—¿Qué es este rifle de caza? Nunca había oído hablar de uno así ni había visto uno igual.</p>

<p>—Ah, ese fue regalo de Inés, me la dio mientras hacia la armería.</p>

<p>—¿Es obra de la señora Escalante?</p>

<p>—¿En serio, señora?</p>

<p>—... Cambié la residencia bastante a mi gusto. Ignorando lo que él solía tener... Así que supongo que necesitaba algunos regalos para suavizar las cosas.</p>

<p>Inés respondió al oficial que estaba cerca, sonriendo como si no fuera nada. Sin embargo, inexplicablemente, sentía la garganta seca.</p>

<p>—He oído que también fue idea suya colocar una mesa de juego en el invernadero.</p>

<p>—Por Dios, Escalante. ¿Se casó con una mujer así?</p>

<p>—Fue una idea genial. Una vez sentado, uno simplemente no quiere marcharse.</p>

<p>—Precisamente para eso se hizo. A los hombres no les satisface nada más que las cartas y la bebida.</p>

<p>Cuando la Marquesa comentó con cinismo desde detrás de la multitud, los hombres volvieron a reír como si fuera una señal. El método de adulación parece idéntico, ya sea dirigido al oficial superior o a su esposa.</p>

<p>La nueva armería de la mansión resultaba bastante estrecha para que cupieran diez personas de pie, por lo que el pasillo también estaba repleto de invitados. Inés se preguntó de repente dónde habían ido a parar todas las numerosas armas de fuego que poseía Cárcel. Seguramente, antes de venir aquí...</p>

<p>Al volver a mirar el perfil de Cárcel, parecía masticar granos de arena. La gente estaba ocupada elogiando a Inés, mientras Cárcel se ocupaba de desempeñar el papel del típico joven aristócrata, felizmente comedido, aunque solo fingiendo...</p>

<p>¿Y si no fuera fingimiento?</p>

<p>—Ahora que lo menciona, ¿qué tal si vamos todos de cacería?</p>

<p>—Da la casualidad de que la temporada de caza del zorro comienza dentro de unos quince días. ¿Qué le parece, Escalante?</p>

<p>Como si se hubieran separado temporalmente de los demás, sus voces se hicieron más lejanas. Incluso la propia voz de Cárcel se desvaneció.</p>

<p><span style="color:#777777">—Sí. Debió haber querido vivir aquí, en un lugar tan encantador, con su hermosa esposa.</span></p>

<p>Eso no podía ser.</p>

<p><span style="font-style:italic">No puede ser. Por mi culpa...</span></p>

<p>Cárcel Escalante no podía ser tan ingenuo y tonto.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p><span style="color:#777777">—Nunca te dejaría primero.</span></p>

<p>Medio día antes, como para traicionar abiertamente el juicio de su esposa de que “no podía ser tan tonto”, Cárcel Escalante se miró en el espejo y esbozó una sonrisa espléndidamente tonta.</p>

<p>La premisa que provocó esas cálidas palabras de la boca cruel de Inés era “si te vuelves feo”. Así que, en esencia, era una declaración obvia y sin importancia: “No te dejaré aunque te vuelvas un poco menos guapo”. Pero con un ligero adorno en su mente, se convirtió en algo cálido como “pase lo que pase, no te dejaré”.</p>

<p>Era una decisión obvia. Aunque se volviera un poco menos guapo, seguiría siendo un noventa y nueve sobre cien. Como referencia, la puntuación perfecta era diez.</p>

<p>No había duda de que era el hombre más guapo de Ortega y, sin tener en cuenta las diferencias culturales en la percepción de la belleza, todos los hombres del mundo estarían por debajo de él.</p>

<p>Así que no dejarlo era lo más natural. Una decisión perfectamente racional. Inés era el tipo de mujer que valoraba este rostro por encima de todo lo demás en él, el tipo de mujer que juzgaba únicamente por la apariencia... Pero, ¿tenía sentido la noción misma de “dejar” en primer lugar? Ya eran marido y mujer.</p>

<p>Puede que hoy en día algunos Ortega se divorcien, pero para los grandes nobles como los Grandes de Ortega, es algo de otro mundo, a menos que sea absolutamente necesario. Para ellos, el divorcio es como un unicornio. Quizás similar al amor eterno. Algo que se dice que existe en alguna parte, pero que es una criatura fantasmal que nadie ha visto jamás.</p>

<p>Vivían juntos legalmente, aunque eso significara matarse el uno al otro, en lo más alto de la sociedad de Mendoza. Los padres de Inés eran así, y aunque no llegaban a ese extremo, los padres de Cárcel no eran diferentes.</p>

<p>—Ha llegado un sirviente de la residencia del Capitán Salvatore. Dice que se ha olvidado algo. ¿Qué hacemos si no hay nada?</p>

<p>—Ojalá Salvatore se divorciara.</p>

<p>—¿Perdón?</p>

<p>—Son divagaciones de borracho. Encuentra algo adecuado y devuélvelo.</p>

<p>—Pero cómo podemos devolver algo que no existe…</p>

<p>Raúl, de pie junto a la puerta, murmuró incómodo. En lugar de entregarle la camisa al mayordomo que estaba a su lado, Cárcel se la tendió a Raúl. Este se adelantó rápidamente y la cogió.</p>

<p>—Encontraré algo adecuado y lo devolveré.</p>

<p>A diferencia de Raúl, Alfonso parecía muy consciente de la situación mientras hablaba. Cárcel asintió y Alfonso miró a Raúl como si le confiara las tareas restantes antes de salir apresuradamente de la habitación.</p>

<p>—... Entonces, ¿el Capitán Salvatore realmente no olvidó nada?</p>

<p>—Debes haber buscado a fondo.</p>

<p>—Sí. Lo hice.</p>

<p>—No eres tan estúpido, ¿verdad?</p>

<p>—No.</p>

<p>—Entonces, realmente no hay nada.</p>

<p>Cárcel respondió simplemente. Raúl frunció el ceño y preguntó.</p>

<p>—¿Y el Capitán Salvatore está pidiendo algo que no está en esta mansión?</p>

<p>—Pasa la mayor parte de sus días borracho. Ni siquiera necesita dinero para beber.</p>

<p>—De todos modos, solo son divagaciones de borracho... ¿Por qué dárselo?</p>

<p>—Porque decirle la verdad es más problemático.</p>

<p>—...</p>

<p>—Además… a veces optan por culpar y golpear a los sirvientes.</p>

<p>Cárcel lo dijo como si no fuera nada, aceptando una camisa nueva de Raúl. Hablaba como si fuera un asunto trivial, pero, en última instancia, era precisamente por eso por lo que se estaban saqueando objetos valiosos.</p>

<p>¿Era indulgente con el Capitán Salvatore o simplemente indiferente? Raúl observó la espalda de Cárcel con una mirada complicada. Quizás era amable con los sirvientes de la casa Salvatore…</p>

<p>—... Aún no se lo he dicho a la señora Inés.</p>

<p>—¿Qué cosa?</p>

<p>—Que el Capitán la está vigilando.</p>

<p>Raúl llevaba varios días muy serio. ¿Qué había despertado realmente la sospecha que lo había puesto tan grave? ¿Fue cuando Hugo se quedó allí como un loco, mirando fijamente y observando a Inés con atención?</p>

<p>¿O era Kara, que normalmente sólo hacía lo que se le ordenaba, y ahora se aferraba al lado de Inés con un celo excesivo? ¿La mirada culpable del cochero? ¿O Alfonso, que había visto a Inés desde lejos y de repente había dejado escapar un suspiro cargado de dudas?</p>

<p>Una vez que empezó a sospechar, no había fin. Era sorprendente lo torpes que eran sus acciones, pero no tenía ni una pizca de prueba en sus manos. ¿A qué se debía esa torpe perfección? Era porque había una mente que dirigía a esos torpes humanos desde arriba.</p>

<p>Y no había muchos con ese nivel de experiencia en esta pequeña mansión. En el mejor de los casos, serían los empleados de mayor rango, como el mayordomo o el ama de llaves. Alondra, la fiel anciana, no era adecuada, así que solo quedaba Alfonso.</p>

<p>—No he hecho tal cosa.</p>

<p>—... Entonces, ¿cuál sería el término adecuado? ¿Vigilar? ¿Verificación de antecedentes?</p>

<p>—No paras de hablar, ¿verdad?</p>

<p>Cárcel se dio la vuelta con más compostura de la esperada. Si no fuera cierto, debería estar furioso; si lo fuera, al menos debería mostrarse más siniestro que eso. Como mínimo, esto no era lo que Raúl había previsto.</p>

<p>—¿Y?</p>

<p>—... Quiero informarle de que, me atrevo a decir, he descubierto la debilidad del Capitán.</p>

<p>Sonrió, como si le divirtiera un poco. Luego repitió la pregunta.</p>

<p>—¿Y?</p>

<p>Era un desconocido, que parecía haber surgido de la nada. Teniendo en cuenta lo dócil que había sido antes con Inés, parecía una personalidad completamente diferente.</p>

<p>—Y si la señora Inés se enterara, no lo toleraría. Lo sabe. Para alguien como la señora Inés, sería un insulto insoportable.</p>

<p>—¿Por qué?</p>

<p>—¿Eh?</p>

<p>—No desconfío de Inés, sino de ti.</p>

<p>Cárcel sonrió cómodamente. Era la sonrisa de alguien que sabía perfectamente que esa sonrisa tan cómoda hacía que la otra persona se sintiera sumamente incómoda.</p>

<p>Raúl lo miró fijamente como si el tiempo se hubiera detenido, luego puso los ojos en blanco con incredulidad antes de volver a mirar a Cárcel completamente conmocionado. Parecía como si fuera a gritar “¡Heeeek!” si lo tocaban.</p>

<p>—No me diga que, no me diga que…</p>

<p>—¿Que no te diga que, qué?</p>

<p>—No me diga que está celoso de mí…</p>

<p>De sus labios entreabiertos salió un sonido como el aire escapándose: “Heeeeek”. Solo escucharlo, agotaba sus fuerzas.</p>

<p>Al escuchar semejante disparate, Cárcel se encontró, por absurdo que pareciera, capaz de admitirlo por primera vez.</p>

<p>Celos... Sí, sin celos, nada de esto habría ocurrido. Mira que acabar en un estado tan patético que incluso ese miserable pudiera decir que había “encontrado su debilidad”.</p>

<p>Pero los celos no implican necesariamente grandes emociones. Bastaba con una obstinación estrecha de miras que simplemente se negaba a compartir. Algunos los desarrollan hacia sus padres, otros hacia los juguetes, otros hacia los amigos, otros hacia la comida, otros hacia un único rifle. Por supuesto, algunos también pueden sentirla hacia un amante…</p>

<p>Y en su caso, era simplemente Inés.</p>

<p>—¿Cómo, cómo ha podido pensar en algo tan monstruoso? Yo, cómo me atreví a…</p>

<p>—¿Qué tiene de monstruoso? Tú eres un hombre, Inés una mujer.</p>

<p>—...</p>

<p>—Así que podrías intentar cualquier cosa.</p>

<p>—No sé cómo decirlo. Realmente ve a las personas como si no le importaran, pero a la vez, tiene prejuicios contra ellas…</p>

<p>Cárcel se encogió de hombros y sonrió con desdén.</p>

<p>—Sé que Inés no se conformaría con lo que tienes para ofrecerle.</p>

<p>—... ¿Desconfía de mí?</p>

<p>—He dicho que desconfío de ti.</p>

<p>—La verdad es que parece una persona tan compleja que tengo que preguntárselo. Dice cosas que no entiendo.</p>

<p>—Quizás simplemente no me agradas</p>

<p>No era un mal día para admitir cosas. Sentía que incluso la simple promesa de no dejarlo si se volvía feo era un gran paso adelante.</p>

<p>¿Qué importaba que le ofreciera un dedo como golosina al perro de Inés?</p>

<p>—Sé muy bien que me detesta... Solo que no me había dado cuenta de que tanto.</p>

<p>—El hecho de que lo sepas tan bien me hace detestarte aún más.</p>

<p>Una vez que lo admitió, admitió más sin dudarlo. Raúl se mordió el labio en silencio y luego preguntó con amarga determinación.</p>

<p>—¿Cómo lo demuestro? ¿Debería estrellarme la cabeza contra el marco de la ventana?</p>

<p>—Las personas son misericordiosas consigo mismas. De todos modos, eso no te mataría.</p>

<p>—Iba hacerlo hasta que me dijera que parara.</p>

<p>Su petición de morir fue respondida con una réplica aún más extrema. Cárcel chasqueó la lengua.</p>

<p>—Parece que no eres un loco cualquiera.</p>

<p>—Solo soy un sirviente leal y corriente.</p>

<p><span style="font-style:italic">¿Qué demonios?</span> La respuesta de Raúl solo lo hacía parecer más trastornado. Cárcel se abrochó holgadamente la camisa de lino y se sentó con las piernas cruzadas en el asiento.</p>

<p>—¿Qué pretendías hacer con mi debilidad?</p>

<p>—No tenía intención de hacer nada. Solo quería evitar que le hicieran daño a la señora Inés, mediante la humilde petición de un sirviente…</p>

<p>—Más bien mediante chantaje. ¿Qué eres exactamente para Inés?</p>

<p>—Siempre me insulta llamando perro, ¿no?</p>

<p>—Parece que lo has oído. Hay tipos diferentes de perros.</p>

<p>—Un perro leal normal y corriente. Muerde si su amo sufre algún daño. Si su amo se siente amenazado…</p>

<p>—¿Acaso amas a Inés?</p>

<p>El rostro de Raúl se encendió como si lo hubiera prendido fuego la pregunta repentina y directa de Cárcel. No quedó ni un centímetro sin tocar, desde todo su rostro hasta las orejas, pero no había vergüenza por haber sido golpeado en lo más profundo, ni ningún tipo de timidez o bochorno.</p>

<p>Mientras la expresión de Raúl cambiaba violentamente, Cárcel observaba con tranquila indiferencia, con la barbilla apoyada como si estuviera viendo un espectáculo callejero.</p>

<p>Su actitud sugería que estaba evaluando qué era exactamente esa criatura. Y, sin embargo, no parecía particularmente curioso…</p>

<p>Raúl exhaló profundamente y luego levantó la mirada desafiante, con descaro.</p>

<p>—¿Amor? Le ruego no equipare mi devoción con una palabra tan vulgar... Mi lealtad es mucho más noble que eso.</p>

<p>Realmente parecía como si lo hubieran insultado horriblemente.</p>

<p>—Balan. Decir eso te hace parecer un auténtico pervertido, ¿sabes?</p>

<p>—Esas palabras no me harán cambiar de opinión.</p>

<p>Su rostro ya estaba sonrojado, completamente abrumado. Un pervertido leal, resoplando indignado porque su noble devoción había sido insultada como mero amor... Cárcel pensaba que cualquier cosa que fuera más allá del pensamiento humano ordinario era simplemente perversión.</p>

<p>Noble, sí, pero en última instancia pervertido. Así es. Era un pervertido que, en el fondo, no era diferente de él.</p>

<p>Se suele decir que el valor más preciado que se puede obtener del matrimonio es el amor. Esto era cierto, naturalmente, para los plebeyos, y aún más para los nobles, cuyos matrimonios se concertaban sin amor. ¿Por qué? Porque tal cosa nunca existió en primer lugar. Y Raúl Balan acababa de exponer la bajeza de ese amor.</p>

<p>Ese desgraciado no tenía motivos para envidiarlo. Aunque Cárcel Escalante se hiciera con esa cosa parecida a un unicornio en un futuro lejano, no tendría ningún valor para Raúl Balan... Era un loco. Cárcel había pensado que estaba un poco desquiciado, pero al observarlo más de cerca, se dio cuenta de que no era un lunático cualquiera. Olvidando su irritación y su aversión de siempre, Cárcel lo observó en silencio, como si lo estuviera evaluando.</p>

<p>¿Podría un individuo tan ciegamente pervertido seguir siendo realmente beneficioso para Inés? Pero entonces, siendo tan absolutamente patético, ¿podría siquiera llegar a hacer algo dañino?</p>

<p>¿Quizás lo mejor era dejarlo en paz después de todo? Era un loco insignificante. Nunca haría daño a Inés, ni siquiera en la muerte, y tampoco le supondría un obstáculo especial. Ya había llegado a esa conclusión antes, pero hoy lo sentía con más intensidad que nunca, al darse cuenta de lo ciegamente y puramente que Raúl Balan adoraba a Inés.</p>

<p>Se sentía ridículo por haber encontrado algo así insoportable, pero al mismo tiempo, su insistencia en que era más noble que su marido le daba ganas de darle una patada en la cabeza por razones completamente diferentes. Si Inés hubiera sido su amante, podría haber esperado a que ella se cansara de él y luego desecharlo. ¿Pero una mascota? ¿Cómo podía...?</p>

<p>—No me atrevo a albergar tales sentimientos por la señora Inés. La señora Inés es... La señora Inés es para mí...</p>

<p>—¿Inés, qué?</p>

<p>—No importa.</p>

<p>—Si has empezado, termina como es debido.</p>

<p>—No es algo apto para los oídos del Capitán.</p>

<p>—¿Así que tú eres un noble sirviente y yo solo un marido consumido por la lujuria?</p>

<p>—Olvídelo.</p>

<p>—Si estás tratando de subir el precio, solo tienes que decir la suma que deseas. Detesto regatear, Balan.</p>

<p>—¿Cree que vendería a la señora Inés?</p>

<p>—¿Qué es lo peor que podría pasar?</p>

<p>Sabiendo perfectamente que no era cierto, pero tratándolo como a un lacayo; cada pregunta, formulada con total conciencia, era un estrés extremo para Raúl Balan. Lo atormentaba. Una personalidad dividida, si es que alguna vez hubo una.</p>

<p>Inés había dicho “lo sé todo” con tal significado, pero ¿quizás no sabía nada en absoluto sobre ese hombre? Aunque es un poco desastre, su naturaleza es pura... ¿Se había dejado engañar simplemente por esa cara? Porque solo su apariencia es noble.</p>

<p>Cárcel Escalante parecía aún más noble con el uniforme, y su cuerpo, moldeado por un entrenamiento intenso, provocaba los prejuicios estrechos de miras de la gente. Por lo general, la destreza física y el intelecto son inversamente proporcionales, y se podría suponer que un soldado es sencillo y fácil de manejar... Aunque no tenía derecho a cuestionar la elección de Inés, aunque pudiera, no lo habría hecho.</p>

<p>Raúl lo veía precisamente así. Un hombre con un aspecto agradable, fácil de manejar para Inés.</p>

<p>No se trataba de que fuera estúpido. Significaba que carecía de rincones oscuros y retorcidos.</p>

<p>Sin embargo, el actual Cárcel Escalante parecía lejos de ser transparente por dentro y por fuera. Era necesario estudiarlo más a fondo.</p>

<p>—... No se lo diré a la señora Inés.</p>

<p>—Ve a decírselo. Quiero explicarle todo detalladamente.</p>

<p>—He dicho que no se lo diré...</p>

<p>—Díselo.</p>

<p>Un destello descarado brilló en su rostro impecable. Como un pequeño perro preparándose para una lucha desesperada, Raúl torció la nariz bruscamente antes de declarar con firmeza.</p>

<p>—Me niego.</p>

<p>—¿Por qué?</p>

<p>—Porque no puedo soportar ver a la señora Inés sufrir lo más mínimo... Por lo tanto, me niego.</p>

<p>Hablar de herir a Inés, qué palabra tan lamentablemente inadecuada. Cárcel esbozó una sonrisa ligeramente torcida ante el discurso exagerado de Raúl y luego señaló con la barbilla hacia la puerta.</p>

<p>Era una orden para que se largara, que Raúl acogió tan bien como cualquier otra orden que hubiera oído, pero en lugar de marcharse como si lo estuviera esperando, se quedó un momento ante Cárcel.</p>

<p>—... De verdad. No debe hacerle daño a la señora Inés.</p>

<p>—Me encargaré de ello.</p>

<p>—Trátela... con cuidado, se lo ruego.</p>

<p>Raúl se inclinó profundamente. No era la elegante cortesía que siempre mostraba.</p>

<p>A solas, Cárcel miró con ira el lugar donde el leal Raúl se había inclinado, apoyando la barbilla en la mano. Por alguna razón, la palabra “daño” permaneció en su boca como arena.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>—Señora Inés, ¿me está escuchando?</p>

<p>—¿Hmm?</p>

<p>—Me doy cuenta de que esto es desagradable... pero podría ser una oportunidad. Demuestra que el Capitán tiene un profundo, aunque bastante siniestro, interés en usted.</p>

<p>La promesa de no informarle significaba, por supuesto, que lo haría a sus espaldas. Ese reverendo hijo de puta, en quien ella había creído que era totalmente coherente en sus palabras y acciones, reveló inesperadamente una duplicidad que por un momento le hizo sentir la cabeza dura como una piedra. El esposo de su señora era noble por reconocer su débil temperamento. Y a Raúl le gustaba que Cárcel lo despreciara más. Al menos ahora podría justificar sus dudas absurdas.</p>

<p>—Aprovechemos este momento para profundizar sus sentimientos por usted. No querrá quedar en ridículo, ¿verdad?</p>

<p>Raúl disfrutaba cuando Cárcel lo subestimaba. Al menos ahora no albergaría sospechas tan absurdas.</p>

<p>Su devoción por Inés le obligaba a ayudar incluso a un hombre hostil hacia él. ¿Llamar a este noble espíritu simplemente perverso? Él era simplemente un soldado, una criatura sencilla. Su interior parecía más siniestro y ligeramente retorcido de lo que sugería su apariencia, pero visto desde lejos, volvía a ser ese hombre sencillo que Inés podía manipular fácilmente.</p>

<p>—... Raúl. ¿Qué opinas de Escalante?</p>

<p>Inés, que había estado escuchando a medias incluso cuando Raúl le proporcionaba información crucial sobre su marido, de repente le preguntó esto.</p>

<p>—Es una de las pocas casas nobles que pueden estar a la altura de Valeztena, con una historia ancestral...</p>

<p>—No, no me refiero a su familia.</p>

<p>—... ¿El Capitán?</p>

<p>¿No acababa de decirlo? Que su marido la seguía, observándola desde atrás. Francamente, no entendía por qué era necesaria una valoración más allá de eso.</p>

<p>Sin embargo, Inés contemplaba el cuadro enviado por Magdalena con una mirada soñadora y distante, como perdida en sus pensamientos. Su indiferencia hacia su propia situación no era nada nuevo...</p>

<p>—Creo que es la pareja más adecuada para la señora Inés.</p>

<p>Bueno, ella ya estaba casada. ¿Qué se podía hacer?</p>

<p>—Como única hija de la familia Valeztena, sólo debería tener lo mejor. El Capitán Escalante, después de todo, posee el mejor rango, honor y apariencia. Cuando Su Alteza Real ascienda al trono, se convertirá en uno de sus consejeros más cercanos. Y no seguirá siendo un soldado para siempre, así que esta vida en una casa tan infantil pronto terminará.</p>

<p>—...</p>

<p>Inés contempló las ondas del lago en el cuadro, repitiéndose a sí misma las palabras de Raúl.</p>

<p>Sí. Esto terminaría pronto. Como mucho, en unos pocos años. Una vez que Cárcel se fuera al lado de Óscar, ella no podría permanecer en Escalante, independientemente de cualquier otro plan u objetivo.</p>

<p>—Solo siento un ligero pesar porque no protegiera un poco mejor su parte inferior. Pero fue antes del matrimonio, y se mantuvo distante durante todo el compromiso. Si intento pensar de esa manera...</p>

<p>—¿Te molesta?</p>

<p>—En absoluto. Estar comprometido con alguien de la posición de Inés y, sin embargo... Pero ¿qué importa mi opinión? Al menos no es mala persona...</p>

<p>“Alguien de la posición de Inés”. Nadie diría eso.</p>

<p>Inés se rió suavemente. Raúl endureció el rostro y dijo con seriedad:</p>

<p>—Cualquiera que conozca de verdad a la señora Inés diría lo mismo.</p>

<p>—Todo el mundo vive así, Raúl.</p>

<p>—...</p>

<p>—Todo el mundo vive engañando. Las esposas engañan a los maridos, los maridos engañan a las esposas, los hijos engañan a los padres e incluso se engañan a sí mismos. Todo el mundo vive así. Cárcel no es una excepción.</p>

<p>—Pero la señora Inés no es así.</p>

<p>—De todos modos, yo no estaba en mi sano juicio.</p>

<p>Ella esbozó una leve sonrisa. Cada vez que hablaba implícitamente de aquella época, la expresión de Raúl se volvía como si fuera a morderse la lengua y morir en cualquier momento. Más exactamente, era la expresión de un superviviente que apenas había soportado aquello y había sobrevivido.</p>

<p>De dieciséis a veinte años. Una edad en la que los jóvenes nobles de Ortega podían simplemente entregarse a aventuras prematrimoniales. Sin embargo, para Inés, fue simplemente una época oscura, un vestigio de sus días con Emiliano.</p>

<p>La devoción extrema y ciega de Raúl por ella provenía en gran parte de ese período. Habiendo salvado un alma rota con puro esfuerzo, reverenciaba a Inés aún más por el trabajo que había invertido. En esencia, ella era la benefactora de Raúl, la obra maestra de su vida, su maestra, su objetivo, su reina. Sin embargo, también era un objeto de cuidado, perpetuamente frágil y totalmente inquietante, susceptible de romperse de nuevo en cualquier momento.</p>

<p>Juana lo había evaluado fríamente como “una disposición servil innata, nada que se pueda hacer al respecto”, pero al final, él había caído en la trampa porque era irremediablemente bondadoso. Podría creerse inteligente...</p>

<p>—... Simplemente no se encontraba bien entonces.</p>

<p>—Sí.</p>

<p>—Aquí no puedo cuidarla como lo hacía en Pérez. Sería maravilloso que Juana estuviera aquí...</p>

<p>—Ahora estoy bien, Raúl.</p>

<p>—...</p>

<p>—De verdad.</p>

<p>Raúl no sonrió. Solo había una forma de animar a su abatida y desanimada asistente.</p>

<p>—Hay algo que necesito que hagas.</p>

<p>Darle una tarea. Era como lanzarle un juguete a un perro y decirle que lo trajera.</p>

<p>—Lo que necesite, solo tiene que decirlo...</p>

<p>—Vigila también a Cárcel.</p>

<p>Excepto que lo que le había lanzado para que lo recuperara era su propio marido.</p>

<p>—¿Eh?</p>

<p>—He estado pensando en lo que dijiste. Antes, sobre que podría ser una oportunidad.</p>

<p>Varios años parecían mucho tiempo, pero una vez transcurridos, el tiempo no solo parecía corto, sino fugaz. Iba en contra de la dirección que deseaba Raúl, pero valía la pena aprovechar esta oportunidad.</p>

<p>Especialmente si ellos habían empezado primero.</p>

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

document.addEventListener("keydown", function(e) {
    if (
        (e.ctrlKey || e.metaKey) &&
        ["c", "x", "s", "u", "p"].includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});

let tamano = 18;

function cambiarFuente(fuente) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    contenido.style.fontFamily = '"' + fuente + '", serif';
    localStorage.setItem("fuenteLectura", fuente);
}

function cambiarTamano(valor) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    tamano += valor;

    if (tamano < 14) tamano = 14;
    if (tamano > 26) tamano = 26;

    contenido.style.fontSize = tamano + "px";
    localStorage.setItem("tamanoLectura", tamano);
}

function modoOscuro() {
    document.body.classList.toggle("oscuro");

    localStorage.setItem(
        "modoLectura",
        document.body.classList.contains("oscuro")
            ? "oscuro"
            : "claro"
    );
}

window.addEventListener("DOMContentLoaded", function() {

    const contenido = document.getElementById("contenido");
    const fuente = document.getElementById("fuente");

    if (!contenido || !fuente) return;

    const fuenteGuardada = localStorage.getItem("fuenteLectura");
    const tamanoGuardado = localStorage.getItem("tamanoLectura");
    const modoGuardado = localStorage.getItem("modoLectura");

    if (fuenteGuardada) {
        fuente.value = fuenteGuardada;
        cambiarFuente(fuenteGuardada);
    }

    if (tamanoGuardado) {
        tamano = parseInt(tamanoGuardado);
        contenido.style.fontSize = tamano + "px";
    }

    if (modoGuardado === "oscuro") {
        document.body.classList.add("oscuro");
    }
});

</script>

<p>—...</p>

<p>—Disculparse no es vergonzoso, no hacerlo lo es.</p>

<p>Tanto si su relación era buena como mala, había algo raro en ellos para ser una pareja de recién casados. A juzgar solo por el tono, no era el tono de alguien que disciplinaba estrictamente a un niño.</p>

<p>Los ojos de José se movían impotentes entre Inés y Cárcel, antes de fijarse finalmente en el incómodo espacio entre ellos.</p>

<p>No quería la disculpa de su superior. La idea de la sutil represalia dentro de la misión que seguramente seguiría a aceptarla... Sin embargo, incluso en medio de esto, el cordero estaba sorprendentemente delicioso, y la jerarquía dentro de la pareja ya estaba clara.</p>

<p>En lugar de arriesgarse a ofender al superior de su superior —no, a la esposa de su superior— y, en última instancia, ofender al propio superior al decir que no lo quería...</p>

<p>José se calló y saboreó el cordero en silencio. Pero de pronto…</p>

<p>—... Me equivoqué un poco.</p>

<p>—¿Qué?</p>

<p>—¿Qué?</p>

<p>—Debes decir exactamente qué hiciste mal y por qué, para que la otra parte sepa que reconoces plenamente tu error y te estás disculpando. Por ejemplo: “Después de haberme tomado la molestia de invitarte y de que te hayas esforzado por venir aquí, he cometido una descortesía irreparable…”. Algo así.</p>

<p>—Maldita sea, lo siento... Después de haberme tomado la molestia de invitarte, acabé maldiciéndote.</p>

<p>—¿Y si te disculpas por maldecir volviendo a maldecir?</p>

<p>—... Y siento haber vuelto a maldecir. ¿Contenta?</p>
<p>—Si lo pones así, no sé si te estás disculpando conmigo o con el Teniente Almenara.</p>

<p>—A menos que haya perdido la cabeza, nunca te insultaría...</p>

<p><span style="font-style:italic">Ah.</span></p>

<p>Cárcel recordó con precisión cuáles eran las palabras que Inés había citado. Una nimiedad como: “Cuando dices Escalante, ¿cómo voy a saber si te diriges a mí o a Miguel?”.</p>

<p>En cuanto se dio cuenta de que lo había citado, perdió todo deseo de ganar la discusión.</p>

<p>Entonces cambió el tono, que había sido desdeñoso al ofrecer una disculpa.</p>

<p>—Perdón por maldecir, y perdón por maldecir de nuevo, Almenara.</p>

<p>Cárcel pronunció su disculpa con la misma deliberación con la que leería un idioma extranjero, articulando cada palabra con claridad.</p>

<p>Cuando José asintió con la cabeza, con aspecto de haber escapado de la muerte solo para recibir la disculpa, Inés sonrió levemente y miró a Cárcel.</p>

<p>—¿Ves? Cómo se siente bien hacer lo correcto.</p>

<p>—No fue nada.</p>

<p>Como si hubiera hecho algo extraordinario para merecer tanta modestia... José se encontró mirando de forma irrespetuosa a su superior, y rápidamente apartó sus ojos apagados y dóciles en cuanto sus miradas se cruzaron de nuevo.</p>

<p>Inés seguía mirándolo, con el rostro aún lleno de esa amable sonrisa.</p>

<p><span style="font-style:italic">Tan diferente de los rumores...</span></p>

<p>Para José, cualquiera que le diera algo sabroso era fundamentalmente una buena persona. ¿Y qué hay de sus cálidas palabras?</p>

<p>Su prometida, que admiraba abiertamente a Cárcel le había contado una vez todo tipo de rumores sobre Inés, como si fuera una bruja, pero no se correspondían en absoluto con la hermosa esposa del superior que tenía ahora delante.</p>

<p>Y seguramente su prometida no era la única que difundía esos rumores. Los que conocían a Cárcel habían, al menos una vez, susurrado a sus espaldas sobre su inminente matrimonio con esa desafortunada cuervo.</p>

<p>Ya fuera por preocupación o por burla, el contenido era prácticamente el mismo, independientemente de la intención. ¿Cómo podía un tipo tan estupendo tener hijos con esa mujer tan sombría? ¿Cómo podía enfrentarse cada mañana a una mujer vestida de luto y masticar su comida? ¿Cómo podía vivir una vida asfixiante, perseguido de innumerables maneras durante el resto de sus días...?</p>

<p>Sin embargo, la Inés Escalante que tenía ante sí no era un cuervo sombrío; era una belleza, radiante con su vestido violeta pálido.</p>

<p>Si se hubieran encontrado a esa distancia durante el banquete, y ella hubiera permanecido soltera, preparándole personalmente una comida tan deliciosa y sonriéndole así... José sin duda habría sido incapaz de soportar la presión, y habría salido corriendo a la terraza para vomitar todo lo que había comido. O habría sospechado que se trataba de una estafa.</p>

<p>La única razón por la que no lo estaba haciendo ahora era gracias a la irritante y exasperada cara de Cárcel, que arrastraba la mente de José de vuelta al patio de armas.</p>

<p>—Perdona por llamarte mierdecilla, Almenara.</p>

<p>Y gracias a la serie de disculpas poco sinceras que siguieron.</p>

<p>—No, no pasa nada. Puede llamarme como siempre...</p>

<p>Aunque sincero, Cárcel frunció el ceño amenazadoramente. Desde luego, no parecía alguien que acabara de disculparse.</p>

<p>—Vaya, así que siempre has sido tan malditamente irrazonable... Gracias, Teniente. Gracias a usted, he podido comprender un poco mejor el comportamiento de mi esposo fuera de casa.</p>

<p>—Le darás una idea equivocada si hablas así, Inés. Tu elección de palabras sigue...</p>

<p>—¿Cómo llamas entonces al comportamiento fuera de casa? No importa, no es importante. José.</p>

<p>—... ¿Sí? ¿Sí?</p>

<p>—Supongo que a partir de ahora puedo llamarlo José, ¿no? Ya somos amigos.</p>

<p>Cárcel finalmente puso una expresión de total estupefacción. Miró a Inés con esa expresión y, cuando se volvió hacia José, su rostro parecía decir: “Si dices que sí, te las verás conmigo”.</p>

<p>¿Entonces debía decir que no? ¿Al superior de su superior... no, a su esposa...?</p>

<p>La jerarquía estaba ahora muy clara, incluso para los sencillos ojos de José, tan clara que rayaba en la crudeza.</p>

<p>¿Cómo podía esperar que él la desafiara cuando él mismo no podía hacerlo?</p>

<p>Y después de escuchar esa voz tan amable... ¿cómo podía hacerlo?</p>

<p>Volvió a ver el rostro afectuoso y amable de Inés. Esa compostura. Para José, que vivía instintivamente aplastado por Cárcel, le parecía casi milagroso.</p>

<p>Con unas pocas palabras, hizo que Cárcel Escalante pareciera el hombre más infantil del mundo, luego lo reprendió como a un niño, obligándolo a disculparse con su subordinado con su propia boca, sin mirar ni una sola vez la escultura que tenía a su lado.</p>

<p>¿Era posible que esos ojos ni siquiera vieran ese rostro esculpido?</p>

<p>Cárcel Escalante era, sin exagerar, una obra maestra divina. Incluso otros hombres, cuando Cárcel los miraba con esa cara engreída, como burlándose de ellos, a veces se quedaban sin palabras, y aunque solo los mirara en silencio, sentían su espíritu aplastado... A veces, los hombres lo miraban como hipnotizados, incapaces de creer que fuera humano. Era realmente un ser maravilloso, en el sentido más auténtico de la palabra.</p>

<p>Sin embargo, cuando Cárcel se plantaba ante ella, con la boca firmemente cerrada, mirándola con ese rostro magnífico, ella le decía que hablara. Y si tenía la boca abierta, le decía que la cerrara.</p>

<p>¿No era eso aún más magnífico...? De hecho, aún más cálido.</p>

<p>—Sí, sí... Por supuesto.</p>

<p>Primero se quedó atónito cuando Inés lo llamó por su nombre, y luego completamente nervioso cuando Cárcel lo miró. Para cuando decidió aceptar y asintió con la cabeza, ni siquiera se había dado cuenta de lo que había aceptado.</p>

<p>Pero Inés parecía bastante satisfecha con eso.</p>

<p>—Muy bien, José. Como Lugarteniente, probablemente irás y vendrás de la residencia con bastante frecuencia. Sin embargo, por alguna razón, desde que me casé, nunca he visto a ninguno de los colegas o subordinados de Cárcel ir y venir de la residencia. ¿Quizás todos se encuentran incómodos con mi presencia?</p>

<p>—Ah, eso también ocurría en la residencia anterior...</p>

<p>—¿La residencia anterior?</p>

<p>Aunque los instintos de José solían ser torpes, esta vez percibió la mirada gélida de Cárcel. Sin saber por qué, negó enérgicamente con la cabeza.</p>

<p>—Por un momento lo confundí con otro Capitán...</p>

<p>—¿Ah, sí? ¿Con quién?</p>

<p>—Señora, es solo que... ni siquiera recuerdo su nombre.</p>

<p>—Está confundido.</p>

<p>Cárcel fingió indiferencia, aunque no con más habilidad que José. Sin embargo, parecía natural, gracias exclusivamente a ese rostro diabólicamente atractivo.</p>

<p>Aun así, carecía de las cualidades de un estafador. ¿Debía considerarse afortunado por haber nacido como el hijo mayor de una familia tan distinguida como su aspecto, o era una suerte que Inés no pudiera ver ese rostro en ese momento...?</p>

<p>—Ya veo. Entonces, ¿no es por mí?</p>

<p>—No, en absoluto.</p>

<p>—Entonces, ¿por qué no encaja en la residencia? Es mi marido, pero no es nada torpe. Es bastante sociable y se lleva bien con la gente... Y, a juzgar por lo religiosamente que entrena, también debe de estar dedicado a la vida militar.</p>

<p>Sonaba como una señorita preguntando por qué su propio cachorro no se llevaba bien con el otro perro, como si le faltara algo.</p>

<p>¿Cómo debía responder a eso? Una vez más, la mirada de su superior, instándolo a manejarlo bien por su cuenta, le dificultaba encontrar su equilibrio.</p>

<p><span style="font-style:italic">¿Que no éramos nosotros los que no encajábamos, sino él el que no nos dejaba entrar? ¿Que los defectos de su marido eran más numerosos de lo que pensaba y que tampoco era especialmente sociable?</span></p>

<p>A los ojos de José, Cárcel en Calstera era experto en el comportamiento necesario, pero eso no lo convertía en una persona especialmente sociable. No tenía el más mínimo interés en los diversos entretenimientos a los que se entregaban los oficiales juntos en su puesto, ni en los eventos, a menos que fuera absolutamente necesario. Le importaban poco las fugaces relaciones que se establecían con las hijas de los oficiales superiores en diversas reuniones, ni las partidas de ajedrez de los fines de semana o las de billar que disfrutaban algunos después del servicio.</p>

<p>Simplemente entrenaba sin descanso, aunque nadie le ordenaba hacerlo. Solo necesitaba morir él mismo, no arrastrar a otros con él...</p>

<p>Todo lo que José había ganado durante el año y medio que ha pasado bajo su mando fue un físico aún más hinchado que en sus días de cadete. No habría pasado nada si solo hubiera crecido el músculo, pero la falta de resistencia significaba que la comida grasienta que se metía en la boca noche tras noche se había acumulado como volumen sin sentido junto al músculo.</p>

<p>Y últimamente, la situación solo había empeorado. Después de que Cárcel regresara a su puesto tras su matrimonio, comenzó a entrenar como un loco al amanecer, atormentándolo. Luego, en algún momento, dejó de hacerlo por las mañanas, pero le quitó las tardes. Hiciera lo que hiciera, su medio día libre se redujo a un cuarto de día.</p>

<p>Ah, había una cosa más que había ganado.</p>

<p>Ahora le quedaba un año sin un solo día libre. Todo gracias a la boda de alguien.</p>

<p>Aun así, Inés era una buena persona y, mirando atrás, parecía que había merecido la pena. <span style="font-style:italic">Recibir las disculpas de Cárcel Escalante antes de morir...</span> Pero José tenía que casarse antes de que acabara el año y, ante la realidad de que no podía conseguir ni un solo día libre más allá de sus vacaciones de boda, su prometida le enviaba cartas airadas a diario.</p>

<p>¿El motivo? Había agotado no solo sus vacaciones de verano, sino también las de invierno, para espiar la residencia Valeztena e incluso el castillo de Pérez...</p>

<p>Por aquella época, la expresión de José cambió a la de un criminal condenado.</p>

<p>Gracias a que su torpe ingenio lo había olvidado, había podido sentarse allí inocentemente, simplemente observando y esperando. Pero ahora que lo recordaba, ya no podía quedarse quieto, como un ladrón sorprendido in fraganti.</p>

<p>—Sí, por supuesto, el marido de la señora es perfecto, pero falta...</p>

<p>Murmuró, incapaz de soportar mirar a Inés a la cara. Sea como fuere, Inés murmuró con tristeza.</p>

<p>—La mesa de billar y el tablero de ajedrez no estaban ahí por nada, ¿verdad...?</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>Mientras Inés guiaba a José por la residencia, mostrándole esto y aquello, Cárcel permanecía en la terraza de la planta baja fumando un cigarro. Las luces repartidas por el jardín se entremezclaban con las de la terraza, proyectando un tenue resplandor sobre él.</p>

<p>En la penumbra, el humo se extendía difuminado, llevando consigo un aroma acre que iba y venía.</p>

<p>Fiel a su naturaleza militar, Cárcel disfrutaba de su rutina repetitiva. Aunque fumar un cigarro y beber una copa mientras contemplaba el mar nocturno desde la terraza no era nada especial, era su ritual habitual para relajarse. No veía ninguna razón para sacrificarlo por un invitado que apenas se sentía como tal.</p>

<p>Si algo, por pequeño que fuera, salía mal, sentía como si todo el día se desequilibrara. Por eso, aunque le gustaban sus vacaciones en Mendoza, no las disfrutaba especialmente, ya que los días allí eran de un tipo que escapaba a su control.</p>

<p>Estaba la familia Escalante, encabezada por la Emperatriz, y el Príncipe Heredero, a quien el Duque Escalante veneraba casi religiosamente...</p>

<p><span style="font-style:italic">... y luego estaba Inés Valeztena.</span></p>

<p>La tía de Cárcel, la Emperatriz Cayetana, había considerado a la sombría heredera Valeztena como una espina clavada en su costado cuando el joven Óscar no hacía más que seguir a Inés. Sin embargo, desde que se convirtió en la prometida de su sobrino, la miraba con otros ojos.</p>

<p>Inés, a quien había encontrado demasiado difícil de tragar para su propio hijo, pero demasiado preciosa para regalar, incapaz de dejarla ir ni de retenerla, ahora se había convertido en la prometida perfecta para su sobrino, y por lo tanto en suya.</p>

<p>Entonces no había nada de qué molestarse; solo quedaban los beneficios.</p>

<p>Los pequeños problemas de tratar con una mujer altiva no eran para su preciado hijo, sino para su rencoroso sobrino, que no dejaba de hacer que su hijo pareciera inadecuado. Cayetana estaba satisfecha y, en cambio, alardeaba de Inés.</p>
	
<p>Más precisamente, alardeaba de “la hija de Valeztena junto al heredero de Escalante”.</p>

<p>Su tía, Cayetana, era la ambición hecha persona. La mayor ambición que Escalante había producido jamás... Incluso su padre, que albergaba numerosos planes grandiosos, apenas podía seguirle el ritmo a su hermana. En términos de influencia, la influencia de Inés sobre él era incomparable.</p>

<p>Cayetana, preocupada por que una señorita de nacimiento igualmente distinguido pudiera brillar de repente tanto como ella en círculos inesperados, a pesar de que le había inquietado tanto el compromiso de Óscar e Inés, nunca habría tolerado que ella se convirtiera en parte de otra familia.</p>

<p>Incluso si eso significaba convertir en esposa de Óscar a ese “desagradable cuervo”...</p>

<p>Dado eso, ¿qué más se podía esperar? Tan pronto como Cárcel llegó a Mendoza de permiso, la Emperatriz le envió un calendario de compromisos oficiales a los que debía asistir con su prometida.</p>

<p>Aunque Inés rechazó la mayoría de las invitaciones, la convocatoria de la Emperatriz era algo que nunca podía rechazar. Para Cárcel, era simplemente una cuestión de cortesía básica.</p>

<p>Incluso en la mayoría de los compromisos que Inés rechazaba, él tenía que asistir para ocupar su asiento vacío. La mayor parte de sus preciadas vacaciones las pasó junto a ese lugar vacío. Entonces, si Inés decidía caprichosamente asistir en alguna ocasión, él la acompañaba, de pie junto a su aburrida prometida como un mero reposabrazos, un mero accesorio...</p>

<p>Según Cayetana, esto era precisamente la “alianza de Escalante y Valeztena”, el “apoyo del Duque Valeztena al Príncipe Heredero”, Una “advertencia al Duque Osorno y al Duque Ihar”, una “muestra de la mayor alianza entre los Grandes de Ortega” y un “artificio para informar al Duque Valeztena de que se trataba efectivamente de un caso sin vuelta atrás”... y así sucesivamente.</p>

<p>Parecía que estaba calculando locamente, asignando todo tipo de significados, pero tal vez Cayetana sabía que el Duque Valeztena tenía la intención de arrebatarle a su hija en la primera oportunidad.</p>

<p>Por lo tanto, debía de estar desesperada por grabar de alguna manera a Escalante en la frente de Inés.</p>

<p>La expresión de Inés, tan recatada que rayaba en lo sofocante, era en realidad una manifestación de la presión que la casa real y su familia ejercían sobre ella. “Necesitamos a esa chica, y como afortunadamente ella desea tu hermoso rostro, debes cerrar la boca y convertirte en su apoyo para levantar su brazo en la corte…” Al convertirse en el apoyo de Inés, todas las responsabilidades de la vida y la posición de heredera la siguieron desde una edad temprana. Incluso ahora, al reflexionar sobre ello, era una vida desgastada por ser zarandeada de aquí para allá.</p>

<p>Al recordar las vacaciones en Mendoza, le invadió el cansancio habitual. No le disgustaban las fiestas, pero la intromisión y la presión de la familia real, que le obligaba a asistir a todas las reuniones sin pareja durante todas las vacaciones, no podían ser más que una molestia.</p>

<p>Sin embargo, resistirse era aún más problemático. Esa disposición significaba que la vida militar nunca le había convenido. Dejarse llevar como si fuera algo natural para Inés era muy parecido...</p>

<p>Dio una calada profunda a su cigarro, observando a Inés salir al jardín con José.</p>

<p>A pesar de este temperamento, era innegablemente extraño. A diferencia de Mendoza, la sensación de dejarse llevar no era del todo desagradable.</p>

<p>En medio de todos los tediosos asuntos de Mendoza, sin duda había habido momentos en los que ese rostro, como la raíz misma del problema, había estado presente...</p>

<p>—Empezaremos por esta valla. Tendrán el muro de contención reparado en poco tiempo, medio día de trabajo.</p>

<p>—¿Medio día? ¿De verdad tan rápido?</p>

<p>—Sí, claro. Todavía está en construcción, así que me da un poco de vergüenza enseñárselo todo todavía.</p>

<p>Pero la fuente de los problemas de estos días era demasiado hermosa.</p>

<p>Cárcel miró con los ojos entrecerrados el sencillo vestido lavanda, una de las prendas más reveladoras de Inés, que dejaba al descubierto su clavícula, y exhaló lentamente el humo.</p>

<p>Hoy, las mangas ondeantes y su cabello negro trenzado holgadamente a un lado borraban como por arte de magia su característica impresión altiva, dejando solo un aspecto fresco e inocente. Sin embargo, Cárcel imaginaba lo contrario: un vestido como una fortaleza impenetrable, subido hasta la nuca.</p>

<p>La imaginaba lanzando una mirada árida a alguien, con las comisuras de los labios torcidas en cinismo.</p>

<p>Había sido su comportamiento habitual durante diecisiete años, pero últimamente no lo había visto en absoluto. Al recordar esa imagen sofocante sobre su rostro innecesariamente amable hacia José, sintió como de costumbre que se le cortaba la respiración y que la sangre se le subía a las partes bajas.</p>

<p><span style="font-style:italic">Ah, maldita sea.</span> ¿Qué demonios tenía de bueno estar envuelta tan escrupulosamente? Pero, maldita sea, era bueno. Era tan tentador que no podía soportarlo sin maldecir.</p>

<p>Solo imaginar esa figura tan envuelta de pies a cabeza, con solo unos pocos botones desabrochados para revelar la piel apenas visible en el escote, hacía que el Cárcel actual se excitara como un perro en celo.</p>

<p>El momento en que esa rigidez se desmoronaba, el momento en que esos ojos de acero se distorsionaban con el deseo, le oprimía la garganta.</p>

<p>El hecho de que ella no se vistiera así, no actuara así, le inquietaba a la inversa. Incluso él pensaba que era un pervertido. Ocupado desnudándola todos los días, pero inquieto porque ella no llevaba más ropa.</p>

<p>Además, cualquiera la encontraría mucho más encantadora en su estado actual... Incluso su mente, ahora reducida a la de un pervertido sin remedio, comprendía esa verdad.</p>

<p>Sin embargo, a veces, ciertas verdades llegan a la mente, pero no al corazón.</p>

<p><span style="font-style:italic">Desnuda, estaba desnuda; semidesnuda, estaba semidesnuda...</span> No es que eso no lo excitara. El problema, si es que era un problema, era que, hiciera lo que hiciera, acababa excitado. Vivir prácticamente en el campo de entrenamiento después de casarse era para evitar comportarse como un perro en celo con la noble Inés.</p>

<p>Si pudiera estar menos excitado, estaría agradecido. Mejor si estaba desnuda todas las noches, entonces... No, eso también lo excitaba.</p>

<p>Cárcel se desnudó y vistió a Inés en su mente, luego encendió un cigarro nuevo con una expresión aparentemente serena. Cuando Inés volvió a reírse a carcajadas de José, frunció el ceño brevemente antes de rebuscar en sus recuerdos.</p>

<p><span style="font-style:italic">Fue en el funeral de algún Conde, ¿no?</span> La imagen de ella con auténtico atuendo de luto le vino a la mente, irreverentemente. De repente, se le secó la garganta. En su mente, ya estaba saliendo a hurtadillas de la capilla durante la misa, levantándole la falda negra en el carruaje.</p>

<p>La voz despectiva y acusadora de Inés se vio ahogada por la suya. Su mentón altivamente levantado, sus ojos mirándolo con desprecio, lo aplastaban, haciendo que el deseo hirviera en su interior.</p>

<p>Y ese deseo pronto se volvió agresivo.</p>

<p>—... ¿Por qué ese bastardo no se va?</p>

<p>Había caído la noche y, al ver al oso de José aferrándose inconsciente, sintió que la irritación volvía a brotar.</p>

<p>Los días bajos y sucios en Calstera, cerca de los trópicos, eran interminablemente largos, y las noches eran imposiblemente cortas.</p>

<p>Y ese bastardo despistado estaba consumiendo esta corta noche...</p>

<p>—Bien, José. Tenemos pensado pintar esta parte superior de blanco. ¿Qué le parece?</p>

<p><span style="font-style:italic">¿En qué demonios estaba pensando?</span></p>

<p>—Ah, sí. Quedará muy bien.</p>

<p><span style="font-style:italic">¿Quién no diría eso?</span></p>

<p>—¿Verdad? Cálido y luminoso, y parece abierto. Sería prudente que el teniente discutiera varios asuntos con su prometida antes de la boda. Las habitaciones de la residencia son, en general, mucho más pequeñas que las de Mendoza, por lo que es importante hacer las maletas con cuidado y amueblar la casa en consecuencia. Cárcel no mostró tal consideración. Por supuesto, el Teniente es un hombre meticuloso, así que se las arreglará bastante bien.</p>

<p><span style="font-style:italic">Y una mierda...</span></p>
<p>—Si le dijera que hoy he visitado su residencia, se pondría muy contenta. Mi prometida es una gran admiradora...</p>

<p><span style="font-style:italic">¿Por qué rayos dice tantas tonterías inútiles?</span></p>

<p>—Ah, ¿la señorita es admiradora de Cárcel? Sería estupendo que viniera a Calstera y poder pasar tiempo en su compañía.</p>

<p>—Sí, yo también estoy deseando que llegue ese día... No es que me importe él.</p>

<p>Sin darse cuenta, José estaba acumulando más karma. <span style="font-style:italic">¿De qué demonios estaba presumiendo, parloteando así...?</span></p>

<p>—Vaya, vaya. Parece que Cárcel ha cometido muchos pecados.</p>

<p>—En absoluto, señora Escalante. Simplemente vivo pensando que es porque soy feo... No pasa nada.</p>

<p>—José, ¿de qué está hablando? Es guapo y está bien formado, con una figura estupenda.</p>

<p>Inés le dio una palmada en los hombros a José, que se habían encogido instantáneamente de forma lastimera, e inclinó la cabeza hacia atrás para mirarlo directamente a la cara. Aunque era alta para ser mujer, junto a la extraordinaria estatura de José parecía diminuta.</p>

<p>Ese José... Ninguna de sus absurdas trivialidades le había complacido jamás, pero aquella imagen le resultaba bastante divertida. Casi entrañable, incluso...</p>

<p>—Señora, no hace falta que diga cosas tan poco sinceras. No pasa nada... Mi cuerpo es así de grande y mi cabeza también...</p>

<p>—José, su aspecto me parece perfectamente equilibrado. Y lo digo sinceramente cuando digo que es bastante apuesto. Además, el simple hecho de estar al lado de alguien hace que su cara parezca más pequeña, ¿no es eso muy generoso?</p>

<p>—Incluso viniendo de alguien que conoce al Capitán Escalante de toda la vida...</p>

<p>—Y es así de masculino.</p>

<p>Hay que hablar con claridad. La masculinidad reside en este, mientras que aquel, si hay que ser pedante, pertenece al reino de las bestias salvajes.</p>

<p>—Pero, mirando en retrospectiva, la magnitud de la obra es mayor de lo previsto y ya ha adecuado varias zonas del interior... Desde que llegó a Calstera, ¿ha tenido un momento de descanso? No puedo entender cómo se las arregla para hacer todo esto solo.</p>

<p>—No he tenido ni un momento de descanso, pero no pasa nada. Es agradable ver cómo cambian las cosas con cada toque.</p>

<p>Después de pasar todo su tiempo en Calstera comiendo, jugando y descansando, de repente se había puesto a correr de un lado a otro como si hubiera comido algo en mal estado durante apenas una semana.</p>

<p>Cárcel observó a Inés responder a José con total descaro, sonriendo distraídamente antes de volver a ponerse serio para enfrentarse a José.</p>

<p>—Parece demasiado difícil para alguien de fuera. Mi prometida también va a renovar la residencia, y me preocupa qué hacer si se frustra y se enoja...</p>

<p>—Yo ayudaré a la señorita. Al fin y al cabo, sería bueno que las esposas se conocieran.</p>

<p>Ayudarla, conseguir que las esposas se conozcan... Últimamente, Inés había estado haciendo solo las cosas más comunes, hasta un punto casi inquietante.</p>

<p>Sin embargo, cada vez que oía esas palabras, no podía evitar sospechar que podría haber otro núcleo debajo de esa coraza.</p>

<p>Mientras pensaba perversamente que debería desnudarla completamente y examinarla en cuanto saliera de la casa, Cárcel dejó lentamente el cigarro.</p>

<p>La brisa marina avivó las brasas rojas y luego las apagó lentamente al soplar. Apagó completamente la colilla en el cuenco de cristal y miró fijamente al instigador de la noche.</p>

<p>Era hora de deshacerse de José.</p>

<p>—¿Sería tan amable? Tal y como están las cosas, las quejas por tener que venir hasta aquí por ese asunto sin importancia ya son más que normales...</p>

<p>—Eso es porque nunca ha estado en Calstera. Cambiará de opinión una vez que esté aquí. Este lugar tiene su propio encanto.</p>

<p>—Si pudiera acercarse a la señora Escalante, su actitud cambiaría por completo.</p>

<p>Sin embargo, por mucho que Inés hubiera reprimido su sociabilidad, era un nombre que nunca había perdido su prestigio en Mendoza.</p>

<p>Además, tras desaparecer de Mendoza tras aquella repentina transformación en la misa de boda, dejando a todos atónitos, si regresaba a Mendoza y daba testimonio de sus experiencias cercanas, la prometida de José vería sin duda cómo su reputación se disparaba.</p>

<p>Naturalmente, Cárcel no tenía ningún deseo de presenciar ese espectáculo.</p>

<p>—Gracias a José, yo también voy a ganar una íntima amiga. Espero que se casen pronto.</p>

<p>—Últimamente, al ver al Capitán Escalante, me encuentro pensando, como dicen los demás oficiales, que el matrimonio no es del todo malo... ¿Ve su expresión? Siempre ha sido bastante guapo, pero cada mañana parece tan alegre...</p>

<p>—¿Ah, sí?</p>

<p>Había apagado su cigarro con la intención de despedir a José inmediatamente, pero al verlo tartamudear torpemente con halagos, algo que no le pegaba nada, le pareció un esfuerzo bastante admirable y se quedó observándolos un momento.</p>

<p><span style="font-style:italic">¿De verdad había sido así?</span> Una ligera duda se apoderó de él, pero la descartó rápidamente.</p>

<p>—Sí. Gracias a eso, está aún más guapo, eso es seguro.</p>

<p>—Sería bastante problemático si se volviera más guapo de lo que ya es.</p>

<p><span style="font-style:italic">Eso era cierto.</span></p>

<p>—Es evidente que ha cambiado desde su matrimonio. Esto es lo que se llama una influencia positiva, ¿no? La influencia positiva de la señora Escalante sin duda está haciendo que el Capitán sea más guapo. Sí.</p>

<p>—Solo está diciendo toda esta adulación para complacerme, ¿no?</p>

<p>Inés descartó los torpes halagos de José con un gesto aún más ligero, como si fueran tonterías.</p>

<p>—No, señora, no son halagos en absoluto. En absoluto.</p>

<p>—Sí, sí. El matrimonio es algo bueno. José seguro que hará feliz a la señorita. Es un hombre sensible... Cuando se casen, no se olviden de invitarnos primero a la mansión.</p>

<p>—Sí, por supuesto.</p>

<p>—Ah, ¿se lo he dicho antes? Vamos a construir un invernadero de cristal allí. Pondremos unas cuantas mesas de juego dentro. Así, cuando vengan a visitarnos, podremos disfrutarlas juntos. ¿Le gusta el billar?</p>

<p>—Por supuesto que sí, pero ¿le gustaría al Capitán?</p>

<p>—Bueno, es mejor que jugar solo frente a una pared...</p>

<p>¿Habían llegado sus habilidades sociales a un punto irreversible con Inés? No estaba claro quién se preocupaba por las habilidades sociales de quién. Sin embargo, más que sentirse agraviado, a Cárcel le gustaba que ella se preocupara por sus defectos.</p>

<p>Era realmente un sentimiento inexplicable. Incluso si esa preocupación se manifestaba en la construcción de una sala de juegos para un niño...</p>

<p>—Parece que últimamente no han estado especialmente unidos, pero por favor José, hábleles a los oficiales. Probablemente lo hace porque sabe lo brillante que es. Debe de haber sido irritante, pero espero que lo entienda. Cárcel es realmente brillante, después de todo.</p>

<p>—Sí, lo sé. Sin duda vive para su propia brillantez...</p>

<p>José, en cualquier caso, tenía talento para ganarse a la gente con sus palabras.</p>

<p>Sin embargo, a Cárcel también le gustaba que Inés, incluso mientras lo criticaba, quisiera que los demás lo entendieran como si fuera suyo.</p>

<p>—Una vez que terminen las reparaciones, estaba pensando en invitar a los oficiales y a sus familias. Una cena modesta combinada con una fiesta del vino.</p>

<p>Aunque esto también era, en esencia, pedir a otros jóvenes que jugaran con su muchacho...</p>

<p>La constatación de que seguía perdiendo el momento de despedir a José le impulsó, al compás del reloj, pero se demoró un poco más para saborear la voz afectada de Inés.</p>

<p>—Teniente, haga todo lo posible para que asistan muchos. Si no es demasiado tarde, me gustaría llevarme bien con otros de sus colegas además de José.</p>

<p>—¿Quién se atrevería a rechazar la invitación de la señora Escalante? Los traeré a todos, sin excepción.</p>

<p>Como dijo José, nadie se atrevería a rechazar la invitación de Inés. Desde hacía mucho tiempo, todos estaban tan ansiosos como gorriones charlatanes, desesperados por atrapar aunque fuera un solo mechón de su cabello y cotillear sobre él. Y Cárcel hacía tiempo que había cortado sus emocionadas conversaciones sobre cuándo los invitaría a la mansión.</p>

<p>En medio de todo esto, resultaba bastante desagradable verlo gritar como si exigiera confianza exclusiva. Antes de que Inés pudiera soltar otra ronda de halagos insinceros hacia José, Cárcel lo ahuyentó. Estúpido, tonto, como si él tuviera algo que ver con eso...</p>

<p>La noche ya era demasiado corta para escuchar el aullido de un oso.</p>

<div class="separador">━━━━━━ ◦ ❖ ◦ ━━━━━━</div>

<p>Confirmado por el ayudante más cercano de Cárcel Escalante, se estableció lamentablemente que el alboroto se había limitado a Mendoza.</p>

<p>José Almenara era de los que vivían según el adagio infantil de que los mentirosos arderían en el fuego del infierno, y no era hombre de inventar falsedades sobre la esposa de su superior por el bien de este. A juzgar por su incapacidad para embellecer mucho su vida en Mendoza...</p>

<p>Inés relegó a un segundo plano la decepcionante velada, que había dado pocos frutos. El problema era que Cárcel nunca había tenido ningún contacto en Calstera donde pudiera haber conocido a una mujer.</p>

<p>No podía entender por qué no había participado en los diversos eventos sociales a los que había asistido con gusto en Mendoza.</p>

<p>El ascenso puede ser una cuestión de linaje, pero eso no significa que uno deba buscar deliberadamente el descontento de sus superiores. Además, las fiestas no eran lo suyo.</p>

<p>Cuando se enteró de que él había faltado a varios eventos militares que requerían la presencia de los cónyuges desde que ella había llegado a Calstera, le surgieron serias dudas sobre sus habilidades sociales allí.</p>

<p><span style="font-style:italic">...No, es demasiado pronto para decepcionarse.</span></p>

<p>¿Puntos en común? Si no los había, simplemente podía crearlos ella misma.</p>

<p>El único inconveniente era que Cárcel no había acumulado el nivel esperado de buena voluntad aquí, lo que significaba que tendría que forjar su propio camino. Pero si pudiera crear oportunidades para conocer mujeres, desplegaría sus alas y volvería a volar...</p>

<p>—... Estás bastante relajada, ¿no? Ahora estás atrapada, pero tu mente divaga en otra parte.</p>

<p>La sensación de unos labios chupando debajo de su barbilla, y luego mordiendo con fuerza su piel, hizo que su visión se iluminara de repente.</p>

<p>Recostada perezosamente en la cama, se había limitado a balancearse placenteramente con cada embestida de Cárcel, mirando vagamente al techo, pero ahora finalmente se volvió hacia él.</p>
<p>	Parecía que la había pillado medio soñando despierta, y se sintió bastante avergonzada. Y parecía que él también se había dado cuenta de su vergüenza, en su totalidad.</p>
	
<p>Ralentizó sus movimientos, entrecerrando sus hermosos ojos, y preguntó, con los labios aún pegados a su barbilla.</p>

<p>—¿En qué pensabas?</p>

<p>—En nada.</p>

<p>Como si esa respuesta no fuera satisfactoria, algo pasó por sus ojos azules. El ritmo que se había sentido tan fisiológicamente bueno desapareció, y aunque ella instintivamente lo siguió, tratando de mantener el ritmo mientras él se retiraba, Cárcel la sujetó por la cintura con una mano y la empujó fríamente.</p>

<p>Si hubiera sido capaz de seguirlo instintivamente, nunca se habría producido una estimulación tan cruel. Su pene, que se había retirado completamente de su interior hasta la punta del glande, volvió a penetrarla con un movimiento rápido antes de deslizarse lentamente hacia fuera de nuevo.</p>

<p>—Mentir está mal, Inés.</p>

<p>—Hmmg... Ah...</p>

<p>—Que tu cabeza y tu parte inferior actúen de forma independiente es peor.</p>

<p>—¡Ah...!</p>

<p>—Ah, parece explotación sexual.</p>

<p>Con expresión indiferente, discutió sobre la absurda vergüenza sexual mientras empujaba su pene profundamente dentro de ella, como si lo estuviera introduciendo a la fuerza. Era un ciclo implacable de penetración: apenas tragaba el grueso miembro antes de que se retirara completamente hasta el final, solo para volver a empujar con fuerza hasta el punto más profundo.</p>

<p>Aunque las profundidades donde Cárcel ya había eyaculado dos veces aceptaban y tragaban fácilmente sus largas embestidas con sonidos lascivos, la estimulación extrema era brutal para su clítoris, sensibilizado por múltiples clímax.</p>

<p>Su mente, lánguidamente estirada por los sucesivos actos sexuales, se despertó por la fuerza. Inés se retorció ligeramente debajo de él, sintiéndose un poco agraviada. Ya era la tercera vez... <span style="font-style:italic">¿o era la cuarta?</span> Fuera cual fuera el recuento, para su resistencia, el mero hecho de estar despierta a esas horas era un esfuerzo notable.</p>

<p>—Demasiado... demasiado profundo... Cárcel, solo un poco... hmmph, más superficial... Más como antes.</p>

<p>Inés le rodeó el cuello con los brazos y lo atrajo hacia ella, tratando de evitar la penetración excesivamente profunda.</p>

<p>Aunque su intención era obvia, como si alabara el intento en sí, Cárcel exhaló aire caliente como una risita en sus flexibles brazos y susurró.</p>

<p>—Dime en qué estabas pensando.</p>

<p>—No... pensaba... en nada.</p>

<p>—¿En Almenara?</p>

<p>Era cierto que había pensado en Almenara como parte del plan, e Inés casi soltó un “sí” sin pensar, pero antes de que las palabras salieran de sus labios, se encontró con la mirada de Cárcel de forma dramática. Era obvio que él no le estaba preguntando en el sentido que ella había pensado.</p>

<p>Cuando Inés dudó en responder, Cárcel le agarró el interior del muslo, presionando para abrirla más y empujando más profundamente.</p>

<p>Su cabeza, ya empujada más allá de la almohada por sus bruscas embestidas, se sacudió hacia arriba.</p>

<p>Empezaron las cosas aquí mismo, en medio de esta gran cama, pero me sentía ansiosa porque parecía a punto de caer. Aunque resentía a Cárcel, Inés movió su cuerpo, casi a regañadientes, más profundamente en la cama. Ya fuera porque él lo confundió con un intento de escapar, la fuerza que la empujó hacia atrás la devolvió inmediatamente a su lugar...</p>

<p>Pero pronto se vio obligada a olvidar por completo su posición en la cama. Esa abrumadora sensación de algo extraño, que primero se deslizaba completamente hacia fuera y luego volvía a entrar rápidamente, comenzó a llenarla rápidamente.</p>

<p>—Aún no he oído tu respuesta.</p>

<p>Ja, mientras su parte inferior se contraía repetidamente, su garganta se tensó al mismo tiempo, forzando un gemido ahogado. Entonces, bajo sus caderas enterradas en la suave cama, unas grandes manos la ahuecaron y levantaron ligeramente, y luego comenzaron a sostenerla completamente fuera de la cama, con la cintura suspendida en el aire para recibirlo.</p>

<p>Como burlándose de la idea de que no podía empujar más fuerte o más profundo, las manos que sostenían sus caderas abrieron ampliamente la hendidura cerrada y se sumergieron en ella.</p>

<p>Claramente haciéndolo como represalia, ella lo miró con ira, pero Cárcel sonrió descaradamente. Tan atónita por ello que se rió con él, sintió unos labios presionarse contra su oreja.</p>

<p>Inés sacudió la cabeza como si estuviera molesta y finalmente abrió la boca.</p>

<p>—¿Por qué, en medio de esto, ugh, estaría pensando en José?</p>

<p>—Almenara.</p>

<p>—¿…?</p>

<p>—Ese bastardo, ugh, lo único decente que tiene es su apellido, Almenara.</p>

<p>—Hmph…</p>

<p>—¿Qué tal si lo llamas por su apellido? ¿Eh?</p>

<p>Para Inés daba lo mismo que fuera José o Almenara, así que asintió con indiferencia. No podía empujarla aún más a la locura cuando ya estaba medio perdida. Su resistencia era limitada y él era simplemente demasiado en todo...</p>

<p>La forma en que Cárcel trataba a su ayudante no era asunto suyo. Lo mismo se aplicaba a sus relaciones con sus compañeros oficiales. Inés solo necesitaba pajaritos inofensivos que le susurraran al oído cada movimiento de Cárcel, ya fuera desde fuera o desde dentro.</p>

<p>Si los sirvientes de la mansión eran importantes como testigos, entonces los compañeros de Cárcel y sus familias serían las fuentes prácticas de información. No hacía falta lavarlos el cerebro para obtener información. Establecer relaciones adecuadas con las esposas de los oficiales resolvería naturalmente los asuntos.</p>

<p>Aunque los oficiales fueran reservados, sus círculos más cercanos no lo serían, y las mujeres tenían una inclinación natural a ayudarse entre sí.</p>

<p>Por ejemplo, se podía empezar con el dulce presagio del matrimonio, deslizando una frase como: “Todo esto es por el bien de la señora Escalante, así que, por favor, escúcheme sin malinterpretarme…”</p>

<p>Por supuesto, dada su afectividad pasada, era cierto que ella había llegado a pensar: “Sería bueno que se llevaran un poco mejor”. Por eso el prometido que había visto en Mendoza y el oficial naval de Calstera eran tan diferentes. Inés, sin darse cuenta, había olvidado que lo había tratado como a un cachorro abandonado y repugnante, y ahora lo miraba de nuevo con algo parecido al desprecio.</p>

<p>Aunque su rostro pareciera tan inhumano, en el fondo seguía siendo un hombre, incapaz de comprender que, en última instancia, eso también era por su propio bien. Por supuesto, sus motivos eran totalmente egoístas, pero también era un poco por Cárcel. No le haría daño...</p>

<p>¿Se consideraba el adulterio un defecto en Ortega? Solo se convertía en una desventaja si llegaba a los tribunales; socialmente, ni siquiera se consideraba un acontecimiento especial. ¿Qué rayos le pasaba a todos? Ni siquiera se divorciaban por algo tan trivial. Solo era cuestión de poder hacerlo si querían...</p>

<p>En una sociedad tan loca que un aristócrata que nunca cometió adulterio y se mantuvo fiel a su familia era considerado una reliquia anacrónica, ¿qué más se podía esperar?</p>

<p>Así que solo se trataba de explotarlo temporalmente antes de devolverlo a su antigua vida. A su orgullosa existencia. Hace una docena de años, ella incluso había contemplado la posibilidad de sacarle provecho de su pensión, pero él era fundamentalmente un colaborador dócil, por lo que hacía tiempo que había abandonado esa codicia excesiva.</p>

<p>En cuanto a ella, solo tenía que recuperar la dote que había traído consigo.</p>

<p>Para él, Inés no era más que una verruga que había aparecido y que volvería a desaparecer; en realidad, nada cambiaría. Además, en comparación con su vida original que rechazaba el matrimonio, nunca había recibido un título y al que se le había negado para siempre la condición de adulto, la libertad que recuperaría esta vez era nada menos que perfecta.</p>

<p><span style="font-style:italic">Más bien, es la vida evolucionando hacia una forma mejor.</span></p>

<p>Inés se tranquilizó en medio de la abrumadora oleada de deseo.</p>

<p>Su grandioso y sacrílego plan era, al fin y al cabo, bastante altruista. <span style="font-style:italic">Así que, por favor, ¿podrías dejar de interferir y quedarte quieto? </span>Como si leyera su mirada, él esbozó una sonrisa torcida y luego giró lentamente el pene que ya había introducido profundamente en ella mientras le agarraba el pecho.</p>

<p>Fuerte pero despistado... Echó a José, un talento precioso que podría haberle ayudado a pintar el gran cuadro juntos, como si fuera una alimaña. Rompió todos los lazos con las reuniones a las que ella habría asistido diligentemente si lo hubiera sabido... Y, sin embargo, sus palabras fueron una “consideración” para decirle que no se “molestara con asuntos triviales”.</p>

<p>Cárcel era el que no debería haberse molestado con asuntos triviales. Tampoco debería haber malgastado energías en sexo innecesario...</p>

<p>Al verlo abrazar con tanto fervor y devoción a una mujer que ni siquiera le gustaba como si fuera su esposa, estaba claro que necesitaba urgentemente recuperar su antigua libertad. Inés, con el ceño fruncido por la sensación de mareo que se apoderaba de ella, puso en marcha varios planes.</p>

<p>—Ahí vas de nuevo.</p>

<p>—No, no lo estoy haciendo...</p>

<p>Su lascivia era evidente mientras le chupaba el lóbulo de la oreja con fuerza, como si se tragara todo el pezón, una clara señal de que no la creía. Cada embestida enérgica desde abajo producía un sonido vulgar y húmedo, la mezcla de semen ya derramado y sus fluidos chapoteando y derramándose, lo que la excitaba aún más.</p>

<p>Pronto, Inés alcanzó el clímax, como si no pudiera aguantar más. Después de empujar con fuerza unas cuantas veces más en su cuerpo en éxtasis, Cárcel se derramó, tragándose una maldición en voz baja.</p>

<p>Su calor tibio se extendió por ella como ondas que se propagaban desde su interior. La conciencia a la que se aferraba con dificultad se deshilachó y se dispersó.</p>

document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("keydown", function(e) {
    if (
        (e.ctrlKey || e.metaKey) &&

let tamano = 18;

function cambiarFuente(fuente) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    contenido.style.fontFamily = '"' + fuente + '", serif';
    localStorage.setItem("fuenteLectura", fuente);
}

function cambiarTamano(valor) {
    const contenido = document.getElementById("contenido");
    if (!contenido) return;

    tamano += valor;

    if (tamano < 14) tamano = 14;
    if (tamano > 26) tamano = 26;

    contenido.style.fontSize = tamano + "px";
    localStorage.setItem("tamanoLectura", tamano);
}

function modoOscuro() {
    document.body.classList.toggle("oscuro");

    localStorage.setItem(
        "modoLectura",
        document.body.classList.contains("oscuro")
            ? "oscuro"
            : "claro"
    );
}

window.addEventListener("DOMContentLoaded", function() {

    const contenido = document.getElementById("contenido");
    const fuente = document.getElementById("fuente");

    if (!contenido || !fuente) return;

    const fuenteGuardada = localStorage.getItem("fuenteLectura");
    const tamanoGuardado = localStorage.getItem("tamanoLectura");
    const modoGuardado = localStorage.getItem("modoLectura");

    if (fuenteGuardada) {
        fuente.value = fuenteGuardada;
        cambiarFuente(fuenteGuardada);
    }

    if (tamanoGuardado) {
        tamano = parseInt(tamanoGuardado);
        contenido.style.fontSize = tamano + "px";
    }

    if (modoGuardado === "oscuro") {
        document.body.classList.add("oscuro");
    }
});

</script>
